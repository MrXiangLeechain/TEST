orks嵌入式操作系统只包括操作系统内核，不包括设备驱动程序","BSP中包含硬件相关的设备驱动程序","一种嵌入式操作系统的BSP不可能用于其他嵌入式操作系统","驱动程序是对硬件操作的抽象，以实现高层软件对硬件的访问"],"a":"A","e":"VxWorks嵌入式操作系统不仅包括操作系统内核，而且自带一些标准设备的驱动程序，所以A选项叙述错误；本题答案为A选项。","code":0},{"id":"2002","paper":"真考试卷32","no":34,"type":"单项选择题","q":"下列名词术语中，与嵌入式底层软件无关的是：","o":["BSP","Bootloader","U-Boot","VFS"],"a":"D","e":"BSP（板级支持包）、HAL（硬件抽象层）、Bootloader（引导加载程序）和U-Boot等都是嵌入式底层软件，而VFS（虚拟文件系统）在系统调用接口和内核所支持的文件系统之间提供了一个交换层，与嵌入式底层软件无关，所以本题答案为D选项。","code":0},{"id":"2003","paper":"真考试卷32","no":35,"type":"单项选择题","q":"下列关于实时操作系统的陈述中，不正确的是：","o":["实时调度机制的目标是在峰值负载条件下能满足所有任务的时限","任务切换时间包括保存当前运行任务上下文的时间、调度程序选中新任务的时间和恢复新任务上下文的时间","在实时操作系统中必须允许用户细粒度地控制任务的优先级","与任务切换和中断延迟时间有关的参数是衡量实时操作系统性能的最重要指标"],"a":"A","e":"实时调度机制的目标是在峰值负荷条件下至少保证强实时任务的时限，所以A选项叙述错误，本题答案为A选项。","code":0},{"id":"2004","paper":"真考试卷32","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，正确的是：","o":["RTEMS是软实时操作系统","eCos是商业嵌入式操作系统","RTEMS、Tornado和FreeRTOS都是免费嵌入式操作系统","系统空闲时，实时性高的操作系统和实时性较低的操作系统的性能有可能差异不大"],"a":"D","e":"RTEMS是硬实时操作系统，RTEMS、 eCOS、 FreeRTOS 等都是免费的嵌入式操作系统，Tornado是基于开发主机的集成开发环境，当系统空闲时，实时性高的操作系统和实时性较低的操作系统的性能大致相当；综上所述，D选项叙述正确，本题答案为D选项。","code":0},{"id":"2005","paper":"真考试卷32","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，不正确的是：","o":["用户必须在调用OSStart()启动多任务调度以后再开启时钟节拍器","μC/OS-II实时操作系统内核包含μC/FS文件系统、μC/GUI图形软件等模块","绝大多数μC/OS-II服务的执行时间与系统中运行的任务个数无关","如果任务在被挂起时正在等待延时，则挂起操作将被取消"],"a":"B","e":"μC/0S-II 只是实时操作系统内核，仅仅包含了任务调度、任务管理、时间管理、内存管理和任务间通信与同步等基本功能，没有提供输入输出管理、文件系统、 网络协议栈等额外的服务。 由于μC/ 0S- II 具有良好的可扩展性且源码公开，这些非核心功能可以由用户自主开发或集成。Micriμm 公司也提供独立模块供用户选择，如 μC/FS 文件系统模块、 μC/GUI 图形软件模块、μC/TCP-IP 协议栈模块、 μC/USB 协议栈模块等，所以B选项叙述错误，本题答案为B选项。","code":0},{"id":"2006","paper":"真考试卷32","no":38,"type":"单项选择题","q":"下列关于Linux操作系统的陈述中，不正确的是：","o":["Linux是多用户、多任务、支持多线程和多CPU的类Unix操作系统","Linux操作系统可以分为两个层次：上层运行在用户空间；下层运行在内核空间","MontaVista Linux采用抢占优先级内核技术，结合MontaVista自身的硬实时技术，具有更短的抢占延迟，性能远远高于通用Linux内核","Linux是由一系列应用程序、系统库和开发工具组合而成的操作系统"],"a":"D","e":"GNU 使用 Linux 作为 GNU 操作系统的内核，与 GNU项目已经发布的一系列应用程序、系统库和开发工具等组合成完整、 可用的操作系统，确切名称为GNU/Linux 操作系统，即基于 Linux 内核的 GNU 操作系统， 也称之为 \"Linux 操作系统”；所以D选项叙述错误，本题答案为D选项。","code":0},{"id":"2007","paper":"真考试卷32","no":39,"type":"单项选择题","q":"在下面列出的命令中，若要编译后生成test.c对应的汇编程序，哪条命令是合适的。（注：目标平台硬件是以S3C2410芯片为核心，软件平台为Linux）。","o":["arm-linux-gcc -g -o test test.c","arm-linux-gcc -S test.c","arm-linux-gcc -c test.c","arm-linux-gcc -o test test.c"],"a":"B","e":"A选项中该命令中加入了参数-g、-o test，执行该命令后，会生成一个包含调试信息的可执行文件test；B选项中该命令中加入了参数-S，执行该命令后，生成汇编代码，而不是编译成最终的可执行文件；C选项中该命令中加入了参数-c ，执行该命令后，会对源文件进行编译，生成后缀名为.o的目标文件；D选项中该命令中加入了参数-o test  会生成一个名为test的可执行文件；综上所述，B选项符合题意，本题答案为B选项。","code":0},{"id":"2008","paper":"真考试卷32","no":40,"type":"单项选择题","q":"下面有关嵌入式系统的开发特点描述语句中，错误的是。","o":["需要固化程序，即把软件代码烧写到非易失性存储器中。","应用软件必须基于嵌入式操作系统平台上来开发。","需要使用宿主机-目标机的开发架构。","通常软件开发中的任务涉及许多对底层硬件进行控制的程序。"],"a":"B","e":"在低端嵌入式系统中，处理器的处理能力较低，存储器容量很小，系统功能简单，通常只实现一些简单的控制操作。 这种嵌入式系统不需要操作系统支持，应用软件直接在裸机上运行，所以应用软件不是必须基于嵌入式操作系统平台上来开发，B选项叙述错误，本题答案为B选项。","code":0},{"id":"2030","paper":"真考试卷33","no":1,"type":"单项选择题","q":"关于嵌入式系统的描述以下说法错误的是：","o":["嵌入式系统是嵌入式计算机系统的简称","嵌入式系统是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统","嵌入式系统是控制、监视或协助设备、机器、工厂运行的装置","笔记本电脑是典型的嵌入式系统"],"a":"D","e":"笔记本电脑是通用型计算机，它具有完整的计算机系统架构，能够运行多种不同类型的软件，满足各种不同的应用需求，而不是为特定的单一应用而设计的，不属于嵌入式系统。D选项叙述错误，故本题答案为D选项。","code":0},{"id":"2031","paper":"真考试卷33","no":2,"type":"单项选择题","q":"关于嵌入式系统的应用，以下说法错误的是：","o":["嵌入式系统可以应用到不同行业","嵌入式系统在应用数量上还远不如通用计算机系统","汽车中使用的嵌入式系统有两类，一类是电子控制装置，一类是车载电子装置","共享单车智能锁是一种嵌入式系统应用"],"a":"B","e":"嵌入式系统在现代生活中无处不在，从智能家居设备、智能手机、汽车电子到工业控制等各个领域都有大量应用，其应用数量远远超过通用计算机系统，B选项叙述错误，故本题答案为B选项。","code":0},{"id":"2032","paper":"真考试卷33","no":3,"type":"单项选择题","q":"嵌入式系统的性能主要取决于CPU,而与CPU的性能相关的有：\n①主频  \n②指令系统   \n③Cache容量     \n④Cache结构 \n⑤逻辑结构 \n⑥ I/O接口  \n⑦片上外设  \n⑧Flash大小","o":["①②③④⑤","①②③⑤⑥","①② ④⑤⑦","①②③⑤⑧"],"a":"A","e":"主频影响运算速度，指令系统决定操作类型与效率，Cache 容量和结构关乎数据访问效率，逻辑结构决定运算能力，这些都与 CPU 性能紧密相关。而I/O 接口、片上外设、Flash 大小并非直接关联 CPU 性能 。故本题答案为A选项","code":1},{"id":"2033","paper":"真考试卷33","no":4,"type":"单项选择题","q":"关于存储器，以下说法错误的是：","o":["存储器可分为易失性存储器和非易失性存储器","DRAM速度比SRAM慢","EPROM是只读存储器","Flash存储器只能读,不能在线改写"],"a":"D","e":"Flash 存储器是一种非易失性存储器，它不仅能读，还能在线改写，常被用于存储需要频繁更新的数据，如嵌入式系统中的程序代码和配置信息等。选项D叙述错误，故本题答案为D选项。","code":0},{"id":"2034","paper":"真考试卷33","no":5,"type":"单项选择题","q":"下列关于ASCII字符集的描述中，不正确的是：","o":["基本的ASCII字符集中包括阿拉伯数字和控制字符","基本的ASCII字符集中包括注音符号和标点符号","基本的ASCII字符集中包括常用的拉丁字母和阿拉伯数字","基本的ASCII字符集中包括标点符号和常用的拉丁字母"],"a":"B","e":"基本的ASCII 字符集共有 128 个字符，包括 96 个可打印字符（常用的拉丁字母、 阿拉伯数字、标点符号等） 和32个控制字符，并没有注音符号，B选项叙述错误，本题答案为B选项。","code":0},{"id":"2035","paper":"真考试卷33","no":6,"type":"单项选择题","q":"下列各项中，支持动画效果的图像文件格式是：","o":["html","JPEG","GIF","BMP"],"a":"C","e":"GIF 图像文件格式支持动画效果，它可以通过将多幅图像合并成一个文件，并按照一定的顺序和时间间隔进行播放，从而实现简单的动画效果。而HTML是超文本标记语言，不是图像文件格式；JPEG 和 BMP 主要用于静态图像的存储，不支持动画效果；故本题答案为C选项。","code":0},{"id":"2036","paper":"真考试卷33","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，正确的是：","o":["pdf是一种无损压缩的音频文件格式","音乐的取样频率范围通常在40kHz以下","电话数字语音的频率范围是20~20000Hz","MP3是一种有损压缩的音频文件格式"],"a":"D","e":"PDF 是便携式文档格式，主要用于文档的存储和传输，不是音频文件格式， A选项叙述错误；音乐的取样频率通常在 40kHz 以上，常见的 CD 音频取样频率为 44.1kHz，B选项叙述错误；电话数字语音的频率范围通常是 300 - 3400Hz，人耳能听到的声音频率范围是20 - 20000Hz， C选项叙述错误；MP3 是一种有损压缩的音频文件格式，D选项叙述正确；故本题答案为D选项。","code":0},{"id":"2037","paper":"真考试卷33","no":8,"type":"单项选择题","q":"下面是关于有线通信中使用的传输介质光纤的叙述，其中错误的是：","o":["除单芯光纤外，还有多芯光纤","光纤具有通信容量大的优点","光纤具有传输距离远的优点","光纤的缺点是易受高压线及雷电等电磁感应的影响"],"a":"D","e":"光纤利用光在玻璃或塑料制成的纤维中传输信号，具有绝缘性好、不受电磁干扰的优点，而不是易受高压线及雷电等电磁感应的影响；D选项叙述错误，故本题答案为D选项。","code":0},{"id":"2038","paper":"真考试卷33","no":9,"type":"单项选择题","q":"以下说法错误的是：","o":["按照存储结构划分，处理器可分为冯.诺依曼结构和哈佛结构","所有ARM处理器都是哈佛结构","RISC是精简指令集结构","CISC是复杂指令集结构"],"a":"B","e":"虽然ARM 处理器大多采用哈佛结构，但并非所有ARM 处理器都是哈佛结构，早期一些ARM 处理器采用冯?诺依曼结构；B选项叙述错误，故本题答案为B选项。","code":0},{"id":"2039","paper":"真考试卷33","no":10,"type":"单项选择题","q":"以下最适合设计手机应用的处理器是：","o":["ARM Cortex-M0","ARM Cortex-M3","ARM Cortex-A57","ARM Cortex-R5"],"a":"C","e":"ARM Cortex - M0 是面向低成本、低功耗的微控制器应用而设计的，主要用于一些简单的控制任务，如小型家电、传感器节点等；ARM Cortex - M3 主要用于实时控制领域，如工业控制、汽车电子等；ARM Cortex - A57 是面向高端移动计算和服务器应用的处理器核心，具有较高的性能和处理能力，能够支持复杂的操作系统和丰富的应用程序，适合用于设计手机应用，能够满足手机对高性能计算、图形处理以及多任务处理等方面的要求；ARM Cortex - R5 主要用于实时性要求较高的嵌入式系统，如汽车动力系统、航空航天等领域等；综上所述，本题答案为C选项。","code":0},{"id":"2040","paper":"真考试卷33","no":11,"type":"单项选择题","q":"关于ARM处理器工作状态，以下说法错误的是：","o":["处理器复位后自动进入Thumb工作状态","ARM状态为32位指令状态，所有指令编码为4个字节","Thumb状态为16位指令状态，所有指令编码为2个字节","Thumb-2状态为32位和16位混合状态，有的指令采用32位编码，有的采用16位编码"],"a":"A","e":"处理器复位后自动进入 ARM 工作状态，而不是 Thumb 工作状态；A选项叙述错误，故本题答案为A选项。","code":0},{"id":"2041","paper":"真考试卷33","no":12,"type":"单项选择题","q":"以下关于NVIC的说法正确的是：","o":["NVIC是非快速中断控制器的英文缩写","NVIC是嵌套向量中断控制器的英文缩写","NVIC是唤醒中断控制器的英文缩写","NVIC是修补及断点单元的英文缩写"],"a":"B","e":"NVIC 是 Nested Vectored Interrupt Controller 的英文缩写，即嵌套向量中断控制器，它是ARM Cortex - M 系列处理器中用于管理中断的重要部件，负责中断的使能、屏蔽、优先级设置以及中断向量的管理等功能；故本题答案为B选项。","code":0},{"id":"2042","paper":"真考试卷33","no":13,"type":"单项选择题","q":"ARM处理器数据存储器地址及数据的关系如表1所示，R1=0,R2=0;处理器依次执行LDR R2,=0x21001000和LDR R1,[R2]指令后，\n如果R1=0xA1B2C3D4,则以下说法正确的是：\n①ARM处理器工作在小端存储模式  \n②ARM处理器工作在大端存储模式\n③R1=0      \n④R2=0x21001000     \n⑤存储器中的数据不变","o":["①③④","②③④","①④⑤","②③⑤"],"a":"C","e":"在小端存储模式下，低地址存放数据的低字节，高地址存放数据的高字节，在大端存储模式下，高地址存放数据的低字节，低地址存放数据的高字节；已知读取到 R1 = 0xA1B2C3D4 ，从表中地址 0x21001000 开始，若为小端模式，依次读取 0xD4（0x21001000 地址处）、0xC3（0x21001001 地址处）、0xB2（0x21001002 地址处）、0xA1（0x21001003 地址处） ，正好组成 0xA1B2C3D4 ，所以 ARM 处理器工作在小端存储模式；执行上述两条指令后，R1 被赋值为从内存读取的数据 0xA1B2C3D4 ，R2 为 0x21001000 ，存储器中的数据不会因为这两条读指令而改变；综上所述，本题答案为C选项。","code":1},{"id":"2043","paper":"真考试卷33","no":14,"type":"单项选择题","q":"在数据存储器中地址与数据的关系如表1所示，小端模式下有以下指令序列： \n\n\n        LDR R8,=0x29000000\n        LDRB R9,[R8],#1\n        CMP R9,#75\n        BEQ  L0\n        ORR R9,R9,#0xA1A2A3A4\nL0       STRB R9,[R8]           \n以下说法正确的是：\n①内存中的值不变                  \n②内存中的值改变  \n③0x29000001中的值为0xF5        \n④0x29000000中的值为0xA4\n⑤0x29000001中的值为0x75      \n⑥0x29000000中的值为0x00","o":["①⑥","①⑤","②③","②④"],"a":"C","e":"第一条指令是将地址 0x29000000 加载到寄存器 R8 中；\n第二条指令是从 R8 指向的地址（0x29000000 ）读取一个字节数据到 R9 ，然后 R8 自增 1（变为 0x29000001 ） ，在小端模式下，从表中可知 0x29000000 地址处的数据为 75H ，所以 R9 读取到的值为 0x75；\n第三条指令是比较R9与75 （十六进制为 0x4B ），实际上 R9 = 0x75 ，这里比较不相等；\n第四条指令因为第三条指令比较结果不相等，所以不跳转到 L0 处，而是继续执行下一条指令；\n第五条指令是将 R9 的值与 0xA1A2A3A4 进行按位或操作，结果存回 R9。此时 R9 的值变为 0xA1A2A3A4 | 0x75 = 0xA1A2A3F5；\n第六条指令是将 R9 的低 8 位（即 0xF5）存储到 R8 指向的地址 0x29000001 中；\n综上所述，②③说法正确，本题答案为C选项。","code":1},{"id":"2044","paper":"真考试卷33","no":15,"type":"单项选择题","q":"若读取4个字节数据，内存地址由R4+4指示，读出的数据存放在R5中，读取完毕，地址自动更新，正确的指令为：","o":["LDR R5，[R4,#4]","LDR R5，[R4,#4]!","LDR R5，[R4],#4","LDRD R5，[R4,#4]"],"a":"B","e":"A选项的指令可以实现从R4 + 4所指向的内存地址读取一个字（也就是 4 个字节）的数据存放在R5中，但地址不会更新；B选项的指令从R4 + 4所指向的内存地址读取一个字（也就是 4 个字节）的数据存放在R5中，同时把R4 + 4的结果写回到R4，实现地址的自动更新；C选项的指令从R4所指向的内存地址读取一个字（也就是 4 个字节）的数据存放在R5中，同时实现地址的自动更新；D选项LDRD指令用于读取双字（8 个字节）数据，并非题目要求的 4 个字节；综上所述，本题答案为B选项。","code":0},{"id":"2045","paper":"真考试卷33","no":16,"type":"单项选择题","q":"对于BLS  Lable指令，以下说法正确的是：","o":["如果无符号数据比较的结果小于或等于，则转移到Lable执行指令","如果有符号数据比较的结果大于或等于，则转移到Lable执行指令","如果为正数，转移到Lable执行指令","如果有符号数据比较的结果小于，则转移到Lable执行指令"],"a":"A","e":"BLS是无符号数比较指令，用于比较两个无符号数的大小关系；那么BLS  Lable指令是当无符号数据比较的结果小于或等于时，会转移到 Lable 处执行指令；故本题答案为A选项。","code":0},{"id":"2046","paper":"真考试卷33","no":17,"type":"单项选择题","q":"把R1中的值除以4，存放到R0中，以下指令正确的是：","o":["MOV R0，R1，LSL#1","MOV R0，R1，LSL#2","MOV R0，R1，LSR#1","MOV R0，R1，LSR#2"],"a":"D","e":"A选项的指令是将R1的值左移一位（相当于乘以 2）存放到R0中，\nB选项的指令是将R1的值左移两位（相当于乘以4）存放到R0中，\nC选项的指令是将R1的值右移一位（相当于除以2）存放到R0中，\nD选项的指令是将R1的值右移两位（相当于除以4）存放到R0中；\n综上所述，D选项的指令符合题意，故本题答案为D选项。","code":0},{"id":"2047","paper":"真考试卷33","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下,已知R0=0x2900000A，R1=0x20011260 ,R5=0, 如表1所示的数据存储，则依次执行以下指令： \n\n    LDR R3,[R0]\n    LDR R4,[R1]\n    ADDS R5,R3,R4\n指令序列执行后，以下说明正确的是：\n①R3中的值为0xFFFF0001\n②R3中的值为0x0100FFFF\n③R4中的值为0x01007000\n④R4中的值为0xFFFF0000\n⑤R5中的值为0x00FF7001\n⑥进位标志C=0\n⑦进位标志C=1","o":["①③⑤⑥","②④⑤⑥","②③⑤⑥","①③⑤⑦"],"a":"D","e":"第一条指令从R0所指示的内存地址读取一字存储到R3中，根据表1在小端模式下，R3=0xFFFF0001；\n第二条指令从R1所指示的内存地址读取一字存储到R4中，根据表1在小端模式下，R4=0x01007000\n第三条指令将R3和R4的值相加存储到R5中，即1111 1111 1111 1111 0000 0000 0000 0001+0000 0001 0000 0000 0111 0000 0000 0000=1 0000 0000 0000 0000 0111 0000 0000 0001，\n又因为ARM架构中进位标志（C）的定义，在无符号数加法运算中，当最高有效位（第31位）产生进位时，C会被置1，否则为0，R3和R4相加的结果超过了最高有效位，所以进位标志C=1；综上所述，①③⑤⑦说法正确，故本题答案为D选项。","code":1},{"id":"2048","paper":"真考试卷33","no":19,"type":"单项选择题","q":"为使嵌入式处理器能够正常工作必须为其提供必要的条件，下面相关的叙述中，错误的是：","o":["必须给处理器芯片供电","必须给处理器芯片提供时钟信号","必须给处理器芯片提供复位信号","必须为处理器芯片外扩程序存储器"],"a":"D","e":"嵌入式处理器正常工作需供电、时钟信号与复位信号，但并非都要外扩程序存储器，部分处理器内部集成了足够程序存储单元，可直接在内部存储运行程序；D选项叙述错误，故本题答案为D选项。","code":0},{"id":"2049","paper":"真考试卷33","no":20,"type":"单项选择题","q":"下面的选项中，不属于嵌入式处理芯片的互联通信组件的选项是：","o":["PWM","UART","SPI","USB"],"a":"A","e":"PWM（脉冲宽度调制）主要用于控制信号的占空比，以实现对电机调速、灯光亮度调节等功能，不属于互联通信组件。而UART、SPI、USB 均是用于芯片与外部设备或其他芯片进行通信的接口；故本题答案为A选项。","code":0},{"id":"2050","paper":"真考试卷33","no":21,"type":"单项选择题","q":"下面是关于嵌入式系统的存储器的叙述，其中错误的是：","o":["嵌入式处理芯片内部L1/L2 Cache采用SRAM","嵌入式系统的主存储器可采用SRAM、DRAM或Flash ROM","U盘或SD卡等可用作嵌入式系统的外部存储器","总体而言，嵌入式系统存储器层次结构中的L1/L2 Cache、主存储器和外部存储器这3个层次的存储器的存取速度基本相同"],"a":"D","e":"嵌入式系统存储器层次结构中的L1/L2 Cache 速度最快，主存储器次之，外部存储器最慢，存取速度不同；D选项叙述错误，故本题答案为D选项。","code":0},{"id":"2051","paper":"真考试卷33","no":22,"type":"单项选择题","q":"嵌入式系统使用的存储器以半导体存储器为主，随着技术的发展，出现了多种新型存储器，下面列出的存储器选项中，不属于半导体存储器的选项是：","o":["NAND Flash","NOR Flash","FRAM","DDR3 SDRAM"],"a":"C","e":"NAND Flash 是一种闪存类型的半导体存储器，NOR Flash 是一种半导体闪存，DDR3 SDRAM 是双倍数据速率三代同步动态随机存取存储器，是一种常见的半导体存储器；而FRAM（铁电随机存取存储器）是利用铁电材料的铁电效应来实现数据存储的，它不属于半导体存储器，故本题答案为C选项。","code":0},{"id":"2052","paper":"真考试卷33","no":23,"type":"单项选择题","q":"下面是关于I2C总线的叙述，其中错误的是：","o":["数据传送时每次传送的字节数目不能超过8个","为了完成一个字节的传送，接收方应该发送一个确认信号（即ACK）给发送方","I²C总线属于多主总线，总线上连接的器件有时会同时竞争总线的控制权，为此需要有仲裁机制","传输操作启动后主控器件传输的第一个字节是地址"],"a":"A","e":"I2C 总线数据传送时每次传送的字节数目没有限制，仅受限于总线的最大传输数据量和设备的内存空间等因素；A选项叙述错误，故本题答案为A选项。","code":0},{"id":"2053","paper":"真考试卷33","no":24,"type":"单项选择题","q":"下面是关于嵌入式处理芯片中UART的叙述，其中错误的是：","o":["UART以起始位作为信息传输的开始","UART以停止位作为信息传输的结束，停止位可以是1位、1.5位和2位","UART一次传输的数据位固定为一个字节（即8位）","有的嵌入式处理芯片内部有多个UART"],"a":"C","e":"UART 一次传输的数据位可以是 5 位、6 位、7 位或 8 位等，不是固定为一个字节（8 位）；C选项叙述错误，故本题答案为C选项。","code":0},{"id":"2054","paper":"真考试卷33","no":25,"type":"单项选择题","q":"下面是关于触摸屏的叙述，其中错误的是：","o":["电阻式触摸屏将屏的矩形区域中的触摸点（X，Y）的物理位置转换为代表X坐标和Y坐标的电压","可以采用专用的电阻式触摸屏芯片来实现嵌入式系统中的电阻式触摸屏接口","当触摸电容式触摸屏时，手指从接触点吸走从触摸屏四个角上的电极中流出的电流","电容式触摸屏俗称软屏"],"a":"D","e":"电容式触摸屏俗称 “硬屏”，是电阻式触摸屏因其结构特点，相对较软，常被称为 “软屏”；D选项叙述错误，故本题答案为D选项。","code":0},{"id":"2055","paper":"真考试卷33","no":26,"type":"单项选择题","q":"S3C2410与LED数码管的接口如下图所示。下面是关于该图的叙述，其中错误的是：","o":["为使数码管显示内容稳定，S3C2410的DATA7~DATA0的逻辑状态不能改变","为使数码管显示字符“A”，应使8Q~1Q=0x88","图中的74HC573能为数码管中的各段LED提供驱动电流","在一定范围内调节图中右上角的电阻R可以在一定范围内调整LED数码管的显示亮度"],"a":"A","e":"图中74HC573 是锁存器，当数据经 CLK 锁存后，即使 S3C2410 的 DATA7~DATA0 逻辑状态改变，只要锁存器保持状态，数码管显示内容依然稳定，A选项叙述错误；从图中可以看出LED的公共端接电源正极（VCC），那么该LED数码管为共阳接法，需点亮段a、b、c、e、f、g（低电平有效），则二进制应为 1000 1000（十六进制是0x88），B选项叙述正确；74HC573 具有驱动能力，能够为数码管各段 LED 提供驱动电流，C选项叙述正确；电阻 R 与 LED 串联，调节 R 阻值可改变流经 LED 的电流，从而在一定范围内调整显示亮度，D选项叙述正确；综上所述，本题答案为A选项。","code":0},{"id":"2056","paper":"真考试卷33","no":27,"type":"单项选择题","q":"下面是关于SPI的叙述，其中错误的是：","o":["SPI是一种同步串行通信接口","SPI一般使用4条信号线","SPI只能实现半双工串行通信","将数据写到SPI发送缓冲区后，在时钟信号SCK控制下，一位一位按位传输"],"a":"C","e":"SPI是同步串行通信接口，一般使用 4 条信号线，即时钟线 SCK、主机输出 / 从机输入线 MOSI、主机输入 / 从机输出线 MISO、从机选择线 SS（或 CS）；SPI 支持全双工串行通信，MOSI 和 MISO 两条线可同时双向传输数据，并非只能实现半双工串行通信，SPI 将数据写入发送缓冲区后，在时钟信号 SCK 控制下逐位传输；综上所述，C选项叙述错误，故本题答案为C选项。","code":0},{"id":"2057","paper":"真考试卷33","no":28,"type":"单项选择题","q":"下面是关于S3C2410的叙述，其中错误的是：","o":["S3C2410内部具有分离的指令Cache和数据Cache","S3C2410内部具有USB主控制器","S3C2410内部具有以太网接口","S3C2410内部具有一个以上的UART"],"a":"C","e":"S3C2410 内部没有内置以太网接口，若要实现以太网功能需外接以太网芯片（如AX88796等）,C选项叙述错误，故本题答案为C选项。","code":0},{"id":"2058","paper":"真考试卷33","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件的描述中，不正确的是：","o":["选择嵌入式系统软件结构的一个基本原则是：确保软件架构可扩展性强，以适应可能的需求变化","系统软件、应用软件与系统的硬件一体化，相互关系密切","最简单的软件结构是轮询结构","中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件"],"a":"A","e":"选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构；A选项叙述错误，故本题答案为A选项。","code":0},{"id":"2059","paper":"真考试卷33","no":30,"type":"单项选择题","q":"下列关于BSP功能的描述中，正确的是：","o":["BSP又称为UBoot","虽然不同OS的BSP的组织结构不同，但向上层提供的功能以及服务接口定义都相同","系统上电复位之后由BSP设置中断向量表配置","可以借助操作系统的调试工具调试BSP"],"a":"C","e":"BSP即板级支持包，它是针对特定硬件平台的一系列软件集合，而U- Boot 是一个规模庞大的开源 bootloader 软件，A选项叙述错误；因为不同的操作系统有不同的设计理念、架构和功能需求，所以不同的操作系统（OS）所对应的 BSP 组织结构和向上层提供的功能及服务接口定义通常是不同的，B选项叙述错误；系统上电复位之后由BSP设置中断向量表配置，C选项叙述正确；在 BSP 执行阶段，操作系统尚未正常运行，所以无法借助操作系统的调试工具来调试 BSP。一般调试 BSP 需要使用专门的硬件调试工具，如 JTAG 调试器等，D选项叙述错误；综上所述，本题答案为D选项。","code":0},{"id":"2060","paper":"真考试卷33","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的陈述中，正确的是：","o":["在同一硬件平台上支持不同嵌入式操作系统的BSP的组织结构、向上层提供的功能以及服务接口定义都相同","硬件抽象层可以被看作是板级支持包在特定操作系统环境下的具体实现","BSP中包含的硬件相关的设备驱动程序直接由BSP使用","开发全新BSP通常以操作系统厂商提供的BSP模板为依据"],"a":"D","e":"不同嵌入式操作系统特性不同，同一硬件平台上支持它们的 BSP 组织结构、功能及接口定义会有差异，A选项叙述错误；硬件抽象层是板级支持包的组成部分，而非板级支持包在特定OS下的实现，B选项叙述错误；BSP中的驱动程序通常由操作系统内核或应用程序调用，而非BSP自身直接使用，C选项叙述错误；BSP开发高度依赖操作系统厂商提供的模板，以降低移植成本，D选项叙述正确；综上所述，本题答案为D选项。","code":0},{"id":"2061","paper":"真考试卷33","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["某些bootloader能支持多种体系结构的处理器，一套二进制代码可以轻松支持不同体系结构的硬件平台","如果在RAM中运行操作系统代码，则不需要在系统启动之前将嵌入式操作系统的映象烧录到非易失存储介质中","bootROM是用来存储bootloader程序的非易失存储器","bootloader的代码通常都用汇编语言实现，以便实现操作系统加载的功能"],"a":"C","e":"不同体系结构的处理器，其指令集、寄存器等硬件特性差异很大，一套二进制代码是基于特定的指令集和硬件架构编译生成的，无法轻松支持不同体系结构的硬件平台，A选项叙述错误；因为系统上电后，RAM 中是没有内容的，需要从非易失存储介质（如 Flash）中读取操作系统映象到 RAM 中，然后才能在 RAM 中运行，所以在 RAM 中运行操作系统代码，在系统启动之前也需要将嵌入式操作系统的映象烧录到非易失存储介质中，B选项叙述错误；bootROM 是一种非易失性存储器，通常用来存储 bootloader 程序的全部，C选项叙述正确；bootloader 的代码通常是汇编语言和 C 语言混合实现的，D选项叙述错误；综上所述，本题答案为C选项。","code":0},{"id":"2062","paper":"真考试卷33","no":33,"type":"单项选择题","q":"下列关于驱动程序的陈述中，正确的是：","o":["驱动程序通过引导加载程序对下层硬件直接进行操作","VxWorks嵌入式操作系统的I/O系统通过7个基本的I/O操作函数访问硬件设备：create()、open()、read()、write()、close()、remove()和ioctl()","VxWorks嵌入式操作系统定义了统一的设备驱动程序框架，绝不允许用户代码绕过操作系统直接访问硬件","驱动程序必须在操作系统启动之后才能运行"],"a":"B","e":"驱动程序直接对硬件进行操作，其运行依赖于操作系统，而非通过引导加载程序，A选项叙述错误；VxWorks嵌入式操作系统的I/O系统通过7个基本的I/O操作函数访问硬件设备：create()、open()、read()、write()、close()、remove()和ioctl()，B选项叙述正确；VxWorks 虽提供统一驱动框架，但允许用户在必要时（如底层硬件调试）绕过操作系统直接访问硬件（如操作寄存器），C选项叙述错误；并非所有的驱动程序都在操作系统启动之后才能运行，引导加载程序需基础驱动（如Flash驱动、串口调试驱动）完成镜像加载，这些驱动在操作系统启动前已运行，D选项叙述错误；综上所述，本题答案为B选项。","code":0},{"id":"2063","paper":"真考试卷33","no":34,"type":"单项选择题","q":"下列名词中，不属于嵌入式底层软件的是：","o":["VFS","LILO","Das U-Boot","PMON"],"a":"A","e":"VFS是操作系统中负责统一管理不同文件系统（如 FAT、EXT4、NFS 等）的上层软件模块，属于操作系统的文件系统层，并非是嵌入式底层软件；而LILO、Das U-Boot和PMON都属于嵌入式底层软件，故本题答案为A选项。","code":0},{"id":"2064","paper":"真考试卷33","no":35,"type":"单项选择题","q":"下列关于实时与嵌入式操作系统的陈述中，正确的是：","o":["评价实时系统的实时性最重要的指标是吞吐率","MontaVista Linux是在原始免费型操作系统软件的基础上进行包装和优化的商业嵌入式Linux","eCOS属于商业操作系统，但只收取每种产品一次性费用，不收取版权费","实时系统应保证负荷均匀，不允许出现有时负载重、有时负载轻的情况"],"a":"B","e":"评价实时系统的实时性最重要的指标是响应时间 , 即系统从事件请求开始到任务完成的时间间隔，A选项叙述错误；MontaVista Linux 、风河Linux等在原始免费型操作系统软件的基础上进行包装和优化的商业嵌入式Linux，B选项叙述正确；\neCOS是免费的嵌入式操作系统，C选项叙述错误；实时系统的负荷有时重，有时轻，但整个系统必须能满足一定的峰值负荷要求，即在峰值负荷的情况下，关键任务也能在截止时间之前完成，D选项叙述错误；综上所述，本题答案为B选项。","code":0},{"id":"2065","paper":"真考试卷33","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，正确的是：","o":["VxWorks操作系统内核不提供任务间通信和同步功能","强稳定性和弱交互性是嵌入式操作系统的突出特点","VxWorks和QNX操作系统均采用宏内核结构","Nucleus PLUS是专门为硬件资源极为有限的无线传感器网络应用而量身定制的开源嵌入式操作系统"],"a":"B","e":"VxWorks 采用微内核结构，内核仅提供多任务环境、任务间通信和同步功能，能够有效保证较短的任务间切换时间和较小的中断延迟，A、C选项叙述错误；嵌入式操作系统的突出特点包括代码固化存储，时空效率高、可裁剪性、实时性、强稳定性和弱交互性、硬件适应性，B选项叙述正确；Nucleus PLUS 嵌入式操作系统是 ATI 公司（后来成为 Mentor Graphics 公司嵌入系统部门）为实时嵌入式应用而设计的抢占式多任务商业操作系统内核，D选项叙述错误；综上所述，本题答案为D选项。","code":0},{"id":"2066","paper":"真考试卷33","no":37,"type":"单项选择题","q":"下列关于Linux操作系统实时化技术的陈述中，正确的是：","o":["嵌入式Linux发行版产品在通用Linux内核基础上进行了嵌入式改造，主要侧重的是小型化和实时性增强","RTLinux实时操作系统采用内核补丁方式","MontaVista Linux是一个超微内核的实例","双内核方式的优点是微内核与标准Linux内核共存"],"a":"A","e":"嵌入式 Linux 发行版在通用 Linux 内核基础上进行了嵌入式改造，主要侧重的是小型化和实时性增强，A选项叙述正确；RTLinux 实时操作系统就采用双内核方式，B选项叙述错误；操作系统自适应域环境 ADEOS 是一个超微内核的实例，而 MontaVista Linux 采用抢占优先级内核技术，C选项叙述错误；双内核方式的优点是微内核可以提供硬实时支持，其缺点是微内核与标准 Linux 内核共存，D选项叙述错误；综上所述，本题答案为A选项。","code":0},{"id":"2067","paper":"真考试卷33","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的说法中，正确的是：","o":["函数OSTaskCreate()和OSTaskCreateExt()都可以创建任务","函数OSQAccept()在信号量计数值等于0时会挂起任务","函数OSSemDel()用于删除一个信号量。删除信号量之前，必须首先释放该信号量","在基于μC/OS-II的多任务系统中，不使用主函数main()"],"a":"A","e":"函数OSTaskCreate()和OSTaskCreateExt()都可以创建任务，A选项叙述正确；函数OSQAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用，B选项叙述错误；函数OSSemDel()用于删除一个信号量。 删除信号量之前，必须首先删除操作该信号量的所有任务，C选项叙述错误；在基于μC/0S-II 的多任务系统中，引导加载程序执行完毕则调用主函数main()，D选项叙述错误；综上所述，本题答案为A选项。","code":0},{"id":"2068","paper":"真考试卷33","no":39,"type":"单项选择题","q":"对于嵌入式系统开发的特点而言，下面的说法中，不恰当的是：","o":["需要使用宿主机-目标机的开发环境","程序调试完成后需要固化程序，即把程序代码烧写到非易失性存储器中","通常程序开发中的任务涉及许多底层硬件控制程序","应用程序必须基于某个嵌入式操作系统平台上来开发"],"a":"D","e":"虽然大多数嵌入式应用程序是基于嵌入式操作系统平台开发的，但并不是必须的。在一些简单的嵌入式系统中，没有操作系统，直接对硬件进行控制和编程，实现特定的功能；D选项叙述不恰当，故本题答案为D选项。","code":0},{"id":"2069","paper":"真考试卷33","no":40,"type":"单项选择题","q":"在基于ARM微处理器为核心的硬件平台上，开发其Linux环境下的应用程序test.c。若需要编译后生成test.c对应的汇编程序，应使用的命令是：","o":["arm-linux-gcc -c test.c","arm-linux-gcc -S test.c","arm-linux-gcc -g -o test test.c","arm-linux-gcc -o test test.c"],"a":"B","e":"A选项命令是对 test.c 源文件开展编译与汇编操作，最终生成目标文件 test.o，不符合题意；B选项命令是让编译器把 test.c 源文件编译成汇编代码，符合题意；C选项和D选项命令都是对 test.c 源文件进行编译、汇编和链接操作，最终生成可执行文件 test，不符合题意；综上所述，本题答案为B选项。","code":0},{"id":"2091","paper":"新增试卷1","no":1,"type":"单项选择题","q":"对于嵌入式系统及其应用描述，以下说法正确的是：","o":["嵌入式系统应用广泛，几乎无处不在","嵌入式系统是通用计算机系统的一种形式","嵌入式系统以性能为核心，计算机技术为基础","嵌入式系统的软件和硬件是不可裁剪的"],"a":"A","e":"当前，嵌入式系统广泛应用于各个领域，它几乎无处不在，A选项叙述正确；嵌入式系统是嵌入式计算机系统的简称，顾名思义，它是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统，并不是通用计算机系统的一种形式，B选项叙述错误；嵌入式系统是以应用为中心，以计算机技术为基础，软硬件可裁剪、适应应用系统对功能、可靠性、成本、体积、功耗等多种约束的专用计算机系统，C、D选项叙述错误；综上所述，本题答案为A选项。","code":0},{"id":"2092","paper":"新增试卷1","no":2,"type":"单项选择题","q":"关于嵌入式系统中的CPU具有的特点，以下说法正确的是：\n①支持实时处理 \n②低功耗   \n③结构可扩展      \n④一般集成了测试电路    \n⑤通用性  \n⑥大功率  \n⑦可移动性","o":["① ② ③ ⑤","① ② ⑤ ⑦","① ② ③ ④","① ③ ④ ⑥"],"a":"C","e":"嵌入式系统中的 CPU 一般具有 4 个特点：① 支持实时处理；② 低功耗；③ 结构可扩展；④ 集成了测试电路，故本题答案为C选项。","code":1},{"id":"2093","paper":"新增试卷1","no":3,"type":"单项选择题","q":"对于嵌入式系统的软件，以下说法错误的是：","o":["对于低端嵌入式系统，一般不需要操作系统，只需配置一个监控程序、若干设备驱动 程序和事件处理程序即可","对于高端嵌入式系统，软件由板级支持包、设备驱动程序、中间件以嵌入式应用软件等组成","板级支持包（BSP）属于应用层软件","不同应用系统需要配置不同的应用软件"],"a":"C","e":"板级支持包（BSP）是介于硬件和操作系统之间的一层软件，它主要负责初始化硬件设备、提供设备驱动接口等，使操作系统能够在特定的硬件平台上运行，属于底层软件，而非应用层软件，C选项叙述错误，故本题答案为C选项。","code":0},{"id":"2094","paper":"新增试卷1","no":4,"type":"单项选择题","q":"关于嵌入式处理芯片，以下说法错误的是：","o":["嵌入式处理芯片有4种形式即微处理器MPU、微控制器MCU、DSP和SoC","微控制器MCU特指8位单片机","大部分高端嵌入式系统均采用SoC","微处理器应用于嵌入式系统时，除处理器芯片外，还要外接RAM、ROM、I/O接口等"],"a":"B","e":"8 位MCU只是早期和部分简单应用的主流，现在很多高性能 MCU 是 32 位的（如 ARM Cortex-M 系列），B选项叙述错误，故本题答案为B选项。","code":0},{"id":"2095","paper":"新增试卷1","no":5,"type":"单项选择题","q":"下列关于ASCII字符集的描述中，正确的是：","o":["基本的ASCII字符集中包括日文片假名和汉字","基本的ASCII字符集中包括注音符号和阿拉伯数字","基本的ASCII字符集中包括常用的拉丁字母和标点符号","基本的ASCII字符集中包括希腊字母和控制字符"],"a":"C","e":"基本的 ASCII 字符集共有 128 个字符，包括 96 个可打印字符（常用的拉丁字母、阿拉伯数字、标点符号等）和 32 个控制字符，故本题答案为C选项。","code":0},{"id":"2096","paper":"新增试卷1","no":6,"type":"单项选择题","q":"下列各文件格式和编码标准中，属于图像文件格式的是：","o":["APE","MPEG","GB18030","PNG"],"a":"D","e":"APE是一种无损音频压缩格式，属于音频文件格式，MPEG是视频或音频编码标准；GB18030是我国自主制定的字符编码标准，属于汉字编码国家标准；PNG是一种无损压缩的位图图像格式，属于图像文件格式；综上所述，故本题答案为D选项。","code":0},{"id":"2097","paper":"新增试卷1","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，正确的是：","o":["WAV是一种无损压缩的音频文件格式","html是一种有损压缩图像文件格式","电话数字语音的频率范围是20~20000Hz","一幅图像的数据量可按下面的公式进行计算（字节）：图像数据量＝图像水平分辨率×图像垂直分辨率×像素深度/8"],"a":"D","e":"WAV是微软开发的无压缩音频文件格式，而非无损压缩格式，A选项错误；HTML是超文本标记语言，用于定义网页的文本、图片、链接等元素的组织方式，本身不存储图像数据，更不属于图像文件格式，B选项叙述错误；电话数字语音的频率范围是300~3400Hz，而 20~20000Hz是人类听觉的理论频率范围，也是高保真（Hi-Fi）音频的采样范围（如 CD 音频），与电话语音无关，C选项叙述错误；一幅图像的数据量可按下面的公式是图像数据量＝图像水平分辨率×图像垂直分辨率×像素深度/8，D选项叙述正确；综上所述，本题答案为D选项。","code":0},{"id":"2098","paper":"新增试卷1","no":8,"type":"单项选择题","q":"下面是关于无线通信的叙述，其中错误的是：","o":["无线通信借助自由空间的电磁波传播信息","无线通信可以按频率（波长）分成中波、短波、超短波和微波等波段","无线通信不易被窃听、不易受干扰","采用无线通信方式传播信息时，可省去线路的架设，同时也允许终端设备在一定范围内随意移动"],"a":"C","e":"无线通信是借助自由空间的电磁波传播信息，无线通信可以按频率（波长）分成中波、短波、超短波和微波等波段；采用无线通信方式传播信息时，可省去线路的架设，同时也允许终端设备在一定范围内随意移动；但电波通过自由空间时能量较分散，传输效率低，所以无线通信存在易被窃听、易干扰等缺点，C选项叙述错误，故本题答案为C选项。","code":0},{"id":"2099","paper":"新增试卷1","no":9,"type":"单项选择题","q":"ARM处理器属于纯16位编码的指令集是：","o":["ARM指令集","Thumb指令集","Thumb-2指令集","ARM+Thumb指令集"],"a":"B","e":"ARM 指令集是 32 位指令集，每条指令长度固定为 32 位；Thumb 指令集是纯 16 位指令集，通过缩短指令长度来提高代码密度，适合对存储容量要求较高的场景；Thumb-2 指令集是 ARMv7 架构引入的混合指令集，包含 16 位和 32 位指令，并非纯 16 位；ARM+Thumb 指令集是 ARM 处理器的两种工作状态组合，不是单一的纯 16 位指令集；综上所述，本题答案为B选项。","code":0},{"id":"2100","paper":"新增试卷1","no":10,"type":"单项选择题","q":"关于ARM Cortex-M处理器以下说法错误的是：","o":["执行ARM指令集","NVIC为嵌套向量中断控制器","WIC为唤醒中断控制器","DWT为数据观察点及跟踪器"],"a":"A","e":"ARM Cortex-M 处理器只支持Thumb-2 指令集的子集，不支持传统的 ARM 32 位指令集，A选项叙述错误；NVIC即嵌套向量中断控制器，是 Cortex-M 处理器中负责中断管理的关键组件，B选项叙述正确；WIC即唤醒中断控制器，用于在处理器进入深度睡眠模式时响应特定中断并将其唤醒，C选项叙述正确；DWT即数据观察点及跟踪器，属于 Cortex-M 处理器的调试跟踪组件，可用于设置数据观察点和进行程序跟踪，D选项叙述正确；综上所述，本题答案为A选项。","code":0},{"id":"2101","paper":"新增试卷1","no":11,"type":"单项选择题","q":"关于经典ARM处理器以下说法正确的是：","o":["上电复位后，ARM处理器PC指针为0x00000004","当有存储器故障时，ARM处理器自动进入未定义指令模式","当有外部中断时，ARM处理器自动进入快速中断模式","软件中断SWI属于管理模式"],"a":"D","e":"经典 ARM 处理器上电复位后，PC 指针通常为 0x00000000（复位向量地址），而不是 0x00000004，0x00000004 是未定义指令异常的向量地址，A选项叙述错误；当发生存储器故障时，ARM 处理器会进入数据中止或指令中止模式，而非未定义指令模式（未定义指令模式用于处理无法识别的指令），B选项叙述错误；外部中断会使 ARM 处理器进入外部中断模式，而快速中断才会进入快速中断模式，C选项叙述错误；软件中断是通过执行 SWI 指令触发的异常，会使处理器进入管理模式，通常用于用户模式程序调用操作系统内核功能，D选项叙述正确；综上所述，本题答案为D选项。","code":0},{"id":"2102","paper":"新增试卷1","no":12,"type":"单项选择题","q":"ARM处理器程序状态寄存器CPSR格式如下所示，\n\n下面指令序列禁止快速中断和外部中断，正确的是","o":["MRS R2,CPSR\nORR R2,R2,#0xC0\nMSR CPSR,R2","MRS R2,CPSR\nBIC R2,R2,#0xC0\nMSR CPSR,R2","MRS R2,CPSR\nAND R2,R2,#0xC0\nMSR CPSR,R2","MRS R2,CPSR\nORR R2,R2,#0x3F\nMSR CPSR,R2"],"a":"A","e":"在ARM 处理器的程序状态寄存器CPSR 中，位6是快速中断禁止位（F 位），位7是外部中断禁止位（I 位）。当F位和I位被设置为1时，分别禁止快速中断和外部中断。A选项MRS R2,CPSR将CPSR 的值读到R2 中；ORR R2,R2,#0xC0（0xC0 对应的二进制是11000000，即设置F位（位6）和I位（位 7）为 1）；MSR CPSR,R2将修改后的值写回CPSR，实现禁止快速中断和外部中断，A选项正确；B选项BIC指令是清除位BIC R2,R2,#0xC0会清除 F 位和 I 位，是使能快速中断和外部中断，不符合要求；C选项AND指令是按位与，AND R2,R2,#0xC0会保留 F 位和 I 位原来的值，不能确保将它们设置为1 来禁止中断；ORR R2,R2,#0x3F（0x3F 对应的二进制是 00111111），设置的是低 6 位，而不是 F 位和 I 位，无法禁止快速中断和外部中断；综上所述，本题答案为A选项。","code":1},{"id":"2103","paper":"新增试卷1","no":13,"type":"单项选择题","q":"关于指令的条件域，以下说法错误的是：","o":["EQ的含义是相等，Z=1","CS的含义是无符号数大于或等于，C=1","AL表示无条件执行","VS的含义是不溢出，V=0"],"a":"D","e":"EQ表示相等，当状态寄存器中的零标志位 Z=1 时满足此条件；CS表示无符号数大于或等于，当进位标志位 C=1 时满足此条件；AL表示无条件执行，任何情况下都会执行该指令；VS表示溢出，当溢出标志位 V=1 时满足此条件；而 V=0 表示不溢出，对应的条件域是 VC表示未溢出；综上所述，本题答案为D选项。","code":0},{"id":"2104","paper":"新增试卷1","no":14,"type":"单项选择题","q":"ARM处理器内部某些功能部件如下，与中断直接相关的部件有： \n①TPIU \n②MPU   \n③MMU      \n④NVIC    \n⑤WIC  \n⑥Cahe  \n⑦ETM","o":["②  ③","①  ⑤","④  ⑤","⑤  ⑦"],"a":"C","e":"①TPIU是跟踪端口接口单元，用于调试跟踪，与中断无关；②MPU是存储器保护单元，用于内存访问控制，与中断无关；③MMU是内存管理单元，用于虚拟内存管理，与中断无关；④NVIC是嵌套向量中断控制器，专门负责中断的管理、优先级处理等，与中断直接相关。⑤WIC是唤醒中断控制器，用于处理器在低功耗模式下响应中断并唤醒系统，与中断直接相关；⑥Cache是高速缓存，用于提高内存访问速度，与中断无关；⑦ETM是嵌入式跟踪宏单元，用于程序执行跟踪，与中断无关；综上所述，与中断直接相关的部件有④  ⑤，故本题答案为C选项。","code":1},{"id":"2105","paper":"新增试卷1","no":15,"type":"单项选择题","q":"关于ARM寄存器，以下说法错误的是：","o":["R13存放堆栈指针","LR为链接寄存器","R15存放PC指针","CPSR存放中断向量"],"a":"D","e":"R13在ARM架构中通常被用作堆栈指针（SP），用于管理程序运行时的堆栈操作，A选项叙述正确；LR是链接寄存器，用于保存函数调用后的返回地址，确保程序能正确返回调用点，B选项叙述正确；R15 是程序计数器（PC），始终指向当前正在执行指令的下一条指令地址，控制程序的执行流程，C选项叙述正确；CPSR（当前程序状态寄存器）用于存储处理器的状态信息，包括标志位（如进位、零值、溢出等）、中断禁止位和处理器模式等；而中断向量是存放在特定内存地址的异常处理程序入口地址，并非由 CPSR 存放，D选项叙述错误；综上所述，本题答案为D选项。","code":0},{"id":"2106","paper":"新增试卷1","no":16,"type":"单项选择题","q":"对于ARM处理器工作状态，以下说法错误的是：","o":["在Thumb状态下，每执行1条执行，PC值自动加2","在Thumb-2状态下，每执行1条执行，PC值自动加2","在ARM状态下，每执行1条执行，PC值自动加4","工作状态可以切换"],"a":"B","e":"Thumb 状态下指令长度固定为 16 位，因此每执行一条指令，PC 值自动加 2，A选项叙述正确；Thumb-2 状态是 16 位和 32 位指令的混合集，执行 16 位指令时 PC 加 2，执行 32 位指令时 PC 加 4，并非固定加 2，B选项叙述错误；ARM 状态下指令长度固定为 32 位，因此每执行一条指令，PC 值自动加 4，C选项叙述正确；ARM 处理器可以通过特定指令（如 BX、BLX）在 ARM 状态和 Thumb 状态（包括 Thumb-2）之间切换，D选项叙述正确；综上所述，本题答案为B选项。","code":0},{"id":"2107","paper":"新增试卷1","no":17,"type":"单项选择题","q":"如果要读取内存地址为0x29000604开始的一个字节数据到R1中，并且地址不更新，以下指令序列正确的是：","o":["LDR R0,=0x29000600\nLDRB R1,[R0],#4","LDR R0,=0x29000600\nLDRB R1,[R0,#4]","LDR R0,=0x29000600\nLDRB R1,[R0,#4]!","LDR R0,=0x29000600\nLDRB R1,[R0]!,#4"],"a":"B","e":"A选项指令先访问基地址R0对应的内存0x29000600，读取 1 字节到R1，访问完成后，自动将R0的值加 4，即R0 = 0x29000600 + 4 = 0x29000604；B选项先计算目标地址基地址R0 + 偏移量4 = 0x29000600 + 4 = 0x29000604，访问0x29000604地址，读取 1 字节到R1；访问完成后，R0的值保持不变（仍为0x29000600），地址不更新；C选项先计算目标地址0x29000600 + 4 = 0x29000604，同时将R0更新为0x29000604，访问0x29000604地址，读取 1 字节到R1；ARM 指令集不存在[R0]!,#4的格式，D选项该指令语法错误；综上所述，B选项符合题意，本题答案为B选项。","code":0},{"id":"2108","paper":"新增试卷1","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下有以下指令：\n    LDR R0,=0x20001000\n    LDR R1,=0x11223344\n    STR R1,[R0]\n    LDR R1,=0x99887766\n    STRH R1,[R0]\n    LDR  R1,[R0],#4\n指令序列执行后，以下说法正确的是：\n①R1=0x99887766     \n②R1=0x11227766\n③R1=0x11223344     \n④内存中的值保持不变\n⑤R0=0x20001004","o":["① ④","② ⑤","① ④ ⑤","② ④ ⑤"],"a":"B","e":"第一条指令R0 = 0x20001000（基地址），第二条指令R1 = 0x11223344，第三天指令将R1的值存入R0指向的内存中；\n小端模式下内存布局：\n0x20001000: 0x44（低字节）\n0x20001001: 0x33\n0x20001002: 0x22\n0x20001003: 0x11（高字节）\n第四条指令R1 = 0x99887766，第五条指令将 R1 的低 16 位存入 R0 指向的内存；\n低 16 位为 0x7766，小端模式下：\n0x20001000: 0x66（覆盖原 0x44）\n0x20001001: 0x77（覆盖原 0x33）\n0x20001002: 0x22（保持不变）\n0x20001003: 0x11（保持不变）\n第六条指令先读取 R0 指向的内存（0x20001000）到 R1，再将 R0 加 4\n读取的内存值为 0x11227766（由内存内容 0x66、0x77、0x22、0x11 组成）\n执行后 R0 = 0x20001000 + 4 = 0x20001004；\n最后R1 = 0x11227766，R0 = 0x20001004，内存中的值被修改。\n综上所述，正确的是② ⑤，本题答案为B选项。","code":1},{"id":"2109","paper":"新增试卷1","no":19,"type":"单项选择题","q":"下面是关于典型嵌入式系统相互互联通道的叙述，其中错误的是：","o":["LED或LCD显示输出接口属于相互互联通道","CAN接口属于相互互联通道","以太网接口属于相互互联通道","USB接口属于相互互联通道"],"a":"A","e":"LED（发光二极管）和 LCD（液晶显示器）的显示输出接口，本质是单向数据输出通道，仅能从嵌入式主控设备向 LED/LCD 传输显示控制信号（如像素数据、点亮指令），无法实现 LED/LCD 向主控设备反馈数据，不属于相互互联通道，A选项叙述错误；\nCAN（控制器局域网）接口是典型的工业级互联通道，支持多设备之间的双向数据通信（如汽车电子中 ECU 与传感器、执行器的双向数据交互），属于相互互联通道，B选项叙述正确；\n以太网接口是通用的网络互联通道，可实现嵌入式设备与其他网络设备（如电脑、服务器、其他嵌入式设备）的双向数据传输（如数据上传、指令下载），属于相互互联通道，C选项叙述正确；\nUSB（通用串行总线）接口支持嵌入式设备与外部设备（如 U 盘、键盘、电脑）的双向数据交互（如读取 U 盘数据、向电脑传输采集数据），是典型的相互互联通道，D选项叙述正确；综上所述，本题答案为A选项。","code":0},{"id":"2110","paper":"新增试卷1","no":20,"type":"单项选择题","q":"下面是关于嵌入式处理器中的中断控制器的叙述，其中错误的是：","o":["中断控制器负责对其它硬件组件的中断请求进行管理和控制","向量中断控制器能够区分中断的优先级","采用嵌套向量中断时，高优先级的中断可以进入低优先级中断的处理过程中","嵌套向量中断即VIC"],"a":"D","e":"【解析 】中断控制器的核心功能是接收并管理系统中其他硬件组件（如定时器、UART、ADC 等）发出的中断请求，A选项叙述正确；向量中断控制器的关键特性之一是支持中断优先级区分，通过为不同中断源分配优先级等级，控制器可优先响应高优先级中断，避免低优先级中断阻塞关键任务，B选项叙述正确；嵌套向量中断的核心机制是高优先级中断可抢占低优先级中断的处理过程，C选项叙述正确；VIC是早期 ARM 处理器中使用的向量中断控制器，嵌套向量中断的对应控制器是NVIC，D选项叙述错误；综上所述，本题答案为D选项。","code":0},{"id":"2111","paper":"新增试卷1","no":21,"type":"单项选择题","q":"下面的选项中，不属于嵌入式处理芯片内部的模拟组件的是：","o":["PWM","ADC","DAC","比较器"],"a":"A","e":"PWM（脉冲宽度调制）是通过数字电路生成的周期性数字脉冲信号（高低电平交替的离散信号），其核心是对数字脉冲的占空比（高电平时间占周期的比例）进行调节，本质是数字信号的生成与控制，不属于模拟组件，而ADC、DAC、比较器都属于模拟组件，故本题答案为A选项。","code":0},{"id":"2112","paper":"新增试卷1","no":22,"type":"单项选择题","q":"易失性存储器在没有电源供电的情况下不能保存数据。下面几种存储器中，属于易失性存储器的是：","o":["DDR2 SDRAM","NOR Flash","NAND Flash","PROM"],"a":"A","e":"DDR2 SDRAM断电后数据会立即丢失，属于易失性存储器；而NOR Flash、NAND Flash和PROM断电后数据不会丢失，无需电源即可长期保存数据，属于非易失性存储器，故本题答案为A选项。","code":0},{"id":"2113","paper":"新增试卷1","no":23,"type":"单项选择题","q":"下面是关于I2C总线的叙述，其中错误的是：","o":["总线上的所有器件都不使用总线时，总线中的信号线均处于低电平","主控器件启动总线操作的条件是当SCL保持高电平时SDA线由高电平转为低电平","SCL为高电平时SDA电平由低转为高，则总线工作停止","SDA信号线上的数据必须在SCL的高电平周期保持稳定，它的高/低电平状态只有在 SCL信号线是低电平时才能改变"],"a":"A","e":"根据I2C总线的电气特性，I2C的 SDA（串行数据线）和 SCL（串行时钟线）采用开漏输出结构，外部会接有上拉电阻。当总线上所有器件都不使用总线时，上拉电阻会将 SDA 和 SCL 拉至高电平，而不是低电平，A选项叙述错误，故本题答案为A选项。","code":0},{"id":"2114","paper":"新增试卷1","no":24,"type":"单项选择题","q":"下图为基于UART的直接通信连接方式示意图，图中①、②、③、④分别为：","o":["TXD、TXD、RXD、RXD","RXD、TXD、RXD、TXD","TXD、RXD、TXD、RXD","TXD、RXD、RXD、TXD"],"a":"D","e":"UART（通用异步收发传输器）通信中，发送端的TXD（发送数据）要连接到接收端的 RXD（接收数据），对于嵌入式处理器A的①引脚，它是发送数据到处理器B，所以①是TXD；处理器B 的②引脚要接收 A发来的数据，所以②是RXD。嵌入式处理器 B 的④引脚是发送数据到处理器A，所以④是TXD；处理器A 的③引脚要接收 B 发来的数据，所以③是RXD。故本题答案为D选项。","code":0},{"id":"2115","paper":"新增试卷1","no":25,"type":"单项选择题","q":"下面关于HDMI的叙述中，错误的是：","o":["HDMI是一种数字化音频/视频接口","HDMI有不同的版本，但即使是最新的版本也无法支持1080P视频显示格式的分辨率","目前有的ARM芯片内置HDMI控制器接口","HDMI的设备支持即插即用"],"a":"B","e":"HDMI是一种数字化音频/视频接口，HDMI的多个版本都支持1080p视频显示格式，随着嵌入式技术的发展，目前许多高性能的 ARM 芯片内置了 HDMI 控制器接口，支持即插即用功能；综上所述，本题答案为B选项。","code":0},{"id":"2116","paper":"新增试卷1","no":26,"type":"单项选择题","q":"下面是关于常用通信标准或通信接口的叙述，其中错误的是：","o":["SPI是一种同步串行接口","CAN采用同步通信方式","I²C是一种同步串行接口","USB 2.0采用异步通信方式"],"a":"B","e":"CAN采用的是异步通信方式，而非同步通信，B选项叙述错误，故本题答案为B选项。","code":0},{"id":"2117","paper":"新增试卷1","no":27,"type":"单项选择题","q":"下面是关于LCD显示设备的叙述，其中错误的是：","o":["LCD显示模块内置了LCD显示屏、控制器和驱动模块","LCD显示模块有字符型、图形点阵型等不同的类型","目前，嵌入式处理芯片内部均无LCD控制器","DVI是通用计算机中使用的LCD显示器的一种标准接口"],"a":"C","e":"大量中高性能嵌入式处理芯片（如 STM32F4/F7 系列、三星 S3C2440、瑞芯微 RK3399 等）已内置 LCD 控制器，C选项叙述错误，故本题答案为C选项。","code":0},{"id":"2118","paper":"新增试卷1","no":28,"type":"单项选择题","q":"下面是关于S3C2410中的PWM Timer的叙述，其中错误的是：","o":["S3C2410内部有5个16位定时器，有4个具备PWM输出","确定PWM信号的周期时需要用到TCNTBn","假设TCNTBn=100，当TCMPBn写入60后的下一个PWM周期的低电平宽度为60个PWM定时计数周期","假设TCNTBn=100，当TCMPBn写入50后的下一个PWM周期的低电平宽度为50个PWM定时计数周期"],"a":"C","e":"S3C2410内部有5个16位定时器，有4个具备PWM输出；TCNTBn是定时器计数缓冲寄存器，用于设置PWM信号的周期；在PWM操作中，PWM 信号的周期为TCNTBn个定时器输入时钟周期，一个PWM信号周期内的高电平宽度为TCMPBn 个定时器输入时钟周期，低电平宽度为TCNTBn - TCMPBn个定时器输入时钟周期；假设TCNTBn=100，当TCMPBn写入60后的下一个PWM周期的低电平宽度为100-60=40个PWM定时计数周期；假设TCNTBn=100，当TCMPBn写入50后的下一个PWM周期的低电平宽度为100-50=50个PWM定时计数周期；综上所述，C选项错误，故本题答案为C选项。","code":0},{"id":"2119","paper":"新增试卷1","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，不正确的是：","o":["简单监控式的嵌入式操作系统结构的优点是程序结构简单，便于编程，但由于引入了中断机制，因而会出现程序随机切换带来的潜在问题","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销","系统软件、应用软件与系统的硬件一体化，相互关系密切"],"a":"A","e":"简单监控式结构（又称 “前后台系统”）的核心特点是无操作系统内核，仅有前台中断服务程序和后台主程序，后台主程序按顺序执行常规任务，前台通过中断响应紧急任务。其优点确实是程序结构简单、便于编程，但程序随机切换的潜在问题（如任务调度冲突、资源竞争）是多任务操作系统（如实时操作系统 RTOS） 的典型问题 —— 简单监控式结构无复杂任务调度机制，仅通过中断触发有限切换，不会因引入中断机制导致随机切换问题。A选项叙述错误，故本题答案为A选项。","code":0},{"id":"2120","paper":"新增试卷1","no":30,"type":"单项选择题","q":"下列关于bootloader的描述中，正确的是：","o":["不同的bootloader程序功能不同，但都需要支持核心的引导（boot）和加载（load）操作系统等基本功能","大多数从Flash存储器上启动的bootloader程序采用三阶段执行过程","与在RAM中直接运行操作系统代码相比，在ROM中运行操作系统代码时其取指令的速度更高","bootloader不仅包含引导加载程序，还包含操作系统映像、应用程序代码和用户配置数据等信息"],"a":"A","e":"尽管不同硬件平台的Bootloader功能存在差异，但所有 Bootloader 的核心功能一致 ，它负责系统的上电自检、硬件初始化、建立存储空间映射、配置数、建议上层软件的运行环境，并加载和启动操作系统，A选项叙述正确，不包括操作系统映像、应用程序代码和用户配置数据等信息，D选项叙述错误；大多数从 Flash 启动的 Bootloader 采用两阶段执行过程，第一阶段的目的是让嵌入式系统能正常运行起来，并为第二阶段以及随后操作系统运行准备好基本的硬件环境，B选项叙述错误；操作系统代码运行时需频繁取指令和读写数据，RAM 的随机访问特性可实现高速数据交互，而 ROM 的读取速度较慢，ROM的访问速度远低于RAM，C选项叙述错误；综上所述，本题答案为A选项。","code":0},{"id":"2121","paper":"新增试卷1","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，正确的是：","o":["一个BSP可以兼容于不同的操作系统，但需针对特定硬件","系统启动时，由操作系统加载BSP，从而为应用软件提供多任务运行环境","BSP在系统上电复位之前负责系统初始软硬件环境的建立，一般包含硬件的初始化、数据的输入/输出操作、硬件设备的配置操作等功能","在初始化必要的硬件环境之后，BSP还需要进行系统级的初始化"],"a":"D","e":"BSP具有操作系统相关性，无法直接兼容不同操作系统，A选项叙述错误；BSP在操作系统加载之前运行，负责硬件初始化和操作系统的引导，B选项叙述错误；BSP的初始化操作发生在上电复位之后负责系统初始软硬件环境的建立，而非之前，C选项叙述错误；BSP在完成硬件初始化（如CPU初始化、外设配置）后，必须进行系统级初始化，包括操作系统的初始化和多任务环境的设置，D选项叙述正确；综上所述，本题答案为D选项。","code":0},{"id":"2122","paper":"新增试卷1","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["Bootloader只能被高层软件调用而无法自行运行","bootloader代码通常全部用汇编语言实现","在启动加载（bootloading）模式下，bootloader通过通信端口从调试主机上下载操作系统映像，暂存到RAM中，然后将其烧录到flash ROM等非易失性存储器中","bootROM是用来存储bootloader程序的非易失存储器"],"a":"D","e":"Bootloader是系统上电后首先执行的程序，它自行运行而不依赖高层软件，A选项叙述错误；bootloader第一阶段代码通常使用汇编语言实现，第二阶段代码通常用C语言实现，B选项叙述错误；启动加载模式是指Bootloader从本地非易失存储设备（如Flash）直接加载操作系统到RAM中运行，而非从调试主机下载，C选项叙述错误；Bootloader程序需要存储在非易失性存储器中（如ROM或Flash），以确保系统上电时能可靠启动，D选项叙述正确；综上所述，本题答案为D选项。","code":0},{"id":"2123","paper":"新增试卷1","no":33,"type":"单项选择题","q":"下列嵌入式操系统中，均未定义统一的设备驱动程序框架的是：","o":["Linux和Unix","μC/OS-II和Nucleus PLUS","VxWork和Windows Embedded","WinCE和QNX"],"a":"B","e":"在 WinCE、Linux 、Unix、VxWorks、Windows Embedded和QNX等嵌入式操作系统中，往往自带一些标准设备的驱动程序，并且定义了统一的设备驱动程序框架；而μC/OS-II和Nucleus PLUS均未定义统一的设备驱动程序框架。综上所述，本题答案为B选项。","code":0},{"id":"2124","paper":"新增试卷1","no":34,"type":"单项选择题","q":"下列名词中，属于嵌入式底层软件的是：","o":["OpenGL","eCOS","LILO","VFS"],"a":"C","e":"LILO（Linux Loader）是一款经典的Bootloader（引导加载程序），属于嵌入式底层软件的核心类型。其功能是在系统上电后，完成硬件初始化，并加载 Linux 等操作系统内核到内存中，直接对接硬件与上层操作系统，是嵌入式系统启动的关键底层组件；综上所述，本题答案为C选项。","code":0},{"id":"2125","paper":"新增试卷1","no":35,"type":"单项选择题","q":"下列关于实时与嵌入式系统的陈述中，正确的是：","o":["实时操作系统以在给定时间内完成更多的任务为目标","即使在重负载甚至超负荷的情况下，实时系统的所有任务都必须要得到服务","微内核结构的实时操作系统的内核各个模块间的交互通过直接调用其他模块中的函数来实现","实时系统的负荷并不一定是均匀的，有时负载重，有时负载轻"],"a":"D","e":"实时系统是必须在有限和确定的时间内对外部事件作出响应的信息系统，而非在给定时间内完成更多任务，A选项叙述错误；实时系统分为两类，分别是硬实时系统，任务必须在截止时间内完成，否则会导致严重后果；软实时系统任务应尽量在截止时间内完成，但偶尔超时仅影响服务质量，不会导致严重问题，而所有任务都必须得到服务仅适用于硬实时系统，不适用于软实时系统，软实时系统重负载下软实时任务可能被延迟或降级服务，B选项叙述错误；宏内核结构把内核的各个功能模块（如进程管理、文件系统、设备管理、网络通信等）整合在一起，模块间的交互通过直接调用其他模块中的函数来实现，执行效率高，性能好；而微内核结构仅将必需的基本功能（如任务调度、任务间通信、低级存储管理、中断处理等）放人内核，它们运行在核心态；其他功能都在内核之外，由在用户态运行的服务来完成，C选项叙述错误；实时系统的负荷有时重，有时轻，但整个系统必须能满足一定的峰值负荷要求，即在峰值负荷的情况下，关键任务也能在截止时间之前完成，D选项叙述正确；综上所述，本题答案为D选项。","code":0},{"id":"2126","paper":"新增试卷1","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的体系结构的陈述中，正确的是：","o":["WindowsCE和安卓操作系统都属于宏内核结构","分层结构的操作系统的最大缺点就是模块之间相互关联，耦合度很高，结构不清晰","单体结构和分层结构的操作系统内核统称为微内核结构","微内核结构的中断处理功能在内核之外，由在用户态运行的服务来完成"],"a":"A","e":"WindowsCE和Android（安卓）操作系统都属于宏内核结构，A选项叙述正确；宏内核结构的最大缺点就是模块之间相互关联，耦合度很高，结构不清晰，牵一发而动全身，维护和升级困难，而不是分层结构的操作系统的缺点，B选项叙述错误；宏内核结构分为整体结构和分层结构，并不是微内核结构，C选项叙述错误；微内核结构仅将必需的基本功能（如任务调度、任务间通信、低级存储管理、中断处理等）放人内核，它们运行在核心态；其他功能都在内核之外，由在用户态运行的服务来完成，并不是把断处理功能在内核之外，D选项叙述错误；综上所述，A选项叙述正确。","code":0},{"id":"2127","paper":"新增试卷1","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务的陈述中，正确的是：","o":["空闲任务在没有其他任务处于运行状态时运行","当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转入等待态","μC/OS-II是抢占式实时内核，在任意时刻都可能发生任务调度","休眠状态也称为挂起状态"],"a":"C","e":"空闲任务在没有其他任务处于就绪态时运行，并非是运行状态，A选项叙述错误；当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转人被中断态，处理器的使用权则被转交给中断服务程序，并非是转入等待态，B选项叙述错误；μC/OS-II是抢占式实时内核，在任意时刻都可能发生任务调度，在任务调度时总是选择当前就绪态任务中优先级最高的任务运行，C选项叙述正确；等待状态也称为挂起状态，并不是休眠状态，D选项叙述错误；综上所述，本题答案为C选项。","code":0},{"id":"2128","paper":"新增试卷1","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，正确的是：","o":["所有任务使用公共的栈空间保存任务的工作环境","周期执行的任务一般采用循环结构，并在每次完成具体功能后调用系统延时函数OSTimeDly()或OSTimeDlyHMSM()等待下一个执行周期，并将处理器时间让给其他任务","函数OSMboxPost()通过邮箱向任务发送一条消息，如果邮箱中已经保留着没有被接收的消息，则清空该消息，等待新消息到达","函数OSTaskResume ()实现退出临界状态的操作"],"a":"B","e":"每个任务都有自己独立的栈空间，用于保存任务的工作环境，并非所有任务使用公共的栈空间保存任务的工作环境，A选项叙述错误；周期执行的任务一般采用循环结构，并在每次完成具体功能后调用系统延时函数 OSTimeDly () 或 OSTimeDlyHMSM () 等待下一个执行周期，并将处理器时间让给其他任务，B选项叙述正确；函数 OSMboxPost () 通过邮箱向任务发送一条消息。如果邮箱中已经保留着没有被接收的消息，函数立即返回，返回值为错误代码OS_ERR_MBOX_FULL，表示邮箱已满。否则，消息被存入邮箱，且返回错误码等于常量 OS_ERR_NONE。若有任务在等待该邮箱的消息，则其中最高优先级的任务将接收该消息，C选项叙述错误；宏 OS_EXIT_CRITICAL () 则实现退出临界状态的操作，恢复到上次进入临界状态前的中断使能状态，而OSTaskResume () 是将被挂起的任务实现任务恢复，D选项叙述错误；综上所述，本题答案为B选项。","code":0},{"id":"2129","paper":"新增试卷1","no":39,"type":"单项选择题","q":"集成开发环境是嵌入式系统开发时所用的工具软件，它包含有许多工具。下面所列举的工具中，哪一个不属于集成开发环境所包含的工具：","o":["项目管理器","示波器","编译连接器","文本编辑器"],"a":"B","e":"集成开发环境是用于嵌入式系统开发的软件套件，主要包含与软件开发流程相关的工具有项目管理器、编译连接器、文本编辑器；而示波器（B）是一种硬件测试仪器，用于测量和观察电信号波形，不属于软件类的集成开发环境工具，本题答案为B选项。","code":0},{"id":"2130","paper":"新增试卷1","no":40,"type":"单项选择题","q":"下面有关片上调试技术的描述语句中，错误的是：","o":["指令集模拟器是在目标机上模拟调试程序代码","片上调试技术通常采用JTAG标准","使用片上调试技术进行嵌入式系统目标机调试时，无需目标存储器，也不占用目标机任何I/O端口","对硬件芯片及目标机电路板进行片上调试最常用的一种技术是边界扫描技术"],"a":"A","e":"指令集模拟器是在宿主机上模拟应用程序在目标机上运行行为的一个软件工具，A选项叙述错误，故本题答案为A选项。","code":0},{"id":"2152","paper":"新增试卷2","no":1,"type":"单项选择题","q":"以下关于嵌入式系统的概念，错误的是：","o":["嵌入式系统对功能有要求，对性能如可靠性、功耗等没约束","嵌入式系统是以计算机技术为基础的","专用性、高可靠性、隐蔽性、实时性等是嵌入式系统的特点","嵌入式系统的软件一般固化在只读存储器中"],"a":"A","e":"嵌入式系统是以应用为中心，以计算机技术为基础，软硬件可裁剪、适应应用系统对功能、可靠性、成本、体积、功耗等约束的专用计算机系统，A选项叙述错误，B选项叙述正确；嵌入式系统的特点包括专用性、隐蔽性、资源受限、高可靠性、实时性、软件固化（嵌入式系统的软件一般固化在只读存储器ROM中），C选项和D选项叙述正确；综上所述，A选项叙述错误，本题答案为A选项。","code":0},{"id":"2153","paper":"新增试卷2","no":2,"type":"单项选择题","q":"关于典型微控制器的组成，以下说法正确的是：","o":["微控制器内部通常没有ROM，也没有RAM","微控制器内部通常没有定时器部件","微控制器内部通常没有I/O接口","微控制器内部一定有CPU核"],"a":"D","e":"微控制器将整个计算机硬件的大部分甚至全部电路集成在一块芯片中。除 CPU 外，芯片内还集成了 ROM/EEPROM、RAM、总线、定时 / 计数器、看门狗定时器WDT、I/O 接口、A/D 转换器、D/A 转换器、网络通信接口等各种必要的功能部件和外设接口等。A选项、B选项和C选项说法都是错误的，D选项说法正确，故本题答案为D选项。","code":0},{"id":"2154","paper":"新增试卷2","no":3,"type":"单项选择题","q":"关于集成电路的叙述，以下说法错误的是：","o":["集成电路的特点是体积小、重量轻、可靠性高","集成电路的工作速度主要取决于电路结构和工作电压的高低","集成电路通常是在硅衬底上制作而成的","集成电路的制造工艺复杂且技术难度非常高"],"a":"B","e":"集成电路的特点是体积小、重量轻、可靠性高，A选项说法正确；集成电路的工作速度主要取决于组成逻辑门电路的晶体管的尺寸，晶体管的尺寸越小，其极限工作频率就越高，门电路的开关速度就越快，B选项说法错误；集成电路是在硅衬底上制作而成的。硅衬底是将单晶硅锭经切割、研磨和抛光后制成的像镜面一样光滑的圆形薄片，它的厚度不足 1 mm，其直径可以是 6 英寸、8 英寸、12 英寸甚至更大，这种硅片称为硅抛光片，它经过严格清洗后即可用于集成电路的制造，C选项说法正确；集成电路的制造大约需要几百道工序，工艺复杂且技术难度非常高，D选项说法正确；综上所述，B选项说法错误，本题答案为B选项。","code":0},{"id":"2155","paper":"新增试卷2","no":4,"type":"单项选择题","q":"下面关于片上系统（SoC）叙述中正确的是：","o":["SoC芯片中只能包含一个CPU","SoC芯片内部没有存储器，需要外接扩展存储器","SoC已经成为嵌入式处理芯片的主流发展趋势","SoC不支持I/O功能"],"a":"C","e":"SoC（片上系统）的核心思想是高度集成，它通常包含一个或多个CPU核心（如多核ARM Cortex-A），并且还会集成GPU（图形处理器）、NPU（神经网络处理器）、DSP（数字信号处理器）等多种处理单元，以协同处理不同任务，A选项叙述错误；SoC内部集成了存储控制器，并且通常包含高速缓存（Cache）和片上SRAM等存储器。虽然大容量内存（如DDR）可能因成本和容量需求而外接，但SoC本身是包含存储单元的，并非完全没有，B选项叙述错误；由于SoC具有体积小、功耗低、性能高、成本低和可靠性强等显著优势，它已成为智能手机、平板电脑、物联网设备、汽车电子和各类嵌入式系统的主流发展趋势，C选项叙述正确；支持丰富的I/O（输入/输出）接口是SoC的关键特性之一。SoC内部集成了各种外设接口控制器，如USB、I2C、SPI、UART、以太网、GPIO等，可以直接与外部传感器、显示器、摄像头等设备通信，无需额外的转接芯片，D选项叙述错误；综上所述，C选项叙述正确，本题答案为C选项。","code":0},{"id":"2156","paper":"新增试卷2","no":5,"type":"单项选择题","q":"下列各类符号中，ASCII字符集中不包含的是：","o":["阿拉伯数字","控制字符","拉丁字母","片假名"],"a":"D","e":"基本的ASCII字符集共有128个字符，包括96个可打印字符（常用的拉丁字母、阿拉伯数字、标点符号等）和32个控制字符，并不包括片假名，片假名属于日文字符；因此，本题答案为D选项。","code":0},{"id":"2157","paper":"新增试卷2","no":6,"type":"单项选择题","q":"下列各文件或编码格式中，属于图像文件格式的是：","o":["PNG","UTF-8","APE","MP3"],"a":"A","e":"PNG是常见的无损压缩图像文件格式，UTF-8是字符编码，APE和MP3都是音频文件格式，故本题答案为A选项。","code":0},{"id":"2158","paper":"新增试卷2","no":7,"type":"单项选择题","q":"下列关于数字图像获取过程的描述中，正确的是：","o":["现实世界中的图像依次进行扫描、取样、分色和量化后变为彩色数字图像","现实世界中的图像依次进行取样、扫描、量化和分色后变为彩色数字图像","现实世界中的图像依次进行扫描、分色、取样和量化后变为彩色数字图像","现实世界中的图像依次进行量化、扫描、取样和分色后变为彩色数字图像"],"a":"C","e":"现实世界中的图像依次进行扫描、分色、取样和量化后变为彩色数字图像，因此，本题答案为C选项。","code":0},{"id":"2159","paper":"新增试卷2","no":8,"type":"单项选择题","q":"下面关于路由器的叙述中，错误的是：","o":["路由器是一种遵循IP协议把异构网络互相连接起来的设备","路由器是一种遵循IP协议把异构网络互相连接起来的设备","应用于网络中的路由器只有一个IP地址","路由器之间一般都使用高速通信链路连接"],"a":"C","e":"路由器基于 IP 协议，用于连接不同类型（异构）的网络，A选项叙述正确；路由器核心功能是路由选择、IP 分组转发，同时可在不同网络层协议间做转换，B选项叙述正确；路由器有多个网络接口，每个接口都可以配置独立的 IP 地址，并非只有一个，C选项叙述错误；骨干网、核心网中的路由器之间通常使用高速链路互联以保证转发效率，D选项叙述正确；综上所述，C选项叙述错误，本题答案为C选项。","code":0},{"id":"2160","paper":"新增试卷2","no":9,"type":"单项选择题","q":"某ARM处理器用汇编语言编写某程序段有100条指令，占据了内存空间为340字节，该处理器使用的工作状态为：","o":["调试状态","ARM状态","Thumb状态","Thumb-2状态"],"a":"D","e":"根据题目描述，计算单条指令平均长度是总字节数/指令数=340/100=3.4字节。ARM 状态下所有指令都是32 位（4 字节），Thumb 状态下所有指令都是16 位（2 字节），Thumb-2 状态下支持16 位 + 32 位混合指令，平均长度介于 2~4 字节之间，由此可知，该处理器使用的工作状态为：Thumb-2状态，本题答案为D选项。","code":0},{"id":"2161","paper":"新增试卷2","no":10,"type":"单项选择题","q":"对于实时性要求很高的的应用场合，采用最合适的ARM处理器是：","o":["ARM7","ARM9","ARM Cortex-R4","ARM Cortex-M3"],"a":"C","e":"ARM7和ARM9是经典ARM处理器，ARM Cortex-R4是实时嵌入式处理器，适用于计算复杂、实时性要求苛刻的领域，其核心是采用 ARMv7-R 架构的处理器核 ARMR4，它支持 ARM/Thumb-2 指令集，代码密度高；使用硬件实现单指令多数据SIMD的DSP指令；具有可选的浮点运算器；使用 8 级流水线技术实现。ARM Cortex-M3是一款低功耗处理器内核，具有门数少、中断延迟短、调试成本低的特点，是为要求有快速中断响应能力的深度嵌入式应用而设计的。综上所述，本题答案为C选项。","code":0},{"id":"2162","paper":"新增试卷2","no":11,"type":"单项选择题","q":"存放堆栈指针的ARM处理器寄存器是：","o":["R13","R14","R15","CPSR"],"a":"A","e":"R13是ARM 中默认的堆栈指针 SP，R14是链接寄存器 LR，保存函数返回地址，R15是程序计数器 PC，指向当前指令地址，CPSR是当前程序状态寄存器，存放标志位、模式位等。由此可知，本题答案为A选项。","code":0},{"id":"2163","paper":"新增试卷2","no":12,"type":"单项选择题","q":"以下ARM处理器读内存16位数据的指令是：","o":["LDRH R1,[R0]","STRH R0,[R0]","LDR R1,=0x40000200","MOV R1,R0"],"a":"A","e":"LDRH R1,[R0]是从R0指向的内存地址中，读取 16 位数据，存入R1，A选项符合题目要求；STRH R0,[R0]是把R0的数据写入内存，不是读内存，B选项不符合题目要求；LDR R1,=0x40000200是加载32 位立即数到寄存器，不是读内存操作，也不是 16 位数据，C选项不符合题目要求；MOV R1,R0是寄存器间数据传送，和内存读写完全无关，D选项不符合题目要求；综上所述，符合题目要求的指令是A选项，本题答案为A选项。","code":0},{"id":"2164","paper":"新增试卷2","no":13,"type":"单项选择题","q":"关于经典ARM处理器异常种类，以下说法错误的是：","o":["当预取指令地址不存在时，将产生指令预取中止异常","当FIQ有中断时，将产生外部中断异常","复位后，自动进入管理模式","SWI是软件中断，优先级最低"],"a":"B","e":"当处理器预取指令时，如果该指令的地址不存在或非法，就会在指令执行阶段产生指令预取中止异常，A选项说法正确；当FIQ中断信号有效时，产生的是FIQ异常，而不是外部中断（IRQ）异常，B选项说法错误；当系统复位时，ARM处理器会自动进入管理模式（SVC），这是一种特权模式，用于系统初始化，C选项说法正确；SWI是软件中断，由执行SWI指令触发，常用于系统调用。在ARM的异常优先级中，SWI和未定义指令的优先级并列最低，D选项说法正确；综上所述，B选项说法是错误的，本题答案为B选项。","code":0},{"id":"2165","paper":"新增试卷2","no":14,"type":"单项选择题","q":"关于ARM处理器，以下说法错误的是：","o":["MMU为存储器管理部件 ，负责虚拟地址到物理地址的映射","MPU是存储器保护单元，对存储器进行保护","WIC为嵌套向量中断控制器","DWT为数据观察点及跟踪单元"],"a":"C","e":"MMU即存储器管理部件，负责虚拟地址到物理地址的转换，A选项说法正确；MPU即存储器保护单元，通过设置不同内存区域的访问权限（如只读、可读写、不可执行等）来实现对存储器的保护，B选项说法正确；WIC是唤醒中断控制器，它的主要功能是在处理器进入低功耗模式后，负责将其唤醒。而嵌套向量中断控制器的正确缩写是 NVIC，C选项说法错误；DWT即数据观察点及跟踪单元， 是ARM处理器中用于调试和跟踪的组件，可以设置数据访问的观察点，D选项说法正确；综上所述，C选项说法错误，本题答案为C选项。","code":0},{"id":"2166","paper":"新增试卷2","no":15,"type":"单项选择题","q":"执行ARM指令STR R10,[R9,#4]!后，以下说法正确的是：","o":["R9中的值保持不变","R9的内容左移了4位，相当于乘以16","R10中的值保持没有改变","内存中的数据没有改变"],"a":"C","e":"指令STR R10,[R9,#4]!首先将基址寄存器 R9 的值与偏移量 #4 相加，得到目标地址 R9 + 4。然后，处理器将源寄存器 R10 中的值写入到内存地址R9 + 4中。最后计算出的新地址R9 + 4会重新写回到基址寄存器 R9 中，R9 的值会变为 R9 + 4，A选项、B选项说法错误；STR指令的功能是将源寄存器R10的值复制到内存中，这个操作不会改变源寄存器 R10 的内容，而是内存中的数据发生改变，C选项说法正确，D选项说法错误；由此可知，本题答案为C选项。","code":0},{"id":"2167","paper":"新增试卷2","no":16,"type":"单项选择题","q":"经典ARM程序状态寄存器CPSR格式如下：\n\n 有以下指令代码序列：\n        MRS R0,CPSR\n        AND R0,R0,#0xFFFFFF3F\n        MSR CPSR,R0\n执行这段代码后，以下说法正确的是：","o":["禁止外部中断，允许快速中断","允许外部中断，允许快速中断","允许外部中断，禁止快速中断","禁止外部中断，禁止快速中断"],"a":"B","e":"MRS R0,CPSR将当前程序状态寄存器 CPSR 的值读入通用寄存器 R0 中，此时 R0 保存了完整的 CPSR 状态；AND R0,R0,#0xFFFFFF3F将 R0 的值与立即数0xFFFFFF3F进行按位与运算，根据按位与运算的规则与 1 相与保持原位不变，与 0 相与清零该位 ，那么对应二进制第6、7为会变成0，再结合题目给的图片，I=0，F=0，表示允许外部中断，允许快速中断；MSR CPSR,R0将修改后的 R0 值写回 CPSR 寄存器，完成对中断屏蔽位的更新。由此可知，本题答案为B选项。","code":1},{"id":"2168","paper":"新增试卷2","no":17,"type":"单项选择题","q":"以下ARM指令正确的是：","o":["ANDS R1,[R0]","LDRB R0,[R1]","MOV  R1,0x1234","SUB R1,R1,[R0]"],"a":"B","e":"ANDS R1,[R0]中ANDS 是按位与运算指令，属于寄存器运算指令，算术 / 逻辑运算指令的操作数只能是寄存器或合法立即数，绝对不能使用内存寻址（[]），A选项错误；LDRB R0,[R1]是从R1指向的内存地址读取1 个字节，存入R0低 8 位，高 24 位清零，B选项正确； MOV R1,0x1234在 ARM 汇编中，立即数必须加 # 前缀，应写作 #0x1234，C选项错误；SUB 是减法指令，与 A 选项同理，数据处理指令的操作数不能直接是内存寻址（[R0]），D选项错误；综上所述，B选项ARM指令是正确的，本题答案为B选项。","code":0},{"id":"2169","paper":"新增试卷2","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下采用ARM指令集指令如下：\n      LDR R0,=0x23004000    \n      LDR R1,=0xAABBCCDD\n          STR  R1,[R0],#4\n指令序列执行后，以下说法正确的是：\n①R0=0x23004000                \n②R1=0xAABBCCDD\n③内存中的值不变            \n④该指令序列占用程序存储器12字节\n⑤R0=0x23004004             \n⑥内存中的值改变","o":["① ④ ⑤ ⑥","① ② ⑤ ⑥","① ② ③ ④","② ④ ⑤ ⑥"],"a":"D","e":"LDR R0,=0x23004000加载立即数R0 = 0x23004000，LDR R1,=0xAABBCCDD加载立即数R1 = 0xAABBCCDD，STR  R1,[R0],#4先把R1的值存入R0所指向的内存地址，内存中的值发生改变，然后将R0的值加上4，即R0=R0+4=0x23004000+4=0x23004004，ARM 指令集每条指令固定4字节，总共有3条指令，该指令序列占用程序存储器3×4=12字节；由此可知，② ④ ⑤ ⑥说法正确，本题答案为B选项。","code":1},{"id":"2170","paper":"新增试卷2","no":19,"type":"单项选择题","q":"下面是关于嵌入式最小硬件系统的叙述，其中错误的是：","o":["嵌入式最小硬件系统除嵌入式处理器芯片外，还包括键盘接口","嵌入式最小硬件系统除嵌入式处理器芯片外，还包括电源电路","嵌入式最小硬件系统除嵌入式处理器芯片外，还包括时钟电路","嵌入式最小硬件系统除嵌入式处理器芯片外，还包括复位电路"],"a":"A","e":"嵌入式最小硬件系统包括嵌入式处理器、电源电路、时钟电路、复位电路，如果没有片内程序存储器，还要有扩展程序存储器；由此可知，嵌入式最小硬件系统不包括键盘接口，A选项叙述错误，本题答案为A选项。","code":0},{"id":"2171","paper":"新增试卷2","no":20,"type":"单项选择题","q":"下面是关于嵌入式处理芯片的GPIO的叙述，其中错误的是：","o":["GPIO作为输入时具有缓冲功能","GPIO作为输出时具有锁存功能","GPIO也可以作为双向I/O使用","GPIO的每一个引脚的功能确定、单一"],"a":"D","e":"GPIO接口提供的输入具备缓冲功能，而输出均具有锁存功能，A选项和B选项叙述正确；有的嵌入式处理器芯片通过设置端口的方向来确定是输入功能还是输出功能，也有的嵌入式处理器直接根据读 / 写命令自动控制输入或输出的方向，GPIO也可以作为双向I/O使用，C选项叙述正确；嵌入式芯片的 GPIO 引脚大多是多功能复用引脚，可配置为普通 I/O、UART、SPI、ADC、PWM 等，功能并非固定单一，D选项叙述错误；由此可知，本题答案为D选项。","code":0},{"id":"2172","paper":"新增试卷2","no":21,"type":"单项选择题","q":"下面的选项中，不属于嵌入式处理芯片内部的定时计数组件的是：","o":["WDT","通用定时器Timer","时钟控制器","RTC"],"a":"C","e":"ARM处理芯片内部有多个定时计数组件，主要包括看门狗定时器WDT，Timer通用定时器、RTC、脉冲宽度调制器PWM，而时钟控制器负责对时钟的分配，产生不同频率的定时时钟供片内各组件作为同步时钟使用，不属于定时计数组件，因此，本题答案为C选项。","code":0},{"id":"2173","paper":"新增试卷2","no":22,"type":"单项选择题","q":"下面几种半导体存储器中，不能在系统应用时改变存储器中存储内容的存储器是：","o":["DRAM","PROM","NOR Flash","NAND Flash"],"a":"B","e":"DRAM 是易失性读写存储器，可随时改写；PROM只能一次性写入，出厂后无法在系统中改写 / 擦除，内容永久固定；NOR Flash、NAND Flash 均为可擦写的非易失性存储器，支持系统运行时改写。综上所述，不能在系统应用时改变存储器中存储内容的存储器是PROM，本题答案为B选项。","code":0},{"id":"2174","paper":"新增试卷2","no":23,"type":"单项选择题","q":"NOR Flash芯片AM29LV160的引脚图如下图所示。下面关于该芯片的叙述中，错误的是：","o":["芯片的存储容量为2MB","当该芯片与16位嵌入式处理芯片接口时可以访问芯片内部的所有存储单元","当该芯片选择16位模式时芯片的47引脚（BYTE#）应为高电平","当该芯片与8位嵌入式处理芯片接口时，不管采用怎样的连接方式，都只能访问芯片内部一半的存储单元"],"a":"D","e":"根据NOR Flash芯片AM29LV160的引脚图，外部地址线 A0～A19 共 20 条（m=20），数据线 DQ0～DQ15 共 16 条（n=16），AM29LV160 的容量 V=2?×n=22?×16 b=1 M×16 b=16 Mb 即 2 MB，A选项叙述正确；芯片支持 16 位工作模式，16 位 CPU 可直接以字为单位访问全部 1M×16bit 的存储单元，B选项叙述正确；引脚 47 是 BYTE#，当该芯片选择16位模式时芯片的47引脚（BYTE#）应为高电平，当该芯片选择8位模式时芯片的47引脚（BYTE#）应为低电平，C选项叙述正确；该芯片设计了专门的 8 位模式，只要将 BYTE# 引脚接地（低电平），并正确连接地址线（包括DQ15/A-1），8 位处理器就可以访问全部2MB位的存储空间，并不是只能问芯片内部一半的存储单元，D选项叙述错误；因此，本题答案为D选项。","code":0},{"id":"2175","paper":"新增试卷2","no":24,"type":"单项选择题","q":"SPI采用互为主从方式时的连接如下图所示，图中①、②、③、④分别为：","o":["MOSI、MISO、SCK、SSEL","MISO、MOSI、SCK、VCC","MOSI、MISO、GND、SSEL","MISO、MOSI、SCK、SSEL"],"a":"D","e":"对于互为主从的系统，主机 MISO 接收，从机 MISO 发送，主机 MOSI 发送，从机 MOSI 接收。MISO 和 MOSI 以及 SCK 都是双向的，视发送或接收而定，SSEL 电平不能固定。如果作为主机，则设置 SSEL 为低电平，迫使对方作为从机。那么图中①、②、③、④分别为MISO、MOSI、SCK、SSEL，本题答案为D选项。","code":0},{"id":"2176","paper":"新增试卷2","no":25,"type":"单项选择题","q":"下面是关于键盘的叙述，其中错误的是：","o":["嵌入式系统中的键盘常可分为线性键盘和矩阵键盘两类","采用延时消抖动的方法来消除键盘抖动时，延时时间一般小于0.1ms","采用矩阵键盘时，组成键盘时所需的IO引脚的数目少于键盘的按键个数","设计键盘接口时可以采用中断方式，即有键按下时会产生中断请求信号"],"a":"B","e":"嵌入式键盘常用分类就是线性键盘和矩阵键盘，A选项叙述正确；采用延时消抖动的方法来消除键盘抖动时，延时几十ms以上（一般抖动时间为5~30ms），B选项叙述错误；n 行 m 列矩阵键盘只需 n+m 个 IO，可接 n×m 个按键，引脚数远少于按键数，C选项叙述正确；键盘接口可以设计为中断触发方式，按键按下时产生中断，D选项叙述正确；综上所述，B选项叙述错误，本题答案为B选项。","code":0},{"id":"2177","paper":"新增试卷2","no":26,"type":"单项选择题","q":"下面关于LED及LED数码管的叙述中，错误的是：","o":["普通LED流过5~20mA时可正常发光","普通LED正常发光时的管压降与二极管一样约为0.7V","LED数码管有共阳和共阴两种接法","通过对LED数码管八个段的控制可以使其显示0~9十个数字及部分简单字母等内容"],"a":"B","e":"普通发光二极管工作电流一般在 5～20mA 范围内，A选项叙述正确；普通硅整流二极管正向压降约 0.7V，但 LED 压降远高于此，红色 LED 约 1.8～2.2V，绿色 / 蓝色一般在 3V 左右，B选项叙述错误；LED数码管有分为共阳和共阴两种接法，C选项叙述正确；8 段数码管（a～g + dp）可显示 0～9 及 A、B、C、D、E、F等字符，D选项叙述正确；综上所述，B选项叙述错误，本题答案为B选项。","code":0},{"id":"2178","paper":"新增试卷2","no":27,"type":"单项选择题","q":"下面是关于S3C2410的叙述，其中错误的是：","o":["S3C2410采用冯·诺依曼结构","S3C2410内部具有Cache存储器","S3C2410内部具有ADC","S3C2410内部具有RTC"],"a":"A","e":"S3C2410基于ARM920T内核，采用的是哈佛结构（程序与数据总线分离），不是冯?诺依曼结构，A选项叙述错误；ARM920T内置 16KB 的指令 Cache 和 16KB 的数据 Cache，S3C2410 内部包含Cache存储器，B选项叙述正确；S3C2410内部有一个8通道、逐次逼近式、分辨率为10位的ADC，C选项叙述正确；S3C2410 内置实时时钟 RTC模块，D选项叙述正确；综上所述，A选项叙述错误，本题答案为A选项。","code":0},{"id":"2179","paper":"新增试卷2","no":28,"type":"单项选择题","q":"S3C2410内部的电源管理模块有4种模式，其相互关系如下图所示。图中①、②、③、④分别为：","o":["掉电、慢速、休眠、正常","正常、慢速、掉电、休眠","休眠、正常、慢速、掉电","慢速、休眠、慢速、掉电"],"a":"C","e":"在正常模式下，当慢速控制位 SLOW_BIT=1 时进入慢速模式；当休眠控制位 IDLE_BIT=1 时进入休眠模式；当掉电控制位 POWER_BIT=1 时进入掉电模式；任何情况下复位操作均自动进入正常工作模式，或在掉电模式和休眠模式下，只要有任何一个外部中断 EINT [0：23] 或 RTC 时钟中断发生，均将返回到正常模式；由此可知，图中①、②、③、④分别为休眠、正常、慢速、掉电，本题答案为C选项。","code":0},{"id":"2180","paper":"新增试卷2","no":29,"type":"单项选择题","q":"下列关于嵌入式系统软件构成部件的各组术语中，含义最相似的是：","o":["引导加载程序、板级支持包","操作系统内核、发行版","HAL、BSP","设备驱动程序、引导加载程序"],"a":"C","e":"引导加载程序（Bootloader）是启动时运行的一小段代码（如 U-Boot）；而板级支持包（BSP）是一个完整的支持包，通常包含了 Bootloader 以及后续运行所需的驱动。操作系统内核只是系统的核心（如 Linux Kernel）；发行版则是内核加上各种工具、库、管理软件的完整集合（如 Ubuntu, Android）。硬件抽象层（HAL）是将嵌入式系统软件中位于操作系统层与硬件之间的、与硬件相关的软件层次的统称，板级支持包（BSP）则可以被看作是硬件抽象层在特定操作系统环境下的具体实现，也有一些文献并不区分 HAL 和 BSP，把二者当作同义词。驱动程序负责在系统运行时控制特定外设（如显卡、传感器）；引导加载程序（Bootloader） 只负责系统上电后的初始化和内核引导，任务完成后即退出。综上所述，含义最相似的是HAL、BSP，本题答案为C选项。","code":0},{"id":"2181","paper":"新增试卷2","no":30,"type":"单项选择题","q":"下列关于BSP开发的描述中，正确的是：","o":["BSP在系统上电复位之前负责系统初始软硬件环境的建立","BSP可以支持不同的操作系统运行于其上","BSP是运行在嵌入式操作系统之上的软件","在BSP运行之前，操作系统的调试工具都不可用"],"a":"D","e":"BSP在系统复位之后负责系统软硬件环境的初始化，并不是之前，A选项描述错误；BSP 是特定于操作系统和特定于硬件平台的。它的目的是为某个特定的操作系统提供与底层硬件交互的接口。虽然不同系统的 BSP 结构可能相似，但 BSP 本身不能直接支持不同的操作系统运行，B选项描述错误；BSP 位于硬件和嵌入式操作系统之间。它是操作系统的底层支撑部分，负责屏蔽硬件细节，为操作系统内核提供标准化的底层驱动和服务，而不是运行在操作系统之上，C选项描述错误；由于操作系统的调试工具（如串口调试、以太网调试等）依赖于 BSP 提供的底层驱动支持，因此在 BSP 完成初始化并运行之前，这些基于操作系统的调试手段是无法使用的。此时通常需要使用硬件仿真器（如 JTAG）进行调试，D选项描述正确；因此，本题答案为D选项。","code":0},{"id":"2182","paper":"新增试卷2","no":31,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["嵌入式系统上电复位后，由引导加载程序建立多任务运行环境","高端bootloader能用一套二进制代码支持多种体系结构的处理器","一些功能强大的bootloader能同时支持启动加载（bootloading）和下载（downloading）这两种工作模式","因为RAM存储器可以随机读出，不需要额外的驱动程序，所以bootloader通常会把存放在ROM存储器中的操作系统和应用程序映像拷贝到RAM存储器中执行"],"a":"C","e":"引导加载程序在嵌入式系统上电复位后首先运行引导加载程序，它负责系统的上电自检、硬件初始化、建立存储空间映射、配置系统参数、建立上层软件的运行环境，并加载和启动操作系统，而不是建立多任务运行环境，多任务运行环境的建立是由操作系统内核在启动后完成的，A选项叙述错误； 虽然一些高端 Bootloader（如 U-Boot）的代码库支持多种体系结构（ARM, MIPS, x86 等），但最终编译出来的一套二进制代码只能针对特定的硬件平台。由于不同架构的指令集完全不同，二进制代码是不可能通用的，B选项叙述错误；一些功能强大的bootloader能同时支持启动加载（bootloading）和下载（downloading）这两种工作模式，典型的做法是：在进入启动加载模式之前延迟数秒钟并通过终端界面给出提示，如果用户按任意键则切换到下载模式，否则继续进行正常的启动加载，C选项叙述正确；ROM存储器可以随机独处，不论是在ROM中在线执行代码，还是从ROM中读出信息，都不需要额外的驱动程序，D选项叙述错误；综上所述，C选项叙述正确，本题答案为C选项。","code":0},{"id":"2183","paper":"新增试卷2","no":32,"type":"单项选择题","q":"下列关于驱动程序的陈述中，不正确的是：","o":["驱动程序通常以若干函数的集合的形式出现","很多操作系统要求用户的应用程序必须通过驱动程序才能访问硬件","VxWorks嵌入式操作系统允许应用程序绕过操作系统直接访问硬件","μC/OS-II操作系统把I/O设备抽象成设备文件"],"a":"D","e":"驱动程序本质上是硬件与操作系统之间的接口，它通常包含一组特定的例程（如 open, close, read, write等），供操作系统内核调用来控制硬件，A选项叙述正确；在具有保护模式的操作系统（如 Linux, Windows, macOS）中，为了系统的安全与稳定，应用程序运行在用户态，无法直接操作底层硬件，必须通过系统调用进入内核态，由驱动程序代为执行，B选项叙述正确； VxWorks 是一种实时操作系统，它不像通用 OS 那样有严格的用户空间和内核空间隔离。为了追求极致的执行效率和实时性，VxWorks 允许开发者在应用程序中直接操作寄存器或内存映射 I/O，C选项叙述正确；μC/OS-II是一个极简的、占内核极小的实时内核。它主要负责任务调度、信号量、消息队列等，并没有提供统一的设备管理框架或文件系统接口；Linux等类Unix操作系统会把I/O设备抽象成设备文件，D选项叙述错误；因此，本题答案为D选项。","code":0},{"id":"2184","paper":"新增试卷2","no":33,"type":"单项选择题","q":"下列关于嵌入式系统底层软件的陈述中，不正确的是：","o":["Linux嵌入式操作系统只包括操作系统内核，不包括设备驱动程序","BSP中包含硬件相关的设备驱动程序","一种嵌入式操作系统的BSP不可能用于其他嵌入式操作系统","驱动程序是对硬件操作的抽象，以实现高层软件对硬件的访问"],"a":"A","e":"Linux 嵌入式操作系统**包含了设备驱动程序**。在 Linux 的架构中，驱动程序通常作为内核的一部分，用于管理和控制硬件资源。一个只有内核而没有驱动程序的操作系统是无法与硬件交互的，A选项叙述错误；BSP的作用是为上层操作系统提供底层支撑，它确实包含了与硬件密切相关的设备驱动程序以及初始化代码，使操作系统能够运行在特定的硬件平台上，B选项叙述正确；BSP 是高度特定的。它不仅与特定的**硬件电路板**相关，还与特定的**操作系统内核**相关。因为不同操作系统的驱动模型、中断处理机制和 API 接口完全不同，所以为 Linux 编写的 BSP 是无法直接给 VxWorks 或 RT-Thread 使用的，C选项叙述正确；驱动程序是指直接与硬件相互作用并控制硬件的软件。从驱动程序调用者的角度看，驱动程序是对硬件操作的抽象，以实现高层软件对硬件的访问，D选项叙述正确；综上所述，A选项叙述错误，本题答案为A选项。","code":0},{"id":"2185","paper":"新增试卷2","no":34,"type":"单项选择题","q":"下列名词术语中，与嵌入式底层软件无关的是：","o":["BSP","Bootloader","U-Boot","GLIBC"],"a":"D","e":"BSP是板级支持包，属于嵌入式底层，负责适配硬件； Bootloader是引导加载程序，是典型嵌入式底层软件；U-Boot是最常用的开源 Bootloader，也是嵌入式底层软；GLIBC是GNU C 标准库，属于用户态运行库，不属于嵌入式底层。由此可知，本题答案为D选项。","code":0},{"id":"2186","paper":"新增试卷2","no":35,"type":"单项选择题","q":"下列关于实时操作系统的陈述中，正确的是：","o":["实时调度机制的目标是在峰值负载条件下能满足所有任务的时限要求","任务切换时间包含保存当前运行任务上下文的时间和调度程序选中新任务的时间两部分","在实时操作系统中必须允许用户细粒度地控制任务的优先级","衡量实时操作系统性能的最重要指标是其在重负载条件下的吞吐率"],"a":"C","e":"实时调度机制的目标确实是满足任务的时限（Deadline），但在峰值负载条件下满足所有任务的时限通常是理想状态或仅限于硬实时系统的极极端情况。在实际设计中，调度机制的目标通常是保证可预测性和确定性。在过载情况下，系统通常会根据优先级放弃次要任务，以保证关键任务的完成，A选项叙述错误；任务切换时间包括保存当前运行任务上下文的时间、调度程序选中新任务的时间和恢复新任务上下文的时间三部分，B选项叙述错误；为了保证任务的实时性，操作系统必须提供灵活且细粒度的优先级控制。这使得开发者能够根据任务的紧迫程度（如时限的长短）精确分配优先级，从而确保高优先级的紧急任务能够抢占低优先级任务并获得及时的CPU响应，C选项叙述正确； 吞吐率是通用操作系统（如Linux或Windows）追求的重要指标。对于实时操作系统而言，最重要的指标是实时性和确定性，即系统必须在规定的时间内对外部事件做出响应，而不是单位时间内处理了多少任务，D选项叙述错误；综上所述，C选项叙述正确，本题答案为C选项。","code":0},{"id":"2187","paper":"新增试卷2","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，正确的是：","o":["QNX是软实时操作系统","Mach是商业嵌入式操作系统","RTEMS、Tornado和FreeRTOS都是免费嵌入式操作系统","系统相对空闲时，实时性高的操作系统和实时性较低的操作系统的性能有可能差异不大"],"a":"D","e":"QNX是硬实时操作系统，不是软实时操作系统，A选项叙述错误；Mach不是商业嵌入式操作系统，Mach 是由卡内基梅隆大学（CMU）开发的一个微内核操作系统内核，它更多地被视为学术研究的成果，虽然它是后来许多商业系统（如 macOS 的内核 XNU）的基础，但其本身通常不被定义为商业嵌入式操作系统，B选项叙述错误；RTEMS 和 FreeRTOS*是开源且免费的，但Tornado 不是免费的操作系统，Tornado是 Wind River（风河）公司开发的一套嵌入式实时操作系统开发环境，配套的内核是著名的 VxWorks，属于收费的产品，C选项叙述错误；实时操作系统与非实时系统的核心区别在于确定性和最坏情况下的响应时间。当系统负载非常轻、资源极度充裕时，普通操作系统也能迅速处理任务，此时在宏观表现上，用户可能感觉不到它与高实时系统之间的性能差异，D选项叙述正确；由此可知，本题答案为D选项。","code":0},{"id":"2188","paper":"新增试卷2","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，正确的是：","o":["用户必须先开启时钟节拍器后再调用OSStart()启动多任务调度","μC/OS-II实时操作系统内核包含μC/FS文件系统、μC/GUI图形软件等模块","绝大多数μC/OS-II服务的执行时间与系统中运行的任务个数无关","如果任务在被挂起时正在等待延时，则任务将转入休眠态"],"a":"C","e":"用户应当在调用 OSStart() 启动多任务调度之后，在第一个优先级最高的任务中开启时钟节拍器。如果在调用 OSStart() 之前开启，时钟中断可能会在系统初始化尚未完成时触发，导致系统崩溃，A选项叙述错误；\nμC/OS-II 内核本身只包含任务调度、任务间通信与同步（信号量、邮箱、消息队列）、内存管理和时间管理等核心功能。μC/FS（文件系统）和 μC/GUI（图形界面）是与之配套的独立中间件模块，不属于内核（Kernel）范畴，B选项叙述错误；\nμC/OS-II 被称为确定性实时操作系统。它的任务切换时间和大多数系统服务的执行时间是恒定的，不随任务数量的增加而改变（即时间复杂度为 O(1)）。这是通过高效的优先级就绪表算法（查表法）实现的，C选项叙述正确；在 μC/OS-II 中，休眠态指的是任务代码已经驻留内存，但尚未交给内核管理的状态。如果一个任务在等待延时（等时状态）时被挂起，它会进入挂起态或组合态（比如挂起且等待延时）。只有通过删除任务的操作，任务才会回到休眠态，D选项叙述错误；综上所述，C选项叙述正确，本题答案为C选项。","code":0},{"id":"2189","paper":"新增试卷2","no":38,"type":"单项选择题","q":"下列关于Linux操作系统的陈述中，正确的是：","o":["Linux是由林纳斯.托瓦兹受当时流行的MS-DOS启发而开发的免费操作系统","Linux操作系统可以分为两个层次：上层运行在用户空间；下层运行在内核空间","μCLinux必须运行在支持MMU的微控制器上","严格来说，Linux并不是操作系统，而是操作系统的一个组成部件。Linux内核通常与一系列应用程序、系统库和开发工具等组合成可用的完整操作系统，其确切名称为MontaVista Linux操作系统"],"a":"B","e":"Linux 是 Linus 受 Minix 启发开发，并非 MS-DOS；且 Linux 内核开源免费，但完整发行版不一定完全免费，A选项叙述错误；Linux 操作系统可以分为两个层次：上层（应用程序及工具软件，以及 GNU C 运行库 GLIBC）运行在用户空间；下层即 Linux 内核，运行在内核空间，B选项叙述正确；μClinux 专门针对没有或者不使用存储管理部件（MMU）的处理器，并且针对嵌入式系统做了许多代码和运行时小型化的工作，适用于内存容量很小的嵌入式系统，C选项叙述错误；严格说 Linux 确实常指内核，需搭配 GNU 等软件构成完整系统，正确名称是 GNU/Linux，而非 MontaVista Linux（它只是一个商业发行版），D选项叙述错误；综上所述，B选项叙述正确；本题答案为B选项。","code":0},{"id":"2190","paper":"新增试卷2","no":39,"type":"单项选择题","q":"若把嵌入式系统设计开发过程分为：系统需求分析与规格说明、系统设计、构件设计、系统集成与测试等几个阶段。下面的说法中，正确的是：","o":["在系统需求分析阶段，必须了解用户对嵌入式系统的功能需求，而尺寸、大小、成本等需求不需了解","系统集成与测试阶段应该把系统所需部件全部集成后再进行测试","系统设计阶段，必须确定哪些功能由硬件完成，哪些功能由软件完成","构件设计阶段的任务就是进行分析并选择现成的芯片或模块"],"a":"C","e":"需求分析不仅要了解功能需求，还必须明确非功能需求，包括尺寸、功耗、成本、大小、性能等，A选项叙述错误；在系统集成阶段并不是把所有的构件连接在一起就行了，这个阶段通常需要反复地对系统进行测试，修正构件中的错误，最后把所有的软件程序进行固化，B选项叙述错误；系统设计也称为概要设计或总体设计，这个阶段要完成的任务是：根据规格说明书中所描述的系统需要实现的功能，确定如何实现这些功能的硬件和软件结构，特别是软件和硬件功能的划分，即哪些功能由硬件完成，哪些功能由软件完成，以求满足系统对功能、性能、成本、功耗等的要求，C选项叙述正确；构件设计也称为详细设计，在这个阶段，设计者就需要设计或选择符合系统结构和规格说明中所需要的具体构件。构件通常既包括硬件（如 FPGA、专用功能芯片、电路板等），也包括软件模块，D选项叙述错误；综上所述，C选项叙述正确，本题答案为C选项。","code":0},{"id":"2191","paper":"新增试卷2","no":40,"type":"单项选择题","q":"若某个嵌入式系统设计了支持以太网通信的接口电路，选用AX88796作为以太网控制器芯片，其片选信号CS引脚连到S3C2410芯片的nGCS3上。那么，读写AX88796芯片内部寄存器的首地址是：","o":["0x10000000","0x18000000","0x20000000","0x28000000"],"a":"B","e":"S3C2410的存储控制器将外部设备地址空间共1GB，有8个存储块，每个存储块大小为128MB，对应一个片选信号（nGCS0~nGCS7），每个块128MB即2的27次方字节（对应十六进制数就是0x8000000），每个块首地址的访问，分别由nGCSX控制，X随着块号（0~7）依次递增。因此每个块内存空间的首地址为：\nnGCS0=0x00000000\nnGCS1=0x08000000\nnGCS2=0x10000000\nnGCS3=0x18000000\nnGCS4=0x20000000\nnGCS5=0x28000000\nnGCS6=0x30000000\nnGCS7=0x38000000\n根据题意，其片选信号CS引脚连到S3C2410芯片的nGCS3上，那么读写AX88796芯片内部寄存器的首地址是0x18000000，因此，本题答案为B选项。","code":0}]};
const ITEMS = DATA.items, PAPERS = DATA.papers;
const KEY = 'qrs3quiz_v1';
let st = load();

function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    return Object.assign({rec:{}, wrong:{}, master:{}, cur:null, mode:'drill', order:'seq', sel:null, onlyNew:false}, o);
  }catch(e){
    return {rec:{}, wrong:{}, master:{}, cur:null, mode:'drill', order:'seq', sel:null, onlyNew:false};
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 状态 ---------- */
let list = [];        // 当前题集（题目对象数组）
let idx = 0;          // 当前索引
let runAns = {};      // 本轮作答 id->选项
let locked = false;   // 练习模式单题是否已锁定
let src = '';         // 'paper' | 'wrong'

function recOf(id){ return st.rec[id] || null; }
function inWrong(id){ return !!st.wrong[id]; }
function isMaster(id){ return !!st.master[id]; }
function toggleMaster(id){ if(st.master[id]) delete st.master[id]; else st.master[id] = 1; save(); }
function markWrong(id){ st.wrong[id] = {t:Date.now(), fixed:0}; }
function markFixed(id){ if(st.wrong[id]) st.wrong[id].fixed = 1; }

/* ---------- 界面①：试卷选择（卡片式） ---------- */
function paperCard(name, items, isAll){
  const n  = items.length;
  const dn = items.filter(i=> recOf(i.id)).length;
  const ok = items.filter(i=>{ const r = recOf(i.id); return r && r.last===1; }).length;
  const wg = items.filter(i=> st.wrong[i.id] && !st.wrong[i.id].fixed).length;
  const mn = items.filter(i=> isMaster(i.id)).length;
  const dp = n ? Math.round(dn/n*100) : 0;
  const mp = n ? Math.round(mn/n*100) : 0;
  const on = isAll ? (!st.sel || st.sel==='ALL') : (st.sel===name);
  const b = document.createElement('button');
  b.className = 'pcard' + (on ? ' on' : '');
  b.innerHTML =
      '<div class="pn">'+esc(name)+(on?'<span class="tag">已选</span>':'')+'</div>'
    + '<div class="pm">'
    +   '<span>题量 <b>'+n+'</b></span>'
    +   '<span>已答 <b>'+dn+'</b></span>'
    +   '<span>正确率 <b>'+(dn?Math.round(ok/dn*100):0)+'%</b></span>'
    +   '<span>错题 <b>'+wg+'</b></span>'
    +   '<span>已掌握 <b>'+mn+'</b></span>'
    + '</div>'
    + '<div class="bar"><i style="width:'+dp+'%"></i></div>'
    + '<div class="bar"><i style="width:'+mp+'%;background:#8fb2ff"></i></div>';
  b.onclick = ()=>{ st.sel = isAll ? 'ALL' : name; save(); renderPapers(); };
  return b;
}
function renderPapers(){
  const box = document.getElementById('papers');
  box.innerHTML = '';
  box.appendChild(paperCard('全部题目', ITEMS, true));
  PAPERS.forEach(p=>{
    box.appendChild(paperCard(p, ITEMS.filter(i=> i.paper===p), false));
  });
  const sel = (!st.sel || st.sel==='ALL') ? null : st.sel;
  document.getElementById('totalN').textContent =
    sel ? ITEMS.filter(i=>i.paper===sel).length : ITEMS.length;
}

/* ---------- 界面切换 ---------- */
function enterQuiz(){
  document.getElementById('pick').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');
  document.getElementById('result').classList.add('hide');
  const tb = document.querySelector('.tabs'); if(tb) tb.classList.add('hide');
  window.scrollTo({top:0, behavior:'smooth'});
}
function backPick(){
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  document.getElementById('pick').classList.remove('hide');
  const tb = document.querySelector('.tabs'); if(tb) tb.classList.remove('hide');
  list = []; idx = 0; runAns = {}; locked = false; showAnsExam = false;
  renderPapers(); renderStat(); renderWrong();
  window.scrollTo({top:0, behavior:'smooth'});
}
function curName(){
  if(src === 'wrong') return '错题重做';
  const m = {}; list.forEach(i=> m[i.paper] = 1);
  const ks = Object.keys(m);
  return ks.length === 1 ? ks[0] : '全部题目';
}
const MODE_CN = {learn:'学习模式', drill:'练习模式', exam:'考试模式'};

/* ---------- 开始 ---------- */
function buildList(pool){
  let arr = pool.slice();
  if(st.order === 'rand') arr.sort(()=>Math.random()-0.5);
  else arr.sort((a,b)=> (PAPERS.indexOf(a.paper)-PAPERS.indexOf(b.paper)) || (a.no-b.no));
  return arr;
}
function start(kind, pool){
  src = kind;
  list = buildList(pool);
  idx = 0; runAns = {}; locked = false;
  st.cur = {kind:kind, ids:list.map(i=>i.id)};
  if(kind === 'paper') st.sel = st.sel || 'ALL';
  save();
  enterQuiz();
  renderQ();
}
document.getElementById('start').onclick = ()=>{
  const sel = (!st.sel || st.sel==='ALL') ? null : st.sel;
  let pool = sel ? ITEMS.filter(i=>i.paper===sel) : ITEMS.slice();
  if(st.mode === 'learn' && document.getElementById('onlyNew').checked){
    pool = pool.filter(i=> !isMaster(i.id));
  }
  if(!pool.length){ alert('没有可看的题目（可能全部已标记为掌握）'); return; }
  start('paper', pool);
};
document.getElementById('conti').onclick = ()=>{
  if(!st.cur || !st.cur.ids || !st.cur.ids.length){ alert('没有进行中的记录，请先开始。'); return; }
  const set = new Set(st.cur.ids);
  src = st.cur.kind || 'paper';
  list = buildList(ITEMS.filter(i=>set.has(i.id)));
  idx = 0; runAns = {}; locked = false;
  // 跳到第一道未作答的题
  for(let i=0;i<list.length;i++){ if(!recOf(list[i].id)){ idx = i; break; } }
  enterQuiz();
  renderQ();
};
document.getElementById('reset').onclick = ()=>{
  const sel = (!st.sel || st.sel==='ALL') ? null : st.sel;
  if(!sel){ if(!confirm('当前选择为「全部」，将清空所有答题记录，确定？')) return; }
  else if(!confirm('清空「'+sel+'」的答题记录？')) return;
  ITEMS.forEach(i=>{ if(!sel || i.paper===sel){ delete st.rec[i.id]; delete st.wrong[i.id]; delete st.master[i.id]; } });
  st.cur = null; save(); renderPapers(); renderStat(); renderWrong();
  alert('已清空');
};
const HINTS = {
  learn: '学习模式：答案与解析直接展开，不作答、不计分。可把看懂的题标记为「已掌握」，下次用「只看未掌握」过滤。快捷键：<kbd>←</kbd><kbd>→</kbd> 翻页 · <kbd>空格</kbd> 下一题 · <kbd>M</kbd> 标记掌握',
  drill: '练习模式：选完立即判分并展开解析，答错的题自动进错题本。快捷键：<kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> 选择 · <kbd>←</kbd><kbd>→</kbd> 翻页 · <kbd>空格</kbd> 下一题',
  exam:  '考试模式：只记录选择，交卷后统一判分并生成逐题回顾。快捷键同练习模式'
};
function syncMode(){
  document.querySelectorAll('#mode button').forEach(x=> x.classList.toggle('on', x.dataset.m===st.mode));
  document.getElementById('onlyNewWrap').style.display = (st.mode==='learn') ? 'flex' : 'none';
  document.getElementById('modeHint').innerHTML = HINTS[st.mode] || '';
}
document.querySelectorAll('#mode button').forEach(b=>{
  b.onclick = ()=>{ st.mode = b.dataset.m; save(); syncMode(); };
});
document.getElementById('onlyNew').onchange = e=>{ st.onlyNew = e.target.checked; save(); };
document.querySelectorAll('#order button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('#order button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); st.order = b.dataset.o; save();
  };
});
(function initSeg(){
  document.querySelectorAll('#order button').forEach(x=>x.classList.toggle('on', x.dataset.o===st.order));
  document.getElementById('onlyNew').checked = !!st.onlyNew;
  syncMode();
})();

/* ---------- 题目渲染 ---------- */
function goNext(){
  if(idx < list.length-1){ idx++; renderQ(); window.scrollTo({top:0, behavior:'smooth'}); }
}

function renderQ(){
  const q = list[idx]; if(!q) return;
  const prev = recOf(q.id);
  const drill = (st.mode === 'drill');
  const learn = (st.mode === 'learn');
  const chosen = runAns[q.id] || null;          // 本轮作答
  const prevPick = prev ? prev.pick : null;     // 历史作答
  const answered = !!chosen;
  locked = (drill && answered) || learn;
  const mas = isMaster(q.id);

  const doneN = learn
    ? list.filter(i=> isMaster(i.id)).length
    : list.filter(i=> (runAns[i.id] || recOf(i.id))).length;
  const doneLabel = learn ? '已掌握' : '已答';
  let h = '';
  h += '<div class="qbar">'
     + '<button class="btn sm" id="backPick">← 试卷列表</button>'
     + '<span class="qi">当前：<b>'+esc(curName())+'</b></span>'
     + '<span class="qi">模式：<b>'+(MODE_CN[st.mode]||st.mode)+'</b></span>'
     + '<span class="spacer"></span>'
     + '<span class="qi">进度 <b>'+(idx+1)+'</b> / '+list.length+'　'+doneLabel+' '+doneN+'</span>'
     + '</div>';
  h += '<div class="card">';
  h += '<div class="meta"><span>'+esc(q.paper)+' · 第 '+q.no+' 题 · '+esc(q.type)
     + (learn && mas ? ' · <b style="color:var(--brand)">已掌握</b>' : '') + '</span>'
     + '<span>'+(idx+1)+' / '+list.length+'　'+doneLabel+' '+doneN+'</span></div>';
  h += '<div class="bar"><i style="width:'+Math.round(doneN/list.length*100)+'%"></i></div>';

  h += '<div class="stem'+(q.code?' code':'')+'">'+esc(q.q)+'</div>';

  h += '<div class="opts">';
  ['A','B','C','D'].forEach((k,i)=>{
    if(!q.o[i]) return;
    let cls = 'opt';
    const showAns = learn || (drill && answered) || (!drill && runAns[q.id] && showAnsExam);
    if(chosen === k) cls += ' sel';
    if(showAns){
      if(k === q.a) cls += ' right';
      else if(chosen === k) cls += ' wrong';
    }
    h += '<button class="'+cls+'" data-k="'+k+'"'+(locked?' disabled':'')+'>'
       + '<span class="k">'+k+'</span><span class="v">'+esc(q.o[i])+'</span></button>';
  });
  h += '</div>';

  if(drill && answered){
    const ok = chosen === q.a;
    h += '<div class="ana"><div class="lb">'
       + '<span class="badge '+(ok?'ok':'bad')+'">'+(ok?'回答正确':'回答错误')+'</span>'
       + '<span>正确答案 <b>'+q.a+'</b></span>'
       + (inWrong(q.id) ? '<span style="color:var(--warn)">已收入错题本</span>' : '')
       + '</div><div class="tx">'+esc(q.e || '（本题无解析）')+'</div></div>';
  }else if(learn){
    h += '<div class="ana"><div class="lb"><span class="badge ok">正确答案 '+q.a+'</span>'
       + (mas ? '<span style="color:var(--brand)">已标记为掌握</span>' : '<span style="color:var(--sub)">看懂了就点下方「标记为已掌握」</span>')
       + '</div><div class="tx">'+esc(q.e || '（本题无解析）')+'</div></div>';
  }else if(prev && !answered){
    h += '<div class="hint">上次作答：<b>'+esc(prevPick||'-')+'</b>'
       + (prev.last===1 ? ' <span class="badge ok">正确</span>' : ' <span class="badge bad">错误</span>')
       + '　（本题可重新作答）</div>';
  }

  h += '<div class="foot">';
  h += '<button class="btn sm" id="prevB"'+(idx===0?' disabled':'')+'>上一题</button>';
  h += '<button class="btn sm" id="nextB"'+(idx===list.length-1?' disabled':'')+'>下一题</button>';
  if(learn){
    h += '<button class="btn '+(mas?'':'pri')+'" id="masterB">'+(mas?'✓ 已掌握（点击取消）':'标记为已掌握')+'</button>';
    h += '<button class="btn sm" id="masterAllB">全部标记为已掌握</button>';
  }
  h += '<span class="spacer"></span>';
  if(!drill && !learn) h += '<button class="btn pri" id="submitB">交卷判分</button>';
  else if(drill && list.filter(i=>runAns[i.id]).length > 0) h += '<button class="btn" id="submitB">生成本轮小结</button>';
  h += '</div>';
  h += '</div>';

  h += '<div class="card"><h2 class="t">题号导航 <span class="tag">点击跳转</span></h2><div class="grid">';
  list.forEach((it,i)=>{
    const r = runAns[it.id] || recOf(it.id);
    let c = 'gn';
    if(isMaster(it.id)) c += ' mas';
    else if(r) c += (r.pick === it.a) ? ' right' : ' wrong';
    if(i === idx) c += ' cur';
    h += '<button class="'+c+'" data-i="'+i+'">'+(i+1)+'</button>';
  });
  h += '</div></div>';

  const box = document.getElementById('quiz');
  box.innerHTML = h;
  const bpk = document.getElementById('backPick'); if(bpk) bpk.onclick = backPick;
  box.querySelectorAll('.opt').forEach(b=> b.onclick = ()=> pick(b.dataset.k));
  box.querySelectorAll('.gn').forEach(b=> b.onclick = ()=>{ idx = +b.dataset.i; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); });
  const p = document.getElementById('prevB'); if(p) p.onclick = ()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); } };
  const n = document.getElementById('nextB'); if(n) n.onclick = goNext;
  const s = document.getElementById('submitB'); if(s) s.onclick = submitExam;
  const mb = document.getElementById('masterB');
  if(mb) mb.onclick = ()=>{ toggleMaster(list[idx].id); renderStat(); renderQ(); };
  const ma = document.getElementById('masterAllB');
  if(ma) ma.onclick = ()=>{
    if(!confirm('把当前 '+list.length+' 道题全部标记为已掌握？')) return;
    list.forEach(i=> st.master[i.id] = 1); save(); renderStat(); renderQ();
  };
}
let showAnsExam = false;

function pick(k){
  const q = list[idx]; if(!q) return;
  if(locked) return;
  if(st.mode === 'exam'){ runAns[q.id] = k; showAnsExam = false; renderQ(); return; }
  // 练习模式：立即判分并记账
  runAns[q.id] = k;
  const ok = (k === q.a);
  const r = st.rec[q.id] || {n:0, ok:0, pick:null};
  r.n++; if(ok){ r.ok++; markFixed(q.id); } else { markWrong(q.id); }
  r.pick = k; r.last = ok ? 1 : 0;
  st.rec[q.id] = r;
  save();
  renderQ();
}

function submitExam(){
  const ans = list.map(i=> runAns[i.id] || (recOf(i.id)? recOf(i.id).pick : null));
  if(ans.filter(Boolean).length < list.length){
    if(!confirm('还有 '+(list.length-ans.filter(Boolean).length)+' 题未作答，确定交卷？')) return;
  }
  let right = 0;
  list.forEach(i=>{
    const p = runAns[i.id] || (recOf(i.id)? recOf(i.id).pick : null);
    const ok = p === i.a;
    if(p){
      const r = st.rec[i.id] || {n:0, ok:0, pick:null};
      r.n++; if(ok){ r.ok++; markFixed(i.id); } else markWrong(i.id);
      r.pick = p; r.last = ok?1:0; st.rec[i.id] = r;
    }
    if(ok) right++;
  });
  save();
  showAnsExam = true;
  renderResult(right, list.length);
}

function renderResult(right, total){
  const pct = total ? Math.round(right/total*100) : 0;
  const color = pct>=80?'var(--ok)':(pct>=60?'var(--warn)':'var(--bad)');
  let h = '<div class="card">';
  h += '<h2 class="t">本轮小结</h2>';
  h += '<div class="score"><span class="big" style="color:'+color+'">'+right+'</span><span class="u">/ '+total+' 正确</span>'
     + '<span class="u">正确率 <b style="color:'+color+'">'+pct+'%</b></span></div>';
  h += '<div class="row" style="margin-top:12px">'
     + '<button class="btn pri sm" id="reviewWrong">只回顾错题（'+ (total-right) +'）</button>'
     + '<button class="btn sm" id="backAll">返回全部题目</button>'
     + '<button class="btn sm" id="again">再刷一次</button>'
     + '<button class="btn sm" id="backPick2">← 返回试卷列表</button></div>';
  h += '</div>';
  h += '<div class="card"><h2 class="t">逐题回顾</h2><div class="list" id="revList"></div></div>';
  const box = document.getElementById('result');
  box.innerHTML = h; box.classList.remove('hide');
  document.getElementById('quiz').classList.add('hide');

  const rl = document.getElementById('revList');
  rl.innerHTML = list.map((i,n)=>{
    const p = runAns[i.id] || (recOf(i.id)? recOf(i.id).pick : null);
    const ok = p === i.a;
    return '<div class="li" data-n="'+n+'">'
      + '<div class="h"><span class="badge '+(ok?'ok':'bad')+'">'+(ok?'正确':'错误')+'</span>'
      + '<span>'+esc(i.paper)+' 第'+i.no+'题</span>'
      + '<span>你选：<b>'+(p||'未答')+'</b>　正确：<b>'+i.a+'</b></span></div>'
      + '<div class="q">'+esc(i.q)+'</div>'
      + (i.o[0] ? '<div class="ops">'+['A','B','C','D'].map((k,j)=> i.o[j] ?
          '<span style="font-size:13px;'+(k===i.a?'color:var(--ok);font-weight:600':'')+'">'+k+'. '+esc(i.o[j])+'</span>' : '').join('')+'</div>' : '')
      + '<div class="e">'+esc(i.e || '（本题无解析）')+'</div></div>';
  }).join('');

  document.getElementById('reviewWrong').onclick = ()=>{
    rl.querySelectorAll('.li').forEach(el=>{
      const n = +el.dataset.n; const i = list[n];
      const p = runAns[i.id] || (recOf(i.id)? recOf(i.id).pick : null);
      if(p === i.a) el.style.display='none';
    });
  };
  document.getElementById('backAll').onclick = ()=>{
    rl.querySelectorAll('.li').forEach(el=> el.style.display='');
  };
  document.getElementById('backPick2').onclick = backPick;
  document.getElementById('again').onclick = ()=>{ start(src, list.slice()); };
  window.scrollTo({top:0, behavior:'smooth'});
  renderWrong(); renderStat();
}

/* ---------- 错题本 ---------- */
function renderWrong(){
  const showFixed = document.getElementById('showFixed').checked;
  const ids = Object.keys(st.wrong).filter(id=> showFixed || !st.wrong[id].fixed);
  const box = document.getElementById('wlist');
  document.getElementById('wcount').textContent =
    '未攻克 ' + Object.values(st.wrong).filter(w=>!w.fixed).length
    + ' · 已攻克 ' + Object.values(st.wrong).filter(w=>w.fixed).length;
  if(!ids.length){ box.innerHTML = '<div class="card"><div class="empty">错题本是空的 —— 先去刷几套题吧。</div></div>'; return; }
  const byId = {}; ITEMS.forEach(i=> byId[i.id] = i);
  const items = ids.map(id=> byId[id]).filter(Boolean);
  let h = '<div class="card"><h2 class="t">错题列表 <span class="tag">'+items.length+' 道</span></h2><div class="list">';
  items.forEach(i=>{
    const r = recOf(i.id) || {};
    const fixed = st.wrong[i.id].fixed;
    h += '<div class="li">'
      + '<div class="h"><span class="badge '+(fixed?'ok':'bad')+'">'+(fixed?'已攻克':'未攻克')+'</span>'
      + '<span>'+esc(i.paper)+' 第'+i.no+'题</span>'
      + '<span>正确：<b>'+i.a+'</b></span>'
      + (r.n ? '<span>正确率 '+Math.round(r.ok/r.n*100)+'%（'+r.ok+'/'+r.n+'）</span>' : '')
      + '<span class="spacer" style="flex:1"></span>'
      + '<button class="btn sm" data-open="'+i.id+'">查看解析</button>'
      + '<button class="btn sm" data-del="'+i.id+'">移出错题本</button>'
      + '</div>'
      + '<div class="q">'+esc(i.q)+'</div>'
      + '<div class="ops">'+['A','B','C','D'].map((k,j)=> i.o[j] ?
          '<span style="font-size:13px;'+(k===i.a?'color:var(--ok);font-weight:600':'')+'">'+k+'. '+esc(i.o[j])+'</span>' : '').join('')+'</div>'
      + '<div class="e hide" data-e="'+i.id+'">'+esc(i.e || '（本题无解析）')+'</div>'
      + '</div>';
  });
  h += '</div></div>';
  box.innerHTML = h;
  box.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>{ delete st.wrong[b.dataset.del]; save(); renderWrong(); renderStat(); });
  box.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>{
    const el = box.querySelector('[data-e="'+b.dataset.open+'"]');
    el.classList.toggle('hide');
  });
}
document.getElementById('showFixed').onchange = renderWrong;
document.getElementById('clearWrong').onclick = ()=>{
  if(!confirm('确定清空错题本？')) return;
  st.wrong = {}; save(); renderWrong(); renderStat();
};
document.getElementById('redoWrong').onclick = ()=>{
  const ids = Object.keys(st.wrong).filter(id=> !st.wrong[id].fixed);
  if(!ids.length){ alert('没有未攻克的错题'); return; }
  const set = new Set(ids);
  switchTab('practice');
  start('wrong', ITEMS.filter(i=> set.has(i.id)));
};

/* ---------- 统计 ---------- */
function renderStat(){
  const recs = Object.values(st.rec);
  const done = recs.length;
  const tried = recs.reduce((s,r)=> s + (r.n||0), 0);
  const okc = recs.reduce((s,r)=> s + (r.ok||0), 0);
  const acc = tried ? Math.round(okc/tried*100) : 0;
  const wrongN = Object.values(st.wrong).filter(w=>!w.fixed).length;
  const wrongAll = Object.keys(st.wrong).length;
  const masN = Object.keys(st.master).length;
  document.getElementById('statBox').innerHTML =
      box(ITEMS.length, '题库总量')
    + box(done, '已做题目')
    + box(tried, '累计作答')
    + box(acc+'%', '总正确率')
    + box(masN, '已掌握')
    + box(wrongN, '未攻克错题')
    + box(wrongAll, '错题本总数');

  let h = '<div class="list">';
  PAPERS.forEach(p=>{
    const its = ITEMS.filter(i=> i.paper===p);
    const dn = its.filter(i=> recOf(i.id)).length;
    const rt = its.filter(i=> { const r = recOf(i.id); return r && r.last===1; }).length;
    const mn = its.filter(i=> isMaster(i.id)).length;
    const pct = its.length ? Math.round(dn/its.length*100) : 0;
    const mpct = its.length ? Math.round(mn/its.length*100) : 0;
    h += '<div class="li"><div class="h"><b>'+esc(p)+'</b><span>'+dn+'/'+its.length+' 已做</span>'
       + '<span>正确率 '+(dn? Math.round(rt/dn*100):0)+'%</span>'
       + '<span style="color:var(--brand)">已掌握 '+mn+'（'+mpct+'%）</span></div>'
       + '<div class="mbar"><div class="bar"><i style="width:'+pct+'%"></i></div><span>作答 '+pct+'%</span></div>'
       + '<div class="mbar"><div class="bar"><i style="width:'+mpct+'%;background:#8fb2ff"></i></div><span>掌握 '+mpct+'%</span></div>'
       + '</div>';
  });
  h += '</div>';
  document.getElementById('pstat').innerHTML = h;
}
function box(n,l){ return '<div class="b"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

document.getElementById('clearMaster').onclick = ()=>{
  const sel = (!st.sel || st.sel==='ALL') ? null : st.sel;
  if(!confirm('清除' + (sel ? '「'+sel+'」' : '全部') + '的已掌握标记？')) return;
  ITEMS.forEach(i=>{ if(!sel || i.paper===sel){ delete st.master[i.id]; } });
  save(); renderStat(); alert('已清除');
};
document.getElementById('clearAll').onclick = ()=>{
  if(!confirm('清空全部答题记录与错题本？（题库不受影响）')) return;
  st = {rec:{}, wrong:{}, master:{}, cur:null, mode:st.mode, order:st.order, sel:st.sel, onlyNew:st.onlyNew};
  save(); renderPapers(); renderStat(); renderWrong();
};
document.getElementById('exportWrong').onclick = ()=>{
  const ids = Object.keys(st.wrong);
  if(!ids.length){ alert('错题本是空的'); return; }
  const byId = {}; ITEMS.forEach(i=> byId[i.id] = i);
  const rows = [['试卷','题号','题型','题干','选项A','选项B','选项C','选项D','答案','解析','状态']];
  ids.forEach(id=>{
    const i = byId[id]; if(!i) return;
    rows.push([i.paper, i.no, i.type, i.q, i.o[0], i.o[1], i.o[2], i.o[3], i.a, i.e,
               st.wrong[id].fixed ? '已攻克' : '未攻克']);
  });
  const csv = '\ufeff' + rows.map(r=> r.map(c=> '"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = '错题本.csv'; a.click();
};

/* ---------- 标签页 ---------- */
function switchTab(t){
  ['practice','wrong','stat'].forEach(k=>{
    document.getElementById('tab-'+k).classList.toggle('hide', k!==t);
  });
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('on', b.dataset.tab===t));
  if(t==='wrong') renderWrong();
  if(t==='stat') renderStat();
}
document.querySelectorAll('.tab').forEach(b=> b.onclick = ()=> switchTab(b.dataset.tab));

document.addEventListener('keydown', e=>{
  if(document.getElementById('tab-practice').classList.contains('hide')) return;
  if(e.key === 'Escape' && document.getElementById('pick').classList.contains('hide')){ backPick(); return; }
  if(!list.length) return;
  const k = e.key.toUpperCase();
  if(k === 'M' && st.mode === 'learn'){ toggleMaster(list[idx].id); renderStat(); renderQ(); e.preventDefault(); return; }
  if(['A','B','C','D'].includes(k) && !locked){ pick(k); e.preventDefault(); return; }
  if(e.key === 'ArrowLeft'){ const b=document.getElementById('prevB'); if(b && !b.disabled) b.click(); }
  if(e.key === 'ArrowRight'){ const b=document.getElementById('nextB'); if(b && !b.disabled) b.click(); }
  if(e.key === ' ' && locked){ const b=document.getElementById('nextB'); if(b && !b.disabled){ b.click(); e.preventDefault(); } }
});

renderPapers(); renderStat(); renderWrong();
// 首页「继续上次」跳转：index.html?x=1#resume 或直接 xxx.html#resume
if(location.hash === '#resume'){
  const cb = document.getElementById('conti');
  if(cb) cb.click();
  history.replaceState(null, '', location.pathname + location.search);
}
</script>
