<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三级嵌入式 · 选择题刷题</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1f2328; --sub:#6b7280;
  --brand:#2f6fed; --brand-weak:#eaf1ff; --ok:#16a34a; --ok-weak:#e8f7ee;
  --bad:#dc2626; --bad-weak:#fdecec; --warn:#d97706; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}
header{
  position:sticky;top:0;z-index:20;background:rgba(245,246,248,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.hd{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;letter-spacing:.2px}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--sub);letter-spacing:0}
.home{
  display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--sub);
  font-size:13px;text-decoration:none;white-space:nowrap;
}
.home:hover{background:var(--brand-weak);color:var(--brand);border-color:#c3d7ff}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{
  padding:6px 14px;border-radius:8px;border:1px solid transparent;background:none;
  color:var(--sub);font-size:14px;cursor:pointer;font-family:inherit;
}
.tab:hover{background:#eceef1}
.tab.on{background:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-top:16px}
h2.t{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2.t .tag{font-size:12px;font-weight:400;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;
  font-size:13px;cursor:pointer;font-family:inherit;color:var(--text);transition:.15s;
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{opacity:.65;font-size:11px;margin-left:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{
  border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px 14px;
  cursor:pointer;text-align:left;font-family:inherit;transition:.15s;
}
.pcard:hover{border-color:var(--brand);background:#fbfcff}
.pcard.on{border-color:var(--brand);background:var(--brand-weak);box-shadow:0 0 0 2px rgba(47,110,245,.10)}
.pcard .pn{font-size:14px;font-weight:600;color:var(--text);line-height:1.45;word-break:break-word}
.pcard .pn .tag{font-size:11px;font-weight:500;color:var(--brand);background:#e5edff;border-radius:5px;padding:1px 6px;margin-left:6px}
.pcard .pm{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);margin-top:8px}
.pcard .pm b{color:var(--text);font-weight:600}
.pcard .bar{margin:9px 0 0}
.qbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;margin-top:16px;
  border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:var(--shadow);
}
.qbar .qi{font-size:13px;color:var(--sub)}
.qbar .qi b{color:var(--text)}
.qbar .spacer{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  padding:9px 18px;border-radius:9px;border:1px solid var(--line);background:#fff;
  color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;
}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{padding:7px 14px;border:none;background:none;font-size:13px;cursor:pointer;font-family:inherit;color:var(--sub)}
.seg button.on{background:var(--brand-weak);color:var(--brand);font-weight:600}
.bar{height:6px;background:#e9ecf0;border-radius:4px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);flex-wrap:wrap;gap:8px}
.stem{font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word;margin:14px 0 16px}
.stem.code{
  font-family:"Cascadia Mono",Consolas,"Courier New","Microsoft YaHei",monospace;
  font-size:14px;background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:12px;
}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
  cursor:pointer;font-size:15px;font-family:inherit;color:var(--text);transition:.12s;line-height:1.6;
}
.opt:hover:not(:disabled){border-color:var(--brand);background:#fbfcff}
.opt .k{
  flex:0 0 24px;height:24px;line-height:24px;text-align:center;border-radius:6px;
  background:#f0f2f5;font-size:13px;font-weight:600;color:var(--sub);
}
.opt .v{flex:1;white-space:pre-wrap;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-weak)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-weak)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-weak)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.ana{margin-top:16px;border-left:3px solid var(--brand);background:#fbfcff;border-radius:0 8px 8px 0;padding:12px 14px}
.ana .lb{font-size:12px;color:var(--sub);margin-bottom:5px;display:flex;gap:10px;align-items:center}
.ana .tx{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.75}
.badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600}
.badge.ok{background:var(--ok-weak);color:var(--ok)}
.badge.bad{background:var(--bad-weak);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.gn{
  height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;
  font-size:13px;font-family:inherit;color:var(--text);position:relative;
}
.gn.done{background:#f0f2f5;color:var(--sub)}
.gn.right{background:var(--ok-weak);border-color:#bfe5cd;color:var(--ok);font-weight:600}
.gn.wrong{background:var(--bad-weak);border-color:#f3c9c9;color:var(--bad);font-weight:600}
.gn.cur{outline:2px solid var(--brand);outline-offset:1px}
.gn.mas{background:var(--brand-weak);border-color:#c3d7ff;color:var(--brand)}
.mbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-top:8px}
.mbar .bar{flex:1;margin:0}
.score{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin:6px 0 2px}
.score .big{font-size:36px;font-weight:700;line-height:1.1}
.score .u{font-size:14px;color:var(--sub)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:14px}
.kv .b{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:12px}
.kv .b .n{font-size:22px;font-weight:700}
.kv .b .l{font-size:12px;color:var(--sub)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.li{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.li .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:6px}
.li .q{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.li .e{margin-top:8px;font-size:13px;color:#374151;background:#f8f9fb;border-radius:8px;padding:9px 11px;white-space:pre-wrap}
.li .ops{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.hint{font-size:12px;color:var(--sub);margin-top:10px}
kbd{background:#f0f2f5;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit}
.hide{display:none!important}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.spacer{flex:1}
@media(max-width:640px){
  .hd{padding:10px 12px}.tabs{width:100%;margin-left:0;order:3}
  .stem{font-size:15px}.score .big{font-size:30px}
}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo">三级嵌入式 · 选择题刷题<small>35 套 · 1400 道单选</small></div>
  <a class="home" href="index.html">← 首页</a>
  <div class="tabs">
    <button class="tab on" data-tab="practice">练习</button>
    <button class="tab" data-tab="wrong">错题本</button>
    <button class="tab" data-tab="stat">统计</button>
  </div>
</div></header>

<div class="wrap">

<!-- ========== 练习：界面① 选试卷 ========== -->
<div id="tab-practice">
 <div id="pick">
  <div class="card">
    <h2 class="t">选择试卷 <span class="tag">共 <b id="totalN">0</b> 道选择题</span></h2>
    <div class="pgrid" id="papers"></div>
    <div class="row" style="margin-top:16px">
      <span style="font-size:13px;color:var(--sub)">模式</span>
      <div class="seg" id="mode">
        <button data-m="learn">学习模式（直接看答案）</button>
        <button data-m="drill" class="on">练习模式（即时判分）</button>
        <button data-m="exam">考试模式（交卷后判分）</button>
      </div>
      <span style="font-size:13px;color:var(--sub)">顺序</span>
      <div class="seg" id="order">
        <button data-o="seq" class="on">顺序</button>
        <button data-o="rand">随机</button>
      </div>
      <label id="onlyNewWrap" style="font-size:13px;color:var(--sub);display:none;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="onlyNew" style="width:15px;height:15px"> 只看未掌握
      </label>
    </div>
    <div class="hint" id="modeHint"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn pri" id="start">开始刷题</button>
      <button class="btn sm" id="conti">继续上次</button>
      <button class="btn sm" id="reset">清空本卷记录</button>
      <span class="spacer"></span>
      <button class="btn sm" id="clearMaster">清除掌握标记</button>
    </div>
  </div>
 </div>
 <!-- 界面② 答题（与选卷界面互斥显示） -->
 <div id="quiz" class="hide"></div>
 <div id="result" class="hide"></div>
</div>

<!-- ========== 错题本 ========== -->
<div id="tab-wrong" class="hide">
  <div class="card">
    <h2 class="t">错题本 <span class="tag" id="wcount"></span></h2>
    <div class="row">
      <button class="btn pri sm" id="redoWrong">重做未攻克的错题</button>
      <button class="btn sm" id="clearWrong">清空错题本</button>
      <span class="spacer"></span>
      <label style="font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="showFixed" style="width:15px;height:15px"> 显示已攻克
      </label>
    </div>
    <div class="hint">答错自动收入；同一题在练习中答对一次即标记为「已攻克」。</div>
  </div>
  <div id="wlist"></div>
</div>

<!-- ========== 统计 ========== -->
<div id="tab-stat" class="hide">
  <div class="card">
    <h2 class="t">学习统计</h2>
    <div class="kv" id="statBox"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn sm" id="exportWrong">导出错题（CSV）</button>
      <button class="btn sm" id="clearAll">清空全部记录</button>
    </div>
  </div>
  <div class="card">
    <h2 class="t">各卷进度</h2>
    <div id="pstat"></div>
  </div>
</div>

</div>

<script>
const DATA = {"papers":["真考试卷1","真考试卷2","真考试卷3","真考试卷4","真考试卷5","真考试卷6","真考试卷7","真考试卷8","真考试卷9","真考试卷10","真考试卷11","真考试卷12","真考试卷13","真考试卷14","真考试卷15","真考试卷16","真考试卷17","真考试卷18","真考试卷19","真考试卷20","真考试卷21","真考试卷22","真考试卷23","真考试卷24","真考试卷25","真考试卷26","真考试卷27","真考试卷28","真考试卷29","真考试卷30","真考试卷31","真考试卷32","真考试卷33","新增试卷1","新增试卷2"],"items":[{"id":"1","paper":"真考试卷1","no":1,"type":"单项选择题","q":"嵌入式系统是一类特殊的计算机系统。下列产品中不属于嵌入式系统的是（  ）。","o":["电饭煲","路由器","巨型机","POS机"],"a":"C","e":"嵌入式系统以应用为中心，以计算机技术为基础，软硬件可裁剪、适应应用系统对功能、可靠性、成本、体积、功耗严格要求的专用计算机系统。巨型计算机实际上是一个巨大的计算机系统。故本题选择C。","code":0},{"id":"2","paper":"真考试卷1","no":2,"type":"单项选择题","q":"嵌入式系统硬件的核心是CPU。下面关于嵌入式系统CPU特点的叙述中，错误的是（  ）。","o":["支持实时处理","低功耗","字长在16位以下","集成了测试电路"],"a":"C","e":"嵌入式系统cpu范围极其广阔，从最初的4位处理器，到目前仍在大规模应用的8位单片机，和现在最新的受到广泛青睐的32位，64位嵌入式CPU，都属于嵌入式系统CPU的范围。故本题选择C。","code":0},{"id":"3","paper":"真考试卷1","no":3,"type":"单项选择题","q":"下面关于微控制器的叙述中，错误的是（  ）。","o":["微控制器将整个计算机硬件的大部甚至全部电路集成在一块芯片中","微控制器品种和数量最多，在过程控制、机电一体化产品、智能仪器仪表、家用电器、计算机网络及通信等方面得到了广泛应用","微控制器的英文缩写是MCU","8位的微控制器现在已基本淘汰"],"a":"D","e":"微控制器（MCU）将整个计算机硬件的大部甚至全部电路集成在一块芯片中，品种和数量最多，在过程控制、机电一体化产品、智能仪器仪表、家用电器、计算机网络及通信等方面得到了广泛应用，8位的目前仍在大规模应用。故本题选择D。","code":0},{"id":"4","paper":"真考试卷1","no":4,"type":"单项选择题","q":"片上系统（SoC）也称为系统级芯片，下面关于SoC叙述中错误的是（  ）。","o":["SoC芯片中只有一个CPU或DSP","SoC芯片可以分为通用SoC芯片和专用SoC芯片两大类","专用SoC芯片可分为定制的嵌入式处理芯片和现场可编程嵌入式处理芯片两类","FPGA芯片可以反复地编程、擦除、使用，在较短时间内就可完成电路的输入、编译、优化、仿真，直至芯片的制作"],"a":"A","e":"SoC芯片可以分为通用SoC芯片和专用SoC芯片两大类。通用的SoC芯片中可以只有一个CPU（或DSP），称为单核SoC，也可以包含多个CPU（或DSP），称为多核SoC;故本题选择A。","code":0},{"id":"5","paper":"真考试卷1","no":5,"type":"单项选择题","q":"数码相机是嵌入式系统的典型应用之一。下面关于数码相机的叙述中，错误的是（  ）。","o":["它由前端和后端两部分组成，前端负责数字图像获取，后端负责数字图像的处理","后端通常是以嵌入式DSP作为核心的SoC芯片，DSP用于完成数字图像处理","负责进行数码相机操作控制（如镜头变焦、快门控制等）是一个32位的MCU","高端数码相机配置有实时操作系统和图像处理软件"],"a":"C","e":"数码相机是嵌入式系统的典型应用之一。它由前端和后端两部分组成，前端负责数字图像获取，后端负责数字图像的处理，后端通常是以嵌入式DSP作为核心的SoC芯片，DSP用于完成数字图像处理；此外，数码相机中还有一个超低功耗的8位MCU，负责进行操作控制；高端数码相机配置有实时操作系统和图像处理软件。故本题选择C。","code":0},{"id":"6","paper":"真考试卷1","no":6,"type":"单项选择题","q":"电子书阅读器中存储的一本中文长篇小说，大小为128KB，文件格式为.txt，试问该小说包含的汉字大约有（  ）？","o":["6万字","12万字","25万字","40万字"],"a":"A","e":"一个汉字占两个字节，所以汉字数=总字节数 ÷ 每个汉字占用字节数 =128×1024÷2 = 65536，所以大约有六万字，故本题选择A。","code":0},{"id":"7","paper":"真考试卷1","no":7,"type":"单项选择题","q":"数字视频信息的数据量相当大，通常需要进行压缩处理之后才进行传输和存储。目前数字有线电视所传输的数字视频采用的压缩编码标准是（  ）。","o":["MPEG-1","MPEG-2","MPEG-4","MPEG-7"],"a":"B","e":"MPEG-2制定于1994年，设计目标是高级工业标准的图象质量以及更高的传输率。MPEG-2所能提供的传输率在3-10Mbits/sec间,其在NTSC制式下的分辨率可达720X486，MPEG-2也可提供并能够提供广播级的视像和CD级的音质。MPEG-2的音频编码可提供左右中及两个环绕声道,以及一个加重低音声道，和多达7个伴音声道(DVD可有8种语言配音的原因)。由于MPEG-2在设计时的巧妙处理，使得大多数MPEG-2解码器也可播放MPEG-1格式的数据，如VCD。同时，由于MPEG-2的出色性能表现，已能适用于HDTV，使得原打算为HDTV设计的MPEG-3，还没出世就被抛弃了。(MPEG-3要求传输速率在20Mbits/sec-40Mbits/sec间，但这将使画面有轻度扭曲)。除了做为DVD的指定标准外，MPEG-2还可用于为广播，有线电视网，电缆网络以及卫星直播(Direct Broadcast Satellite)提供广播级的数字视频。故本题选择B。","code":0},{"id":"8","paper":"真考试卷1","no":8,"type":"单项选择题","q":"下面是IP协议中C类IP地址有关规定的叙述，其中正确的是（  ）。","o":["它适用于中型网络","它所在的网络最多只能连接254台主机","它不能用于多目的地址发送（组播）","它的二进制表示中最高3位一定是“101”"],"a":"B","e":"IP地址分为A类、B类、C类三个基本类，另有两类分别作为组播地址和备用地址（D类和E类）。C类IP地址范围：192.0.0.1到223.255.255.254。第1字节、第2字节和第3个字节为网络地址，第4个字节为主机地址。C类网络地址数量较多，适用于小规模的局域网络，每个网络最多只能包含254台计算机。故本题选择B。","code":0},{"id":"9","paper":"真考试卷1","no":9,"type":"单项选择题","q":"对于嵌入式处理器内核的分类，以下说法正确的是（  ）。","o":["按照字长可分为8位结构和32位结构","按照存储结构可分为RISC和哈佛结构","按照体系结构可分为CISC和RISC结构","按照指令结构可分为冯.诺依曼结构和哈佛结构"],"a":"C","e":"嵌入式处理器的体系结构按指令集可分为两大类：CISC和RISC；按存储机制分为冯·诺依曼结构及哈佛结构；按字长分为8位、16位、32位和64位。故本题选择C。","code":0},{"id":"10","paper":"真考试卷1","no":10,"type":"单项选择题","q":"不属于ARM内核主要特点的是（  ）。","o":["功耗低","功能强大","采用RISC结构","全部采用哈佛结构"],"a":"D","e":"ARM内核与其他处理器内核相比，主要特点为耗电省、功能强、成本低、16位Thumb与32位ARM和Thumb-2双指令集并存以及具有非常众多的合作伙伴，适用面广泛。ARM有许多系列，如ARM7，ARM9，ARM10E，XScale，Cortex等，其中哈佛结构和冯诺依谩结构都有。如控制领域最常用的ARM7系列是冯诺依谩结构，而Cortex-M3系列是哈佛结构。故本题选择D。","code":0},{"id":"11","paper":"真考试卷1","no":11,"type":"单项选择题","q":"以下关于ARM处理器内核说法正确的是（  ）。","o":["经典ARM处理器包括Cortex-M、Cortex-R和Cortex-A三大类","Cortex-A系列为应用Cortex处理器，主要面向高端应用设计","Cortex-M系列为面向控制领域的实时嵌入式处理器","ARM11性能优于Cortex-A5,但低于Cortex-A15"],"a":"B","e":"ARM公司在经典处理器ARM11以后的产品改用Cortex命名，并分成A、R和M三类，旨在为各种不同的市场提供服务。Cortex系列属于ARMv7架构，这是到2010年为止ARM公司最新的指令集架构。（2011年，ARMv8 架构在 TechCon 上推出）ARMv7架构定义了三大分工明确的系列：“A”系列面向尖端的基于虚拟内存的操作系统和用户应用；“R”系列针对实时系统；“M”系列对微控制器。故本题选择B。","code":0},{"id":"12","paper":"真考试卷1","no":12,"type":"单项选择题","q":"以下关于ARM处理器工作状态说法错误的是（  ）。","o":["工作状态包括ARM状态、Thumb及Thumb-2状态和调试状态三种","ARM状态既支持16位指令宽度也支持32位指令宽度","Thumb状态或Thumb-2状态下代码密度大于ARM状态，占用存储空间较小","ARM处理器复位后总处于ARM状态"],"a":"B","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态，①ARM状态②是Thumb状态及Thumb-2状态③调试状态，A选项叙述正确。除支持Thumb-2的ARM处理器外，其他所有ARM处理器都可以工作在ARM状态。ARM状态是ARM处理器工作于32位指令的状态，所有指令均为32位宽度。B选项叙述错误，在 ARM 处理器中，复位是一个特殊的硬件事件，复位后处理器的初始状态由架构定义。根据 ARM 架构规范，处理器复位后会默认进入 ARM 状态（即 32 位指令集执行状态）C选项叙述正确；Thumb状态或Thumb-2状态下代码密度大于ARM状态，占用存储空间较小，D选项叙述正确。综上所述，B选项叙述错误，故本题选择B。","code":0},{"id":"13","paper":"真考试卷1","no":13,"type":"单项选择题","q":"如果要选择ARM处理器工作在外部中断模式，允许外部中断IRQ，禁止快速中断FIQ,使用Thumb工作状态，则需要设置的寄存器是（  ）。","o":["PSP","MSP","CPSR","SPSR"],"a":"C","e":"CPSR(当前程序状态寄存器)在任何处理器模式下被访问。它包含了条件标志位、中断禁止位、当前处理器模式标志以及其他的一些控制和状态位。故本题选择C。","code":0},{"id":"14","paper":"真考试卷1","no":14,"type":"单项选择题","q":"已知内存0x80000000中的内容为0x33, 0x80000001中的内容为0x31, 0x80000002中的内容为0x30, 0x80000003中的内容为0x32,则ARM在大端模式下地址0x80000000所指示的一个字为（  ）。","o":["0x33303132","0x32303133","0x32303331","0x33313032"],"a":"D","e":"所谓的大端模式，是指数据的高位，保存在内存的低地址中，而数据的低位，保存在内存的高地址中，这样的存储模式有点儿类似于把数据当作字符串顺序处理：地址由小向大增加，而数据从高位往低位存放。选项中D项正确，故本题选择D。","code":0},{"id":"15","paper":"真考试卷1","no":15,"type":"单项选择题","q":"在Thumb指令集中，32位有效立即数是由8位立即数通过下面哪一种操作而间接得到的（  ）。","o":["左移","右移","循环左移","循环右移"],"a":"A","e":"在最原始的 16位 Thumb 指令集（Thumb-1）中，为了节省指令空间，某些特定指令（如 MOV 或 ADD 的某些变体）确实只支持简单的移位。那么8位数据变32位可以通过数字左移完成，故本题选A。","code":0},{"id":"16","paper":"真考试卷1","no":16,"type":"单项选择题","q":"ARM处理器在指令LDR R2，[R5，#2]！执行后，R5中的值为（  ）。","o":["R5不变","R5=R5+2","R5=R2+2","R5=2"],"a":"B","e":"当指令执行时，首先计算内存地址R5的值加上偏移量2，即R5+2，然后从该计算出的地址（R5 + 2）处读取数据，并将其存入目标寄存器R2中，由于指令中带有感叹号!，表示基址寄存器R5的值会被更新。更新后的值为计算出的新地址，即R5的新值变为R5+2。综上所述，本题答案为B选项。","code":0},{"id":"17","paper":"真考试卷1","no":17,"type":"单项选择题","q":"将ARM处理器R0中的一个字节的数据，存入由R1+4指示的内存区域，且地址自动更新，则使用的ARM指令是（  ）。","o":["STR R0,[R1,#4]","STRH R0,[R1,#4]!","STRH R0,[R1,#4]","STRB R0,[R1,#4]!"],"a":"D","e":"按题目要求需采用基址加变址寻址方式，字节数据存储指令用STRB；故本题选择D。","code":0},{"id":"18","paper":"真考试卷1","no":18,"type":"单项选择题","q":"在以下ARM处理器的指令操作码中可让寄存器R1中的指定位“置位”的指令操作码是（  ）。","o":["MOV","AND","ADD","ORR"],"a":"D","e":"汇编中使用逻辑或指令和1进行或运算可以达到让寄存器中的指定位置位的作用，故本题选择D。","code":0},{"id":"19","paper":"真考试卷1","no":19,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中，错误的是（  ）。","o":["嵌入式系统常用的电源模块有AC-DC模块、DC-DC模块或LDO模块","大部分嵌入式处理器只能使用内部时钟信号发生器，不能使用外部时钟信号源","若嵌入式处理器芯片的系统复位引脚为nRESET，则表示低电平复位","基于ARM处理器内核的嵌入式处理器芯片都有调试接口"],"a":"B","e":"大多数嵌入式处理器内置了时钟信号发生器，因此时钟电路只需要外接一个石英晶体振荡器和两只电容就可以工作了，但有些场合（如为了减少功耗、需要严格同步等）需要使用外部振荡源提供时钟信号。B项叙述有误，故本题选择B。","code":0},{"id":"20","paper":"真考试卷1","no":20,"type":"单项选择题","q":"典型的嵌入式系统硬件由嵌入式最小硬件系统及相关的通道或接口组成，若一个嵌入式系统需要完成模拟量输入功能，该功能由下面列出的嵌入式系统的哪个通道实现？（  ）","o":["前向通道","后向通道","人机交互通道","相互互连通道"],"a":"A","e":"前向通道通常指的是输入接口，由模拟量输入接口和数字量输入接口组成，模拟输入接口包括传感器，信号调节电路（滤波，放大器等），A/D转换器等构成。后向通道是输出接口，由模拟量和数字量接口组成，包括D/A转换器，功率放大器，执行器等。故本题选择A。","code":0},{"id":"21","paper":"真考试卷1","no":21,"type":"单项选择题","q":"下面与AMBA（Advanced Microcontroller Bus Architecture）有关的叙述中，错误的是（  ）。","o":["AMBA是ARM公司公布的用于连接和管理片上系统中各功能模块的开放标准和片上互连规范","AMBA规定了ARM处理器内核与处理器内部RAM、DMA以及高带宽外部存储器等快速组件的接口标准","ARM处理器内核与外围端口及慢速设备接口组件的接口标准不包含在AMBA规范中","AMBA有多个版本，性能随版本的发展而逐步提高"],"a":"C","e":"AMBA 是ARM公司公布的总线协议，用于连接和管理片上系统 (SoC) 中功能模块的开放标准和片上互连规范。标准规定了ARM处理器内核与处理器内部高带宽RAM、DMA以及高带宽外部存储器等快速组件的接口标准，也规定了内核与ARM处理器内部外围端口及慢速设备接口组件的接口标准。AMBA有多个版本，性能随版本的发展而逐步提高。故本题选择C。","code":0},{"id":"22","paper":"真考试卷1","no":22,"type":"单项选择题","q":"以ARM内核为基础的嵌入式处理器芯片采用系统总线与外围总线的层次结构方式构建片上系统，下面列出的组件中，不与外围总线相连的组件是（  ）。","o":["UART","DMA控制器","ADC","USB设备"],"a":"B","e":"系统总线通过桥接器与外围总线互连，外围总线连接的硬件组件包括：GPIO、UART、SPI、I2C、USB设备、ADC、DAC等等。DMA（Direct Memory Access）控制器是一种在系统内部转移数据的独特外设，可以将其视为一种能够通过一组专用总线将内部和外部存储器与每个具有DMA能力的外设连接起来的控制器。故本题选择B。","code":0},{"id":"23","paper":"真考试卷1","no":23,"type":"单项选择题","q":"基于ARM内核的嵌入式芯片中包含定时/计数组件，下面列出的哪一项不属于定时/计数组件？","o":["ADC","Timer","RTC","WDT"],"a":"A","e":"ARM芯片内部有多个定时计数组件，主要包括看门狗定时器（WDT）、Timer通用定时器、RTC、脉冲宽度调制器（PWM）。而ADC是模数转换控制器。故本题选择A。","code":0},{"id":"24","paper":"真考试卷1","no":24,"type":"单项选择题","q":"基于ARM内核的嵌入式芯片中包含互连通信组件，下面列出的哪一项不属于互连通信组件？","o":["DAC","SPI","I<SUP>2<\/SUP>C","CAN"],"a":"A","e":"ARM芯片内部有多个可互联通信的组件，主要包括UART、I<SUP>2<\/SUP>C、SPI、CAN、USB、Ethernet等。而DAC是数模转换控制器，所以选择A项。","code":0},{"id":"25","paper":"真考试卷1","no":25,"type":"单项选择题","q":"下面是关于嵌入式系统使用的存储器的叙述，其中错误的是（  ）。","o":["系统使用的RAM有SRAM、DRAM等多种","Flash存储器分为NOR Flash和NAND Flash两种","FRAM已得到使用","目前还没有使用Cache存储器"],"a":"D","e":"嵌入式系统的存储器以半导体存储器为主。使用的RAM有SRAM、DRAM等多种，随着技术不断发展，FRAM和MRAM等新型存储器不断出现，也得到使用；NOR Flash和NAND Flash是现在市场上两种主要的闪存技术；在性能高的嵌入式处理器中都会集成内部Cache，ARM9和ARM11都有Cache存储器。故本题选择D。","code":0},{"id":"26","paper":"真考试卷1","no":26,"type":"单项选择题","q":"面关于串行外设接口SPI的叙述中，错误的是（  ）。","o":["SPI一般使用4条信号线：SCK、MISO、MOSI和SSEL","采用SPI可以构成“一主一从式”系统","采用SPI可以构成“一主多从式”系统","采用SPI不能构成“多主多从式”系统"],"a":"D","e":"串行外设（SPI）接口是一种同步串行外设接口，允许嵌入式处理器与各种外围设备以串行方式进行通信、数据交换。一般使用4条线：SCK、MISO、MOSI和SSEL；采用SPI可以构成“一主一从式”、 “一主多从式”、 “多主多从式”和“互为主从式”系统。故本题选择D。","code":0},{"id":"27","paper":"真考试卷1","no":27,"type":"单项选择题","q":"下面关于USB接口的叙述中，错误的是（  ）。","o":["USB支持热插拔","USB 2.0是目前传输速率最高的USB版本","USB接口提供了内置电源","USB 2.0采用半双工差分方式传送信息"],"a":"B","e":"USB接口提供了内置电源，主机的USB接口向从设备提供电源；USB总线接口支持设备的即插即用和热插拔功能，USB 2.0采用半双工差分方式传送信息，目前USB2.0的速度为480Mb/s，USB3.0达到5Gb/s即640MB/s， B项错误；故本题选择B。","code":0},{"id":"28","paper":"真考试卷1","no":28,"type":"单项选择题","q":"8段共阴极LED数码管如下图所示，为使其显示数字5，其段代码（高位到低位的顺序是：dp g f e d c b a）为（  ）。","o":["0x7F","0xC0","0x80","0x6D"],"a":"D","e":"按题目要求，LED为共阴极接法，要显示数字5，则a、f、g、c、d是高，段码应该是01101101，0X6D。故本题选择D。","code":0},{"id":"29","paper":"真考试卷1","no":29,"type":"单项选择题","q":"IEEE的实时UNIX分委会认为实时操作系统应该具备若干特征，下面哪一项不是实时操作系统必须具有的特征？（  ）","o":["具有异步I/O和中断处理能力","任务切换时间和中断延迟时间确定","优先级中断和调度","轮转调度"],"a":"D","e":"IEEE的实时UNIX分委会认为实时操作系统应该具备7个特征：具有异步I/O和中断处理能力；任务切换时间和中断延迟时间确定；优先级中断和调度；抢占式调度；内存锁定；连续文件；同步。选项D不是实时系统的特征，故本题选择D。","code":0},{"id":"30","paper":"真考试卷1","no":30,"type":"单项选择题","q":"一般按照对外部事件的响应时间快慢，将嵌入式操作系统分成强实时型和普通实时型。以下均为强实时嵌入式操作系统的是（  ）。","o":["VxWorks，pSOS，μC/OS-II","VxWorks，pSOS，Windows Embedded","pSOS，μC/OS-II，μCLinux","pSOS，Windows Embedded，Symbian"],"a":"A","e":"一般按照对外部事件的响应时间快慢，将嵌入式操作系统分成强实时型和普通实时型。强实时嵌入式操作系统有VxWorks，pSOS，μC/OS-II。故本题选择A。","code":0},{"id":"31","paper":"真考试卷1","no":31,"type":"单项选择题","q":"UNIX、嵌入式Linux、WinCE、Mac OS、Android OS和DOS操作系统是典型的单内核（也称为宏内核）操作系统，相对于微内核操作系统，下面不属于单内核操作系统缺点的是（  ）。","o":["占用内存空间大","缺乏可扩展性而不方便移植","内核切换太快","可靠性较低"],"a":"C","e":"单内核结构是传统操作系统采用的结构，也称为宏内核（Macro Kernel）。其缺点是占内存空间大，缺乏可扩展性，维护困难，任务执行时间的可预测性较低，可靠性较低，排除故障和增加新功能需要重编译。其优点是应用程序生成效率高，系统花在内核功能切换上的开销非常小，对外来事件反应速度快，操作系统内核的运行效率高。故本题选择C。","code":0},{"id":"32","paper":"真考试卷1","no":32,"type":"单项选择题","q":"如下几种Bootloader中，用于Linux 操作系统引导程序加载时所支持不同体系结构处理器种类最多的是（  ）。","o":["LILO","GRUB","U-Boot","Loadlin"],"a":"C","e":"U-Boot以POCBoot和ARMBoot 计划为基础。除了支持Power PC系列处理器外，还支持X86、ARM、Mips、Alpha、IA64、SupcrHSPARC等多种常用体系结构处理器。故本题选择C。","code":0},{"id":"33","paper":"真考试卷1","no":33,"type":"单项选择题","q":"关于μC/OS-II的基本特点，以下说法错误的是（  ）。","o":["μC/OS-II是抢占式实时操作系统内核","由于存在内核任务，用户编写的应用程序最多可以有60个任务","μC/OS-II不支持时间片轮转调度法","μC/OS-II允许每个任务有不同的栈空间"],"a":"B","e":"μC/OS-II是抢占式实时操作系统内核，只能管理64个任务。目前的版本保留8个任务给系统，这样用户编写的应用程序最多可以有56个任务。不支持时间片轮转调度法，因此赋给每一个任务的优先级是不相同的。每个任务拥有自用栈。B项错误，故本题选择B。","code":0},{"id":"34","paper":"真考试卷1","no":34,"type":"单项选择题","q":"在μC/OS-II中有多种方法可以保护任务之间的共享数据和提供任务之间的通信。其中不能达到保护目的的方法是（  ）。","o":["利用宏OS_ENTER_CRITICAL()和OS_EXIT_CRITICAL()来关闭中断和打开中断","利用函数OSSchedLock()和OSSchedUnlock()对任务调度函数上锁和开锁","利用信号量、互斥信号量、邮箱和消息队列进行任务间通信","利用内存文件进行任务间的大规模数据共享"],"a":"D","e":"在μC/OS-II中有多种方法可以保护任务之间的共享数据和提供任务之间的通信。其中主要有以下三种：利用宏OS_ENTER_CRITICAL()和OS_EXIT_CRITICAL()来关闭中断和打开中断；利用函数OSSchedLock()和OSSchedUnlock()对任务调度函数上锁和开锁；利用信号量、互斥信号量、邮箱和消息队列进行任务间通信。利用内存文件进行任务间的大规模数据共享是达不到保护任务之间的共享数据的作用。故本题选择D。","code":0},{"id":"35","paper":"真考试卷1","no":35,"type":"单项选择题","q":"移植μC/OS-II到一个嵌入式系统电路板上正常运行，下面哪个条件不是必须的？（  ）。","o":["处理器的C编译器能产生可重入代码，且用C语言就可以打开和关闭中断","该电路板的处理器必须具备MMU（存储管理单元）","处理器支持中断，并且能产生定时中断（通常在10至100Hz之间）","处理器支持能够容纳一定量数据（可能是几千字节）的硬件栈区"],"a":"B","e":"移植μC/OS-II到一个嵌入式电路板上正常运行，必须满足以下要求：处理器的C编译器能产生可重入代码；用C语言就可以打开和关闭中断；处理器支持中断，并且能产生定时中断（通常在10~100Hz之间）；处理器支持能够容纳一定量数据（可能是几千字节）的硬件栈区；处理器有将栈区指针和其他CPU寄存器读出和存储到栈区或内存中的指令。存储管理单元可以不需要。故本题选择B。","code":0},{"id":"36","paper":"真考试卷1","no":36,"type":"单项选择题","q":"Nios II软核处理器的硬件抽象层（HAL）系统库是一个轻量级C/C++运行时环境，属于单线程的类UNIX运行库，关于它所提供的服务如下哪一项说法是错误的？","o":["结合NewLib ANSI C标准库，向用户提供熟知的标准库函数","提供设备驱动，使用户可以访问系统中的所有设备","为系统提供了TCP/IP协议栈","系统初始化，在main()函数之前完成软核处理器Nios和运行库环境的初始化任务"],"a":"C","e":"HAL系统库提供以下服务：结合Newlib ANSI C标准库，向用户提供熟知的标准库函数；提供设备驱动，使用户可以访问系统中的所有设备；为用户提供了与HAL服务相统一的标准接口（HAL  API），例如数据访问、中断处理和报警设施；系统初始化，在main（）函数之前完成软核处理器Nios和运行库环境的初始化任务；设备初始化，在main（）函数之前完成每个设备的实例化和初始化。C项不属于提供的服务，故本题选择C。","code":0},{"id":"37","paper":"真考试卷1","no":37,"type":"单项选择题","q":"苹果公司的嵌入式移动电子产品风靡全球， iOS操作系统也随之为大众所熟悉。根据iOS的发展历史，它的前身是（  ）。","o":["DOS","UNIX-BSD","OS/2","pSOS 4.4"],"a":"B","e":"IOS的前身是UNIX-BSD。故本题选择B。","code":0},{"id":"38","paper":"真考试卷1","no":38,"type":"单项选择题","q":"以下关于微内核操作系统的叙述中，错误的是（  ）。","o":["内核小巧，传统操作系统内核中的许多部分都被移出内核","接口一致，所有进程请求使用统一接口，进程不区分内核模式和用户模式服务","各个功能模块之间松散耦合，只完成服务功能，系统管理功能交给一个或多个特权服务程序","微内核功能扩充方便，而且各个功能之间的切换而引起的开销比较小"],"a":"D","e":"微内核操作系统是对单内核做了结构改进后推出的，内核小巧，传统操作系统内核中的许多部分都被移出内核，采取服务器方式实现；接口一致，所有进程请求使用统一接口，进程不区分内核模式和用户模式服务；各个功能模块之间松散耦合，只完成服务功能，系统管理功能交给一个或多个特权服务程序；微内核功能扩充方便，但是各个功能之间的切换而引起的开销比较大。故本题选择D。","code":0},{"id":"39","paper":"真考试卷1","no":39,"type":"单项选择题","q":"开发嵌入式系统时，需要构建一个宿主机-目标机的开发环境。若目标机是裸机，那么为了调试和下载软件需要将调试仿真器连接到目标机的哪一种接口？","o":["SPI接口","以太网接口","JTAG接口","USB接口"],"a":"C","e":"由于程序调试时不占用目标机的资源，因此目标机的初始启动程序调试、硬件接口的调试，一般都采用JTAG。至于裸机状态的目标机当然更需要采用JTAG调试方式了。故本题选择C。","code":0},{"id":"40","paper":"真考试卷1","no":40,"type":"单项选择题","q":"嵌入式系统的应用形式是多种多样的，不同的嵌入式应用系统，需要选择适合其应用需求的开发工具来进行开发。采用开发工具的主要目的是（  ）。","o":["提高开发质量，缩短开发周期，降低开发成本","优化软件代码的存储容量，以便降低存储器的需求","降低嵌入式系统的功耗","便于设计需要调用操作系统API函数的应用程序"],"a":"A","e":"嵌入式系统的应用形式是多种多样的，不同的嵌入式应用系统，需要选择适合其应用需求的开发工具来进行开发。采用开发工具的主要目的是提高开发质量，缩短开发周期，降低开发成本。故本题选择A。","code":0},{"id":"41","paper":"真考试卷2","no":1,"type":"单项选择题","q":"下面关于嵌入式系统逻辑组成的叙述中，错误的是（  ）。","o":["嵌入式系统与通用计算机一样，也由硬件和软件两部分组成","硬件的主体是CPU和存储器，它们通过I/O接口和I/O设备与外部世界联系","嵌入式系统的CPU主要使用的是数字信号处理器","嵌入式系统的软件配置有些很简单，有些比较复杂"],"a":"C","e":"嵌入式系统与通用计算机一样，也由硬件和软件两部分组成。硬件的主体是CPU和存储器，它们通过I/O接口和I/O设备与外部世界联系。嵌入式系统的软件配置有多种情况，有些简单，有些比较复杂；而嵌入式系统的CPU有ARM、DSP和FPGA等。故本题选择C。","code":0},{"id":"42","paper":"真考试卷2","no":2,"type":"单项选择题","q":"下面关于数字信号处理器的叙述中错误的是（  ）。","o":["它是一种适用于数字信号处理的微处理器","它的英文缩写是DPS","它支持单指令多数据（SIMD）并行处理的指令","它能显著提高音频、视频等数字信号的数据处理效率"],"a":"B","e":"数字信号处理器英文缩写为DSP，它是一种适用于数字信号处理的微处理器，它支持单指令多数据（SIMD）并行处理的指令，能显著提高音频、视频等数字信号的数据处理效率。所以B项错误，故本题选B。","code":0},{"id":"43","paper":"真考试卷2","no":3,"type":"单项选择题","q":"片上系统是嵌入式处理器芯片的一个重要品种，下列叙述中错误的是（  ）。","o":["SoC已经成为嵌入式处理器芯片的主流发展趋势","它是集成电路加工工艺进入到深亚微米时代的产物","片上系统使用单个芯片进行数据的采集、转换、存储和处理，但不支持I/O功能","片上系统既能把数字电路也能把模拟电路集成在单个芯片上"],"a":"C","e":"随着电子设计自动化水平的提高和VLSI制造技术的飞速发展，半导体加工已经从微米、亚微米进入到深亚微米的时代，单个芯片上可以集成几亿个甚至几十亿个晶体管，因而能够把计算机或其他一些电子系统的全部电路都集成在单个芯片上，这种芯片就是所谓的片上系统。SoC芯片中既包含数字电路，也可以包含模拟电路，甚至还能包含数字/模拟混合电路和射频电路。由于SoC将嵌入式系统的几乎全部功能都集成在一块芯片中，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能。目前，大多数32位的嵌入式处理芯片均为SoC，SoC已经成为集成电路设计的主流发展趋势。因此本题选C。","code":0},{"id":"44","paper":"真考试卷2","no":4,"type":"单项选择题","q":"按照软硬件技术复杂程度进行分类，可以把嵌入式系统分为哪三大类？","o":["高端系统、中端系统和低端系统","军用系统、工业用系统和民用系统","硬实时系统、准实时系统和非实时系统","片上系统、微控制器和数字信号处理器"],"a":"A","e":"嵌入式系统的分类有多种。按系统的软硬件技术复杂度，嵌入式系统分为低端系统、中端系统和高端系统。故本题选A。","code":0},{"id":"45","paper":"真考试卷2","no":5,"type":"单项选择题","q":"半导体集成电路是微电子技术的核心。下面有关集成电路的叙述中错误的是（  ）。","o":["集成电路有小规模、中规模、大规模、超大规模和极大规模等多种，嵌入式处理器芯片一般属于大规模集成电路","集成电路的制造大约需要几百道工序，工艺复杂且技术难度非常高","集成电路大多在硅衬底上制作而成，硅衬底是单晶硅锭经切割、研磨和抛光而成的圆形薄片","集成电路中的电路及电子元件，需反复交叉使用氧化，光刻，掺杂和互连等工序才能制成"],"a":"A","e":"集成电路根据其集成度的高低可以分为小规模（SSI）、中规模（MSI）、大规模（LSI）、超大规模（VLSI）和极大规模（ULSI）等几种。嵌入式处理芯片大多属于VLSI和ULSI。集成电路的制造大约需要几百道工序，工艺复杂且技术难度非常高，许多工序必须在恒温、恒湿、超洁净的无尘厂房内完成，生产、控制及测试设备异常昂贵。集成电路大多在硅衬底上制作而成，硅衬底是单晶硅锭经切割、研磨和抛光而成的圆形薄片。集成电路中的电路及电子元件，需反复交叉使用氧化，光刻，掺杂和互连等工序才能制成。故本题选择A。","code":0},{"id":"46","paper":"真考试卷2","no":6,"type":"单项选择题","q":"一幅1024 x 768的彩色图像，每个像素使用16位表示，采用压缩比为5倍的算法压缩图像数据之后，其数据量大约是多少MB？","o":["0.3","0.5","1","1.5"],"a":"A","e":"本题应掌握数字图像数据量计算公式，（1024×768×16/8）/5 = 0.3 MB。故本题选A。","code":0},{"id":"47","paper":"真考试卷2","no":7,"type":"单项选择题","q":"以太网中计算机间以帧为单位进行通信，下列选项中不属于以太网数据帧内容的是（  ）。","o":["IP地址","MAC地址","有效载荷","校验信息"],"a":"A","e":"以太网数据帧：前导码（7字节）、帧起始定界符（1字节）、目的MAC地址（6字节）、源MAC地址（6字节）、类型/长度（2字节）、数据（46~1500字节）、帧校验序列（4字节）。A项IP地址不属于以太网数据帧内容。故选A。","code":0},{"id":"48","paper":"真考试卷2","no":8,"type":"单项选择题","q":"下面是IP协议中A类IP地址有关规定的叙述，其中正确的是（  ）。","o":["它适用于中型网络","它适用的网络最多只能连接65534台主机","它不能用于多目的地址发送（组播）","它的二进制表示中最高位一定是“0”"],"a":"D","e":"一个A类IP地址由1字节（每个字节是8位）的网络地址和3个字节主机地址组成，可知A类的网络地址数目较少，主机数目较多，适合规模较大的物理网络，网络地址的最高位必须是“0”, 即第一段数字范围为1～127。由于主机号占24位，全为0和全为1的主机号不可分配，因此，每个A类地址可连2<SUP>24<\/SUP>-2=16777214台主机，Internet有126个A类地址。D项正确。故本题选D。","code":0},{"id":"49","paper":"真考试卷2","no":9,"type":"单项选择题","q":"对于嵌入式处理器说法正确的是（  ）。","o":["ARM处理器采用CISC和RISC相结合的结构","嵌入式处理器都采用哈佛结构","ARM处理器具有耗电省、功能强、成本低等特点","ARM处理器内部的总线标准是PCI Express"],"a":"C","e":"ARM采用RISC精简指令集，采用冯·诺依曼体系或哈佛结构；ARM的总线结构称为AMBA（先进微控器制总线结构），是ARM推出的开放式总线结构，是目前流行的一种工业标准片上结构；ARM处理器具有耗电省、功能强、成本低等特点。故本题选C。","code":0},{"id":"50","paper":"真考试卷2","no":10,"type":"单项选择题","q":"以下关于ARM处理器的叙述中，错误的是（  ）。","o":["ARM7~ARM11为经典ARM处理器","Cortex-A系列为应用Cortex处理器，主要面向高端应用","Cortex-M系列为面向移动计算领域的嵌入式处理器","Cortex-R系列应用于实时应用的场合"],"a":"C","e":"ARM7~ARM11为经典ARM处理器；RM11以后则以Cortex命名，分为三个系列，-A，-R，-M系列，分别面向高端应用、实时控制和微控制器；其中Cortex-M 系列针对成本和功耗敏感的 MCU 和终端应用（如智能测量、人机接口设备、汽车和工业控制系统、大型家用电器、消费性产品和医疗器械）的混合信号设备进行过优化。因此C项错误，故本题选C。","code":0},{"id":"51","paper":"真考试卷2","no":11,"type":"单项选择题","q":"关于ARM的工作状态，以下说法正确的是（  ）。","o":["ARM处理器的工作状态包括ARM状态和Thumb状态两种","ARM状态支持16位指令宽度也支持32位指令宽度","Thumb状态或Thumb-2状态下,代码密度低于ARM状态，占用存储空间变大","ARM处理器复位后自动进入ARM状态"],"a":"D","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态，①ARM状态②Thumb/Thumb-2状态③调试状态。ARM状态是ARM处理器工作于32位指令的状态，即32位状态，所有指令均为32位宽度。Thumb状态是ARM执行16位指令的状态，即16位状态。在Thumb模式下，指令代码只有16位，使代码密度变大，占用内存空间减小，提供比32位程序代码更佳的效能。ARM处理器复位后自动进入ARM状态。D项正确，故本题选D。","code":0},{"id":"52","paper":"真考试卷2","no":12,"type":"单项选择题","q":"ARM处理器当前运算操所产生的标志位记录在以下哪个寄存器中？","o":["PSP","MSP","SPSR","CPSR"],"a":"D","e":"程序状态寄存器(current program status register) CPSR在用户级编程时用于存储条件码；CPSR包含条件码标志，中断禁止位，当前处理器模式以及其他状态和控制信息。故本题选D项。","code":0},{"id":"53","paper":"真考试卷2","no":13,"type":"单项选择题","q":"ARM处理器如果R1＝0x98001200,已知在小端模式下，内存0x98001204中存放数据0x35, 0x98001205中存放数据0x36, 0x98001206中存放数据0x37, 0x98001207中存放数据0x38, 在指令LDR R0，[R1，#4]执行后，R0中的值为（  ）。","o":["0x35363738","0x36353837","0x38373635","0x37383536"],"a":"C","e":"小端模式，是指数据的高位保存在内存的高地址中，而数据的低位保存在内存的低地址中；本指令表示将寄存器R1的内容自动增加4，形成操作数的有效地址，从中取得32位操作数存入寄存器R0中。故本题选C。","code":0},{"id":"54","paper":"真考试卷2","no":14,"type":"单项选择题","q":"ARM处理器将R0中一个字的数据，存入由R1指示的内存区域，则使用的指令是（  ）。","o":["STR R0，[R1]","LDR R0，[R1]","STRH R0，[R1]","STRB R0，[R1]"],"a":"A","e":"STR R0, [R1]指令将R0中的32位字数据存入R1所指向的内存地址；LDR R0, [R1]用于从内存读取数据到寄存器，与题目“存入内存”的要求相反；STRH R0, [R1]中STRH存储半字（16位）的指令，不符合“一个字”的要求，STRB R0, [R1]中STRB是存储字节（8位）的指令，同样不符合“一个字”的要求；综上所述，本题答案为A选项。","code":0},{"id":"55","paper":"真考试卷2","no":15,"type":"单项选择题","q":"在以下ARM处理器指令中可让寄存器R1中指定位“清零”的指令操作码为（  ）。","o":["MOV","AND","ADD","ORR"],"a":"B","e":"使用逻辑与指令AND和0进行按位相与，可以起到清零的作用。故本题选B。","code":0},{"id":"56","paper":"真考试卷2","no":16,"type":"单项选择题","q":"ARM处理器如果R1＝0x00000080，则指令MOV R0,R1, LSL#2执行后，R0的值为（  ）。","o":["0x00000200","0x00000320","0x00000020","0x00000040"],"a":"A","e":"本指令表示将寄存器R1的值左移2位后传送到R0，那么R1=0x00000080 的二进制为 0000 0000 0000 0000 0000 0000 1000 0000（32 位），左移 2 位后的二进制是0000 0000 0000 0000 0000 0010 0000 0000，转换为十六进制是0x00000200；故本题答案为A选项。","code":0},{"id":"57","paper":"真考试卷2","no":17,"type":"单项选择题","q":"以下ARM处理器的指令或伪指令错误的是（  ）。","o":["MOV R1,R2","LDR R1,#0x12345678","LDR R1,=0x00000020","ADC R1,R2,R3"],"a":"B","e":"LDR是加载/存储类指令，表示存储器到寄存器的数据传送；而 # 是立即数符号，表示立即数寻址， B项错误，故本题选B。","code":0},{"id":"58","paper":"真考试卷2","no":18,"type":"单项选择题","q":"ARM处理器在比较指令之后，如果要依据是否相等转移到指定地址L1，则以下指令错误的是（  ）。","o":["BEQ L1","BNE L1","BXEQ L1","BLAL L1"],"a":"D","e":"比较之后进行转移，属于分支程序设计。A、B、C三个选项中的指令均可表示，D项指令不存在，故本题选D。","code":0},{"id":"59","paper":"真考试卷2","no":19,"type":"单项选择题","q":"下面是有关嵌入式系统的最小系统组成的叙述： \nⅠ. 嵌入式最小系统包括嵌入式处理器\nⅡ. 嵌入式最小系统包括电源电路\nⅢ. 嵌入式最小系统包括时钟电路\nⅣ. 嵌入式最小系统包括复位电路\n上述叙述中，正确的是（  ）。","o":["仅Ⅰ和Ⅲ","仅Ⅰ和Ⅱ","仅Ⅱ、Ⅲ和Ⅳ","全部"],"a":"D","e":"嵌入式最小硬件系统一般包括嵌入式处理器、时钟电路、电源电路、复位电路、存储器和调试测试接口。故本题选D。","code":1},{"id":"60","paper":"真考试卷2","no":20,"type":"单项选择题","q":"下面关于JTAG的叙述中，错误的是（  ）。","o":["JTAG技术是一种嵌入式测试技术","大多数ARM嵌入式处理器芯片不包含JTAG接口","多个器件可以通过JTAG接口串联在一起进行测试","通过芯片的JTAG接口可以实现在线编程功能"],"a":"B","e":"JTAG技术是一种嵌入式测试技术，目前大多数嵌入式CPU、DSP、FPGA器件都支持JTAG标准。JTAG标准允许多个芯片（电路）的边界扫描寄存器BSR通过JTAG接口串联在一起，实现对多个器件的测试。通过芯片的JTAG接口可以实现在线编程功能。所以B选项错误，故本题选B。","code":0},{"id":"61","paper":"真考试卷2","no":21,"type":"单项选择题","q":"典型的嵌入式系统硬件由嵌入式最小硬件系统及相关通道或接口组成，若一个嵌入式系统需要完成模拟量输出功能，该功能是由下面列出的嵌入式系统的哪个通道实现的？","o":["前向通道","后向通道","人机交互通道","相互互连通道"],"a":"B","e":"前向通道通常指的是输入接口，由模拟量输入接口和数字量输入接口组成，模拟输入接口包括传感器，信号调节电路（滤波，放大器等），A/D转换器等构成。后向通道是输出接口，由模拟量和数字量接口组成，包括D/A转换器，功率放大器，执行器等。故本题选择B。","code":0},{"id":"62","paper":"真考试卷2","no":22,"type":"单项选择题","q":"基于ARM内核的嵌入式处理器芯片采用系统总线与外围总线两层结构的方式构建片上系统，下面列出的组件中，不与系统总线相连的组件是（  ）。","o":["电源管理与时钟控制器","DMA控制接口","RTC","中断控制器"],"a":"C","e":"按照AMBA总线规范，以ARM内核为基础的嵌入式处理器芯片采用系统总线与外围总线两层结构的方式构建片上系统。连接到系统总线上高带宽组件主要包括：电源管理与时钟控制器、测试接口、外部存储器控制接口、DMA控制器、USB主机、中断控制器等；而C选项的RTC是与外围总线连接的硬件组件。故本题选择C。","code":0},{"id":"63","paper":"真考试卷2","no":23,"type":"单项选择题","q":"下面是基于ARM内核的嵌入式芯片中有关GPIO的叙述，其中错误的是（  ）。","o":["GPIO作为输入接口时具有缓冲功能","GPIO作为输出接口时具有锁存功能","GPIO的引脚一般是多功能复用的","GPIO一般只具有0态和1态，不具有高阻状态"],"a":"D","e":"GPIO的引脚一般是多功能复用的，一般具有0态和1态和高阻状态；作为输入接口时具有缓冲功能，作为输出接口时具有锁存功能。故本题选择D。","code":0},{"id":"64","paper":"真考试卷2","no":24,"type":"单项选择题","q":"基于ARM内核的嵌入式芯片中包含互连通信组件，下面不属于互连通信组件的是（  ）。","o":["PWM","SPI","I2C","Ethernet"],"a":"A","e":"ARM处理芯片内部有多个可互联通信的组件，主要包括UART、I<SUP>2<\/SUP>C、SPI、CAN、USB、Ethernet等。A项是脉宽调制，不属于互连通信组件，故本题选A。","code":0},{"id":"65","paper":"真考试卷2","no":25,"type":"单项选择题","q":"下面是关于嵌入式系统使用的存储器的叙述： \nⅠ. 嵌入式系统使用的存储器按照其存取特性可分为RAM和ROM\nⅡ. 嵌入式系统使用的存储器按照其所处物理位置可分为片内存储器和片外存储器以及外部存储器\nⅢ. 嵌入式系统使用的存储器按照存储信息的类型可分为程序存储器和数据存储器\nⅣ. 新型的铁电存储器FRAM在嵌入式系统中得到了应用\n上述叙述中，正确的是（  ）。","o":["仅Ⅰ和Ⅱ","仅Ⅱ和Ⅲ","仅Ⅰ和Ⅲ","全部"],"a":"D","e":"嵌入式系统使用的存储器按照其存取特性可分为RAM和ROM；按照其所处物理位置可分为片内存储器和片外存储器以及外部存储器；按照存储信息的类型可分为程序存储器和数据存储器；随着新技术的发展，新型的铁电存储器FRAM在嵌入式系统中得到了应用。全部正确，由此可知，本题答案为D选项。","code":1},{"id":"66","paper":"真考试卷2","no":26,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C的叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C即集成电路互连总线","I<SUP>2<\/SUP>C具有SDA、SCL和ACK共3条信号线","I<SUP>2<\/SUP>C传送数据时，每次传送的字节数目没有限制","I<SUP>2<\/SUP>C是多主总线"],"a":"B","e":"I<SUP>2<\/SUP>C总线只有两条信号线，一条是数据线SDA，另一条是时钟线SCL，所有操作都通过这两条信号线完成。没有ACK， B项错误，故本题选B。","code":0},{"id":"67","paper":"真考试卷2","no":27,"type":"单项选择题","q":"下面是关于UART的叙述，其中错误的是（  ）。","o":["ARM芯片中的UART收发信息时，可以采用FIFO模式，也可以采用普通模式","UART传送信息的格式以起始位开始，以停止位结束","UART传送信息时，一次传送的数据位的长度只能是8位","基于UART可组成RS-232接口"],"a":"C","e":"ARM芯片中的UART收发信息时，可以采用FIFO模式，也可以采用普通模式；UART传送信息的格式以起始位开始，以停止位结束；UART传送信息时，一次传送的数据位可为5、6、7、8位，由编程决定；基于UART可组成RS-232接口。C选项错误，故本题选C。","code":0},{"id":"68","paper":"真考试卷2","no":28,"type":"单项选择题","q":"下面是关于嵌入式系统中使用的键盘的叙述，其中错误的是（  ）。","o":["利用嵌入式芯片的GPIO构成线性键盘时，一个按键需要占用一个GPIO引脚","采用矩阵键盘结构时，8个GPIO引脚最多能构成12个按键的键盘","采用机械式按键设计键盘时，按键按下时会产生抖动","矩阵键盘通常用行扫描法或反转法读取按键的特征值"],"a":"B","e":"利用嵌入式芯片的GPIO构成线性键盘时，一个按键需要占用一个GPIO引脚；采用矩阵键盘结构时，8个GPIO引脚最多能构成16个按键的键盘（4×4矩阵）；采用机械式按键设计键盘时，按键按下时会产生抖动；矩阵键盘通常用行扫描法或反转法读取按键的特征值。故本题选B。","code":0},{"id":"69","paper":"真考试卷2","no":29,"type":"单项选择题","q":"μC/OS-II操作系统启动的过程中，Bootloader执行完毕后，调用应用程序主文件（通常是main.c）里的main（  ）函数。main（  ）函数在执行过程中，除了用户函数和硬件初始化函数之外，需要执行以下三个主要的μC/OS-II函数:\nI. OSStart（  ）     II. OSTaskCreate（  ） III. OSInit（  ）\n它们的执行顺序是（  ）。","o":["I、II、III","III、I、II","II、III、I","III、II、I"],"a":"D","e":"main()函数在执行过程中，除了用户函数和硬件初始化函数之外，需要按顺序执行以下三个主要的μC/OS-II函数：OSInit()；OSTaskCreate()；OSStart()。故本题选D。","code":1},{"id":"70","paper":"真考试卷2","no":30,"type":"单项选择题","q":"μC/OS-II系统中的每个任务都处在以下5种状态之一：休眠态、就绪态、运行态、挂起态（等待某一事件发生）和被中断态，以下哪个说法是错误的?","o":["任务处于休眠态，相当于该任务驻留在外存中，但还没有交给内核管理","任务处于就绪态，意味着该任务已经准备好，可以运行了，但由于该任务的优先级比正在运行的任务的优先级低，还暂时不能运行","任务处于运行态，指任务得到了CPU的控制权正在运行之中","任务处于被中断态，是指发生中断时执行相应的中断服务，原来正在运行的任务暂时停止运行，进入了被中断状态"],"a":"A","e":"任务处于休眠态，相当于该任务驻留在内存中，但还没有交给内核管理，故A项错误，其余三项正确，选本题选A。","code":0},{"id":"71","paper":"真考试卷2","no":31,"type":"单项选择题","q":"μC/OS-II总是运行处于就绪态任务中优先级最高的那个任务，以下哪个说法是错误的?","o":["真正实现任务切换的函数是OSCtxSw()","任务级的调度是由函数OSSched()完成","中断级的调度是由函数OSIntExit()完成","实现上下文切换的函数是OSSched()"],"a":"D","e":"OSCtxSw()是真正实现任务切换的函数，它负责保存当前任务的上下文，并恢复高优先级就绪任务的上下文，从而完成任务切换。该函数在任务被阻塞、删除、创建或时间片轮转等情况下被调用，A选项说法正确；OSSched()是任务级调度函数，它决定哪个就绪态任务应该被调度运行，并调用 OSCtxSw() 来执行实际的上下文切换，B选项说法正确；OSIntExit()是中断级调度函数，当中断服务程序结束时，它检查是否有更高优先级的任务变为就绪态，如有则触发任务切换，C选项说法正确；OSSched() 本身并不直接实现上下文切换，它只是调度决策函数，真正的上下文切换是由OSCtxSw()完成的，D选项说法错误；故本题答案为D选项。","code":0},{"id":"72","paper":"真考试卷2","no":32,"type":"单项选择题","q":"μC/OS-II允许中断嵌套，嵌套层数可达多少层？","o":["32","26","128","255"],"a":"D","e":"μC/OS-II允许中断嵌套，嵌套层数可达255层。故本题选D。","code":0},{"id":"73","paper":"真考试卷2","no":33,"type":"单项选择题","q":"μC/OS-II能够提供周期性时钟信号（即所谓的时钟节拍），用于实现任务的正确延时和超时确认。节拍率应在什么范围内？","o":["10 Hz~100Hz","10 Hz~1000Hz","100 Hz~1000Hz","100 Hz~10000Hz"],"a":"A","e":"μC/OS-II能够提供周期性时钟信号（即所谓的时钟节拍），用于实现任务的正确延时和超时确认。节拍率应在每秒10次到100次之间，即10~100Hz。故本题选A。","code":0},{"id":"74","paper":"真考试卷2","no":34,"type":"单项选择题","q":"μC/OS-II的事件控制块有4种类型，需要使用4个不同的函数来创建。如下选项中哪一个用于创建事件控制块？","o":["OSTaskCreate()","OSThreadCreate()","OSQCreate( )","OSCtxSw()"],"a":"C","e":"μC/OS-II的事件控制块用于管理信号量、消息邮箱、消息队列等“事件”类型对象，其中OSTaskCreate()用于创建任务，与事件控制块无关；μC/OS-II中不存在OSThreadCreate()函数；OSQCreate()用于创建消息队列的事件控制块，OSCtxSw()是系统内部的中断切换函数，不用于创建事件控制块。综上所述，本题答案为C选项。","code":0},{"id":"75","paper":"真考试卷2","no":35,"type":"单项选择题","q":"下面关于Linux内核的有关叙述中，错误的是（  ）。","o":["进程调度模块负责控制进程对CPU资源的使用，所采取的调度策略是使得各个进程能够平均访问CPU，但并不保证内核能及时地执行硬件操作","Linux内存管理模块的功能之一是屏蔽各种硬件内存结构的差异并向上返回统一的访问接口","网络接口模块包含网络接口驱动程序","支持进程之间各种通信机制，其通信机制主要包括信号、管道、消息队列、信号量、共享内存和套接字"],"a":"A","e":"进程调度模块负责控制进程对CPU资源的使用，所采取的调度策略是使得各个进程能够公平合理地访问CPU，同时保证内核能及时地执行硬件操作。A选项叙述有误，B、C、D正确，故本题选A。","code":0},{"id":"76","paper":"真考试卷2","no":36,"type":"单项选择题","q":"关于U-Boot，以下说法错误的是（  ）。","o":["U-Boot全称USB Bootloader，通过USB接口完成启动支持多种处理器和操作系统","U-Boot支持PowerPC、x86、ARM等多种体系结构的处理器","U-Boot支持嵌入式Linux、VxWorks、QNX、RTEMS、Windows CE等操作系统","U-Boot采用两个阶段完成操作系统的引导加载"],"a":"A","e":"U-Boot，全称 Universal Boot Loader，是德国DENX公司开发的，用于多重嵌入式CPU的Bootloader程序，它遵循GPL条款，源代码完全开放。从FADSROM、8xxROM、PPCBOOT逐步发展演化而来。A选项错误，其余选项正确，故本题选A。","code":0},{"id":"77","paper":"真考试卷2","no":37,"type":"单项选择题","q":"关于微内核和宏内核操作系统，如下哪一项的说法是错误的？","o":["VxWorks是典型的微内核结构嵌入式操作系统","iOS追根溯源是一个类UNIX操作系统，它属于宏内核架构","Android OS是典型的宏内核操作系统","一般认为微内核系统的实时性较好，故Symbian归类为强实时嵌入式操作系统"],"a":"D","e":"属于微内核结构的典型嵌入式操作系统有Symbian、VxWorks、QNX、μC/OS-II等，属于宏内核操作系统有Android OS、Linux、Windows CE等；iOS是混合内核，追根溯源是一个类UNIX操作系统，可以属于宏内核架构，实质是微内核架构。而Symbian系统属于普通实时系统。故本题答案为D选项。","code":0},{"id":"78","paper":"真考试卷2","no":38,"type":"单项选择题","q":"以下关于VxWorks操作系统的叙述中，错误的是（  ）。","o":["是目前公认为实时性很强、可靠性很高的一种嵌入式实时操作系统","在航空航天、通信和国防领域具有广泛的应用","属于大型商用操作系统，具有配套的VMWare集成开发环境，为开发者带来很大方便","支持基于抢占式优先级调度的任务管理"],"a":"C","e":"VxWorks 操作系统是美国WindRiver公司于1983年设计开发的一种嵌入式实时操作系统（RTOS，属于小型的操作系统，是嵌入式开发环境的关键组成部分，支持基于抢占式优先级调度的任务管理。它以其良好的可靠性和卓越的实时性被广泛地应用在通信、军事、航空航天等高精尖技术及实时性要求极高的领域中。故本题选C。","code":0},{"id":"79","paper":"真考试卷2","no":39,"type":"单项选择题","q":"嵌入式系统开发时，应该根据应用需求来选择相应的开发工具软件。RVDS是一个较常用的开发工具软件，下面的有关叙述中错误的是（  ）。","o":["RVDS中包括工程管理器、编译连接器、调试器和指令集仿真器","RVDS只支持ARM内核的微处理器芯片","RVDS支持对Flash存储器的编程","RVDS编译的代码比ADS1.2编译的代码执行效率高"],"a":"B","e":"RVDS支持所有ARM芯片，包括Cortex全系列，还支持其他内核的处理器，如51系列。B选项错误，其余三项正确，故本题选B。","code":0},{"id":"80","paper":"真考试卷2","no":40,"type":"单项选择题","q":"若基于Linux操作系统所开发的ARM应用程序源文件名为test.c，那么要生成该程序代码的调试信息，编译时使用的GCC命令正确的是（  ）。","o":["arm-linux-gcc -c -o test.o test.c","arm-linux-gcc -S -o test.o test.c","arm-linux-gcc -o test test.c","arm-linux-gcc -g -o test test.c"],"a":"D","e":"要对源程序进行调试，通常需要在GCC命令中加入参数-g。故本题选D。","code":0},{"id":"81","paper":"真考试卷3","no":1,"type":"单项选择题","q":"与个人计算机（PC）相比，嵌入式系统具有许多不同的特点。下面不属于嵌入式系统特点的是（  ）。","o":["嵌入式系统与具体应用紧密结合，具有很强的专用性","嵌入式系统通常包含在非计算机设备（系统）中，具有隐蔽性","嵌入式系统的软硬件资源往往受到严格的限制","嵌入式系统性能较低，价格也比较便宜"],"a":"D","e":"与人们日常使用的个人计算机相比，嵌入式系统具有许多不同的特点：①专用型，嵌入式系统与具体应用紧密结合，具有很强的专用型；②隐蔽性，嵌入式系统通常总是非计算机设备（系统）中的一个部分，它们隐藏在其内部，不为人知；③资源受限，嵌入式系统通常要求小型化、轻量化、低功耗及低成本，因此其软硬件资源受到严格的限制；④高可靠性；⑤实时性；⑥软件固化。综上所述，D选项不属于嵌入式系统的特点。故本题选择D。","code":0},{"id":"82","paper":"真考试卷3","no":2,"type":"单项选择题","q":"嵌入式系统中的CPU具有一些与通用计算机所使用的CPU不同的特点，下面不是其特点的是（  ）。","o":["支持实时处理","低功耗","高主频","集成了测试电路"],"a":"C","e":"嵌入式系统中的CPU一般具有4个特点：①支持实时处理；②低功耗；③结构可扩展；④集成了测试电路。故本题选择C。","code":0},{"id":"83","paper":"真考试卷3","no":3,"type":"单项选择题","q":"嵌入式系统使用的片上系统英文缩写名为SoC，下面关于SoC叙述中错误的是（  ）。","o":["SoC也称为系统级芯片，它是电子设计自动化水平的提高和集成电路制造技术飞速发展的产物","SoC芯片中既包含数字电路，也可以包含模拟电路，甚至还能包含数字/模拟混合电路和射频电路","SoC将嵌入式系统的几乎全部功能都集成在一块芯片中，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能","SoC的设计制造难度很大，目前还没有得到广泛使用"],"a":"D","e":"随着电子设计自动化水平的提高和VLSI制造技术的飞速发展，半导体加工已经从微米、亚微米进入到深亚微米的时代，单个芯片上可以集成几亿个甚至几十亿个晶体管，因而能够把计算机或其他一些电子系统的全部电路都集成在单个芯片上，这种芯片就是所谓的片上系统。SoC芯片中既包含数字电路，也可以包含模拟电路，甚至还能包含数字/模拟混合电路和射频电路。由于SoC将嵌入式系统的几乎全部功能都集成在一块芯片中，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能。目前，大多数32位的嵌入式处理芯片均为SoC，SoC已经成为集成电路设计的主流发展趋势。综上可知，D选项不正确，故本题选择D。","code":0},{"id":"84","paper":"真考试卷3","no":4,"type":"单项选择题","q":"微电子技术特别是集成电路制造技术是嵌入式系统发展的重要基础，下面关于集成电路的叙述中错误的是（  ）。","o":["集成电路的集成度指的是单个集成电路所含电子元件（如晶体管、电阻、电容等）的数目多少","根据集成度的高低，集成电路可以分为小规模、中规模、大规模、超大规模和极大规模等几种","嵌入式系统中使用的处理器芯片属于大规模集成电路","集成电路的制造工艺复杂且技术难度非常高，许多工序必须在恒温、恒湿、超洁净的无尘厂房内完成"],"a":"C","e":"集成电路根据其集成度的高低，即单个集成电路所含电子元件（如晶体管、电阻、电容等）的数目可以分为小规模（SSI）、中规模（MSI）、大规模（LSI）、超大规模（VLSI）和极大规模（ULSI）等几种。集成电路的制造大约需要几百道工序，工艺复杂且技术难度非常高，许多工序必须在恒温、恒湿、超洁净的无尘厂房内完成，生产、控制及测试设备异常昂贵。嵌入式处理芯片大多属于VLSI和ULSI。故本题选择C。","code":0},{"id":"85","paper":"真考试卷3","no":5,"type":"单项选择题","q":"文字信息是人们用以表达和传递信息的媒体之一，大多数嵌入式系统都必须处理文字信息。下面关于文字信息的表示及其处理的叙述中，错误的是（  ）。","o":["目前使用最广泛的西文字符集是ASCII字符集，它包含96个可打印字符","GB2312是我国目前广泛使用的汉字编码国家标准之一","GB2312包括6000多汉字，但不包含西文、俄文等其他字符","GB2312字符集中的汉字与符号在系统中采用双字节表示"],"a":"C","e":"目前计算机中使用最广泛的西文字符集及其编码是ASCII字符集和ASCII码，即美国标准信息交换码。基本的ASCII字符集共有128个字符，包括96个可打印字符和32个控制字符，每个字符使用7个二进制位进行编码。我国目前广泛使用的汉字编码国家标准有GB2312和GB18030。GB2312国标字符集中包含3755个一级常用汉字和3008个二级常用汉字，此外还有682个图形符号（包括拉丁字母、俄文、日文平假名与片假名、希腊字母、汉语拼音等）。这些汉字和图形符号在计算机内部都采用2字节（16个二进制位）来表示。故本题选择C。","code":0},{"id":"86","paper":"真考试卷3","no":6,"type":"单项选择题","q":"假设一台数码相机一次可拍摄16位色1024 x 1024的彩色相片共80张，数据压缩比平均是4，则它使用的存储器容量大约是（  ）。","o":["40MB","60MB","80MB","120MB"],"a":"A","e":"此题主要为数字图像的数据量计算。图像数据量的计算公式如下：图像数据量=图像水平分辨率×图像垂直分辨率×像素深度/8。由此可知，此题中的数码相机一张照片大小为1024×1024×16/8=2M，所以需要使用的存储器容量为2M×80/4=40M。故本题选择A。","code":0},{"id":"87","paper":"真考试卷3","no":7,"type":"单项选择题","q":"在数字音频信息数字化过程中，正确的处理顺序是（  ）。","o":["量化、取样、编码","取样、编码、量化","取样、量化、编码","编码、取样、量化"],"a":"C","e":"音频信息数字化的过程是取样、量化、编码。故本题选择C。","code":0},{"id":"88","paper":"真考试卷3","no":8,"type":"单项选择题","q":"互联网借助TCP/IP协议把许多同构或异构的计算机网络互相连接起来，实现了遍布全球的计算机的互连、互通和互操作，其中的IP协议起着关键性的作用。下面有关IP协议的叙述中，错误的是（  ）。","o":["IP地址解决了网络中所有计算机的统一编址问题","IP数据报是一种独立于各种物理网络的数据包格式","目前广泛使用的是IP协议的第6版（IPv6），IPv4已经很少使用","路由器(router)是实现网络与网络互连的关键设备"],"a":"C","e":"IP地址的功能是提供网络中所有设备的唯一标识，从而实现统一编址，使数据能准确寻址和传输，A选项叙述正确；IP数据报是IP协议中定义的数据传输单元，其格式独立于底层物理网络（如以太网、WiFi、PPP等），确保数据在不同物理网络间透明传输，B选项叙述正确；当前互联网中广泛使用的是IPv4协议，IPv6是下一代IP协议，旨在解决IPv4地址耗尽问题，但尚未完全取代IPv4，全球范围内IPv4仍占主导地位，C选项叙述错误；路由器是连接不同网络的关键设备，负责根据IP地址转发数据包，实现网络间的互联互通，D选项叙述正确；综上所述，本题答案为C选项。","code":0},{"id":"89","paper":"真考试卷3","no":9,"type":"单项选择题","q":"以下关于嵌入式处理器的说法正确的是（  ）。","o":["RISC是复杂指令集结构计算机","哈佛结构是程序与数据统一的存储结构","ARM处理器的指令编码全部为32位","ARM Cortex-M是面向控制的嵌入式Cortex处理器"],"a":"D","e":"RISC的英文全称是Reduced Instruction Set Computer，中文是精简指令集计算机，故A项错误；哈佛结构是一种将程序指令存储和数据存储分开的存储器结构，是一种并行体系结构，故B项错误；ARM处理器本身是32位设计，但也配备16位指令集，其中，ARM指令为32位的长度，Thumb指令为16位长度，故C项也不正确。故本题选择D。","code":0},{"id":"90","paper":"真考试卷3","no":10,"type":"单项选择题","q":"关于ARM处理器的工作模式，以下说法错误的是（  ）。","o":["用户模式是程序正常执行的模式","快速中断模式处理高速中断，用于高速数据传输或通道处理","管理模式用于操作系统的保护模式，处理软中断","系统模式用于处理未定义的指令陷阱"],"a":"D","e":"ARM处理器有多种工作模式，其中用户模式(USER)是ARM处理器正常的程序执行状态；系统模式(SYS)是运行具有特权的操作系统任务；快中断模式(FIQ)支持高速数据传输或通道处理；管理模式(SVC)即操作系统保护模式。除此之外还有数据访问终止模式（ABT）、中断模式（IRQ）、未定义指令终止模式（UND）。故本题选择D。","code":0},{"id":"91","paper":"真考试卷3","no":11,"type":"单项选择题","q":"以下关于ARM处理器CPSR寄存器说法错误的是（  ）。","o":["CPSR记录ARM的工作状态","CPSR决定ARM工作模式","CPSR可设定是否允许外部中断和快速中断","CPSR是ARM的控制寄存器"],"a":"D","e":"ARM处理器的CPSR寄存器是程序状态寄存器，包含条件码标志，中断禁止位，当前处理器模式以及其他状态和控制信息。故本题选择D。","code":0},{"id":"92","paper":"真考试卷3","no":12,"type":"单项选择题","q":"关于ARM处理器的异常，以下说法错误的是（  ）。","o":["复位异常级别最高","FIQ是外部中断异常","每个异常中断向量占据4个字节","不同类型的异常中断其中断服务程序入口地址不同"],"a":"B","e":"ARM有七种异常类型：复位异常、数据访问中止异常、快速中断请求异常（FIQ）、一般中断请求（IRQ）、预取指令异常、软件中断异常、未定义异常。每个异常中断向量占据4个字节，不同类型的异常中断其中断服务程序入口地址不同，其中复位异常级别最高。故本题选B。","code":0},{"id":"93","paper":"真考试卷3","no":13,"type":"单项选择题","q":"以下关于ARM处理器说法正确的是（  ）。","o":["小端格式是指数据的高字节存储在高字节地址中，低字节数据存放在低字节地址中","ARM处理器支持8位、16位、24位和32位数据处理","MPU为ARM处理器的存储器管理单元","MMU为ARM处理器的存储器保护单元"],"a":"A","e":"大端模式，是指数据的高位保存在内存的低地址中，而数据的低位保存在内存的高地址中；小端模式，是指数据的高位保存在内存的高地址中，而数据的低位保存在内存的低地址中；ARM处理器支持Thumb（16位）/ARM（32位）双指令集，能很好的兼容8位/16位器件；MPU为ARM处理器的内存保护单元，MMU是ARM处理器的内存管理单元。故本题选择A。","code":0},{"id":"94","paper":"真考试卷3","no":14,"type":"单项选择题","q":"关于ARM处理器的命名，以下说法错误的是（  ）。","o":["ARM11之前的命名中TDMI中的T的含义是Thumb,即支持高密度16位Thumb指令集","ARM11之后，采用ARM Cortex来命名","ARM Cortex-R为高端应用型Cortex处理器","ARM Cortex-M系列处理器内部没有MMU部件"],"a":"C","e":"此处ARM处理器命名主要是ARM内核命名。在ARM Cortex之前，ARM内核的命名中T表示支持高密度16位的Thumb指令集；ARM11以后则以Cortex命名，分为三个系列，-A，-R，-M系列，分别面向高端应用、实时控制和微控制器。其中ARM Cortex-M内部没有MMU。故本题选择C。","code":0},{"id":"95","paper":"真考试卷3","no":15,"type":"单项选择题","q":"某ARM指令完成的功能是“如果相等，则进行带进位的加法”，该指令是（  ）。","o":["ADCNE R1,R2,R3","ADDEQ R1,R2,R3","ANDEQ R1,R2,R3","ADCEQ R1,R2,R3"],"a":"D","e":"ADD和ADC分别表示加操作和带进位加操作，而AND表示逻辑与操作，NE和EQ分别表示不相等和相等的判断，故本题选择D。","code":0},{"id":"96","paper":"真考试卷3","no":16,"type":"单项选择题","q":"以下ARM指令中属于寄存器间接寻址的指令是（  ）。","o":["TST R1,#0xFE","LDRB R1,[R2]","MOV R1,R0,LSL#3","BIC R0,R0,#0x0B"],"a":"B","e":"寄存器间接寻址就是以寄存器中的值作为操作数地址，而操作数本身存放在存储器中。用于间接寻址的寄存器必须用［］括起来。因此，只有B选项正确，故本题选择B。","code":0},{"id":"97","paper":"真考试卷3","no":17,"type":"单项选择题","q":"以下对伪指令的解释错误的是（  ）。","o":["DCD 0x12；在内存区域分配一个32位字的内存空间并初始化为0x00000012","CODE16；伪指令通知编译器，其后的指令序列为16位的Thumb指令","Test EQU 50； 定义一个常量Test值为50，不能定义32位常数","IMPORT    Main； 该伪指令通知编译器当前文件要引用标号Main，但Main在其他源文件中定义"],"a":"C","e":"DCD为ARM汇编器所支持的数据定义伪指令，用于分配一片连续的字存储单元并用指定的数据初始化，A项正确；CODE16伪指令通知编译器，其后的指令序列为16位的Thumb指令，故B正确；EQU是等于伪指令，用于为程序中的常量、标号等定义一个等效的字符名称，Test EQU 50定义常量Test的值为50，C错误；IMPORT伪指令用于通知编译器要使用的标号在其他源文件中定义，但要在当前源文件中引用，而且无论当前源文件是否引用该标号，该标号均会被加入到当前源文件的符号表中，D项解释正确，故本题选择C。","code":0},{"id":"98","paper":"真考试卷3","no":18,"type":"单项选择题","q":"在ARM汇编语言程序设计中常有分支和循环程序的设计，下面指令中应用于分支和循环的指令操作码是（  ）。\n①B  ②ADD  ③AND  ④LDR  ⑤STR  \n⑥MOV  ⑦EOR  ⑧CMP  ⑨BX  ⑩TEQ","o":["①和⑨","①和⑧","④和⑤","⑧和⑩"],"a":"A","e":"ARM汇编分支程序采用转移指令B、子程序调用指令BL或条件转移指令BX来实现；在ARM汇编中一般没有专门的指令用来实现循环，一般采用比较指令CMP、ADD或SUB等能产生条件的指令，然后再通过带状态的条件转移指令BX来实现。故本题选择A。","code":1},{"id":"99","paper":"真考试卷3","no":19,"type":"单项选择题","q":"下面关于目前嵌入式最小硬件系统的叙述中，错误的是（  ）。","o":["嵌入式最小硬件系统包括嵌入式处理器","嵌入式最小硬件系统包括时钟电路","嵌入式最小系统包括给系统供电的电源电路","嵌入式处理器片内一般不包括存储器，组成最小系统时必须外扩存储器"],"a":"D","e":"嵌入式最小硬件系统一般包括嵌入式处理器、时钟电路、电源电路、复位电路、存储器和调试测试接口。D项不正确，故本题选择D。","code":0},{"id":"100","paper":"真考试卷3","no":20,"type":"单项选择题","q":"下面是关于嵌入式系统使用的存储器的叙述，其中错误的是（  ）。","o":["CPU使用最频繁的少量的程序代码和数据存放在Cache中","系统正在运行的程序的大部分数据和代码存放在主存储器（内存）中","嵌入式系统使用Cache的优点是只需要增加少许成本，就能使整个系统的性能得到显著提高","嵌入式处理器内部的Cache采用DRAM"],"a":"D","e":"在嵌入式系统中，对于CPU使用最频繁的少量的程序代码和数据用SRAM作为高速缓冲存储器（Cache）存放，系统正在运行中的程序的大部分数据和代码存放在主存储器（内存）中，尚未启动运行的其余程序或数据则存放在容量大的外部存储器如磁盘中待命。使用Cache的优点是只需要增加少许成本，就能使整个系统的性能得到显著提高。D项叙述有误，故本题选择D。","code":0},{"id":"101","paper":"真考试卷3","no":21,"type":"单项选择题","q":"下面关于存储器的叙述中，错误的是（  ）。","o":["DDR SDRAM中的DDR是指双倍数据速率","DDR2 SDRAM可预读取2位数据","磁性随机存取存储器MRAM是一种非易失性存储器，拥有SRAM的高速存取能力，以及DRAM的高集成度","铁电存储器FRAM既具有只读存储器非易失性的特点，又具有随机存储器可快速随机读写的特点，而且速度快，功耗低"],"a":"B","e":"DDR是Dual Data Rate的缩写，指双倍数据速率；DDR2使原来DDR可预读取2位变成可预读取4位，把DDR的数据传输速率又提高了两倍（四倍）；磁性随机存取存储器MRAM是一种非易失性存储器，拥有SRAM的高速存取能力，以及DRAM的高集成度；铁电存储器FRAM既具有只读存储器非易失性的特点，又具有随机存储器可快速随机读写的特点，而且速度快，功耗低。B项错误，故本题选择B。","code":0},{"id":"102","paper":"真考试卷3","no":22,"type":"单项选择题","q":"通过SPI进行数据串行通信的原理如下图所示，根据下图提示，确定下面关于SPI的叙述中，哪一个叙述是错误的？","o":["1个时钟信号SCK对应一位数据的发送和另一位数据的接收","数据从主机移位寄存器一位一位移入到从机移位寄存器，同时从机移位寄存器中的数据一位一位移入到主机移位寄存器","8个时钟周期完成1个字节的操作","SPI不能实现全双工通信"],"a":"D","e":"将数据写到SPI发送缓冲区后，一个时钟信号SCK对应一位数据的发送（MISO）和另一位数据的接收（MOSI）；在主机中数据从移位寄存器中自左向右发出送到从机（MOSI），同时从机中的数据自右向左发到主机（MISO），经过8个时钟周期完成1字节的发送。D项错误，故本题选择D。","code":0},{"id":"103","paper":"真考试卷3","no":23,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是（  ）。","o":["在具有OTG的USB总线上，可以实现在没有主机情况下从设备之间直接进行点对点通信","USB 2.0 的速度为480Mbps，USB3.0达到640Mbps","主机的USB接口向从设备提供了电源","USB支持热插拔"],"a":"B","e":"USB OTG的作用是可以摆脱主机，直接在具有OTG的USB总线上完成点对点通信，实现在没有主机的情况下从设备之间直接进行数据传送，故A正确；目前USB2.0的速度为60MB/s，即480Mbps，USB3.0达到5Gb/s即640MB/s，也是5120Mbps，故B项错误；USB接口提供了内置电源，主机的USB接口向从设备提供电源，C正确；USB总线接口支持设备的即插即用和热插拔功能，所以D也正确。故本题选择B。","code":0},{"id":"104","paper":"真考试卷3","no":24,"type":"单项选择题","q":"下面关于嵌入式系统中使用的触摸屏的叙述中，错误的是（  ）。","o":["目前嵌入式系统中使用的触摸屏除电阻式触摸屏外，还有电容式触摸屏","电阻式触摸屏是一种电阻传感器，它将矩形区域中触摸点(X,Y)的物理位置转换为代表X坐标和Y坐标的电压","电阻式触摸屏通过多点触摸或滑动进行操作","相对于电容式触摸屏，电阻式触摸屏结构简单、价格低"],"a":"C","e":"目前的触摸屏有两种形式，一种是电阻式触摸屏（俗称软屏），另一种是电容式触摸屏（俗称硬屏）。电阻式触摸屏是一种电阻传感器，它将矩形区域中触摸点(X,Y)的物理位置转换为代表X坐标和Y坐标的电压，基本原理是利用压力感应进行控制，结构简单，价格低；而电容式触摸屏结构复杂，价格高，带多点触摸或滑动操作的触摸屏均属于电容式。故本题选择C。","code":0},{"id":"105","paper":"真考试卷3","no":25,"type":"单项选择题","q":"下面关于LCD显示设备的叙述中，错误的是（  ）。","o":["LCD显示屏自身不带控制器，没有驱动电路，仅仅是显示器件，价格最低","LCD显示模块内置LCD显示屏、控制器和驱动模块，有字符型、有图形点阵型等","PC机通常使用的是LCD显示器，除具备显示屏外，还包括驱动器、控制器以及外壳等，是完整的LCD显示设备","DVI（Digital Visual Interface）是一种LCD控制器的标准"],"a":"D","e":"LCD显示屏自身不带控制器，没有驱动电路，仅仅是显示器件（屏），价格最低；LCD显示模块内置了LCD显示屏、控制器和驱动模块，这类显示模块有字符型、有图形点阵型等。PC机通常使用的是LCD显示器，除具备显示屏外还包括驱动器、控制器以及外壳等，是完整的LCD显示设备，其接口也有相应的标准，主要包括VGA、DVI两种主要形式，现在又开始流行HDMI接口。D项叙述错误，故本题选择D。","code":0},{"id":"106","paper":"真考试卷3","no":26,"type":"单项选择题","q":"下面关于三星公司基于ARM9内核的S3C2410嵌入式微处理器芯片的叙述中，错误的是（  ）。","o":["S3C2410包含32位嵌入式微处理器","内部具有分离的指令Cache和数据Cache","高速组件和低速外设接口均采用AHB总线","内部集成了存储器控制器"],"a":"C","e":"S3C2410是三星公司基于ARM920T核的两款嵌入式微处理器，属于中高档32位嵌入式微处理器；内部具有分离的16KB大小的指令Cache和16KB大小的数据Cache；使用ARM公司特有的AMBA总线，对于高速组件采用AHB总线，而对于低速外设接口则采用APB总线，AHB通过桥接器链接APB；芯片内部集成了许多硬件组件，包括了内部SRAM、外部存储器控制器等等。综上可知，C项错误，故本题选择C。","code":0},{"id":"107","paper":"真考试卷3","no":27,"type":"单项选择题","q":"下面关于S3C2410嵌入式微处理器芯片RTC的叙述中，错误的是（  ）。","o":["实时钟模块RTC采用单独的供电引脚和单独的时钟源","RTC内部的年（YEAR）、月（MON）、日（DAY）数据寄存器中的数据以BCD码表示","RTC 内部的寄存器读写有一个使能位，在访问RTC 寄存器之前需要先使这个使能位置位，这是为了保护系统的实时时钟不被误写","RTC内部的寄存器能以8位、16位或32位的方式访问"],"a":"D","e":"实时时钟（RTC）组件是一种能提供日历/时钟等功能的内置硬件。S3C2410的RTC具有的主要功能包括BCD数据、闰年产生器、告警功能、独立的电源端口、支持毫秒滴答时钟中断作为RTOS核的滴答时钟、循环复位功能等。实时时钟模块RTC采用单独的供电引脚和单独的时钟源；实时时钟控制寄存器RTCCON共4位，控制时钟计数复位、BCD计数、时钟选择以及确定是否允许RTC读/写等；RTC内部的数据寄存器都是8位寄存器，存放相应的BCD码值。D项错误，故本题选择D。","code":0},{"id":"108","paper":"真考试卷3","no":28,"type":"单项选择题","q":"下面关于UART、RS-232、RS-485的叙述中，错误的是（  ）。","o":["基于UART可以构成RS-232接口和RS-485接口","RS-485接口标准的最长通信距离与RS-232接口标准的最长通信距离相当","RS-485标准采用差分信号传输方式，因此具有很强的抗共模干扰能力","通过RS-485可构成主从式多机通信系统，主机可采用轮询方式与各从机建立通信连接"],"a":"B","e":"嵌入式处理器至少有一个UART接口，采用标准的电平转换电路可以构成RS-232接口和RS-485接口；RS-232无法消除共模干扰，且通信距离只有15m左右，RS-485采用差分信号传输方式，因此具有很强的抗共模干扰能力，传输距离可以达到1200m，通常用于主从式多机通信系统，主机可采用轮询方式与各从机建立通信连接。B项叙述错误，故本题选择B。","code":0},{"id":"109","paper":"真考试卷3","no":29,"type":"单项选择题","q":"下列系统属于实时系统的是（  ）。","o":["电子邮件系统","电子书阅读器","微博","飞行控制系统"],"a":"D","e":"实时系统的主要特征是能够及时响应外部发生的随机任务请求，并且能够在规定的时限内完成任务。典型的实时系统有民航导航系统、防空预警系统、电力输送控制系统等；典型的非实时系统有视频播放系统、博客发布系统、手机交互式城市交通导航系统等。四个选项中只有D项是实时系统，故本题选择D。","code":0},{"id":"110","paper":"真考试卷3","no":30,"type":"单项选择题","q":"下列哪个不是RTOS的实时指标？（  ）。","o":["持续时间","吞吐量","生存时间","响应时间"],"a":"A","e":"实时操作系统（RTOS）是一种专门服务于实时系统应用请求的操作系统。它的实时性能指标主要根据三个指标来衡量：响应时间、吞吐量和生存时间。故本题选择A。","code":0},{"id":"111","paper":"真考试卷3","no":31,"type":"单项选择题","q":"μC/OS-II具有良好的可裁剪性和可移植性，能够支持的任务数最多为（  ）。","o":["16","32","64","128"],"a":"C","e":"很明显，μC/OS-II具有良好的可裁剪性和可移植性，能够支持的任务数最多为64。故本题选择C。","code":0},{"id":"112","paper":"真考试卷3","no":32,"type":"单项选择题","q":"按照内核结构，可将嵌入式操作系统分为单内核操作系统与微内核操作系统，下列不属于微内核操作系统的是（  ）。","o":["iOS","Android OS","Symbian","μC/OS-II"],"a":"B","e":"嵌入式操作系统按照内核结构可以分为单内核操作系统跟微内核操作系统；属于微内核结构的典型嵌入式操作系统有Symbian、VxWorks、QNX、μC/OS-II、iOS等。故本题选择B。","code":0},{"id":"113","paper":"真考试卷3","no":33,"type":"单项选择题","q":"一般而言，移植VxWorks操作系统有4种操作类型，下面不属于这4种操作类型的是（  ）。","o":["用户界面移植","宿主机移植","体系结构移植","目标板移植"],"a":"A","e":"一般而言，移植VxWorks操作系统有下列四种操作类型：宿主机移植、体系结构移植、目标板移植和升级以前Tornado集成开发环境版本的BSP到最新版本。故本题选择A。","code":0},{"id":"114","paper":"真考试卷3","no":34,"type":"单项选择题","q":"下列不是实时操作系统的是（  ）。","o":["VxWorks","RTAI","RTLinux","Windows7"],"a":"D","e":"RTOS的特点是响应中断请求并且完成相应中断服务子程序（ISR）的时间非常快。四个选项中，VxWorks、RTAl和RTLinux均是实时操作系统，故此题选择D项。","code":0},{"id":"115","paper":"真考试卷3","no":35,"type":"单项选择题","q":"关于硬件抽象层，下面的描述中错误的是（  ）。","o":["硬件抽象层是嵌入式硬件电路板的最基本软件","硬件抽象层包含嵌入式软件中直接访问底层硬件的例程集合","HAL的函数是移植操作系统的基础","硬件抽象层是操作系统内核的重要组成部分"],"a":"D","e":"硬件抽象层（HAL）最早由微软公司在研发Windows NT操作系统时提出，在嵌入式领域，硬件抽象层主要用来简化嵌入式操作系统的移植作业，其定义与微软公司在Windows NT 开发时的实现目标基本一致，指的是嵌入式软件中直接访问底层硬件的例程集合。在嵌入式系统软件结构中增加的HAL位于硬件电路板和操作系统内核之间，它是嵌入式硬件电路板的最基本软件，HAL的函数是移植操作系统的基础。A、B、C项正确，故本题选择D。","code":0},{"id":"116","paper":"真考试卷3","no":36,"type":"单项选择题","q":"在Bootloader的stage1中，以下各步骤的顺序应为：（  ）。\na.跳转到stage2的C程序入口点\nb.为加载stage2准备RAM空间\nc.拷贝stage2的执行代码到RAM空间中\nd.基本硬件初始化","o":["bdac","dbca","dbac","dcba"],"a":"B","e":"Bootloader的stage1的基本步骤（按执行先后顺序列出）为：基本硬件初始化，为加载stage2准备RAM空间，拷贝stage2的执行代码到RAM空间中，设置栈区指针SP，跳转到stage2的C程序入口点。正确顺序为dbca，故本题选择B。","code":1},{"id":"117","paper":"真考试卷3","no":37,"type":"单项选择题","q":"下列不是单内核操作系统的是（  ）。","o":["Unix","Windows CE","Android OS","QNX"],"a":"D","e":"单内核结构的操作系统有传统的Unix、BSD Unix、Linux、MS-DOS、Windows 9x（Windows 95/98/Me）、Windows CE和Android ；采用纯粹微内核结构的操作系统有AIX、Mach、Minix、VxWorks、QNX等。由此可知，D选项QNX不是单内核，是微内核，故本题答案为D选项。","code":0},{"id":"118","paper":"真考试卷3","no":38,"type":"单项选择题","q":"嵌入式Linux中，不属于Linux内核部分的功能是（  ）。","o":["用户界面","内存管理","网络接口","进程间通信"],"a":"A","e":"Linux内核主要由5个子系统组成，进程调度（SCHED），内存管理（MM），虚拟文件系统（VFS），网络接口（NET），进程间通信（IPC）。A项用户界面并不属于内核部分的功能，故本题选择A。","code":0},{"id":"119","paper":"真考试卷3","no":39,"type":"单项选择题","q":"嵌入式系统的开发有一些不同于通用计算机应用开发的特点，下面不属于嵌入式系统开发特点的是（  ）。","o":["通常需要固化程序，即把软件代码烧写到非易失性存储器中","应用软件必须在基于嵌入式操作系统平台上来开发","通常采用宿主机-目标机的开发架构","软件开发中通常涉及许多底层的硬件控制程序"],"a":"B","e":"嵌入式应用产品的产品生命周期短，上市时间紧，功耗限制严，开发环境变化大，因此嵌入式系统的开发有些不用于通用计算机应用开发，主要有以下特点：①使用宿主机—目标机的开发架构②与底层硬件控制程序的关系密切③软硬件资源受限制④需要固化程序。故本题选择B。","code":0},{"id":"120","paper":"真考试卷3","no":40,"type":"单项选择题","q":"嵌入式系统开发中，要想准确地定位软件和硬件中出现的错误，必须借助多种硬件和软件开发调试工具。下面所列出的不属于嵌入式系统开发调试工具的是（  ）。","o":["在线仿真器","JTAG适配器","示波器","传感器"],"a":"D","e":"嵌入式系统开发中，要想准确地定位软件和硬件中出现的错误，必须借助多种硬件和软件开发调试工具，调试工具的任务是控制程序代码的执行并使系统中看不见的信息称为可视。不同复杂程度的嵌入式系统使用的调试工具不完全相同，主要有在线仿真器，JTAG适配器，驻留监控软件，指令模拟器。选项D中的传感器不属于嵌入式开发调试工具，故本题选择D。","code":0},{"id":"121","paper":"真考试卷4","no":1,"type":"单项选择题","q":"与个人计算机（PC）相比，嵌入式系统具有许多不同的特点。下面不属于嵌入式系统特点的是（  ）。","o":["嵌入式系统大多面向控制应用，系统的可靠性十分重要","嵌入式系统不需要操作系统","嵌入式系统大多具有不同程度的实时性","许多嵌入式系统中的软件都固化在只读存储器中"],"a":"B","e":"广义上讲，凡是带有微处理器的专用软硬件系统都可称为嵌入式系统。狭义上讲，嵌入式系统强调那些使用嵌入式微处理器构成的具有自己的操作系统和特定功能、用于特定场合的独立系统。所以选项B不属于嵌入式系统的特点，故本题选择B。","code":0},{"id":"122","paper":"真考试卷4","no":2,"type":"单项选择题","q":"嵌入式系统中的CPU具有一些与通用计算机所使用CPU不同的特点，下面不是其特点的是（  ）。","o":["低功耗","64位字长","支持实时处理","集成了测试电路"],"a":"B","e":"根据CPU的字长，微处理器产品有4位、8位、16位、32位和64位之分。故B错误。嵌入式系统中的CPU的另一个特点是结构可扩展，故本题选择B。","code":0},{"id":"123","paper":"真考试卷4","no":3,"type":"单项选择题","q":"下面关于片上系统（SoC）的叙述中，错误的是（  ）。","o":["SoC芯片中可以包含数字电路、模拟电路及数字/模拟混合电路，但不含射频电路","SoC单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能","SoC有通用SoC芯片和专用SoC芯片之分","专用SoC芯片按其制作工艺分为定制芯片和现场可编程芯片两类"],"a":"A","e":"SoC芯片中既包含数字电路，也可以包含模拟电路，甚至还能包含数字/模拟混合电路和射频电路。所以选项A错误，故本题选择A。","code":0},{"id":"124","paper":"真考试卷4","no":4,"type":"单项选择题","q":"微电子技术特别是集成电路制造技术是嵌入式系统发展的重要基础，下面关于集成电路的叙述中错误的是（  ）。","o":["集成电路的特点是体积小、重量轻、可靠性高","集成电路大多是在硅衬底上制作而成的","集成电路的制造工艺复杂且技术难度非常高，许多工序必须在恒温、恒湿、超洁净的无尘厂房内完成","集成电路的工作速度主要取决于电路结构和工作电压的高低,与电路元件的尺寸无关"],"a":"D","e":"集成电路的工作速度主要取决于组成逻辑门电路的晶体管尺寸。晶体管的尺寸越小，其极限工作频率越高，门电路的开关速度就越快，故本题选择D。","code":0},{"id":"125","paper":"真考试卷4","no":5,"type":"单项选择题","q":"大多数嵌入式系统都必须处理汉字信息。下面关于汉字在系统中表示方法的叙述中，错误的是（  ）。","o":["GB2312采用双字节进行存储和传输汉字","GB18030采用双字节或四字节存储和传输汉字","Unicode/UTF-8采用三个字节存储和传输汉字","Unicode/UTF-16采用四个字节存储和传输汉字"],"a":"D","e":"GB2312是双字节编码标准，每个汉字和符号均用两个字节表示，A选项叙述正确；GB18030是变长编码，对常用汉字采用双字节，对生僻字和扩展汉字采用四字节，B选项叙述正确；UTF-8是Unicode的一种编码方式，对于大部分常用汉字（即基本多文种平面BMP中的汉字），UTF-8编码占用3个字节，C选项叙述正确；Unicode/UTF-16编码中，基本多文种平面（BMP）中的汉字占用2个字节，只有超出BMP的扩展汉字才需要4个字节，D选项叙述错误，故本题答案为D选项。","code":0},{"id":"126","paper":"真考试卷4","no":6,"type":"单项选择题","q":"假设一台数码相机一次可连续拍摄24位色（真彩色）的4096 x 4096的彩色相片160张，数据压缩比平均是4，则它使用的存储器容量大约是（  ）。","o":["1GB","2GB","3GB","4GB"],"a":"B","e":"一幅图像的数据量可按下面的公式进行计算（以字节为单位）：图像数据量=图像水平分辨率×图像垂直分辨率×像素深度/8=4096×4096×24/8=50331648B，则存储容量=图像数据量×相片数量/数据压缩=50331648×160/4=2013265920B≈2GB，故本题选择B。","code":0},{"id":"127","paper":"真考试卷4","no":7,"type":"单项选择题","q":"音频信号数字化过程中必须进行量化处理，下面有关音频信号量化处理的叙述中，错误的是（  ）。","o":["量化就是把每个样本的模拟量转换成数字量来表示","量化过程往往也称为A/D转换（模数转换）","音频信号量化后的样本一般用8位、12位或16位的十进制整数表示","量化精度越高，声音的保真度越好，量化精度越低，声音的保真度越差"],"a":"C","e":"量化后的样本一般用8位、12位或16位二进制整数表示（称为“量化精度”），故本题选择C。","code":0},{"id":"128","paper":"真考试卷4","no":8,"type":"单项选择题","q":"IP协议在计算机网络的互连中起着重要的作用。下面有关IP地址的叙述中，错误的是（  ）。","o":["任何连接到互联网的终端设备都必须有一个IP地址","每个终端设备的IP地址是始终固定不变的","IPv4协议规定IP地址用32位二进制表示","为方便使用IP地址也可以使用“点分十进制”表示"],"a":"B","e":"每个终端设备的IP地址并不是始终固定不变的，而是可以修改的。选项B错误，故本题选择B。","code":0},{"id":"129","paper":"真考试卷4","no":9,"type":"单项选择题","q":"以下关于嵌入式处理器的说法正确的是（  ）。","o":["RISC和CISC指的是存储结构","哈佛结构是程序与数据统一的存储结构","ARM处理器都是RISC结构","RISC结构和哈佛结构是不能共存的"],"a":"C","e":"嵌入式处理器的体系结构按指令集可分为两大类：复杂指令集结构（CISC）和精简指令集结构（RISC）。进一步细分，按存储机制分为冯·诺依曼结构及哈佛结构。冯·诺依曼结构中数据和程序统一，使用一条总线；而哈佛结构中使用两条独立的总线，不允许指令和数据并存。指令集和存储机制可以共存。ARM处理器采用RISC结构。选项C正确，故本题选择C。","code":0},{"id":"130","paper":"真考试卷4","no":10,"type":"单项选择题","q":"关于ARM嵌入式处理器的工作状态，以下说法错误的是（  ）。","o":["ARM状态是32位指令的状态，指令代码全部是4个字节长度","Thumb状态为16位指令状态，指令长度为16位","Thumb-2状态兼容16位指令和32位指令编码","ARM状态和Thumb状态可以相互切换，复位时自动进入Thumb状态"],"a":"D","e":"ARM与Thumb间可以互相切换。如果Thumb状态进入异常处理（异常处理要在ARM状态下进行），则当异常返回时，将自动切换到Thumb状态。当处理器进行异常处理时，则从异常向量地址开始执行，将自动进入ARM状态。D选项错误，故本题选择D。","code":0},{"id":"131","paper":"真考试卷4","no":11,"type":"单项选择题","q":"以下关于ARM处理器寄存器说法错误的是（  ）。","o":["R0~R7在任何模式下均作为通用寄存器使用","R0~R15寄存器的位数为32位","作为链接寄存器LR的是R14","堆栈指针SP使用的寄存器是R15"],"a":"D","e":"堆栈指针SP使用的寄存器是R13, 链接寄存器LR使用的寄存器是R14，程序计数器PC使用的寄存器是R15。选项D错误，故本题选择D。","code":0},{"id":"132","paper":"真考试卷4","no":12,"type":"单项选择题","q":"以下关于ARM处理器说法错误的是（  ）。","o":["大端格式是指数据的高字节存储在高字节地址中，低字节数据存放在低字节地址中","ARM处理器支持8位、16位和32位数据处理","MPU为ARM处理器的存储器保护单元","MMU为ARM处理器的存储器管理单元"],"a":"A","e":"大端格式是指数据的高字节存储在低字节地址中，低字节数据存放在高字节地址中；小端格式是指数据的高字节存储在高字节地址中，低字节数据存放在低字节地址中。选项A错误，故本题选择A。","code":0},{"id":"133","paper":"真考试卷4","no":13,"type":"单项选择题","q":"关于ARM指令中的条件域，以下表述错误的是（  ）。","o":["HI为无符号数大于","CC为无符号数小于","GT为带符号数大于","LE为带符号数小于"],"a":"D","e":"LE为带符号数小于或等于。选项D错误，故本题选择D。","code":0},{"id":"134","paper":"真考试卷4","no":14,"type":"单项选择题","q":"需要ARM指令完成的功能是：如果不相等，则进行减法，正确的指令是（  ）。","o":["SUBVS R1,R2,R3","SUBEQ R1,R2,R3","SUBLS R1,R2,R3","SUBNE R1,R2,R3"],"a":"D","e":"SUBVS表示溢出时相减，SUBEQ表示相等时相减，SUBLS表示无符号数小于或等于时相减，SUBNE表示不相等时相减。故本题选择D。","code":0},{"id":"135","paper":"真考试卷4","no":15,"type":"单项选择题","q":"以下ARM指令中源操作数属于立即寻址的指令是（  ）。","o":["SUBCC R1,R2,R3","LDRB R0,[R1]","AND R1,R,R3","MOV R1,#0x0B"],"a":"D","e":"立即寻址也称立即数寻址，这是一种特殊的寻址方式，操作数本身就在指令中给出，只要取出指令也就取到了操作数。这个操作数被称为立即数。A和C均为寄存器寻址。B为寄存器间接寻址。故本题选择D。","code":0},{"id":"136","paper":"真考试卷4","no":16,"type":"单项选择题","q":"以下对伪指令的解释正确的是（  ）。","o":["DCD 0x23;在内存区域分配一个字节的内存空间并初始化为0x23","CODE16;伪指令通知编译器，其前的指令序列为16位的Thumb指令","MyBaud     EQU    9600;    定义一个常量MyBaud的值为9600","IMPORT Label;声明一个全局的标号Label，该标号可在其他文件中引用"],"a":"C","e":"DCD用于分配一片连续的字存储单元并用指定的数据初始化；CODE16伪指令通知编译器，其后的指令序列为16位的Thumb指令；EQU伪指令用于为程序中的常量、标号等定义一个等效的字符名称，类似于C语言中的#define。IMPORT伪指令用于通知编译器要使用的标号在其他的源文件中定义，但要在当前源文件中引用，而且无论当前源文件是否引用该标号，该标号均会被加入到当前源文件的符号表中。故本题选择C。","code":0},{"id":"137","paper":"真考试卷4","no":17,"type":"单项选择题","q":"在ARM汇编语言程序设计中，用于子程序设计及调用，最常用的指令是（  ）。","o":["BL MyLabel","BX MyLabel","BLX MyLabel","B MyLabel"],"a":"A","e":"在ARM汇编语言程序中，子程序的调用一般是通过BL指令来实现的。B为（无）条件转移，BL为带返回的转移，BX为带状态切换的转移，BLX为带返回且带状态切换的转移。故本题选择A。","code":0},{"id":"138","paper":"真考试卷4","no":18,"type":"单项选择题","q":"将R1寄存器中的指定位bit0和bit3清零，以下ARM汇编指令正确的是（  ）。","o":["AND R1,R1,#0xFFFFFFF6","BIC R1,R1,#0xFFFFFFF6","EOR R1,R1,#0xFFFFFFF6","ORR R1,R1,#0xFFFFFFF6"],"a":"A","e":"和0相与清零，和1相与保持不变。BIC表示位清除，EOR表示逻辑异或，ORR表示逻辑或，和0相或保持不变，和1相或置1。选项A正确，故本题选择A。","code":0},{"id":"139","paper":"真考试卷4","no":19,"type":"单项选择题","q":"下面与嵌入式处理器复位相关的叙述中，错误的是（  ）。","o":["嵌入式处理器都有一个系统复位引脚为nRESET或RESET，nRESET表示高电平复位","嵌入式系统常使用外接复位芯片提供的复位信号来实现系统的可靠复位","有些微处理器用复位芯片可通过两个不同引脚分别输出高电平或低电平有效的复位信号","ARM复位后PC指针指向某个唯一的地址"],"a":"A","e":"嵌入式处理器都有一个系统复位引脚为nRESET或RESET，n表示低电平复位，不带n的表示高电平复位。本题答案为A选项。","code":0},{"id":"140","paper":"真考试卷4","no":20,"type":"单项选择题","q":"下面是关于AMBA总线的叙述：\n    Ⅰ.按照AMBA规范，以ARM内核为基础的嵌入式处理芯片采用系统总线与外围总线的层次结构构建片上系统\n    Ⅱ. AMBA的系统总线主要用于连接高带宽快速组件\n    Ⅲ. AMBA的外围总线主要连接低带宽组件以及与外部相连的硬件组件\n    Ⅳ. 系统总线通过桥接器与外围总线互连\n  上述叙述中，正确的是（  ）。","o":["仅Ⅰ","仅Ⅰ和Ⅱ","仅Ⅰ、Ⅱ和Ⅲ","全部"],"a":"D","e":"按照AMBA规范，以ARM内核为基础的嵌入式处理芯片采用系统总线与外围总线的层次结构构建片上系统。AMBA的系统总线主要用于连接高带宽快速组件。AMBA的外围总线主要连接低带宽组件以及与外部相连的硬件组件。系统总线通过桥接器与外围总线互连。全部选项正确，故本题选择D。","code":1},{"id":"141","paper":"真考试卷4","no":21,"type":"单项选择题","q":"下面是关于嵌入式系统使用的存储器的叙述，其中错误的是（  ）。","o":["嵌入式系统使用的存储器以半导体存储器为主","铁电存储器（FRAM）在嵌入式系统已得到应用","静态存储器SRAM是非易失性存储器","动态存储器DRAM是易失性存储器"],"a":"C","e":"随机存取存储器包括静态和动态两种形式，即SRAM和DRAM，它们都是易失性存储器，即掉电后信息丢失。C选项错误，故本题选择C。","code":0},{"id":"142","paper":"真考试卷4","no":22,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C的叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C即集成电路互连总线","I<SUP>2<\/SUP>C是一种串行半双工传输的总线","I<SUP>2<\/SUP>C总线只能连接一个主控器件","I<SUP>2<\/SUP>C传送数据时，每次传送的字节数目没有限制"],"a":"C","e":"I<SUP>2<\/SUP>C总线可以挂接多个器件，其中主动发起数据传输操作的I2C器件是主控器件（主器件），否则它就是从器件。C选项错误，故本题选择C。","code":0},{"id":"143","paper":"真考试卷4","no":23,"type":"单项选择题","q":"下面关于USB的叙述中，正确的是（  ）。","o":["USB 2.0采用全双工通信方式","USB 2.0采用差分信号传输方式","Mini USB接口不提供电源","USB 总线通信采用多主方式"],"a":"B","e":"USB总线（1.1和2.0）有4根信号线，采用半双工差分方式，用来传送信号并提供电源。Mini USB也提供电源。USB总线通常采用主从方式，它有一个主机，负责管理所有USB设备的连接与删除、发起与USB设备的通信等。故本题选择B。","code":0},{"id":"735","paper":"真考试卷4","no":24,"type":"单项选择题","q":"下面关于嵌入式系统中使用的触摸屏的叙述中，错误的是（  ）。","o":["目前嵌入式系统中使用的触摸屏除电容式触摸屏外，还有电阻式触摸屏","使用电容式触摸屏的LCD显示器多半是硬屏","用专用硬笔写字的触摸屏属于电容式","电容式触摸屏在触摸屏四边均镀上狭长的电极，在导电体内形成一个低电压交流电场，当手指触摸屏幕时，手指会从接触点吸走一个很小的电流"],"a":"C","e":"目前的触摸屏有两种形式，一种是电阻式触摸屏（俗称软屏），另一种是电容式触摸屏（俗称硬屏）。用专用硬笔写字的触摸屏属于电阻式，带多点触摸或滑动操作的触摸屏均属于电容式。选项C错误，故本题选择C。","code":0},{"id":"145","paper":"真考试卷4","no":25,"type":"单项选择题","q":"8段共阳极LED数码管示意如图所示，为了显示字符9，其二进制代码（按dp g f e d c b a的顺序排列）是（  ）。","o":["10000010","10001100","10000000","10010000"],"a":"D","e":"对于共阳极LED数码管，当输入为0时点亮，当输入为1时灭。要显示字符9，只需e和dp段灭，即e和dp段输入1。故本题选择D。","code":0},{"id":"146","paper":"真考试卷4","no":26,"type":"单项选择题","q":"下面关于S3C2410存储器控制的叙述中，错误的是（  ）。","o":["存储器控制器和NAND Flash控制器等属于存储器控制组件","系统的I/O与存储器采用统一编址方式","地址空间共1GB","所有BANK的总线宽度只能选择16位或32位"],"a":"D","e":"S3C2410存储器控制组件包括存储器控制器、总线控制器、外部主控器、NAND Flash控制器等。存储器控制器提供访问外部存储器所需的存储器控制信号，支持大/小端模式，地址空间共1GB（8个BANK，每个BANK大小为128MB）。以ARM芯片为核心的嵌入式系统其I/O与存储器采用统一编址方式，并不像x86那样采用的是I/O映射编址（独立编址）方式。BANK0只能是16位和32位总线宽度的访问，其他所有BANK可访问8位、16位和32位。选项D错误，故本题选择D。","code":0},{"id":"147","paper":"真考试卷4","no":27,"type":"单项选择题","q":"下面关于S3C2410嵌入式微处理器芯片GPIO端口的叙述中，错误的是（  ）。","o":["GPIO端口有GPA/GPB/GPC/GPD共4个并行I/O接口","GPIO端口的多个并行I/O接口中，有的接口的功能是单一的，有的接口的功能是复用的","GPIO端口的每个并行I/O接口都有控制寄存器、数据寄存器以及上拉寄存器","GPIO端口属于芯片内部的低带宽组件"],"a":"A","e":"S3C2410的GPIO端口有GPA/GPB/GPC/GPD/GPE/GPF/GPG/GPH多个并行I/O接口。选项A错误，故本题选择A。","code":0},{"id":"148","paper":"真考试卷4","no":28,"type":"单项选择题","q":"下面关于UART、RS-232、RS-485的叙述中，错误的是（  ）。","o":["基于UART可以构成RS-232接口","基于UART不能构成RS-485接口","RS-232接口标准的最长通信距离为15m","通过RS-485可构成主从式多机通信系统，主机可采用轮询方式与各从机建立通信连接"],"a":"B","e":"基于UART可以构成RS-232接口和RS-485接口。RS-232接口标准的最长通信距离为15m，而RS-485接口标准的最长通信距离为1200m。RS-485通常用于主从式多机通信系统，采用轮询方式，由主机逐一向从机寻址，当从机地址与主机发送的地址一致时，才建立通信链接，进行有效数据通信。选项B错误，故本题选择B。","code":0},{"id":"149","paper":"真考试卷4","no":29,"type":"单项选择题","q":"关于μC/OS-II的基本特点，下列叙述中错误的是（  ）。","o":["μC/OS-II是抢占式实时操作系统内核","μC/OS-II不支持时间片轮转调度法，因此赋给每一个任务的优先级是相同的","μC/OS-II中每个任务拥有自用栈","μC/OS-II属于源码公开的实时嵌入式操作系统"],"a":"B","e":"μC/OS-II不支持时间片轮转调度法，因此赋给每一个任务的优先级是不相同的。选项B错误。μC/OS-II是抢占式实时操作系统内核且每个任务拥有自用栈。μC/OS-II属于源码公开的实时嵌入式操作系统。故本题选择B。","code":0},{"id":"150","paper":"真考试卷4","no":30,"type":"单项选择题","q":"关于μC/OS-II的叙述，正确的是（  ）。","o":["μC/OS-II系统拥有统一的驱动程序，不需要开发商自行开发","μC/OS-II包含基本设备驱动程序","使用μC/OS-II的栈空间校验函数，可以确定每个任务到底需要多少栈空间","μC/OS-II是一个单内核操作系统"],"a":"C","e":"μC/OS-II基本不包含设备驱动程序，只是一个纯内核。μC/OS-II驱动程序属于底层，需要系统开发商自行开发。使用μC/OS-II的栈空间校验函数，可以确定每个任务到底需要多少栈空间。选项C正确，故本题选择C。","code":0},{"id":"151","paper":"真考试卷4","no":31,"type":"单项选择题","q":"在μC/OS-II中，OSSched（  ）函数是任务调度的前导函数，用于判断进行任务调度的条件是否满足。下列满足条件的变量值为（  ）。","o":["OSIntNesting=0，OSLockNesting=0","OSIntNesting=0，OSLockNesting=1","OSIntNesting=1，OSLockNesting=0","OSIntNesting=1，OSLockNesting=1"],"a":"A","e":"OSSched()函数是任务调度的前导函数，判断进行任务调度的三个条件是否满足。这三个条件是：（1）中断嵌套层数共享全程变量OSIntNesting=0，也就是所有的ISR已经执行完毕。（2）任务调度加锁层数共享全程变量OSLockNesting=0，也就是调度没有被禁止。调度器上锁函数OSSchedlock()对共享变量OSLockNesting做加1操作，用于禁止任务调度，直到任务完成后，再调用给调度器开锁函数OSSchedUnlock()对共享变量OSLockNesting做减1操作。（3）就绪表查找到的最高优先级任务的优先级比当前任务的优先级高。故本题选择A。","code":0},{"id":"152","paper":"真考试卷4","no":32,"type":"单项选择题","q":"μCOS-II操作系统的下面4个主要函数中，只有一个是与任务调度相关的，它是（  ）。","o":["OSTickISR()","OS_Sched()","OSIntExit()","OSTaskCreate()"],"a":"B","e":"OS_Sched()是μC/OS-II 的任务调度器，负责查找最高优先级就绪任务并执行上下文切换。OSTickISR()为时钟中断，用于触发调度；OSIntExit()为中断退出函数，仅检查是否需调度；OSTaskCreate()为任务创建函数。综上所述，本题答案为B选项。","code":0},{"id":"153","paper":"真考试卷4","no":33,"type":"单项选择题","q":"下面关于Unix与Linux的叙述中，错误的是（  ）。","o":["Linux属于一种“类Unix”系统","Unix是优秀的主流操作系统","两者的源代码不同，两者的函数名称和参数也各不相同","Linux的运行效率还没有超过Unix"],"a":"C","e":"Linux的源代码与Unix的源代码是完全不同的，尽管函数和命令的功能、处理结果、函数名称和参数十分相同，以及Unix的行命令、驱动程序和应用程序在Linux上能够运行，选项C错误。Unix是优秀的主流操作系统，Linux属于一种“类Unix”系统，Linux的运行效率还没有超过Unix。故本题选择C。","code":0},{"id":"154","paper":"真考试卷4","no":34,"type":"单项选择题","q":"下列选项中用于完成创建任务的自用栈空间的μC/OS-II程序源代码的是（  ）。","o":["OS_CPU_C.C","OS_CORE.C","OS_MEM.C","OS_TASK.C"],"a":"A","e":"OS_CPU_C.C用于创建任务的自用栈空间、定义用户接口hook函数原型等。OS_CORE.C为核心调度代码，功能包括系统初始化、启动多任务调度开始运行、任务创建管理与调度、TCB初始化、就绪表初始化、ECB初始化、任务事件就绪表、空闲任务等。OS_MEM.C为内存管理，包括创建分区、获得存储块等。OS_TASK.C为任务管理，包括改变一个任务的优先级、创建或者删除一个任务、挂起一个任务、恢复一个被挂起的任务等。故本题选择A。","code":0},{"id":"155","paper":"真考试卷4","no":35,"type":"单项选择题","q":"在μC/OS-II中，OSInit（  ）函数先建立最初的任务就绪表，然后建立4个空白的数据链表。这4个空白的数据链表是（  ）。","o":["任务控制块链表、事件控制块链表、标志链表和进程控制块链表","任务控制块链表、事件控制块链表、消息链表和进程控制块链表","任务控制块链表、事件控制块链表、标志链表和内存控制块链表","任务控制块链表、事件控制块链表、消息链表和内存控制块链表"],"a":"C","e":"在μC/OS-II中，OSInit()函数先建立最初的任务就绪表，然后建立4个空白的数据链表。它们分别是任务控制块链表、事件控制块链表、标志链表和内存控制块链表。故本题选择C。","code":0},{"id":"156","paper":"真考试卷4","no":36,"type":"单项选择题","q":"以下关于Linux的叙述，错误的是（  ）。","o":["Linux内核第一次问世是在1991年10月","Linux是一种微内核结构","同一个应用程序在UNIX环境下的运行速度和效率往往高于Linux环境","Linux系统最初以Unix为原型，以实现 POSIX标准作为其目标"],"a":"B","e":"Unix、嵌入式Linux、WinCE、Mac OS、Android OS和DOS操作系统是典型的单内核操作系统。属于微内核结构的典型嵌入式操作系统有Symbian、VxWorks、QNX、μC/OS-II等。选项B错误，故本题选择B。","code":0},{"id":"157","paper":"真考试卷4","no":37,"type":"单项选择题","q":"Linux内核的子系统中，不包括（  ）。","o":["进程调度","虚拟文件系统","内存管理","通用公共许可协议"],"a":"D","e":"Linux内核主要由5个子系统组成：进程调度（SCHED），内存管理（MM），虚拟文件系统（VFS），网络接口（NET），进程间通信（IPC）。故本题选择D。","code":0},{"id":"158","paper":"真考试卷4","no":38,"type":"单项选择题","q":"以下不属于实时操作系统特征的是（  ）。","o":["具有同步IO和中断处理能力","内存锁定","优先级中断和调度","抢占式调度"],"a":"A","e":"IEEE的实时UNIX分委会认为实时操作系统应该具备7个特征：具有异步I/O和中断处理能力；任务切换时间和中断延迟时间确定；优先级中断和调度；抢占式调度；内存锁定；连续文件；同步。故本题选择A。","code":0},{"id":"159","paper":"真考试卷4","no":39,"type":"单项选择题","q":"利用ADS1.2工具软件来开发基于ARM微处理器的嵌入式系统应用程序时，下面的描述不正确的是（  ）。","o":["ADS1.2采用工程项目形式来管理应用程序中涉及的源文件、库文件、头文件等","工程项目中至少应包含一个Debug生成目标","地址映射关系可以使用scatter格式的文件来确定","工程项目中可以按照一定的逻辑关系来分组管理文件"],"a":"B","e":"一个工程项目中至少应包含一个生成目标，ARM提供的可执行输出文件的模板包括了下面3个生成目标：Debug、Release、DebugRel，B选项错误。ADS1.2采用工程项目形式来管理应用程序中涉及的源文件、库文件、头文件等。工程项目中可以按照一定的逻辑关系来分组管理文件。当地址映射关系比较简单时，使用编译、连接选项来确定输入文件的连接顺序。当地址映射关系比较复杂时，使用scatter（分散加载）格式的文件来确定输入文件的连接顺序。故本题选择B。","code":0},{"id":"160","paper":"真考试卷4","no":40,"type":"单项选择题","q":"在基于ARM微处理器为核心的硬件平台上，开发其Linux环境下的应用程序exp1.c。若需要编译后生成exp1.c对应的汇编程序，应使用的命令是（  ）。","o":["arm-linux-gcc -S exp1.c","arm-linux-gcc -oexp1 exp1.c","arm-linux-gcc -c exp1.c","arm-linux-gcc -g -oexp1 exp1.c"],"a":"A","e":"arm-linux-gcc–S–o test.s test.c  该命令中只加入了参数-S、-o test.s，执行该命令后，编译器将连续执行预处理、编译等阶段的操作，最终生成文件名为test.s的汇编语言文件。注意，若去掉-o test.s参数，编译器也会自动生成文件名为test.s的汇编语言文件。     arm-linux-gcc–c–o test.o test.c  该命令中只加入了参数-c、-o test.o，执行该命令后，编译器将连续执行预处理、编译、汇编等阶段的操作，没有执行连接阶段的操作，最终生成文件名为test.o的目标文件。注意，若去掉-o test.o参数，编译器也会自动生成文件名为test.o的目标文件。arm-linux-gcc–o test test.c  该命令中只加入了参数-o test，而没有加入-c、-S、-E等，执行该命令后，编译器将连续执行预处理、编译、汇编、连接等阶段的操作，最终生成文件名为test的输出文件。arm-linux-gcc–g–o test test.c  该命令中加入了参数-g、-o test，执行该命令后，编译器将在生成的输出文件test中加入GDB能够使用的调试信息，使得用GDB调试时比较方便。故本题选择A。","code":0},{"id":"161","paper":"真考试卷5","no":1,"type":"单项选择题","q":"与个人计算机（PC）相比，嵌入式系统具有许多不同的特点。下面不属于嵌入式系统特点的是：（  ）。","o":["嵌入式系统通常包含在其他设备（系统）中，具有隐蔽性","嵌入式系统的软硬件资源往往受到严格的限制，不易扩展","嵌入式系统使用的CPU字长以8位为主","嵌入式系统大多具有不同程度的实时性"],"a":"C","e":"与人们日常使用的个人计算机相比，嵌入式系统具有许多不同的特点。①专用型，嵌入式系统与具体应用紧密结合，具有很强的专用型；②隐蔽性，嵌入式系统通常总是非计算机设备（系统）中的一个部分，它们隐藏在其内部，不为人知；③资源受限，嵌入式系统通常要求小型化、轻量化、低功耗及低成本，因此其软硬件资源受到严格的限制；④高可靠性；⑤实时性；⑥软件固化。现在嵌入式系统中使用最多的是8位和16位的CPU。故本题选择C。","code":0},{"id":"162","paper":"真考试卷5","no":2,"type":"单项选择题","q":"数字信号处理器（DSP）广泛使用于嵌入式系统，下面关于DSP的叙述中错误的是（  ）。","o":["DSP是一种高性能通用微处理器","DSP指令系统具有单指令多数据（SIMD）并行处理的一些特殊指令","DSP能显著提高音频、视频等数字信号的数据处理效率","手机和数码相机等产品通常都含有DSP"],"a":"A","e":"DSP 并非高性能通用处理器，它是一种专用于数字信号处理的微处理器，它对通用处理器的逻辑结构和指令系统进行了优化设计，使之能更好地满足高速数字信号处理的要求；在指令系统中增加单指令多数据（SIMD）并行处理的一些特殊指令的，能够显著提高音频、视频等数字信号的数据处理效率；手机和数码相机等产品通常都含有DSP。因此选项A 错误，故本题选择A。","code":0},{"id":"163","paper":"真考试卷5","no":3,"type":"单项选择题","q":"按照嵌入式系统的技术复杂程度进行分类，可以把嵌入式系统分为低端系统、中端系统和高端系统三大类。下面关于低端嵌入式系统特性的叙述中错误的是（  ）。","o":["其硬件的核心大多是4位/8位单片机","由监控程序对系统进行控制，一般不需要使用操作系统","系统功能很容易现场升级","计算器、遥控器、空调机、微波炉等产品中使用的大多是低端嵌入式系统"],"a":"C","e":"按系统的软硬件技术复杂度，嵌入式系统分为低端系统、中端系统和高端系统。其中低端嵌入式系统，其硬件的核心大多是4位/8位单片机；一般不使用操作系统，由监控程序对系统进行控制；在工控领域和白色家电领域占主导地位，如计算器、遥控器、空调等。C选项错误，故本题选择C。","code":0},{"id":"164","paper":"真考试卷5","no":4,"type":"单项选择题","q":"集成电路制造技术是嵌入式系统发展的重要基础，下面关于集成电路技术发展的叙述中，错误的是（  ）。","o":["单块集成电路的集成度平均每18～24个月翻一番","集成电路的工作频率越来越高，功耗越来越低","当前集成电路批量生产的主流技术已经达到45nm、32nm甚至更小的工艺水平","集成电路批量生产使用的晶圆直径已经达到12～14英寸甚至更大"],"a":"B","e":"著名的摩尔定律表示单块集成电路的集成度平均每18～24个月翻一番；当前，世界上集成电路批量生产的主流技术已经达到12～14英寸晶圆、45nm或32nm的工艺水平，并还在进一步提高。芯片的集成度越高,同时电路的工作频率也越来越高，因此功耗将越来越高，而不是低，这也是集成电路的瓶颈问题。因此选项B错误，故本题选择B。","code":0},{"id":"165","paper":"真考试卷5","no":5,"type":"单项选择题","q":"汉字有多种不同的编码标准，下面关于不同编码标准之间关系的叙述中，错误的是（  ）。","o":["GB2312中的所有字符在GB18030中也都存在，且编码相同","GB18030与UCS/Unicode均包含中日韩统一汉字（CJK）约7万多个","GB18030中的汉字与UCS/Unicode中的汉字编码保持相同","UTF-8和UTF-16是实现UCS/Unicode的两种不同的编码方案"],"a":"C","e":"GB18030字符集与国际标准UCS/Unicode字符集基本兼容。GB18030采用双字节编码表示汉字，而UCS/Unicode在表示汉字时有两种不同的编码方案，UTF-8采用的是单字节可变长编码，UTF-16则采用双字节编码。C选项错误，其余三项正确，故本题选择C。","code":0},{"id":"166","paper":"真考试卷5","no":6,"type":"单项选择题","q":"假设数码相机使用的存储卡容量是1GB，数据压缩比平均是4，那么它一次可连续拍摄65536色的1024 x 1024分辨率的彩色相片大约多少张？","o":["200","500","1000","2000"],"a":"D","e":"已知65536色对应的像素深度为16位，图像数据量=图像水平分辨率×图像垂直分辨率×像素深度/8=1024×1024×16/8≈2MB，故根据题设给出的数据可知一张相片的大小为2/4=0.5 MB，存储卡容量是1GB，存储相片大约为2000（1GB/0.5MB）张，故本题选择D。","code":0},{"id":"167","paper":"真考试卷5","no":7,"type":"单项选择题","q":"数字视频的数据量大得惊人，无论是存储、传输还是处理都有一定困难，所以必须进行数据压缩。目前我国数字有线电视和卫星电视传输时采用的压缩编码标准是（  ）。","o":["MPEG-1","MPEG-2","MPEG-3","MPEG-4"],"a":"B","e":"根据MPEG组织定义的标准可知，MPEG-2主要用于数字有线电视和卫星电视以及高清晰度电视领域。目前我国数字有线电视和卫星电视传输时采用的压缩标准也是MPEG-2，故本题选择B。","code":0},{"id":"168","paper":"真考试卷5","no":8,"type":"单项选择题","q":"路由器是互联网中重要的网络设备，它的主要功能是（  ）。","o":["将有线通信网络与无线网络进行互连","将多个异构或同构的物理网络进行互连","放大传输信号，实现远距离数据传输","用于传输层及以上各层的协议转换"],"a":"B","e":"路由器是一台高性能的嵌入式计算机系统，是遵循IP协议把异构网络互相连接起来的关键设备，工作在网络层，主要有以下几种功能：第一，网络互连，实现不同网络互相通信；第二，数据处理，提供包括分组过滤、分组转发、优先级、复用、加密、压缩和防火墙等功能；第三，网络管理，路由器提供包括配置管理、性能管理、容错管理和流量控制等功能。选项B正确，选项A错误。信号的放大使用集线器来完成的，因此选项C错误。用于传输层及以上各层的协议转换的设备称为协议转换器，因此选项D错误。故本题选择B。","code":0},{"id":"169","paper":"真考试卷5","no":9,"type":"单项选择题","q":"以下关于嵌入式处理器说法正确的是（  ）。","o":["按照字长可分为8位、16位、32位和64位嵌入式处理器","按照存储结构可分为RISC和CISC结构","按照内核可分为哈佛结构和冯.诺依曼结构","所有ARM处理器均是RISC结构且为哈佛结构"],"a":"A","e":"根据微处理器的字长宽度：微处理器可分为4位、8位、16位、32位、64位。因此可知选项A正确。根据指令集可分为RISC和CISC,因此选项B错误。根据系统体系结构分为：哈佛结构和冯·诺依曼结构，选项C错误。不是所有ARM处理器都采用哈佛结构，早期大多使用的是冯·诺依曼结构。所以选项D错误。故本题选择A。","code":0},{"id":"170","paper":"真考试卷5","no":10,"type":"单项选择题","q":"关于ARM嵌入式处理器的工作状态，以下说法正确的是（  ）。","o":["ARM状态是32位指令的状态，指令代码为16位和32位","Thumb状态为16位指令状态，指令长度可为16位，也可以为32位","Thumb-2状态兼容16位指令和32位指令编码","ARM状态和Thumb状态不可切换"],"a":"C","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态，①ARM状态②Thumb/Thumb-2状态③调试状态。ARM状态是ARM处理器工作于32位指令的状态，即32位状态，所有指令均为32位宽度。Thumb状态是ARM执行16位指令的状态，即16位状态。在Thumb模式下，指令代码只有16位。Thumb-2状态是ARMv7版本的ARM处理器所具有的新状态，新的Thumb-2内核技术兼有16位及32位指令长度；通过BX指令，ARM状态和Thumb状态是可以相互切换的。只有C选项正确，故本题选择C。","code":0},{"id":"171","paper":"真考试卷5","no":11,"type":"单项选择题","q":"以下关于ARM处理器的寄存器说法错误的是（  ）。","o":["通用寄存器R0-R7可以用于存放数据，也可以存放地址","R0-R15寄存器的宽度为32位","程序计数器PC使用R15寄存器","堆栈指针SP使用的寄存器R14"],"a":"D","e":"ARM处理器中的R13被用作堆栈指针SP。当不使用堆栈时，R13 也可以用做通用数据寄存器，R14（link register）存储子程序的返回地址。因此选项D错误，其余三项正确，故本题选择D。","code":0},{"id":"172","paper":"真考试卷5","no":12,"type":"单项选择题","q":"以下关于ARM处理器说法正确的是（  ）。","o":["半字数据0x1234在小端格式下从0x10000000开始存放，其中0x34存放在0x10000001中","ARM处理器支持8位、16位和32位数据类型","MMU为存储器保护单元，是对存储器进行保护的可选组件","虚拟地址到物理地址映射是MPU的主要功能"],"a":"B","e":"0x1234在小端模式CPU内存中的存放方式为：\n\n内存地址   存放内容\n\n   0x10000000       0x34\n\n   0x10000001       0x12\n\n   而在大端模式CPU内存中的存放方式则为：\n\n   内存地址  存放内容\n\n   0x10000000  0x12\n\n   0x10000001  0x34\n\n因此选项A错误。MMU是存储器管理单元的缩写，是用来管理虚拟内存系统的器件，通常是CPU的一部分；存储器保护单元是MPU；选项C错误。虚拟地址到物理地址的映射是MMU的主要功能；选项D错误。ARM处理器支持8位、16位和32位数据类型，B选项正确，故本题选择B。","code":0},{"id":"173","paper":"真考试卷5","no":13,"type":"单项选择题","q":"关于ARM指令中的条件域，以下表述正确的是（  ）。","o":["HI为无符号数小于","CS为无符号数小于","GT为带符号数小于","LT为带符号数小于"],"a":"D","e":"根据指令条件码：HI为无符号数大于，选项A错误；CS为无符号数大于等于，选项B错误；GT为带符号数大于, 选项C错误；LT为带符号数小于，选项D正确，故本题选择D。","code":0},{"id":"174","paper":"真考试卷5","no":14,"type":"单项选择题","q":"ARM指令完成的功能是当条件为“带符号数小于”时，将R2和R3进行逻辑或操作，结果存放在R1中，正确的指令是（  ）。","o":["ORRMI R1,R2,R3","ORREQ R1,R2,R3","ORRLT R1,R2,R3","ORRNE R1,R2,R3"],"a":"C","e":"根据指令条件码，带符号数小于使用LT，逻辑或运算使用ORR可知使用ORRLT ，再由R2与R3运算得到的结果保存在R1中，可知ORRLT R1 R2 R3，故本题选择C。","code":0},{"id":"175","paper":"真考试卷5","no":15,"type":"单项选择题","q":"以下ARM指令中源操作数属于寄存器寻址的指令是（  ）。","o":["AND R1,R2,R3","STRH R1,[R2]","SWI     0x01","MOV R1,#0x0B"],"a":"A","e":"寄存器寻址就是利用寄存器中的数值作为操作数，显然，A选项是寄存器寻址；B选项是寄存器间接寻址；C选项SWI是软中断指令；D选项是立即数寻址。故本题选择A。","code":0},{"id":"176","paper":"真考试卷5","no":16,"type":"单项选择题","q":"以下对伪指令的解释错误的是（  ）。","o":["DCB 0x56；在内存区域分配一个字节的内存空间并初始化为0x56","CODE32；伪指令通知编译器，其后的指令序列为32位的Thumb指令","MyTest     EQU    15000；    为定义一个常量MyTest值为15000，最大数为32位","EXPORT伪指令用于在程序中声明一个全局的标号，该标号可在其它的文件中引用"],"a":"B","e":"DCB为ARM汇编器所支持的数据定义伪指令，用于分配一个字节存储单元并用指定的数据初始化，A选项正确；CODE32伪指令通知编译器，其后的指令序列为32位的ARM指令，故B选项错误；EQU是等于伪指令，用于为程序中的常量、标号等定义一个等效的字符名称，最大数为32位，C选项正确；EXPORT伪指令用于在程序中声明一个全局的标号，该标号可在其他的文件中引用，可用GLOBAL代替，D选项正确，故本题选择B。","code":0},{"id":"177","paper":"真考试卷5","no":17,"type":"单项选择题","q":"以下指令中不属于逻辑移位的指令是（  ）。","o":["LSL R0,R1","LSR R2,R3,3","ASR R4,R5","LSR R6,R7"],"a":"C","e":"LSL是逻辑左移，LSR是逻辑右移，而ASR是算术右移，故本题选择C。","code":0},{"id":"178","paper":"真考试卷5","no":18,"type":"单项选择题","q":"在ARM汇编语言程序设计中，经常用到子程序设计及调用，与子程序设计与调用无关的指令或伪指令是（  ）。","o":["BL  SerchMin","IMPORT SerchMin","MOV PC,LR","B  SerchMin"],"a":"D","e":"在ARM汇编语言程序中，子程序的调用一般是通过BL指令来实现。IMPORT伪指令用于通知编译器要使用的标号在其他的源文件中定义但要在当前源文件中引用；MOV PC,LR在ARM汇编中用于子程序的返回。所以本题选择D。","code":0},{"id":"179","paper":"真考试卷5","no":19,"type":"单项选择题","q":"下面关于JTAG的叙述中，错误的是（  ）。","o":["JTAG技术为ARM公司专用，非ARM处理器不采用JTAG技术","通过JTAG测试接口可对嵌入式处理器芯片进行测试、对系统进行仿真、调试","多个器件可以通过JTAG接口串联在一起进行测试","通过芯片的JTAG接口可以实现在线编程功能"],"a":"A","e":"JTAG是对芯片或印制电路板进行片上调试最常用的一种技术；人们通常用JTAG来表示满足IEEE 1149规范的边界扫描测试方法和TAP接口（也成为JTAG接口）。目前大多数嵌入式CPU、DSP、FPGA器件都支持JTAG标准。因此A选项错误，JTAG标准允许多个芯片（电路）的边界扫描寄存器BSR通过JTAG接口串联在一起，实现对多个器件的测试。通过芯片的JTAG接口可以实现在线编程功能。其余三项都是正确的。故本题选择A。","code":0},{"id":"180","paper":"真考试卷5","no":20,"type":"单项选择题","q":"下面与AMBA（Advanced Microcontroller Bus Architecture）有关的叙述中，错误的是（  ）。","o":["AMBA规定了ARM处理器内核与处理芯片中快速组件的接口标准（通常称为系统总线）","AMBA规定了ARM处理器内核与处理芯片中外围端口及慢速设备接口组件的接口标准（通常称为外围总线）","基于ARM内核的嵌入式芯片以ARM内核为基础，通过AMBA总线技术将其他硬件组件连接在一起，组成片上系统的形式","由于AMBA是一种标准，因此自制定之后就不会更改"],"a":"D","e":"AMBA 是ARM公司公布的总线协议，用于连接和管理片上系统 (SoC) 中功能模块的开放标准和片上互连规范。按照AMBA总线规范，以ARM内核为基础的嵌入式处理器芯片采用系统总线与外围总线两层结构的方式构建片上系统。标准规定了ARM处理器内核与处理器内部高带宽RAM、DMA以及高带宽外部存储器等快速组件的接口标准，也规定了内核与ARM处理器内部外围端口及慢速设备接口组件的接口标准。AMBA有多个版本，性能随版本的发展而逐步提高。因此D选项错误，故本题选择D。","code":0},{"id":"181","paper":"真考试卷5","no":21,"type":"单项选择题","q":"下面是关于嵌入式系统使用的存储器的叙述，其中正确的是：（  ）。","o":["静态存储器SRAM是非易失性存储器","动态存储器DRAM是非易失性存储器","Flash存储器是非易失性存储器","EEPROM是易失性存储器"],"a":"C","e":"SRAM和DRAM都是易失性存储器，即掉电后信息丢失；非易失性存储器，如EPROM、EEPROM和Flash ROM，能在断电后仍保存数据。因此选项C正确，故本题选择C。","code":0},{"id":"182","paper":"真考试卷5","no":22,"type":"单项选择题","q":"下面关于UART的叙述中，正确的是（  ）。","o":["UART不能实现全双工通信","UART即为通用异步收发器","UART通信波特率固定为115200bps，不能调节","UART发送字符的长度固定为8位"],"a":"B","e":"UART即为通用异步收发器，是一种通用串行数据总线，用于异步通信。该总线双向通信，可以实现全双工传输和接收，因此A选项错误，B选项正确。UART总线的波特率可以调整的，因此选项C错误。UART发送的字符数据位可以是5位、6位、7位、8位，由编程决定，因此选项D错误。故本题选择B。","code":0},{"id":"183","paper":"真考试卷5","no":23,"type":"单项选择题","q":"下面关于HDMI的叙述中，错误的是（  ）。","o":["HDMI即高清晰度多媒体接口","HDMI是一种数字化音频/视频接口，适合影像传输","HDMI最高数据传输速度为10.2Gbps","HDMI在嵌入式视频监控系统中应用广泛，但各型ARM芯片内部均不配置HDMI控制器接口"],"a":"D","e":"高清晰度多媒体接口（英文：High Definition Multimedia Interface，HDMI）是一种数字化视频/音频接口技术，是适合影像传输的专用型数字化接口，其可同时传送音频和影像信号，最高数据传输速度为10.2Gb/s；目前已有多个ARM芯片内置了HDMI控制器接口。因此D项错误。故本题选择D。","code":0},{"id":"184","paper":"真考试卷5","no":24,"type":"单项选择题","q":"为用ARM芯片的一根GPIO引脚驱动一个LED（发光二极管），设计了如下图(a)~(d)共4个具体的电路。图中，设计得最合理的电路是（  ）。","o":["(a)图所示的电路","(b)图所示的电路","(c)图所示的电路","(d)图所示的电路"],"a":"A","e":"由于通常ARM的GPIO引脚提供的电流是有限的，不能直接驱动发光设备，因此连接LED时要加驱动电路，据此可排除直接连接的（b）和（d）；（c）也是错误的，此处的电阻反而对LED进行了限流。只有（a）图的电路合理，故本题选择A。","code":0},{"id":"185","paper":"真考试卷5","no":25,"type":"单项选择题","q":"下面关于三星公司基于ARM9内核的S3C2410嵌入式微处理器芯片的叙述中，错误的是（  ）。","o":["采用哈佛体系结构，程序存储器与数据存储器分开","使用AMBA总线，对于高速组件采用AHB总线，对于低速外设接口采用APB总线","片内集成ADC","片内集成摄像头接口及AC'97音频接口"],"a":"D","e":"S3C2410是三星公司基于ARM920T核的两款嵌入式微处理器，属于中高档32位嵌入式微处理器；采用哈佛体系结构，内部具有分离的16KB大小的指令Cache和16KB大小的数据Cache；使用ARM公司特有的AMBA总线，对于高速组件采用AHB总线，而对于低速外设接口则采用APB总线，AHB通过桥接器链接APB；芯片内部集成了许多硬件组件，包括了内部SRAM、外部存储器控制器、ADC等等；而摄像头接口和AC′97音频接口出现在S3C2440上，S3C2410上并没有。因此D选项错误，故本题选择D。","code":0},{"id":"186","paper":"真考试卷5","no":26,"type":"单项选择题","q":"下面是关于S3C2410中断控制器的相关寄存器的功能描述，其中错误的是（  ）。","o":["当多个中断源请求服务时，通过优先级仲裁，源中断挂起寄存器中只有当前最高优先权的中断源对应的位置1","中断模式寄存器的功能是决定中断源的中断属于普通中断IRQ还是快速中断","中断屏蔽寄存器的功能是屏蔽中断源的中断请求","子源中断挂起寄存器的功能是记录子中断源中断请求的挂起状态"],"a":"A","e":"S3C2410有两个中断挂起寄存器：源中断挂起寄存器SRCPND和中断挂起寄存器INTPND；当多个中断源请求服务时，SRCPND相应的位被写1，通过优先级仲裁当前最高优先权的中断源对应的INTPND位写入1；因此A选项错误。B选项、C选项、D选项正确，故本题选择A。","code":0},{"id":"187","paper":"真考试卷5","no":27,"type":"单项选择题","q":"下面关于S3C2410嵌入式微处理器芯片GPIO端口的叙述中，错误的是（  ）。","o":["GPIO端口有GPA/GPB/GPC/GPD/GPE/GPF/GPG/GPH多个并行I/O接口","GPIO端口中有的I/O接口的功能是复用的，例如可以作为外部中断","GPIO端口中的每个并行I/O接口中的上拉寄存器决定该接口引脚是否要被内部上拉","GPIO端口属于芯片内部的高带宽组件"],"a":"D","e":"S3C2410的GPIO端口有GPA/GPB/GPC/GPD/GPE/GPF/GPG/GPH多个并行I/O接口；有的I/O接口功能单一，多数I/O接口的功能是复用的，例如GPF和GPG可以作为外部中断；每个端口都有上拉寄存器决定该接口引脚是否要被内部上拉；因此A、B、C正确，故本题选择D。","code":0},{"id":"188","paper":"真考试卷5","no":28,"type":"单项选择题","q":"下面关于CAN总线的叙述中，正确的是（  ）。","o":["CAN能够实现多主通信方式","CAN通信时采用奇偶校验方式","各型ARM芯片均没有内嵌CAN控制器，只能通过外扩CAN控制器的方式才能形成CAN节点接入CAN总线","CAN采用长帧通信，一个数据帧最多可以传送128个字节"],"a":"A","e":"CAN总线是针对实时性要求很强的工业控制领域推出的适应多主系统的有线通信接口，能够实现多主通信；CAN总线的数据帧由7个不同的域组成，其中域的长度可选为0~8 位；CAN协议采用CRC检验并可提供相应的错误处理功能，保证了数据通信的可靠性；一般面向控制应用领域的ARM芯片内部已经嵌入了CAN总线控制器，外部仅需要连接CAN的收发器即可构建完整的CAN网络。因此仅有A项正确，故本题选择A。","code":0},{"id":"189","paper":"真考试卷5","no":29,"type":"单项选择题","q":"RTOS的主要实时指标不包括（  ）。","o":["截至时间（Finish Time）","吞吐量（Throughput）","生存时间（Survival Time）","响应时间（Response Time）"],"a":"A","e":"实时操作系统（RTOS）是一种专门服务于实时系统应用请求的操作系统。它的实时性能指标主要根据三个指标来衡量：响应时间、吞吐量和生存时间。故本题选择A。","code":0},{"id":"190","paper":"真考试卷5","no":30,"type":"单项选择题","q":"与通用计算机的操作系统相比较，下列各项中不属于嵌入式操作系统特点的是（  ）。","o":["实时性","抢占式多任务处理","内核复杂","高可靠性"],"a":"C","e":"与通用计算机的操作系统相比较，嵌入式操作系统具有可移植性、强调实时性能、内核精简、抢占式多任务处理、使用可重入函数、可配置、可裁剪、高可靠性等特点。故本题选择C。","code":0},{"id":"191","paper":"真考试卷5","no":31,"type":"单项选择题","q":"以下对于主流嵌入式操作系统的叙述，错误的是（  ）。","o":["iOS的系统结构分为以下四个层次：核心操作系统，核心服务层，媒体层，触摸框架层（the Cocoa Touch layer）","WinCE源代码数量庞大，API函数丰富","微软公司的Windows Phone 8操作系统与Windows Phone 7没有升级换代更新的关系","Android是国内外目前最流行的手持设备操作系统之一"],"a":"C","e":"iOS的系统结构分为以下4个层次：核心操作系统，核心服务层，媒体层，触摸框架层（the Cocoa Touch Layer），因此A选项正确；WinCE的主要优点是源代码数量庞大，API函数丰富，B选项正确；Windows Phone 8针对Windows Phone7的不足之处进行了大量技术升级，因此C选项错误；Android是国际上目前最流行的手持设备开发平台之一，所以D选项也是正确的。故本题选择C","code":0},{"id":"192","paper":"真考试卷5","no":32,"type":"单项选择题","q":"下面的各嵌入式操作系统中，只有一个与Linux密切相关，它是（  ）。","o":["QNX","VxWorks","RTAI","TinyOS"],"a":"C","e":"四个选项中仅有C选项的RTAI是典型的嵌入式Linux操作系统
