":"单项选择题","q":"关于嵌入式处理器内核说法错误的是（  ）。","o":["PowerPC采用RISC指令集结构","MC68K采用是CISC指令集结构","ARM采用RISC指令集结构","MIPS采用哈佛结构"],"a":"B","e":"嵌入式处理器的体系结构按指令集可分为两大类：复杂指令集结构（CISC）及精简指令集结构（RISC）；按存储机制分为冯·诺依曼结构及哈佛结构；按不同内核系列可分为51、AVR、MSP430、MIPS、PowerPC、MC68K、ARM等。其中，PowerPC、MC68K、MIPS采用RISC、哈佛结构，ARM也采用RISC，多数为哈佛结构。故本题选择B。","code":0},{"id":"450","paper":"真考试卷11","no":10,"type":"单项选择题","q":"关于ARM Cortex-M微控制器以下说法错误的是（  ）。","o":["处理速度快","代码密度高","软件可移植性好","功耗大"],"a":"D","e":"Cortex-M系列是面向微控制器的处理器核，极高性价比、最低成本、极低功耗；具有处理速度快、代码密度高、软件可移植性好的特点。故本题选择D。","code":0},{"id":"451","paper":"真考试卷11","no":11,"type":"单项选择题","q":"以下ARM Cortex处理器最适合实时应用的是 （  ）。","o":["Cortex-M3","Cortex-M0+","Cortex-A15","Cortex-R4"],"a":"D","e":"Cortex处理器包括基于Cortex-R、Cortex-M和Cortex-A内核的系列处理器。目前高端嵌入式应用可使用Cortex-A系列的应用处理器；低端面向控制领域可使用Cortex-M系列微控制器；而Cortex-R系列是面向实时控制的处理器。故本题选择D。","code":0},{"id":"452","paper":"真考试卷11","no":12,"type":"单项选择题","q":"以下只具有Thumb-2状态和调试状态的ARM处理器是（  ）。","o":["ARM7","ARM9","ARM Cortex-M3","ARM11"],"a":"C","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态：①ARM状态；②Thumb状态及Thumb-2状态；③调试状态。其中，除支持Thumb-2的ARM处理器外，其他所有ARM处理器都可以工作在ARM状态，而Cortex-M3只有Thumb-2状态和调试状态。故本题选择C。","code":0},{"id":"453","paper":"真考试卷11","no":13,"type":"单项选择题","q":"关于ARM处理器的工作模式，以下说法正确的是（  ）。","o":["快速中断模式用来处理FIQ中断","用户模式用来处理普通中断","中止模式运行特权级的操作系统任务","系统模式运行正常的程序"],"a":"A","e":"ARM体系结构支持7种工作模式，取决于当前程序状态寄存器CPSR的低5位值。用户模式是程序正常执行工作模式；快速中断模式（FIQ）用来处理高速中断；中止模式处理存储器故障；系统模式运行特权级的操作系统任务。故本题选择A。","code":0},{"id":"454","paper":"真考试卷11","no":14,"type":"单项选择题","q":"以下关于ARM程序状态寄存器CPSR的说法正确的是（  ）。","o":["CPSR中N=1表示运算结果为正数","CPSR中F=0允许快速中断","CSPR中V=0表示运算结果溢出","CPSR中Z=0表示运算结果为0"],"a":"B","e":"CPSR为当前程序状态寄存器。N为符号标志，N=1表示运算结果为负数，N=0表示运算结果为正数；F为禁止快速中断FIQ的控制位，F=0允许FIQ中断；V为溢出标志，加减法运算结果有溢出时V=1，否则V=0；Z为全0标志，运算结果为0，则Z=1，否则Z=0。故本题选择B。","code":0},{"id":"455","paper":"真考试卷11","no":15,"type":"单项选择题","q":"执行ARM指令STR R0,［R1,#4］!之后，以下说法正确的是（  ）。","o":["R0的值加4","R1的值加4","内存中的数据保持不变","R1的值保持不变"],"a":"B","e":"STR是寄存器到存储器的数据传送指令，题中指令为基址加变址寻址，本指令将寄存器R0的32位操作数存储到R1+4指示地址开始的存储区域中，符号“！”表示指令在完成数据传送后应该更新基址寄存器。故本题选择B。","code":0},{"id":"456","paper":"真考试卷11","no":16,"type":"单项选择题","q":"执行ARM指令MOV R0,R1,LSL#3后，R0的值为（  ）。","o":["R1的3倍","R1+3","R1的8倍","R1的8分之1"],"a":"C","e":"题中为数据传送指令，将寄存器R1的值左移3位后传送到R0，左移一位相当于乘以2，故R0的值即R1的8倍。故本题选择C。","code":0},{"id":"457","paper":"真考试卷11","no":17,"type":"单项选择题","q":"以下ARM指令正确的是（  ）。","o":["ADD R1,[R2,#1]","AND [R0],R1","SUBS R7,R7,#1","BEQ PC,LR"],"a":"C","e":"ADD为加法指令，AND是逻辑与指令，SUBS是带借位的减法指令，BEQ是跳转指令，结合ARM指令的寻址方式，只有C项指令是正确的，采用的是立即寻址。故本题选择C。","code":0},{"id":"458","paper":"真考试卷11","no":18,"type":"单项选择题","q":"在小端模式下,通过ARM伪指令MyData DCW 0x1122,0x3344，0x5566,0x7788在内存中定义了4个16位操作数，则在伪指令LDR R1,=MyData后执行指令LDR R0,［R1,#4］，则R0的值为（  ）。","o":["0x77885566","0x11223344","0x44556677","0x88776655"],"a":"A","e":"所谓小端模式，是指数据的高位保存在内存的高地址中，而数据的低位保存在内存的低地址中；指令LDR R0,［R1,#4］是将寄存器R1的内容自动增加4，形成操作数的有效地址，从中取得32位操作数存入寄存器R0中。故本题选择A。","code":0},{"id":"459","paper":"真考试卷11","no":19,"type":"单项选择题","q":"下面是关于基于ARM内核的典型嵌入式系统硬件组成的叙述：\nⅠ. 典型嵌入式硬件系统包括完成模拟量和数字量输入功能的前向通道\nⅡ. 典型嵌入式硬件系统包括完成模拟量和数字量输出功能的后向通道\nⅢ. 典型嵌入式硬件系统包括人机交互通道（例如键盘或触摸屏等输入接口及LED或LCD显示等输出接口）\nⅣ. 典型嵌入式硬件系统包括相互互连通信通道（例如以太网接口、USB接口等）\n上述叙述中，正确的是：","o":["仅Ⅰ、Ⅱ和Ⅲ","仅Ⅱ、Ⅲ和Ⅳ","仅Ⅰ、Ⅲ和Ⅳ","全部"],"a":"D","e":"基于ARM内核的典型嵌入式系统硬件由嵌入式最小硬件系统、前向通道、后向通道、人机交互通道以及相互互联通信通道等组成；前向通道即输入接口，由模拟量输入接口和数字量输入接口组成；后向通道即输出接口，由模拟输出接口和数字输出接口组成。故本题选择D。","code":1},{"id":"460","paper":"真考试卷11","no":20,"type":"单项选择题","q":"基于ARM内核的嵌入式芯片是以ARM内核为基础，通过AMBA总线将其他硬件组件连接在一起的。下面列出的4个组件中，哪一个组件是挂在AMBA的外围总线（APB）上的？","o":["LCD控制器","Timer（定时器）","中断控制器","JTAG"],"a":"B","e":"基于AMBA总线的处理器使用系统总线和外围总线构成来连接高速系统组件和低速外围组件，速度不高的外部接口连接外围总线（APB），包括定时器、并行接口和串行接口等；而LCD控制器和中断控制器等都连接在系统总线上。故本题选择B。","code":0},{"id":"461","paper":"真考试卷11","no":21,"type":"单项选择题","q":"下面是关于ARM嵌入式芯片中的DMA控制器的叙述，其中错误的是（  ）。","o":["DMA控制器即为直接存储器访问控制器","使用DMA控制器可将数据块在外设与内存之间直接传输而不需CPU的参与，因而可显著降低处理器的负荷","ARM嵌入式芯片中的DMA控制器挂在AMBA的外围总线（APB）上","DMA控制器工作时所需的时钟由ARM嵌入式芯片中的电源管理与时钟控制器组件提供"],"a":"C","e":"ARM内部的DMA控制器（直接存储器访问控制器）是一种硬件组件，使用它可以将数据块在内存与外设以及内存与内存之间互相传送，且传输过程不需要CPU参与，可显著降低处理器负荷；DMA主控制器与AMB的系统总线部分相连；其工作时所需的时钟由ARM嵌入式芯片中的电源管理与时钟控制器组件提供。故本题选择C。","code":0},{"id":"462","paper":"真考试卷11","no":22,"type":"单项选择题","q":"下面关于嵌入式系统使用的存储器的叙述中，错误的是（  ）。","o":["SRAM是静态随机存取存储器","DDR2 SDRAM、DDR3 SDRAM和DDR4 SDRAM这3种SDRAM中，只有DDR2采用双倍数据速率技术","EEPROM是一种可电擦除可编程的只读存储器，可以在线改写和擦除信息","铁电随机存取存储器（FRAM）是一种非易失性存储器"],"a":"B","e":"SRAM是静态随机存取存储器，是易失性存储器；铁电随机存取存储器（FRAM）是一种非易失性存储器；EEPROM是一种可电擦除可编程的只读存储器，可以在线改写和擦除信息，无需紫外线照射；DDR2 SDRAM（双倍数据速率同步DRAM）、DDR3 SDRAM和DDR4 SDRAM均采用双倍速率数据技术。故本题选择B。","code":0},{"id":"463","paper":"真考试卷11","no":23,"type":"单项选择题","q":"用下图可以辅助解释SPI的工作原理。假设主机的移位寄存器A中已存入11001010，从机的移位寄存器B中已存入11110000，则在主机发出8个SCK有效信号后，主机移位寄存器A和从机移位寄存器B中的内容分别是（  ）。","o":["11001010，11110000","01010011，00001111","11110000，11001010","00001111，01010011"],"a":"C","e":"串行外设（SPI）接口是一种同步串行外设接口，允许嵌入式处理器与各种外围设备以串行方式进行通信、数据交换。一般使用4跳线：SCK、MISO、MOSI和SSEL。将数据写到SPI发送缓冲区后，一个时钟信号SCK对应一位数据的发送（MISO）和另一位数据的接收（MOSI）；在主机中数据从移位寄存器中自左向右发出送到从机（MOSI），同时从机中的数据自右向左发到主机（MISO），经过8个时钟周期完成1字节的发送。故本题选择C。","code":0},{"id":"464","paper":"真考试卷11","no":24,"type":"单项选择题","q":"下图为基于ARM嵌入式芯片的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，错误的是（  ）。","o":["图中所示的键盘接口采用了非编码键盘（线性键盘）的结构形式","当仅KEY4按下时，ARM嵌入式芯片读到的GPF6～GPF1的值为001000","对于有些ARM嵌入式芯片，图中的GPF6～GPF1可作为外部中断引脚EINT6～EINT1，此时可通过中断方式读取按键结果","图中键盘接口用到的GPF口是ARM嵌入式芯片的GPIO端口中的一个端口"],"a":"B","e":"图中所示为典型的非编码键盘，即线性按键接口，利用GPIO引脚连接按键，当没有键被按下时，相应的引脚为高电平，即逻辑1，当相应的键被按下时，对应的引脚则呈现低电平，即逻辑0；因此，当仅按下KEY4时，读出的值应该是110111；对于如S3C2410和S3C2440的GPF6～GPF1正好是EINT 1~EINT6这6个外部中断引脚。故本题选择B。","code":0},{"id":"465","paper":"真考试卷11","no":25,"type":"单项选择题","q":"下面关于嵌入式系统中常用的触摸屏的叙述中，错误的是（  ）。","o":["电容式触摸屏的结构比电阻式触摸屏复杂，其价格也比电阻式触摸屏高","利用电阻式触摸屏输入信息时一般需采用专用的硬笔","当在电容式触摸屏上触摸时，人的手指与触摸屏的导体层之间形成一个耦合电容","相对而言，电阻式触摸屏的应用越来越广泛"],"a":"D","e":"电阻式触摸屏和电容式触摸屏是嵌入式系统中常用的两种触摸屏，电容式触摸屏的结构比电阻式触摸屏复杂，其价格也比电阻式触摸屏高；当在电容式触摸屏上触摸时，人的手指与触摸屏的导体层之间形成一个耦合电容；而利用电阻式触摸屏输入信息时一般需采用专用的硬笔；电容式触摸屏的应用越来越广泛。故本题选择D。","code":0},{"id":"466","paper":"真考试卷11","no":26,"type":"单项选择题","q":"下面关于S3C2410的外部存储器的叙述中，错误的是（  ）。","o":["S3C2410的存储器控制组件中包括的存储器控制器提供访问片外存储器芯片所需的控制信号","S3C2410的外部存储器地址空间共1GB","S3C2410的I/O与存储器采用统一编址方式","S3C2410的外部存储器地址空间可分成数个BANK，每个BANK均可实现8位、16位和32位总线宽度的访问"],"a":"D","e":"S3C2410的存储器控制组件中包括存储器控制器、外部主控器、NAND Flash控制器等，其中存储器控制器提供访问片外存储器芯片所需的控制信号，支持大/小端模式，地址空间共1GB；其I/O与存储器采用统一编址方式，而非I/O映射编址（独立编址）方式；S3C2410的外部存储器地址空间可分成8个BANK，BANK0只能是16位和32位总线宽度的访问，其他所有BANK均可实现8位、16位和32位总线宽度的访问。故本题选择D。","code":0},{"id":"467","paper":"真考试卷11","no":27,"type":"单项选择题","q":"下面关于S3C2410的UART的叙述中，错误的是（  ）。","o":["通过对UART 线路控制寄存器的设置，可决定该UART通信时是否采用奇偶校验","UART的特殊功能寄存器中，除UART线路控制寄存器外，还有UART控制寄存器等","通过UART发送/接收状态寄存器可了解UART的发送移位寄存器和发送缓冲器等的状态","UART的波特率发生器只能对PCLK时钟进行分频获得通信所需的波特率"],"a":"D","e":"UART，即串行异步通信接口，使用UART进行通信时要求通信双方波特率和传输格式必须一致。UART的特殊功能寄存器包括UART线路控制寄存器、UART控制寄存器、UART发送/接收状态寄存器、UART波特率除数寄存器；通过对UART 线路控制寄存器的设置，可决定该UART通信时是否采用奇偶校验；通过UART发送/接收状态寄存器可了解UART的发送移位寄存器和发送缓冲器等的状态；UART的波特率由除数寄存器决定，也取决于外部时钟，可以是PCLK，还可以是UEXTCLK，由相应控制寄存器决定。故本题选择D。","code":0},{"id":"468","paper":"真考试卷11","no":28,"type":"单项选择题","q":"下述通信标准中，不采用差分方式进行信号传输的是（  ）。","o":["USB","RS-232","RS-485","CAN"],"a":"B","e":"采用差分信号传输方式，具有很强的抗共模干扰能力；选项中仅RS-232不是。故本题选择B。","code":0},{"id":"469","paper":"真考试卷11","no":29,"type":"单项选择题","q":"现为某车载地图设备选择操作系统，友好的用户界面是最主要的功能需求之一。以下嵌入式操作系统中，最适宜采用的操作系统是（  ）。","o":["eCOS","Android","QNX","μC/OS-II"],"a":"B","e":"四个选项均是主流的嵌入式操作系统。其中Android是一种以Linux为基础的半开放源代码操作系统，主要用于移动便携设备，属于大型操作系统，是国际上目前最流行的手持设备开发平台之一。故本题选择B。","code":0},{"id":"470","paper":"真考试卷11","no":30,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的描述中，错误的是（  ）。","o":["μC/OS-II支持抢占式任务调度","发生中断时，正在运行的μC/OS-II任务暂停运行，并进入被中断状态","μC/OS-II的所有就绪态任务均登记在事件控制块中","μC/OS-II允许每个任务拥有自己的自用栈"],"a":"C","e":"μC/OS-II的大部分代码是用标准C语言写的，其每个任务都处在以下5种状态之一的状态，即休眠态、就绪态、运行态、挂起态和被中断态。支持抢占式任务调度，处于运行态的任务一定是当前就绪任务集里的最高优先级任务；当多个任务同时等待同一事件发生时，只有优先级最高的任务得到该事件并进入就绪状态准备执行；允许每个任务拥有自己的自用栈；发生中断时，正在运行的μC/OS-II任务暂停运行，并进入被中断状态。故本题选择C。","code":0},{"id":"471","paper":"真考试卷11","no":31,"type":"单项选择题","q":"下列关于μC/OS-II操作系统空闲任务的描述中，错误的是（  ）。","o":["空闲任务自创建之后永远不会处于挂起态","空闲任务是操作系统初始化函数创建的第一个任务","空闲任务的优先级设为最低优先级","空闲任务永远不会处于运行态"],"a":"D","e":"空闲任务OS_TaskIdle是μC/OS-II的系统任务，是操作系统初始化函数创建的第一个任务，自创建之后永远不会处于挂起态，因为它占据了最低优先级63，所以只有在其他的任务都因为等待事件的发生而被阻塞的时候才能得到运行。故本题选择D。","code":0},{"id":"472","paper":"真考试卷11","no":32,"type":"单项选择题","q":"按照实时性能和内核结构划分，QNX操作系统属于（  ）。","o":["硬实时微内核嵌入式操作系统","软实时微内核嵌入式操作系统","硬实时单内核嵌入式操作系统","硬实时宏内核嵌入式操作系统"],"a":"A","e":"按照实时性能和内核结构划分，QNX操作系统属于硬实时微内核嵌入式操作系统。故本题选择A。","code":0},{"id":"473","paper":"真考试卷11","no":33,"type":"单项选择题","q":"硬件抽象层和引导加载程序都属于底层软件。下列各功能中，并非由底层软件实现的功能是（  ）。","o":["设备初始化","进程间通信","装载操作系统映像到内存","初始化存储器"],"a":"B","e":"底层软件主要就是指硬件抽象层、板级支持包和引导加载程序。能够实现的功能包括设备初始化、初始化外围设备、加载和启动操作系统等。而进程间通信主要通过内核和外设实现。故本题选择B。","code":0},{"id":"474","paper":"真考试卷11","no":34,"type":"单项选择题","q":"下面关于Linux操作系统的论述中，错误的是（  ）。","o":["Linux是能够为多用户提供多任务功能的单内核操作系统","Monta Vista Linux是一种嵌入式操作系统发行版","虚拟文件系统（VFS）在系统调用接口和内核所支持的文件系统之间提供了一个交换层","Linux内核通过系统调用接口访问系统硬件"],"a":"D","e":"Linux是能够为多用户提供多任务、多线程功能的大型单内核操作系统；Monta Vista Linux是一种嵌入式操作系统发行版，是Monta Vista Software公司于1999年7月推出的；虚拟文件系统（VFS）是Linux的通用文件系统模型，在系统调用接口和内核所支持的文件系统之间提供了一个交换层；系统调用是Linux中用户进程和操作系统之间的重要接口。故本题选择D。","code":0},{"id":"475","paper":"真考试卷11","no":35,"type":"单项选择题","q":"下面关于实时系统的论述中，正确的是（  ）。","o":["硬实时任务偶尔超出时限将造成任务的服务质量下降。","硬实时系统的时限比软实时系统短。","核反应堆处理装置属于硬实时系统。","嵌入式系统都是实时系统。"],"a":"C","e":"一旦任务执行时间超过截止时间系统的总损益就为负，这种实时系统称为硬实时系统，否则为软实时系统。对于硬实时系统，一旦超过时限将导致严重的负效益后果，如飞机控制器、核反应堆处理装置；而软实时系统中如果输出响应超过时限，一般不会造成严重后果；多数的嵌入式系统都具有时间约束性，然而并非嵌入式系统都是实时系统。故本题选择C。","code":0},{"id":"476","paper":"真考试卷11","no":36,"type":"单项选择题","q":"μC/OS-II操作系统内核通过任务控制块管理任务。下列各项中，不属于任务控制块的内容的是（  ）。","o":["指向任务代码临界区的指针","指向任务堆栈栈顶的指针","任务的优先级","任务的状态字"],"a":"A","e":"内核对任务的管理通过任务控制块OS_TCB进行，是一个数据结构。包括任务的优先级、任务的状态字、指向任务堆栈栈顶的指针等。故本题选择A。","code":0},{"id":"477","paper":"真考试卷11","no":37,"type":"单项选择题","q":"下列关于Bootloader的描述中，错误的是（  ）。","o":["依赖于CPU体系结构的代码通常都放在Bootloader阶段1中","Bootloader通常支持启动加载模式和下载模式","Bootloader执行的第一条指令必须存储在RAM存储器中","Bootloader阶段2的代码通常用C语言实现"],"a":"C","e":"由于Bootloader的实现依赖于CPU的体系结构，因此大多数Bootloader都分为两个阶段。依赖于CPU的体系结构的代码通常都放在阶段1中；阶段2通常用C语言来实现；其通常支持启动加载模式和下载模式；系统加电后，CPU执行的第一条指令就是Bootloader程序中的第一条指令，这条指令一般会存储在某种类型的固态存储设备上，比如ROM、EEPROM或者Flash ROM等。故本题选择C。","code":0},{"id":"478","paper":"真考试卷11","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统中断处理的描述中，错误的是（  ）。","o":["中断服务子程序本身不能进行事件处理，必须通过相关函数通知特定的任务进行事件处理","当中断服务子程序返回时，有可能进行任务切换","中断服务子程序的最后一步是执行中断返回指令","μC/OS-II操作系统中断嵌套层数可达255层"],"a":"A","e":"中断服务子程序执行事件处理有两种方法：一种是通过OSMBoxPost()、OSQPost()、OSSEMPost()等函数去通知真正做该事件处理的那个任务，让任务完成中断事件的处理；另一种是由中断服务子程序本身完成事件处理。所以A项错误。故本题选择A。","code":0},{"id":"479","paper":"真考试卷11","no":39,"type":"单项选择题","q":"下面有关嵌入式系统开发的说明中，错误的是（  ）。","o":["嵌入式系统开发往往是与应用目标紧密联系在一起的。","嵌入式系统的应用程序需要基于某个嵌入式操作系统上来开发。","嵌入式系统开发往往需要综合考虑系统的硬件、软件逻辑功能如何实现。","嵌入式系统开发往往需使用宿主机-目标机的开发架构来进行。"],"a":"B","e":"由于嵌入式系统与应用目标紧密集合，并且其硬件资源有限，其开发具有许多特点：使用宿主机—目标机的开发架构；与底层硬件控制程序的关系密切；软硬件资源受限制，故需综合考虑系统软硬件逻辑功能如何实现；需要固化程序，嵌入式应用程序经过交叉工具链生成映像文件之后下载到目标机进行调试。故本题选择B。","code":0},{"id":"480","paper":"真考试卷11","no":40,"type":"单项选择题","q":"GCC是针对Linux操作系统环境下应用程序的编译工具，下面叙述中错误的是（  ）。","o":["GCC将源文件生成可执行文件的过程是由：编译、汇编、连接等3个阶段组成。","GCC能将C语言、C++语言、汇编语言编写的源程序生成执行文件。","设计者若要对源程序进行调试，需要在GCC命令中加入-g参数来编译该源程序。","用GCC把源文件仅编译成目标文件，那么，C语言编写的应用程序中可以不要main函数。"],"a":"A","e":"GCC是针对Linux操作系统环境下应用程序的编译工具，它能将C语言、C++语言、汇编语言编写的源程序以及库文件编译连接成执行文件；它从源文件生成可执行文件的过程是由四个相关联的阶段组成：预处理、编译、汇编、连接。故本题选择A。","code":0},{"id":"736","paper":"真考试卷12","no":1,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中，错误的是（  ）。","o":["嵌入式系统在应用数量上远远超过了通用计算机系统。","嵌入式系统正在逐步渗透到人类社会的各个领域，嵌入式应用无处不在。","嵌入式系统的研发能力及产业化水平是衡量一个国家经济发展、科技进步和国防实力的重要标志。","嵌入式系统的应用和发展是一个新生事物，它还只有十年左右的历史。"],"a":"D","e":"目前，嵌入式系统在应用数量上远远超过了各种类型的通用计算机系统；嵌入式系统正在逐步渗透到人类社会的各个领域，嵌入式应用无处不在；嵌入式系统的研发能力及产业化水平是衡量一个国家经济发展、科技进步和国防实力的重要标志；第一个公认的现代嵌入式系统是20世纪60年代初美国麻省理工学院开发的阿波罗导航计算机；嵌入式系统的批量生产是在20世纪60年代中期；真正意义上的嵌入式系统是从20世纪70年代微处理器出现后发展起来的。故本题选择D。","code":0},{"id":"737","paper":"真考试卷12","no":2,"type":"单项选择题","q":"按照嵌入式系统的软硬件技术复杂程度进行分类，可以把嵌入式系统分为低端系统、中端系统和高端系统三大类。下面哪个选项中所有应用都属于低端嵌入式系统？","o":["智能手机、摄像机、游戏机","数码相机、空调器、电视机顶盒","家用洗衣机、遥控器、微波炉","路由器、BP机、传真机"],"a":"C","e":"嵌入式系统的分类有多种。按系统的软硬件技术复杂度，嵌入式系统分为低端系统、中端系统和高端系统。其中低端系统主要采用4/8位单片机，不使用操作系统，监控程序检测系统；在工业领域和家电领域有较高使用率。故本题选择C。","code":0},{"id":"738","paper":"真考试卷12","no":3,"type":"单项选择题","q":"集成电路的特点是体积小、重量轻、可靠性高，其技术进步日新月异。下面关于当前国际上集成电路技术水平的叙述中，错误的是（  ）。","o":["工艺水平已达几十纳米（nm）的水平","晶体管数目已超过1亿","工作频率达到10GHz","晶圆直径已超过10英寸"],"a":"C","e":"集成电路的特点是体积小、重量轻、可靠性高。集成电路的性能主要体现在逻辑门电路的晶体管大小。晶体管越小，极限工作频率越高，门电路开关速度就越快；芯片上电路元器件的线条越细，相同面积的晶片可容纳的晶体管越多，功能就越强大。随着制作工艺的提升，芯片制作工艺进入了纳米时代。目前，芯片中晶体管数目已达数十亿个，工作频率还未能达到10GHz，晶圆直径也已超过10英寸。故本题选择C。","code":0},{"id":"739","paper":"真考试卷12","no":4,"type":"单项选择题","q":"SoC芯片的开发流程大致可分为如下图所示的4个阶段。其中①、②、③和④分别表示（  ）。","o":["总体设计、逻辑设计、综合与仿真、芯片制造","逻辑设计、综合与仿真、总体设计、芯片制造","总体设计、综合与仿真、逻辑设计、芯片制造","总体设计、逻辑设计、芯片制造、综合与仿真"],"a":"A","e":"SoC芯片的设计开发相当于一个计算机系统的设计开发，是嵌入式系统开发的基础性工作。SoC芯片的开发流程大致分为总体设计、逻辑设计、综合与仿真和芯片制造4个阶段，大部分工作都是采用电子设计自动化（Electronic Design Automation，EDA）工具完成。故本题选择A。","code":0},{"id":"740","paper":"真考试卷12","no":5,"type":"单项选择题","q":"下面关于WiFi无线局域网的叙述中，错误的是（  ）。","o":["无线局域网是以太网与无线通信技术相结合的产物。","无线局域网使用的无线电波主要是2.4GHz和5.8GHz两个频段。","无线局域网采用的通信协议主要是802.11。","无线局域网的数据传输速率目前还低于3G手机的传输速率"],"a":"D","e":"无线局域网是使用无线通信技术的网络。它的最大优点是能方便地移动计算机的位置或改变网络的组成。无线局域网采用无线电波传输数据，传输的频段主要为2.4GHz和5.8GHz，电波覆盖范围较广，采用扩频方式通信，具有抗干扰、抗噪音和抗信号衰减能力，并采用IEEE 802.11通信协议（俗称WiFi）；目前，无线局域网的数据传输速率可达54Mbps，已经非常接近有线局域网的传输速率，远快于3G手机几百kbps的传输速率。故本题选择D。","code":0},{"id":"741","paper":"真考试卷12","no":6,"type":"单项选择题","q":"下面关于互联网（Internet）的叙述中错误的是（  ）。","o":["它使用TCP/IP协议将世界各地的计算机和计算机网络互连在一起。","互联网在物理上已经逐渐形成了基于ISP的多层次结构。","接入互联网的计算机或终端设备，必须获得ISP分配的IP地址。","IP地址是一个12位的十进制数。"],"a":"D","e":"互联网是由一些使用公用语言互相通信的计算机连接而成的网络，即广域网、局域网及单机按照一定的通讯协议组成的国际计算机网络。常用的通讯协议有TCP/IP协议；二进制的IP地址有32位，使用起来极不方便。通常，IP地址采用4个十进制数来表示。目前Internet 逐渐形成了基于ISP的多层结构，接入互联网的计算机或终端设备，必须获得ISP分配的IP地址。故本题选择D。","code":0},{"id":"742","paper":"真考试卷12","no":7,"type":"单项选择题","q":"不属于RISC处理器特点的是（  ）。","o":["指令数目较少，指令字长统一","指令格式规范，寻址模式较为简单","大多能在一个周期内完成指令的执行","指令数目多且结构复杂"],"a":"D","e":"RISC的英文全称是Reduced Instruction Set Computer，中文是精简指令集计算机；指令系统小，一个时钟周期内可以执行一条或者多条指令；采用标准长度指令；指令格式规范，寻址模式较为简单，存储器访问只使用加载和存储两个指令等；采用硬布线逻辑控制为主。故本题选择D。","code":0},{"id":"743","paper":"真考试卷12","no":8,"type":"单项选择题","q":"采用ARM920T处理器（使用ARM9TDMI内核）作为CPU，支持ARM/Thumb指令集，采用哈佛结构，5级流水线，内置MMU,具有16KB指令Cache和16KB数据Cache，该嵌入式处理芯片是（  ）。","o":["S3C2440","S3C44B0","LPC1700","ARM Cortex-A8"],"a":"A","e":"题中的条件只有S3C2440满足，LPC1700基于Cortex-M3内核，S3C44B0基于ARM7TDMI内核，而ARM Cortex-A8是内核名称，故本题选择A。","code":0},{"id":"744","paper":"真考试卷12","no":9,"type":"单项选择题","q":"若ARM处理器执行的指令全部是16位宽度，则该处理器所处的状态是（  ）。","o":["Thumb状态","Thumb-2状态","调试状态","ARM状态"],"a":"A","e":"ARM状态是指ARM处理器工作于32位指令的状态，即32位状态，所有指令均为32位宽度；Thumb状态是指ARM执行16位指令的状态；Thumb-2状态是ARMv7版本的ARM处理器所具有的新状态，新的Thumb-2内核技术兼有16位及32位指令长度；除支持Thumb-2的ARM处理器外，其他所有ARM处理器都可以工作在ARM状态。故本题选择A。","code":0},{"id":"746","paper":"真考试卷12","no":10,"type":"单项选择题","q":"ARM处理器中用作程序计数器PC的通用寄存器是（  ）。","o":["R12","R13","R14","R15"],"a":"D","e":"ARM处理器中用作程序计数器PC的通用寄存器是R15；R12是通用寄存器；R13和R14除了用户模式和系统模式分别为堆栈指针（Stack Pointer, SP）和程序链接寄存器（Link Register, LR）之外，其他模式下均有自己独特的标记方式，是专门用于特定模式的寄存器。故本题选择D。","code":0},{"id":"747","paper":"真考试卷12","no":11,"type":"单项选择题","q":"已知内存0x30000010～0x30000013以大端模式存放一个32位无符号数0xAABBCCDD,R1=0x30000010,R0=0,执行ARM指令LDRH R0,[R1,#2]之后，R0的值为（  ）。","o":["0xAABBCCDD","0x000000BB","0x0000AABB","0x0000CCDD"],"a":"D","e":"在大端模式下，32位数据字的高字节存储在低地址中，而数据字的低字节则存放在高地址中。题中LDRH是半字数据加载指令，用于从存储器中将一个16位的半字数据传送到目的寄存器中，同时将寄存器的高16位清零，且为基址加变址寻址方式。故本题选择D。","code":0},{"id":"748","paper":"真考试卷12","no":12,"type":"单项选择题","q":"已知R3=16，R4=32, ARM处理器执行指令MOV R3,R4,LSR#3后，R3的值为（  ）。","o":["4","8","16","32"],"a":"A","e":"将R4中的内容右移三位后送到R3中，右移1位相当于除以2，右移3位相当于除以2^3=8，那么R3=32÷8=4，故本题答案为A选项。","code":0},{"id":"749","paper":"真考试卷12","no":13,"type":"单项选择题","q":"对于ARM处理器，以下不属于算术运算的指令助记符是（  ）。","o":["ADD","SBC","ADC","AND"],"a":"D","e":"ADD，SBC，ADC均属于算术运算指令，AND是逻辑运算指令。故本题选择D。","code":0},{"id":"750","paper":"真考试卷12","no":14,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中，错误的是（  ）。","o":["嵌入式系统由嵌入式硬件系统及嵌入式软件系统构成","嵌入式硬件系统由嵌入式处理器、存储器、I/O接口等构成","嵌入式硬件系统即嵌入式最小硬件系统","嵌入式软件除具有计算机软件的一般特性外，还具有一些与嵌入式系统特性密切相关的特点"],"a":"C","e":"嵌入式系统由嵌入式硬件系统及嵌入式软件系统构成，嵌入式硬件系统又由嵌入式处理器、存储器、I/O接口等构成。从系统运行的角度，嵌入式硬件系统可以分为嵌入式最小硬件系统和典型嵌入式硬件系统。嵌入式软件除具有计算机软件的一般特性外，还具有一些与嵌入式系统特性密切相关的特点。故本题选择C。","code":0},{"id":"751","paper":"真考试卷12","no":15,"type":"单项选择题","q":"下面是关于嵌入式硬件系统的电源电路的叙述，其中错误的是（  ）。","o":["电源电路为整个嵌入式硬件系统提供能量","通过AC-DC模块完成交流电到直流电的变换（如将市电220VAC直接变换为5VDC）","通过DC-DC模块完成直流电到直流电的变换（如将24VDC变换为5VDC）","LDO(low dropout regulator)是一种完成交流电到直流电变换的模块"],"a":"D","e":"电源电路为整个系统提供能量，是整个系统工作的基础；嵌入式系统常用的电源模块是AC-DC模块、DC-DC模块和稳压器模块。AC-DC模块完成交流电到直流电的变换，DC-DC模块完成直流电到直流电的变换，稳压器包括普通稳压器和低压差稳压器（Low Dropout Regulator, LDO）。稳压器用于提供一种不随负载阻抗、输入电压、温度和时间变化而变化的稳定的电源电压。低压差稳压器是使输出电压稳定的设备，能够在电源电压（输入端）与负载电压（输出端）之间保持微小压差。故本题选择D。","code":0},{"id":"752","paper":"真考试卷12","no":16,"type":"单项选择题","q":"下面是关于ARM处理器芯片中的DMA控制器的叙述，其中错误的是（  ）。","o":["DMA控制器是直接存储器访问控制器的简称","使用DMA控制器可使数据块在外设和内存间进行传输","使用DMA控制器可使数据块在内存和内存间进行传输","ARM处理器芯片中内嵌的UART、USB等接口只能由ARM内核控制其数据传输，不能通过DMA控制器控制其数据传输"],"a":"D","e":"ARM处理芯片内部的DMA控制器（直接存储器访问控制器）是一种硬件组件，使用它可将数据块从外设传输至内存、从内存传输至外设或从内存传输至内存；对于UART端口、USB接口、CAN接口、以太网接口等来说，它们既可以由ARM内核控制其数据传输，也可以通过DMA控制器控制数据传输。故本题选择D。","code":0},{"id":"753","paper":"真考试卷12","no":17,"type":"单项选择题","q":"下面关于嵌入式系统使用的存储器的叙述中，错误的是（  ）。","o":["SRAM和DRAM是易失性存储器","DDR2 SDRAM采用了双倍数据速率技术，DDR3 SDRAM采用了3倍数据速率技术","EPROM是紫外线可擦除可编程的只读存储器","NAND Flash ROM以页（行）为单位随机存取，与NOR Flash ROM相比，在容量、使用寿命和成本方面有较大优势"],"a":"B","e":"嵌入式系统使用的存储器有多种类型，按照其存取特性可分为随机存取存储器（RAM）和只读存储器（ROM）；随机存取存储器包括静态和动态两种形式，即SRAM和DRAM，它们都是易失性存储器，即掉电后信息丢失；DDR SDRAM是新的内存标准之一，它在系统时钟触发沿的上、下沿都能进行数据传输，从而把数据传输速率提高了一倍，DDR2（或DDR3）SDRAM与DDR相比，把DDR的数据传输速率又提高了两倍（或四倍），因此称为DDR2（DDR3），DDR4是DDR3的改进，其数据传输速率是DDR3的2倍；EPROM（Erasable Programmable ROM）是紫外线可擦除可编程的只读存储器；与NOR Flash ROM相比，NAND Flash ROM以页（行）为单位随机存取，在容量、使用寿命和成本方面有较大优势。故本题选择B。","code":0},{"id":"754","paper":"真考试卷12","no":18,"type":"单项选择题","q":"NOR Flash芯片AM29LV320D的逻辑引脚及其简单描述如下：\n\n为使处理器能够以字方式（16位数据线）将信息写入该存储芯片，存储芯片相关引脚必须具有的正确的逻辑组合是（  ）。","o":["CE#=0，OE#=0，WE#=0，BYTE#=0","CE#=1，OE#=1，WE#=1，BYTE#=1","CE#=0，OE#=1，WE#=0，BYTE#=1","CE#=0，OE#=0，WE#=1，BYTE#=0"],"a":"C","e":"根据各个引脚含义可知，CE#是芯片使能，OE#是数据输出使能，WE#是写使能，均是0有效，1无效；BYTE#是选择8位模式（0）还是16位模式（1）。故本题选择C。","code":1},{"id":"755","paper":"真考试卷12","no":19,"type":"单项选择题","q":"用下图可以辅助解释SPI的工作原理。假设主机的移位寄存器A中已存入11001010，从机的移位寄存器B中已存入11110000，则在主机发出4个SCK有效信号后，主机移位寄存器A和从机移位寄存器B中的内容分别是（  ）。","o":["11001010，11110000","01010011，00001111","11110000，11001010","00001100，10101111"],"a":"D","e":"SPI（Serial Peripheral Interface）总线系统是一种同步串行外设接口，允许MCU与各种外围设备以串行方式进行通信、数据交换。时钟信号SCK的1次作用对应一位数据的发送和另一位数据的接收。在主机中数据从移位寄存器中自左向右发出送到从机，同时从机中的数据自右向左发到主机，经过8个时钟周期完成1个字节的发送。输入字节保留在移位寄存器中，然后从接收缓冲区中读出一个字节的数据。故本题选择D。","code":0},{"id":"756","paper":"真考试卷12","no":20,"type":"单项选择题","q":"下面关于S3C2410的UART的叙述中，错误的是（  ）。","o":["通过对UART 线路控制寄存器的设置，可决定该UART一次传送时数据的位数","UART的特殊功能寄存器中包含UART波特率除数寄存器","每个UART的发送数据寄存器和接收数据寄存器共用一个地址，通过对该地址的读或写来确定其是接收数据寄存器还是发送数据寄存器","通过UART控制寄存器可以选择波特率发生器是对PCLK还是对UEXTCLK进行分频以获得通信所需的波特率"],"a":"C","e":"串行异步通信接口通用异步收发器（Universal Asynchronous Receiver/Transmitter, UART）常用于全双工串行异步通信，由发送器、接收器、控制单元、波特率发生器等构成。发送器负责字符的发送，可采用先进先出（FIFO）模式，也可采用普通模式发送；接收器负责外部送来字符的接收，可以是FIFO模式接收，也可以是普通模式接收；接收和发送缓冲器的状态被记录在UART的状态寄存器中，通过读取其状态位即可了解当前接收或发送缓冲器的状态是否满足接收和发送条件。波特率发生器在外部时钟的作用下，通过编程可产生所需要的波特率，其大小由波特率系数寄存器如UBRDIVn决定。故本题选择C。","code":0},{"id":"757","paper":"真考试卷12","no":21,"type":"单项选择题","q":"S3C2410与一位共阳接法的8段LED数码管的连接如下图所示。下面与该图相关的叙述中，错误的是（  ）。","o":["图中的U1（74HC573）具有对数码管的各LED进行驱动的功能","为使图中的数码管显示字符“1”，图中U1（74HC573）的8Q~1Q的状态应为11111001","选中地址nGCS2，S3C2410通过其数据线DATA7~DATA0可将要显示字符的代码锁存进U1（74HC573）","在数码管显示内容改变之前，图中S3C2410的数据线DATA7~DATA0的状态不能发生变化"],"a":"D","e":"共阳极接法情况下，若要指定的LED点亮，则相应的端口应置低电压，即置0；U1作为反向驱动且具有锁存功能。故本题选择D。","code":0},{"id":"758","paper":"真考试卷12","no":22,"type":"单项选择题","q":"下面是关于S3C2410的GPIO端口的叙述，其中错误的是（  ）。","o":["S3C2410的GPIO端口有GPA、GPB、GPC、GPD、GPE、GPF、GPG和GPH共8个","S3C2410各GPIO端口具有不完全相同的功能","S3C2410每个GPIO端口都有相应的控制寄存器、数据寄存器以及上拉寄存器","与S3C2410某个GPIO端口对应的数据寄存器有两个，一个存放该端口输入的数据，另一个存放该端口输出的数据"],"a":"D","e":"S3C2410的GPIO端口有GPA、GPB、GPC、GPD、GPE、GPF、GPG和GPH共8个，每个GPIO端口都有相应的控制寄存器、数据寄存器以及上拉寄存器，各GPIO端口具有不完全相同的功能，具体某端口作为什么样的端口和功能使用，由其对应的控制寄存器相关位决定；数据寄存器可以读取输入引脚的数据，也可以写数据到输出引脚。故此题选择D。","code":0},{"id":"760","paper":"真考试卷12","no":23,"type":"单项选择题","q":"现为某车载地图设备选择操作系统，友好的用户界面是最主要的功能需求之一。以下嵌入式操作系统中，最适宜采用的操作系统是（  ）。","o":["eCOS","Android","QNX","μC/OS-II"],"a":"B","e":"题中所列选项均是典型的嵌入式操作系统，其中Android（安卓）是一种以Linux为基础的半开放源代码操作系统，主要使用于移动便携设备；由谷歌公司推出，属于大型操作系统；也是国际上目前最流行的手持设备开发平台之一。特点：高度的应用便利性，能够提供研发机构快捷的开发能力。故本题选择B。","code":0},{"id":"761","paper":"真考试卷12","no":24,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的描述中，错误的是（  ）。","o":["μC/OS-II支持抢占式任务调度","发生中断时，正在运行的μC/OS-II任务暂停运行，并进入被中断状态","μC/OS-II的所有就绪态任务均登记在事件控制块中","μC/OS-II允许每个任务拥有自己的自用栈"],"a":"C","e":"μC/OS-II是抢占式实时操作系统内核，每个任务拥有自用栈；发生中断时CPU提供相应的中断服务，原来正在运行的任务暂时停止运行，进入了被中断状态；就绪态意味着该任务已经准备好，可以运行了，但由于该任务的优先级比正在运行的任务的优先级低，暂时还不能运行；μC/OS-II就绪表为每一个优先级的任务提供了一个位元，登记该任务是否就绪，就绪时取值为1，没有就绪时取值为0。这样，就绪位为1的所有任务构成了当前就绪任务集。故本题选择C。","code":0},{"id":"762","paper":"真考试卷12","no":25,"type":"单项选择题","q":"硬件抽象层和引导加载程序都属于底层软件。下列各功能中，并非由底层软件实现的功能是（  ）。","o":["设备初始化","进程间通信","装载操作系统映像到内存","初始化存储器"],"a":"B","e":"在嵌入式领域，硬件抽象层主要用来简化嵌入式操作系统的移植作业。它对底层硬件的初始化程序或者控制程序进行封装，向上提供了访问底层硬件的函数接口。引导加载程序主要完成内存加电自检、外设存在自检、内存地址映射、初始化外围设备、内存寻址定位、加载和启动操作系统。故本题选择B。","code":0},{"id":"767","paper":"真考试卷12","no":26,"type":"单项选择题","q":"下面关于Linux操作系统的论述中，错误的是（  ）。","o":[")Linux是能够为多用户提供多任务功能的单内核操作系统","Monta Vista Linux是一种嵌入式操作系统发行版","虚拟文件系统（VFS）在系统调用接口和内核所支持的文件系统之间提供了一个交换层","Linux内核通过系统调用接口访问系统硬件"],"a":"D","e":"Linux是能够为多用户提供多任务功能的单内核操作系统，Monta Vista Linux是一种嵌入式操作系统发行版，其所有源代码都是对外开放的，除了开放源代码外，该公司的专业技术人员可以帮助客户对MontaVista Linux实施更准确地裁剪和整合；VFS是Linux的通用文件系统模型，该模型囊括了连接在Linux上的所有文件系统的常用数据结构和功能集，是各种文件系统之间相互操作的一个通用接口；Linux内核为用户进程提供了一个虚拟接口，即系统调用；这样用户在对硬件编程时就可以使用统一的方式进行。故本题选择D。","code":0},{"id":"768","paper":"真考试卷12","no":27,"type":"单项选择题","q":"下面关于实时系统的论述中，正确的是（  ）。","o":["硬实时任务偶尔超出时限将造成任务的服务质量下降","硬实时系统的时限比软实时系统短","核反应堆处理装置属于硬实时系统","嵌入式系统都是实时系统"],"a":"C","e":"硬实时（Hard Real-Time）系统的运行正确性是同其响应时限紧密相关的。一旦超过时限将导致严重的负效益后果，如飞机控制器、核反应堆处理装置等。然而，在一个软实时（Soft Real-Time）系统中，虽然也存在时限指标，但是如果输出响应超过时限，一般不会造成严重后果。设计软实时系统时，需要考虑该系统对多少次任务执行超时限和延迟是可接受的。常见的实时系统大多是软实时系统。多数嵌入式系统都具有时间约束性，因而至少是软实时系统。反过来说，并非所有的实时系统都是嵌入式系统。故本题选择C。","code":0},{"id":"769","paper":"真考试卷12","no":28,"type":"单项选择题","q":"μC/OS-II操作系统内核通过任务控制块管理任务。下列各项中，不属于任务控制块的内容的是（  ）。","o":["指向任务代码临界区的指针","指向任务堆栈栈顶的指针","任务的优先级","任务的状态字"],"a":"A","e":"内核对任务的管理通过任务控制块OS_TCB（Task Control Block）进行。OS_TCB数据结构中的OSTCBX、OSTCBY、OSTCBBitX、OSTCBBitY4个变量用于加速任务进入就绪态的过程或进入等待事件发生状态的过程，它们是根据任务的优先级OSTCBPrio计算得出；OS_TCB数据结构中的第1个字段是*OSTCBStkPtr，它是指向任务独立堆栈的栈顶指针。故本题选择A。","code":0},{"id":"770","paper":"真考试卷12","no":29,"type":"单项选择题","q":"下列关于Bootloader的描述中，错误的是（  ）。","o":["依赖于CPU体系结构的代码通常都放在Bootloader阶段1中","Bootloader通常支持启动加载模式和下载模式","Bootloader执行的第一条指令必须存储在RAM存储器中","Bootloader阶段2的代码通常用C语言实现"],"a":"C","e":"Bootloader通常支持启动加载模式和下载模式；由于Bootloader的实现依赖于CPU的体系结构，因此大多数Bootloader都分为两个阶段（stage），即stage1和stage2两大部分。依赖于CPU体系结构的代码，比如设备初始化代码等，通常都放在stage1中；而stage2则通常用C语言来实现，这样可以实现更复杂的功能，而且代码具有更好的可读性和可移植性。在系统加电后，CPU执行的第一条指令就是Bootloader程序中的第一条指令，往往存储在某种类型的固态存储设备（比如ROM、EEPROM或者Flash ROM等）。故本题选择C。","code":0},{"id":"771","paper":"真考试卷12","no":30,"type":"单项选择题","q":"下列各项中，属于实时操作系统应该具备的特征的是（  ）。","o":["任务切换时间和中断延迟时间确定","支持网络协议栈","支持时间片轮转调度算法","软件可裁剪"],"a":"A","e":"IEEE的实时UNIX分委会认为实时操作系统应该具备7个特征：具有异步I/O和中断处理能力；任务切换时间和中断延迟时间确定；优先级中断和调度；抢占式调度；内存锁定；连续文件；同步。故本题选择A。","code":0},{"id":"772","paper":"真考试卷12","no":31,"type":"单项选择题","q":"下列关于HAL的描述中，不正确的是（  ）。","o":["HAL隐藏了硬件的差异性，使得操作系统在不同的硬件平台上运行时，内核的代码不需要改动","HAL改善了操作系统的可移植性","HAL又称为downloader","使用HAL会使系统开销稍有增大"],"a":"C","e":"硬件抽象层（Hardware Abstraction Layer, HAL）最早由微软公司在研发Windows NT操作系统时提出，在嵌入式领域，硬件抽象层主要用来简化嵌入式操作系统的移植作业。它对底层硬件的初始化程序或者控制程序进行封装，向上提供了访问底层硬件的函数接口。HAL隐藏了硬件的差异性，使得操作系统在不同的硬件平台上运行时，内核的代码不需要改动，从而改善了操作系统的可移植性。构建和使用HAL的不足之处是系统开销（Overhead）稍有增大。故本题选择C。","code":0},{"id":"773","paper":"真考试卷12","no":32,"type":"单项选择题","q":"下列关于Bootloader的陈述中，不正确的是（  ）。","o":["Bootloader的实现依赖于CPU的体系结构","Bootloader是嵌入式系统开发过程中使用的仿真软件","大多数Bootloader都分为stage1和stage2两大部分","Bootloader主要完成内存加电自检、外设存在自检、初始化外围设备、加载和启动操作系统等功能"],"a":"B","e":"嵌入式系统加电后执行的第一批最初操作称为引导或者自举（Boot），对应的程序称为引导程序或者加载程序，其英文术语是Bootloader；引导加载程序主要完成内存加电自检、外设存在自检、内存地址映射、初始化外围设备、内存寻址定位、加载和启动操作系统；由于Bootloader的实现依赖于CPU的体系结构，因此大多数Bootloader都分为两个阶段（stage），即stage1和stage2两大部分。故本题选择B。","code":0},{"id":"774","paper":"真考试卷12","no":33,"type":"单项选择题","q":"在μC/OS-II操作系统下，能使运行态任务转入等待态的系统函数是（  ）。\n（I）OSSemPost（  ）               （II）OSTaskCreate（  ）\n（III）OSSemPend（  ）             （IV）OSTimeDly（  ）","o":["（I）和（III）","（II）和（IV）","（III）和（IV）","仅（IV）"],"a":"C","e":"挂起态（Pending）或者等待态（Waiting）指正在运行的任务由于调用延时函数OSTimeDly（）或等待事件信号量而将自身挂起。此外OSSemPend()函数也可以使运行态任务转入挂起态。故本题选择C。","code":1},{"id":"775","paper":"真考试卷12","no":34,"type":"单项选择题","q":"在μC/OS-II操作系统下，处于运行态的任务不可能直接转入的状态是（  ）","o":["等待态","被中断态","就绪态","休眠态"],"a":"D","e":"当运行中的任务因等待某个事件（如时间延迟、信号量、消息队列等）而主动放弃CPU时，会进入等待态。当发生中断时，当前正在运行的任务会被暂停，CPU转而执行中断服务程序，该任务进入被中断态。当有更高优先级的任务就绪时，当前运行任务会被剥夺CPU，转入就绪态，等待调度。而运行态的任务不能直接转入休眠态，休眠态是任务尚未被内核管理、未创建任务控制块时的初始状态。任务只有在创建完成后才进入就绪态，运行中的任务若要“结束”，通常会自行退出并回到休眠态，但这不是“直接”的状态转移，而是通过系统调用或任务自身逻辑退出后由内核回收资源，最终回到休眠态。因此，运行态不能直接跳转到休眠态。综上所述，本题答案为D选项。","code":0},{"id":"776","paper":"真考试卷12","no":35,"type":"单项选择题","q":"在μC/OS-II操作系统下，由中断服务子程序代码完成的操作一定包括（  ）。","o":["初始化任务的栈空间","调用OSIntEnter()或者对OSIntNesting变量加1","关闭所有可屏蔽中断","利用函数OSSchedLock()给调度器上锁"],"a":"B","e":"中断服务子程序的伪码结构如下：保存全部CPU寄存器到栈；调用OSIntEnter()或者对OSIntNesting变量加1；执行中断服务代码，或者发出IPC消息通知特定任务去执行中断服务；调用OSIntExit()函数；恢复所有CPU寄存器；执行中断返回指令。故本题选择B。","code":0},{"id":"777","paper":"真考试卷12","no":36,"type":"单项选择题","q":"当满足一定条件时，μC/OS-II操作系统内核将进行任务调度。下列各项中属于中断级任务调度需满足的条件的是（  ）。","o":["空闲任务被挂起","处于就绪态的最高优先级任务的优先级比被中断任务的优先级低","所有的中断服务程序均已经执行完毕","有足够的内存空间保存当前任务的上下文"],"a":"C","e":"当所有的中断服务程序均已经执行完毕时，μC/OS-II操作系统内核将进行任务调度；如果中断嵌套已经全部退出并且有更高优先级的任务就绪，则最高优先级的就绪任务投入执行。故本题选择C。","code":0},{"id":"778","paper":"真考试卷12","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统时间管理的陈述中，正确的是（  ）。","o":["任务A调用OSTimeDlyHMSM()后，一旦有任务B通过调用OSTimeDlyResume()取消了延时，任务A就会立即转入运行态","用户必须在多任务调度启动以后再激活时钟节拍器","如果某个任务因调用OSTimeDly()函数而进入延时等待状态，其他任务可以调用OSTimeDlyHMSM()将其唤醒","运行态任务调用OSTimeDly()后将转入被中断态"],"a":"B","e":"调用OSTimeDly()函数会使μC/OS-II进行一次任务调度，并且执行下一个优先级最高的就绪态任务。任务调用OSTimeDlyHMSM()后，一旦规定的时间期满或者有其它的任务通过调用OSTimeDlyResume()取消了延时，它就会马上处于就绪态；用户调用OSTimeDlyHMSM()函数后，就可以按小时（H）、分（M）、秒（S）和毫秒（M）来定义时间了，这样会显得更自然些；用户必须在多任务调度启动以后再激活时钟节拍器。故本题选择B。","code":0},{"id":"779","paper":"真考试卷12","no":38,"type":"单项选择题","q":"μC/OS-II操作系统通过事件控制块ECB支持任务间通信。下列说法中错误的是（  ）。","o":["中断服务程序可以等待信号","任务可以通过ECB发信号","多个任务可以同时等待同一事件的发生","中断服务程序可以通过ECB发信号"],"a":"A","e":"任务或中断服务子程序可以给事件控制块ECB发信号；只有任务可以等待另一个任务或中断服务子程序通过事件控制块ECB给它发送信号，而中断服务子程序是不能等待事件控制块ECB给它发送信号的；多个任务可以同时等待同一事件的发生。故本题选择A。","code":0},{"id":"780","paper":"真考试卷12","no":39,"type":"单项选择题","q":"下面有关基于嵌入式WEB服务器应用的描述语句中，不恰当的是（  ）。","o":["嵌入式WEB服务器通常与设备的控制器融为一体","嵌入式WEB服务器的功能通常与PC机的WEB服务器相同","基于嵌入式WEB服务器的应用系统，其设计工作中有许多工作是涉及网页设计","嵌入式WEB服务器的主要用途是提供一个远程操控设备的手段"],"a":"B","e":"通用WEB服务器一般运行在计算资源和内存资源都比较丰富的通用计算机上，向用户提供信息服务；而嵌入式WEB服务器是嵌入在设备中的，通常与设备的控制器融为一体，用来控制和管理设备，但也向客户提供设备的运行状态信息；基于嵌入式WEB服务器的应用系统，其设计工作中有许多工作是涉及网页设计，而嵌入式WEB服务器的主要用途是提供一个远程操控设备的手段。故本题选择B。","code":0},{"id":"781","paper":"真考试卷12","no":40,"type":"单项选择题","q":"用ADS1.2集成开发环境进行以S3C2410芯片为核心的嵌入式系统开发时，下面所列举的工作不是必须的。","o":["需要建立一个工程项目，在该工程项目中管理应用程序的源文件、库文件、头文件，以及地址映射文件等","需要在所建立的工程项目中进行连接类型的配置，即确定工程项目中的地址映射关系","需要在所建立的工程项目中进行生成项目的选择，即需选择Debug、Release、DebugRel三个生成项目中的一个","需要在所建立的工程项目中，按照文件的类型或用途进行分组管理应用程序所涉及的文件"],"a":"D","e":"ADS1.2集成开发环境以工程项目的方式来管理源代码文件、库文件以及其他文件；连接类型的配置实际上就是确定工程项目的地址映射关系，通俗地讲，就是要对工程项目中的各段代码或数据进行存储空间的地址分配，以确定它们在目标机上实际存储空间中的地址值，以便输出文件能在目标机上正确运行；一个工程项目中至少应包含一个生成目标，所谓的生成目标指用于生成特定输出文件的生成选项以及所用的所有文件集合，ARM提供的可执行输出文件的模板包括了下面3个生成目标：Debug、Release、DebugRel。故本题选择D。","code":0},{"id":"804","paper":"真考试卷13","no":1,"type":"单项选择题","q":"手机最基本的功能是打电话，在发送话音信号时必须对讲话声音进行数字化，下面有关音频信号数字化的叙述中，错误的是（  ）。","o":["数字化的处理步骤是：取样、量化、编码","量化就是把每个声音信号样本从模拟量转换成数字量","音频信号量化后的样本一般用24位或32位整数表示","量化精度越高，声音的保真度越好，量化精度越低，声音的保真度越差"],"a":"C","e":"音频是频率范围在20Hz~20kHz之间的模拟信号。与数字图像一样，为了能够方便计算机传输、存储、处理，音频也需要数字化成二进制编码。音频数字化过程有取样、量化和编码三个步骤。量化就是把每个样本的模拟值转换成数字量来表示；量化后的样本一般用8位、12位或16位二进制整数表示，称为量化精度；量化精度越高，声音的保真度越好，量化精度越低，声音的保真度越差。综上所述，C选项表述有误，故选C。","code":0},{"id":"805","paper":"真考试卷13","no":2,"type":"单项选择题","q":"下列8个设备中不属于嵌入式系统应用的是哪2个？①洗衣机、②电磁炉、③复印机、④鼠标器、⑤巨型机、⑥服务器、⑦路由器、⑧手机","o":["④、⑦","③、⑧","⑤、⑥","①、②"],"a":"C","e":"嵌入式系统所涉及的应用领域非常广泛，题中洗衣机、电磁炉属于消费类应用产品；复印机、鼠标器、路由器和手机属于业务类应用产品；巨型机和服务器不属于嵌入式应用系统。故本题选择C。","code":0},{"id":"806","paper":"真考试卷13","no":3,"type":"单项选择题","q":"为提高片上系统（SoC）的设计效率，减少重复开发，通常大多以IP核为基础在单个芯片上进行集成，组成一个计算机系统。按照IC设计文件的类型，IP核通常分为哪3种类型？","o":["ARM核、Intel核、AMD核","处理器核、存储器核、I/O核","软核、固核、硬核","硬实时核、软实时核、非实时核"],"a":"C","e":"按照IC设计文件的类型，IP核通常分为3种类型：软核、固核和硬核。故本题选C。","code":0},{"id":"807","paper":"真考试卷13","no":4,"type":"单项选择题","q":"假设数码相机使用的存储卡容量是4GB，它一次可连续拍摄1600万色（真彩色）的4096 x 3072分辨率的彩色相片可达400张，那么其数据压缩比大约是（  ）。","o":["2","4","6","8"],"a":"B","e":"此题主要为数字图像的数据量计算。图像数据量的计算公式如下：图像数据量=图像水平分辨率*图像垂直分辨率*像素深度/8。由此可知，此题中一张彩色图片大小为4096*3072*24/8=36M，所以36M*400/4G≈4。故此题选择B。","code":0},{"id":"808","paper":"真考试卷13","no":5,"type":"单项选择题","q":"下面关于WiFi无线局域网的叙述中，错误的是（  ）。","o":["无线局域网的英文缩写是WLAN","它使用的无线电波主要是2.4MHz和5.8MHz两个频段","无线局域网采用的协议有802.11a、802.11b、802.11g和802.11n等","其数据传输速率目前已达100Mb/s"],"a":"B","e":"无线局域网的英文缩写是WLAN，使用的无线电波主要是2.4GHz和5.8GHz两个频段，而B选项的描述中单位是MHz，B选项叙述错误；采用的协议主要是IEEE 802.11（俗称WiFi），包括802.11a、802.11b、802.11g和802.11n等；其中IEEE 802.11n协议已经将传输速率进一步提高到108Mb/s甚至更高。综上所述，本题答案为B选项。","code":0},{"id":"809","paper":"真考试卷13","no":6,"type":"单项选择题","q":"下面关于将计算机或终端设备接入互联网的有关叙述中，错误的是（  ）。","o":["ADSL是利用普通电话线将计算机接入互联网的一种技术","使用专门的Cable MODEM可以借助有线电视网接入互联网","使用光纤或者光纤+双绞线作为传输介质的互联网接入技术称为光纤接入","手机和平板电脑通过WiFi接入互联网，与ADSL、Cable MODEM和光纤接入均无关"],"a":"D","e":"ADSL即不对称数字用户线，利用普通电话线作为传输介质将计算机接入互联网；借助有线电视网接入互联网时，主机端仍采用传统的以太局域网技术与电缆调制调解器（Cable Modem）连接，后者通过同轴电缆接入HFC；光纤接入网指的是使用光纤作为主要传输介质的互联网接入系统，包括使用光纤或者光纤+双绞线作为传输介质；无线局域网通常与有线局域网连接并通过路由器接入互联网。故本题D项错误。","code":0},{"id":"810","paper":"真考试卷13","no":7,"type":"单项选择题","q":"以下关于嵌入式处理器说法错误的是（  ）。","o":["AVR、MIPS、ARM等均采用RISC指令集","51、AVR、PIC、MIPS等均采用哈佛结构","51、MSP430以及ARM，它们的字长各不相同","ARM均采用哈佛结构"],"a":"D","e":"AVR、MIPS、ARM等均采用RISC指令集；51、AVR、PIC、MIPS等均采用哈佛结构；51是8位字长，MSP430是16位字长，ARM是32位字长；ARM中多数为哈佛结构，ARM7采用冯诺依曼结构。故此题选D。","code":0},{"id":"811","paper":"真考试卷13","no":8,"type":"单项选择题","q":"以下不属于ARM处理器的特点是（  ）。","o":["采用指令流水线技术","采用加载/存储指令访问内存","功能强，能耗大","单周期操作"],"a":"C","e":"ARM处理器的特点有耗电省、功能强、成本低；单周期操作；采用加载/存储指令访问内存；采用指令流水线技术；三地址指令格式等等。故只有C项不正确，答案为C选项。","code":0},{"id":"812","paper":"真考试卷13","no":9,"type":"单项选择题","q":"以下按照ARM公司的分类，不属于ARM Cortex应用处理器的是（  ）。","o":["Cortex-A7","Cortex-A8","Cortex-A15","Cortex-R7"],"a":"D","e":"ARM公司把基于Cortex-A内核的系列处理器称为应用型Cortex处理器，而D项Cortex-R7是基于Cortex-R内核的处理器。故此题选D。","code":0},{"id":"813","paper":"真考试卷13","no":10,"type":"单项选择题","q":"以下具有NVIC的ARM处理器是（  ）。","o":["ARM7","ARM9","ARM11","Cortex-M0"],"a":"D","e":"NVIC为嵌套向量中断控制器，选项中面向微控制器应用领域的Cortex-M0具有此功能。故此题选D。","code":0},{"id":"814","paper":"真考试卷13","no":11,"type":"单项选择题","q":"对于经典ARM处理器，决定ARM处理器工作模式的寄存器是（  ）。","o":["CPSR","PC","LR","SP"],"a":"A","e":"ARM处理器的体系结构支持7种工作模式，取决于当前程序状态寄存器CPSR的低5位的值。故选A。","code":0},{"id":"815","paper":"真考试卷13","no":12,"type":"单项选择题","q":"某ARM处理器内部某功能部件对存储器的保护功能，提供了简单代替存储器管理部件的方法来管理存储器，这个部件用英语缩写为（  ）。","o":["MMU","SPSR","PSR","MPU"],"a":"D","e":"MMU是Memory Management Unit的缩写，中文名是存储器管理单元，它是CPU中用来管理虚拟存储器、物理存储器的控制线路，同时也负责虚拟地址映射为物理地址，以及提供硬件机制的内存访问授权；MPU是存储器保护单元，是对存储器进行保护的可选组件，提供了简单代替MMU的方法来管理存储器。故此题选D。","code":0},{"id":"816","paper":"真考试卷13","no":13,"type":"单项选择题","q":"已知R1=0x81000000,R0=0x00112233,在小端模式下执行ARM指令STR R0,[R1]之后，内存0x81000002中的值为（  ）。","o":["0x00","0x11","0x22","0x33"],"a":"B","e":"STR R0, [R1]表示将寄存器 R0 中的 32 位数据，存储到以寄存器 R1 中的值为起始地址的内存空间中。目标内存起始地址R1 = 0x81000000，待存储的数据R0 = 0x00112233 ，在小端模式下，数据的低位字节存放在内存的低地址处，高位字节存放在内存的高地址处。根据小端模式的存储规则，这 4 个字节从起始地址 0x81000000 开始依次存放：\n内存地址0x81000000存放最低位字节：0x33\n内存地址0x81000001存放次低位字节：0x22\n内存地址0x81000002存放次高位字节：0x11\n内存地址0x81000003存放最高位字节：0x00\n综上所述，内存0x81000002中的值为0x11，本题答案为B选项。","code":0},{"id":"817","paper":"真考试卷13","no":14,"type":"单项选择题","q":"已知R1=0x50001000，R2=0x00080001，执行ARM指令MOV R1,R2,LSL#8后，R1的值为（  ）。","o":["0x08000100","0x00A00010","0xA0001000","0x00000080"],"a":"A","e":"MOV R1 R2, LSL #8先取出寄存器R2中的值，然后对其进行逻辑左移8位操作后的结果存储在R1中，将R2=0x00080001转换为二进制形式：\n0000 0000 0000 1000 0000 0000 0000 0001\n将其逻辑左移8位（即向左移动 8 个二进制位，右侧空出的位补 0）：\n0000 1000 0000 0000 0000 0001 0000 0000 \n将移位后的二进制结果转换回十六进制为0x08000100，因此，执行指令后 R1 的值为 0x08000100，本题答案为A选项。","code":0},{"id":"818","paper":"真考试卷13","no":15,"type":"单项选择题","q":"ARM指令STRB R0,[R1,#4]!执行后，以下说明正确的是（  ）。","o":["R0中的值不变","R1中的值不变","R0和R1中的值均不改变","内存中的值不变"],"a":"A","e":"STRB R0,[R1,#4]!是将寄存器 R0 中的最低8 位（1 个字节）存储到内存地址 R1 + 4 处，并且执行完成后，自动把 R1 + 4 的结果写回 R1（即更新 R1 的值）。即R0→[R1+4]、R1←R1+4；所以此题选择A。","code":0},{"id":"819","paper":"真考试卷13","no":16,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，通过伪指令MyData DCD 0x01234567在内存中定义了1个32位操作数，已知R0=0x56000012,则依次执行：\n    LDR R1,=MyData     \n    LDRH R0,[R1,#2]\n两条指令后，R0的值为（  ）。","o":["0x00000123","0x00004567","0x00000067","0x01234567"],"a":"A","e":"伪指令在源程序中的作用是为完成汇编程序作各种准备工作，这些伪指令仅在汇编过程中起作用，一旦汇编结束，伪指令的使命就完成。DCD为数据定义伪指令，用于分配一片连续的字存储单元，并用伪指令中指定的表达式初始化；LDRH是半字数据加载指令。题中将R1+2指示的存储器的半字数据读入寄存器R0中，并将R0的高16位清零。故选A。","code":1},{"id":"820","paper":"真考试卷13","no":17,"type":"单项选择题","q":"基于ARM内核的嵌入式芯片是以ARM内核为基础，通过AMBA总线将其他硬件组件连接在一起的。下面列出的4个组件中，哪一个组件是挂在AMBA的APB总线上的？","o":["片上SRAM及Flash ROM","PWM","USB主机","DMA控制器"],"a":"B","e":"为了连接ARM内核与处理器芯片中的其他各种组件，ARM公司定义了总线规范，即先进微控制器总线体系结构（AMBA），APB（先进外围总线）属于AMBA上的二级总线，用于不需要高带宽接口的设备互连，所有通用外设组件均连接到APB总线上，如选项中的PWM。故选B。","code":0},{"id":"821","paper":"真考试卷13","no":18,"type":"单项选择题","q":"下面是与ARM处理器存储器相关的叙述，其中错误的是（  ）。","o":["ARM处理器片内数据存储器通常使用的是SDRAM","ARM处理器片内程序存储器通常使用的是Flash ROM","通过ARM处理器片内的外部存储控制器可以对处理器片外扩展的Flash ROM进行管理与控制","通过ARM处理器片内的外部存储控制器可以对处理器片外扩展的SRAM或DRAM（如SDRAM等）进行管理与控制"],"a":"A","e":"ARM处理器片内数据存储器通常使用的是SRAM，片内程序存储器通常用Flash ROM；通过ARM处理器片内的外部存储控制器可以对处理器片外扩展的SRAM和Flash ROM进行管理与控制。A项描述错误，故本题答案为A选项。","code":0},{"id":"822","paper":"真考试卷13","no":19,"type":"单项选择题","q":"下面是关于S3C2410的时钟及电源管理组件的叙述，其中错误的是（  ）。","o":["其MPLL输入时钟既可选择采用外部时钟，也可选择采用外接晶体经其内部振荡电路后输出的时钟","在时钟控制器、电源控制器等控制下产生的PCLK时钟，是连接到芯片内部的APB总线上供外围组件使用的时钟","电源管理模块具有正常模式、慢速模式、空闲模式和掉电模式共四种模式","通过对芯片相关引脚的控制，芯片复位后，可以自动进入电源管理模块具有的任何一种工作模式"],"a":"D","e":"电源管理模块具有正常模式、慢速模式、空闲模式和掉电模式；任何情况下复位操作均自动进入正常工作模式。故D项错误。（注：在S3C2410电源管理组件中“空闲模式” 和 “休眠模式” 都是描述低功耗工作状态，不同资料里的命名习惯或者翻译有所不同）","code":0},{"id":"824","paper":"真考试卷13","no":20,"type":"单项选择题","q":"NOR Flash芯片AM29LV320D的逻辑引脚及其简单描述如下。\n\n为使处理器能够从该存储芯片中以字节方式读取信息，存储芯片相关引脚必须具有的正确的逻辑组合是（  ）。","o":["CE#=1，OE#=1，WE#=1，BYTE#=1","CE#=0，OE#=0，WE#=0，BYTE#=0","CE#=0，OE#=1，WE#=0，BYTE#=1","CE#=0，OE#=0，WE#=1，BYTE#=0"],"a":"D","e":"为使处理器能够从该存储芯片中以字节方式读取信息，\nCE#（Chip Enable）：芯片使能引脚，低电平有效。要使芯片工作，该引脚需为低电平（<CODE>CE# = 0<\/CODE>），否则芯片处于未激活状态，无法进行读写操作。\nOE#（Output Enable）：输出使能引脚，低电平有效。在读取数据时，需要使能输出，所以该引脚应为低电平（<CODE>OE# = 0<\/CODE>）。 \nWE#（Write Enable）：写使能引脚，低电平有效。题目要求是读取信息，因此写使能应无效，即该引脚为高电平（<CODE>WE# = 1<\/CODE>）。 \nBYTE#（Selects 8-bit or 16-bit mode）：用于选择 8 位或 16 位模式，低电平选择 8 位（字节）模式，高电平选择 16 位（字）模式。题目要求以字节方式读取，所以该引脚应为低电平（<CODE>BYTE# = 0<\/CODE>） 。 \n所以CE#=0,OE#=0,WE#=1,BYTE#=0。故本题答案为D选项。","code":1},{"id":"823","paper":"真考试卷13","no":21,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线的叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C总线是集成电路互连总线的简称","I<SUP>2<\/SUP>C总线是一种串行半双工传输的总线标准","I<SUP>2<\/SUP>C总线有三条信号线：数据线SDA，时钟线SCL，应答线ACK","I<SUP>2<\/SUP>C总线属于多主总线，可以同时挂接多个主控器件"],"a":"C","e":"集成电路互连总线（I<SUP>2<\/SUP>C）用于连接嵌入式处理器及其外围器件，它是广泛采用的一种串行半双工传输的总线标准；I<SUP>2<\/SUP>C总线有两条信号线：数据线SDA，时钟线SCL；I<SUP>2<\/SUP>C总线属于多主总线，即允许总线上有一个或多个主控器件和若干从器件同时进行操作；故C选项错误。","code":0},{"id":"825","paper":"真考试卷13","no":22,"type":"单项选择题","q":"一主一从式SPI连接示意如下图所示。从机SPI的4根信号线的名称已在图中标出，为保证主机与从机之间的正确连接及系统正常工作，图中主机的①、②、③、④的信号名称分别应该是什么？","o":["MOSI、MISO、SCK、SSEL","SCK、MOSI、MISO、SSEL","MISO、MOSI、SCK、SSEL","SSEL、MOSI、SCK、MISO"],"a":"C","e":"一主一从式的系统，指SPI总线上只有一个主机和一个从设备，接收和发送数据是单向的，主机MOSI发送，从机MOSI接收，主机MISO接收，从机MISO发送；主机SCK作为同步时钟输出到从机，主机选择信号SSEL接高电平，由于只有一个从机，从机的SSEL接低电平，始终被选中。故此题选C。。","code":0},{"id":"826","paper":"真考试卷13","no":23,"type":"单项选择题","q":"下面关于UART的叙述中，错误的是（  ）。","o":["UART是一种同步串行外设接口","UART可以实现全双工串行通信","UART本身不支持多机通信","UART能实现的最高数据传输速率一般比SPI能实现的最高数据传输速率低"],"a":"A","e":"串行异步通信接口通用异步收发器（UART）常用于全双工串行异步通信，其本身不支持多机通信，能实现的最高数据传输速率一般比SPI能实现的最高数据传输速率低。故选A。","code":0},{"id":"827","paper":"真考试卷13","no":24,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是（  ）。","o":["S3C2410片内的USB主控制器与芯片内部的AHB总线相连","S3C2410片内的USB设备接口与芯片内部的APB总线相连","USB是一种串行异步通信接口","采用USB OTG可以在无USB主机的情况下，直接实现嵌入式设备之间的点对点通信"],"a":"C","e":"S3C2410芯片内部的USB主控制器与芯片内部的AHB总线相连，AHB总线是芯片内部的高速总线，用于连接高性能的外设控制器，如USB主控制器，A选项叙述正确；S3C2410芯片内部的USB设备接口与芯片内部的APB总线相连，APB总线是芯片内部的低速总线，用于连接低速外设接口，如USB设备接口，B选项叙述正确；USB是一种同步串行通信接口，而不是异步通信接口。USB协议中，数据传输是基于时钟同步的，主机通过时钟信号控制数据传输节奏，C选项叙述错误；采用USB OTG技术，可以在没有传统USB主机（如PC）的情况下，实现两个嵌入式设备之间的点对点通信，D选项叙述正确；综上所述，本题答案为C选项。","code":0},{"id":"828","paper":"真考试卷13","no":25,"type":"单项选择题","q":"下面关于嵌入式系统中常用的触摸屏的叙述中，错误的是（  ）。","o":["电阻式触摸屏和电容式触摸屏是嵌入式系统中常用的两种触摸屏","应用时带多点触摸或滑动操作的触摸屏，是电阻式触摸屏","当在电容式触摸屏上触摸时，人的手指与触摸屏的导体层之间形成一个耦合电容","一般电容式触摸屏与ARM处理芯片采用USB或I^2C总线等方式连接"],"a":"B","e":"电阻式触摸屏和电容式触摸屏是嵌入式系统中常用的两种触摸屏，用专用硬笔写字的触摸屏属于电阻式，带多点触摸或滑动操作的触摸屏均属于电容式，一般电容式触摸屏与ARM处理芯片采用USB或I^2C总线方式连接，当在电容式触摸屏上触摸时，人的手指与触摸屏的导体层之间形成一个耦合电容。故B项错误。","code":0},{"id":"829","paper":"真考试卷13","no":26,"type":"单项选择题","q":"下面关于S3C2410中断控制器及中断控制的叙述中，错误的是（  ）。","o":["S3C2410复位后其中断屏蔽寄存器的初值为全0（即所有中断均开放）","S3C2410的中断源可以是有子寄存器的中断源，也可以是没有子寄存器的中断源","作为S3C2410中断控制寄存器之一的中断模式寄存器用于决定中断源的中断属于普通中断IRQ还是快速中断FIQ","S3C2410中断控制寄存器中包含中断屏蔽寄存器和子源中断屏蔽寄存器"],"a":"A","e":"S3C2410中断控制器支持所有内置硬件各组件的硬件中断，复位后，除屏蔽寄存器初始值为全1外，其他寄存器初始值均为0；S3C2410的中断源可以是有子寄存器的中断源，也可以是没有子寄存器的中断源；S3C2410中断控制寄存器中包含中断屏蔽寄存器和子源中断屏蔽寄存器；作为S3C2410中断控制寄存器之一的中断模式寄存器用于决定中断源的中断属于普通中断IRQ还是快速中断FIQ。故A选项错误。","code":0},{"id":"830","paper":"真考试卷13","no":27,"type":"单项选择题","q":"下面关于实时系统的叙述中，错误的是（  ）。","o":["单一的实时系统中可以同时包含硬实时任务和软实时任务","动车的自动驾驶任务属于准实时任务","硬实时、软实时与准实时的概念与时限的长短没有关系","硬件和软件必须协同配合， 共同支持系统对实时性的要求"],"a":"B","e":"具有实时性能的控制系统称为实时系统，单一的实时系统中可以同时包含硬实时任务和软实时任务，硬实时、软实时与准实时的概念与时限的长短没有关系；硬件和软件必须协同配合，共同支持系统对实时性的要求；动车的自动驾驶任务属于硬实时任务；故B项错误。","code":0},{"id":"831","paper":"真考试卷13","no":28,"type":"单项选择题","q":"下面关于Linux内核的叙述中，错误的是（  ）。","o":["Linux起源于芬兰赫尔辛基大学的学生林纳斯·托瓦兹（Linus Torvalds）","Linux虽然对Unix的源代码做了较大修改，但保留了Unix操作系统的全部功能","Linux内核是一种自由软件，其源代码是开放的","对于不同体系结构的CPU，Linux内核的源代码各不相同"],"a":"B","e":"Linux的创始人是芬兰赫尔辛基大学的学生林纳斯·托瓦兹（Linus Torvalds），Linux内核是一种自由软件，其源代码是开放的，对于不同体系结构的CPU，Linux内核的源代码各不相同；Linux的源代码与Unix的源代码是完全不同的，尽管函数和命令的功能、处理结果、函数名称和参数十分相同。故选B。","code":0},{"id":"832","paper":"真考试卷13","no":29,"type":"单项选择题","q":"下列各项中，不属于实时操作系统必须具备的特征的是（  ）。","o":["事件驱动","抢占式调度","多级中断嵌套处理","软件可裁剪"],"a":"D","e":"IEEE的实时UNIX分委会认为实时操作系统应该具备7个特征：具有异步I/O和中断处理能力；任务切换时间和中断延迟时间确定；优先级中断和调度；抢占式调度；内存锁定；连续文件；同步。并没有软件可裁剪的体征，所以D选项不符合题意，本题答案为D选项。","code":0},{"id":"833","paper":"真考试卷13","no":30,"type":"单项选择题","q":"下列关于HAL的描述中，不正确的是（  ）。","o":["HAL位于硬件电路板和操作系统内核之间","HAL是高端嵌入式系统中间件的组成部分","HAL改善了操作系统的可移植性","HAL隐藏了硬件的差异性"],"a":"B","e":"HAL（硬件抽象层）位于硬件电路板和操作系统之间，改善了PC机操作系统的稳定性，实现了Windows NT的可移植性；HAL隐藏了硬件的差异性，使得操作系统在不同的硬件平台上运行时，内核的代码不需要改动，从而改善了操作系统的可移植性；它是嵌入式硬件电路板的最基本软件，而中间件是基于操作系统、给应用服务的中间层，二者在嵌入式软件架构里属于不同层级（HAL 更底层，中间件偏上层 ），HAL 并不属于中间件的组成部分。故B项不正确。","code":0},{"id":"834","paper":"真考试卷13","no":31,"type":"单项选择题","q":"下列关于Bootloader的陈述中，不正确的是（  ）。","o":["在嵌入式操作系统中，所有与特定硬件相关的功能都集成在Bootloader中","Bootloader的实现依赖于CPU的体系结构","U-Boot是支持多种嵌入式CPU的Bootloader程序","Bootloader主要完成内存加电自检、外设存在自检、初始化外围设备、加载和启动操作系统等功能"],"a":"A","e":"嵌入式系统加电后执行的第一批最初操作称为引导或者自举，对应的程序称为引导程序或者引导加载程序（Bootloader），主要完成内存加电自检、外设存在自检、初始化外围设备、加载和启动操作系统等功能；Bootloader的实现依赖于CPU的体系结构，U-Boot可支持多种嵌入式CPU的Bootloader程序。故A项不正确。","code":0},{"id":"835","paper":"真考试卷13","no":32,"type":"单项选择题","q":"下列关于Linux的陈述中，不正确的是（  ）。","o":["Linux内核运行在单独的内核地址空间，每个用户进程则使用自己的虚拟地址空间","RTEMS是能在嵌入式计算机系统上运行的Linux操作系统发行版","驱动程序可以被直接编译到Linux内核中并在内核启动时加载到内存, 亦可以模块形式存储在文件系统中并在需要时被动态加载和卸载","Linux采用宏内核结构。"],"a":"B","e":"Linux是目前唯一可免费获得的、能为多用户提供多任务、多线程功能的大型操作系统；Linux内核为用户进程提供了一个虚拟接口（系统调用），运行在单独的内核地址空间，每个用户进程则使用自己的虚拟地址空间；RTEMS，即实时多处理器系统（Real Time Executive for Multiprocessor Systems），是一个开源的无版税实时嵌入操作系统RTOS，从体系结构上来看，RTEMS是微内核抢占式的实时系统；Linux采用宏内核结构，驱动程序可以被直接编译到Linux内核中并在内核启动时加载到内存, 亦可以模块形式存储在文件系统中并在需要时被动态加载和卸载。故只有B项不正确。","code":0},{"id":"836","paper":"真考试卷13","no":33,"type":"单项选择题","q":"在μC/OS-II操作系统下，能使等待态任务转入就绪态的系统函数是（  ）。","o":["OSSemPost()","OSTaskCreate()","OSSemPend()","OSStart()"],"a":"A","e":"绝大多数情况下，μC/OS-II的每个任务都是一个无限的循环。每个任务都处在以下5种状态之一的状态下。这5种状态是休眠态、就绪态、运行态、挂起态（等待某一事件发生）和被中断态，能使等待态任务转入就绪态的系统函数是OSSemPost()。故A选项正确。","code":0},{"id":"837","paper":"真考试卷13","no":34,"type":"单项选择题","q":"在μC/OS-II操作系统下，处于运行态的任务调用系统函数OSTaskDel（  ）后将转入（  ）。","o":["等待态","被中断态","就绪态","休眠态"],"a":"D","e":"运行态指得到了CPU的控制权正在运行之中的任务状态。因为μC/OS-II是抢占式内核，所以处于运行态的任务一定是当前就绪任务集里的最高优先级任务。处于运行态的任务调用系统函数OSTaskDel()后将转入休眠态。故D项正确。","code":0},{"id":"838","paper":"真考试卷13","no":35,"type":"单项选择题","q":"在μC/OS-II操作系统下，中断服务子程序代码完成的操作不包括（  ）。","o":["保存全部CPU寄存器到堆栈","调用OSIntEnter()或者对OSIntNesting变量加1","调用系统函数OSTimeDly()将当前任务挂起","调用OSIntExit()函数"],"a":"C","e":"中断服务子程序的伪码结构如下：保存全部CPU寄存器到栈；调用OSIntEnter()或者对OSIntNesting变量加1；执行中断服务代码，或者发出IPC消息通知特定任务去执行中断服务；调用OSIntExit()函数；恢复所有CPU寄存器；执行中断返回指令。故本题答案为C选项。","code":0},{"id":"839","paper":"真考试卷13","no":36,"type":"单项选择题","q":"下列关于μC/OS-II操作系统内核任务级的任务调度的说法中，不正确的是（  ）。","o":["当前运行态任务因等待某一事件而被阻塞时，有可能进行任务级的任务调度","有足够的内存空间保存当前任务的上下文是进行任务级调度的条件之一","当发生任务级的任务调度时，内核进行任务级的任务切换，保存当前任务的上下文，并恢复新任务的上下文","当前有更高优先级的任务处于就绪态时，有可能进行任务级的任务调度"],"a":"B","e":"μC/OS-II总是运行处于就绪态任务中优先级最高的那一个。当前运行态任务因等待某一事件而被阻塞时，或者当前有更高优先级的任务处于就绪态时，都有可能进行任务级的任务调度；任务级的调度是由函数OSSched()完成的。OSSched()函数是任务调度的前导函数，判断进行任务调度的三个条件是否满足。这三个条件是：（1）中断嵌套层数共享全程变量OSIntNesting=0，也就是所有的ISR已经执行完毕。（2）任务调度加锁层数共享全程变量OSLockNesting=0，也就是调度没有被禁止。（3）就绪表查找到的最高优先级任务的优先级比当前任务的优先级高。当发生任务级的任务调度时，内核进行任务级的任务切换，保存当前任务的上下文，并恢复新任务的上下文。故B项不正确。","code":0},{"id":"840","paper":"真考试卷13","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统时间管理的陈述中，不正确的是（  ）。","o":["调用OSTimeDly()函数会使μC/OS-II进行一次任务调度","用户必须在多任务系统启动之前激活时钟节拍器","运行态任务调用OSTimeDly()后将转入等待态","在调用OSStart( )之后做的第一件事是初始化定时器中断"],"a":"B","e":"μC/OS-II能够提供周期性时钟信号（即所谓的时钟节拍），用于实现任务的正确延时和超时确认。用户必须在多任务系统启动以后再激活时钟节拍信号发生器，也就是在调用OSStart（）之后。换言之，在调用OSStart（）之后做的第一件事是初始化定时器中断。故B项错误。","code":0},{"id":"841","paper":"真考试卷13","no":38,"type":"单项选择题","q":"μC/OS-II操作系统通过事件控制块ECB支持任务间通信。下列说法中错误的是（  ）。","o":["中断服务程序不能等待信号","任务可以通过ECB向其他任务发信号","多个任务不能同时等待同一事件发生","中断服务程序可以通过ECB向任务发信号"],"a":"C","e":"μC/OS-II的事件控制块ECB（Event Control Block）是用于实现信号量管理、互斥型信号量管理、消息邮箱以及消息队列管理的ITC功能函数的基本数据结构。任务或中断服务子程序可以给事件控制块ECB发信号。只有任务可以等待另一个任务或中断服务子程序通过事件控制块ECB给它发送信号，而中断服务子程序是不能等待事件控制块ECB给它发送信号的。处于等待状态的任务可以指定一个最长等待时间，以防止因等待的事件没有发生而无限期地等待下去。多个任务可以同时等待同一事件的发生。在这种情况下，当该事件发生后，所有等待该事件的任务中，只有优先级最高的任务得到该事件并进入就绪状态，准备执行。当事件控制块ECB是一个信号量时，任务可以等待它，也可以给它发送消息。故本题选C。","code":0},{"id":"842","paper":"真考试卷13","no":39,"type":"单项选择题","q":"下面有关片上调试技术的描述语句中，不恰当的是（  ）。","o":["边界扫描技术是调试硬件芯片及目标机电路板的一种常用调试技术","JTAG组织所研究的测试访问端口和边界扫描结构标准，成为了片上测试技术的一种国际标准，即俗称的JTAG标准","使用片上调试技术进行嵌入式系统目标机调试时，无需目标存储器，也不占用目标机任何I/O端口","JTAG标准的片上调试技术采用并行方式与扫描链进行数据交互"],"a":"D","e":"由于传统ICE难以胜任高速嵌入式系统的开发，目前越来越多的嵌入式处理器借助于片上调试技术（On-Chip Debugging, OCE）进行嵌入式系统的调试。边界扫描（Boundary Scan）测试技术是对芯片或印制电路板进行片上调试最常用的一种技术。JTAG是IEEE的一个下属组织，任务是研究测试访问端口和边界扫描结构的标准。JTAG标准允许多个芯片（电路）的边界扫描寄存器BSR通过JTAG接口串联在一起，实现对多个器件的测试。串接起来的扫描链包含的串行数据流可能长达几百位。使用JTAG进行嵌入式系统的调试，无需目标存储器，也不占用目标机任何I/O端口。所以本题选D。","code":0},{"id":"843","paper":"真考试卷13","no":40,"type":"单项选择题","q":"下面关于ADS1.2开发工具的说法中，不正确的是（  ）。","o":["利用ADS1.2工具建立的应用工程项目中，至少应包括一个Release生成目标","ADS1.2工具完成应用程序连接时，可按照Scattered类型的文件进行地址映射","ADS1.2工具把被编译后的信息，按照RO段或RW段或ZI段来存储","对于地址映射关系简单的工程项目，ADS1.2可以根据Simple连接类型的参数来完成应用程序的地址映射"],"a":"A","e":"在ADS1.2的集成开发环境中，设计者所设计的嵌入式应用程序的源文件、库文件、头文件以及其他的输入文件，均以一个工程项目的形式进行管理，并且在工程项目中，为了方便管理，这些文件还可以按照某种逻辑关系进行分组。一个工程项目中至少应包含一个生成目标，ARM提供的可执行输出文件的模板包括了下面3个生成目标：Debug、Release、DebugRel。故A项错误。","code":0},{"id":"865","paper":"真考试卷14","no":1,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中，错误的是（  ）。","o":["嵌入式系统所涉及的应用领域非常广泛","嵌入式系统性能较低，价格也比较便宜","嵌入式系统大多具有不同程度的实时性","嵌入式系统与通用计算机一样，也由硬件和软件两部分组成"],"a":"B","e":"嵌入式系统所涉及的应用领域非常广泛，诸如通信、仪器、医疗、家用电器、娱乐设备、船舶、汽车等领域。嵌入式系统与通用计算机一样，也由硬件和软件两部分组成， 大多具有不同程度的实时性。在高端应用领域也需要高性能的嵌入式系统，价格也不会很便宜。综上所述，B选项表述有误，故选B。","code":0},{"id":"866","paper":"真考试卷14","no":2,"type":"单项选择题","q":"按照嵌入式系统的技术复杂程度进行分类，可以把嵌入式系统分为低端系统、中端系统和高端系统三大类。下面属于高端嵌入式系统的是（  ）。","o":["电冰箱","智能手机","空调器","复印机"],"a":"B","e":"嵌入式系统所涉及的应用领域非常广泛，按系统的软硬件技术复杂度，嵌入式系统分为低端系统、中端系统和高端系统。选项中智能手机属于高端系统，低端系统一般在工业领域和家电领域有较高使用率。故本题选择B。","code":0},{"id":"867","paper":"真考试卷14","no":3,"type":"单项选择题","q":"嵌入式系统的性能在很大程度上是由CPU 决定的，CPU 的性能主要表现为指令执行速度的快慢。下列选项中不直接影响CPU速度的是（  ）。","o":["指令系统结构","cache容量","指令流水线数目","I/O接口的类型和数目"],"a":"D","e":"影响CPU性能的主要因素有：主频、指令系统、高速缓冲存储器的容量和结构、逻辑结构（包括指令流水线数目）。故本题选D。","code":0},{"id":"868","paper":"真考试卷14","no":4,"type":"单项选择题","q":"片上系统（SoC）是嵌入式处理芯片的一个重要品种，下列叙述中错误的是（  ）。","o":["SoC是集成电路加工工艺进入到深亚微米时代的产物","SoC既能把数字电路也能把模拟电路集成在单个芯片上","需要时，SoC使用单个芯片可以进行数据的采集、转换、存储和处理，并支持多种I/O功能","包含32位CPU的SoC设计制造难度很大，目前还未广泛使用"],"a":"D","e":"SoC是集成电路加工工艺进入到深亚微米时代的产物，既能把数字电路也能把模拟电路集成在单个芯片上；需要时，SoC使用单个芯片可以进行数据的采集、转换、存储和处理，并支持多种I/O功能。目前大多数32位的嵌入式处理芯片均为SoC，SoC已经成为集成电路设计的主流发展趋势。故此题选择D。","code":0},{"id":"869","paper":"真考试卷14","no":5,"type":"单项选择题","q":"假设数码相机一次可连续拍摄1600万色（24位真彩色）的4096 x 3072分辨率的彩色相片可达400张，其数据压缩比为4，那么它所使用的存储卡容量大约是（  ）GB。","o":["1","2","4","8"],"a":"C","e":"一幅图像的数据量可以按下面公式计算：图像数据量=图像水平分辨率×图像垂直分辨率×像素深度/8=4096×3072×24/8=37748736B，存储卡容量=37748736×400/4≈4GB，故本题答案为C选项。","code":0},{"id":"870","paper":"真考试卷14","no":6,"type":"单项选择题","q":"手机最基本的功能是打电话和接听电话，在此过程中手机必须对话音信号进行处理，下面有关叙述中错误的是（  ）。","o":["在发送话音信号时必须对人们的讲话声音进行数字化","数字话音需要进行数据压缩处理","在接听电话时必须把接收到的数字话音信号恢复为模拟信号","通话过程产生的数据流量比传输短消息要少得多"],"a":"D","e":"手机也是嵌入式系统的应用。手机在打电话和接听电话的过程中就是Udine语音信号的数字化处理过程。在发送话音信号时必须对人们的讲话声音进行数字化，在接听电话时必须把接收到的数字话音信号恢复为模拟信号。通话过程产生的数据流量比传输短消息要多得多。故本题D项错误。","code":0},{"id":"871","paper":"真考试卷14","no":7,"type":"单项选择题","q":"下面关于WiFi无线局域网叙述中，错误的是（  ）。","o":["它借助无线电波传输信息，很快将取代有线网络","无线局域网需使用无线网卡、无线接入点等设备构建","无线接入点也称为“热点”","无线接入点实际上就是一个无线交换机或无线Hub，相当于手机通信中的“基站”"],"a":"A","e":"无线接入点也称为“热点”，借助无线电波进行数据传输，无线局域网需使用无线网卡、无线接入点等设备构建，目前还不能完全脱离有线网络，只是有线网络的补充。无线接入点实际上就是一个无线交换机或无线Hub，相当于手机通信中的“基站”。故此题选A。","code":0},{"id":"872","paper":"真考试卷14","no":8,"type":"单项选择题","q":"下面关于无线接入互联网的技术中，错误的是（  ）。","o":["使用WiFi接入互联网时，必须有可用的AP（接入点）","WiFi的数据传输速率可达100Mb/s","借助3G或者4G移动电话网，也可以接入互联网","4G接入技术的速度最快，WiFi将被它取代"],"a":"D","e":"WiFi的传输速率目前可以达到100Mb/s，而4G指第四代移动通信技术，其传输速率可达到20Mbps，理论上最高可以达到高达100Mbps。故只有D项不正确。","code":0},{"id":"873","paper":"真考试卷14","no":9,"type":"单项选择题","q":"关于嵌入式处理器架构说法错误的是（  ）。","o":["不同处理器有不同的指令集架构","ARMv7A处理器的典型代表是ARM11","ARMv7M版本仅支持Thumb-2指令集的子集。","ARMv8A使用64位寄存器，支持ARM、Thumb和A64三种指令集"],"a":"B","e":"不同的嵌入式处理器有不同的指令集架构，ARMv7A处理器的典型代表是Cortex-A系列，而ARM11采用的是ARMV6的体系结构。故此题选B。","code":0},{"id":"874","paper":"真考试卷14","no":10,"type":"单项选择题","q":"在以下ARM处理器中，面向中低端应用，成本最低的ARM Cortex嵌入式处理器是（  ）。","o":["ARM Cortex-M0","ARM Cortex-M3","ARM Cortex-M4","ARM Cortex-R4"],"a":"A","e":"面向中低端应用的主要是Cortex-M系列处理器，一般面向控制领域，选项中成本最低的是ARM Cortex-M0处理器。故此题选A。","code":0},{"id":"875","paper":"真考试卷14","no":11,"type":"单项选择题","q":"以下按照ARM公司的分类，不属于ARM Cortex应用处理器的是（  ）。","o":["Cortex-A9","Cortex-A7","Cortex-A57","Cortex-R7"],"a":"D","e":"ARM公司把从ARM7到ARM11为内核的系列处理器称为经典ARM处理器，而ARM6内核系列以及更早的系列已经很罕见了，很多已经淘汰不用了。把基于Cortex-R（Real Time）和Cortex-M(MicroController)为内核的系列处理器称为嵌入式Cortex处理器，这一类芯片通常被称为嵌入式微控制器，而把基于Cortex-A(A=Application)内核的系列处理器称为应用型Cortex处理器。故选D。。","code":0},{"id":"876","paper":"真考试卷14","no":12,"type":"单项选择题","q":"以下不具有Thumb-2状态的ARM处理器是（  ）。","o":["Cortex-M0","Cortex-M3","ARM9","SC300"],"a":"C","e":"Thumb-2状态是ARMv7版本的ARM处理器所具有的新状态，如Cortex系列。ARM9不具有Thumb-2状态。故此题选C。","code":0},{"id":"877","paper":"真考试卷14","no":13,"type":"单项选择题","q":"关于经典ARM处理器的工作模式，以下说法错误的是（  ）。","o":["中止模式是处理普通中断的模式","用户模式是程序正常执行的工作模式","快速中断模式用来处理快速中断FIQ","管理模式是操作系统的保护模式，处理软中断SWI"],"a":"A","e":"ARM体系结构支持7种工作模式，取决于当前程序状态寄存器CPSR的低5位的值。工作模式间可以相互切换，但是是有条件的。中止模式是处理存储器故障，实现虚拟存储器和存储器保护。用户模式是程序正常执行的工作模式，快速中断模式用来处理快速中断FIQ，管理模式是操作系统的保护模式，处理软中断SWI。故此题选A。","code":0},{"id":"878","paper":"真考试卷14","no":14,"type":"单项选择题","q":"以下关于ARM状态寄存器CPSR的说法错误的是（  ）。","o":["CPSR决定经典ARM处理器的工作模式","CPSR决定是否允许中断","CPSR中存放了运算结果产生的一些标志","CPSR可读，但不可写"],"a":"D","e":"CPSR（当前状态寄存器）可以读写，当中存放了运算结果产生的一些标志，决定经典ARM处理器的工作模式和是否允许中断。此题选择D。","code":0},{"id":"879","paper":"真考试卷14","no":15,"type":"单项选择题","q":"执行ARM指令LDRH R1,[R2,#4]!之后，以下说法错误的是（  ）。","o":["R1的值加4","R2的值加4","内存中的数据保持不变","R1和R2的值均改变"],"a":"A","e":"LDRH是存储器到寄存器的数据传送指令，半字数据加载指令。指令LDRH R1,[R2,#4]!是将内存地址为R2+4 处的16 位半字数据读取到寄存器 R1 中，同时把 R2+4 这个新地址写回基址寄存器 R2；R1的值并不是加4，所以此题选择A。","code":0},{"id":"880","paper":"真考试卷14","no":16,"type":"单项选择题","q":"已知R1=0x00000088,执行ARM指令TST R1,#8后，R1的值为（  ）。","o":["0x00000008","0x00000011","0x00000088","0x00000440"],"a":"C","e":"TST指令是一种逻辑处理指令，用于把一个寄存器的内容和另一个寄存器的内容或立即数进行按位的与运算，并根据运算结果更新CPSR中条件标志位的值。TST指令不会改变操作数的值，只会改变标志位。因此，执行TST R1,#8后，R1的值仍然为0x00000088，选项C是正确的。","code":0},{"id":"881","paper":"真考试卷14","no":17,"type":"单项选择题","q":"以下ARM指令正确的是（  ）。","o":["SUB R4,#1","ORR R2,#9","ADCS R7,R7,#1","JMP PC,LR"],"a":"C","e":"A选项中SUB是减法指令，缺少寄存器；B选项中是逻辑或指令，同样缺少寄存器；C项正确；D选项JMP是无条件跳转指令。故选C。","code":0},{"id":"882","paper":"真考试卷14","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，通过伪指令DataTab DCW 0x1234,0x5678，0x9ABC,0xDEF0在内存中定义了这4个16位无符号数，R1=0x00000089,则在执行伪指令LDR R0,=MyData后再执行指令STR R1,[R0,#4]！，则（  ）。","o":["DataTab指示的内存区域数据不变","R1的值不变，仍为0x00000089","R0的值不变","R1中的值为0xDEF09ABC"],"a":"B","e":"在小端模式下，32位数据字的高字节存放在高地址，而低字节存放在低地址，这与通用微型计算机的存储器的信息存放格式相同。LDR是存储器到寄存器的数据传送指令，STR是寄存器到存储器的数据传送指令。故此题选B。","code":0},{"id":"883","paper":"真考试卷14","no":19,"type":"单项选择题","q":"下面是关于典型嵌入式系统的调试测试接口电路的叙述，其中错误的是（  ）。","o":["JTAG是一种国际标准测试协议，主要用于芯片内部测试及对系统进行仿真、调试","基于ARM的典型嵌入式系统的调试测试接口电路常采用JTAG","多个器件的JTAG接口可以串联在一起形成JTAG链","JTAG接口通常不能实现在线编程功能"],"a":"D","e":"基于ARM的典型嵌入式系统的调试测试接口电路常采用JTAG，JTAG是一种国际标准测试协议，主要用于芯片内部测试及对系统进行仿真、调试；JTAG接口可以实现在线编程功能，多个器件的JTAG接口可以串联在一起形成JTAG链。故D项错误。","code":0},{"id":"884","paper":"真考试卷14","no":20,"type":"单项选择题","q":"AMBA是ARM公司公布的总线协议， 是用于连接和管理片上系统中功能模块的开放标准和片上互连规范。下面列出的ARM处理芯片中的4个组件，哪一个组件是挂在AMBA的系统总线上的？","o":["中断控制器","CAN","RTC","SPI"],"a":"A","e":"基于AMBA总线的处理器使用系统总线和外围总线构成来连接高速系统组件和低速外围组件，高带宽高性能外围接口通常连接系统总线，而速度不高的外部接口连接外围总线。中断控制器是直接连接到系统总线上，其余三项是外围总线连接的硬件组件。故选A。","code":0},{"id":"885","paper":"真考试卷14","no":21,"type":"单项选择题","q":"下面是关于ARM处理器中模拟通道组件的叙述，其中错误的是（  ）。","o":["利用ARM处理器内嵌的ADC可完成从模拟信号到数字信号的变换","利用ARM处理器内嵌的DAC可完成从数字信号到模拟信号的变换","有些ARM处理器内部的模拟组件除包括ADC和DAC外，还包含比较器等","ARM处理器内嵌的ADC的A/D转换精度与ADC的位数无关"],"a":"D","e":"有些ARM处理器内部的模拟组件除包括ADC和DAC外，还包含比较器；ADC和DAC可以分别完成模拟信号到数字信号的变换和数字信号到模拟信号的变换，其转换精度与位数正相关。故D选项错误。","code":0},{"id":"886","paper":"真考试卷14","no":22,"type":"单项选择题","q":"下面关于嵌入式系统使用的存储器的叙述中，错误的是（  ）。","o":["新型存储器FRAM和MRAM是非易失性存储器","EEPROM是一种可电擦除可编程的只读存储器，可以在线改写和擦除信息","NOR Flash ROM的特点是以字节为单位随机存取","存储容量达几十GB（甚至更高）的微硬盘，其内部的存储体主要是Flash ROM"],"a":"D","e":"新型存储器FRAM和MRAM是非易失性存储器，EEPROM是一种可电擦除可编程的只读存储器，可以在线改写和擦除信息，NOR Flash ROM的特点是以字节为单位随机存取，存储容量达几十GB（甚至更高）的微硬盘，其内部的存储体主要是NAND Flash。故此题选D。","code":0},{"id":"887","paper":"真考试卷14","no":23,"type":"单项选择题","q":"下面关于SPI的叙述中，错误的是（  ）。","o":["SPI是一种同步串行外设接口","SPI是一种全双工串行外设接口","通过SPI只能连接两个设备","通过SPI可以方便地实现几Mb/s（或更高）的数据传输速率"],"a":"C","e":"SPI（Serial Peripheral Interface）总线系统是一种同步串行外设接口，允许MCU与各种外围设备以串行方式进行通信、数据交换。外围设备包括Flash、RAM、ADC、网络控制器和MCU等。SPI接口总线配置灵活，可用于单主机单从机配置、单主从互换配置、单主多从配置和多主多从配置。故选C。","code":0},{"id":"888","paper":"真考试卷14","no":24,"type":"单项选择题","q":"下图为基于ARM处理器的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，正确的是（  ）。","o":["图中所示的键盘接口采用了线性键盘的结构","为简化设计，图中的R1~R4可以直接短接","可采用中断方式读取按键的特征值","读取按键的特征值时，GPG4~GPG7作为输入接口"],"a":"C","e":"线性键盘是每个按键单独占用一根 GPIO 线，按键数量多了会占用大量 IO 口，矩阵键盘是按键按行列矩阵排列，用较少的 IO 线（如 4 行 4 列共 8 根线）实现较多按键（16 个）。而图中是4x4=16个按键，只使用了8个GPIO口（4个行线，4个列线），通过行列扫描的方式来识别按键，这是典型的矩阵键盘结构，A选项叙述错误；R1~R4是上拉电阻，其作用是保证在按键未按下时，行线保持高电平。同时，当处理器将某一行（如GPG4）设置为低电平时，电流会通过上拉电阻和按下的按键流向列线，而不会造成短路。如果将R1~R4短接，意味着行线将直接连接到电源VDDI3。当处理器尝试将某一行（如GPG4）输出为低电平时，会形成从VDDI3到GPG4引脚的直接短路，产生巨大电流，可能损坏处理器，B选项叙述错误；从电路图可以看出，所有列线都连接到了外部中断引脚EXTINT1。在默认情况下（无按键按下），由于上拉电阻的存在，EXTINT1引脚为高电平。当任意一个按键被按下时，对应的列线会被其所在的行线拉低，从而导致EXTINT1引脚的电平从高变低，产生一个下降沿。这个下降沿可以触发外部中断，通知处理器有按键被按下。处理器响应中断后，再执行扫描程序来确定具体是哪个按键，这种方式效率高，可以节省CPU资源。C选项叙述正确；在矩阵键盘的扫描过程中，处理器需要依次将GPG4~GPG7（行线）设置为低电平，来检测是否有按键被按下。这个主动驱动电平的过程表明GPG4~GPG7应被配置为输出接口。而GPF4~GPF7（列线）是用来读取按键状态的，应被配置为输入接口，D选项叙述错误；综上所述，C选项叙述正确，本题答案为C选项。","code":0},{"id":"889","paper":"真考试卷14","no":25,"type":"单项选择题","q":"S3C2410与一位共阳接法的8段LED数码管的连接如下图所示。下面与该图相关的叙述中，错误的是（  ）。","o":["图中的U1（74HC573）具有对数码管的各LED进行驱动的功能","为使图中的数码管显示字符“0”，图中U1（74HC573）的8Q~1Q的状态应为00111111","图中的GPE7~GPE0引脚是S3C2410的GPIO端口的部分引脚","仅GPE7~GPE0引脚状态发生变化，不会引起数码管显示内容的变化"],"a":"B","e":"图中采用共阳极接法，所以要显示字符“0”，图中U1（74HC573）的8Q~1Q的状态应为11000000。故B项错误。","code":0},{"id":"890","paper":"真考试卷14","no":26,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是（  ）。","o":["各个USB版本均具有全双工通信能力","各个USB版本均采用差分方式传输数据信号","USB设备接入USB总线时，采用同名端（同名引脚）相连的方式","USB 3.0的最大数据传输速率为5Gbps"],"a":"A","e":"USB总线（1.1和2.0）有4根信号线，采用半双工差分方式，用来传送信号并提供电源；USB设备和USB总线接口的连接是采用同名端相连的方式；USB 3.0的最大数据传输速率为5Gbps。故A选项错误。","code":0},{"id":"891","paper":"真考试卷14","no":27,"type":"单项选择题","q":"若利用S3C2410的UART1进行通信，希望的波特率为19200bps，相应的波特率发生器对100MHz的时钟频率进行分频，则波特率除数寄存器UBRDIV1的值应设置为（  ）。","o":["837","107","324","12"],"a":"C","e":"UART的波特率由除数寄存器决定，也取决于外部时钟，关系式如下：UBRDIVn=INT（UCLK/（波特率ⅹ16））-1，UCLK可以是PCLK，还可以是UEXTCLK，由相应控制寄存器决定。故选C。","code":0},{"id":"892","paper":"真考试卷14","no":28,"type":"单项选择题","q":"下面关于CAN的叙述中，错误的是（  ）。","o":["CAN可实现多主工作方式，CAN网络上的节点在网络空闲时均可主动地向网络发送信息","CAN总线的数据帧由7个不同的域组成","通过CAN数据帧发送数据时，每次发送的数据必须固定为8个字节","CAN总线采用差分方式进行信息传输"],"a":"C","e":"CAN总线采用差分传输，控制器内置CRC校验，传输可靠性强，可构成多主多从系统，即同一时刻允许多个主从机同时进行数据传输。CAN总线的数据帧是由7个不同的域组成：帧起始、仲裁域、控制域、数据域、CRC域、应答域、帧结尾。数据域由数据帧的发送数据组成，它可以是0~8B，每字节包含8位，按照高位在前，低位在后的原则发送。故选C。","code":0},{"id":"893","paper":"真考试卷14","no":29,"type":"单项选择题","q":"下列各项中，不属于实时操作系统应该具备的特征的是（  ）。","o":["支持时间片轮转调度算法","任务切换时间和中断延迟时间确定","必须支持多级中断嵌套处理机制","支持实时抢占式调度"],"a":"A","e":"IEEE的实时UNIX分委会认为实时操作系统应该具备7个特征：具有异步I/O和中断处理能力；任务切换时间和中断延迟时间确定；优先级中断和调度；抢占式调度；内存锁定；连续文件；同步。所以此题选A。","code":0},{"id":"894","paper":"真考试卷14","no":30,"type":"单项选择题","q":"下列关于HAL的描述中，不正确的是（  ）。","o":["HAL位于硬件和操作系统内核之间","术语HAL和Bootloader具有相近的含义，有时甚至可以相互替代使用","引入HAL的目的是对硬件进行抽象","HAL改善了操作系统的可移植性"],"a":"B","e":"HAL（硬件抽象层）位于硬件电路板和操作系统之间，改善了PC机操作系统的稳定性，实现了Windows NT的可移植性；HAL隐藏了硬件的差异性，使得操作系统在不同的硬件平台上运行时，内核的代码不需要改动，从而改善了操作系统的可移植性；它是嵌入式硬件电路板的最基本软件，而Bootloader是在操作系统内核运行之前运行的一段小程序，它的主要任务是初始化硬件设备、建立内存空间的映射图等，HAL和Bootloader没有相近的含义，也不能相互替代使用。所以B选项叙述错误，本题答案为B选项。","code":0},{"id":"895","paper":"真考试卷14","no":31,"type":"单项选择题","q":"下列关于Bootloader的陈述中，不正确的是（  ）。","o":["Bootloader主要完成内存加电自检、外设存在自检、初始化外围设备、加载和启动操作系统等功能","QNX是支持多种嵌入式CPU的Bootloader程序","大多数从Flash存储器上启动的bootloader采用stage1和stage2两个阶段完成操作系统的引导加载","Bootloader的实现依赖于CPU的体系结构"],"a":"B","e":"嵌入式系统加电后执行的第一批最初操作称为引导或者自举，对应的程序称为引导程序或者引导加载程序（Bootloader），主要完成内存加电自检、外设存在自检、初始化外围设备、加载和启动操作系统等功能；Bootloader的实现依赖于CPU的体系结构，U-Boot可支持多种嵌入式CPU的Bootloader程序；大多数从Flash存储器上启动的bootloader采用stage1和stage2两个阶段完成操作系统的引导加载。故B项不正确。","code":0},{"id":"896","paper":"真考试卷14","no":32,"type":"单项选择题","q":"下列关于Linux的陈述中，不正确的是（  ）。","o":["Linux内核的主要作用包括：进程管理与调度、内存管理、提供行命令解释器、进程间通信等","Linux系统最初以Unix为原型","Linux使用GPL授权，是自由软件家族中的一个软件","Linux的虚拟文件系统（VFS）向上层软件提供了不同逻辑文件系统的统一接口"],"a":"A","e":"Linux是目前唯一可免费获得的、能为多用户提供多任务、多线程功能的大型操作系统，Linux使用GPL授权，是自由软件家族中的一个软件；Linux内核的主要作用是：进程管理与调度、内存管理、文件管理、网络接口和进程间通信。它为用户进程提供了一个虚拟接口（系统调用）。运行在单独的内核地址空间，每个用户进程则使用自己的虚拟地址空间； Linux采用宏内核结构，驱动程序可以被直接编译到Linux内核中并在内核启动时加载到内存, 亦可以模块形式存储在文件系统中并在需要时被动态加载和卸载。故只有A项不正确。","code":0},{"id":"897","paper":"真考试卷14","no":33,"type":"单项选择题","q":"在μC/OS-II操作系统下，能使运行态任务转入等待态的系统函数是（  ）。","o":["OSSemPost()","OSTaskCreate()","OSTaskDel()","OSTimeDly()"],"a":"D","e":"OSSemPost()信号量发送函数，作用是释放信号量，会唤醒等待该信号量的任务，让等待态进入就绪态，不会让运行态任务进入等待态；OSTaskCreate()任务创建函数，用于新建一个任务并将其放入就绪队列，不改变当前运行任务的状态；OSTaskDel()任务删除函数，将任务从系统中移除，运行态任务调用该函数会直接被删除，进入休眠态，而非转入等待态；OSTimeDly()任务延时函数，当前运行的任务调用该函数后，会主动延时一段时间，从运行态转入等待态，直到延时时间到达后才会恢复为就绪态；综上所述，能使运行态任务转入等待态的系统函数是OSTimeDly()，本题答案为D选项。","code":0},{"id":"898","paper":"真考试卷14","no":34,"type":"单项选择题","q":"在μC/OS-II操作系统下，处于运行态的任务调用系统函数OSSemPend（  ）后将转入（  ）。","o":["等待态","被中断态","就绪态","休眠态"],"a":"A","e":"运行态指得到了CPU的控制权正在运行之中的任务状态。因为μC/OS-II是抢占式内核，所以处于运行态的任务一定是当前就绪任务集里的最高优先级任务。处于运行态的任务调用系统函数OSSemPend()后将转入等待态。故A项正确。","code":0},{"id":"899","paper":"真考试卷14","no":35,"type":"单项选择题","q":"在μC/OS-II操作系统下，中断服务子程序代码完成的操作不包括（  ）。","o":["保存全部CPU寄存器到堆栈","将被中断的任务挂起","执行中断返回指令","调用OSIntExit()函数"],"a":"B","e":"中断服务子程序的伪码结构如下：保存全部CPU寄存器到栈；调用OSIntEnter()或者对OSIntNesting变量加1；执行中断服务代码，或者发出IPC消息通知特定任务去执行中断服务；调用OSIntExit()函数；恢复所有CPU寄存器；执行中断返回指令。故本题答案为B选项。","code":0},{"id":"900","paper":"真考试卷14","no":36,"type":"单项选择题","q":"下列关于μC/OS-II操作系统内核任务调度的说法中，不正确的（  ）。","o":["进行中断级任务级调度的条件之一是：当前任务的优先级比处于就绪态的最高优先级任务的优先级高","中断级的任务调度是调用函数OSIntExit()完成的","进行中断级任务级调度的条件之一是：所有的中断服务程序均已经执行完毕","内核通过系统函数OS_TASK_SW()进行任务级的任务调度"],"a":"A","e":"μC/OS-II总是运行处于就绪态任务中优先级最高的那一个。当前运行态任务因等待某一事件而被阻塞时，或者当前有更高优先级的任务处于就绪态时，都有可能进行任务级的任务调度，中断级的任务调度是调用函数OSIntExit()完成的；任务级的调度是由函数OSSched()完成的。OSSched()函数是任务调度的前导函数，判断进行任务调度的三个条件是否满足。这三个条件是：（1）中断嵌套层数共享全程变量OSIntNesting=0，也就是所有的ISR已经执行完毕。（2）任务调度加锁层数共享全程变量OSLockNesting=0，也就是调度没有被禁止。（3）就绪表查找到的最高优先级任务的优先级比当前任务的优先级高。当发生任务级的任务调度时，内核进行任务级的任务切换，保存当前任务的上下文，并恢复新任务的上下文。故A项不正确。","code":0},{"id":"901","paper":"真考试卷14","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统时间管理的陈述中，不正确的是（  ）。","o":["调用OSTimeDly()函数会使μC/OS-II进行一次任务调度","用户必须在多任务调度启动之后激活时钟节拍器","运行态任务调用OSTimeDly()后将转入等待态","任务A调用OSTimeDlyHMSM()后，一旦有任务B通过调用OSTimeDlyResume()取消了延时，任务A就会立即转入运行态"],"a":"D","e":"μC/OS-II能够提供周期性时钟信号（即所谓的时钟节拍），用于实现任务的正确延时和超时确认。调用OSTimeDly()函数会使μC/OS-II进行一次任务调度，运行态任务调用OSTimeDly()后将转入等待态。用户必须在多任务系统启动以后再激活时钟节拍信号发生器，也就是在调用OSStart()之后。换言之，在调用OSStart()之后做的第一件事是初始化定时器中断；任务A调用OSTimeDlyHMSM()后，一旦有任务B通过调用OSTimeDlyResume()取消了延时，任务A不会立即转入运行态,而是先进入就绪态，能否运行取决于其优先级是否高于当前正在运行的任务。D选项叙述错误，故本题答案为D选项。","code":0},{"id":"902","paper":"真考试卷14","no":38,"type":"单项选择题","q":"μC/OS-II操作系统通过事件控制块ECB支持任务间通信。下列说法中错误的是（  ）。","o":["中断服务程序不能等待信号","任务可以通过ECB向其他任务发信号","多个任务可以同时等待同一事件发生。当该事件发生后，所有等待该事件的任务都能得到该事件并进入运行状态","中断服务程序可以通过ECB发信号"],"a":"C","e":"μC/OS-II的事件控制块ECB（Event Control Block）是用于实现信号量管理、互斥型信号量管理、消息邮箱以及消息队列管理的ITC功能函数的基本数据结构。任务或中断服务子程序可以给事件控制块ECB发信号。只有任务可以等待另一个任务或中断服务子程序通过事件控制块ECB给它发送信号，而中断服务子程序是不能等待事件控制块ECB给它发送信号的。处于等待状态的任务可以指定一个最长等待时间，以防止因等待的事件没有发生而无限期地等待下去。多个任务可以同时等待同一事件的发生。在这种情况下，当该事件发生后，所有等待该事件的任务中，只有优先级最高的任务得到该事件并进入就绪状态，准备执行。当事件控制块ECB是一个信号量时，任务可以等待它，也可以给它发送消息。故本题选C。","code":0},{"id":"903","paper":"真考试卷14","no":39,"type":"单项选择题","q":"嵌入式系统开发时所用的集成开发环境，包含许多软件工具。下面所列举的工具中，哪一个不属于集成开发环境所包含的软件工具。","o":["项目管理器","在线仿真器","文本编辑器","编译连接器"],"a":"B","e":"嵌入式系统开发时所用的集成开发环境中一般包括项目管理器、文本编辑器和编译连接器等，而在线仿真器是属于嵌入式系统的调试工具。所以本题选B。","code":0},{"id":"904","paper":"真考试卷14","no":40,"type":"单项选择题","q":"下面有关RVDS的说法中，不正确的是（  ）。","o":["RVDS是用于开发基于ARM系列CPU应用系统的开发套件","RVDS也可用来开发基于51系列CPU的应用系统","RVDS包含有编辑器、编译连接器、调试器，不包含指令集仿真器","RVDS支持基于在线仿真器的调试方式来调试目标系统"],"a":"C","e":"RVDS（RealView Development Suite）是ARM公司推出的基于ARM系列CPU进行开发的工具套件，它支持所有ARM芯片，包括Cortex全系列，还支持其他内核的处理器，如51系列等。与ADS1.2比较而言，其生成的代码紧凑、执行效率高。要利用RVDS来调试实际目标板上运行的程序，需要借助RealView-ICE仿真器。RVDS开发工具套件中，主要包括工程管理器（IDE）、编译连接器（RVCT）、调试器（RVD）和指令集仿真器（RVISS）等。故C项错误。","code":0},{"id":"1052","paper":"真考试卷15","no":1,"type":"单项选择题","q":"下面是关于嵌入式系统的叙述，其中错误的是（  ）。","o":["嵌入式系统是嵌入式计算机系统的简称","从应用角度来说，嵌入式系统可以理解为是一种控制、监视或协助设备、机器、工厂运行的装置","随着技术的进步和应用的拓展, 嵌入式系统的内涵也还在发展和变化","人们日常使用的通用计算机（如个人计算机）是一种典型的嵌入式系统"],"a":"D","e":"嵌入式系统是嵌入式计算机系统的简称。从应用角度来说，嵌入式系统可以理解为是一种控制、监视或协助设备、机器、工厂运行的装置，随着技术的进步和应用的拓展, 嵌入式系统的内涵也还在发展和变化，尽管如此，和人们日常使用的通用计算机（如个人计算机）相比，嵌入式系统还是具有很多不同之处的。故此题选择D。","code":0},{"id":"927","paper":"真考试卷15","no":2,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中,错误的是（  ）。","o":["嵌入式系统与具体应用紧密结合, 具有很强的专用性","GPS导航仪、数码相机等设备是嵌入式系统的典型应用","汽车、数控机床中的嵌入式系统要求具有很高的可靠性","嵌入式系统中的软件一般存放在硬盘中, 用户可以方便地变更系统中的软件"],"a":"D","e":"嵌入式系统与具体应用紧密结合, 具有很强的专用性，GPS导航仪、数码相机等设备是嵌入式系统的典型应用，汽车、数控机床中的嵌入式系统要求具有很高的可靠性，嵌入式系统中的软件一般固化在只读存储器（ROM）中, 用户通常不能随意变更其中的程序功能。故此题选择D。","code":0},{"id":"928","paper":"真考试卷15","no":3,"type":"单项选择题","q":"下面关于嵌入式系统组成的叙述中,错误的是（  ）。","o":["嵌入式系统由硬件和软件两部分组成","嵌入式系统一般只能包含一个处理器，不采用多处理器组成系统","嵌入式系统中的存储器用于存储程序和数据","数据总线是嵌入式系统中各组件之间进行数据传输的一个传输通路"],"a":"B","e":"嵌入式系统由硬件和软件两部分组成。有些嵌入式系统会包含多个处理器，分为中央处理器和协处理器。嵌入式系统中的存储器用于存储程序和数据，数据总线是嵌入式系统中各组件之间进行数据传输的一个传输通路。故此题选择B。","code":0},{"id":"929","paper":"真考试卷15","no":4,"type":"单项选择题","q":"下面关于嵌入式处理芯片特点的叙述中，错误的是（  ）。","o":["嵌入式处理芯片一般支持实时处理","嵌入式处理芯片一般具有低功耗的特性","嵌入式处理芯片有多种产品类型，但不包括微处理器","嵌入式处理芯片一般集成了测试电路"],"a":"C","e":"嵌入式处理芯片一般支持实时处理，具有低功耗和可扩展性，集成了测试电路。嵌入式处理芯片有多种产品类型，包括微处理器、数字信号处理器、微控制器和片上系统。故此题选择C。","code":0},{"id":"930","paper":"真考试卷15","no":5,"type":"单项选择题","q":"下列各项中，不属于静态图像格式的是（  ）。","o":["BMP","APE","JPEG","GIF"],"a":"B","e":"静态图像格式主要有BMP、JPEG，GIF是一种用于存储简短动画或静态图像的图像格式，既可以是静态图片，也可以是动态图片；而APE是流行的数字音乐无损压缩格式之一。由此可知，本题答案为B选项。","code":0},{"id":"931","paper":"真考试卷15","no":6,"type":"单项选择题","q":"下列术语中，并非用于描述数字图像参数的是（  ）。","o":["位平面数目","图像分辨率","像素深度","量化位数"],"a":"D","e":"用来描述数字图像的参数主要有图像大小（图像分辨率）、位平面数目、像素深度和颜色模型。故此题选择D。","code":0},{"id":"932","paper":"真考试卷15","no":7,"type":"单项选择题","q":"下列关于数字媒体的描述中，不正确的是（  ）。","o":["WAV是未经压缩的数字音频，其音质与CD相当。","字符的形状用点阵法描述时，应在字型库中记录每一直线和曲线的端点及控制点的坐标。","UTF-8采用的是单字节可变长编码。","数字视频的数据量可压缩几十倍甚至几百倍。"],"a":"B","e":"字符的形状有两种描述方法，点阵法和轮廓法。前者描述字符在离散点阵中笔画的占位信息，后者描述字符的轮廓，即把字符的轮廓用一组直线和曲线来勾画，字型库中记录的是每一直线和曲线的端点及控制点的坐标。故此题选择B。","code":0},{"id":"933","paper":"真考试卷15","no":8,"type":"单项选择题","q":"下面关于通信的说法中，错误的是（  ）。","o":["模拟信号和数字信号是通信系统中所传输的两种形式的信号","模拟通信传输时不容易受干扰","数字通信传输的是数字信号，是现代最常用的通信形式","通信系统可分为有线通信和无线通信两大类"],"a":"B","e":"通信系统可分为有线通信和无线通信两大类，模拟信号和数字信号是通信系统中所传输的两种形式的信号。模拟信号在传输过程中容易受噪声信号的干扰，传输质量不够稳定。把模拟信号转换成数字信号再进行传输的通信传输技术称为数字通信。故此题选择B。","code":0},{"id":"934","paper":"真考试卷15","no":9,"type":"单项选择题","q":"属于ARM处理器特点的是（  ）。\n①单周期操作     ②只使用加载/存储指令访问内存  ③三地址指令格式 \n④指令流水线技术 ⑤低功耗设计                  ⑥ 采用RISC指令集结构","o":["① ② ④ ⑤","② ③ ④ ⑤","② ③ ④ ⑤ ⑥","① ② ③ ④ ⑤ ⑥"],"a":"D","e":"ARM处理器特点包括单周期操作、只使用加载/存储指令访问内存、三地址指令格式、指令流水线技术、低功耗设计、采用RISC指令集结构。故此题选择D。","code":1},{"id":"935","paper":"真考试卷15","no":10,"type":"单项选择题","q":"支持Thumb－2指令集子集的处理器为（  ）。","o":["ARM9","ARM Cortex-M3","ARM Cortex-A5","ARM Cortex-A57"],"a":"B","e":"支持Thumb－2指令集子集的处理器主要有Cortex-M系列和Cortex-R系列。其中Cortex-M系列微控制器主要面向控制领域，具有高性价比、最低成本、极低功耗、可移植性好的特点。故此题选择B。","code":0},{"id":"936","paper":"真考试卷15","no":11,"type":"单项选择题","q":"以下ARM处理器中，为降低成本，存储机制采用为冯.诺依曼结构的处理器是（  ）。","o":["ARM Cortex-M0","ARM Cortex-M3","ARM Cortex-M4","ARM Cortex-R4"],"a":"A","e":"嵌入式处理器的体系结构按存储机制可以分为冯·诺依曼结构和哈佛结构。选项中Cortex-M0采用了冯·诺依曼结构，其余都是哈佛结构。故此题选择A。","code":0},{"id":"937","paper":"真考试卷15","no":12,"type":"单项选择题","q":"ARM中的MMU为存储器管理部件，以下不属于MMU功能的是（  ）。","o":["虚拟地址到物理地址的转换","存储器访问权限控制","控制数据是大端模式还是小端模式的转换","对Flash、SRAM、SDRAM、ROM等不同类型的存储器进行统一管理"],"a":"C","e":"MMU（存储器管理单元）的功能包括虚拟地址到物理地址的转换和存储器访问权限控制。MMU能把系统中不同类型的存储器（如Flash、SRAM、SDRAM、ROM）进行统一管理。故此题选择C。","code":0},{"id":"938","paper":"真考试卷15","no":13,"type":"单项选择题","q":"某ARM处理器仅工作于Thumb-2状态，该处理器的指令宽度是（  ）。\n①8位     ②16位   ③32位    ④64位","o":["①","②","③ ④","② ③"],"a":"D","e":"Thumb-2内核技术兼有16位及32位指令长度。故此题选择D。","code":1},{"id":"939","paper":"真考试卷15","no":14,"type":"单项选择题","q":"ARM的堆栈操作使用的堆栈指针为SP，它对应的寄存器是（  ）。","o":["R12","R13","R14","R15"],"a":"B","e":"ARM处理器共有37个寄存器，包括31个通用寄存器（含PC）和6个状态寄存器，其中R13对应的是堆栈指针（SP）。故此题选择B。","code":0},{"id":"940","paper":"真考试卷15","no":15,"type":"单项选择题","q":"当有普通外部中断发生，系统将进入外部中断模式，相应寄存器的低5位变成10010B，该寄存器为（  ）。","o":["R13","R14","R15","CPSR"],"a":"D","e":"CPSR是当前程序状态寄存器。当发生异常时，处理器自动改变CPSR的值，进入相应的工作模式。故此题选择D。","code":0},{"id":"941","paper":"真考试卷15","no":16,"type":"单项选择题","q":"对于ARM处理器，以下属于数据处理类的指令助记符有（  ）。\n①ADC  ②ADD   ③AND    ④CMP ⑤EOR ⑥MLA ⑦MUL  ⑧TST ⑨SWI","o":["①  ②  ④  ⑤  ⑦  ⑧","①  ②  ③  ④  ⑤  ⑦  ⑧","①  ②  ③  ④  ⑤  ⑥  ⑦  ⑧","①  ②  ③  ④  ⑤  ⑥  ⑦  ⑨"],"a":"C","e":"选项中SWI是异常中断类指令，其余都是数据处理类的指令助记符。故此题选择C。","code":1},{"id":"942","paper":"真考试卷15","no":17,"type":"单项选择题","q":"ARM处理器可以访问外部设备的指令助记符是（  ）。\n①B ②BIC ③LDR ④MOV ⑤MSR ⑥SWP ⑦TEQ ⑧TST ⑨STR","o":["②③④⑤⑨","①③④⑦⑧","③④⑤⑨","③⑨"],"a":"D","e":"ARM处理器遵循加载/存储架构，其核心特点是只有加载（LDR）和存储（STR）指令可以直接访问存储器，包括外部设备映射的内存区域。其他指令如MOV、MSR、BIC、SWP、TEQ、TST等均只能在寄存器之间或寄存器与立即数之间操作，不能直接访问外部设备或存储器。由此可知，本题答案为D选项。","code":1},{"id":"943","paper":"真考试卷15","no":18,"type":"单项选择题","q":"将地址0x40007000装入寄存器R0，正确的ARM指令或伪指令是（  ）。","o":["LDR R0,＝0x40007000","LDR R0,#0x40007000","MOV R0,＃0x40007000","MOV R0,0x40007000"],"a":"A","e":"LDR伪指令用于一个32 位常数的加载或地址的加载，A选项是将地址装入寄存器，B选项是将内存地址0x40007000处的数据加载到R0寄存器中，C选项是将数值<VAR>0x40007000<\/VAR>直接加载到 <VAR>R0<\/VAR> 寄存器中，D选项写法错误故此题选择A。","code":0},{"id":"944","paper":"真考试卷15","no":19,"type":"单项选择题","q":"下面关于嵌入式系统中复位电路的叙述中，错误的是（  ）。","o":["复位电路是嵌入式最小硬件系统的一个组成部分","嵌入式处理器系统复位引脚为nRESET时，表示高电平复位","一般情况下，复位信号的时间宽度必须保持若干个处理器时钟周期才能使系统可靠复位","对于经典ARM处理器复位后，PC指针指向唯一的地址0x00000000"],"a":"B","e":"复位电路是嵌入式最小硬件系统的一个组成部分，嵌入式处理器系统复位引脚为nRESET时，表示低电平复位（不带n的表示高电平复位），一般情况下，复位信号的时间宽度必须保持若干个处理器时钟周期才能使系统可靠复位，对于经典ARM处理器复位后，PC指针指向唯一的地址0x00000000。故此题选择B。","code":0},{"id":"945","paper":"真考试卷15","no":20,"type":"单项选择题","q":"下图为典型嵌入式系统硬件组成原理图，图中①、②、③、④这四个部分分别为（  ）。","o":["相互互连通道、前向通道、后向通道、人机交互通道","前向通道、人机交互通道、相互互连通道、后向通道","后向通道、人机交互通道、相互互连通道、前向通道","人机交互通道、相互互连通道、后向通道、前向通道"],"a":"B","e":"典型嵌入式系统硬件由嵌入式最小硬件系统、前向通道、人机交互通道、相互互连通道、后向通道组成。故此题选择B。","code":0},{"id":"946","paper":"真考试卷15","no":21,"type":"单项选择题","q":"基于ARM内核的嵌入式芯片是以ARM内核为基础，通过AMBA总线将其他硬件组件连接在一起的，下面列出的4个组件中，哪一个组件是挂在AMBA的系统总线上的（  ）","o":["USB主机","SPI","GPIO","RTC"],"a":"A","e":"USB主机需要处理高速数据传输（如USB 2.0的480Mbps速率），对带宽和实时性要求高，因此直接挂接在AHB/AXI系统总线上，属于系统级高速组件，A选项符合题意。SPI是低速外设总线，用于连接Flash、传感器等设备，数据传输速率较低，通常挂接在APB外设总线上，B选项不符合题意。GPIO用于简单的引脚控制，属于低速、低带宽外设，挂接在APB外设总线上，C选项不符合题意。RTC 是低功耗的计时外设，对带宽要求极低，挂接在APB外设总线上，D选项不符合题意。综上所述，本题答案为A选项。","code":0},{"id":"947","paper":"真考试卷15","no":22,"type":"单项选择题","q":"下面关于ARM处理器片内存储器及控制器的叙述中，错误的是（  ）。","o":["ARM处理器片内数据存储器通常使用的是SRAM","ARM处理器片内程序存储器通常使用的是SDRAM","通过AMBA的“高带宽外部存储器控制接口”可以对外部扩展的存储器进行管理与控制","从结构上看“高带宽外部存储器控制接口”与AMBA的系统总线相连"],"a":"B","e":"ARM处理器片内数据存储器通常使用的是SRAM，片内程序存储器通常使用的是Flash ROM，从结构上看“高带宽外部存储器控制接口”与AMBA的系统总线相连，通过AMBA的“高带宽外部存储器控制接口”可以对外部扩展的存储器进行管理与控制。故此题选择B。","code":0},{"id":"948","paper":"真考试卷15","no":23,"type":"单项选择题","q":"嵌入式系统使用的存储器可以划分成不同的层次，下列叙述中，错误的是（  ）。","o":["CPU使用最频繁的少量的程序代码和数据存放在高速缓冲存储器(Cache)中","正在运行中程序的数据和代码存放在主存储器（内存）中","尚未启动运行的其余程序或数据存放在容量很大的外部存储器（外存）中","嵌入式系统中Cache存储器的存取速度与外存的存取速度相当"],"a":"D","e":"CPU使用最频繁的少量的程序代码和数据存放在高速缓冲存储器(Cache)中，为了提高处理速度；正在运行中程序的数据和代码存放在主存储器（内存）中，尚未启动运行的其余程序或数据存放在容量很大的外部存储器（外存）中。故此题选择D。","code":0},{"id":"949","paper":"真考试卷15","no":24,"type":"单项选择题","q":"在软件配合下，通过SPI总线可以构成多种简单或复杂的系统。下面是关于构成SPI系统的叙述，错误的是（  ）。","o":["SPI可以构成一主一从式系统","SPI可以构成互为主从式系统","SPI可以构成一主多从式系统","SPI不能构成多主多从式系统"],"a":"D","e":"串行外设（SPI）接口是一种同步串行外设接口，允许嵌入式处理器与各种外围设备以串行方式进行通信、数据交换。SPI可以构成一主一从式、一主多从式和互为主从式系统。而SPI并非绝对不能构成多主多从系统，但由于协议本身的局限性，实现难度大且实用性低，故此题选择D。","code":0},{"id":"950","paper":"真考试卷15","no":25,"type":"单项选择题","q":"下面是关于HDMI的叙述，其中错误的是（  ）。","o":["HDMI即高清晰度多媒体接口","HDMI是一种数字化音频/视频接口","HDMI最高数据传输速率为10.2Gbps","ARM处理芯片S3C2410内部集成了HDMI"],"a":"D","e":"HDMI即高清晰度多媒体接口，适合影像传输，是一种数字化音频/视频接口，最高数据传输速率为10.2Gbps，目前已有多个ARM芯片内置了HDMI控制器接口，而不需要ARM处理芯片S3C2410内部集成了HDMI。故此题选择D。","code":0},{"id":"951","paper":"真考试卷15","no":26,"type":"单项选择题","q":"下图为基于ARM处理器的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，错误的是（  ）。","o":["图中的GPF6～GPF1是ARM处理器的GPIO接口的一部分","图中的键盘接口采用的是非编码键盘的结构形式","图中若仅有KEY1键按下时，GPF6～GPF1引脚的逻辑值为000001","图中的VDD3.3表示该端点的电压为3.3V，当KEY1键按下时，流过该按键的电流可简单估算为0.33mA"],"a":"C","e":"图中的键盘接口采用的是非编码键盘的结构形式，GPF6～GPF1是ARM处理器的GPIO接口的一部分，VDD3.3表示该端点的电压为3.3V，当KEY1键按下时，流过该按键的电流可简单估算为0.33mA，GPF6～GPF1引脚的逻辑值为111110。故此题选择C。","code":0},{"id":"952","paper":"真考试卷15","no":27,"type":"单项选择题","q":"下面关于S3C2410的实时时钟（RTC）组件的叙述中，错误的是（  ）。","o":["RTC采用单独的供电引脚","RTC采用单独的时钟源","通过编程可以改变RTC内部的时钟分频器的分频系数","通过编程可以对RTC内部的年、月、日、星期、时、分、秒寄存器的值进行设置"],"a":"C","e":"实时时钟（RTC）组件采用单独的供电引脚和时钟源，通过编程可以对RTC内部的年、月、日、星期、时、分、秒寄存器的值进行设置，但分频系数由时钟源决定，无法通过编程改变。故此题选择C。","code":0},{"id":"953","paper":"真考试卷15","no":28,"type":"单项选择题","q":"下面关于RS-232/RS-485接口的叙述中，错误的是（  ）。","o":["采用嵌入式处理器自带的UART可以组成RS-232通信接口","采用嵌入式处理器自带的UART可以组成RS-485通信接口","RS-232接口的信号线采用单端输出方式，逻辑0的电压范围为+3V~+15V，逻辑1的电压范围为-15V~-3V","RS-485接口的信号线采用单端输出方式，逻辑0的电压范围为-15V~-3V，逻辑1的电压范围为+3V~+15V"],"a":"D","e":"采用嵌入式处理器自带的UART可以组成RS-232/RS-485通信接口，RS-232采用负逻辑传输，其接口的信号线采用单端输出方式，逻辑0的电压范围为+3V~+15V，逻辑1的电压范围为-15V~-3V，而RS-485标准采用差分信号传输方式。故此题选择D。","code":0},{"id":"954","paper":"真考试卷15","no":29,"type":"单项选择题","q":"下列关于嵌入式软件特点的描述中，不正确的是（  ）。","o":["软件与硬件一体化，软件固化存储。","软件代码时空效率要求高，实时性要求高。","软件可裁剪，尽可能去除冗余。","软件的生命周期较短。"],"a":"D","e":"嵌入式软件与硬件一体化，软件固化存储，对代码时空效率和实时性要求高，软件可裁剪，要尽可能去除冗余，大多数低端嵌入式系统不用操作系统，所以软件的生命周期相对较长。故此题选择D。","code":0},{"id":"955","paper":"真考试卷15","no":30,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，不正确的是（  ）。","o":["简单的轮询结构只适用于系统的任务数量较少、任务处理简单，且实时性要求不高的场景。","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构。","与简单的轮询结构相比，带中断的轮询结构由于中断的引入而使软件的复杂度明显降低。","带中断的轮询结构也称为中断驱动结构或前后台结构。"],"a":"C","e":"选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构。简单的轮询结构只适用于系统的任务数量较少、任务处理简单，且实时性要求不高的场景，带中断的轮询结构也称为中断驱动结构或前后台结构，但并没有因为中断的引入而使软件的复杂度明显降低。故此题选择C。","code":0},{"id":"956","paper":"真考试卷15","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，不正确的是（  ）。","o":["板级支持包的特点是与硬件和操作系统都关系紧密，既有硬件相关性，又有操作系统相关性。","硬件抽象层是在操作系统层与硬件之间设置的独立的接口软件层，是所有直接依赖于硬件的软件。","板级支持包中包含硬件相关的设备驱动程序。","板级支持包主要完成外设存在自检、初始化外围设备、内存管理、加载和启动操作系统等功能。"],"a":"D","e":"硬件抽象层是在操作系统层与硬件之间设置的独立的接口软件层，是所有直接依赖于硬件的软件。板级支持包中包含硬件相关的设备驱动程序，其特点是与硬件和操作系统都关系紧密，既有硬件相关性，又有操作系统相关性。BSP含有电路板的全套初始化程序，包括操作系统初始化。D选项中的内存管理不是板级支持包的功能，而是内核的功能，所以D选项叙述错误。故此题选择D。","code":0},{"id":"957","paper":"真考试卷15","no":32,"type":"单项选择题","q":"下列关于Bootloader的陈述中，不正确的是（  ）。","o":["不同的Bootloader程序功能虽有差别，但大多支持操作系统引导和加载功能。","Bootloader又称为bootROM。","嵌入式操作系统的引导加载可以采用启动加载（bootloading）模式或下载（downloading）模式。","Bootloader依赖于具体的硬件结构。"],"a":"B","e":"嵌入式系统加电后执行的第一批最初操作，称为引导或者自举（Boot），对应的程序称为引导程序或者引导加载程序（Bootload）。故此题选择B。","code":0},{"id":"958","paper":"真考试卷15","no":33,"type":"单项选择题","q":"一般而言，设备驱动程序的功能不包括（  ）。","o":["设备打开和关闭。","设备初始化。","设备文件管理。","设备读取和写入。"],"a":"C","e":"一般而言，设备驱动程序的功能包括设备打开和关闭、设备初始化、设备读取和写入，不包括设备文件管理。故此题选择C。","code":0},{"id":"959","paper":"真考试卷15","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，不正确的是（  ）。","o":["实时系统是必须在有限和确定的时间内对外部事件做出响应的信息系统。","实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性。","程控电话交换机检测到用户摘机后必须在1秒钟内送出拨号音，则送拨号音任务的绝对时限即为1秒钟。","实时性要求高的系统既要有足够强大的硬件平台支撑，也要有专门设计的实时软件并合理安排任务的优先级，才能满足实时处理的要求。"],"a":"C","e":"实时系统是必须在有限和确定的时间内对外部事件做出响应的信息系统，一旦任务执行时间超过截止时间系统的总损益就为负，这种实时系统称为硬实时系统，否则为软实时系统。对于硬实时系统，一旦超过时限将导致严重的负效益后果，如飞机控制器、核反应堆处理装置；而软实时系统中如果输出响应超过时限，一般不会造成严重后果；程控电话交换机送拨号音任务属于软实时系统。故此题选择C。","code":0},{"id":"960","paper":"真考试卷15","no":35,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，不正确的是（  ）。","o":["风河公司的VxWorks既按开发版本的授权数量收取授权费，也按最终产品售出的实际数量收取每份运行软件的版权费。","大多数嵌入式系统都是实时系统，而且多是强实时、多任务系统。","Windows CE和Android操作系统属于单内核结构。","μC/OS操作系统是完全免费的操作系统。"],"a":"D","e":"μC/OS是μC/OS-II的早起版本，属于源码公开的嵌入式操作系统，但并非是完全免费的操作系统。故此题选择D。","code":0},{"id":"961","paper":"真考试卷15","no":36,"type":"单项选择题","q":"下列各项中，不属于类Unix操作系统的是（  ）。","o":["Linux。","iOS。","FreeRTOS。","VxWorks。"],"a":"C","e":"FreeRTOS是一个迷你的实时操作系统内核。相对μC/OS-II、embOS等商业操作系统，FreeRTOS操作系统是完全免费的操作系统，具有源码公开、可移植、可裁减、调度策略灵活的特点，可以方便地移植到各种单片机上运行。故此题选择C。","code":0},{"id":"962","paper":"真考试卷15","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，不正确的是（  ）。","o":["μC/OS-II的绝大部分代码是用ANSI C语言编写的。","μC/OS-II的任务由三部分构成：程序代码、任务堆栈和任务控制块。","μC/OS-II是抢占式实时内核，在任意时刻都可能发生任务调度，在任务调度时总是运行等待态任务中优先级最高的任务。","休眠态是任务代码驻留在内存中、但还没有交给内核调度的状态。"],"a":"C","e":"μC/OS-II是抢占式实时内核，在任意时刻都可能发生任务调度，在任务调度时总是运行就绪态任务中优先级最高的任务。故此题选择C。","code":0},{"id":"963","paper":"真考试卷15","no":38,"type":"单项选择题","q":"关于μC/OS-II操作系统任务状态转移的说法中，正确的是（  ）。","o":["运行态任务调用函数OSSemPend()后将转入被中断态。","被中断态的任务不可能直接转入等待态。","运行态任务被抢占后将转入休眠态。","被中断态的任务将在中断返回后转入就绪态。"],"a":"B","e":"发生中断时CPU提供相应的中断服务，原来正在运行的任务暂时停止运行，进入了被中断态，被中断态的任务是不能直接转入等待态的要先结束被中断态进入运行态。故此题选择B。","code":0},{"id":"964","paper":"真考试卷15","no":39,"type":"单项选择题","q":"下面有关基于嵌入式WEB的应用系统说明中，不恰当的是（  ）。","o":["嵌入式WEB服务器通常是与目标系统的控制器融为一体的。","基于嵌入式WEB服务器开发的应用主要是提供一种远程操控设备的方式。","嵌入式WEB服务器支持远程客户通过浏览器与其进行交互。","嵌入式WEB服务器的应用需求与通用WEB服务器的应用需求是相同的。"],"a":"D","e":"嵌入式WEB服务器的应用需求与通用WEB服务器的应用需求是不同的，它不是以提供信息服务为主，而是提供一个基于远程客户端的操控方式，用户在远程客户机上通过浏览器与嵌入式Web服务器交互，从而操控被嵌入的设备。故此题选择D。","code":0},{"id":"965","paper":"真考试卷15","no":40,"type":"单项选择题","q":"下面有关开发工具套件ADS1.2的说法中，不正确的是（  ）。","o":["ADS1.2以一个工程项目来管理应用程序涉及的源文件、头文件及其他的输入文件。","ADS1.2的工程项目中必须把应用程序涉及的文件按逻辑关系分组。","ADS1.2的工程项目中必须包含一个生成目标。","ADS1.2工具可以完成应用程序的编辑、编译、连接工作。"],"a":"B","e":"在ADS1.2的集成开发环境中，设计者所设计的嵌入式应用程序的源文件、库文件、头文件以及其他的输入文件，均以一个工程项目的形式进行管理，并且在工程项目中，为了方便管理，这些文件还可以按照某种逻辑关系进行分组。由此可知，本题答案为B选项。","code":0},{"id":"987","paper":"真考试卷16","no":1,"type":"单项选择题","q":"下面关于嵌入式系统特点的叙述中,错误的是（  ）。","o":["嵌入式系统具有隐蔽性，例如，智能仪器中的计算机系统是嵌入在仪器内部的，从外部看，这个嵌入式系统呈现为一台仪器","嵌入式系统通常要求小型化、轻量化、低功耗及低成本, 其软硬件资源受到较为严格的限制","嵌入式系统广泛应用于过程控制、数据采集、通信传输等领域, 这些应用对系统的实时性没有要求","嵌入式系统大多面向控制应用, 系统的可靠性十分重要"],"a":"C","e":"嵌入式系统是嵌入式计算机系统的简称。嵌入式系统通常要求小型化、轻量化、低功耗及低成本, 大多面向控制应用, 具有隐蔽性、实时性和高可靠性，其软硬件资源受到较为严格的限制。并不是对实时性没要求，C选项错误，故本题答案为C选项。","code":0},{"id":"988","paper":"真考试卷16","no":2,"type":"单项选择题","q":"下面关于嵌入式系统应用的叙述中,错误的是（  ）。","o":["嵌入式系统广泛应用于冰箱、洗衣机、空调等“白色家电”中","嵌入式系统广泛应用于摄像机、DVD 播放器、MP3 播放器等数码产品中","嵌入式系统广泛应用于汽车、飞机、铁路机车、船舶等运输工具中","基于可靠性方面的考虑，坦克、舰艇、战机、无人机等军用电子装备中一般不使用嵌入式系统"],"a":"D","e":"嵌入式系统与具体应用紧密结合, 所涉及的应用领域非常广泛。航空航天、坦克、舰艇、战机、无人机等军用电子装备都是重要的应用。故此题选择D。","code":0},{"id":"989","paper":"真考试卷16","no":3,"type":"单项选择题","q":"嵌入式系统硬件的逻辑组成可用下图描述，图中①、②、③、④处分别是（  ）。","o":["存储器、输入接口、输出接口、测控对象","测控对象、存储器、输入接口、输出接口","输入接口、输出接口、测控对象、存储器","输出接口、存储器、测控对象、输入接口"],"a":"B","e":"嵌入式系统由硬件和软件两部分组成。硬件的主体是CPU和存储器，它们通过输入/输出接口和设备与外部相联。故此题选择B。","code":0},{"id":"990","paper":"真考试卷16","no":4,"type":"单项选择题","q":"下面是关于嵌入式系统中处理器的叙述，其中错误的是（  ）。","o":["嵌入式系统中负责运行系统软件和应用软件的处理器称为中央处理器","有些嵌入式系统包含多个处理器, 它们各有其不同的任务, 在同一个嵌入式系统中协同工作","目前嵌入式系统中CPU的字长与通用计算机中的CPU一样，以64位为主","嵌入式系统中CPU的性能是影响嵌入式系统性能的一个重要因素"],"a":"C","e":"嵌入式系统的性能在很大程度上是由CPU决定的。CPU的字长有4/8/16/32/64位之分，现在嵌入式系统中使用最多的还是8位和16位的，但32位CPU是技术发展的主流。故此题选择C。","code":0},{"id":"991","paper":"真考试卷16","no":5,"type":"单项选择题","q":"下列各项中，属于静态图像格式的是（  ）。","o":["PNG","APE","FLAC","AAC"],"a":"A","e":"PNG是静态图像格式，支持无损压缩、透明背景，广泛用于网页、设计等场景；APE 是一种无损音频压缩格式，用于存储高质量音乐文件，不是图像格式；FLAC是主流的无损音频格式，同样用于音频存储，不是图像格式；AAC是一种有损音频压缩格式，常作为 MP3 的替代格式使用，不是图像格式；综上所述，本题答案为A选项。","code":0},{"id":"992","paper":"真考试卷16","no":6,"type":"单项选择题","q":"一幅图像的数据量可按下面的公式进行计算（单位为字节）（  ）。","o":["图像水平分辨率×图像垂直分辨率×像素深度×8","图像水平分辨率×图像垂直分辨率×像素深度/采样率×8","图像水平分辨率×图像垂直分辨率×像素深度/8","图像水平分辨率×图像垂直分辨率×像素深度×量化位数/8"],"a":"C","e":"用来描述数字图像的参数主要有图像大小（图像分辨率）、位平面数目、像素深度和颜色模型。一幅图像的数据量计算公式为：图像水平分辨率×图像垂直分辨率×像素深度/8。故此题选择C。","code":0},{"id":"993","paper":"真考试卷16","no":7,"type":"单项选择题","q":"下列关于数字媒体的描述中，不正确的是（  ）。","o":["WAV是未经压缩的数字音频，其音质与CD相当。","JPEG是静止图像数据压缩编码的国际标准。","UTF-16采用双字节等长编码","数字视频的数据量可压缩几十倍甚至几百倍。"],"a":"C","e":"UTF-16采用的是双字节可变长编码。故此题选择C。","code":0},{"id":"994","paper":"真考试卷16","no":8,"type":"单项选择题","q":"计算机网络有多种不同类型，以下关于计算机网络类型的说法，正确的是（  ）。","o":["按使用的传输介质可分为公用网和专用网","按网络的使用性质可分为有线网和无线网","按网络的使用对象可分为企业网、政府网、金融网和校园网等","按网络所覆盖的地域或使用范围可分为2G网、3G网和4G网"],"a":"C","e":"计算机网络有多种不同类型，按使用的传输介质可分为有线网和无线网；按网络的使用性质可分为公用网和专用网；按网络的使用范围和使用对象可分为企业网、政府网、金融网和校园网等。故此题选择C。","code":0},{"id":"995","paper":"真考试卷16","no":9,"type":"单项选择题","q":"以下关于嵌入式处理器说法错误的是（  ）。","o":["所有ARM处理器均采用RISC指令集","所有ARM处理器均采用哈佛结构","不是所有ARM处理器都支持Thumb-2指令集","有的ARM处理器采用冯.诺依曼结构"],"a":"B","e":"嵌入式处理器的体系结构按存储机制分为冯诺依曼结构和哈佛结构，ARM处理器多数为哈佛结构，也有采用冯诺依曼结构的，如ARM7。故此题选择B","code":0},{"id":"996","paper":"真考试卷16","no":10,"type":"单项选择题","q":"ARM处理器采用指令流水线技术，并采用加载/存储指令访问内存，此外，ARM处理器还具有的特点是（  ）。\n①功能强     ② 功耗大       ③ RISC架构  ④ 单周期操作 \n⑤低功耗设计 ⑥ 指令长度固定 ⑦ 哈佛结构  ⑧成本高","o":["① ② ③ ④ ⑥ ⑦ ⑧","① ③ ④ ⑤ ⑥","① ④ ⑤ ⑥","③ ④ ⑤ ⑥"],"a":"B","e":"ARM处理器采用指令流水线技术，并采用加载/存储指令访问内存，此外，ARM处理器还具有功能强、RISC架构、单周期操作、低功耗设计、指令长度固定等特点。故此题选择B。","code":1},{"id":"998","paper":"真考试卷16","no":11,"type":"单项选择题","q":"以下按照ARM公司的分类，属于经典ARM处理器的是（  ）。\n①ARM7          ② ARM9          ③ ARM11          ④ ARM Cortex-M0 \n⑤ARM Cortex-M3 ⑥ ARM Cortex-R4 ⑦ ARM Cortex-A9  ⑧ARM Cortex-A57","o":["⑦ ⑧","① ② ③","④ ⑤ ⑥","① ② ③ ④ ⑤ ⑥ ⑦ ⑧"],"a":"B","e":"ARM公司把从ARM7到ARM11为内核的系列处理器称为经典ARM处理器。故此题选择B","code":1},{"id":"999","paper":"真考试卷16","no":12,"type":"单项选择题","q":"以下内部没有NVIC的ARM处理器是（  ）。","o":["ARM9","Cortex-M0","Cortex-M3","Cortex-M4"],"a":"A","e":"NVIC称之为内嵌向量中断控制器，支持嵌套和向量中断。内部没有NVIC的ARM处理器是ARM9，故此题选择A。","code":0},{"id":"1000","paper":"真考试卷16","no":13,"type":"单项选择题","q":"对于经典ARM处理器，在以下的异常中断中，优先级最低的是（  ）。","o":["复位","软件中断","外部中断IRQ","快速中断FIQ"],"a":"B","e":"经典ARM处理器将7种类型的异常分成6级，最高级别的是复位，最低的是未定义的指令UND和软件中断SWI。故此题选择B。","code":0},{"id":"1001","paper":"真考试卷16","no":14,"type":"单项选择题","q":"某ARM处理器内部某功能部件对存储器的保护功能，提供了简单代替MMU的方法来管理存储器，该部件是（  ）。","o":["存储器管理部件","存储器保护部件","中断控制器","喊醒中断控制器"],"a":"B","e":"存储器管理单元（MMU）是许多高性能处理器所必需的重要部件之一，而存储器保护单元（MPU）是对存储器进行保护的可选组件，提供了简单替代MMU的方法来管理存储器。故此题选择B。","code":0},{"id":"1002","paper":"真考试卷16","no":15,"type":"单项选择题","q":"在ARM指令的条件码中，用于带符号数比较的助记符后缀是（  ）。\n①CS ② CC ③ HI  ④ LS ⑤GE ⑥ LT ⑦ GT  ⑧LE","o":["① ② ③ ④","⑤ ⑥ ⑦ ⑧","① ② ④ ⑦ ⑧","① ② ③ ④ ⑤ ⑥ ⑦ ⑧"],"a":"B","e":"在ARM指令的条件码中，用于带符号数比较的助记符后缀是GE、LT、GT、LE。故此题选择B","code":1},{"id":"1003","paper":"真考试卷16","no":16,"type":"单项选择题","q":"已知某ARM处理器内部看门狗定时器(WDT)控制寄存器地址为0x40040000，将这个地址装入R0后，要写WDT的值（在R1中）来使能看门狗定时器，以下正确的指令是（  ）。","o":["LDR R1,[R0]","MOV [R0],R1","STR R1,[R0]","STR R0,[R1]"],"a":"C","e":"LDR R1,[R0]是从R0所指向的内存地址中读取数据，并存入R1，这与题目要求的“写入”操作相反，A选项不符合题意；MOV [R0],R1中MOV 指令用于在寄存器之间传输数据，不支持直接对内存地址进行操作，且 ARM 语法中 MOV 的操作数必须是寄存器，不能是 [R0] 这样的内存寻址形式，B选项不符合题意；STR R1,[R0]是将寄存器R1中的数据写入到R0所指向的内存地址中，这完全符合题目将 R1（WDT的值）写入 R0（WDT控制寄存器地址）所代表的内存位置，C选项符合题意；STR R0,[R1]是将R0中的数据写入到R1所指向的内存地址中，题目明确指出地址在R0中，数据在R1中，此选项将源寄存器和目的寄存器弄反了，D选项不符合题意。综上所述，本题答案为C选项。","code":0},{"id":"1004","paper":"真考试卷16","no":17,"type":"单项选择题","q":"可以将指定位的值清零且不影响其它位的ARM指令助记符有（  ）。\n①AND ② BIC ③ ADD  ④ STR ⑤MOV ⑥ CMP ⑦ SUB  ⑧ MUL","o":["① ②","① ② ⑤","① ② ③ ④ ⑥","① ② ④ ⑦ ⑧"],"a":"A","e":"AND是逻辑与指令，BIC是位清零指令，可以将指定位的值清零且不影响其它位的ARM指令助记符只有这两个。故此题选择A。","code":1},{"id":"1005","paper":"真考试卷16","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，通过伪指令DataA DCD 0xAABBCCDD在内存中定义了1个32位操作数，已知R1=0x11223344,则依次执行\n LDR R0,=DataA\n STR R1,[R0]\n以下说明错误的是（  ）。","o":["DataA值保持不变","R1中的值保持不变","内存的值发生了变化","DataA的值为0x11223344"],"a":"A","e":"所谓小端模式，是指数据的高位保存在内存的高地址中，而数据的低位保存在内存的低地址中；指令LDR是存储器到寄存器的数据传送指令，STR是寄存器到存储器的数据传送指令。经过运算，DataA的值为0x11223344，R1值不变。故A选项叙述错误。","code":1},{"id":"1006","paper":"真考试卷16","no":19,"type":"单项选择题","q":"下面关于嵌入式系统中时钟电路的叙述中，错误的是（  ）。","o":["时钟电路是嵌入式最小硬件系统的一个组成部分","大多数嵌入式处理器内置了时钟信号发生器","嵌入式处理器不能使用外部时钟信号源","时钟电路为嵌入式处理器提供时钟信号使其按照时钟信号的节拍正常工作"],"a":"C","e":"时钟电路为嵌入式处理器提供时钟信号使其按照时钟信号的节拍正常工作，是嵌入式最小硬件系统的一个组成部分，大多数嵌入式处理器内置了时钟信号发生器，也可以使用外部时钟信号源。故此题选择C。","code":0},{"id":"1007","paper":"真考试卷16","no":20,"type":"单项选择题","q":"下面关于嵌入式系统中调试测试接口的叙述中，错误的是（  ）。","o":["ARM内部集成了调试测试接口","JTAG是一种嵌入式测试技术","具有JTAG接口的芯片不能通过JTAG接口串联在一起，然后通过JTAG分别对器件进行调试","SWD是Cortex-M内核提供的一种调试测试接口"],"a":"C","e":"JTAG是一种嵌入式片上调试技术，用于芯片和电路板的测试。JTAG标准允许多个芯片（电路）的边界扫描寄存器BSR通过JTAG接口串联在一起，实现对多个器件的测试。故此题选择C。","code":0},{"id":"1008","paper":"真考试卷16","no":21,"type":"单项选择题","q":"下面是关于AMBA的叙述：\nⅠ. AMBA由系统总线和外围总线两部分组成，系统总线和外围总线通过桥接器连接\nⅡ.不同版本的AMBA的主要区别在于系统总线性能的变化，而外围总线的发展主要体现在总线所支持的外围硬件组件的增加\nⅢ. ARM处理器的高带宽高性能外围接口通常连接到AMBA的系统总线\nⅣ. ARM处理器的速度不高的外部接口如UART通常连接到AMBA的外围总线\n其中，正确的是（  ）。","o":["Ⅰ","Ⅰ和Ⅱ","Ⅰ、Ⅱ和Ⅲ","Ⅰ、Ⅱ、Ⅲ和Ⅳ"],"a":"D","e":"基于AMBA总线的处理器使用系统总线和外围总线构成来连接高速系统组件和低速外围组件，速度不高的外部接口连接外围总线（APB），包括定时器、并行接口和串行接口等；而LCD控制器和中断控制器等都连接在系统总线上。不同版本的AMBA的主要区别在于系统总线性能的变化，而外围总线的发展主要体现在总线所支持的外围硬件组件的增加。故此题选择D。","code":1},{"id":"1009","paper":"真考试卷16","no":22,"type":"单项选择题","q":"下面是关于ARM处理器芯片中DMA控制器的叙述，其中错误的是（  ）。","o":["DMA控制器是直接存储器访问控制器的简称","ARM处理器处于低功耗状态时，不能通过 DMA方式进行数据传输","在采用DMA方式传输数据的过程中不需要CPU参与，因此可显著降低处理器的负荷","ARM处理器芯片中许多与外部打交道的通道（如USB接口等），它们既可由ARM内核控制其数据传输，也可通过DMA控制器控制其数据传输"],"a":"B","e":"DMA控制器是直接存储器访问控制器的简称。ARM处理器芯片中许多与外部打交道的通道（如USB接口等），它们既可由ARM内核控制其数据传输，也可通过DMA控制器控制其数据传输，在采用DMA方式传输数据的过程中不需要CPU参与，因此可显著降低处理器的负荷。故此题选择B。","code":0},{"id":"1010","paper":"真考试卷16","no":23,"type":"单项选择题","q":"下面关于嵌入式系统中使用的存储器的叙述中，错误的是（  ）。","o":["SRAM是一种半导体存储器","Flash Memory是一种半导体存储器","FRAM（Ferroelectric Random Access Memory）是一种新型的半导体存储器","MRAM（Magnetic Random Access Memory）是一种新型存储器，不属于半导体存储器"],"a":"C","e":"FRAM（Ferroelectric Random Access Memory）是铁电随机存取存储器，是一种新型存储器，不属于半导体存储器。故此题选择C。","code":0},{"id":"1011","paper":"真考试卷16","no":24,"type":"单项选择题","q":"下面关于嵌入式系统中使用存储器主要性能指标——容量的叙述，其中错误的是（  ）。","o":["存储器容量是指每一个存储芯片或模块能够存储的二进制位数","对于内存容量而言，1GB＝1024MB","对于外存容量（如磁盘、U盘以及Flash存储卡等）而言，1TB＝1000000MB","一个SRAM芯片容量为4096×8，说明它有8条数据线，4096个单元，地址线的条数为15"],"a":"D","e":"：存储器容量是指每一个存储芯片或模块能够存储的二进制位数，对于内存容量而言1GB＝1024MB，对于外存容量（如磁盘、U盘以及Flash存储卡等）而言1GB=1000MB。一个SRAM芯片容量为4096×8，说明它有8条数据线，地址线的条数为12。故此题选择D。","code":0},{"id":"1012","paper":"真考试卷16","no":25,"type":"单项选择题","q":"下面关于UART的叙述中，错误的是（  ）。","o":["UART可以实现全双工异步串行通信","有的嵌入式处理芯片内部集成了多个UART","UART传送信息时，起始位的逻辑值可以通过编程确定为1或者0","通过编程可以改变UART传送信息时的波特率"],"a":"C","e":"UART，即串行异步通信接口，使用UART进行通信时要求通信双方波特率和传输格式必须一致。UART传送信息时，起始位以逻辑0为标志，停止位以逻辑1为标志；UART的波特率由除数寄存器决定，也取决于外部时钟，可以是PCLK，还可以是UEXTCLK，由相应控制寄存器决定。故此题选择C。","code":0},{"id":"1013","paper":"真考试卷16","no":26,"type":"单项选择题","q":"下面是关于嵌入式处理器S3C2410的相关叙述，其中错误的是（  ）。","o":["S3C2410是一个16位嵌入式处理器","S3C2410片内具有分离的指令Cache和数据Cache","S3C2410片内具有驱动SD存储卡和MMC存储卡的接口","S3C2410片内的存储控制器提供访问外部存储器所需的控制信号，可以访问1GB的地址空间"],"a":"A","e":"S3C2410属于中高档32位嵌入式处理器，其存储器控制组件中包括存储器控制器、外部主控器、NAND Flash控制器等，其中存储器控制器提供访问片外存储器芯片所需的控制信号，支持大/小端模式，地址空间共1GB；S3C2410片内具
