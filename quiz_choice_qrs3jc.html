code":0},{"id":"1676","paper":"真考试卷27","no":14,"type":"单项选择题","q":"以下指令助记符能把指定的数据位清零的指令有：\n    ①ADC  ②AND   ③BIC      ④CMP    ⑤LDR  ⑥ORR  ⑦MVN  ⑧TST","o":["②  ③","②  ③  ⑤","②  ③  ⑤  ⑦","②  ③  ⑤  ⑦  ⑧"],"a":"A","e":"①为带进位加法，与题意不符；④为比较，且比较结果不存回寄存器，因此不会清零数据位；⑤是从存储器取数据到寄存器的指令，不会清零指定的数据位；⑥是逻辑或指令，可以把指定的数据位置1，但做不到清零；⑦是数据取反指令，与题意不符；⑧是位测试指令，结果不存回寄存器，因此不会清零数据位。②是逻辑与指令，通过和特定数值按位取与，可以将特定数据位清零；③是位清零指令，可以直接清零指定的数据位。本题答案为A选项。","code":1},{"id":"1677","paper":"真考试卷27","no":15,"type":"单项选择题","q":"若读取4个字节数据，内存地址由R1+4指示，读出的数据存放在R0中，读取完毕，地址自动更新，正确的指令为：","o":["LDR R0，[R1,#4]","LDR R0，[R1,#4]!","LDR R0，[R1],#4","LDR R0，[R1],#4!"],"a":"B","e":"自动更新，表示最后有叹号，内存地址由R1+4指示，表示要将R1和4写在一个括号内，整体作为一个地址，综合起来即[R1,#4]！。本题答案为B选项。","code":0},{"id":"1678","paper":"真考试卷27","no":16,"type":"单项选择题","q":"对于BAL Lable指令，以下说法正确的是：","o":["如果无符号数据比较的结果大于，则转移到Lable执行指令","如果有符号数据比较的结果大于，则转移到Lable执行指令","忽略所有标志或条件，无条件转移到Lable执行指令","如果有符号数据比较的结果大于等于，则转移到Lable执行指令"],"a":"C","e":"B为跳转指令，条件码AL为无条件执行，因此BAL Lable是无条件跳转到Lable执行指令。本题答案为C选项。","code":0},{"id":"1679","paper":"真考试卷27","no":17,"type":"单项选择题","q":"把R5中的值乘以8，存放到R6中，以下指令正确的是： \n①ADD R6，R5，R1 \n②MOV R6，R5，LSL#3\n③MOV R6，R5，LSL#8\n④MOV R6，R5，LSR#3\n⑤MOV R6，R5，LSR#8\n⑥MUL R6，R5，#8","o":["①","⑥","①②","②⑥"],"a":"D","e":"乘法可以直接由乘法指令来实现，即⑥中MUL R6，R5，#8；除此之外，由于8是2的3次方，并且对于二进制来说，左移1位相当于乘2（不太理解的话，可以对比十进制，左移1位相当于乘10），因此乘8也可以通过将二进制位左移3次来实现，即②中MOV R6，R5，LSL#3。本题答案为D选项。","code":1},{"id":"1680","paper":"真考试卷27","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下,已知R0=0x4D3C2B1A，R1=0x11223344,R2=0, 则依次执行：\ntemp     EQU     0xA1B2C3D4\n    LDR R2,=temp\n    STR R0,[R2]\n    LDRB R1,[R2,#3]!\n指令序列执行后，以下说明正确的是：","o":["R0中的值已经改变了","R1中的值为0x0000004D","内存中的值保持不变","R2中的值保持不变"],"a":"B","e":"分析指令：第1行给temp赋值为0xA1B2C3D4；第2行将temp的值放到R2中；第3行将R0的值保存到以R2为地址的内存空间中；第4行将R2+3作为地址，读取1字节的数据保存到R1中，且更新R2的值。A选项R0的值只是保存到了以R2为地址的内存空间中，其本身并没有改变；B选项以R2为地址的内存空间中，保存的是R0的值，即0x4D3C2B1A，那么将R2+3作为地址，且仅读取1字节的数据保存到R1中，且根据题意的小端模式，可知是将最高1字节的0x4D保存到R1中，由于R1是32位寄存器，因此R1中的值为0x0000004D；C选项由于在3中把R0的值保存到了以R2位地址的内存空间中，因此内存中的值被改变；D选项在第4条指令执行结束后，R2的值被更新为R2+3，即0xA1B2C3D4+3，R2应为0xA1B2C3D7。本题答案为B选项。","code":1},{"id":"1681","paper":"真考试卷27","no":19,"type":"单项选择题","q":"下面是关于嵌入式处理器芯片能够正常工作的叙述，其中错误的是：","o":["必须给芯片供电","必须加上时钟信号","必须加上复位信号","不管芯片内部是否具有程序存储器，都必须扩展程序存储器"],"a":"D","e":"本题考察最小硬件系统，包括调试测试接口、电源电路、时钟电路、复位电路、嵌入式处理器、存储器。其中存储器可以是片内存储器，也可以使扩展程序存储器，但如果芯片内部已经有了程序存储器，已经构成了完整的最小硬件系统，那么扩展程序存储器就不是必须的部件。本题答案为D选项。","code":0},{"id":"1682","paper":"真考试卷27","no":20,"type":"单项选择题","q":"下面是关于嵌入式系统复位的叙述，其中错误的是：","o":["可以采用专用的处理器复位芯片为嵌入式处理器提供可靠的复位信号","施加在嵌入式处理器复位引脚的复位信号应有足够的宽度","经典ARM处理器复位后其PC指针指向唯一的地址0x00000000","为使嵌入式处理器可靠复位，在其复位引脚nRESET或RESET施加的复位信号的逻辑电平是相同的"],"a":"D","e":"nRESET表示低电平复位，RESET表示高电平复位。本题答案为D选项。","code":0},{"id":"1683","paper":"真考试卷27","no":21,"type":"单项选择题","q":"下面关于典型嵌入式系统硬件组成的叙述中，错误的是：","o":["典型嵌入式系统的前向通道一般由模拟输出接口和数字输出接口组成","以太网接口属于相互互联通道","CAN接口属于相互互联通道","触摸屏输入接口属于人机交互通道"],"a":"A","e":"前向通道一般由模拟量输入接口和数字量输入接口组成，后向通道一般由模拟量输出接口和数字量输出接口组成。本题答案为A选项。","code":0},{"id":"1684","paper":"真考试卷27","no":22,"type":"单项选择题","q":"下面列出了一些组件：\n①存储器及控制器 ②中断控制器 ③DMA控制器 \n④GPIO端口  ⑤电源管理与时钟控制器  \n其中，包含在基于ARM内核的嵌入式芯片中的组件有：","o":["仅①②③","仅①②③④","①②③④⑤","仅①④⑤"],"a":"C","e":"概念题，加强记忆即可，ARM内核的嵌入式芯片中的组件，除了上述5种以外还有定时计数组件（如WDT，RTC）、模拟通道组件（如ADC、DAC）、互联通信组件（如UART、IIS、IIC、USB）。本题答案为C选项。","code":1},{"id":"1685","paper":"真考试卷27","no":23,"type":"单项选择题","q":"下面是关于嵌入式系统使用的存储器的叙述，其中错误的是：","o":["嵌入式系统使用的存储器按照其所处物理位置可分为片内存储器和片外存储器以及外部存储设备","嵌入式系统使用的存储器按照其存储信息的不同可分为程序存储器和数据存储器","CPU使用最频繁的少量的程序代码和数据存放在高速缓冲存储器中","高速缓冲存储器的存取速度与主存储器的存取速度相当"],"a":"D","e":"高速缓冲存储器Cache存取速度极快，是主存储器存取速度的数十倍。本题答案为D选项。","code":0},{"id":"1686","paper":"真考试卷27","no":24,"type":"单项选择题","q":"下面关于Flash存储器的叙述中，错误的是：","o":["Flash存储器具有擦除和编程速度快的特点","NOR Flash和NAND Flash是目前市场上两种主要的闪存技术","NOR Flash ROM以字节为单位随机存取","NAND Flash ROM既可以以字节为单位随机存取，也可以以页（行）为单位随机存取"],"a":"D","e":"NAND Flash ROM只能以页（行）为单位随机存取。本题答案为D选项。","code":0},{"id":"1687","paper":"真考试卷27","no":25,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是：","o":["USB有USB 1.0、USB 2.0、USB 3.0等多个版本","不同版本的USB均可以实现全双工通信","USB通信时采用主从方式","USB接口中的数据信号采用差分方式传送"],"a":"B","e":"USB3.0及其以后的版本，才开始支持全双工通信，之前的版本是半双工通信。本题答案为B选项。","code":0},{"id":"1688","paper":"真考试卷27","no":26,"type":"单项选择题","q":"下面是关于嵌入式系统中UART的叙述，其中错误的是：","o":["UART是一种常用的串行通信接口，有的ARM芯片中集成了多个UART","UART可实现全双工串行通信","采用UART进行通信时，如果通信线路处于空闲状态，其逻辑电平为“0”","UART由发送器、接收器、控制单元、波特率发生器等组成"],"a":"C","e":"由于采用UART通信时，需要先发出一个逻辑0的信号，表示传输数据的起始位，所以在线路处于空闲状态时，需要用逻辑电平1来和数据起始位的0加以区分，因此线路空闲时，其逻辑电平应为1。本题答案为C选项。","code":0},{"id":"1689","paper":"真考试卷27","no":27,"type":"单项选择题","q":"S3C2410通过ADS7843与触摸屏的接口原理如下图所示。下面关于该图的叙述中，错误的是：","o":["图中的触摸屏是电阻式触摸屏","ADS7843通过SPI与S3C2410接口","当S3C2410的GPG12为逻辑1时，ADS7843与S3C2410间可以交换信息","当在触摸屏上有触摸动作时，ADS7843的相关引脚会输出一个中断请求信号"],"a":"C","e":"A选项，ADS7843是一种专用的电阻式触摸屏转换芯片，由此推断出图中触摸屏为电阻式触摸屏；B选项，由S3C2410芯片中使用了MOSI和MIOS引脚可以推断出采用的是主从式的接口，即SPI接口；C选项，CS为片选信号输入端，低电平有效，因此如果要让两芯片间交换信息，需要从GPG12输出一个低电平，即逻辑0给CS；D选项，当有触摸动作时，ADS7843的PENIRQ端会输出一个中断信号给S3C2410芯片的GPF5端，引发外部中断EINT5。本题答案为C选项。","code":0},{"id":"1690","paper":"真考试卷27","no":28,"type":"单项选择题","q":"下面是关于S3C2410内部的PWM Timer的叙述，其中错误的是：","o":["S3C2410内部有5个16位定时器Timer，有4个具备PWM输出功能","S3C2410内部每个计数器都有自己的16位减法计数器，它由定时器时钟驱动","当定时器计数值达到0时，定时器能发出中断请求","对于PWM输出，通过定时器比较寄存器TCMPBn即可决定PWM的周期及占空比"],"a":"D","e":"寄存器TCNPBn决定PWM的周期，而TCMPBn决定PWM的占空比。本题答案为D选项。","code":0},{"id":"1691","paper":"真考试卷27","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，错误的是：","o":["选择嵌入式系统软件结构的一个基本原则是：尽可能选择可以满足成本要求的高性能通用嵌入式操作系统结构","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销","在典型的高端嵌入式系统中，通常可将系统软件层细分为硬件抽象层、操作系统层和中间件层","中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件"],"a":"A","e":"选择嵌入式系统硬件可以从成本和性能的角度去考虑，但选择嵌入式系统软件结构要从响应时间的角度考虑，即选择可以满足响应时间需求的最简单的结构。本题答案为A选项。","code":0},{"id":"1692","paper":"真考试卷27","no":30,"type":"单项选择题","q":"下列关于BSP的描述中，正确的是：","o":["BSP又称为BootROM","BSP的基本特性是只能被高层软件调用而无法自行运行","系统上电复位之后由BSP设置中断向量表","系统上电复位之后由BSP对系统中的所有硬件进行初始化"],"a":"C","e":"中断向量表应由操作系统设置，由BSP设置中断向量表，而BSP在系统复位之后主要负责系统软硬件环境的初始化，包括提供驱动程序支持，以及引导加载操作系统。本题答案为C选项。","code":0},{"id":"1693","paper":"真考试卷27","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的陈述中，错误的是：","o":["在同一硬件平台上支持不同嵌入式操作系统的BSP的组织结构、向上层提供的功能以及服务接口定义都不相同","板级支持包为软件系统提供多任务的运行环境，创建应用程序的运行实例","BSP中包含硬件相关的设备驱动程序","开发全新BSP通常以操作系统厂商提供的BSP模板为依据"],"a":"B","e":"多任务的运行环境，以及创建应用程序的运行实例，应由操作系统完成，板级支持包BSP负责引导加载操作系统。本题答案为B选项。","code":0},{"id":"1694","paper":"真考试卷27","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["有些bootloader软件能支持多种体系结构的处理器，但每种体系结构有其自身的版本","在RAM中运行操作系统代码的启动加载模式，不需要在系统启动之前将嵌入式操作系统的映象和应用程序映象烧录到ROM中","下载模式是嵌入式系统正常工作时的独立启动方式，bootloader从非易失存储介质中引导和运行操作系统代码","bootloader的代码通常都用汇编语言实现，以便实现操作系统加载的功能"],"a":"A","e":"B选项中，RAM中的数据断电后会消失，因此在RAM中运行操作系统代码，需要预先将操作系统即应用程序的映像（也就是一份拷贝）烧录到ROM中，每次启动操作系统，将ROM中的数据拷贝到RAM中运行；C选项中，启动加载模式是嵌入式系统正常工作时的独立启动方式，而下载模式通常是嵌入式系统不能正常工作时的启动模式，需要bootloader通过通信端口从服务器上下载操作系统映像，暂存到RAM中，最后烧录到ROM中；D选项，bootloader程序通常采用两阶段执行过程，第一阶段考虑到接近硬件，且注重效率，通常用汇编语言实现，第二阶段注重开发效率和功能性，通常用C语言实现。本题答案为A选项。","code":0},{"id":"1695","paper":"真考试卷27","no":33,"type":"单项选择题","q":"下列关于驱动程序的陈述中，错误的是：","o":["驱动程序只能被高层软件调用而无法自行运行","VxWorks嵌入式操作系统的I/O系统通过7个基本的I/O操作函数访问硬件设备：create()、open()、read()、write()、close()、remove()和ioctl()","在VxWorks嵌入式操作系统中，用户代码必须使用操作系统定义的统一的设备驱动程序框架，绝不允许绕过操作系统直接访问硬件","软件对硬件设备的访问通过设备接口内的寄存器实现"],"a":"C","e":"C选项，在VxWorks操作系统下，用户访问硬件的方式有两种，一是直接访问硬件，二是通过标准驱动程序接口访问硬件。本题答案为C选项。","code":0},{"id":"1696","paper":"真考试卷27","no":34,"type":"单项选择题","q":"下列名词中，属于嵌入式底层软件的是：","o":["RTEMS","PowerPC","U-Boot","RTAI"],"a":"C","e":"A选项意思为实时多处理系统，属于系统软件；B选项是处理器的一种体系结构，应归到硬件范畴，不算做软件的一种；C选项是操作系统的引导加载程序，属于底层软件；D选项是Linux发行版的一种，属于系统软件。本题答案为C选项。","code":0},{"id":"1697","paper":"真考试卷27","no":35,"type":"单项选择题","q":"下列关于实时与嵌入式操作系统的陈述中，错误的是：","o":["硬实时操作系统一般与人的交互性要求相对较弱，但可靠性和实时性要求高","MontaVista Linux是在原始免费型操作系统软件的基础上进行包装和优化的商业嵌入式Linux","VxWorks、RETMS和QNX都属于硬实时操作系统","实时系统应保证负荷均匀，不允许出现有时负载重、有时负载轻的情况"],"a":"D","e":"D选项中，实时系统应当保证有足够快的相应速度，并且保证有足够的能力可以在规定的时间内处理所有的请求，而负载的均衡并不是实时系统必须保证的。本题答案为D选项。","code":0},{"id":"1698","paper":"真考试卷27","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，错误的是：","o":["VxWorks操作系统采用微内核结构，内核仅提供多任务环境、任务间通信和同步功能","单体结构的操作系统最大的缺点是高度集成，组件之间相互关联，结构不清晰","μC/OS系列嵌入式操作系统不是免费软件","RTEMS是专门为硬件资源极为有限的无线传感器网络应用而量身定制的开源嵌入式操作系统"],"a":"D","e":"D选项中，RTEMS是一个开源的实时多处理系统。本题答案为D选项。","code":0},{"id":"1699","paper":"真考试卷27","no":37,"type":"单项选择题","q":"下列关于Linux操作系统实时化技术的陈述中，错误的是：","o":["嵌入式Linux发行版产品在通用Linux内核基础上进行了嵌入式改造，主要侧重的是小型化和实时性增强","超微内核方式是在实时内核和非实时内核之外增加了一个功能进一步缩减的超微内核，专门负责处理中断","内核补丁方式在通用Linux内核上打上实时扩展补丁，实时任务和普通的应用使用不同的API","双内核方式的优点是微内核可以提供硬实时支持，其缺点是微内核与标准Linux内核共存，实时任务需要按照微内核提供的另外一套API进行设计"],"a":"C","e":"C选项，实时任务和普通应用采用同样的编程方式并使用同样的API，只是实时任务需要明确指定自己的优先级与调度策略。本题答案为C选项。","code":0},{"id":"1700","paper":"真考试卷27","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的说法中，错误的是：","o":["μC/OS-II的技术亮点之一，是在进行任务调度时利用两个数组巧妙地提高位图式就绪表的检索速度，以便尽快确认最高优先级的就绪任务","函数OSQAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用","函数OSSemDel()用于删除一个信号量。删除信号量之前，必须首先删除操作该信号量的所有任务","主函数main()实现的功能主要包括：硬件初始化、初始化μC/OS-II内核、创建任务、创建任务间通信或同步的内核对象、自我删除函数调用等"],"a":"D","e":"D选项中，自我删除函数的调用，应在main函数创建的用户任务完成之后，由用户任务自身调用删除函数，进行自我删除。本题答案为D选项。","code":0},{"id":"1701","paper":"真考试卷27","no":39,"type":"单项选择题","q":"下面有关嵌入式系统开发工具的描述语句中，正确的是：","o":["嵌入式系统的产品种类是多种多样的，但开发工具只能选用ADS1.2。","嵌入式系统的开发平台通常包含：编辑器、编译连接器，但不包括调试器。","嵌入式系统开发平台包含多种工具，因此不可以使用统一的用户界面以提供给开发者使用。","嵌入式系统中的资源有限，因此很难在它上面直接进行软件的编程，以及编译、连接。"],"a":"D","e":"A选项，开发工具除了ADS1.2以外，还可以选择GNU、RVDS等；B选项，嵌入式系统的开发平台通常包含大量的开发工具，如函数库，项目管理器，编辑器，编译连接器，调试工具等等；C选项，开发平台中的软件开发工具，往往都使用统一的用户界面并作为一个整体提供给开发人员使用，这些工具都无缝连接，相互间可自由交换数据，可以大大提高开发工作的效率，这种开发环境叫做集成开发环境IDE。本题答案为D选项。","code":0},{"id":"1702","paper":"真考试卷27","no":40,"type":"单项选择题","q":"若某个嵌入式系统设计了支持以太网通信的接口电路，选用AX88796作为以太网控制器芯片，其片选信号CS引脚连到S3C2410芯片的nGCS4上。那么，读写AX88796芯片内部寄存器的首地址是：","o":["0x30000000","0x20000000","0x10000000","0x00000000"],"a":"B","e":"由于S3C2410的地址空间为1GB，且分为8个块，每个块128MB即2的27次方字节，每个块首地址的访问，分别由nGCSX控制，X随着块号（0~7）依次递增。因此每个块内存空间的首地址为：\nnGCS0=0x00000000\n从0到0x07FFFFFF为第一块128MB内存空间\nnGCS1=0x08000000\n从0x08000000到0x0FFFFFFF为第二块128MB内存空间\nnGCS2=0x10000000\n从0x10000000到0x17FFFFFF为第三块128MB内存空间\nnGCS3=0x18000000\n从0x18000000到0x1FFFFFFF为第四块128MB内存空间\nnGCS4=0x20000000\n从0x20000000到0x27FFFFFF为第五块128MB内存空间\n以此类推。本题答案为B选项。","code":0},{"id":"1724","paper":"真考试卷28","no":1,"type":"单项选择题","q":"下面是关于嵌入式系统应用的叙述，其中，错误的是：","o":["鉴于军事领域的特殊性，嵌入式系统一般不会应用在军事领域的应用产品中","嵌入式系统广泛应用于冰箱、洗衣机、空调、微波炉、电饭煲等“白色家电”中","嵌入式系统广泛应用于电视机、机顶盒、数码相机、智能玩具等数码产品中","嵌入式系统广泛应用于传真机、打印机、扫描仪等办公设备中"],"a":"A","e":"嵌入式系统不止应用在日常消费行业，军用类产品如火炮、导弹、智能炸弹的制导引爆等武器控制装置，坦克、潜艇、战机、无人机等军用电子装备，雷达、电子对抗、导航系统等军事通信装备，都使用了嵌入式系统进行控制。","code":0},{"id":"1725","paper":"真考试卷28","no":2,"type":"单项选择题","q":"嵌入式系统的输入/输出设备种类繁多，下面设备中，属于人机交互的设备是：","o":["系统中的传感器","系统中的液晶显示器","系统中的继电器","系统中的微电机"],"a":"B","e":"传感器可以将其他类型信号转换为电信号（如光电传感器可以将光信号转换为电信号），并不涉及到人机交互；继电器是一种以小电流控制大电流的开关，并不涉及到人机交互；微电机用于实现电信号的检测、解析、放大、转换等操作，并不涉及到人机交互；液晶显示器可以通过屏幕输出计算机的画面，人可以通过屏幕显示的信息，与计算机进行交互。","code":0},{"id":"1726","paper":"真考试卷28","no":3,"type":"单项选择题","q":"下面列出了四种产品类型：\nⅠ.微处理器  Ⅱ.微控制器（单片机）  Ⅲ.数字信号处理器（DSP）  Ⅳ.片上系统（SoC）\n其中，能够用作“嵌入式处理芯片”的产品类型有：","o":["仅Ⅰ","仅Ⅱ和Ⅲ","仅Ⅰ、Ⅱ和Ⅲ","Ⅰ、Ⅱ、Ⅲ和Ⅳ"],"a":"D","e":"微处理器是一种可编程的多用途器件，可以使用在PC之类的通用计算机之中，但更多的是应用于嵌入式系统；微控制器，也叫单片机，集成了大部分的计算机硬件，在各种嵌入式应用中主要作为控制单元使用；数字信号处理器是一种专用于数字信号处理的微处理器，多应用于以声音、图像信号处理作为主要任务的嵌入式系统中；片上系统将计算机或其他电子系统集成在单个芯片中，是一种更加强大的嵌入式处理芯片。","code":1},{"id":"1727","paper":"真考试卷28","no":4,"type":"单项选择题","q":"下面为嵌入式系统中常用的数字信号处理器（DSP）的叙述，其中错误的是：","o":["相对而言，DSP能更好地满足嵌入式系统对高速数字信号处理的需求","DSP 常采用冯●诺依曼结构","通过增加SIMD等指令，使DSP能够特别适用于实现FFT等数字信号处理算法","手机、数码相机等以声音和图像信号处理为主要任务的嵌入式应用系统中，一般包含DSP"],"a":"B","e":"DSP芯片硬件结构有冯·诺依曼结构和哈佛结构，两者区别是地址空间和数据空间分开与否，但一般的DSP都是采用改进型的哈佛结构，将数据空间和地址空间分开。","code":0},{"id":"1728","paper":"真考试卷28","no":5,"type":"单项选择题","q":"下列字符集编码中，固定采用双字节编码的是：","o":["GB2312","ASCII码","UTF-16","UTF-8"],"a":"A","e":"ASCII码是单字节编码；UTF-16是2-4字节的变长多字节编码；UTF-8是一种可变长度的字符编码；只有GB2312是固定采用双字节编码。","code":0},{"id":"1729","paper":"真考试卷28","no":6,"type":"单项选择题","q":"下列各文件格式中，不支持丰富格式文本的是","o":["doc","txt","pdf","html"],"a":"B","e":"doc格式是属于微软公司的文件格式，可以容纳多种文字格式；pdf格式是属于Adobe公司的文件格式，可以将文字、字型、格式、颜色等信息封装在一个文件中；html格式是使用HTML命令组成的描述性文本，可以用来说明文字、图形、动画、声音、表格、链接等；txt格式是一种纯文本格式，没有任何文本的修饰，如下划线、粗体、斜体等特殊的功能，因此不支持丰富格式文本。","code":0},{"id":"1730","paper":"真考试卷28","no":7,"type":"单项选择题","q":"下列关于数字图像的描述中，错误的是：","o":["图像获取过程的核心是模拟信号的数字化过程","GIF是一种有损压缩图像文件格式","PNG是一种无损压缩的图像文件格式","一幅图像的数据量可按下面的公式进行计算（字节）：图像数据量＝图像水平分辨率×图像垂直分辨率×像素深度/8"],"a":"B","e":"GIF是一种无损压缩图像文件格式，它可以将多张图像保存在同一个文件中，按预先规定的时间间隔逐一进行显示，多用于网页制作。","code":0},{"id":"1731","paper":"真考试卷28","no":8,"type":"单项选择题","q":"关于分组交换的数据包格式，严格按照顺序以下说法正确的是：","o":["由源计算机地址、目的计算机地址、编号、校验信息以及传输的数据块组成","由目的计算机地址、源计算机地址、编号、校验信息以及传输的数据块组成","由编号、源计算机地址、目的计算机地址、校验信息以及传输的数据块组成","由编号、目的计算机地址、源计算机地址、校验信息以及传输的数据块组成"],"a":"A","e":"分组交换采用的是存储-转发技术，将数据包划分成有固定格式的分组进行交换、传输，每个分组按一定格式附加源计算机地址、目的计算机地址、分组编号、起止标志、校验信息以及传输的数据块。","code":0},{"id":"1732","paper":"真考试卷28","no":9,"type":"单项选择题","q":"如果程序存储空间非常有限，性能都满足条件的前题下，应该选择的指令集是：","o":["ARM指令集","Thumb指令集","Thumb-2指令集","ARM+Thumb指令集"],"a":"B","e":"Thumb 全部是16 字长的指令，可以看作是 ARM 指令的压缩形式 它是为减少代码量而设计的，因为较短的指令整体上可以有更高的代码密度，所以程序存储空间非常有限，性能都满足条件的前题下，应该选择的指令集是Thumb。","code":0},{"id":"1733","paper":"真考试卷28","no":10,"type":"单项选择题","q":"以下内部有指令Cache和数据Cache以及MMU的处理器是：","o":["ARM920T","ARM Cortex-M0","ARM Cortex-M3","ARM Cortex-R3"],"a":"A","e":"ARM920T是一款成熟的处理器，含有指令Cache和数据Cahce各16KB；ARM Cortex-M0与ARM Cortex-M3属于低成本处理器，而Cache的造价较高，因此不会出现在Cortex-M系列的处理器中；同理ARM Cortex-R3依旧属于低成本的实时处理器，直到ARM Cortex-R4才开始配置Cache。","code":0},{"id":"1734","paper":"真考试卷28","no":11,"type":"单项选择题","q":"ARM处理器用于存放断点地址的链接寄存器是：","o":["R12","R13","R14","R15"],"a":"C","e":"R12寄存器与快速中断有关；R13寄存器是堆栈指针寄存器；R14是程序链接寄存器；R15是程序计数寄存器；当程序执行遇到断点时产生中断，在跳转到中断处理程序之前，需要先将断点地址存放在R14程序链接寄存器中，以便在处理完中断后回到断点处。","code":0},{"id":"1735","paper":"真考试卷28","no":12,"type":"单项选择题","q":"ARM处理器程序状态寄存器格式如下所示， \n\n下面指令序列关闭外部中断，正确的是：","o":["MRS R0,CPSR\nORR R0,R0,#0x80\nMSR CPSR,R0","MRS R0,CPSR\nBIC R0,R0,#0x80\nMSR CPSR,R0","MRS R0,CPSR\nAND R0,R0,#0x80\nMSR CPSR,R0","MRS R0,CPSR\nORR R0,R0,#7\nMSR CPSR,R0"],"a":"A","e":"由于关闭外部中断需要将中断禁止控制位I赋值成1，其余位保持不变，因此要将CPSR的值与二进制数值1000 0000进行或操作，借用R0寄存器来操作其值，故代码为：\nMRS R0,CPSR  取出CPSR的值到R0寄存器\nORR R0,R0,#0x80  与1000 0000的十六进制0x80进行或操作\nMSR CPSR,R0  将R0的值存回CPSR","code":1},{"id":"1736","paper":"真考试卷28","no":13,"type":"单项选择题","q":"关于MPU和MMU以下说法正确的是：","o":["MPU是存储器管理部件，允许控制8对域","MMU是存储器保护部件，负责存储器地址转换","MMU是通过查找页表进行虚拟地址到物理地址的转换","MPU可替代MMU进行地址转换"],"a":"C","e":"MPU是内存保护单元，P是Protect的首字母，意思是保护；MMU是内存管理单元，M是Management的首字母，意思是管理；虚拟地址到物理地址的转换由MMU实现，不能用MPU替代。","code":0},{"id":"1737","paper":"真考试卷28","no":14,"type":"单项选择题","q":"ARM处理器内部某些功能部件如下，与中断直接相关的部件有： \n ①CP15②C13③MMU④NVIC⑤WIC⑥Cache⑦TPIU⑧FPB","o":["②  ③","②  ③  ⑤","④  ⑤","⑤  ⑦  ⑧"],"a":"C","e":"NVIC是内嵌向量中断控制器，提供中断控制器，用于总体管理异常，与中断相关；WIC是唤醒中断控制器，与中断相关。","code":1},{"id":"1738","paper":"真考试卷28","no":15,"type":"单项选择题","q":"对于经典ARM的异常，以下说法错误的是：","o":["发生复位异常后，PC＝0xFFFFFFF0","片上外设如UART等中断是通过快速中断或普通中断引入的","软中断SWI异常优先级最低","发生异常时，断点地址自动存放在R14中"],"a":"A","e":"复位异常发生后，系统会回到0x00000000开始重新执行程序，因此PC=0x00000000而非0xFFFFFFF0。","code":0},{"id":"1739","paper":"真考试卷28","no":16,"type":"单项选择题","q":"对于ARM处理器，以下说法正确的是：","o":["在Thumb状态下，每执行100条指令，PC值自动加100","在Thumb-2状态下，每执行100条指令，PC值自动加200","在ARM状态下，每执行100条指令，PC值自动加400","当处理异常时，将自动进入调试状态"],"a":"C","e":"Thumb状态下，每条指令是16位，占用2字节存储空间，因此执行100条指令后，PC值增加200；Thumb2状态下，每条指令是16位或32位，占用2字节或4字节存储空间，因此执行100条指令后，PC值增加200至400之间；当处理器进行异常处理时，自动进入ARM状态。","code":0},{"id":"1740","paper":"真考试卷28","no":17,"type":"单项选择题","q":"如果要读取内存地址为0x08000604开始的32位数据到R7中，则以下指令序列正确的是：","o":["LDR R1,=0x08000600\nSTR R7,[R1],#4","LDR R7,=0x08000600\nSTR R1,[R0],#4","LDR R1,=0x08000600\nLDR R7,[R1,#4]","LDR R0,=0x08000600\nLDR R7,[R0],#4"],"a":"C","e":"从内存读取32位数据，用LDR指令，由4个选项可知先将0x08000600读到寄存器中，因此依题意读取0x08000604开始的数据，需要在读取时将0x08000600加4，因此写法为：\nLDR R1,=0x08000600\nLDR R7,[R1,#4]","code":0},{"id":"1741","paper":"真考试卷28","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，已知R1=0x44332211，R2=0x12345678,R0=0,则以下指令：\nAddress1 EQU   0x04005000    \n    LDR R0,=Address1\n    STR  R2,[R0]\n    LDRB R1,[R0,#2]\n指令序列执行后，以下说明正确的是：","o":["R2中的值改变了","R0中的值保持不变","内存中的值保持不变","R1中的值变为0x00000034"],"a":"D","e":"R2的值保存在了以R0的值为地址的内存中，因此R2的值没有变；R0的值由原来的0变成了Address1所表示的值，即0x04005000；R2的值保存在了以R0的值为地址的内存中，所以内存中的值被改变；\nLDRB指令，可以从内存读取1字节数据，数据首地址为R0+2，而以R0为地址的内存单元，保存的是R2中的4字节数据，因此读到R1中的应当是从低到高第3字节数据，即0x34，补齐高位为0x00000034。","code":1},{"id":"1742","paper":"真考试卷28","no":19,"type":"单项选择题","q":"下面是关于嵌入式系统中电源电路的叙述，其中错误的是：","o":["电源电路应具有足够的输出功率","嵌入式系统中电源电路的输入如果为交流电，则一般采用DC-DC模块将交流电转换为直流电","78xx系列是一种DC-DC模块","低压差稳压器常简写为LDO"],"a":"B","e":"DC-DC模块是直流-直流转换器，将交流电转换为直流电的模块应当是AC-DC，78XX 系列属于普通稳压器。注：本题B选项、C选项都是错误的，考试遇到原题，选B选项才有分。","code":0},{"id":"1743","paper":"真考试卷28","no":20,"type":"单项选择题","q":"下面是关于嵌入式处理器时钟电路的叙述，其中错误的是：","o":["大多数嵌入式处理器内置了时钟信号发生器","可以使用外部时钟信号源为嵌入式处理器提供其工作时所需的时钟信号","嵌入式处理器的功耗与嵌入式系统时钟电路的工作频率无关","嵌入式处理器的运行速度与嵌入式系统时钟电路的工作频率有关"],"a":"C","e":"当嵌入式处理器的其他参数不变时（如核心数、架构等），嵌入式处理器的时钟电路的工作频率越高，嵌入式处理器的功耗越大。","code":0},{"id":"1744","paper":"真考试卷28","no":21,"type":"单项选择题","q":"下面是关于典型嵌入式系统硬件组成的叙述，其中正确的是：","o":["典型嵌入式系统的后向通道一般包括模拟量输入接口和开关量/数字量输入接口","典型嵌入式系统的前向通道一般由模拟输出接口和数字输出接口组成","以太网通信接口属于相互互联通道","USB属于人机交互通道"],"a":"C","e":"后向通道由输出接口组成，前向通道由输入接口组成，接口包括模拟量接口和数字量接口，因此典型嵌入式系统的后向通道一般包括模拟量输出接口和开关量/数字量输出接口，典型嵌入式系统的前向通道一般包括模拟量输入接口和开关量/数字量输入接口；USB是通用串行总线的英文缩写，是一个总线标准，可以连接各种各样的设备，并不能说它属于人机交互通道。","code":0},{"id":"1745","paper":"真考试卷28","no":22,"type":"单项选择题","q":"下面是关于ARM的AMBA总线的叙述，其中错误的是：","o":["ARM处理器芯片的通用定时器与APB连接","ARM处理器芯片的看门狗定时器与APB连接","ARM处理器芯片的RTC与APB连接","ARM处理器芯片的测试接口与APB连接"],"a":"D","e":"与APB相连接的应当是低性能的外围设备以及系统周边组件，如通用定时器、看门狗定时器、RTC等，而测试接口应当与JTAG测试接口连接。","code":0},{"id":"1746","paper":"真考试卷28","no":23,"type":"单项选择题","q":"从应用系统需求出发，在选择系统的嵌入式处理芯片时应考虑的一个因素是片内外围电路。下面选项中，与片内外围电路相关的选项是：","o":["芯片内部存储器的容量","系统的时钟频率","ARM内核","ADC"],"a":"D","e":"芯片内部存储器的容量、系统的时钟频率、ARM内核都属于芯片内部硬件的参数，而ADC则需要连接到芯片的外围总线上，因此属于外围电路。","code":0},{"id":"1747","paper":"真考试卷28","no":24,"type":"单项选择题","q":"下面是关于嵌入式系统中使用的存储器的叙述，其中错误的是：","o":["SRAM是一种随机存取存储器","DRAM是一种随机存取存储器","Flash存储器具有在线擦除和编程功能","FRAM是一种只读存储器"],"a":"D","e":"FRAM是铁电存储器，既有只读存储器非易失性的特点，又有随机存储器可快速随机读写的特点，因此FRAM可读可写，不是只读存储器。","code":0},{"id":"1748","paper":"真考试卷28","no":25,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线操作时序的叙述中，错误的是：","o":["I<SUP>2<\/SUP>C总线是多主总线","I<SUP>2<\/SUP>C总线包含SDA、SCL和ACK三条信号线","I<SUP>2<\/SUP>C总线传输操作启动后主控制器件传输的第一个字节是地址，该字节的前7位用来指示与哪一个从器件进行通信","通过I<SUP>2<\/SUP>C总线传输数据时，不对每次传输的字节数目进行限制"],"a":"B","e":"I2C总线是集成电路互联总线，只包含SDA数据线、SCL时钟线，两条信号线。","code":0},{"id":"1749","paper":"真考试卷28","no":26,"type":"单项选择题","q":"下面是一些常用的通信标准或通信接口，通信时采用同步串行通信方式的是：","o":["SPI","CAN","UART","USB 2.0"],"a":"A","e":"SPI采用同步串行通信方式；CAN总线采用串行异步通信方式；UART总线采用串行异步通信方式；USB2.0总线采用串行异步通信方式。故本题正确答案为A选项。","code":0},{"id":"1750","paper":"真考试卷28","no":27,"type":"单项选择题","q":"利用霍尔元件作为非接触式按键的原理如下图所示。\n\n假设图中的ARM芯片为S3C2410，读取是否有按键按下时采用中断方式、普通IRQ模式。下面列出了一些选项：\n①使GPF2为外部中断EINT2\n②使EINT2为IRQ中断\n③使EINT2为中断允许\n④设置中断向量，使引发按键中断EINT2时能自动进入中断服务程序\n⑤使能内核提供的中断\n为完成初始化工作，应包括的选项是：","o":["①②④⑤","①②③④⑤","②③④⑤","①②③⑤"],"a":"B","e":"根据题意进行初始化，先将GPF2引脚设置为外部中断，再设置中断向量，当中断时可以进入中断服务程序，并设置内核中断使能，因此初始化工作应当包含12345全部。","code":1},{"id":"1751","paper":"真考试卷28","no":28,"type":"单项选择题","q":"S3C2410内部有5个16位定时器Timer，有4个具备PWM输出。下面是关于S3C2410内部的PWM特殊功能寄存器的叙述，其中的正确的是：","o":["TCFG0只能用于配置定时器0的预分频系数并决定死区长度","TCFG1只能用于配置定时器1的预分频系数并决定死区长度","TCON主要用于控制定时器0~4的工作","对于PWM输出，通过定时器计数缓冲寄存器TCNTBn即可决定PWM的周期及占空比"],"a":"C","e":"TCFG0和TCFG1都可以配置定时器1-4的预分频系数，平切TCFG1不能决定死区长度；TCNTBn可决定PWM的周期或频率，而TCMPBn决定PWM的占空比。","code":0},{"id":"1752","paper":"真考试卷28","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，错误的是：","o":["简单循环轮询结构程序结构简单，因而适用于实时性要求高的场景","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销","中间件是具有标准程序接口和协议的通用服务"],"a":"A","e":"实时性要求高的场景，通常要选配嵌入式操作系统，这样才能保证程序执行的实时性、可靠性、可维护性。本题答案为A选项.","code":0},{"id":"1753","paper":"真考试卷28","no":30,"type":"单项选择题","q":"下列关于bootloader的描述中，错误的是：","o":["不同的bootloader程序功能不同，但都需要支持核心的引导（boot）和加载（load）操作系统等基本功能","除了嵌入式处理器本身的初始化，bootloader还需完成板级的片外设备初始化","在RAM中运行操作系统代码比在ROM中直接运行操作系统代码取指令的速度更高","bootloader又称为BootROM"],"a":"D","e":"bootloader引导加载程序，用于系统的上电自检、硬件初始化、建立存储空间映射、配置系统参数、建立上层软件的运行环境、加载和启动操作系统；bootROM是用于存储bootloader程序、操作系统映像、应用程序代码和用户配置数据等信息的非易失性存储器。本题答案为D选项.","code":0},{"id":"1754","paper":"真考试卷28","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，错误的是：","o":["BSP中包含硬件相关的设备驱动程序","BSP加载操作系统后，操作系统为软件系统提供多任务的运行环境，创建应用程序的运行实例","BSP在系统上电复位之前负责系统初始软硬件环境的建立，一般应包含硬件的初始化、数据的输入/输出操作、硬件设备的配置操作等功能。","为了降低BSP调试的复杂度，通常采用渐进的方式进行，将BSP的调试分为最小系统的调试和外围设备驱动程序的调试两步"],"a":"C","e":"BSP在系统复位之后负责系统软硬件环境的初始化，包括系统复位时的硬件初始化、为操作系统提供硬件相关的驱动程序支持、引导加载操作系统。本题答案为C选项.","code":0},{"id":"1755","paper":"真考试卷28","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["Bootloader只能被高层软件调用而无法自行运行","在大多数嵌入式系统中，bootROM仅存储bootloader程序，不存储操作系统映像、应用程序代码和用户配置数据等信息","无论采用何种操作系统的引导加载方式，最终都必须在ROM中直接运行操作系统代码","完整的驱动程序通常包含硬件初始化、硬件使能、硬件工作模式和参数设置等功能"],"a":"D","e":"bootloader是嵌入式系统上电复位后首先运行的，并没有被高层软件调用；bootROM除了存储bootloader程序还存储操作系统映像、应用程序代码和用户配置数据等信息；除了在ROM中直接运行操作系统代码外，还可以在RAM中运行操作系统代码、从外存储器加载操作系统代码运行、从通信端口加载操作系统代码运行。本题答案为D选项.","code":0},{"id":"1756","paper":"真考试卷28","no":33,"type":"单项选择题","q":"下列嵌入式操作系统中，只包括操作系统内核，不包括设备驱动程序的是：","o":["Linux","μC/OS-II","VxWork","WinCE"],"a":"B","e":"小型嵌入式操作系统往往只包含内核，而不包含驱动程序，如μC/OS-II；大型嵌入式操作系统除了包含内核外，还包含驱动程序，如Linux、VxWork、WinCE等。本题答案为B选项.","code":0},{"id":"1757","paper":"真考试卷28","no":34,"type":"单项选择题","q":"下列名词中，属于嵌入式底层软件的是：","o":["Nios II","MontaVista","U-Boot","RTAI"],"a":"C","e":"Nios II、MontaVista、RTAI都属于嵌入式操作系统，而U-Boot是嵌入式操作系统的引导加载程序，用于引导加载操作系统，在嵌入式操作系统软件的更底层部分，因此U-Boot属于嵌入式底层软件。本题答案为C选项.","code":0},{"id":"1758","paper":"真考试卷28","no":35,"type":"单项选择题","q":"下列关于实时与嵌入式操作系统的陈述中，错误的是：","o":["因为Windows速度不够快、效率不够高，所以Windows并不是实时操作系统","在实时操作系统中，重负载甚至超负荷的情况下，某些关键任务一定要得到服务","实时操作系统必须允许高优先级任务一旦准备好运行，马上抢占低优先级任务的执行","实时系统的负荷并不一定是均匀的，有时负载重，有时负载轻"],"a":"A","e":"Windows不是实时操作系统，并不是因为他的速度不够快、效率不够高，而是因为Windows对事件的响应不能提供确定性，在CPU没有其他任务时，系统可以在很短的时间内对外部事件做出响应，但当某些后台任务正在运行时，有时候响应会变得非常慢，甚至出现假死。本题答案为A选项.","code":0},{"id":"1759","paper":"真考试卷28","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的体系结构的陈述中，错误的是：","o":["Windows CE和安卓操作系统都属于宏内核结构","分层结构的操作系统的所有功能按层次组织，只在相邻层之间发生交互","单体结构和分层结构的操作系统内核称为宏内核","微内核结构的优点是性能强，通信和上下文切换的开销低"],"a":"D","e":"微内核结构仅保留了操作系统的必要功能，其余的功能放在内核之外，由用户态运行的服务来完成，虽然内核小，但是进程间通信却要频繁的进行上下文切换，与单内核相比，开销较大，效率较低。本题答案为D选项.","code":0},{"id":"1760","paper":"真考试卷28","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务的陈述中，错误的是：","o":["只要有其他任务就绪，空闲任务的处理器时间就会被抢占","当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转入等待态","在利用mutex解决优先级反转问题时，内核可以将低优先级任务的优先级暂时提升到略高于高优先级任务的某个空闲优先级，并调度低优先级任务运行。空闲优先级应比使用该mutex的所有任务的优先级都高。","释放mutex的函数为OSMutexPost()"],"a":"B","e":"当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转入被中断态。本题答案为B选项.","code":0},{"id":"1761","paper":"真考试卷28","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，错误的是：","o":["函数OSMboxAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用","多个任务可以同时等待同一事件的发生，当该事件发生后，所有等待该事件的任务中优先级最高的任务将获得该信号并转入就绪状态","函数OSMboxPost()通过邮箱向任务发送一条消息，如果邮箱中已经保留着没有被接收的消息，函数立即返回","函数OSTaskResume ()实现退出临界状态的操作"],"a":"D","e":"OSTaskResume()函数用于恢复被OSTaskSuspend()函数挂起的任务。本题答案为D选项.","code":0},{"id":"1762","paper":"真考试卷28","no":39,"type":"单项选择题","q":"下面有关GNU的描述语句中，正确的是：","o":["GNU开发工具套件中，只包含了GCC工具。","GCC是一种针对Linux操作系统环境下应用程序开发的图形化文本编辑工具。","GCC能将C语言、VB语言、汇编语言编写的源程序生成执行文件。","用GCC把源文件仅仅编译成目标文件，那么，应用程序中可以不要main函数。"],"a":"D","e":"GNU开发工具套件中，除了GCC外，还包括文本编辑器、语法除错等工具；GCC是一款编译工具，并不具备编辑功能，更不具备图形化功能；GCC能将C语言、C++语言、汇编语言编写的源程序以及库文件编译连接成可执行文件。本题答案为D选项.","code":0},{"id":"1763","paper":"真考试卷28","no":40,"type":"单项选择题","q":"下面的说法中，错误的是：","o":["在嵌入式系统开发过程的需求分析与规格说明阶段，应对用户的功能性需求和非功能性需求进行分析。","嵌入式系统开发过程的系统设计阶段，其任务是确定系统的硬件和软件结构，即进行软件、硬件功能划分。","嵌入式系统开发过程的构件设计阶段，其任务是进行硬件电路设计。","嵌入式系统开发过程的系统集成及测试阶段，要反复地进行测试，其目的就是尽量发现错误。"],"a":"C","e":"嵌入式系统开发过程的构件设计阶段，需要设计者设计或选择符合系统结构和规格说明中所需要的具体构件，包括硬件模块和软件模块。本题答案为C选项.","code":0},{"id":"1785","paper":"真考试卷29","no":1,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中，错误的是（  ）。","o":["嵌入式系统与具体应用紧密结合, 具有很强的专用性","嵌入式系统通常要求小型化、轻量化、低功耗及低成本，因此其软硬件资源受到较为严格的限制","嵌入式系统大多面向控制应用，因此系统的可靠性十分重要","设计嵌入式系统时，一般不需考虑实时性方面的要求"],"a":"D","e":"设计嵌入式系统时，一般都需要考虑系统的实时性，嵌入式系统都具有一定的实时性，即必须在一个可预测和保证的时间内对外部事件作出正确的反应；本题答案为D选项。","code":0},{"id":"1786","paper":"真考试卷29","no":2,"type":"单项选择题","q":"下面列出的I/O接口中，不属于串行总线式接口的是（  ）。","o":["IEEE 1394","AMBA","USB 2.0/USB 3.0","以太网接口"],"a":"B","e":"AMBA总线主要有三种总线，AHB、APB总线仅支持串行通信，属于串行接口，而AXI总线的读写数据通道独立，支持并行通信，属于并行接口。本题答案为B选项。","code":0},{"id":"1787","paper":"真考试卷29","no":3,"type":"单项选择题","q":"下面是关于SoC设计相关的叙述，其中错误的是（  ）。","o":["SoC设计时的正确流程是：总体设计→综合与仿真→逻辑设计→芯片制造","IP核的复用可以减少SoC研发成本，缩短研发时间，是实现SoC快速设计，尽早投放市场的有效途径","按照IC设计文件的类型，IP核通常分为软核、固核和硬核三种","SoC芯片中包含的CPU，它们绝大多数都是以IP核的方式集成在SoC芯片中， 很少自行单独设计开发"],"a":"A","e":"SoC设计时的正确流程为：总体设计→逻辑设计→综合与仿真→芯片制造。本题答案为A选项。","code":0},{"id":"1788","paper":"真考试卷29","no":4,"type":"单项选择题","q":"下面关于微控制器（单片机）的叙述中，错误的是（  ）。","o":["除CPU外，微控制器芯片内还集成了程序存储器、RAM、总线、定时/计数器等多种必要的功能部件和外设接口","与微处理器不同，微控制器只需要很少的外接电路就可以独立工作","微控制器常可简写为MCU","目前微控制器内核的位数最多为16位，没有32位的微控制器"],"a":"D","e":"微控制器按其使用的处理器内核位数经历了1位、4位、8位、16位及32位的发展阶段。其中32位的MCU产品中，具有代表性的产品有ARM7、ARM9、ARM11和ARM Cortex-M系列。本题答案为选D选项。","code":0},{"id":"1789","paper":"真考试卷29","no":5,"type":"单项选择题","q":"下列字符集编码中，后者与前者保持向下兼容的是（  ）。","o":["ASCII码与UTF-16","ASCII码与GB2312","GB2312与GB18030","UTF-8与UTF-16"],"a":"C","e":"GB18030是一种变长多字节字符集，对字符集GB2312完全向后兼容，即字符集GB18030包含字符集GB2312的所有字符，且编码相同。本题答案为C选项。","code":0},{"id":"1790","paper":"真考试卷29","no":6,"type":"单项选择题","q":"下列各缩写中，都属于数字音频文件格式的是（  ）。","o":["RLE、M4A、AC3","FLAC、WMA、AAC","WAV、MPEG-2、APE","MP3、PNG、BMP"],"a":"B","e":"RLE是一种压缩过的位图文件格式，不属于音频文件格式，因此A选项错误；MPEG-2是基于数字存储媒体运动图像和语言的压缩标准，属于视频文件格式，因此C选项错误；PNG是一种无损压缩的图像文件格式，不属于音频文件格式，因此D选项错误；本题答案为B选项。","code":0},{"id":"1791","paper":"真考试卷29","no":7,"type":"单项选择题","q":"下列关于数字图像和声音的描述中，正确的是（  ）。","o":["WAV是一种无损压缩的数字音频编码格式","如果3个颜色分量中的像素位数分别为6位、6位和4位，则该图像的像素深度为16","测量每个取样点的每个分量的亮度值的过程称为量化","电话通信语音的取样频率范围通常在40kHz以上"],"a":"B","e":"WAV是一种未压缩的数字音频编码格式，因此A选项错误；测量每个取样点的每个分量的亮度值的过程称为取样，因此C选项错误；电话通信语音的采样频率范围通常为8kHz；因此D选项错误；本题答案为B选项。","code":0},{"id":"1792","paper":"真考试卷29","no":8,"type":"单项选择题","q":"关于局域网中传输的数据帧格式，按照传输先后顺序叙述正确的是（  ）。","o":["接收设备MAC地址、发送设备MAC地址、控制信息、有效载荷以及校验信息","发送设备MAC地址、接收设备MAC地址、控制信息、有效载荷以及校验信息","控制信息、发送设备MAC地址、接收设备MAC地址、有效载荷以及校验信息","控制信息、接收设备MAC地址、发送设备MAC地址、有效载荷以及校验信息"],"a":"B","e":"局域网采用分组交换技术，传输的数据帧的格式，按照传输先后顺序分别为：发送设备MAC地址、接收设备MAC地址、控制信息、有效载荷（传输的数据）、校验信息；本题答案为B选项。","code":0},{"id":"1793","paper":"真考试卷29","no":9,"type":"单项选择题","q":"ARM处理器在性能相同的情况下，代码密度最大的是（  ）。","o":["Thumb状态","Thumb-2状态","ARM状态","调试状态"],"a":"A","e":"ARM、Thumb、Thumb-2 指令集的代码密度及性能比较如图所示。由图可以看出，ARM状态采用32位定长ARM指令，单条指令占用字节多，同等功能下程序体积最大，代码密度最低；Thumb状态采用16 位定长指令集，指令长度减半，相同功能代码占用存储空间最小，代码密度最高；Thumb-2 状态采用混合16位+32位变长指令，兼顾性能与密度，但平均指令长度大于纯Thumb，代码密度小于Thumb；实现相同功能时，程序占用存储空间越小，代码密度越大。综上所述，性能一致时Thumb代码密度最大。","code":0},{"id":"1794","paper":"真考试卷29","no":10,"type":"单项选择题","q":"在ARM处理器中，对于功耗要求比较严格的应用场合，采用最合适的ARM处理器是（  ）。","o":["ARM9","ARM Cortex-A15","ARM Cortex-M0","ARM Cortex-R4"],"a":"C","e":"Cortex-A系列是面向高端应用的处理器，性能好、功耗合理；Cortex-M系列是面向微控制器的处理器，性价比极高、成本极低、功耗极小；Cortex-R系列是面向实时控制应用的处理器，它的响应速度快，性能合理、功耗低；在对于功耗要求比较严格的应用场景，应当选用最低功耗的Cortex-M系列处理器，即ARM Cortex-M0处理器；本题答案为C选项。","code":0},{"id":"1795","paper":"真考试卷29","no":11,"type":"单项选择题","q":"决定经典ARM处理器工作模式的寄存器是（  ）。","o":["R13","R14","R15","CPSR"],"a":"D","e":"CPSR是当前程序状态寄存器，其中的T控制位可以用于切换处理器执行的指令类型。决定经典ARM处理器工作模式的寄存器是CPSR。本题答案为D选项。","code":0},{"id":"1796","paper":"真考试卷29","no":12,"type":"单项选择题","q":"以下可读外设数据的指令有（  ）。","o":["LDR R0,[R1]","STRH R1,[R2]","LDR R0,=0x40000200","MOV R0,R1"],"a":"A","e":"读外设数据应当使用LDR指令。A选项采用间接寻址的方式，将R1保存的地址所对应的数据，读到R0中；C选项采用直接寻址的方式，将0x40000200保存到R0中，与MOV类似；本题答案为A选项。","code":0},{"id":"1797","paper":"真考试卷29","no":13,"type":"单项选择题","q":"关于经典ARM处理器异常种类，以下说法错误的是（  ）。","o":["每种异常都有相应的优先级","每种异常都有唯一的中断向量","复位RESET中断向量地址为0","SWI是软件中断，优先级高于外部中断"],"a":"D","e":"软件中断属于内部中断，其优先级低于外部中断；本题答案为D选项。","code":0},{"id":"1798","paper":"真考试卷29","no":14,"type":"单项选择题","q":"关于ARM的存储器格式，以下说法正确的是（  ）。","o":["ARM有两种存储字的格式包括大端模式和小端模式","大端模式是指数据字的高字节存放在高地址的一种模式","小端模式是指数据字的低字节存放在高地址的一种模式","大端模式和小端模式，不能切换"],"a":"A","e":"大端模式是指字节与地址的存放顺序相反，即低地址存放高字节，高地址存放低字节，而小端模式是指字节与地址的存放顺序相同，即低地址存放低字节，高地址存放高字节，大端模式和小端模式可以切换；本题答案为A选项。","code":0},{"id":"1799","paper":"真考试卷29","no":15,"type":"单项选择题","q":"执行ARM指令STR R1,[R0,#8]!后，以下说法正确的是（  ）。","o":["R0中的值发生改变","R1中的值发生改变","R1的内容左移了8位","内存中的数据不变"],"a":"A","e":"本题指令是将R1的值保存在R0+8这个地址中，并且更新R0的值为R0+8。因此R0的值发生了改变，R1的值不变，内存中的数据被改变。本题答案为A选项。","code":0},{"id":"1800","paper":"真考试卷29","no":16,"type":"单项选择题","q":"经典ARM程序状态寄存器CPSR格式如下： \n  31  30  29   28    27   26 …… 8  7  6 5   4    3      2       1      0\n\n<TABLE cellPadding=0 width=420 border=1>\n<TBODY>\n<TR>\n<TD vAlign=top width=20>\nN<\/TD>\n<TD vAlign=top width=26>\nZ<\/TD>\n<TD vAlign=top width=26>\nC<\/TD>\n<TD vAlign=top width=26>\nV<\/TD>\n<TD vAlign=top width=26>\nQ<\/TD>\n<TD vAlign=top width=74>\n状态保留<\/TD>\n<TD vAlign=top width=17>\nI<\/TD>\n<TD vAlign=top width=17>\nF<\/TD>\n<TD vAlign=top width=17>\nT<\/TD>\n<TD vAlign=top width=26>\nM4<\/TD>\n<TD vAlign=top width=26>\nM3<\/TD>\n<TD vAlign=top width=26>\nM2<\/TD>\n<TD vAlign=top width=26>\nM1<\/TD>\n<TD vAlign=top width=35>\nM0<\/TD><\/TR><\/TBODY><\/TABLE>\n执行以下指令后：\n    MRS R1,CPSR\n    ORR R1,R1,#0x40\n    AND R1,R1,#0xFFFFFF7F\n    MSR CPSR,R1\n以下说法正确的是（  ）。","o":["允许外部中断，禁止快速中断","禁止外部中断，允许快速中断","允许外部中断，允许快速中断","禁止外部中断，禁止快速中断"],"a":"A","e":"先将CPSR的数据暂存到R1中；然后将R1的低8位与0100 0000取或操作，即将F控制位，置1；接着将R1的低8位与0111 1111取与操作，即将I控制位，置0；最后再保存到CPSR中；F控制位置1，表示禁止快速中断，I位置0，表示允许外部中断；本题答案为A选项。","code":1},{"id":"1801","paper":"真考试卷29","no":17,"type":"单项选择题","q":"以下ARM指令正确的是（  ）。","o":["ADD R3,R3,[R1]","MOV R2,[R4]","LDR R4,[R5]","MOV R1,0x10"],"a":"C","e":"ADD和MOV指令的操作数，只能是立即数或寄存器，不能是间接寻址方式的值以及纯地址；本题答案为C选项。","code":0},{"id":"1802","paper":"真考试卷29","no":18,"type":"单项选择题","q":"把R1～R5,以及R8中的数据依次写入由R0指示的内存区域，且要求地址传送后递增，符合要求的指令为（  ）。","o":["STMDB R0,{R1-R5,R8}","STMIA R0,{R1-R5,R8}","STMIB R0,{R1-R5,R8}","STMDA R0,{R1-R5,R8}"],"a":"B","e":"注意本题的关键字眼“传送后”和“递增”。推断应在STM后加IA；加DB为传送前递减；加IB为传送前递增；加DA为传送后递减。本题答案为B选项。","code":0},{"id":"1803","paper":"真考试卷29","no":19,"type":"单项选择题","q":"设计嵌入式硬件系统的电源电路时常会采用LDO，下面是关于LDO的叙述，其中错误的是（  ）。","o":["LDO是低压差稳压器的简称","作为稳压器的78XX系列芯片是一种典型的LDO","LDO的输入是直流信号","不同系列的LDO，其输出电流可能不同"],"a":"B","e":"LDO是低压差稳压器，而78XX系列芯片属于普通稳压器，不属于LDO；本题答案为B选项。","code":0},{"id":"1804","paper":"真考试卷29","no":20,"type":"单项选择题","q":"讨论典型嵌入式处理器时钟电路设计方法时常会结合下面的示意图，下面是关于典型嵌入式处理器时钟电路设计方法的相关叙述，其中错误的是（  ）。","o":["右图中的Clock是稳定的时钟信号源输出的信号","左图中的Xtal为晶体振荡器","右图中的X2可以输出时钟信号，而左图中的X2不能输出时钟信号","嵌入式处理器时钟信号的频率频不能超过嵌入式处理器的最高工作频率，有时还要兼顾嵌入式处理器的功耗"],"a":"C","e":"左图是使用晶体振荡器产生内部时钟信号的信号发生器，右图是使用外部时钟信号源的信号发生器，二者都可以输出时钟信号；本题答案为C选项。","code":0},{"id":"1805","paper":"真考试卷29","no":21,"type":"单项选择题","q":"下面是关于ARM的AMBA的叙述，其中错误的是（  ）。","o":["AMBA是ARM公司定义的一种用于连接和管理片上系统中功能模块的开放标准和片上互连规范","从AMBA1.0发布以来，AMBA已经有多个不同的版本，其总线性能也不断提高","总体而言AMBA由系统总线和外围总线组成","AMBA中的系统总线常简称为APB"],"a":"D","e":"在AMBA总线中，APB为先进外围总线，而ASB为先进系统总线；本题答案为D选项。","code":0},{"id":"1806","paper":"真考试卷29","no":22,"type":"单项选择题","q":"下面是关于典型嵌入式系统硬件组成的叙述，其中错误的是（  ）。","o":["模拟量输入接口属于典型嵌入式系统的前向通道","开关量/数字量输入接口属于典型嵌入式系统的后向通道","LED/LCD显示接口属于典型嵌入式系统的人机交互通道","USB接口属于典型嵌入式系统的相互互连通道"],"a":"B","e":"输入接口属于前向通道，而不是后向通道，输出接口属于后向通道。本题答案为B选项。","code":0},{"id":"1807","paper":"真考试卷29","no":23,"type":"单项选择题","q":"从应用系统需求出发，选择嵌入式系统中的嵌入式处理芯片时应遵守的一个原则是参数选择原则，下面选项中，不属于参数选择原则时考虑的选项是（  ）。","o":["ARM内核类型","ARM芯片的价格","系统时钟频率","ARM芯片内部存储器的容量"],"a":"B","e":"芯片的价格并不属于芯片本身的性能参数，因此在参数的选择时不需要考虑价格；本题答案为B选项。","code":0},{"id":"1808","paper":"真考试卷29","no":24,"type":"单项选择题","q":"下面是关于嵌入式系统中使用的存储器的叙述，其中错误的是（  ）。","o":["FRAM是一种铁电随机存取存储器","MRAM是一种磁性随机存取存储器","EEPROM是一种电可擦除可编程只读存储器","DDR2 SDRAM的存取速度与DDR SDRAM一样"],"a":"D","e":"DDR2的实际工作频率是DDR的两倍，因此DDR2 SDRAM提供了相较于DDR SDRAM更高的运行效能。本题答案为D选项。","code":0},{"id":"1809","paper":"真考试卷29","no":25,"type":"单项选择题","q":"下面是关于S3C2410内含的I<SUP>2<\/SUP>C总线接口的叙述，其中错误的是（  ）。","o":["I<SUP>2<\/SUP>C接口具有主发送模式、主接收模式、从发送模式和从接收模式","涉及I2C操作的寄存器只有IICCON和IICSTAT这两个寄存器","IICCON是I<SUP>2<\/SUP>C总线控制寄存器","IICSTAT是I<SUP>2<\/SUP>C总线状态寄存器"],"a":"B","e":"涉及I<SUP>2<\/SUP>C操作的寄存器有IICCON、IICSTAT、地址寄存器、数据位移寄存器等；本题答案为B选项。","code":0},{"id":"1810","paper":"真考试卷29","no":26,"type":"单项选择题","q":"下述通信标准中，通信时不采用差分方式进行信号传输的是（  ）。","o":["USB","RS-485","CAN","RS-232"],"a":"D","e":"RS-232采用非差分方式进行信号传输，即单端通讯；本题答案为D选项。","code":0},{"id":"1811","paper":"真考试卷29","no":27,"type":"单项选择题","q":"S3C2410内置ADC的结构如下图所示。下面是关于S3C2410内置ADC的叙述，其中错误的是（  ）。","o":["内置ADC采用的是逐次逼近式ADC","A/D转换结果暂存在图中的“ADC数据寄存器”中","整个内置ADC只有一个模拟量输入通道","A/D转换结束会产生中断请求信号"],"a":"C","e":"S3C2410内置的ADC有8个模拟量输入通道；本题答案为C选项。","code":0},{"id":"1812","paper":"真考试卷29","no":28,"type":"单项选择题","q":"S3C2410内部有5个16位定时器Timer，有4个具备PWM输出。因此芯片内部有一组PWM特殊功能寄存器，其中的“定时器控制寄存器”是（  ）。","o":["TCNTB0~ TCNTB4","TCNTO0~ TCNTO4","TCON","TCFG0"],"a":"C","e":"TCNTBn为定时器计数缓冲寄存器；TCNTOn为定时器观察寄存器；TCON为定时器控制寄存器；TCFGn为定时器配置寄存器。本题答案为C选项。","code":0},{"id":"1813","paper":"真考试卷29","no":29,"type":"单项选择题","q":"下列关于嵌入式系统软件构成部件的各组术语中，含义最相似的是（  ）。","o":["引导加载程序与板级支持包","操作系统与中间件","硬件抽象层与板级支持包","应用程序与引导加载程序"],"a":"C","e":"硬件抽象层HAL与板级支持包BSP的含义最为相似，两者都是嵌入式系统的底层软件，甚至有些文献并不区分HAL与BSP，把二者当做同义词；本题答案为C选项。","code":0},{"id":"1814","paper":"真考试卷29","no":30,"type":"单项选择题","q":"下列关于BSP的描述中，正确的是（  ）。","o":["BSP在系统上电复位之前负责系统初始软硬件环境的建立","BSP一般由操作系统厂商提供","BSP是嵌入式系统软件必须的组成部件","如果有可能，一般会选择与所支持的硬件平台最相近的参考平台上已经有的BSP，将其移植到新平台上"],"a":"D","e":"BSP是嵌入式系统的底层软件，只能在上电复位之后，进行系统软硬件环境的初始化，因此A选项错误；BSP一般由嵌入式软件开发人员进行开发，而HAL一般由操作系统厂商提供，因此B选项错误；BSP位于操作系统层和硬件层之间，而嵌入式系统软件中的中间件层并不需要BSP；本题答案为D选项。","code":0},{"id":"1815","paper":"真考试卷29","no":31,"type":"单项选择题","q":"下列关于bootloader的陈述中，错误的是（  ）。","o":["嵌入式系统上电复位后首先运行引导加载程序","有些种类的bootloader能支持多种体系结构的处理器，但每种体系结构有其自身的版本","与处理器体系结构相关的硬件初始化和板级初始化等操作通常都在第一阶段完成","Windows Embedded Compact的BSP 又称为OEM适配层"],"a":"D","e":"Windows Embedded Compact的BSP由Boot Loader OEM适配层、设备驱动程序、内核独立传输层以及镜像配置文件组成，而不单单是指OEM适配层；本题答案为D选项。","code":0},{"id":"1816","paper":"真考试卷29","no":32,"type":"单项选择题","q":"下列关于驱动程序的陈述中，错误的是（  ）。","o":["驱动程序通常以若干函数的集合的形式出现","很多操作系统不允许运行在用户态的应用程序直接访问物理端口，用户的应用程序必须通过驱动程序才能访问硬件","在不使用操作系统的嵌入式系统中，驱动程序和高层软件之间通常并没有严格的界限","某些操作系统允许驱动程序自行运行而无需被高层软件调用"],"a":"D","e":"驱动程序不能自行运行，必须通过高层软件的调用才能运行；本题答案为D选项。","code":0},{"id":"1817","paper":"真考试卷29","no":33,"type":"单项选择题","q":"下列关于嵌入式系统底层软件的陈述中，错误的是（  ）。","o":["μC/OS嵌入式操作系统只包括操作系统内核，不包括设备驱动程序","BSP中包含硬件相关的设备驱动程序","一种嵌入式操作系统的BSP不可能用于其他嵌入式操作系统","Nucleus PLUS是一个规模庞大的开源bootloader软件"],"a":"D","e":"NucleusPLUS是为实时嵌入式应用而设计的抢先式多任务操作系统内核。它不是开源bootloader软件。本题答案为D选项。","code":0},{"id":"1818","paper":"真考试卷29","no":34,"type":"单项选择题","q":"下列名词术语中，与嵌入式底层软件无关的是（  ）。","o":["BSP","Bootloader","HAL","Dalvik"],"a":"D","e":"Dalvik是一种虚拟机，从软件层面抽象出虚拟的硬件和系统，是应用软件层的软件，与底层软件无关。本题答案为D选项。","code":0},{"id":"1819","paper":"真考试卷29","no":35,"type":"单项选择题","q":"下列关于实时操作系统的陈述中，错误的是（  ）。","o":["实时调度机制的目标是在峰值负载条件下能满足所有任务的时限","任务的实时性要求越高，其优先级也就越高","在实时操作系统中必须允许用户细粒度地控制任务的优先级","实时调度机制首先要选择调度方式简单、反应速度快的实时调度算法"],"a":"A","e":"实时调度机制的目标是，在正常情况下，尽可能满足所有任务的时限；而在峰值负载条件下，保证强实时任务满足时限。本题答案为A选项。","code":0},{"id":"1820","paper":"真考试卷29","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，正确的是（  ）。","o":["RTEMS是软实时操作系统","eCos是商业嵌入式操作系统","RTEMS、μC/OS-II和FreeRTOS都是免费嵌入式操作系统","一般而言，嵌入式操作系统的用户界面只向最终用户提供功能接口，不提供操作命令，因而与用户的交互性较弱"],"a":"D","e":"RTEMS是硬实时操作系统，因此A选项错误；eCos是一种嵌入式可配置实时操作系统，不属于商业嵌入式操作系统，因此B选项错误； μC/OS-II 并不是免费软件， 用户可以自由下载全部源码并用于教学、短期评估和私下研究，但如果将其用于商业用途， 则必须从 Micriμm 公司获得商用许可，因此C选项错误。本题答案为D选项。","code":0},{"id":"1821","paper":"真考试卷29","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，错误的是（  ）。","o":["用户必须在调用OSStart()启动多任务调度以后再开启时钟节拍器","周期执行的任务通常执行三步操作：任务准备工作；任务实体；自我删除函数调用","事件触发执行的任务一般采用循环结构，相关事件发生一次，任务实体代码执行一次","如果任务在被挂起时正在等待延时，则挂起操作将被取消"],"a":"B","e":"单次执行的任务通常执行三步操作：任务准备工作、任务实体、自我删除函数调用；而周期执行的任务一般采用循环结构，在每次完成具体功能后调用系统延时函数等待下一个执行周期，并将处理器时间让给其他任务。本题答案为B选项。","code":0},{"id":"1822","paper":"真考试卷29","no":38,"type":"单项选择题","q":"下列关于Linux操作系统的陈述中，错误的是（  ）。","o":["Linux是多用户、多任务、支持多线程和多CPU的类Unix操作系统","Linux采用了与Unix相同的宏内核结构","Android是用于智能手机、平板电脑等移动设备的软件包，其核心是以Linux内核为基础的开源操作系统","严格来说，Linux并不是操作系统，而是操作系统的一个组成部件。Linux内核通常与一系列应用程序、系统库和开发工具等组合成可用的完整操作系统，其确切名称为MontaVista Linux操作系统"],"a":"D","e":"Linux只是操作系统的内核，Linux内核通常与一系列应用程序、系统库和开发工具等组合成可用的完整操作系统，这种操作系统是Linux发行版，各个发行版的目的各不相同。本题答案为D选项。","code":0},{"id":"1823","paper":"真考试卷29","no":39,"type":"单项选择题","q":"嵌入式系统开发中，要想准确地定位软件和硬件中出现的错误，必须借助多种硬件和软件开发调试工具。下面所列出的仪器设备中哪个不是嵌入式系统开发时常用的调试工具。","o":["编程器（或烧写器）","JTAG适配器","逻辑分析仪","示波器"],"a":"A","e":"编程器（或烧写器）是用于将程序代码烧写到ROM中去，不属于调试工具。本题答案为A选项。","code":0},{"id":"1824","paper":"真考试卷29","no":40,"type":"单项选择题","q":"在基于ARM微处理器为核心的硬件平台上，开发其Linux环境下的应用程序test.c。若需要编译后生成test.c对应的汇编程序，下面哪条命令是合适的。","o":["arm-linux-gcc -g -o test test.c","arm-linux-gcc -o test test.c","arm-linux-gcc -c test.c","arm-linux-gcc -S test.c"],"a":"D","e":"arm-linux-gcc -g -o test test.c是直接把test.c编译、汇编、链接成带调试信息的可执行文件test，A选项不符合题目要求，没有生成汇编程序；arm-linux-gcc -o test test.c是直接把test.c编译、汇编、链接成可执行文件test，B选项不符合题目要求，没有生成汇编程序；arm-linux-gcc -c test.c是把test.c编译、汇编成目标文件test.o（机器码文件，不是汇编文本），C选项不符合题目要求，生成的是.o目标文件，不是汇编程序；arm-linux-gcc -S test.c是把test.c编译成对应的汇编代码文件test.s，D选项符合题目要求，故本题答案为D选项。","code":0},{"id":"1846","paper":"真考试卷30","no":1,"type":"单项选择题","q":"下面四个选项中不属于嵌入式系统的选项是：","o":["数码相机","电子字典","工业机器人","光盘"],"a":"D","e":"嵌入式系统是嵌入式计算机系统的简称，是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统。D选项光盘不是一个嵌入式系统，它是一种存储介质，本题答案为D。","code":0},{"id":"1847","paper":"真考试卷30","no":2,"type":"单项选择题","q":"嵌入式系统的输入/输出设备种类繁多，按其服务对象可分为用于人机交互的设备和用于机机交互的设备两大类，下面四种设备中，属于机机交互的设备是：","o":["系统中的键盘","系统中的鼠标器","系统中的压力传感器","系统中的手写笔"],"a":"C","e":"机机交互的设备是指用于机器之间进行交互和通信的设备，而不涉及人的直接参与，这些设备通常用于嵌入式系统中的各个组件之间的数据传输和通信。本题答案为C。","code":0},{"id":"1848","paper":"真考试卷30","no":3,"type":"单项选择题","q":"下面为嵌入式系统中常用的数字信号处理器（DSP）的叙述，其中错误的是：","o":["DSP能更好地满足嵌入式系统对高速数字信号处理的需求","DSP 常采用哈佛结构","通过增加SIMD等指令，使DSP能够特别适用于实现FFT等数字信号处理算法","DSP是一种相对特殊的嵌入式处理器，只能以单个芯片的形式存在，不能以SoC内核的形式存在"],"a":"D","e":"实际上，DSP可以以多种形式存在，包括单个芯片形式和作为 SoC（系统级芯片）内核的形式。D选项叙述错误，本题答案为D。","code":0},{"id":"1849","paper":"真考试卷30","no":4,"type":"单项选择题","q":"按软硬件技术复杂程度的不同，可以把嵌入式系统分为低端系统、中端系统和高端系统，下面关于这三类系统的叙述中，错误的是：","o":["低端系统内部常采用4位/8位单片机","中端系统内部常采用8位/16位单片机，不会采用32位处理器","高端系统采用的操作系统功能比较齐全，使用图形用户界面，用户软件可更新和扩展","低端系统一般不使用操作系统，由监控程序对系统进行控制"],"a":"B","e":"中端系统的复杂程度介于低端和高端系统之间，可以使用各种处理器架构，虽然在某些情况下可能会使用8 位/16 位单片机，但中端系统也可以采用32 位处理器，以满足更高的计算和存储需求。B选项叙述错误，本题答案为B。","code":0},{"id":"1850","paper":"真考试卷30","no":5,"type":"单项选择题","q":"下列符号中，不包含于ASCII字符集中的是：","o":["阿拉伯数字","注音符号","拉丁字母","标点符号"],"a":"B","e":"ASCII字符集共有128个字符，包括96个可打印字符（常用的拉丁字母、阿拉伯数字、标点符号等）和32个控制字符，不包含注音符号，本题答案为B。","code":0},{"id":"1851","paper":"真考试卷30","no":6,"type":"单项选择题","q":"下列各图像文件格式中，支持动画效果的是：","o":["BMP","JPEG","GIF","TIF"],"a":"C","e":"A选项BMP是微软公司在Windows操作系统下使用的一种标准图像文件格式，每个文件存放一幅图像；B选项JPEG是静止图像数据压缩编码的国际标准，特别适合处理各种连续色调的彩色和灰度图像；C选项GIF是目前互联网上广泛使用的一种图像文件格式，尤为突出的是，它可以将多张图像保存在同一个文件中，显示时按预先规定的时间间隔逐一进行显示，形成动画的效果；D选项TIF图像文件格式大多数使用于扫描仪和桌面出版，能支持多种压缩方法和多种不同类型的图像；本题答案为C。","code":0},{"id":"1852","paper":"真考试卷30","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，正确的是：","o":["WAV是一种无损压缩的音频文件格式","音乐的取样频率范围通常在40kHz以下","电话数字语音的频率范围是20~20000Hz","MP3是一种有损压缩的音频文件格式"],"a":"D","e":"WAV是未经压缩的数字音频，但对存储空间需求太大，不便于交流和传播，A选项叙述错误；常见的音频采样频率为44.1kHz，用于音乐和音频录制，B选项叙述错误；电话数字语音的频率范围通常是300 Hz到3400 Hz，C选项叙述错误；MP3是互联网上最流行的数字音乐格式，它采用国际标准化组织提出的MPEG-1层算法进行有损的压缩编码，D选项叙述正确，本题答案为D。","code":0},{"id":"1853","paper":"真考试卷30","no":8,"type":"单项选择题","q":"关于无线通信以下说法错误的是：","o":["无线通信是借助于自由空间的电磁波传输信息的","无线电波可以按频率或波长分中波、短波、超短波和微波等波段","微波主要沿地面传输，绕射能力强。适用于广播和海上通信","无线通信存在易被窃听，易受干扰等缺点"],"a":"C","e":"微波是一种高频的电磁波，通常在30 MHz到300 GHz之间，微波具有较强的直线传播能力，适用于点对点通信，如卫星通信和微波链路。微波的绕射能力相对较弱，不适用于广播和海上通信，C选项叙述错误，本题答案为C。","code":0},{"id":"1854","paper":"真考试卷30","no":9,"type":"单项选择题","q":"关于处理器，以下说法错误的是：","o":["CISC是复杂指令集结构，RISC是精简指令集结构","按照存储结构处理器可分为冯.诺依曼结构和哈佛结构","单周期操作是RISC的特点之一","所有ARM处理器都是哈佛结构"],"a":"D","e":"ARM处理器具有多种不同的实现和变体，其中一些采用哈佛结构，但并非所有ARM处理器都是哈佛结构。ARM处理器的存储结构可以根据具体的设计进行调整，既可以是哈佛结构，也可以是冯·诺依曼结构。D选项叙述错误，本题答案为D。","code":0},{"id":"1855","paper":"真考试卷30","no":10,"type":"单项选择题","q":"要设计一个强实时要求的嵌入式系统，以下处理器最优选择是：","o":["ARM Cortex-A70","ARM Cortex-M0","ARM Cortex-M4","ARM Cortex-R4"],"a":"D","e":"ARM Cortex-A系列是面向高性能应用的处理器，工作频率高、性能好、功耗合理；RM Cortex-M系列是面向微控制器的处理器，性价比极高、成本很低、功耗极小；ARM Cortex-R系列是面向实时控制应用的处理器，响应速度快、性能合理、功耗低；本题答案为D。","code":0},{"id":"1856","paper":"真考试卷30","no":11,"type":"单项选择题","q":"ARM处理器以下指令集占用存储空间从最小到最大依次为：","o":["ARM指令集、Thumb指令集、Thumb-2指令集","Thumb指令集、ARM指令集、Thumb-2指令集","Thumb-2指令集、Thumb指令集、ARM指令集","Thumb指令集、Thumb-2指令集、ARM指令集"],"a":"D","e":"Thumb指令集是ARM处理器的16位指令集，它相对较小，占用的存储空间较少；ARM指令集是32位指令集，比Thumb指令集更大；而Thumb-2指令集即有16位指令又有32位指令，是一个混合的指令集，它是16位Thumb指令集的超集，功能强大、完备，效率高。Thumb-2指令集用于实现代码密度和处理器性能的最佳平衡，它在不牺牲性能的情况下可以节省存储成本。本题答案为D。","code":0},{"id":"1857","paper":"真考试卷30","no":12,"type":"单项选择题","q":"关于ARM920T处理器的指令流水线，以下说法正确的是：\n①取指令  \n②指令译码   \n③执行指令运算      \n④Cache/存储器访问    \n⑤结果写回寄存器  \n⑥预取指令 \n⑦跟踪  \n⑧乘加","o":["它有3级流水线分别为①②⑤","它有4级流水线分别为①③④⑤","它有5级流水线分别为①②③④⑤","它有8级流水线分别为①②③④⑤⑥⑦⑧"],"a":"C","e":"ARM920T处理器的指令流水线包含以下阶段：取指令、指令译码、执行指令运算、Cache/存储器访问和结果写回寄存器；预取指令、跟踪和乘加不属于ARM920T处理器的流水线阶段，本题答案为C。","code":1},{"id":"1858","paper":"真考试卷30","no":13,"type":"单项选择题","q":"如表1所示，ARM处理器依次执行LDR R1,=0x38001000和LDR R0,[R1]指令后，如果R0=0x12345678,则以下说法正确的是：\n①ARM处理器工作在小端存储模式  \n②ARM处理器工作在大端存储模式\n③R1=0x38001000                 \n④存储器中的数据不变    \n              表1  存储器数据存储示意","o":["①和④","②和③","①③和④","②③和④"],"a":"C","e":"根据题目中给出的存储器数据存储示意，数据0x12345678在存储器中地址0x38001000存储的数据是0x78，即低地址存放最低有效字节，所以以小端字节序存储；执行LDR R1,=0x38001000和LDR R0,[R1]指令后，可以确定R1的值为0x38001000作为地址，从存储器中加载数据到R0，如果R0的值确实是0x12345678，那么存储器中的数据没有发生改变；①③和④叙述正确，本题答案为C。","code":1},{"id":"1859","paper":"真考试卷30","no":14,"type":"单项选择题","q":"如表2所示，有以下指令序列：\nLDR R0,=0x3C000000\nLDRB R1,[R0,#4]!\nCMP R1,#0\nBNE L0\nORR R1,R1,#0xF0F0F0F0\nL0       STRB R1,[R0]           \n对于小端存储模式，以下说法正确的是：\n①内存中的值不变                          ②内存中的值改变  \n③0x3C000004中的值为0xF0          ④0x3C000000中的值为0xF0\n⑤0x3C000004中的值为0x00           ⑥0x3C000000中的值为0x00\n                         表2 存储器数据存储示意","o":["①⑥","①⑤","②③","②④"],"a":"C","e":"根据以上指令序列中包含了对内存的读取和写入操作，内存中的值会发生改变；指令序列中的ORR指令对寄存器R1进行逻辑或操作，将R1的值与0xF0F0F0F0进行按位做逻辑或运算，并将结果存回R1；最终将0xF0写入了寄存器R1，而后面的STRB指令将R1的低字节数据写回到地址为0x3C000004的内存，由于小端存储模式，0x3C000004处的值为0xF0；②③叙述正确，本题答案为C。","code":1},{"id":"1860","paper":"真考试卷30","no":15,"type":"单项选择题","q":"若读取4个字节数据，内存地址由R1+4指示，读出的数据存放在R0中，读取完毕，地址自动更新，正确的指令为：","o":["LDR R0，[R1,#4]","LDR R0，[R1,#4]!","LDR R0，[R1],#4","LDRD R0，[R1,#4]"],"a":"B","e":"A选项将由R1+4指示的存储器中的数据读入寄存器R0，但不会自动更新地址；B选项将由R1+4指示的存储器中的字数据读入寄存器R0，并将新地址R1+4自动更新写入R1；C选项由R1指示的存储器中的字数据读入寄存器R0，并将新地址R1+4手动更新写入R1；D选项将R1+4存储在连续的两个寄存器R0和R1中，LDRD指令用于加载两个连续的寄存器，而不是单个寄存器；本题答案为B。","code":0},{"id":"1861","paper":"真考试卷30","no":16,"type":"单项选择题","q":"对于BMI  Lable指令，以下说法正确的是：","o":["如果无符号数据比较的结果大于，则转移到Lable执行指令","如果有符号数据比较的结果大于，则转移到Lable执行指令","如果为负数，转移到Lable执行指令","如果有符号数据比较的结果大于等于，则转移到Lable执行指令"],"a":"C","e":"BMI 指令是根据结果的符号来进行跳转判断的，如果执行之前的操作得到的结果为负数（即最高位为1），则执行跳转到指定的 Lable 执行指令。C选项叙述正确，本题答案为C。","code":0},{"id":"1862","paper":"真考试卷30","no":17,"type":"单项选择题","q":"把R1中的值乘以2，存放到R2中，以下指令正确的是：\n①ADD R2，R1，R1   \n②MOV R2，R1，LSL#1\n③MOV R2，R1，LSL#2\n④MOV R2，R1，LSR#3\n⑤MOV R2，R1，LSR#4\n⑥MUL R2，R1，#2","o":["①","⑥","①②","①②⑥"],"a":"D","e":"① 这条指令将 R1 的值与自身相加，然后将结果存储到 R2 中，相当于将 R1 的值乘以 2。② 这条指令将 R1 的值左移一位（相当于乘以 2），然后将结果存储到 R2 中。③这条指令将 R1 的值左移两位（相当于乘以 4），然后将结果存储到 R2 中。④这条指令将 R1 的值右移三位（相当于除以8），然后将结果存储到 R2 中。⑤这条指令将 R1 的值右移四位（相当于除以16），然后将结果存储到 R2 中。⑥这条指令将 R1 的值与立即数 2 相乘，然后将结果存储到 R2 中，相当于将 R1 的值乘以 2。由此可知①②⑥符合题意，本题答案为D。","code":1},{"id":"1863","paper":"真考试卷30","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下,已知R0=0x3C00000A，R1=0x30011260 ,R2=0, 如表3所示的数据存储，则依次执行以下指令：\ntemp     EQU     0xA1B2C3D4\nLDR R2,=temp\nSTR R2,[R0],#4\n LDR R2,[R1,#8]\n以上指令序列执行后，以下说明正确的是：\n①内存0x3C00000A 中的值改变 \n②内存0x30011268 中的值为0xA1B2C3D4\n③R2中的值不变\n④temp中的值不变\n⑤R0中的值增加4\n⑥R1中的值增加8?\n               表3   存储器存储数据示意","o":["①④⑤","①②⑥","②③⑤","①④⑤⑥"],"a":"A","e":"LDR R2,=temp：该指令将立即数temp的值加载到寄存器R2中，此时R2将存储temp的地址；STR R2,[R0],#4：该指令将R2的值存储到[R0] 指向的内存地址中，然后将R0的值增加4；LDR R2,[R1,#8]：该指令将[R1,#8] 指向的内存地址中的值加载到R2中。根据题目信息，R1 的初始值为0x30011260，所以[R1,#8] 指向的地址为0x30011268。因此，该指令将加载内存地址0x30011268 中的值到R2中。由此可知①④⑤符合题意，本题答案为A。","code":1},{"id":"1864","paper":"真考试卷30","no":19,"type":"单项选择题","q":"下面是关于为嵌入式处理器提供复位信号（嵌入式处理器的复位电路）的叙述，其中错误的是：","o":["为嵌入式处理器提供复位信号是使其能够正常工作的一个必要条件","所有嵌入式处理器都仅有一个复位引脚，或者是nRESET，或者是RESET","一般情况下，一个嵌入式处理器复位时，加在其复位引脚上的有效信号必须保持若干个处理器时钟周期","有专门的处理器复位芯片可供选用"],"a":"B","e":"实际上，不同的嵌入式处理器可能具有不同的复位信号架构和引脚配置。有些处理器可能只有一个复位引脚，例如标准的 nRESET 或 RESET 引脚。但是，其他处理器可能具有多个复位引脚，每个引脚可能具有不同的功能或用途，处理器的复位信号架构和引脚配置取决于具体的芯片设计和制造商的规格要求。B选项叙述错误，本题答案为B。","code":0},{"id":"1865","paper":"真考试卷30","no":20,"type":"单项选择题","q":"下面是关于典型嵌入式系统硬件组成的叙述，其中错误的是：","o":["嵌入式系统中的模拟量输入接口属于典型嵌入式系统的前向通道","嵌入式系统中的模拟量输出接口属于典型嵌入式系统的后向通道","嵌入式系统中的以太网通信接口属于典型嵌入式系统的相互互联通道","嵌入式系统中的USB接口属于典型嵌入式系统的人机交互通道"],"a":"D","e":"USB接口通常用于数据交换、外设连接和与其他计算设备进行通信，而不是用于人机交互。D选项叙述错误，本题答案为D。","code":0},{"id":"1866","paper":"真考试卷30","no":21,"type":"单项选择题","q":"下面是关于基于ARM内核的嵌入式芯片的叙述，其中错误的是：","o":["基于ARM内核的嵌入式芯片以ARM内核为基础，通过AMBA总线将其他硬件组件连接在一起","以ARM内核为基础的嵌入式处理芯片采用系统总线与外围总线两层结构的方式构建片上系统","连接在系统总线和外围总线上的各功能组件的运行速度是相同的","AMBA发展至今已经形成了多个版本，总线性能也在不断提高"],"a":"C","e":"连接在系统总线和外围总线上的各功能组件的运行速度是不相同的，主要取决于各个组件的性能和需求，某些关键组件可能需要更高的运行速度，而其他组件可能需要较低的速度。C选项叙述错误，本题答案为C。","code":0},{"id":"1867","paper":"真考试卷30","no":22,"type":"单项选择题","q":"嵌入式系统使用的存储器以半导体存储器为主，随着技术的发展，出现了多种新型存储器，下面列出的存储器选项中，不属于半导体存储器的选项是：","o":["MRAM","SRAM","DRAM","Flash ROM"],"a":"A","e":"MRAM是一种非易失性存储器，不属于半导体存储器，而是一种基于磁性材料的存储器技术；SRAM是一种静态随机访问存储器，它使用电路存储数据，并且不需要刷新操作；DRAM是一种动态随机访问存储器，它使用电容存储数据，并且需要定期刷新操作来保持数据；Flash ROM是一种只读存储器，它使用闪存技术存储数据；由此可知A选项不符合题意，本题答案为A。","code":0},{"id":"1868","paper":"真考试卷30","no":23,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是：","o":["USB主控制器包含一个根集线器，提供一个或多个USB下行端口","USB 3.0的理想传输速率约为USB 2.0的100倍","USB采用NRZI编码方式对数据进行编码","USB2.0采用半双工差分方式传送信号"],"a":"B","e":"USB主控制器通常包含一个根集线器，它是USB总线的起点，提供一个或多个下行端口，用于连接USB设备；USB 3.0相对于USB 2.0在理论上提供了更高的传输速率，但并不是100倍。目前USB2.0的速度为480Mb/s，USB3.0达到5Gb/s即640MB/s。USB使用非归零码(NRZI)编码方式对数据进行编码，这种编码方式通过在数据的变化处发送或不发送信号来表示数据位；USB总线（1.1和2.0）有4根信号线，采用半双工差分方式，用来传送信号并提供电源；B选项叙述错误，本题答案为B。","code":0},{"id":"1869","paper":"真考试卷30","no":24,"type":"单项选择题","q":"下面是关于嵌入式处理芯片中UART的叙述，其中错误的是：","o":["S3C2410片内具有多个UART","UART可实现全双工串行通信","UART的接收器工作在FIFO模式时，只要接收到一个字符就引发接收中断并置位标志","UART通信时，通过起始位进行收发双方的同步"],"a":"C","e":"在FIFO（First-In-First-Out）模式下，UART的接收器会将接收到的字符存储在接收缓冲区中，直到缓冲区满或达到指定的接收字符数才会引发接收中断。接收中断并置位标志的条件通常不是接收到一个字符，而是达到接收缓冲区的特定状态；C选项叙述错误，本题答案为C。","code":0},{"id":"1870","paper":"真考试卷30","no":25,"type":"单项选择题","q":"S3C2410通过ADS7843与触摸屏的接口原理如下图所示。下面关于该图的叙述中，错误的是：","o":["图中的触摸屏为四线电阻触摸屏","当在触摸屏上有触摸动作时，引发S3C2410外部中断申请","S3C2410通过SPI0读取触摸屏上触摸点的X、Y坐标","当S3C2410的GPG12引脚另作他用时，ADS7843的引脚应固定接高电平"],"a":"D","e":"电阻式触摸屏接口通常利用专业的电阻触摸屏转换芯片如TI的ADS7843，它是一种四线同步SPI接口的12位ADC，当有触摸动作时，引发S3C2410外部中断申请，在中断服务程序中通过SPI0总线直接读取X、Y的坐标；当S3C2410的GPG12引脚另作其他用途时，ADS7843的引脚的配置将取决于具体的使用情况和需求；D选项叙述错误，本题答案为D。","code":0},{"id":"1871","paper":"真考试卷30","no":26,"type":"单项选择题","q":"下面是关于HDMI的叙述，其中错误的是：","o":["HDMI即高清多媒体接口","目前已有多种ARM芯片内置了HDMI控制器接口","HDMI可同时传送音频和视频信号，传送的信号形式是模拟信号","采用HDMI的设备具有即插即用的特点"],"a":"C","e":"高清晰度多媒体接口（HDMI）是一种数字化音频/视频接口，适合影像传输；目前已有多个ARM芯片内置了HDMI控制器接口，如基于Cortex-M3的STM32F100系列等；HDMI可同时传送音频和视频信号，传输的信号形式并非模拟信号，而是数字信号；HDMI的设备具有即插即用的特点，信号源和显示设备之间会自动进行“协商”，自动选择最合适的视频/音频格式；C选项叙述错误，本题答案为C。","code":0},{"id":"1872","paper":"真考试卷30","no":27,"type":"单项选择题","q":"下面是关于SPI的叙述，其中错误的是：","o":["SPI即串行外设接口","SPI是一种异步串行通信接口","SPI能实现全双工串行通信","SPI采用一主多从式连接方式时，从机SPI接口中的SSEL信号的状态受主机控制"],"a":"B","e":"串行外设（SPI）接口是一种同步串行外设接口，允许嵌入式处理器与各种外围设备以串行方式进行通信、数据交换。B选项叙述错误，本题答案为B。","code":0},{"id":"1873","paper":"真考试卷30","no":28,"type":"单项选择题","q":"下面是关于S3C2410/S3C2440的叙述，其中错误的是：","o":["S3C2410/S3C2440是三星公司基于ARM920T核的两款嵌入式微处理器","S3C2410/S3C2440是属于中高档32位嵌入式微处理器","S3C2410/S3C2440具有SDI/MMC组件，用于驱动SD存储卡和MMC存储卡","S3C2410/S3C2440具有2GB的存储器空间"],"a":"D","e":"S3C2410/S32440是三星公司基于ARM920T核的两款嵌入式微处理器，ARM920T集成了ARM9TDMI，属于中高档32位嵌入式微处理器，内部具有分离的16KB大小的指令Cache和16KB大小的数据Cache，S3C2410/S3C2440的存储器空间并不是固定的2GB，而是根据具体的配置和使用需求来定；S3C2410/S3C2440具有SDI/MMC组件，用于驱动SD存储卡和MMC存储卡；D选项叙述错误，本题答案为D。","code":0},{"id":"1874","paper":"真考试卷30","no":29,"type":"单项选择题","q":"下列关于嵌入式系统软件的描述中，不正确的是：","o":["选择嵌入式系统软件结构的一个基本原则是：尽可能选择可以满足成本要求的高性能通用嵌入式操作系统结构","系统软件、应用软件与系统的硬件一体化，相互关系密切","引入操作系统增加了系统的开销","中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件"],"a":"A","e":"选择嵌入式系统结构的一个基本原则是：选择可以满足响应时间需要的最简单的结构，并非尽可能选择可以满足成本要求的高性能通用嵌入式操作系统结构；在嵌入式系统中，操作系统和应用软件集成于计算机硬件系统之中，系统软件、应用软件与系统的硬件一体化，相互关系密切，引入操作系统增加了系统的开销；中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件；A选项叙述错误，本题答案为A。","code":0},{"id":"1875","paper":"真考试卷30","no":30,"type":"单项选择题","q":"下列关于BSP功能的描述中，正确的是：","o":["BSP又称为引导加载程序","BSP规范是OS无关的，各种OS的BSP的组织结构、向上层提供的功能以及服务接口定义相同","BSP需要完成操作系统自身工作环境的初始化","通常可以借助操作系统的调试工具调试BSP"],"a":"C","e":"BSP又称板级支持包，由引导加载程序（Boot Loader）、OEM适配层（OAL）、设备驱动程序、配置文件和内核无关的传输层（KITL）组成；BSP规范是OS相关的，支持不同OS的BSP的组织结构、向上层提供的功能以及服务接口定义都不相同；在初始化必要的硬件环境之后，BSP还需要进行系统级的初始化。这包括设备软件的基本数据结构和参数、操作系统自身工作环境的初始化、定制操作系统的功能等，为操作系统的正常运行做好准备；在BSP运行之前，操作系统的调试工具都不可用，甚至硬件平台是否可靠稳定运行都不确定；由此可知C选项叙述正确，本题答案为C。","code":0},{"id":"1876","paper":"真考试卷30","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的陈述中，不正确的是：","o":["BSP是操作系统正常运行的前提","板级支持包则可以被看作是是硬件抽象层在特定操作系统环境下的具体实现","BSP中包含的硬件相关的设备驱动程序直接由BSP使用","开发全新BSP通常以操作系统厂商提供的BSP模板为依据"],"a":"C","e":"BSP中包含硬件相关的设备驱动程序，这些驱动程序为操作系统和/或应用程序访问硬件提供支持，对系统硬件进行管理，并实现数据的输入输出操作。但是，除了与在引导和加载操作系统过程中所需的硬件环境相关的设备驱动程序之外，BSP包含的其它设备驱动程序通常不直接由BSP使用；由此可知C选项叙述错误，本题答案为C。","code":0},{"id":"1877","paper":"真考试卷30","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["U-Boot能支持多种体系结构的处理器，一套二进制代码可以轻松支持不同体系结构的硬件平台","“在RAM中运行操作系统代码”这种操作系统引导加载方式，不需要在系统启动之前将嵌入式操作系统的映象和应用程序映象烧录到ROM中","bootROM是用来存储bootloader程序的非易失存储器","bootloader的代码通常都用汇编语言实现，以便实现操作系统加载的功能"],"a":"C","e":"U-Boot是公认的功能最强、最具有弹性以及更新最快的开发源码bootloader，是遵循GPL条款的代码资源最完整的一个通用bootloader，支持的处理器体系包括MPC8xx、MPC82xx等PowerPC系列处理器，ARM7、ARM9、StrongARM，XScale等ARM系列处理器，以及MIPS系列、X86系列等；U - Boot 虽能支持多种体系结构处理器，但不同体系结构硬件平台架构差异大，二进制代码无法直接通用，需针对不同架构重新编译适配，A选项叙述错误；在ROM中直接运行操作系统代码，传统的嵌入式系统较少配置外存储器，而是将操作系统和应用程序的映像预先烧录在ROM存储器中，B选项叙述错误；与bootloader相关的一个术语是bootROM（引导只读存储器）用来存储bootloader程序的非易失存储器，C选项叙述正确；它第一阶段的代码通常用汇编语言实现，一方面可以提高代码的时空效率，另一方面可以更方便地实现对硬件的操作，D选项叙述错误；由此可知C选项叙述正确，本题答案为C。","code":0},{"id":"1878","paper":"真考试卷30","no":33,"type":"单项选择题","q":"下列关于驱动程序的陈述中，不正确的是：","o":["驱动程序对上层软件屏蔽硬件细节，对下层硬件直接进行操作","VxWorks嵌入式操作系统的I/O系统通过7个基本的I/O操作函数访问硬件设备：create()、open()、read()、write()、close()、remove()和ioctl()","在VxWorks嵌入式操作系统中，操作系统定义了统一的设备驱动程序框架，绝不允许用户代码绕过操作系统直接访问硬件","驱动程序通常以一组函数的形式出现"],"a":"C","e":"在WinCE、Linux和VxWorks等大型嵌入式操作系统中，往往自带一些标准设备的驱动程序，并且定义了统一的设备驱动程序框架；某些操作系统除了通过（例如VxWorks）标准驱动程序接口访问硬件之外，也允许应用程序绕过操作系统直接访问硬件；C选项叙述错误，本题答案为C。","code":0},{"id":"1879","paper":"真考试卷30","no":34,"type":"单项选择题","q":"下列名词中，不属于嵌入式底层软件的是：","o":["RTEMS","LILO","U-Boot","PMON"],"a":"A","e":"嵌入式底层软件主要包括引导加载程序(Bootloader, 如LILO、U-Boot等)和性能监测程序(Performance Monitor, PMON)等。而RTEMS(Real Time Executive for Multiprocessor Systems, 实时多处理器系统执行环境)是一种实时操作系统，主要用于嵌入式系统的开发和测试。因此，RTEMS不属于嵌入式底层软件。","code":0},{"id":"1880","paper":"真考试卷30","no":35,"type":"单项选择题","q":"下列关于实时与嵌入式操作系统的陈述中，不正确的是：","o":["评价实时系统的实时性最重要的指标是响应时间","MontaVista Linux是在原始免费型操作系统软件的基础上进行包装和优化的商业嵌入式Linux发行版","μC/OS属于商业操作系统，但只收取每种产品一次性费用，不收取版权费","实时系统应保证负荷均匀，不允许出现有时负载重、有时负载轻的情况"],"a":"D","e":"实时系统是一种能够在指定或者确定的时间内完成系统功能和外部或内部、同步或异步时间做出响应的系统。为了保证其高效运行，实时系统需要保证负荷均匀，避免有时负载重、有时负载轻的情况；\n由此可知D选项叙述错误，本题答案为D。","code":0},{"id":"1881","paper":"真考试卷30","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，不正确的是：","o":["VxWorks操作系统采用微内核结构，内核仅提供多任务环境、任务间通信和同步功能","强稳定性和弱交互性是嵌入式操作系统的突出特点","VxWorks和QNX操作系统均采用纯粹微内核结构","Nucleus PLUS是专门为硬件资源极为有限的无线传感器网络应用而量身定制的开源嵌入式操作系统"],"a":"D","e":"Nucleus PLUS是为实时嵌入式应用而设计的一个抢先式多任务操作系统内核，其95％的代码是用ANSI C写成的，因此非常便于移植并能够支持大多数类型的处理。在典型的目标环境中，Nucleus PLUS核心代码区一般不超过20K字节大小，NucleusPLUS采用了软件组件的方法，每个组件具有单一而明确的目的，通常由几个C及汇编语言编写。\nD选项叙述错误，本题答案为D。","code":0},{"id":"1882","paper":"真考试卷30","no":37,"type":"单项选择题","q":"下列关于Linux操作系统实时化技术的陈述中，不正确的是：","o":["嵌入式Linux发行版产品在通用Linux内核基础上进行了嵌入式改造，主要侧重的是小型化和实时性增强","RTLinux实时操作系统采用双内核方式","MontaVista Linux是采用超微内核的嵌入式操作系统","双内核方式的优点是微内核可以提供硬实时支持。其缺点是微内核与标准Linux内核共存"],"a":"C","e":"MontaVista Linux采用抢占优先级内核技术，结合MontaVista自身的硬实时技术，具有更短的抢占延迟，性能远远高于通用Linux内核；C选项叙述错误，本题答案为C。","code":0},{"id":"1883","paper":"真考试卷30","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的说法中，不正确的是：","o":["函数OSTaskCreate()和OSTaskCreateExt()都可以创建任务","函数OSQAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用","函数OSSemDel()用于删除一个信号量。删除信号量之前，必须首先删除操作该信号量的所有任务","在基于μC/OS-II的多任务系统中，不使用主函数main()"],"a":"D","e":"在基于μC/OS-II的多任务系统中，引导加载程序执行完毕则调用主函数main( );主函数main( )实现的功能主要包括：硬件初始化，调用OSInit( )初始化μC/OS-II内核，创建任务间通信或同步的内核对象，应用程序相关的初始化操作，调用OSStart( )启动多任务调度等；D选项叙述错误，本题答案为D。","code":0},{"id":"1884","paper":"真考试卷30","no":39,"type":"单项选择题","q":"下面的说法中，正确的是：","o":["嵌入式系统设计阶段的任务只是确定系统的硬件结构。","嵌入式系统的开发工具包括编译器、调试器，但不包括仿真器。","JTAG调试技术能支持裸机环境下硬件调试。","开发工具ADS1.2中的地址映射关系只能采用scatter格式的文件来确定。"],"a":"C","e":"嵌入式系统设计阶段的任务是确定系统的硬件结构和软件结构；嵌入式系统的开发工具包括编译器、调试器和仿真器等；ADS1.2中的地址映射关系可以采用scatter格式的文件来确定，也可以采用文本方式；故本题选择C。","code":0},{"id":"1885","paper":"真考试卷30","no":40,"type":"单项选择题","q":"下面的说法中，正确的是：","o":["嵌入式WEB服务器通常是嵌入在各类智能设备中。","嵌入式WEB服务器只能用于管理远程的设备，不能用于控制和操作远程设备。","嵌入式WEB服务器不能向远程客户提供运行状态等信息。","嵌入式WEB服务器与通用WEB服务器的功能（或作用）是一样的。"],"a":"A","e":"嵌入式WEB服务器通常是嵌入在各类智能设备中，它拥有类似于PC作为服务器提供多种服务的强大功能，同时具有体积小、成本低、移动性强等优点；嵌入式WEB服务器不仅能用于管理远程的设备，还能控制和操作远程设备。例如，Boa就是一个小巧高效的web服务器，运行于unix或linux下，支持CGI的、适合于嵌入式系统的单任务的http服务器，源代码开放、性能高；嵌入式WEB服务器可以向远程客户提供运行状态等信息。例如，Lighttpd是一个开源轻量级嵌入式Web server，是提供一个专门针对高性能网站，安全、快速、兼容性好并且灵活的web server环境；由于嵌入式WEB服务器和通用WEB服务器的使用环境和目标不同，它们在功能上可能会有所差异。例如，嵌入式WEB服务器通常是单进程的，无法并发响应每个访问连接并开启多个进程。由此可知A选项叙述正确，本题答案为A。","code":0},{"id":"1908","paper":"真考试卷31","no":1,"type":"单项选择题","q":"下面四个选项中不属于嵌入式系统的选项是：","o":["SD卡","电子秤","路由器","智能手机"],"a":"A","e":"嵌入式系统是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统，B、C、D选项都属于嵌入式系统，而A选项中SD卡是一种基于Flash的新一代记忆设备，不属于嵌入式系统，本题答案为A选项。","code":0},{"id":"1909","paper":"真考试卷31","no":2,"type":"单项选择题","q":"嵌入式系统的输入/输出设备种类繁多，按其服务对象可分为用于人机交互的设备和用于机机交互的设备两大类，下面四种设备中，属于人机交互的设备是：","o":["系统中的传感器","系统中的打印机","系统中的继电器","系统中的步进电机"],"a":"B","e":"用于人机交互的设备如键盘、触摸屏、打印机等，是用户界面的硬件部分；用于机机交互的设备包括各种类型的传感器和各种伺服执行机构（继电器、微电机、步进电机等）。所以B选项属于人机交互的设备，本题答案为B选项。","code":0},{"id":"1910","paper":"真考试卷31","no":3,"type":"单项选择题","q":"下面是关于嵌入式系统中采用的处理器产品叙述，其中错误的是：","o":["微处理器不能用作嵌入式系统中的处理器","微控制器（单片机）可以用作嵌入式系统中的处理器","数字信号处理器（DSP）可以用作嵌入式系统中的处理器","目前，许多高端嵌入式系统都使用SoC"],"a":"A","e":"微处理器是一种可编程的多用途器件，可以使用在PC之类的通用计算机之中，但更多的是应用于嵌入式系统，A选项中微处理器可以用作嵌入式系统中的处理器，本题答案为A选项。","code":0},{"id":"1911","paper":"真考试卷31","no":4,"type":"单项选择题","q":"按软硬件技术复杂程度的不同，可以把嵌入式系统分为低端系统、中端系统和高端系统，下面关于这三类系统的叙述中，错误的是：","o":["高端系统采用32位/64位处理器，支持网络连接","高端系统采用的操作系统功能比较齐全，使用图形用户界面，用户软件可更新和扩展","中端系统使用小型嵌入式操作系统，应用程序规模较小，用户界面比较简单","低端系统内部常采用4位单片机，一般不采用8位单片机；中端系统内部常采用8位/16位单片机，一般不采用32位处理器"],"a":"D","e":"低端系统采用4位/8位单片机，中端系统采用8位/16位单片机或32位处理器，所以D选项叙述错误，本题答案为D选项。","code":0},{"id":"1912","paper":"真考试卷31","no":5,"type":"单项选择题","q":"下列符号中，包含于ASCII字符集中的是：","o":["日文片假名","注音符号","拉丁字母","希腊字母"],"a":"C","e":"基本的ASCII字符集共用128个字符，包括96个可打印字符（常用的拉丁字母、阿拉伯数字、标点符号等）和32个控制字符，每个字符使用7个二进制位进行编码。因此，本题答案为C选项。","code":0},{"id":"1913","paper":"真考试卷31","no":6,"type":"单项选择题","q":"下列各文件格式中，属于图像文件格式的是：","o":["APE","MPEG","pdf","PNG"],"a":"D","e":"A选项APE是音频文件格式，B选项MPEG是视频文件格式，C选项pdf是文本文件格式，D选项PNG是图像文件格式，本题答案为D选项。","code":0},{"id":"1914","paper":"真考试卷31","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，正确的是：","o":["WAV是一种无损压缩的音频文件格式","GIF是一种有损压缩图像文件格式","电话数字语音的频率范围是20~20000Hz","一幅图像的数据量可按下面的公式计算：图像数据量（字节）＝图像水平分辨率×图像垂直分辨率×像素深度/8"],"a":"D","e":"A选项WAV是一种未压缩的音频文件格式，B选项GIF是一种无损压缩图像文件格式，C选项电话数字语音的频率范围是300~3400Hz，D选项叙述正确，本题答案为D选项。","code":0},{"id":"1915","paper":"真考试卷31","no":8,"type":"单项选择题","q":"关于IP地址，以下说法正确的是： \n①IPv4的IP地址分为A类、B类和C类3个基本类\n②IPv4的A类IP地址中网络的标识长度为8位,主机标识的长度为24位\n③IPv4的B类IP地址中网络的标识长度为16位,主机标识的长度为16位\n④IPv4的C类IP地址中网络的标识长度为24位,主机标识的长度为8位\n⑤IPV4的IP地址还有组播地址D类和备用地址E类","o":["①②④","①③⑤","①②③④","①②③④⑤"],"a":"D","e":"IPv4地址分为A类、B类、C类3个基本类，每类有不同长度的网络号和主机号，A类IP地址中网络的标识长度为8位,主机标识的长度为24位，B类IP地址中网络的标识长度为16位,主机标识的长度为16位，C类IP地址中网络的标识长度为24位,主机标识的长度为8位，另有两类D类和E类分别作为组播地址和备用地址，本题答案为D选项。","code":1},{"id":"1916","paper":"真考试卷31","no":9,"type":"单项选择题","q":"对于ARM处理器，如果指令中能用16位编码尽量用16位编码，如果不能用16位编码则才采用32位编码，应该选择的指令集是：","o":["ARM指令集","Thumb指令集","Thumb-2指令集","ARM+Thumb指令集"],"a":"C","e":"ARM指令集全部是32位的指令，Thumb全部是16位字长的指令，可以看作是ARM指令的压缩形式，Thumb-2指令集即可有16位指令又有32位指令，是一个混合的指令集。因此，本题答案为C选项。","code":0},{"id":"1917","paper":"真考试卷31","no":10,"type":"单项选择题","q":"关于ARM Cortex处理器以下说法错误的是：","o":["具有Thumb指令集","NVIC为嵌套向量中断控制器","WIC为唤醒中断控制器","DWT为数据观察点及跟踪器"],"a":"A","e":"ARM Cortex处理器都是32位的RISC处理器，采用流水线技术，它只支持Thumb-2指令集的子集。因此，本题答案为A选项。","code":0},{"id":"1918","paper":"真考试卷31","no":11,"type":"单项选择题","q":"关于ARM处理器工作模式（除ARM Cortex处理器）以下说法正确的是：","o":["上电复位后，ARM处理器自动处于管理模式","当有存储器故障时，ARM处理器自动进入未定义指令模式","当有快速中断时，ARM处理器自动进入外部中断模式","ARM工作模式可以进行相互转换，但是是有条件的"],"a":"D","e":"A选项中除ARM Cortex处理器，所有ARM处理器复位后开始执行代码时总是只处于ARM状态；B选项中当有存储器故障时，ARM处理器自动进入中止模式；C选项中当有快速中断时，ARM处理器自动进入快速中断模式；D选项叙述正确，本题答案为D选项。","code":0},{"id":"1919","paper":"真考试卷31","no":12,"type":"单项选择题","q":"ARM处理器程序状态寄存器格式如下所示：\n下面指令序列允许外部中断，正确的是：","o":["MRS R2,CPSR\nORR R2,R2,#0x80\nMSR CPSR,R2","MRS R2,CPSR\nBIC R2,R2,#0x80\nMSR CPSR,R2","MRS R2,CPSR\nAND R2,R2,#0x80\nMSR CPSR,R2","MRS R2,CPSR\nORR R2,R2,#7\nMSR CPSR,R2"],"a":"B","e":"程序状态寄存器格式如下\n\n \nI为中断禁止控制位，I=1禁止外部IRQ中断，I=0允许IRQ中断\nA选择中MRS指令用于传送CPSR的内容到通用寄存器R2中，接下来使用ORR指令将R2与0x80按位或，R2的第7位为1，其余位保持不变，最后再用MSR指令将修改后的R2内容传送回CPSR；\nB选项中MRS指令用于传送CPSR的内容到通用寄存器R2中，接下来使用BIC指令清除R2中的第7位，R2的第7位为0，其余位保持不变，最后再用MSR指令将修改后的R2内容传送回CPSR；\nC选项中MRS指令用于传送CPSR的内容到通用寄存器R2中，接下来使用AND指令将R2与0x80按位与，因不知R2的值，所以R2的第7位不确定，其余位保持不变，最后再用MSR指令将修改后的R2内容传送回CPSR；\nD选项中MRS指令用于传送CPSR的内容到通用寄存器R2中，接下来使用ORR指令将R2与7按位或，R2的第0,1,2位为1，其余位保持不变，最后再用MSR指令将修改后的R2内容传送回CPSR；\n故B选项符合题意，本题答案为B选项。","code":1},{"id":"1920","paper":"真考试卷31","no":13,"type":"单项选择题","q":"关于ARM指令的条件域，以下说法错误的是：","o":["条件域中有16种条件码，只有15种可用","通常使用CMP指令产生条件","AL表示无条件执行","LE表示无符号数小于或等于"],"a":"D","e":"LE表示带符号数小于或等于，故D选项叙述错误，本题答案为D选项。","code":0},{"id":"1921","paper":"真考试卷31","no":14,"type":"单项选择题","q":"ARM处理器内部与存储器直接相关的部件有： \n①TPIU ②MPU   ③MMU      ④NVIC    ⑤WIC  ⑥Cache  ⑦ETM","o":["②  ③","②  ③  ⑤","②  ③  ⑥","⑤  ⑦"],"a":"C","e":"TPIU是跟踪端口接口单元，MPU是存储器保护单元，MMU是存储器管理单元，NVIC是嵌套向量中断控制器，WIC是唤醒中断控制器，Cache是高速缓冲存储器，ETM是嵌入式跟踪宏单元与存储器直接相关的部件有MPU、MMU和Cache，本题答案为C选项。","code":1},{"id":"1922","paper":"真考试卷31","no":15,"type":"单项选择题","q":"对于经典ARM的异常，以下说法错误的是：","o":["发生复位异常后，PC＝0x00000004","快速中断FIQ的优先级高于外部中断IRQ","读不存在的存储器地址中的数据时，将产生数据中止异常","发生异常时，断点地址自动存放在链接LR中"],"a":"A","e":"发生复位异常后，复位异常的优先级最高，因此在任何情况下只要进入复位状态，系统便无条件地将PC指向0x00000000处，故A选项叙述错误，本题答案为A选项。","code":0},{"id":"1923","paper":"真考试卷31","no":16,"type":"单项选择题","q":"对于ARM处理器，假设程序是顺利执行的结构，以下说法错误的是：","o":["在Thumb状态下，每执行1000条执行，PC值一定自动加2000","在Thumb-2状态下，每执行1000条执行，PC值一定自动加4000","在ARM状态下，每执行1000条执行，PC值一定自动加4000","当处理器停机调试时进入调试状态"],"a":"B","e":"ARM处理器在不同状态下的指令长度不同，导致程序计数器PC的增量也不同，Thumb状态下每条指令长度为16位（即2字节），因此每执行一条指令，PC值增加2。执行1000条指令，PC值增加1000 × 2 = 2000，A选项说法正确；Thumb-2状态支持16位和32位混合指令集。其指令长度不固定，可以是16位或32位。因此，执行1000条指令时，PC值的增量不一定是4000（即1000 × 4），因为其中可能包含部分16位指令，B选项说法错误；ARM状态下每条指令长度为32位（即4字节），因此每执行一条指令，PC值增加4。执行1000条指令，PC值增加1000 × 4 = 4000，C选项说法正确；当处理器进入停机调试模式时，确实会进入调试状态，D选项说法正确；综上所述，B选项说法错误，本题答案为B选项。","code":0},{"id":"1924","paper":"真考试卷31","no":17,"type":"单项选择题","q":"如果要读取内存地址为0x39000604开始的32位数据到R1中，则以下指令序列正确的是：","o":["LDR R0,=0x39000600\nSTR R1,[R0],#4","LDR R1,=0x08000600\nSTR R1,[R0,#4]","LDR R0,=0x39000600\nLDR R1,[R0,#4]","LDR R0,=0x39000600\nLDR R1,[R0],#4"],"a":"C","e":"A选项使用LDR指令将0x08000600读入寄存器R0，接下来使用STR指令将R1中的字数据写入以R0为地址的存储器中，并将新地址R0+4写入R0；B选项使用LDR指令将0x08000600读入寄存器R1，接下来使用STR指令将R1中的字数据写入以R0+4为地址的存储器中；C选项使用LDR指令将0x08000600读入寄存器R0，接下来使用LDR指令将R0+4指示的存储器中的字数据读入寄存器R1中；D选项使用LDR指令将0x08000600读入寄存器R0，接下来使用LDR指令由R0指示的存储器的字数据读入寄存器R1，并将新地址R0+4写入R0中；故C选项符合题意，本题答案为C选项。","code":0},{"id":"1925","paper":"真考试卷31","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，已知R1=0x4D3C2B1A,R2=0x12345678,R5=0,则指令序列如下：\nmemtep equ    0x3C001000    \n               LDR R5,=memtep\n               STR  R1,[R5]\n               LDRB  R2,[R5,#2]！\n以上指令序列执行后，以下说法正确的是：\n①R2=0x0000003C     ②R2=0x00004D3C\n③R2=0x2B1A4D3C    ④内存中的值保持不变\n⑤R1中的值保持不变    ⑥R5=0x3C001002\n⑦R5中的值保持不变","o":["① ④","① ⑤ ⑥","② ⑤ ⑦","② ⑤ ⑥ ⑦"],"a":"B","e":"首先定义标号memtep的值为0x3C001000，接下来使用LDR指令将memtep指示的存储器中的字数据读入寄存器R5，之后使用STR指令将R1中的字数据写入以R5为地址的存储器中，最后使用LDRB在指令将R5+2指示的存储器中的字节数据读入寄存器R2，R2的高24位清零，并将新地址R5+2写入R5。由于是小端模式下，R2的值为0x0000003C，R5的值为0x3C001002，R1的值保存不变，故① ⑤ ⑥说法正确，本题答案为B选项。","code":1},{"id":"1926","paper":"真考试卷31","no":19,"type":"单项选择题","q":"下面是关于嵌入式系统常用的电源模块的叙述，其中错误的是：","o":["AC-DC模块是交流变直流电源模块","DC-DC模块是直流到直流电源模块","78xx系列是一种AC-DC模块","LDO是低压差稳压器"],"a":"C","e":"78XX系列属于普通稳压器，故C选项叙述错误，本题答案为C选项。","code":0},{"id":"1927","paper":"真考试卷31","no":20,"type":"单项选择题","q":"下面是关于嵌入式处理器时钟电路的叙述，其中错误的是：","o":["大多数嵌入式处理器内置了时钟信号发生器","大多数嵌入式处理器不能使用外部时钟信号源为其提供工作时所需的时钟信号","嵌入式处理器的功耗与嵌入式系统时钟电路的工作频率有关","嵌入式处理器的运行速度与嵌入式系统时钟电路的工作频率有关"],"a":"B","e":"大多数嵌入式处理器内置了时钟信号发生器，因此时钟电路只需要外接一个石英晶体震荡器和两只电容就可以工作了。但有些场合（如为了减少功耗、需要严格同步等）需要使用外部震荡源提供时钟信号。故B选项叙述错误，本题答案为B选项。","code":0},{"id":"1928","paper":"真考试卷31","no":21,"type":"单项选择题","q":"下面是关于嵌入式系统复位的叙述，其中正确的是：","o":["嵌入式处理器的复位信号需采用基于阻容器件设计的复位电路产生，目前还没有为嵌入式处理器提供复位信号的专用的处理器复位芯片","嵌入式系统复位后，不能通过在其复位引脚施加有效的复位信号使系统再次复位","经典ARM处理器复位后其PC指针指向唯一的地址0x00000000","若嵌入式处理器的复位引脚为nRESET，为使嵌入式处理器可靠复位，需在该引脚施加高电平的复位信号"],"a":"C","e":"目前嵌入式系统常使用外接典型复位芯片以保证系统能可靠复位，A选项叙述错误；嵌入式系统复位后，可以通过在其复位引脚施加有效的复位信号使系统再次复位，B选项叙述错误；ARM复位后PC指针指向唯一的地址0x00000000，C选项叙述正确；一般情况下，nRESET必须至少保持若干个处理器时钟周期的低电平，系统才能可靠复位，D选项叙述错误；因此，本题答案为C选项","code":0},{"id":"1929","paper":"真考试卷31","no":22,"type":"单项选择题","q":"下面关于典型嵌入式系统硬件组成的叙述中，错误的是：","o":["典型嵌入式系统的前向通道一般由模拟输入接口和数字输入接口组成","以太网通信接口属于相互互联通道","CAN通信接口属于相互互联通道","键盘输入接口属于相互互联通道"],"a":"D","e":"键盘输入接口属于人机交互通道，D选项叙述错误，本题答案为D选项。","code":0},{"id":"1930","paper":"真考试卷31","no":23,"type":"单项选择题","q":"下面是关于ARM的AMBA总线的叙述，其中错误的是：","o":["AMBA规定了两种总线类型——系统总线和外围总线","系统总线与高速系统组件相连","包括高速高性能外围组件在内的所有外围接口均与外围总线相连","AMBA即先进微控制器总线体系结构"],"a":"C","e":"基于AMBA总线的处理器使用系统总线和外围总线构成来连接高速系统组件和低速外围组件，高带宽高性能外围接口通常连接系统总线，而速度不高的外部接口连接外围总线，故C选项叙述错误，本题答案为C选项。","code":0},{"id":"1931","paper":"真考试卷31","no":24,"type":"单项选择题","q":"易失性存储器在没有电源供电的情况下不能保存数据，下述存储器中，属于易失性存储器的选项是：","o":["SRAM","MRAM","FRAM","Flash ROM"],"a":"A","e":"SRAM是静态随机存取存储器，属于易失性存储器；MRAM是一种非挥发性（或非易失性）的磁性随机存储器；FRAM是铁电存储器，具有非易失性特征，同时克服非易失存储器写入速度慢且写入次数有限等缺点；Flash ROM是闪速（闪烁）存储器，属于非易失存储器。A选项符合题意，本题答案为A选项。","code":0},{"id":"1932","paper":"真考试卷31","no":25,"type":"单项选择题","q":"下面关于I2C总线操作时序的叙述中，错误的是：","o":["I²C总线高速模式的通信速率可达3.4Mb/s","I²C总线只有SDA和SCL两条信号线","I²C总线是主从总线，一个总线段内只有一个事先确定的主控器件","I²C总线传输数据时，高位在前、低位在后，每次传输的字节数目没有限制"],"a":"C","e":"I2C总线属于多主总线，即允许总线上一个或多个主控器件和若干器件同时进制操作，故C选项叙述错误，本题答案为C选项。","code":0},{"id":"1933","paper":"真考试卷31","no":26,"type":"单项选择题","q":"下面是关于常用通信标准或通信接口的叙述，其中错误的是：","o":["SPI是一种同步串行接口","CAN采用异步通信方式","UART是一种通用异步接收器/发送器","USB 2.0采用同步通信方式"],"a":"D","e":"USB 2.0采用半双工差分方式，故D选项叙述错误，本题答案为D选项。","code":0},{"id":"1934","paper":"真考试卷31","no":27,"type":"单项选择题","q":"下面是关于嵌入式系统中的看门狗定时器的叙述，其中错误的是：","o":["WDT即为看门狗定时器","嵌入式系统中看门狗定时器的作用是，一旦由于某种原因使系统程序跑飞，看门狗定时器将强行使系统重新复位","S3C2410内部的看门狗定时器是一个加法定时器","S3C2410内部看门狗定时器的计数脉冲周期为：t_watchdog=1／(PCLK／(预分频值+１)／分频系数)"],"a":"C","e":"S3C2410内部的看门狗定时器的基本原理是把输入时钟信号两次分频之后得到计数脉冲，在写入的计数初值基础上就开始不断减1计数，等计数完毕到0时，就会产生一个系统复位信号，强行使系统复位，使ARM从0地址开始执行程序，即S3C2410内部的看门狗定时器是一个倒计时定时器。故C选项叙述错误，本题答案为C选项。","code":0},{"id":"1935","paper":"真考试卷31","no":28,"type":"单项选择题","q":"下面是关于嵌入式系统中的PWM Timer的叙述，其中错误的是：","o":["PWM即脉冲宽度调制","PWM信号的周期及其占空比在一个比较宽的范围内都是可调的","S3C2410内部可用作PWM输出的Timer是32位计数器","S3C2410内部有不止一个计数器可用作PWM Timer"],"a":"C","e":"S3C2410内部有5个16位定时器Timer，有4个具备PWM输出，故C选项叙述错误，本题答案为C选项。","code":0},{"id":"1936","paper":"真考试卷31","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，不正确的是：","o":["简单的轮询结构的优点是程序结构简单，便于编程，但由于引入了中断机制，因而会出现程序随机切换带来的潜在问题","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销","系统软件、应用软件与系统的硬件一体化，相互关系密切"],"a":"A","e":"简单的轮询结构的优点是程序结构简单，便于编程。由于没有中断机制，因而不会出现程序随机切换带来的潜在问题。故A选项叙述错误，本题答案为A选项。","code":0},{"id":"1937","paper":"真考试卷31","no":30,"type":"单项选择题","q":"下列关于bootloader的描述中，不正确的是：","o":["不同的bootloader程序功能不同，但都需要支持核心的引导（boot）和加载（load）操作系统等基本功能","大多数从Flash存储器上启动的bootloader程序采用两阶段执行过程","在RAM中运行操作系统代码比在ROM中直接运行操作系统代码取指令的速度更高","bootloader不仅包含引导加载程序，还包含操作系统映像、应用程序代码和用户配置数据等信息"],"a":"D","e":"bootROM内不仅存储引导加载程序，还存储操作系统映像、应用程序代码和用户配置数据等信息。故D选项叙述错误，本题答案为D选项。","code":0},{"id":"1938","paper":"真考试卷31","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，不正确的是：","o":["BSP的特点是既有硬件相关性，又有操作系统相关性","BSP加载操作系统后，操作系统为软件系统提供多任务的运行环境，创建应用程序的运行实例","BSP在系统上电复位之前负责系统初始软硬件环境的建立，一般应包含硬件的初始化、数据的输入/输出操作、硬件设备的配置操作等功能。","在初始化必要的硬件环境之后，BSP还需要进行系统级的初始化"],"a":"C","e":"BSP在系统上电复位之后负责软硬件环境的建立，一般应包含硬件的初始化、数据的输入/输出操作、硬件设备的配置操作等功能。故C选项叙述错误，本题答案为C选项。","code":0},{"id":"1939","paper":"真考试卷31","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["Bootloader只能被高层软件调用而无法自行运行","在大多数嵌入式系统中，bootROM仅存储bootloader程序，不存储操作系统映像、应用程序代码和用户配置数据等信息","在启动加载（bootloading）模式下，bootloader通过通信端口从调试主机上下载操作系统映像，暂存到RAM中，然后将其烧录到flash ROM等非易失性存储器中","bootROM是用来存储bootloader程序的非易失存储器"],"a":"D","e":"Bootloader可以自行运行，在嵌入式系统上电复位后首先运行Bootloader，A选叙述错误；在大多数嵌入式系统中，bootROM内不仅存储bootloader程序，还存储操作系统映像、应用程序代码和用户配置数据等信息，B选项叙述错误；在下载模式下，bootloader通过通信端口从调试主机上下载操作系统映像，暂存到RAM中，然后将其烧录到flash ROM等非易失性存储器中，C选项叙述错误；一般而言，bootROM是指用来存储bootloader程序的非易失存储器，D选项叙述正确，本题答案为D选项。","code":0},{"id":"1940","paper":"真考试卷31","no":33,"type":"单项选择题","q":"下列嵌入式操系统中，只包括操作系统内核、不包括设备驱动程序的是：","o":["Linux和Unix","μC/OS-II","VxWorks和Linux","WinCE"],"a":"B","e":"一些小型的嵌入式操作系统（如μC/OS-II）往往只包括操作系统内核，不包括设备驱动程序，而且编写设备驱动程序也没有定义统一的框架；在WinCE、Linux和VxWorks等大型嵌入式操作系统中，往往自带一些标准设备的驱动程序，并定义了统一的设备驱动程序框架；Linux等类Unix操作系统还会把I/O设备抽象成设备文件，本题答案为B选项。","code":0},{"id":"1941","paper":"真考试卷31","no":34,"type":"单项选择题","q":"下列名词中，属于嵌入式底层软件的是：","o":["OpenGL","MontaVista","LILO","RTAI"],"a":"C","e":"OpenGL是一个用于渲染2D、3D图形的跨语言、跨平台的应用程序编程接口（API），不属于嵌入式底层软件；MontaVista是MontaVista Software于1999年开始推出的专门面向嵌入式系统的商业操作系统，不属于嵌入式底层软件；LILO是Linux引导加载器（Linux Loader）的缩写，是一个启动加载程序，用于在计算机启动时加载Linux内核，属于嵌入式底层软件的一部分；RTAI即实时应用程序接口（Real-Time Application Interface）是对Linux内核的硬实时扩展；本题答案是C选项。","code":0},{"id":"1942","paper":"真考试卷31","no":35,"type":"单项选择题","q":"下列关于实时与嵌入式操作系统的陈述中，不正确的是：","o":["实时操作系统以在给定时间内完成更多的任务为目标","重负载甚至超负荷的情况下，某些关键任务一定要得到服务","单内核结构的操作系统把内核的各个功能模块整合在一起，模块间的交互通过直接调用其他模块中的函数来实现","实时系统的负荷并不一定是均匀的，有时负载重，有时负载轻"],"a":"A","e":"实时系统是必须在有限和确定的时间内对外部事件作出响应的信息系统，故A选项叙述错误，本题答案为A选项。","code":0},{"id":"1943","paper":"真考试卷31","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的体系结构的陈述中，不正确的是：","o":["WindowsCE和安卓操作系统都属于宏内核结构","整体结构的操作系统的最大缺点就是模块之间相互关联，耦合度很高，结构不清晰","宏内核结构分为单体结构和分层结构两种","微内核结构的中断处理功能在内核之外，由在用户态运行的服务来完成"],"a":"D","e":"操作系统仅将必需的基本功能（如任务调度、任务间通信、低级存储管理、中断处理等）放入内核，它们都运行在核心态；其它功能都在内核之外，由用户态运行的服务来完成，这样的称为微内核结构，故D选项叙述错误，本题答案为D选项。","code":0},{"id":"1944","paper":"真考试卷31","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务的陈述中，不正确的是：","o":["只要有其他任务就绪，空闲任务的处理器时间就会被抢占","当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转入等待态","μC/OS-II是抢占式实时内核，在任意时刻都可能发生任务调度","μC/OS-II的任务代码实际上是一个没有返回值的C函数"],"a":"B","e":"等待态是正在运行的任务因等待某一事件发生而将处理器的使用权出让给其它任务而将自身挂起的状态。等待的事件可以是外设的I/O操作、事件信号量、共享资源被释放、超时时间到达等。而当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转入被中断态。故B选项叙述错误，本题答案为B选项。","code":0},{"id":"1945","paper":"真考试卷31","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，不正确的是：","o":["每个任务都有自己独立的栈空间，用于保存任务的工作环境","周期执行的任务一般采用循环结构，并在每次完成具体功能后调用系统延时函数OSTimeDly()或OSTimeDlyHMSM()等待下一个执行周期，并将处理器时间让给其他任务","函数OSMboxPost()通过邮箱向任务发送一条消息，如果邮箱中已经保留着没有被接收的消息，函数立即返回","函数OSTaskResume()实现退出临界状态的操作"],"a":"D","e":"函数OSTaskResume()是用于恢复被挂起的任务，故D选项叙述错误，本题答案为D选项。","code":0},{"id":"1946","paper":"真考试卷31","no":39,"type":"单项选择题","q":"下面语句中，正确的是：","o":["测试与调试既有联系又有区别。其中，调试的目的是验证模块/系统的功能和性能。","在嵌入式系统的开发中，只需要借助软件调试工具，就能准确地定位软件和硬件中出现的错误。","软件调试工具的任务是控制程序代码的执行并使系统中看不见的信息成为可视。","嵌入式系统的开发中，仅需要对软件的正确性进行调试。"],"a":"C","e":"测试与调试既有联系又有区别，测试的目的是验证模块/系统的功能和性能，发现错误；调试的任务是分析测试中发现的错误，检查原因，定位故障（错误）位置，采取适当的措施，修改软件/硬件，然后返回重新进行测试；A选项叙述错误；在开发嵌入式系统时，要想准确地定位软件和硬件中出现的错误是非常困难的，必须借助多种硬件和软件调试工具，B选项和D选项叙述错误；软件调试工具的任务是控制程序代码的执行并使系统中看不见的信息成为可视，C选项叙述正确，本题答案为C选项。","code":0},{"id":"1947","paper":"真考试卷31","no":40,"type":"单项选择题","q":"下面的说法中，错误的是：","o":["在ADS1.2的集成开发环境中，设计者所设计的一个工程项目中只能包含源文件。","ADS1.2工具生成一个能在目标机上运行的输出文件时，需要配置一些生成选项参数，如：编译器选项、汇编器选项和连接器选项等。","设计者利用ADS1.2工具来进行地址映射时，需要结合实际目标机上的硬件地址空间，指明程序中各段将被存储的区域基址。","ADS1.2把被编译后的目标文件中的信息按照RO段、RW段、ZI段三种存储区域类型来划分。"],"a":"A","e":"在ADS 1.2的集成开发环境中，设计者所设计的嵌入式应用程序的源文件、库文件、头文件以及其它的输入文件，均以一个工程项目的形式进行管理，A选项叙述错误，本题答案为A选项。","code":0},{"id":"1969","paper":"真考试卷32","no":1,"type":"单项选择题","q":"下面四个选项中不属于嵌入式系统的选项是：","o":["自动柜员机（ATM）","机顶盒","集线器","TF卡（micro SD卡）"],"a":"D","e":"嵌入式系统是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统。所以自动柜员机（ATM）、机顶盒、集线器属于嵌入式系统，而TF卡是一种存储设备，用于存储数据，不属于嵌入式系统。故本题答案为D选项。","code":0},{"id":"1970","paper":"真考试卷32","no":2,"type":"单项选择题","q":"下面列出的四个选项中，不属于嵌入式系统特点的选项是：","o":["专用性","高可靠性","软硬件资源、体积、功耗不受限制性","实时性"],"a":"C","e":"嵌入式系统特点包含专用性、隐蔽性、资源、体积和功耗受限、高可靠性、实时性等等，因此C选项不属于嵌入式系统特点，故本题答案为C选项。","code":0},{"id":"1971","paper":"真考试卷32","no":3,"type":"单项选择题","q":"嵌入式系统的输入/输出设备种类繁多，按其服务对象可分为用于人机交互的设备和用于机机交互的设备两大类，下面四种设备中，不属于人机交互的设备是：","o":["系统中的按键","系统中的液晶显示器","系统中的触摸屏","系统中的温度和湿度传感器"],"a":"D","e":"用于人机交换的设备：如按键、键盘、触摸板、触摸屏、液晶显示器、打印机等，它们是用户界面的硬件部分；用于机机交互的设备包括各种类型的传感器和各种伺服执行机构等，故本题答案为D选项。","code":0},{"id":"1972","paper":"真考试卷32","no":4,"type":"单项选择题","q":"下面是关于SoC设计相关的叙述，其中错误的是：","o":["SoC设计时的正确流程是：总体设计、逻辑设计、综合与仿真、芯片制造","IP核的复用可以减少SoC研发成本，缩短研发时间，是实现SoC快速设计，尽早投放市场的有效途径","按照IC设计文件的类型，IP核通常只分为软核和固核两种","SoC芯片中包含的CPU，它们绝大多数都是以IP核的方式集成在SoC芯片中， 很少自行单独设计开发"],"a":"C","e":"SoC芯片的开发流程大致可分为以下4个阶段：总体设计、逻辑设计、综合与仿真、芯片制造，所以A选项叙述正确；IP核是开发SoC的重要保证，IP核的复用可以减少研发成本，缩短研发时间，是实现SoC快速设计，尽早投放市场的有效途径，所以B选项叙述正确；按照IC设计文件的类型，IP核通常分为以下3种：软核、固核和硬核，所以C选项叙述错误；所有SoC芯片都包含CPU，它们绝大多数都是以IP核的方式集成在SoC芯片中，很少再自行设计开发，所以D选项叙述正确。综上所述，本题答案为C选项。","code":0},{"id":"1973","paper":"真考试卷32","no":5,"type":"单项选择题","q":"下列符号中，ASCII字符集中不包含的是：","o":["阿拉伯数字","控制字符","拉丁字母","希腊字母"],"a":"D","e":"ASCII字符集共有128个字符，包括96个可打印字符（常用是拉丁字母、阿拉伯数字、标点符号等）和32个控制字符，某个字符使用7个二进制位进行编码。ASCII字符集中不包含希腊字母，故本题答案为D选项。","code":0},{"id":"1974","paper":"真考试卷32","no":6,"type":"单项选择题","q":"下列各文件格式中，属于图像文件格式的是：","o":["PNG","FLAC","APE","MP3"],"a":"A","e":"常用图像文件格式有BMP、TIF、GIF、JPEG和PNG等；FLAC、APE和MP3都属于数字音频的文件格式，故本题答案为A选项。","code":0},{"id":"1975","paper":"真考试卷32","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，正确的是：","o":["如果3个颜色分量的像素位数分别为6位、6位和4位，则该图像的像素深度为16","GIF是一种有损压缩图像文件格式","电话数字语音的频率范围是20~20000Hz","测量每个取样点的每个分量的亮度值的过程称为量化"],"a":"A","e":"如果3个颜色分量的像素位数分别为6位、6位和4位，那么该图像的像素深度为6+6+4=16，所以A选项叙述正确；GIF是一种无损压缩图像文件格式，所以B选项叙述错误；电话数字语音的频率范围是300~3400Hz，所以C选项叙述错误；测量每个取样点的每个分量的亮度值的过程称为取样，量化是指对取样点每个分量的亮度值进行 A/D转换，即把模拟量使用数字量（一般是8 位至 12位的正整数）来表示，所以D选项叙述错误。综上所述，本题正确答案为A选项。","code":0},{"id":"1976","paper":"真考试卷32","no":8,"type":"单项选择题","q":"关于IP数据报，以下叙述错误的是：","o":["由头部和数据区两个部分组成","头部信息主要为了确定在网络中进行数据传输的路由","数据区长度可改变，最小1字节，最大64MB","头部信息包含有源IP地址和目的IP地址"],"a":"C","e":"IP数据报由两部分组成：头部和数据区。头部信息主要是为了确定在网络中进行数据传输的路由，内容包括发送数据报的终端设备的IP地址，接收数据报的终端设备的IP地址，IP协议的版本号，头部长度，数据报长度，服务类型等，所以A、B和D选项叙述正确；数据区的长度可以根据应用而改变，数据量最小的时候也许只有1B，最大的时候可以达到64KB（包括头部信息在内），所以C选项叙述错误；综上所述，本题答案为C选项。","code":0},{"id":"1977","paper":"真考试卷32","no":9,"type":"单项选择题","q":"某ARM处理器用汇编语言编写某程序段有1000条指令，占据了内存空间为2000字节，该处理器使用的工作状态为：","o":["调试状态","ARM状态","Thumb状态","复位状态"],"a":"C","e":"在调试状态下，处理器通常不执行常规的ARM或Thumb指令，而是进入一种特殊的模式以便于开发者进行调试和故障排查；在ARM状态下，处理器执行32位的字对齐的ARM指令；在Thumb状态下，处理器执行16位的半字对齐的Thumb指令；在复位状态下，ARM处理器总是只处于ARM状态，即执行32位的字对齐的ARM指令。根据题目描述，该程序段有1000条指令，占据了2000字节的内存空间，那么每条指令占用的内存空间为2字节（即16位）。因此，可以推断出这些指令是16位的Thumb指令。故本题答案为C选项。","code":0},{"id":"1978","paper":"真考试卷32","no":10,"type":"单项选择题","q":"在ARM处理器中，对于功耗要求比较严格且成本控制要求高的应用场合，采用最合适的ARM处理器是：","o":["ARM9","ARM Cortex-M0","ARM Cortex-R4","ARM Cortex-A15"],"a":"B","e":"ARM9系列处理器为微控制器、DSP和Java应用提供了单处理器解决方案，非常适合需要有数字信号处理功能的微控制器应用领域；\nARM Cortex-M0处理器是市场上现有的体积最小、能耗最低的ARM处理器；它使用的门电路数量很少，用户能以8位处理器的价格获32 位处理器的性能，促进了智能、低功耗微控制器的面市，并为物联网中大量无线设备提供了高效连接、管理和维护的支持；\nARM Cortex-R4核心是采用RMv7 -R 架构的处理器核ARMR4, 它支持ARM/Thumb- 2令集，代码密度高；使用硬件实现单指令多数据DSP ；具有可选的浮点运算器；使用8级流水线技术实ARM Cortex-A15适用于有高计算要求、需运行功能丰富的操作系统以及要求提供交互媒体和图形显示的应用领域；\n由此可知ARM Cortex-M0适用于功耗要求比较严格且成本控制要求高的应用场合，故本题答案为B选项。","code":0},{"id":"1979","paper":"真考试卷32","no":11,"type":"单项选择题","q":"决定ARM处理器返回后断点地址的寄存器是：","o":["R13","R14","R15","CPSR"],"a":"B","e":"在ARM处理器中，用于决定返回后断点地址的寄存器是R14，R13是堆栈指针，R15是程序计数器，CPSR是状态寄存器，故本题答案为B选项。","code":0},{"id":"1980","paper":"真考试卷32","no":12,"type":"单项选择题","q":"以下写外设数据的指令有：","o":["LDR R2,[R3]","STRH R7,[R6]","LDR R1,=0x40000200","MOV R3,R8"],"a":"B","e":"在ARM指令集中，用于写外设数据的指令通常涉及将数据移动到外设的内存映射地址。这些地址通常通过将数据加载到寄存器，然后使用那个寄存器的值作为地址来访问外设。A选项这条指令是从R3指向的内存地址读取数据到寄存器R2；B选项这条指令是将寄存器R7的值存储到R6指向的内存地址，且通常用于写半字（16位）到内存或外设；C选项这条指令是将立即数0x40000200加载到寄存器R1；D选项这条指令是将R8寄存器的值移动到R3寄存器；综上所述，本题答案为B选项。","code":0},{"id":"1981","paper":"真考试卷32","no":13,"type":"单项选择题","q":"关于经典ARM处理器异常种类，以下说法错误的是：","o":["当访问不存在存储器中数据时将产生数据访问中止异常","快速中断比外部中断优先级高","7种异常类别有7个优先级别","SWI是软件中断，优先级最低"],"a":"C","e":"如果异常类型是数据访问中止DABT，那么当数据访问指令的目标地址不存在或该地址不允许当前指令访问时，执行指令产生的异常，所以A选项叙述正确；经典ARM处理器异常类型有复位RESET、数据访问中止DABT、快速中断请求FIQ、外部中断请求IRQ、指令预取中止PABT、未定义的指令UND和软件中断SWI，7中类型的异常分成6类，优先级依次按照顺序由高到低，级别最高的是复位，最低的是未定义的指令UND和软件中断SWI；所以B和D选项叙述正确，C选项叙述错误，综上所述，本题答案为C选项。","code":0},{"id":"1982","paper":"真考试卷32","no":14,"type":"单项选择题","q":"关于ARM的存储器格式，以下说法错误的是：","o":["ARM有两种存储字的格式包括大端模式和小端模式","大端模式是指数据字的低字节存放在高地址的一种模式","小端模式是指数据字的低字节存放在低地址的一种模式","系统复位默认为大端模式"],"a":"D","e":"ARM体系结构可以用两种方法存储数据字，分别是大端模式和小端模式；在大端模式下，32位数据字的高字节存储在低地址中，而数据字的低字节则存放在高地址中；在小端模式下，32位数据字的高字节放在高地址，而低字节存放在低地址；系统复位时一般自动默认为小端模式，故本题答案为D选项。","code":0},{"id":"1983","paper":"真考试卷32","no":15,"type":"单项选择题","q":"执行ARM指令STR R7,[R6,#4]!后，以下说法正确的是：","o":["R6中的值保持不变","R7中的值保持不变","R6的内容左移了4位，相当于乘以16","内存中的数据没有改变"],"a":"B","e":"ARM指令STR R7,[R6,#4]!将寄存器R7中的值存储到R6指向的地址偏移4个字节的位置，并将新地址R6+4写入R6。这条指令改变了内存和R6的值，将R7的值存储到内存中，之后将R6的值加上4，不是进行左移操作，并且不会影响R7的值，所以A、C和D选项叙述错误，B选项叙述正确。","code":0},{"id":"1984","paper":"真考试卷32","no":16,"type":"单项选择题","q":"经典ARM程序状态寄存器CPSR格式如下：\n 有以下指令代码序列：\n    MRS R7,CPSR\n    ORR R6,R7,#0x40\n    AND R7,R6,#0xFFFFFF7F\n    MSR CPSR,R7\n执行这段代码后，以下说法正确的是：","o":["禁止外部中断，允许快速中断","允许外部中断，允许快速中断","允许外部中断，禁止快速中断","禁止外部中断，禁止快速中断"],"a":"C","e":"MRS R7,CPSR 指令将当前程序状态寄存器（CPSR）的值加载到寄存器R7中；ORR R6,R7,#0x40 指令将R7中的值与立即数0x40进行按位或操作，并将结果存储在R6中，相当于设置R6的第6位为1；AND R7,R6,#0xFFFFFF7F 指令将R6中的值与立即数0xFFFFFF7F进行按位与操作，并将结果存储回R7中，相当于设置R7的第7位为0，第6位为1；MSR CPSR,R7 指令将R7中的值写回到程序状态寄存器（CPSR）中，更新其状态。因此，执行这段代码后，允许外部中断，禁止快速中断，故本题答案为C选项。","code":1},{"id":"1985","paper":"真考试卷32","no":17,"type":"单项选择题","q":"以下ARM指令正确的是：","o":["SUB R3,R3,[R1]","ANDS R2,[R4]","LDRB R0,[R1]","MOVSHI  R10,0x10"],"a":"C","e":"A选项中SUB R3,R3,[R1]尝试从R3中减去R1寄存器的值，并将结果存储在R3中；但是，方括号[]在ARM指令中通常用于表示内存地址，而不是寄存器。正确的指令应该使用寄存器寻址，应该是SUB R3, R3, R1；B选项中ANDS R2,[R4]尝试将R2寄存器的值与R4寄存器的值进行逻辑与操作，并将结果存储在R2中。同样，方括号[]在这里是不正确的。正确的指令应该使用寄存器寻址，应该是ANDS R2, R2, R4；C选项中LDRB R0,[R1]这个指令是正确的，LDRB是加载字节（Load Byte）指令，用于从内存中加载一个字节到寄存器中；D选项中MOVSHI R10,0x10这个指令看起来是想将立即数0x10移动到R10寄存器中。但是，ARM指令集中没有MOVSHI这样的指令。正确的指令应该是MOV，用于将立即数或寄存器的值移动到另一个寄存器中，应该是MOV R10, #0x10。综上所述，本题答案为C选项。","code":0},{"id":"1986","paper":"真考试卷32","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，已知R1=0x11223344，,R2=0x87654321,R5=0,则以下ARM指令集中的指令序列如下：\nmyaddr equ    0x39008000\n          LDR R5,=myaddr\n          STR  R1,[R5],#4\n          STR  R2,[R5]\n          LDR  R1,[R5]\n以上指令序列执行后，以下说法正确的是：\n①R1=0x87654321    ②R2=0x87654321\n③R5=0                      ④R5=0x39008004\n⑤R1中的值保持不变  ⑥这段代码占用内存最大占用8字节\n⑦这段代码占用内存最大占用16字节","o":["① ③ ④","② ⑤ ⑥","② ⑤ ⑦","① ② ④  ⑦"],"a":"D","e":"第一行指令定义了一个符号地址myaddr，其值为0x39008000；第二行指令将立即数0x39008000加载到寄存器R5中，占用内存4个字节；第三行指令将R1的值存储到R5指向的内存地址中，并将R5的值增加4。由于R1的值为0x11223344，在小端模式下，内存中将依次存储0x44、0x33、0x22、0x11（低字节在前），然后R5的值变为0x39008004，占用内存4个字节；第四行指令将R2的值存储到R5指向的内存地址中。由于R5现在是0x39008004，R2的值为0x87654321，在小端模式下，内存中将依次存储0x21、0x43、0x65、0x87，占用内存4个字节；第五行指令从R5指向的内存地址加载值到R1中。由于R5现在是0x39008004，在小端模式下，加载到R1的值将是0x87654321，每条指令占用内存4个字节，即这段代码内存最大占用（5-1）×4=16字节（<WXWORK-DATA data-version=\"3.1.20.11441\" data-type=\"ChatMessage\"><\/WXWORK-DATA>myaddr equ 0x39008000 仅在汇编阶段用于符号替换，不会占用运行时的内存空间）；综上所述，① ② ④  ⑦叙述正确，本题答案为D选项。","code":1},{"id":"1987","paper":"真考试卷32","no":19,"type":"单项选择题","q":"设计嵌入式硬件系统的电源电路时常会采用LDO，下面是关于LDO的叙述，其中正确的是：","o":["LDO是低压差稳压器的简称","作为稳压器的78XX系列芯片是一种典型的LDO","LDO的输入是交流信号","LDO只能输出3.3V的稳定的直流电压信号"],"a":"A","e":"低压差稳压器的简称是LDO，A选项叙述正确；78XX 系列属于普通稳压器；B选项叙述错误；LDO的输入通常是直流信号，而不是交流信号，C选项叙述错误；LDO可以输出不同的稳定直流电压信号，不仅限于3.3V，D选项叙述错误；综上所述，本题答案为A选项。","code":0},{"id":"1988","paper":"真考试卷32","no":20,"type":"单项选择题","q":"讨论典型嵌入式处理器时钟电路设计方法时常会结合下面的示意图，下面是关于典型嵌入式处理器时钟电路设计方法的相关叙述，其中错误的是","o":["左图中的Xtal为晶体振荡器，通过嵌入式处理器内部的时钟信号发生器为嵌入式处理器提供嵌入式处理器工作时所需的时钟信号","左图中的X2引脚不能输出时钟信号","右图中的Clock是嵌入式系统外接的稳定的时钟信号源","嵌入式处理器时钟信号的频率不能超过嵌入式处理器的最高工作频率"],"a":"B","e":"左图中的Xtal是晶体振荡器，通常用于生成稳定的时钟信号，通过嵌入式处理器内部的时钟信号发生器为处理器提供时钟信号，A选项叙述正确； 晶振是无极性的，通常分为无源和有源两种，无源晶振有两只引脚 X1 和 X2, 有源晶振有四只引脚，除 X1、 X2 外还有电源和地， X1 为输入， X2 为输出，通过 X2 可以提供时钟源给外部的其他电路使用，所以左图中X2引脚通常可以配置为输出时钟信号，B选项叙述错误；右图中的Clock可以是外接的稳定的时钟信号源，用于提供给嵌入式系统，C选项叙述正确；根据系统需求选择合适的晶振，既要考虑嵌入式处理器的最高工作频率，又要保证系统在一定的功耗范围内，因此，嵌入式处理器时钟信号的频率不能超过嵌入式处理器的最高工作频率，D选项叙述正确；综上所述，本题答案为B选项。","code":0},{"id":"1989","paper":"真考试卷32","no":21,"type":"单项选择题","q":"下面是关于基于ARM内核的典型嵌入式系统硬件组成的叙述，其中错误的是：","o":["典型的嵌入式系统硬件由嵌入式最小硬件系统、 前向通道、 后向通道、 人机交互通道以及相互互联通道等组成","嵌入式最小硬件系统由嵌入式处理器和提供嵌入式处理器运行所必需的硬件电路共同构成","模拟量输入接口属于典型嵌入式系统的前向通道","开关量/数字量输入接口属于典型嵌入式系统的后向通道"],"a":"D","e":"开关量/数字量输入接口属于典型嵌入式系统的前向通道，故本题答案为D选项。","code":0},{"id":"1990","paper":"真考试卷32","no":22,"type":"单项选择题","q":"以ARM内核为基础的嵌入式处理芯片采用系统总线与外围总线两层结构的方式。下述外围接口中，与系统总线相连的是：","o":["UART","SPI","USB主机","GPIO"],"a":"C","e":"以ARM 内核为基础的嵌入式处理芯片采用系统总线与外围总线两层结构的方式构建片上系统，系统总线从早期的ASB、 AHB 到AXI及ACE 等不断发展，性能不断提高，主要用于连接高带宽快速组件，而外围总线APB 支持的内置外设不断增加，性能也不断增强，它主要连接低带宽组件以及与外部相连的硬件组件。连接到系统总线上的高带宽组件主要包括： 电源管理与时钟控制器、测试接口如JTAG、外部存储器控制接口、DMA控制器、 USB 主机、片上SRAM 及Flash、 Ethernet、 高速GPIO 中断控制器、 LCD 控制器等。故本题答案为C选项。","code":0},{"id":"1991","paper":"真考试卷32","no":23,"type":"单项选择题","q":"非易失性存储器在断电后仍能保存数据，下述存储器中，属于非易失性存储器的选项是：","o":["FRAM","SRAM","DRAM","DDR SDRAM"],"a":"A","e":"FRAM（铁电随机存取存储器）是新型的存储器既具有易失性特征的优点，又有非易失性特征；SRAM（静态随机存取存储器）和DRAM（动态随机存取存储器）都是易失性存储器，即掉电后信息丢失；DDR SDRAM（双倍数据速率同步动态随机存取存储器）是DRAM的一种，也是易失性存储器；故本题答案为A选项。","code":0},{"id":"1992","paper":"真考试卷32","no":24,"type":"单项选择题","q":"S3C2410内含的I2C的7位地址读写操作包括4个部分，操作时这4个部分有确定的顺序，其中正确的顺序是：","o":["7位从器件地址、起始位S、应答位A、读写位R/W","应答位A、7位从器件地址、读写位R/W、起始位S","起始位S、读写位R/W、7位从器件地址、应答位A","起始位S、7位从器件地址、读写位R/W、应答位A"],"a":"D","e":"7位地址读写操作格式由起始位 S、 7 位从器件地址、读写位 R/W、应答位 A、数据字节、 应答位 A 以及停止位 P 构成，其中起始位S、7位从器件地址、读写位R/W、应答位A这4个部分有确定的顺序，故本题答案为D选项。","code":0},{"id":"1993","paper":"真考试卷32","no":25,"type":"单项选择题","q":"下述通信标准中，通信时一般不采用差分方式进行信号传输的是：","o":["SPI","RS-485","USB 2.0","CAN"],"a":"A","e":"通信时采用差分方式进行信号传输的有RS-485、USB 2.0、CAN等，而SPI（串行外设） 接口是一种同步串行外设接口 ，允许嵌入式处理器与各种外围设备以串行方式进行通信、数据交换，不采用差分方式；故本题答案为A选项。","code":0},{"id":"1994","paper":"真考试卷32","no":26,"type":"单项选择题","q":"看门狗定时器的计数脉冲周期为：t_watchdog=1／(PCLK／(预分频值+1)／分频系数)。如果PCLK=60MHz，采用预分频值为63、分频系数为128，则看门狗定时器的计数脉冲周期约为：","o":["2.03μs","31.25ms","8.33 ms","136.53μs"],"a":"D","e":"根据t_watchdog=1／(PCLK／(预分频值+1)／分频系数)=1/(6*10<SUP>7<\/SUP>/(63+1)/128)≈1.3653*10<SUP>-4<\/SUP>S=136.53μs，故本题答案为D选项。","code":0},{"id":"1995","paper":"真考试卷32","no":27,"type":"单项选择题","q":"S3C2410内置ADC的结构如下图所示。下面是关于S3C2410内置ADC的叙述，其中错误的是：","o":["内置ADC通过模拟多路开关可以对8路模拟信号分时进行A/D转换","A/D转换结果用10位二进制数表示","每次A/D转换结束可以产生中断请求信号","无法通过软件查询的方式了解A/D转换是否完成"],"a":"D","e":"S3C2410内部有一个8通道、逐次逼近式、分辨率为10位的ADC，ADC可以配置为在转换完成后产生中断，所以A、B和C选项叙述正确；S3C2410的ADC可以通过查询相应的状态寄存器来了解A/D转换是否完成，所以D选项叙述错误；故本题答案为D选项。","code":0},{"id":"1996","paper":"真考试卷32","no":28,"type":"单项选择题","q":"下面列出的四种常用的通信方式中，属于有线通信方式的是：","o":["CAN","GPRS","WiFi","蓝牙"],"a":"A","e":"嵌入式系统的互连通信接口给嵌入式系统提供了与其他系统进行数据通信的可能，主要包括有线通信接口 RS- 23i/RS - 485、 CAN/Eth~rnet 等，无线通信接口主要有 GPS、GPRS 、 WiFi 、 蓝牙和其他无线通信模块等。故本题答案为A选项。","code":0},{"id":"1997","paper":"真考试卷32","no":29,"type":"单项选择题","q":"下列关于嵌入式系统软件构成部件的各组术语中，含义最接近的是：","o":["引导加载程序与板级支持包","操作系统内核与发行版","硬件抽象层与板级支持包","设备驱动程序与引导加载程序"],"a":"C","e":"硬件抽象层 (HAL) 和板级支持包 (BSP) 都是嵌入式系统的底层软件，可以将嵌入式系统软件中位于操作系统层与硬件之间的、与硬件相关的软件层次统称为硬件抽象层， 而板级支持包则可以被看作是硬件抽象层在特定操作系统环境下的具体实现。综上所述，硬件抽象层与板级支持包在功能和应用上更为接近，本题答案为C选项。","code":0},{"id":"1998","paper":"真考试卷32","no":30,"type":"单项选择题","q":"下列关于BSP的描述中，正确的是：","o":["BSP在系统上电复位之前负责系统初始软硬件环境的建立","BSP要与特定电路板相匹配，可以支持不同的操作系统运行于其上","BSP是嵌入式系统软件必须的组成部件","在BSP运行之前，操作系统的调试工具都不可用"],"a":"D","e":"BSP 在系统复位之后负责系统软硬件环境的初始化，所以A选项叙述错误；BSP 既要与特定电路板相匹配， 又必须按照操作系统所要求的接口方式为其提供服务，所以B选项叙述错误；嵌入式系统的软件配置有多种情况，一些低端嵌入式系统的软件很简单，它们不需要操作系统，只需配置一个监控程序、若干设备驱动程序和事件处理程序即可；高端嵌入式系统的软件配置则比较复杂。 它通常由板级支持包 (BSP) 、 设备驱动程序、实时操作系统、中间件以及嵌入式应用软件等组成；所以BSP不是嵌入式系统软件必须的组成部件，C选项叙述错误。在BSP 运行之前，操作系统的调试工具都不可用， 甚至硬件平台是否能可靠稳定运行都不确定；所以D选项叙述正确，本题答案为D选项。","code":0},{"id":"1999","paper":"真考试卷32","no":31,"type":"单项选择题","q":"下列关于bootloader的陈述中，不正确的是：","o":["嵌入式系统上电复位后首先运行引导加载程序","有些种类的bootloader能支持多种体系结构的处理器，但每种体系结构有其自身的版本","一些功能强大的bootloader能同时支持启动加载（bootloading）和下载（downloading）这两种工作模式","因为RAM存储器可以随机读出，不需要额外的驱动程序，所以bootloader需要把存放在ROM存储器中的操作系统和应用程序映像拷贝到RAM存储器中才能执行"],"a":"D","e":"因为ROM 存储器可以随机读出，不论是在 ROM 中在线执行代码，还是从 ROM 中读出信息，都不需要额外的驱动程序，所以bootloader需要把存放在ROM存储器中的操作系统和应用程序映像拷贝到RAM存储器中才能执行，D选项叙述错误；本题答案为D选项。","code":0},{"id":"2000","paper":"真考试卷32","no":32,"type":"单项选择题","q":"下列关于驱动程序的陈述中，不正确的是：","o":["驱动程序通常以若干函数的集合的形式出现","很多操作系统要求用户的应用程序必须通过驱动程序才能访问硬件","某些操作系统将设备驱动程序划分为体系结构相关的驱动程序和体系结构无关的通用驱动程序两层","μC/OS-II操作系统把I/O设备抽象成设备文件"],"a":"D","e":"Linux 等类 Unix 操作系统把I/O设备抽象成设备文件，不是μC/OS-II操作系统，故本题答案为D选项。","code":0},{"id":"2001","paper":"真考试卷32","no":33,"type":"单项选择题","q":"下列关于嵌入式系统底层软件的陈述中，不正确的是：","o":["VxW
