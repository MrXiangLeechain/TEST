有分离的指令Cache和数据Cache。故此题选择A。","code":0},{"id":"1014","paper":"真考试卷16","no":27,"type":"单项选择题","q":"下图为S3C2410采用I<SUP>2<\/SUP>C与铁电存储器FM24CL64（8KB）连接的示意图。下面关于S3C2410内置I2C组件的叙述中，错误的是（  ）。","o":["图中S3C2410的GPE15配置为I<SUP>2<\/SUP>C的SDA引脚，GPE14配置为I<SUP>2<\/SUP>C的SCL引脚","图中S3C2410可以按照主模式下的发送和接收操作流程对FM24CL64进行读写操作","通过编程可以将I<SUP>2<\/SUP>C总线的从地址设为7位、8位、9位或10位","图中对于S3C2410而言，SCL是输出，SDA为双向（输入/输出）"],"a":"C","e":"集成电路互联（I<SUP>2<\/SUP>C）总线用于连接嵌入式处理器及其外围器件，是一种串行半双工传输的总线标准。通过编程可以将I^2C总线的从地址设为7位、10位，C选项错误。故此题选择C。","code":0},{"id":"1015","paper":"真考试卷16","no":28,"type":"单项选择题","q":"下面关于嵌入式系统接入以太网的叙述中，错误的是（  ）。","o":["ARM芯片有多种类型，但各型ARM芯片内部没有内置的以太网控制器","ARM芯片通过外扩以太网控制器可以使其接入以太网","以太网控制器DM9000可以实现介质访问层（MAC）和以太网物理层（PHY）的功能","以太网物理层信号一般通过网络变压器和网络的RJ-45插座相连而接入网络"],"a":"A","e":"有些ARM芯片如基于ARM Cortex-M3的嵌入式处理芯片已经嵌入了以太网控制器。故此题选择A。","code":0},{"id":"1016","paper":"真考试卷16","no":29,"type":"单项选择题","q":"下列关于嵌入式软件特点的描述中，不正确的是（  ）。","o":["软件代码时空效率要求高，实时性要求高。","不使用操作系统。","软件受限于功能和具体应用环境。","软件具有较长的生命周期。"],"a":"B","e":"嵌入式系统的软件配备没有通用计算机那样多，嵌入式操作系统是具有专用性质的操作系统，一般受限于功能和具体应用环境，有些情况下也可以不用操作系统。嵌入式软件对代码时空效率和实时性要求较高，具有较长的生命周期。故此题选择B。","code":0},{"id":"1017","paper":"真考试卷16","no":30,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，不正确的是（  ）。","o":["对实时性要求较高的场景，应尽可能选择简单的轮询结构。","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构。","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销。","中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件。"],"a":"A","e":"中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件，与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销。选择嵌入式系统软件结构的一个基本原则是选择可以满足响应时间需求的最简单的结构，而非轮询结构。故此题选择A。","code":0},{"id":"1018","paper":"真考试卷16","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，不正确的是（  ）。","o":["板级支持包的特点是与硬件和操作系统都关系紧密，既有硬件相关性，又有操作系统相关性。","硬件抽象层是在操作系统层与硬件之间设置的独立的接口软件层，是所有直接依赖于硬件的软件。","U-Boot是公认的功能最强、最具弹性以及更新最快的开放源码板级支持包。","板级支持包中包含硬件相关的设备驱动程序。"],"a":"C","e":"硬件抽象层是在操作系统层与硬件之间设置的独立的接口软件层，是所有直接依赖于硬件的软件；板级支持包中包含硬件相关的设备驱动程序，其特点是与硬件和操作系统都关系紧密，既有硬件相关性，又有操作系统相关性。U-Boot是公认的功能最强、最具弹性以及更新最快的开放源码引导加载程序（bootloader），而不是板级支持包（BSP）；C选项叙述错误，故此题选择C。","code":0},{"id":"1019","paper":"真考试卷16","no":32,"type":"单项选择题","q":"下列关于Bootloader的陈述中，不正确的是（  ）。","o":["不同的Bootloader程序功能虽有差别，但大多支持操作系统引导和加载功能。","Bootloader又称为bootROM。","Bootloader负责系统的上电自检、硬件初始化、建立存储空间映射、配制系统参数、建立上层软件的运行环境，并加载和启动操作系统。","Bootloader依赖于具体的硬件结构。"],"a":"B","e":"嵌入式系统加电后执行的第一批最初操作称为引导或者自举（Boot），对应的程序称为引导程序或者引导加载程序（Bootload）；Bootloader负责系统的上电自检、硬件初始化、建立存储空间映射、配制系统参数、建立上层软件的运行环境，并加载和启动操作系统；Bootloader依赖于具体的硬件结构，不同的Bootloader程序功能虽有差别，但大多支持操作系统引导和加载功能。故此题选择B。","code":0},{"id":"1021","paper":"真考试卷16","no":33,"type":"单项选择题","q":"下列关于设备驱动程序的陈述中，不正确的是（  ）。","o":["设备驱动程序只能被高层软件调用而无法自行运行。","嵌入式操作系统都自带标准设备驱动程序。","类Unix操作系统把I/O设备抽象成设备文件。","设备驱动程序对上层软件屏蔽硬件细节。"],"a":"B","e":"μC/OS-II与大型操作系统不同，基本不包含设备驱动程序，只是一个纯内核。其驱动程序属于底层，需要系统开发商自行开发。故此题选择B。","code":0},{"id":"1022","paper":"真考试卷16","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，不正确的是（  ）。","o":["民航飞机上的计算机系统中运行的都是硬实时任务。","实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性。","嵌入式系统中有相当大的比例是实时系统，实时系统中也有相当大比例是嵌入式系统。","实时性要求高的系统既要有足够强大的硬件平台支撑，也要有专门设计的实时软件并合理安排任务的优先级，才能满足实时处理的要求。"],"a":"A","e":"一旦任务执行时间超过截止时间系统的总损益就为负，这种实时系统称为硬实时系统，否则为软实时系统。对于硬实时系统，一旦超过时限将导致严重的负效益后果，如飞机控制器、核反应堆处理装置；而软实时系统中如果输出响应超过时限，一般不会造成严重后果；民航飞机上多数的嵌入式系统都具有时间约束性，然而并非都是硬实时任务。故此题选择A。","code":0},{"id":"1023","paper":"真考试卷16","no":35,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，正确的是（  ）。","o":["TinyOS是开源嵌入式操作系统。","微内核结构的优点是效率较高，性能强。","Windows CE和Android操作系统属于微内核结构。","μC/OS操作系统是完全免费的操作系统。"],"a":"A","e":"TinyOS是开源嵌入式操作系统，主要用于无线传感网络。按照内核结构，嵌入式操作系统可分为单内核和微内核操作系统。单内核的优点是应用程序效率高、反应速度快，Windows CE和Android操作系统属于单内核结构。故此题选择A。","code":0},{"id":"1024","paper":"真考试卷16","no":36,"type":"单项选择题","q":"下列各操作系统中，不属于嵌入式Linux发行版的是（  ）。","o":["RTAI。","eCos。","MontaVista Linux。","Xenomai。"],"a":"B","e":"嵌入式Linux发行版是基于Linux内核构建，经过裁剪和优化，以适应嵌入式设备资源受限的特点。常见的嵌入式Linux发行版包括MontaVista Linux、Xenomai、RTAI等。而eCos是一个独立的实时操作系统，它并非基于Linux内核，而是由Wind River公司开发，具有可裁剪、实时性强、适合嵌入式应用的特点。因此，它不属于嵌入式Linux发行版，本题答案为B选项。","code":0},{"id":"1026","paper":"真考试卷16","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务调度的陈述中，不正确的是（  ）。","o":["在当前运行态任务因等待某一事件而被阻塞或被挂起时，会发生任务级的任务调度。","当有更高优先级的任务转入就绪状态时，会发生任务级的任务调度。","在中断服务完成后允许进行中断级的任务调度。","任务调度时，内核总是选择当前所有等待态任务中最高优先级的任务转入运行态。"],"a":"D","e":"μC/OS-II是抢占式实时内核，在任意时刻都可能发生任务调度，在任务调度时总是运行就绪态任务中优先级最高的任务。故此题选择D。","code":0},{"id":"1027","paper":"真考试卷16","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，不正确的是（  ）。","o":["调用OSTaskSuspend()函数可以挂起一个任务，而被挂起的任务只能等待其他任务调用OSTaskResume()函数才能实现任务恢复。","在中断返回之前，必须调用退出中断函数void OSIntExit(void)。","函数OSTaskCreateExt()用于在中断服务程序中创建任务。","宏OS_EXIT_CRITICAL()实现退出临界状态的操作。"],"a":"C","e":"创建μC/OS-II任务可以使用OSTaskCreate函数或者OSTaskCreateExt函数，分别用于基本型任务创建和扩展性任务创建。都是用于从休眠态到就绪态。故此题选择C。","code":0},{"id":"1029","paper":"真考试卷16","no":39,"type":"单项选择题","q":"下面有关GNU的描述语句中，不恰当的是（  ）。","o":["GNU开发工具套件中，包含了GCC和GDB等工具。","GCC是一种用来编辑Linux操作系统下应用程序的文本编辑器。","GDB是一种用来调试Linux操作系统下应用程序的调试工具。","GNU开发工具套件是在宿主机上安装并使用的工具软件。"],"a":"B","e":"GCC是针对Linux操作系统环境下应用程序的编译工具，它能将C语言、C++语言、汇编语言编写的源程序以及库文件编译连接成执行文件；它从源文件生成可执行文件的过程是由四个相关联的阶段组成：预处理、编译、汇编、连接。故此题选择B。","code":0},{"id":"1030","paper":"真考试卷16","no":40,"type":"单项选择题","q":"下面的语句中，说法不正确的是（  ）。","o":["使用在线仿真器的调试方式时，在线仿真器取代了被调试目标系统中的CPU。","片上调试技术通常采用JTAG标准。","指令集模拟器是在目标机上模拟调试程序代码。","驻留监控软件调试方法需要在目标机中存储一段支持通信和调试命令的软件。"],"a":"C","e":"指令集模拟器（ISS）是在宿主机上模拟应用程序在目标机上运行行为的一个软件工具，其操作界面与通用机的集成开发环境类似。故此题选择C。","code":0},{"id":"1053","paper":"真考试卷17","no":1,"type":"单项选择题","q":"下面关于嵌入式系统特点的叙述中,错误的是（  ）。","o":["嵌入式系统通常有小型化、轻量化、低功耗及低成本的要求","嵌入式系统具有隐蔽性，系统中的计算机软硬件不直接呈现","一些面向控制应用的嵌入式系统,必须具有很高的可靠性","应用于过程控制、数据采集等领域的嵌入式系统不需要实时性方面的要求"],"a":"D","e":"嵌入式系统广泛应用于过程控制、数据采集、通信传输等领域，承担着测量、报警、控制、调节等任务，所以嵌入式系统都有或多或少的实时性，即必须在一个可预测和有保证的时间范围内对外部事件作出正确的反应。故本题选择D选项。","code":0},{"id":"1054","paper":"真考试卷17","no":2,"type":"单项选择题","q":"下面关于嵌入式系统应用的叙述中,错误的是（  ）。","o":["嵌入式系统广泛应用于冰箱、洗衣机、空调等消费类产品中","嵌入式系统广泛应用于电子秤、点钞机等业务类产品中","嵌入式系统广泛应用于汽车、飞机等产业类产品中","基于可靠性方面的考虑，雷达、电子对抗等军事通信装备中一般不使用嵌入式系统"],"a":"D","e":"嵌入式系统所涉及的应用领域非常广泛，通信设备、仪器仪表、医疗器械、消费电子、家用电器、计算机外围设备、汽车、船舶、航空、航天等均是嵌入式系统的主要应用领域。军事类应用产品事包括：火炮、导弹、智能炸弹的制导引爆等武器控制装置；坦克、舰艇、战机、无人机等军用电子装备；雷达、电子对抗、导航系统等军事通信装备。嵌入式系统在应用数量上远远超过了各种类型的通用计算机系统。故本题选择Ｄ选项。","code":0},{"id":"1055","paper":"真考试卷17","no":3,"type":"单项选择题","q":"嵌入式系统硬件的逻辑组成可用下图描述，图中①、②、③、④处分别是（  ）。","o":["运算器、用户界面、测控对象、输出接口","测控对象、输出接口、运算器、用户界面","输出接口、运算器、用户界面、测控对象","用户界面、测控对象、输出接口、运算器"],"a":"C","e":"参照嵌入式计算机硬件的逻辑组成及其与外部世界关系的示意图可知：图中①、②、③、④处分别是输出接口、运算器、用户界面、测控对象。故本题选择C选项。","code":0},{"id":"1056","paper":"真考试卷17","no":4,"type":"单项选择题","q":"下面是关于嵌入式系统中的处理器的叙述，其中错误的是（  ）。","o":["有些嵌入式系统包含多个处理器, 其中负责运行系统软件和应用软件的处理器称为中央处理器（CPU）","不同嵌入式系统中的CPU的主频都是相同的","嵌入式系统中的CPU的字长有8位、16位、32位等","嵌入式系统中的CPU的性能是影响嵌入式系统性能的一个重要因素"],"a":"B","e":"有些嵌入式系统会包含多个处理器，它们各有其不同的任务，其中负责运行系统软件和应用软件的主处理器称为中央处理器（Central Processing Unit, CPU),其余的都是协处理器，如数字信号处理器（Digital Signal Processor, DSP)、图形处理器、通信处理器等。CPU是任何计算机不可或缺的核心部件。CPU的字长有4位、8位、16位、32位、64位之分。嵌入式系统的性能在很大程度上是由CPU决定的。主频（CPU时钟频率）指CPU中门电路的工作频率，它决定着CPU芯片内部数据传输与操作速度的快慢。一般而言，主频越高，执行一条指令需要的时间就越短。故本题选择B选项。","code":0},{"id":"1057","paper":"真考试卷17","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，错误的是（  ）。","o":["GB2312表示汉字时使用2个字节，每个字节的最高位固定为1","标准ASCII码是7位编码","GB18030采用不等长编码","UTF-16采用双字节等长编码"],"a":"D","e":"GB2312国标字符集中包含3755个一级常用汉字和3008个二级常用汉字，此外还有682个图形符号（包括拉丁字母、俄文、日文平假名与片假名、希腊字母、汉语拼音等）。这些汉字和图形符号在计算机内部都采用2字节（16个二进制位）来表示，每字节的最高位均规定为1。GB18030采用不等长的编码方法：单字节编码（128个）表示ASCII码字符，与ASCII码兼容； 双字节编码（23 940个）表示汉字，与GB2312保持向下兼容（GB2312中包含的所有字符 GB18030中也有，且编码相同）；还有约158万个四字节编码用于表示其他字符。标准ASCII码是7位编码，但由于字节是计算机中最基本的存储和处理单位，故一般 仍使用一个字节来存放一个ASCII码。UTF-16采用的是双字节可变长编码。故本题选择D选项。","code":0},{"id":"1058","paper":"真考试卷17","no":6,"type":"单项选择题","q":"下列关于数字音频和数字视频的描述中，错误的是（  ）。","o":["数字视频的数据量可压缩几十倍甚至几百倍","MP3是未经压缩的数字音频","固定电话通信中使用PCM编码的码率为64kb/s","音频信号的量化也就是模数转换"],"a":"B","e":"MP3是有损压缩的数字音频；由于视频信息中画面内部有很强的信息相关性，相邻画面的内容又高度连贯，再加上人眼的视觉特性，所以数字视频的数据量可压缩几十倍甚至几百倍。固定电话通信中使用PCM编码（脉冲编码调制，码率为64 kb/s)。音频量化就是把每个样本的模拟量转换成数字量来表示，因此量化过程往往也称为A/D转换（模数转换）。故本题选择B选项。","code":0},{"id":"1059","paper":"真考试卷17","no":7,"type":"单项选择题","q":"从现实世界中获得数字图像的过程中，不包含在内的步骤是（  ）。","o":["分色","差分变换","量化","取样"],"a":"B","e":"图像获取过程的核心是模拟信号的数字化，它的处理步骤大致分为4步：①扫描将画面划分为M×N个网格，每个网格称为一个取样点。这样，一幅模拟图像就转换为M×N个取样点所组成的一个阵列。②分色将每个取样点的颜色分解成红、绿、蓝（R、G、B) 3个基色，如果是灰度图像或黑白图像，则不必进行分色。③取样：测量每个取样点的每个分量（基色）的亮度值。④量化：对取样点每个分量的亮度值进行A/D转换，即把模拟量使用数字量（一般是 8位至12位的正整数）来表示。故本题选择B选项。","code":0},{"id":"1060","paper":"真考试卷17","no":8,"type":"单项选择题","q":"关于分组交换中数据包说法错误的是（  ）。","o":["数据包包括头部和有效载荷","一个完整的数据包包括源计算机地址、目的计算机地址、编号、校验信息和传输的数据块","传输时以包为单位通过传输网络向目的计算机发送","首先传输的是有效数据块（有效载荷即传输的数据块）"],"a":"D","e":"分组交换也称为包交换。采用分组交换方式进行数据通信时，源计算机把需要传输的数据(如MP3格式的一支歌曲）划分为若干块，为每块数据附加上源计算机和目的计算机地址，数据块的编号、校验信息等有关信息（称为头部），组成一个一个包（Packet,也称为分组），然后以包为单位通过传输网络向目的计算机发送。故本题选择D选项。","code":0},{"id":"1061","paper":"真考试卷17","no":9,"type":"单项选择题","q":"以下关于嵌入式处理器说法正确的是（  ）。","o":["不是所有ARM处理器都采用RISC指令集","所有ARM处理器均采用哈佛结构","所有ARM处理器都支持Thumb指令集","所有ARM处理器均采用指令流水线技术"],"a":"D","e":"ARM处理器是嵌入式领域目前发展最快、技术最先进、应用最广泛的处理器之一。由于ARM采用RISC体系结构，因此其结构上的技术特征大多属于RISC技术的特征。结合ARM自身特点，ARM具有的技术特征如下：①单周期操作。②只使用加载/存储（Load/Store)指令访问内存。③指令长度固定。④三地址指令格式。⑤指令流水线技术。⑥低功耗设计。ARM处理器多数为哈佛结构。从ARMv4T架构开始，几乎所有ARM处理器都支持Thumb指令集。故本题选择D选项。","code":0},{"id":"1062","paper":"真考试卷17","no":10,"type":"单项选择题","q":"在经典ARM处理器中ARM920T是典型代表，采用ARM9TMDI内核，它具备的主要性能和部件包括（  ）。 \n①支持ARM/Thumb指令集 ② 具有快速乘法器 ③ 哈佛结构  ④ 指令Cache与数据Cache分离 ⑤五级流水线 ⑥ 具有MMU ⑦ 唤醒中断控制器  ⑧嵌套向量中断控制器","o":["①②③④⑤⑥⑦⑧","①②③④⑤⑥","①②③⑥⑦⑧","①②⑤⑥⑦⑧"],"a":"B","e":"ARM920T处理器使用的内核是ARM9TDMI,它基于ARMv4T架构设计，支持ARM/Thumb 指令集，具有快速乘法器；采用程序与数据分离的哈佛存储结构，指令Cache和数据Cache各 16 KB,还可通过总线外接Cache和SRAM存储器；支持协处理器；含有内嵌的在线仿真模块 ICE、支持片上调试；采用5级流水线以提高处理器性能，每一条指令的执行分为5个步骤: ①取指令，②指令译码，③执行指令运算，④Cache/存储器访问，⑤结果写回寄存器。还包括存储器管理部件MMU（实现虚拟存储器）、16KB的指令Cache和16KB的数据Cache、写回RAM、AMBA总线接口、外部协处理器接口以及跟踪调试接口等；故本题选择B选项。","code":1},{"id":"1063","paper":"真考试卷17","no":11,"type":"单项选择题","q":"关于ARM处理器的工作状态，以下说法错误的是（  ）。","o":["Thumb-2的指令集不支持32位指令","ARM状态是32位指令状态","Thumb状态是16位指令状态","调试状态是处理器停机调试时进入的状态"],"a":"A","e":"ARM处理器有3种工作状态：①ARM状态：ARM状态是ARM处理器工作于32位指令的状态，即32位状态，所有指令均为32位宽度。②Thumb 状态：Thumb状态是ARM执行16位指令的状态，即16位状态。在Thumb模式下，指令代码只有16位，使代码密度变大，占用内存空间减小，提供比32位程序代码更佳的效能；③调试状态：处理器停机调试时进人调试状态。故本题选择A选项。","code":0},{"id":"1064","paper":"真考试卷17","no":12,"type":"单项选择题","q":"用于子程序返回指令使用的寄存器有（  ）。\n①R12  ② R13 ③ R14 ④R15  ⑤ SP ⑥ PC  ⑦  LR","o":["① ② ③ ④","③ ④ ⑥ ⑦","③  ④","⑥  ⑦"],"a":"B","e":"无论何种模式，R15均作为PC（程序计数器）使用；R13~R14除了用户模式和系统模式分别为堆栈指针（Stack Pointer, SP )和程序链接寄存器（Link Register, LR)之外，其他模式下均有自己独特的标记方式，是专门用于特定模式的寄存器。子程序的调用一般是通过BL指令来实现的。使用 指令“BL子程序名”，即可完成程序的调用。该指令在执行时完成如下操作：将子程序的返回地址存放在链接寄存器LR中，同时将程 序计数器PC指向子程序的入口点。当子程序执行完毕需要返回调用处时，只需将存放在LR 中的返回地址重新拷贝给程序计数器PC。在调用子程序的同时，也可以完成参数的传递和从子程序返回运算结果，通常可以使用寄存器R0-R3完成。故本题选择B选项。","code":1},{"id":"1065","paper":"真考试卷17","no":13,"type":"单项选择题","q":"对于经典ARM处理器，在以下的异常中断中，优先级最高的是（  ）。","o":["复位","软件中断","指令预取中止","外部中断请求"],"a":"A","e":"复位RESET的级别是1级，级别最高，最低的是未定义的指令UND或软件中断SWI；外部中断请求为4级；指令预取中止PABT的级别是5级；故本题选择A选项。","code":0},{"id":"1066","paper":"真考试卷17","no":14,"type":"单项选择题","q":"某ARM处理器内部某功能部件可以对外部中断进行嵌套处理，这个部件是（  ）。","o":["MMU","MPU","WIC","NVIC"],"a":"D","e":"WIC是唤醒中断控制器；NVIC为嵌套向量中断控制器可以进行中断的嵌套；MMU为存储器管理单元；MPU为存储器保护单元；故本题选择D选项。","code":0},{"id":"1067","paper":"真考试卷17","no":15,"type":"单项选择题","q":"对于经典ARM的异常，以下说法错误的是（  ）。","o":["发生复位异常后，立即中止当前的指令，PC＝0","七种不同的异常有六个优先级","异常优先级最低是外部中断","发生异常时，断点地址自动存放在LR"],"a":"C","e":"复位RESET的级别是1级，优先级别最高；最低的是未定义的指令UND或软件中断SWI；外部中断请求为4级；指令预取中止PABT的级别是5级；中断响应的第三个步骤，将引起异常指令的下一条指令（断点地址）保存到新的异常工作模式的LR中；第四步，给程序计数器PC强制赋值；故本题选择C选项。","code":0},{"id":"1068","paper":"真考试卷17","no":16,"type":"单项选择题","q":"ARM处理器复位后，顺序执行以下指令：\n   IMPORT __main \n    LDR R0,=__main\n    BL  R0\n以上指令执行后，ARM处理器的工作状态为（  ）。","o":["调试状态","ARM状态","Thumb状态","初始状态"],"a":"B","e":"当ARM处理器处于复位时，异常处理需要在ARM状态下进行，故此时ARM处理器的工作状态为ARM状态。故本题选择B选项。","code":1},{"id":"1069","paper":"真考试卷17","no":17,"type":"单项选择题","q":"把R1的2倍，存放到R0中，能够实现此功能的所有指令有（  ）。\n①MUL R0，R1，#2 \n②ADD R0，R1，R1\n③MOV R0，R1，LSR#1\n④MOV R0，R1，LSR#2\n⑤MOV R0，R1，LSL#1\n⑥MOV R0，R1，LSL#2","o":["①","②","①②","①②⑤"],"a":"D","e":"MUL R0，R1，#2 的功能是R0←R1*2；ADD R0，R1，R1的功能是R0←R1+R1；MOV R0，R1，LSL#1的功能是将R1中的值左移1位传送到R0，左移的作用即是R1←2*R1；故本题选择D选项。","code":1},{"id":"1070","paper":"真考试卷17","no":18,"type":"单项选择题","q":"在ARM汇编语言中，大端模式下，通过伪指令Myvar DCD 0x11223344在内存中定义了1个变量并赋值，已知R0=0,R1=0xaabbccdd,R2=0,则依次执行：\n LDR R2,=Myvar\n LDR R0,[R2]\n STR R1,[R2]\n以下说明正确的是（  ）。","o":["R0的值保持不变","R2中的值保持不变","内存的值保持不变","Myvar的值变为0xaabbccdd"],"a":"D","e":"LDR R2,=Myvar的功能是R2=Myvar； LDR R0,[R2]的功能是R0←[R2]; STR R1,[R2]的功能是R1→[R2]；因此Myvar的值变为0xaabbccdd。故本题选择D选项。","code":1},{"id":"1071","paper":"真考试卷17","no":19,"type":"单项选择题","q":"下图给出了嵌入式处理器时钟电路的一种设计方法。下面为关于该图及嵌入式系统中时钟电路的叙述，其中错误的是（  ）。","o":["时钟电路是嵌入式最小硬件系统的一个组成部分","该图采用了“使用外部时钟信号源”来设计嵌入式处理器时钟电路的设计方法","图中标有“Xtal” 的器件为晶体振荡器","图中标有“C”的器件为电容器"],"a":"B","e":"嵌入式最小系统一般包含处理器、电源电路、时钟电路、复位电路，缺一不可，A选项叙述正确；“外部时钟信号源” 方式是直接给处理器的时钟引脚输入一个外部方波信号（比如外部有源晶振的输出），不需要处理器内部振荡电路，也不需要在 X1/X2 之间接无源晶振和电容；本图是典型的内部振荡方式（无源晶振 + 负载电容），不是外部时钟信号源方式，B选项叙述错误；Xtal 就是晶体振荡器（晶振）的标识，这里是无源晶振，C选项叙述正确；电路中 “C” 是电容的通用标识，这里是晶振电路的负载电容，D选项叙述正确；综上所述，B选项错误，本题答案为B选项。","code":0},{"id":"1072","paper":"真考试卷17","no":20,"type":"单项选择题","q":"下面是关于基于ARM内核的典型嵌入式应用系统硬件组成的叙述，其中错误的是（  ）。","o":["典型嵌入式应用系统硬件组成中包括嵌入式最小硬件系统","系统具有的键盘或触摸屏接口属于系统硬件组成中的相互互连通道","典型嵌入式应用系统硬件组成中常包括后向通道","典型嵌入式应用系统硬件组成中常包括前向通道"],"a":"B","e":"典型的嵌入式系统硬件由嵌入式最小硬件系统、前向通道、后向通道、人机交互通道以及相互互联通信通道组成。其中，相互互连通道主要包括RS-232/RS-485串行通信接口、CAN通信接口、以太网通信接口、 USB通信接口等。故本题选择B选项。","code":0},{"id":"1073","paper":"真考试卷17","no":21,"type":"单项选择题","q":"下面是关于ARM7嵌入式处理器芯片的叙述： \nⅠ. ARM7芯片内部包括外部存储器管理部件 \nⅡ. ARM7芯片内部包括片内存储器及其控制器 \nⅢ. ARM7芯片内部包括中断控制器 \nⅣ. ARM7芯片内部包括DMA控制器 \n其中，正确的是（  ）。","o":["仅Ⅱ和Ⅲ","仅Ⅲ和Ⅳ","仅Ⅱ、Ⅲ和Ⅳ","全部"],"a":"D","e":"由于生产ARM芯片的厂家众多，且各自都有自己的特色，因此生产出来的ARM芯片都特色鲜明，各有侧重，使ARM芯片片内硬件组件丰富，通信接口多样。例如，外部存储器管理部件、片内存储器及其控制器、中断控制器、DMA控制器、USB控制器、LCD控制器等。故本题选择D选项。","code":1},{"id":"1074","paper":"真考试卷17","no":22,"type":"单项选择题","q":"下面关于存储器带宽的叙述中，错误的是（  ）。","o":["存储器的带宽是指每秒可传输（读出/写入）的最大数据总量","存储器的带宽与存储器总线的频率有关","存储器的带宽与存储器总线的数据位数有关","存储器的带宽与存储器每个总线周期的数据传输次数无关"],"a":"D","e":"存储器的带宽指每秒可传输（读出/写入）的最大数据总量，通常以B/s、KB/s、MB/s 和GB/S表示。存储器带宽与存储器总线频率有关，也与数据位数（宽度）和每个总线周期的传输次数有关。故本题选择D选项。","code":0},{"id":"1075","paper":"真考试卷17","no":23,"type":"单项选择题","q":"下图为嵌入式系统存储层次结构，为使该图完整，图中空白处应该填写的文字是（  ）。","o":["嵌入式处理器内部的Cache存储器","DRAM","Flash存储器","SD卡"],"a":"A","e":"嵌入式系统的存储层次结构通常包括：嵌入式处理器内部寄存器、Cache存储器、主存储器（内存）和外部存储器（外存）。这是为了在速度、容量和成本之间取得平衡，同时满足处理器对数据访问效率的需求。根据存储层次结构图，空白处位于“嵌入式处理器内部寄存器”与“主存储器（内存）”之间，符合这一位置特征的是嵌入式处理器内部的Cache存储器，故本题答案为A选项。","code":0},{"id":"1076","paper":"真考试卷17","no":24,"type":"单项选择题","q":"在软件配合下，通过SPI总线可以构成多种简单或复杂的系统。下图为多主多从式SPI系统，图中①、②、③、④分别为（  ）。","o":["SCK、SSEL、MOSI、MISO","SCK、MISO、MOSI、SSEL","SSEL、SCK、MISO、MOSI","MOSI、SSEL、MISO、SCK"],"a":"B","e":"对于多主多从的SPI系统中可以看出，左侧主/从从上往下依次是SCK、MISO、MOSI、SSEL。故本题选择B选项。","code":0},{"id":"1077","paper":"真考试卷17","no":25,"type":"单项选择题","q":"下面是关于S3C2410的PWM定时器相关的叙述，其中错误的是（  ）。","o":["S3C2410内部有5个定时器，有4个具备PWM输出","S3C2410的特殊功能寄存器包括定时器配置寄存器、定时器控制寄存器、定时器计数缓冲寄存器、与比较寄存器、定时器观察寄存器等","在PWM输出操作中，TCNTBn决定PWM信号的周期，TCMPBn决定PWM信号的占空比","在PWM输出操作中，TCNTBn和TCMPBn均为8位寄存器"],"a":"D","e":"定时器计数缓冲寄存器包括TCNTB0~TCNTB4，定时器比较寄存器包括TCMPB0 ~ TCMPB4，它们都是16位的寄存器，用于设置相应定时器的缓冲值和比较值。对于PWM输出，TCNTBn决定PWM周期或频率，而TCMPBn决定PWM占空比。故本题选择D选项。","code":0},{"id":"1078","paper":"真考试卷17","no":26,"type":"单项选择题","q":"下面关于嵌入式系统显示器的叙述中，错误的是（  ）。","o":["单个LED的亮灭，可由ARM芯片的一个GPIO引脚控制，但一般情况下需要相应的驱动电路配合","LED数码管有共阴极和共阳极两种结构形式","LCD常用来表示液晶显示器","常用显示设备按其完整程度可分为LCD显示屏、LCD显示模块以及LCD显示器等，但嵌入式系统中只能使用LCD显示屏"],"a":"D","e":"在嵌入式应用系统中，较好的人机交互需要使用LCD显示设备。LCD显示设备按其完整程度可分为LCD显示屏、LCD显示模块（LCM)以及LCD显示器三种类型。嵌入式系统中使用比较多的是LCD显示屏和LCD显示模块；如果嵌入式处理芯片内部已集成了 LCD控制器，则可以直接选择LCD显示屏，如果内部没有集成LCD控制器，则可选择 LCD显示模块，通过GPIO以并行方式连接LCD显示模块或通过串行方式如SPI或I2C连接 LCD显示模块（不同模块通信方式不同）。故本题选择D选项。","code":0},{"id":"1079","paper":"真考试卷17","no":27,"type":"单项选择题","q":"下图为S3C2410内置I2C总线的读写格式。下面关于该图的叙述中，错误的是（  ）。","o":["S为1位，代表起始位","R/W为2位，分别用于R（读）和W（写）","A为1位，代表应答位","P为1位，代表停止位"],"a":"B","e":"7位地址读写操作格式如图所示，由起始位S、7位从器件地址、读写操作位R/W. 应答位A、数据字节、应答位A以及停止位P构成。其中读写位R/W=1为读，R/W = 0为写。故本题选择B选项。","code":0},{"id":"1080","paper":"真考试卷17","no":28,"type":"单项选择题","q":"下图为采用RS-485接口进行通信的原理图，下面关于该图的叙述中，错误的是（  ）。","o":["图中的①和②分别为RXDn和TXDn","图中ARM芯片的GPF6为低电平时，图中的本机向从机发送数据","采用RS-485进行通信时，采用差分信号传输方式","图中的Rt为匹配电阻用于消除由于传输时线路阻抗不匹配造成的反射干扰"],"a":"B","e":"在ARM 芯片与RS - 485 接口通信中，通常会将芯片的接收引脚（RXDn）和发送引脚（TXDn）与接口芯片相连。图中①连接到 RS - 485 接口芯片的 RO（接收输出）引脚，所以①为 RXDn；②连接到 DI（数据输入）引脚，所以②为 TXDn，A选项正确；图中ARM芯片的GPF6连接到DE引脚，DE引脚连接的是非门（D）的输入端（高电平），所以当GPF6 为高电平时，本机向从机发送数据，而不是低电平，B选项错误；RS - 485 通信使用 A、B 两根线传输差分信号，通过两根线上信号的差值来表示数据，具有较强的抗干扰能力，C选项正确；为了消除由于传输时线路阻抗不匹配造成的反射干扰，通常会在传输线的两端连接匹配电阻 Rt，D选项正确。B选项错误，故本题答案为B选项。","code":0},{"id":"1081","paper":"真考试卷17","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，错误的是（  ）。","o":["最简单的软件结构是轮询结构，由小型的监控式嵌入式操作系统和应用软件构成","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构","中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件","带中断的轮询结构也称为前后台结构"],"a":"A","e":"在低端嵌入式系统中，处理器的处理能力较低，存储器容量很小，系统功能简单，通常只实现一些简单的控制操作。这种嵌入式系统不需要操作系统支持，应用软件直接在裸机上运行。故本题选择A选项。","code":0},{"id":"1082","paper":"真考试卷17","no":30,"type":"单项选择题","q":"VxWorks操作系统的I/O系统通过7个基本的I/O操作函数访问硬件设备，这7个函数中不包括（  ）。","o":["read()","create()","open()","load()"],"a":"D","e":"I/O系统通过7个基本的I/O操作函数访问硬件设备：创建文件create（）、 打开文件open()、读取文件read()、写入文件write()、关闭文件close()、移除文件remove() 和其他控制命令ioctl()。每个I/O操作函数在设备驱动程序中都有对应的实现函数。故本题选择D选项。","code":0},{"id":"1083","paper":"真考试卷17","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，错误的是（  ）。","o":["常见的HAL规范大多是由操作系统厂商提出的","硬件抽象层包括引导程序、硬件配置程序和硬件访问代码等。","μC/OS-II内核是Nios II系统的HAL系统库的组成部分之一","OEM适配层（OAL）是Windows Embedded Compact 7的BSP的组成部分之一"],"a":"C","e":"在Nios II系统硬件之上就是硬件抽象层HAL。应用程序可以直接运行在HAL之上,也可以运行在μC/OS-II等嵌入式操作系统之上。故本题选择C选项。","code":0},{"id":"1084","paper":"真考试卷17","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是（  ）。","o":["Bootloader又称为bootROM","在大多数嵌入式系统中，bootROM内不仅存储bootloader程序，还存储操作系统映像、应用程序代码和用户配置数据等信息","无论采用何种操作系统引导加载方式，最终都必须在ROM中直接运行操作系统代码","嵌入式系统正常工作时通常使用的启动方式为下载模式（downloading）"],"a":"B","e":"bootROM是指用来存储bootloader程序的非易失存储器，当前使用最多的类型是NOR Flash ROM。在大多数嵌入式系统中，bootROM内不仅存储bootloader程序，还存储操作系统映像、应用程序代码和用户配置数据等信息，即使系统断电，信息也不会丢失。不同的bootloader程序功能虽有差别，但都需要支持核心的操作系统引导（boot)和加载 (load)功能。复杂的bootloader程序还支持简单的用户命令交互、设置操作系统启动参数、 flash ROM编程下载、读写内存、系统自检、硬件调试等监控程序（monitor)功能。故本题选择B选项。","code":0},{"id":"1085","paper":"真考试卷17","no":33,"type":"单项选择题","q":"下列嵌入式操作系统中，没有定义统一的设备驱动程序框架的是（  ）。","o":["WinCE","VxWorks","μC/OS-II","Linux"],"a":"C","e":"一些小型的嵌入式操作系统（如μC/OS-II)往往只包括操作系统内核，不包括设备驱动程序，而且编写设备驱动程序也没有定义统一的框架。这类操作系统中的驱动程序的实现方式与不使用操作系统的嵌入式系统类似，开发工作完全由软件工程师自行完成。在WinCE、Linux和VxWorks等大型嵌入式操作系统中，往往自带一些标准设备的驱动程序，并且定义了统一的设备驱动程序框架。故本题选择C选项。","code":0},{"id":"1086","paper":"真考试卷17","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，正确的是（  ）。","o":["实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性。","民航飞机上的计算机系统中运行的都是硬实时任务。","硬实时系统的时限一定短于软实时系统。","程控电话交换机检测到用户摘机后必须在1秒钟内送出拨号音，则送拨号音任务的绝对时限即为1秒钟。"],"a":"A","e":"实时系统（Real-Time System)是必须在有限和确定的时间内对外部事件作出响应的信息系统。IEEE计算机协会实时系统技术委员会（IEEE-CS TCRTS)给出的实时系统定义是：正确性不仅取决于计算的结果，而且取决于产生结果的时间的计算系统。也即，实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性。无论是逻辑还是时序出现偏差，都将引起严重后果。故本题选择A选项。","code":0},{"id":"1087","paper":"真考试卷17","no":35,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，错误的是（  ）。","o":["VxWorks、RTEMS和QNX等都属于硬实时操作系统。","微内核结构的优点是效率较高，性能强。","VxWorks和QNX操作系统都属于微内核结构。","μC/OS操作系统不是完全免费的操作系统。"],"a":"B","e":"微内核结构的操作系统有很多优点，正好匹配嵌入式平台对操作系统的需求，非常适合于在嵌入式环境下应用。内核精简，结构紧凑，占用内存少，适合资源相对紧张的嵌入式系统；开发和维护方便；系统可以动态更新服务模块；微内核提供了一致性接口；所有的服务都通过消息传递方式调用；用户态任务不需要区分是内核级服务还是用户级服务。可扩展性与可配置性强，很适合嵌入式系统的可裁剪要求；可靠性高，各个服务进程在用户态运行，有自己的内存空间；以消息方式通信，一个服务进程出错不会影响到整个内核，从而增强了系统的健壮性；支持分布式系统。微内核结构的缺点主要体现在效率较低、性能相对较差，因为通信和上下文切换的开销大大增加。故本题选择B选项。","code":0},{"id":"1088","paper":"真考试卷17","no":36,"type":"单项选择题","q":"下列各操作系统中，属于嵌入式Linux发行版的是（  ）。","o":["RTAI","Mach","AIX","eCos"],"a":"A","e":"国内外都有众多嵌入式Linux发行版发布，其中比较有代表性的有μCLinux、 RTLinux、MontaVista Linux,Wind River Linux等。RTAI提供标准的Linux内核服务。国内也有中科院红旗嵌入式Linux、中软实时嵌入式Linux等。故本题选择A选项。","code":0},{"id":"1089","paper":"真考试卷17","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务和任务调度的陈述中，正确的是（  ）。","o":["当有更高优先级的任务处于就绪状态时，内核会触发一次外部中断。","μC/OS-II可以管理数十或数百个任务，每个任务都被赋予一个不同于其他任务的优先级。","在当前运行态任务因等待某一事件而被阻塞或被挂起时，会发生中断级的任务调度。","任务调度时，内核总是选择当前所有等待态任务中最高优先级的任务转入运行态。"],"a":"B","e":"μC/OS-II操作系统的特点之一是多任务。μC/OS-II可以管理64个任务（版本2. 82以后扩充至255个任务），其中8个保留给系统，其余用于用户任务。分配给不同任务的优先级不能相同，因此μc/os-II不支持时间片轮转（round-robin)调度机制。故本题选择B选项。","code":0},{"id":"1090","paper":"真考试卷17","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，正确的是（  ）。","o":["函数OSTaskCreateExt()用于在中断服务程序中创建任务。","在中断返回之前，必须调用退出中断函数OS_EXIT_CRITICAL()。","调用OSTaskSuspend()函数可以挂起一个任务，被挂起的任务可以调用OSTaskResume()函数实现任务恢复。","函数OSSchedLock()可以锁定调度器。"],"a":"D","e":"利用函数OSSchedLock()和OSSchedUnlock()给调度器上锁和解锁。当需要实现对不可分割数据的原子访问时，μC/OS-II可以用锁定任务调度器操作取代关中断，从而确保对数据的访问不被打断，且关中断的时间尽可能短，令系统能够尽快响应中断。调用OSTaskSuspend () 可挂起一个任务，被挂起的任务不能自己调用OSTaskResume () 恢复自身，需由其他任务通过调用OSTaskResume () 实现恢复。调用void OSSchedLock (void)可以锁定调度器，调用void OSSchedUnlock (void)则可以解锁调度器。故本题选择D选项。","code":0},{"id":"1091","paper":"真考试卷17","no":39,"type":"单项选择题","q":"下面有关开发套件GNU的说法中，错误的是（  ）。","o":["GNU开发套件中包括编译器、连接器、文本编辑器等，但不包括调试器。","GNU开发套件中的核心工具软件是GCC。","GCC在编译阶段可以检查输入文件中的代码语法是否正确。","GNU开发套件可以开发基于Linux的应用程序。"],"a":"A","e":"GNU是GNU’s Not Unix首字母的组合，是一种常用于开发基于Linux操作系统的嵌入式软件的工具套件简称。该工具套件是由Richard Stallman提出的GNU计划中，几个开源的工具组成，包括编译器、连接器、文本编辑器、语法除错等工具。GDB是GNU开发工具套件中的程序调试工具。故本题选择A选项。","code":0},{"id":"1092","paper":"真考试卷17","no":40,"type":"单项选择题","q":"在嵌入式系统开发时，不同复杂程度或应用背景的系统，其调试工具可能不相同。下面所列举的工具或软件中，不是调试工具或调试软件的是（  ）。","o":["在线仿真器。","指令集模拟器。","代码烧写器。","驻留监控软件。"],"a":"C","e":"不同复杂程度的嵌入式系统使用的调试工具不完全相同。嵌入式系统开发时，包括4种调试技术及工具，如在线仿真器、片上调试技术—JTAG、驻留监控软件调试以及指令集模拟器。故本题选择C选项。","code":0},{"id":"1114","paper":"真考试卷18","no":1,"type":"单项选择题","q":"下面关于嵌入式系统分类与发展的叙述中，错误的是（  ）。","o":["按嵌入式系统的用途可以把嵌入式系统分为军用、工业用和民用三类","按嵌入式系统产品形态来分，嵌入式系统可以分为系统级产品、板级产品和片级产品","嵌入式系统在20世纪90年代才开始出现","嵌入式系统将向着更高性能、更小功耗、更低成本的方向发展"],"a":"C","e":"第一个公认的现代嵌入式系统是20世纪60年代初美国麻省理工学院开发的阿波罗导航计算机。在阿波罗两次登月飞行中，太空驾驶舱和月球登陆舱的惯性导航系统都使用了这种嵌入式计算机。故本题选择C选项。","code":0},{"id":"1115","paper":"真考试卷18","no":2,"type":"单项选择题","q":"影响嵌入式系统中CPU性能的因素有多个方面。下面是与CPU性能相关的一些叙述： \nⅠ. CPU的性能与CPU时钟频率无关 \nⅡ. CPU性能与CPU的指令系统无关 \nⅢ. CPU性能与CPU的逻辑结构有关 \nⅣ. CPU性能与CPU芯片内部CACHE容量与结构有关 \n其中，正确的是（  ）。","o":["仅Ⅲ和Ⅳ","仅Ⅰ和Ⅱ","仅Ⅱ和Ⅲ","Ⅰ、Ⅱ、Ⅲ和Ⅳ"],"a":"A","e":"CPU的性能主要表现为程序（指令)执行速度的快慢。而影响程序（指令）执行速度的因素很多。主频（CPU时钟频率）  指CPU中门电路的工作频率，它决定着CPU芯片内部数据传输与操作速度的快慢。一般而言，主频越高，执行一条指令需要的时间就越短。指令系统中，指令的格式、类型、指令的数目和功能等都会影响程序的执行速度。程序运行过程中高速缓冲存储器（Cache)有利于减少CPU访问内存的次数，其容量越大、级数越多，其效用就越显著。CPU包含的定点运算器和浮点运算器数目、有无协处理器、流水线级数和条数、有无指令预测和数据预取功能等，都对指令执行的速度有影响。故本题选择A选项。","code":1},{"id":"1116","paper":"真考试卷18","no":3,"type":"单项选择题","q":"嵌入式系统硬件的逻辑组成可用下图描述，图中①、②、③、④处分别是（  ）。","o":["控制器、输入接口、用户界面、存储器","存储器、用户界面、输入接口、控制器","输入接口、控制器、存储器、用户界面","用户界面、存储器、控制器、输入接口"],"a":"C","e":"参照嵌入式计算机硬件的逻辑组成及其与外部世界关系的示意图可知：图中①、②、③、④处分别是输入接口、控制器、存储器、用户界面。故本题选择C选项。","code":0},{"id":"1117","paper":"真考试卷18","no":4,"type":"单项选择题","q":"下面关于SoC的叙述中，错误的是（  ）。","o":["SoC芯片是一种超大规模集成电路，芯片内集成了几乎整个计算机的全部电路","规模达数百万门以上的SoC芯片都是各公司从最底层开始设计的，不调用已有的IP核","通用的SoC芯片品种很多，嵌入式应用开发商可直接使用通用的SoC芯片开发嵌入式应用产品","专用的SoC芯片是嵌入式系统开发商依据待开发产品的特殊要求，向半导体企业定制的SoC芯片"],"a":"B","e":"规模达数百万门以上的SoC芯片的设计，不能一切从零开始。为提高设计效率，减少重复开发，集成电路制造商通常将合格的经过验证的集成电路(IC)设计文件存储在数据库中，供日后重复使用。故本题选择B选项。","code":0},{"id":"1118","paper":"真考试卷18","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，错误的是（  ）。","o":["GB2312采用双字节编码","标准ASCII码是8位编码","GB18030采用不等长编码","UTF-16是UCS/Unicode常用的编码方案之一"],"a":"B","e":"GB2312国标字符集中包含3 755个一级常用汉字和3 008个二级常用汉字，此外还有682个图形符号（包括拉丁字母、俄文、日文平假名与片假名、希腊字母、汉语拼音等）。这些汉字和图形符号在计算机内部都采用2字节（16个二进制位）来表示，每字节的最高位均规定为1。GB18030采用不等长的编码方法，单字节编码（128个）表示ASCII字符，与ASCII码兼容。 双字节编码（23 940个）表示汉字，与GB2312保持向下兼容（GB2312中包含的所有字符 GB1S030中也有，且编码相同）。还有约158万个四字节编码用于表示其他字符。标准ASCII码是7位编码，但由于字节是计算机中最基本的存储和处理单位，故一般仍使用一个字节来存放一个ASCII码。UTF-16采用的是双字节可变长编码。故本题选择B选项。","code":0},{"id":"1119","paper":"真考试卷18","no":6,"type":"单项选择题","q":"下列关于数字音频和数字视频的描述中，错误的是（  ）。","o":["波形声音的码率＝取样频率×量化位数×声道数（单位：b/s）","WAV是未经压缩的数字音频","固定电话通信中使用PCM编码的码率为16kb/s","音频信号的量化也就是模数转换"],"a":"C","e":"固定电话通信中使用PCM编码（脉冲编码调制，码率为64 kb/s)。音频量化就是把每个样本的模拟量转换成数字量来表示，因此量化过程往往也称为A/D转换（模数转换）。故本题选择C选项。","code":0},{"id":"1120","paper":"真考试卷18","no":7,"type":"单项选择题","q":"从现实世界中获得数字图像的过程经历的操作依次为（  ）。","o":["扫描、分色、取样、量化","取样、量化、压缩、编码","量化、取样、扫描、分色","扫描、量化、分色、取样、编码"],"a":"A","e":"图像获取过程的核心是模拟信号的数字化，它的处理步骤大致分为4步。（1）扫描将画面划分为M×N个网格，每个网格称为一个取样点。这样，一幅模拟图像就转换为M×N个取样点所组成的一个阵列。（2）分色将每个取样点的颜色分解成红、绿、蓝（R、G、B) 3个基色，如果是灰度图像或黑白图像，则不必进行分色。（3）取样：测量每个取样点的每个分量（基色）的亮度值。（4）量化：对取样点每个分量的亮度值进行A/D转换，即把模拟量使用数字量（一般是 8位至12位的正整数）来表示。故本题选择A选项。","code":0},{"id":"1121","paper":"真考试卷18","no":8,"type":"单项选择题","q":"以下关于路由器说法错误的是（  ）。","o":["路由器是遵循IP协议把异构网络互相连接起来的关键设备","路由器是一台高性能的嵌入式计算机系统，也是一种分组交换机","一个路由器通常连接多个网络","同一个路由器只能拥有一个IP地址"],"a":"D","e":"路由器是遵循IP协议把异构网络互相连接起来的关键设备，它屏蔽了不同网络的技术差异，能将发送设备的数据正确送达接收设备，确保了各种不同物理网络的无缝连接。路由器是一台高性能的嵌入式计算机系统，也是一种分组（IP数据报）交换机，其功能主要是选择路由和转发IP数据报，并进行协议转换。路由器有多个输入端口和多个输出端口， 路由器之间一般都使用高速通信链路连接。一个路由器通常连接多个网络，连接在哪个网络的端口，就被分配一个属于该网络的IP地址，所以同一个路由器会拥有多个不同的IP地址。故本题选择D选项。","code":0},{"id":"1122","paper":"真考试卷18","no":9,"type":"单项选择题","q":"关于ARM处理器的指令集说法错误的是（  ）。","o":["Thumb指令集是ARM指令集的一个子集","ARM指令集指令宽度为32位，而Thumb指令集指令宽度为16位","Thumb-2指令集既有16位指令宽度又有32位指令宽度","所有ARM处理器均具有Thumb-2指令集"],"a":"D","e":"ARM指令集全部是32位的指令，其基本指令主要用于进行8位、16位和32位整数的运算，通过扩展的协处理器（最多16个），可以扩充浮点运算指令、数字信号处理（DSP)指令、单指令多数据（SIMD)指令等，使处理器的功能大大扩展。从ARMv4T架构开始，几乎所有ARM处理器都支持Thumb指令集。Thumb全部是16位字长的指令，可以看作是ARM指令的压缩形式。它是为减少代码量而设计的，因为较短的指令整体上可以有更高的代码密度。Thumb-2指令集既有16位指令又有32位指令，是一个混合的指令集。它是16位Thumb指令集的超集，功能强大、完备，效率高。ARMv6、v7A&R以及v7M等版本中有Thumb-2指令集。故本题选择D选项。","code":0},{"id":"1123","paper":"真考试卷18","no":10,"type":"单项选择题","q":"在以下ARM处理器中，用于电池供电的嵌入式应用系统设计，且要求功耗和成本低，采用最合适的ARM处理器是（  ）。","o":["ARM9","ARM Cortex-A15","ARM Cortex-M0","ARM Cortex-R4"],"a":"C","e":"ARM Cortex-R4（R=Real time）系列是面向实时控制应用的处理器，响应速度快、性能合理、功耗低。ARM Cortex-M3（M=Microcontroller）系列是面向微控制器的处理器，性价比高、成本很低、功耗极小。ARM Cortex-A15（A=Application）系列是面向高端应用的处理器，它的工作效率高、性能好、功耗合理。ARM Cortex-M0处理器功耗和成本低，故本题选择C选项。","code":0},{"id":"1124","paper":"真考试卷18","no":11,"type":"单项选择题","q":"以下关于经典ARM处理器命名中TDMI说法错误的是（  ）。","o":["T为Thumb的英文缩写，表示支持Thumb指令集","D为Debug的英文缩写，表示支持片上调试","M为Microcontroller的英文缩写，表示为微控制器而设置","I为ICE的首字母，表示支持片内在线仿真"],"a":"C","e":"TDMI的含义为：T表示支持Thumb指令集，D 表示支持片上调试，M表示具有快速的64位乘法，I表示提供片内在线仿真（ICE)。故本题选择C选项。","code":0},{"id":"1125","paper":"真考试卷18","no":12,"type":"单项选择题","q":"以下关于ARM处理器CPSR寄存器相关位的说法错误的是（  ）。","o":["I为中断禁止控制位，I=1禁止外部IRQ中断，I=0允许IRQ中断","V为溢出标志，V=1表示运算结果有溢出，V=0表示运算结果没有溢出","Z为全零标志，Z=1表示运算结果为全0，Z=0表示运算结果全1","N为符号标志，N=1表示运算结果为负数，N=0表示运算结果为正数"],"a":"C","e":"程序状态寄存器CPSR的条件码标志含义为：N为符号标志，N=1表示运算结果为负数，N = 0表示运算结果为正数；Z为全0标志，Z=1表示运算的结果为零,Z=0表示运算的结果非零；C为进借位标志，加法有进位时C=1,无进位时C = 0;减法有借位时C = 0，无借位时C =1。要注意这里的减法借位标志与x86等常规定义有区别；V为溢出标志，加减法运算结果有溢出时V=1，否则V = 0。Q为增强的DSP运算指令是否溢出的标志，溢出时Q=1，否则Q = 0；控制位含义如下：I为中断禁止控制位，I=1禁止外部IRQ中断，I = 0允许IRQ中断；F为禁止快速中断FIQ的控制位，F=1禁止FIQ中断，F = 0允许FIQ中断；T为ARM与Thumb指令切换，T= 1时执行Thumb指令，否则执行ARM指令。故本题选择C选项。","code":0},{"id":"1126","paper":"真考试卷18","no":13,"type":"单项选择题","q":"关于经典ARM处理器的异常，以下说法正确的是（  ）。","o":["复位异常的中断向量地址为0","软件中断SWI属于管理模式，是级别最高的异常类型","外部中断请求IRQ属于外部中断模式，优先级别比快速中断请求级别高","当数据访问指令的目标地址不存在时，执行指令会产生指令预取中止PABT"],"a":"A","e":"软件中断SWI属于管理模式，是级别最低的异常类型；外部中断请求IRQ属于外部中断模式，优先级别为4，快速中断请求的优先级别为3；当数据访问指令的目标地址不存在或该地址不允许当前指令访问时，执行指令产生的结果，即数据访问中止DABT；复位异常的中断向量地址为0。故本题选择A选项。","code":0},{"id":"1127","paper":"真考试卷18","no":14,"type":"单项选择题","q":"关于ARM的存储器格式，以下说法正确的是（  ）。","o":["ARM有两种存储字的格式，一种是大端模式，一种是小端模式","大端模式是指数据高字节存放在高地址的一种模式","小端模式是指数据字低字节存放在高地址的一种模式","系统复位后自动进入大端模式"],"a":"A","e":"大端模式，32位数据字的高字节存储在低地址中，而数据字的低字节则存放在高地址中；小端模式：与大端模式存储数据完全不同，在小端模式下，32位数据字的高字节存放在高地址，而低字节存放在低地址；系统复位后默认是小端模式。故本题选择A选项。","code":0},{"id":"1128","paper":"真考试卷18","no":15,"type":"单项选择题","q":"执行ARM指令LDR R0,[R1],#4之后，以下说法正确的是（  ）。","o":["R0的内容不变","R1的内容不变","R1的内容左移了4位","内存中的数据不变"],"a":"D","e":"LDR  R0,[R1],#4的功能是以寄存器R1的内容为操作数的有效地址，取得操作数存入寄存器R0中，然后R1的内容自动增加4；故本题选择D选项。","code":0},{"id":"1129","paper":"真考试卷18","no":16,"type":"单项选择题","q":"对于经典ARM程序状态寄存器CPSR，以下说法错误的是（  ）。","o":["MRS R0，CPSR指令的含义是将CPSR的内容传递到R0中","MSR CPSR，R0指令的含义是将R0中的内容传递到CPSR中","CPSR包括了多个标志状态和控制位","CPSR不能决定ARM处理器的工作模式"],"a":"D","e":"ARM体系结构（除Cortex外）支持7种工作模式，取决于当前程序状态寄存器CPSR的低5位的值；ARM处理器工作模式间可以相互转换。当处理器工作于用户模式时， 除非发生异常，否则将不能改变工作模式。当发生异常时，处理器自动改变CPSR [M4：M0] 的值，进入相应的工作模式。故本题选择D选项。","code":0},{"id":"1130","paper":"真考试卷18","no":17,"type":"单项选择题","q":"以下ARM指令错误的是（  ）。","o":["AND R0,R0,#1","MOV R2,R4,LSR#2","STR R0,R1","MOV PC,LR"],"a":"C","e":"寄存器间接寻址是将指定的寄存器内容为地址，由该地址所指定的单元内容作为操作数。用于间接寻址的寄存器必须用[]括起来。STR功能是用于将寄存器到存储器的数据传送指令。故本题选择C选项。","code":0},{"id":"1131","paper":"真考试卷18","no":18,"type":"单项选择题","q":"在ARM汇编语言程序设计中，以下说法错误的是（  ）。","o":["ARM汇编语言必须用AREA伪指令定义代码段","ARM汇编语言必须以END结束","ARM汇编语言中的段必须有一个特定的名称","ARM汇编语言至少要有一个代码段和一个数据段"],"a":"D","e":"在ARM (Thumb)汇编语言程序中，以程序段为单位组织代码。段是相对独立的指令或数据序列，具有特定的名称。段可以分为代码段和数据段，代码段的内容为执行代码，数据段存放代码运行时需要用到的数据。一个汇编程序至少应该有一个代码段，当程序较长时，可以分割为多个代码段和数据段，多个段在程序编译链接时最终形成一个可执行的映像文件。故本题选择D选项。","code":0},{"id":"1132","paper":"真考试卷18","no":19,"type":"单项选择题","q":"下面关于嵌入式系统中电源模块的叙述中，错误的是（  ）。","o":["电源模块是嵌入式最小硬件系统的一个组成部分","嵌入式系统中的电源模块采用AC-DC模块时，模块的输入为直流电","设计嵌入式系统的电源电路时使用的78XX系列属于普通稳压器","设计嵌入式系统的电源电路时使用的LDO属于低压差稳压器"],"a":"B","e":"嵌入式系统常用的电源模块是交流变直流（AC-DC)模块、直流到直流（DC-DC)模块以及低压差稳压器（Low Dropout Regulator, LDO)。AC-DC模块完成交流电到直流电的变换， 如将市电220V AC直接变换为直流5V DC,这类模块视输出电流的大小不同而价位也不相同。故本题选择B选项。","code":0},{"id":"1133","paper":"真考试卷18","no":20,"type":"单项选择题","q":"下面关于ARM的AMBA的叙述中，错误的是（  ）。","o":["基于AMBA总线的处理器使用系统总线和外围总线来构成系统","AMBA的系统总线用于连接高速系统组件","AMBA的外围总线用于连接低速外围组件","ASB是AMBA1总线中的外围总线"],"a":"D","e":"按照AMBA总线规范，以ARM内核为基础的嵌入式处理芯片采用系统总线与外围总线两层结构的方式构建片上系统。系统总线从早期的ASB、AHB到AXI及ACE等不断发展，性能不断提高，主要用于连接高带宽快速组件，而外围总线APB支持的内置外设不断增加，性能也不断增强，它主要连接低带宽组件以及与外部相连的硬件组件。ASB是AMBA1总线中的系统总线。故本题选择D选项。","code":0},{"id":"1134","paper":"真考试卷18","no":21,"type":"单项选择题","q":"中断控制器是嵌入式系统中常用的硬件组成。下面关于中断控制器的叙述中，错误的是（  ）。","o":["中断控制器是介于ARM内核与其它硬件之间的一个部件，负责对其它硬件组件的中断请求进行管理和控制","处理中断有两种形式：标准的中断控制器和向量中断控制器（VIC）","标准中断控制器能区分中断的优先级","嵌套向量中断（NVIC）可以进行中断的嵌套，即高优先级的中断可以进入低优先级中断的处理过程中"],"a":"C","e":"标准中断控制器在一个外设设备需要服务时，发送一个中断请求信号给处理器核。中断控制器可以通过编程设置来忽略或屏蔽某个或某些设备的中断请求。中断处理程序通过读取中断控制器中与各设备对应的表示中断请求的寄存器内容，从而判断哪个设备需要服务。VIC比标准中断控制器的功能更为强大些，因为它区分中断的优先级，简化了判断中断源的过程，每个中断都应有相应的优先级和中断处理程序地址（称为中断向量），只有当一个新的中断其优先级高于当前正在执行的中断处理优先级时，VIC才向内核提出中断请求。根据中断类型的不同，VIC可以调用标准的中断异常处理程序。故本题选择C选项。","code":0},{"id":"1135","paper":"真考试卷18","no":22,"type":"单项选择题","q":"下面关于存储容量的叙述中，错误的是（  ）。","o":["存储器容量是指每一个存储芯片或模块能够存储的二进制位数","存储器容量以存储1位二进制数为最小单位","太字节用TB表示，内存容量为1TB，即2<SUP>20<\/SUP> B","内存容量=单元总数×数据位数/单元"],"a":"C","e":"存储器容量是指每一个存储芯片或模块能够存储的二进制位数。存储器容量以存储 1 位二进制位为最小单位（b)，容量单位有字节（Byte, B)、千字节 (Kilo-Byte, KB)、兆字节(Mega-Byte, MB)、吉字节(Giga-Byte, GB)、太字节(Tera-Byte, TB)、拍字节（Peta-Byte，PB)、艾字节(Exa-Byte, EB)、泽字节(Zetta-Byte, ZB)以及尧字 节(Yotta-Byte, YB)等。太字节用 TB 表示，内存容量为 1TB，即2<SUP>40<\/SUP>B。故本题选择 C 选项。","code":0},{"id":"1136","paper":"真考试卷18","no":23,"type":"单项选择题","q":"嵌入式系统中常使用下面的存储器，这些存储器中，不属于半导体存储器的是（  ）。","o":["FRAM","DRAM","PROM","MROM"],"a":"A","e":"半导体存储器包括RAM和ROM。 RAM随机存取存储器，其包括静态随机存取存储器（SRAM）和动态随机存取存储器（DRAM）；ROM只读存储器，其包括掩模型只读存储器（MROM）、一次可编程只读存储器（PROM）、紫外线可擦除可编程只读存储器（EPROM）、电可擦除可编程只读存储器（E2PROM）以及闪速存储器 Flash（NOR 与NAND 两类）；故本题选择 A 选项。","code":0},{"id":"1137","paper":"真考试卷18","no":24,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线接口的叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C总线是集成电路互连总线的简称","I<SUP>2<\/SUP>C总线有两条信号线：数据线SDA，时钟线SCL","I<SUP>2<\/SUP>C总线是一种串行全双工传输的总线标准","I<SUP>2<\/SUP>C总线属于多主总线，即允许总线上有一个或多个主控器件和若干从器件同时进行操作"],"a":"C","e":"I2C (Inter-Integrated Circuit)是集成电路互连的一种总线标准，只有两根信号线，一根是时钟线 SCL, —根是数据线 SDA (双向三态），即可完成数据的传输操作。具有特定的起始位和终止位，可完成同步半双工串行通信方式，常用于板级芯片之间的短距离低速通信。故本题选择 C 选项。","code":0},{"id":"1138","paper":"真考试卷18","no":25,"type":"单项选择题","q":"UART按确定的格式按位传送一次信息。下面关于信息传送格式的叙述中，错误的是（  ）。","o":["每次传送时以起始位作为传送的开始","每次传送时以停止位作为传送的结束","一次传送的信息位是固定的，只能是8个二进制位","起始位只能是逻辑0，停止位只能是逻辑1"],"a":"C","e":"串行异步通信接口通用异步收发器（UART) 常用于全双工串行异步通信。发送器负责字符的发送，可采用先进先出（FIFO)模式，也可采用普通模式。发送的字符先送到发送缓冲寄存器，然后通过移位寄存器，在控制单元的作用下，通过 TXDn 引脚一位一位顺序发送出去。一般接收和发送缓冲器的FIFO字节数N是一样大小的，均可编程选择长度，如 4B、 8 B, 12 B、16 B、32 B、64 B 等。不同ARM 芯片，FIFO 缓冲器最大字节数N不同。起始位以逻辑0为标志，停止位以逻辑 1 为标志。故本题选择 C 选项。","code":0},{"id":"1139","paper":"真考试卷18","no":26,"type":"单项选择题","q":"下图为基于ARM处理器的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，错误的是（  ）。","o":["图中所示的键盘接口采用了非编码键盘（线性键盘）的结构","采用行扫描法读取键值","读取键盘值时可以采用中断方式","读取键盘值时需考虑消除键按下时产生的抖动问题"],"a":"A","e":"非编码键盘（线性键盘）利用 GPIO引脚连接按键。在这里采用行列矩阵式键盘设计方法，即行扫描法，采用四根 I/O 引脚 GPG4~GPG7 作为行扫描输出，四根 I/O引 脚 GPF0-GPF3 作为输入检测，同时这四个输入引脚接一四输人与门（如74HC21/74AS21 等），与门输出接外部中断2即 EXINT2 引脚。这样可以采用中断方式，读取键盘值（0~F), 在中断服务程序中判断 GPF0?GPF3 哪个引脚为低电平，然后结合输出扫描的行号即可合成对应的键值。故本题选择 A 选项。","code":0},{"id":"1140","paper":"真考试卷18","no":27,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是（  ）。","o":["USB 3.0的最大传输速率达5Gb/s","USB 3.0可以实现全双工通信方式","S3C2410仅配备了USB设备接口，不具有USB主控制器接口","S3C2410的USB设备接口挂在S3C2410的APB总线上"],"a":"C","e":"USB是目前应用最广泛的串行总线接口。USB3.0的最大速度为5Gb/s，可以实现全双工通信方式，S3C2410内置USB控制器，USB设备接口挂接在S3C2410的APB总线上。故本题选择 C 选项。","code":0},{"id":"1141","paper":"真考试卷18","no":28,"type":"单项选择题","q":"下图为使用CAN总线互连的两个CAN节点，为使该图完整，图中①、②、③、④处应分别标注（  ）。","o":["TXD、RXD、CANH、CANL","CANH、CANL、RXD、TXD","TXD、CANL、RXD、CANH","RXD、CANH、TXD、CANL"],"a":"B","e":"从 CAN 总线的连接图中可以看出图中①、②、③、④依次是 CANH、CANL、RXD、TXD。CAN 传输线最好用双绞线，这样使每根线上的干扰均等，通过差分，即可完全消除共模干扰。互连时采用同名端相连，仅需两根线（双绞线），CANH 与 CANH 相连，CANL 与 CANL 相连。一般面向控制应用领域的 ARM 芯片内部已经嵌入了 CAN 总线控制器，外部仅需要连接 CAN 的收发器即可构建完整的 CAN 网络。故本题选择 B 选项。","code":0},{"id":"1142","paper":"真考试卷18","no":29,"type":"单项选择题","q":"数字万用表的控制软件最适合采用的软件结构是（  ）。","o":["通用嵌入式操作系统+应用软件的结构","监控式操作系统+应用软件的结构","简单的轮询结构","带中断的轮询结构"],"a":"C","e":"简单的轮询结构的优点是程序结构简单，便于编程。由于没有中断机制，因而不会出现程序随机切换带来的潜在问题。数字万用表的控制软件采用了简单的轮询结构。软件在每一次循环中检查旋转开关的位置或按键的状态，然后执行相应的分支程序来完成相应的测量操作，再调整结果的格式，并把结果输出到显示屏上。这种结构只适用于系统的任务数量较少、任务处理简单且实时性要求不高的场景。故本题选择 C 选项。","code":0},{"id":"1143","paper":"真考试卷18","no":30,"type":"单项选择题","q":"VxWorks操作系统的I/O系统通过7个基本的I/O操作函数访问硬件设备，这7个函数中不包括（  ）。","o":["login()","create()","read()","remove()"],"a":"A","e":"VxWorks操作系统的I/O系统通过7个基本的 I/O操作函数访问硬件设备。这7个函数分别为：创建文件create（）、打开文件open()、读取文件read()、写入文件 write()、关闭文件close()、移除文件remove()和其他控制命令ioctl()。每个 I/O 操作函数在设备驱动程序中都有对应的实现函数。故本题选择 A 选项。","code":0},{"id":"1144","paper":"真考试卷18","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，错误的是（  ）。","o":["常见的HAL规范大多是由硬件制造商提出的","Nios II系统的HAL系统库提供的服务包括ANSI C标准库","由于SoPC系统的软件和硬件都是借助集成的SoPC开发平台统一配置开发的，所以特定硬件系统的HAL可以由开发工具自动生成","开发全新BSP的通常做法是以操作系统厂商提供的BSP模板为依据，按照特定的要求逐步设计与硬件平台相对应的代码"],"a":"A","e":"常见的HAL规范大多是由操作系统厂商提出的。为了实现OS在不同硬件平台之间的可移植性，许多OS厂商会定义硬件无关代码与硬件相关代码之间的接口规范。硬件无关的OS代码在不同硬件平台上是相同的，由OS厂商提供。而依赖于硬件的代码通常要由用户或硬件制造商专门编写，这部分代码通常被称为板级支持包。板级支持包屏蔽了其所支持的嵌入式操作系统与底层硬件平台之间的相关性，使嵌入式操作系统能够通用于BSP所支持的不同硬件平台，实现嵌入式操作系统的可移植性和跨平台性。故本题选择A选项。","code":0},{"id":"1145","paper":"真考试卷18","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，错误的是（  ）。","o":["支持不同硬件结构的bootloader程序有不同的版本。","在大多数嵌入式系统中，bootROM内不仅存储bootloader程序，还存储操作系统映像、应用程序代码和用户配置数据等信息。","大多数从Flash存储器上启动的bootloader程序采用三阶段执行过程。","不同的bootloader程序功能虽有差别，但大多支持操作系统引导和加载功能。"],"a":"C","e":"Bootloader是嵌入式系统在加电后执行的第一段代码，在它完成CPU和相关硬件的初始化之后，再将操作系统映像或固化的嵌入式应用程序装载到内存中然后跳转到操作系统所在的空间，启动操作系统运行。Bootloader启动大多数都分为两个阶段。第一阶段主要包含依赖于CPU的体系结构硬件初始化的代码，通常都用汇编语言来实现。这个阶段的任务有：基本的硬件设备初始化（屏蔽所有的中断、关闭处理器内部指令/数据Cache等）。为第二阶段准备RAM空间。如果是从某个固态存储媒质中，则复制Bootloader的第二阶段代码到RAM。设置堆栈，跳转到第二阶段的C程序入口点。第二阶段通常用C语言完成，以便实现更复杂的功能，也使程序有更好的可读性和可移植性。这个阶段的任务有：初始化本阶段要使用到的硬件设备；检测系统内存映射；将内核映像和根文件系统映像从Flash读到RAM；为内核设置启动参数；调用内核。故本题选择 C 选项。","code":0},{"id":"1146","paper":"真考试卷18","no":33,"type":"单项选择题","q":"下列关于设备驱动程序的陈述中，错误的是（  ）。","o":["设备驱动程序只能被高层软件调用而无法自行运行。","无论使用何种嵌入式操作系统，编写设备驱动程序都必须遵循操作系统定义的统一驱动程序框架。","设备驱动程序对上层软件屏蔽硬件细节，对下层硬件直接进行操作。","Linux操作系统把I/O设备抽象成设备文件。"],"a":"B","e":"一些小型的嵌入式操作系统（如μC/OS-II)往往只包括操作系统内核，不包括设备驱动程序，而且编写设备驱动程序也没有定义统一的框架。这类操作系统中的驱动程序的实现方式与不使用操作系统的嵌入式系统类似，开发工作完全由软件工程师自行完成。在 WinCE、Linux 和 VxWorks 等大型嵌入式操作系统中，往往自带一些标准设备的驱动程 序，并且定义了统一的设备驱动程序框架。软件工程师必须按照规定的框架开发自己的设备驱动程序，才能与操作系统内核相互协同。故本题选择 B 选项。","code":0},{"id":"1147","paper":"真考试卷18","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，错误的是（  ）。","o":["实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性。","硬实时系统的时限一定短于软实时系统。","实时系统必须与外部环境实现良好的协同与交互。","程控电话交换机检测到用户摘机后必须在1秒钟内送出拨号音，则送拨号音任务的相对时限即为1秒钟。"],"a":"B","e":"硬实时、软实时与准实时的概念与时限的长短没有关系，而与其对超过时限的容忍程度有关。如果一个任务在时限到达之时尚未完成，对软实时系统来说还是可以容忍的，最多只会降低系统性能；但对硬实时系统来说则是无法接受的，因为这样带来的后果根本无法预测，甚至可能是灾难性的。相对于软实时系统，硬实时系统的时限并不一定更短。故本题选择 B 选项。","code":0},{"id":"1148","paper":"真考试卷18","no":35,"type":"单项选择题","q":"下列各项中，均属于硬实时操作系统的是（  ）。","o":["RTEMS和Linux","Windows 7和Linux","VxWorks和QNX","Windows 10和QNX"],"a":"C","e":"硬实时操作系统主要用于通信、军事、航天、控制等领域，与人的交互性要求相对较弱，可靠性和实时性要求高，运行环境复杂多变。VxWorks、RTEMS, QNX、μC/OS-II、Nucleus 等都属于硬实时操作系统。故本题选择 C 选项。","code":0},{"id":"1149","paper":"真考试卷18","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，正确的是（  ）。","o":["相对于商业嵌入式操作系统，免费的嵌入式操作系统稳定性更高，应用产品开发周期更短。","Dalvik是苹果等厂商合作开发的用于iOS平台的Java虚拟机。","商业实时操作系统Nucleus通常以二进制代码的形式发售。","内核是操作系统中的一组核心程序模块，其作用是管理系统资源、支持多任务并发执行。"],"a":"D","e":"内核是操作系统中的一组核心程序模块，其作用是管理系统资源、支持多任务并发执行，通常驻留在内核空间，运行于核心态，具有访问硬件设备和所有主存空间的权限，是系统中仅有的能够执行特权指令的程序。故本题选择 D选项。","code":0},{"id":"1150","paper":"真考试卷18","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，正确的是（  ）。","o":["在中断返回之前，必须调用退出中断函数void OSSchedUnlock(void)。","任务可以挂起自己或者挂起其它任务。","函数OSTaskDel()不能被用于删除任务自身，但可以删除其他任务。","多个任务可以同时等待同一事件的发生。当该事件发生后，所有等待该事件的任务都将获得该信号并转入就绪状态。"],"a":"B","e":"任务可以挂起自己或者挂起其他任务。调用OSTaskSuspend()函数可以挂起一个任务，而被挂起的任务只能等待其他任务调用OSTaskResume()函数才能实现任务恢复。如果任务在被挂起时正在等待延时，则挂起操作将被取消。故本题答案为B选项。","code":0},{"id":"1151","paper":"真考试卷18","no":38,"type":"单项选择题","q":"μC/OS-II操作系统有多种在任务间共享数据和实现任务间通信的方法。下列说法中正确的是（  ）。","o":["函数OSQAccept()在没有接收到消息时会挂起任务。","函数OSSemPost()释放信号量。","函数OSFlagCreate()可以被任务或中断服务程序调用。","中断服务程序不能通过ECB向任务发出信号。"],"a":"B","e":"函数 OSSemPost（）释放信号量。0SSemPost()首先检查是否有任务正在等待该信号量，如果没有，则0SSemPOSt()函数将信号量的计数值加 1,函数返回。如果有任务正在等待该信号量，则其中最高优先级的任务将得到信号量并进入就绪状态。 如果得到信号量的任务的优先级比调用 OSSemPost()函数的任务的优先级高，则任务调度函数将进行任务切换。否则，调用OSSemPost()的任务将继续执行。如果在中断服务程序中调用 OSSemPost()函数，则不会发生任务切换。如果需要，任务切换要等到中断嵌套的最外层中断服务程序调用OSIntExit()函数时才进行。根据 0SSemPOSt()函数的返回值可以判断信号量释放是否成功：OS_NO_ERR 表示信号量释放成功；OS_SEM_OVF 表示信号量的值溢出。故本题选择 B选项。","code":0},{"id":"1152","paper":"真考试卷18","no":39,"type":"单项选择题","q":"下面对嵌入式系统开发过程的描述语句中，错误的是（  ）。","o":["需求分析阶段需分析用户的功能性需要和非功能性需求。","构件设计阶段即为详细设计，构件指的是硬件芯片，不包括软件模块。","系统集成与测试阶段将把所有构件集成，得到一个可以实际运行的系统。","测试的目的是验证系统的功能和性能，发现错误。"],"a":"B","e":"需求分析阶段需分析用户的功能性需要和非功能性需求。构件设计分成硬件构件设计和软件构件设计两部分来进行。硬件构件设计时首先进行芯片的选型。系统集成与测试阶段将把所有构件集成，得到一个可以实际运行的系统。测试的目的是验证系统的功能和性能，发现错误。故本题选择 B 选项。","code":0},{"id":"1153","paper":"真考试卷18","no":40,"type":"单项选择题","q":"RVDS开发工具套件中主要包括了工程管理器（IDE）、编译连接器（RVCT）、调试器（RVD）和指令集仿真器（RVISS）等。下面的语句中，说法错误的是（  ）。","o":["IDE用于源程序的编辑工作，且以工程项目的形式管理源文件。","RVCT完成对源程序的编译连接，支持C语言，但不支持汇编语言。","RVD是调试器，支持在线仿真器的调试方式。","RVISS支持外设虚拟，并支持代码性能分析。"],"a":"B","e":"RVCT 模块完成对源文件进行编译连接，支持全系列的 ARM 和 Xscale 架构，支持汇编、C 和 C++。RVCT 编译器生成的执行代码容量小，执行效率高，这主要是因为它支持二次编译和代码数据压缩技术。故本题选择 B 选项。","code":0},{"id":"1175","paper":"真考试卷19","no":1,"type":"单项选择题","q":"下面关于嵌入式系统分类的叙述中，错误的是（  ）。","o":["嵌入式系统按实时性要求可以分为非实时系统、软实时系统和硬实时系统","嵌入式系统按产品形态可以分为系统级产品、板级产品和片级产品","嵌入式系统按软硬件技术复杂的程度可以分为低端系统、中端系统和高端系统","基于可靠性方面的考虑，军用电子装备中一般不使用嵌入式系统，因此嵌入式系统按用途分为工业用和民用两类"],"a":"D","e":"按嵌入式系统的用途可以把嵌入式系统分为军用、工业用和民用三大类。其中，军用和工业用嵌入式系统的运行环境要求比较苛刻，如耐高温/低温、耐湿、耐冲击、耐强电磁干扰、耐粉尘、耐腐蚀等。民用嵌入式系统则要求易于使用、易维护和性价比高等。故本题选择D选项。","code":0},{"id":"1176","paper":"真考试卷19","no":2,"type":"单项选择题","q":"影响嵌入式系统性能的因素有多个方面，下面与嵌入式系统性能相关叙述中，错误的是（  ）。","o":["系统性能与CPU时钟频率有关","系统性能与CPU的指令系统有关","系统性能与CPU的逻辑结构无关","系统性能与CPU芯片内部Cache容量与结构有关"],"a":"C","e":"嵌入式系统的性能在很大程度上是由CPU决定的。CPU的性能主要表现为程序（指令)执行速度的快慢，而影响程序（指令）执行速度的因素很多，例如：主频（CPU时钟频率）：指CPU中门电路的工作频率，它决定着CPU芯片内部数据传输与操作速度的快慢。一般而言，主频越高，执行一条指令需要的时间就越短。指令系统：指令的格式、类型和指令的数目、功能等都会影响程序的执行速度。高速缓冲存储器的容量与结构：程序运行过程中高速缓冲存储器（Cache)有利于减少CPU访问内存的次数。通常，其容量越大、级数越多，其效用就越显著。逻辑结构：CPU包含的定点运算器和浮点运算器数目、有无协处理器、流水线级数和条数、有无指令预测和数据预取功能等，都对指令执行的速度有影响。故本题选择C选项。","code":0},{"id":"1177","paper":"真考试卷19","no":3,"type":"单项选择题","q":"嵌入式系统硬件的逻辑组成可用下图描述，图中①、②、③、④处分别是（  ）。","o":["用户界面、测控对象、存储器、运算器","测控对象、用户界面、运算器、存储器","测控对象、运算器、存储器、用户界面","用户界面、存储器、运算器、测控对象"],"a":"C","e":"参照嵌入式计算机硬件的逻辑组成及其与外部世界关系的示意图可知：图中①、②、③、④处分别是测控对象、运算器、存储器、用户界面；故本题选择C选项。","code":0},{"id":"1178","paper":"真考试卷19","no":4,"type":"单项选择题","q":"下面列出了4种处理器的产品类型：Ⅰ.微处理器Ⅱ.数字信号处理器（DSP）Ⅲ.微控制器（单片机） Ⅳ.片上系统（SoC）其中，可以用作嵌入式处理芯片的产品类型是（  ）。","o":["仅Ⅰ","仅Ⅰ和Ⅱ","仅Ⅰ、Ⅱ和Ⅲ","全部"],"a":"D","e":"目前，嵌入式处理芯片有以下4种产品类型：微处理器、数字信号处理器、微控制器（单片机）及SoC（片上系统）；故本题选择D选项。","code":0},{"id":"1179","paper":"真考试卷19","no":5,"type":"单项选择题","q":"下列各项中，属于无损压缩数字音频文件格式的是（  ）。","o":["BMP","APE","WAV","MP3"],"a":"B","e":"无损压缩数字音频文件格式包括FLAC、APE、M4A；WAV属于未压缩，MP3属于有损压缩；BMP属于图像文件格式；故本题选择B选项。","code":0},{"id":"1180","paper":"真考试卷19","no":6,"type":"单项选择题","q":"数字音频未压缩前，波形声音的码率的计算公式为（单位：b/s）（  ）。","o":["取样频率×量化位数×声道数","量化位数×声道数/取样频率","取样频率×量化位数×量化精度","分辨率×量化位数/声道数"],"a":"A","e":"数字音频未压缩前，波形声音的码率的计算公式为：波形声音的码率=取样频率×量化位数×声道数；故本题选择A选项。","code":0},{"id":"1181","paper":"真考试卷19","no":7,"type":"单项选择题","q":"声音信号的数字化过程必须要经历的操作依次为（  ）。","o":["编码、取样、量化","取样、量化、压缩、编码","取样、数模转换、编码","取样、量化、编码"],"a":"D","e":"取样，声音信号数字化的过程是将模拟声音信号取样，把时间上连续的声音信号离散为不连续的一系列的样本；量化，就是把每个样本的模拟量转换成数字量来表示；编码，经过取样和量化得到的数据必须进行数据压缩，以减少数据量，并按某种格式将数据组织为文件，以便于计算机进行存储、处理和传输。故本题选择D选项。","code":0},{"id":"1182","paper":"真考试卷19","no":8,"type":"单项选择题","q":"IP地址分为A类、B类和C类3个基本类，对于IPV4，IP地址所占的二进制位的个数为（  ）。","o":["8位","16位","32位","64位"],"a":"C","e":"IP协议第4版（简称IPv4)规定，每个IP地址使用4 B (32个二进制位）表示，其中包含有网络号和主机号两部分。前者用来指明主机所从属的物理网络的编号（称为网络号），后者是主机在所属物理网络中的编号（称为主机号）。故本题选择C选项。","code":0},{"id":"1183","paper":"真考试卷19","no":9,"type":"单项选择题","q":"关于ARM处理器，以下说法错误的是（  ）。","o":["ARM处理器采用RISC架构","ARM处理器都是32位字长","ARM处理器采用低功耗设计","ARM处理器访问存储器和外设只使用存储和加载指令"],"a":"B","e":"主流ARM为32位处理器。与其他处理器相比，主要特点有耗电省、功能强、成本低、32 位和16位指令集并存，它具有众多的合作伙伴，使用面非常广泛，是其他处理器所不及的。由于ARM采用RISC体系结构，因此其结构上的技术特征大多属于RISC技术的特征。结合ARM自身特点，ARM具有的技术特征如下：单周期操作、只使用加载/存储指令访问内存、指令长度固定、三地址指令格式、指令流水线技术和低功耗设计。故本题选择B选项。","code":0},{"id":"1184","paper":"真考试卷19","no":10,"type":"单项选择题","q":"在ARM处理器中，用于实时性要求比较高的场合，采用最合适的ARM处理器的是（  ）。","o":["ARM7","ARM9","ARM Cortex-M3","ARM Cortex-R4"],"a":"D","e":"ARM Cortex-R4（R=Real time）系列是面向实时控制应用的处理器，响应速度快、性能合理、功耗低。ARM Cortex-M3（M=Microcontroller）系列是面向微控制器的处理器，性价比高。成本很低、功耗极小。故本题选择D选项。","code":0},{"id":"1185","paper":"真考试卷19","no":11,"type":"单项选择题","q":"以下ARM处理器中，内部具备存储器管理部件的是（  ）。","o":["ARM720T","ARM920T","ARM Cortex-M0","ARM Cortex-M4"],"a":"B","e":"存储器管理单元（MMU)是许多高性能处理器所必需的重要部件之一。基于ARM架构的系列微处理器中，ARM720T、ARM922T、ARM920T、ARM926EEJ-S、ARM10、ARM11、 XScale以及Cortex-A系列等内部均已集成了MMU部件。注：考试时本题的答案为B选项。","code":0},{"id":"1186","paper":"真考试卷19","no":12,"type":"单项选择题","q":"ARM处理器能够在休眠情况下，通过中断机制来唤醒处理器的关键部件是（  ）。","o":["MMU","MPU","NVIC","WIC"],"a":"D","e":"WIC是唤醒中断控制器的简称，可以通过中断机制唤醒处理器的关键部件。故本题选择D选项。","code":0},{"id":"1187","paper":"真考试卷19","no":13,"type":"单项选择题","q":"关于经典ARM处理器的工作模式，以下说法正确的是（  ）。","o":["用户模式是程序执行中断服务程序的工作模式","外部中断模式用来处理快速中断FIQ","管理模式是操作系统的保护模式，处理硬件中断","中止模式处理存储器故障，实现虚拟存储器和存储保护"],"a":"D","e":"用户模式User功能是程序正常执行工作模式；管理模式SVC功能是操作系统的保护模式，处理软中断SWI；外部中断模式IRQ功能是用于普通中断处理；中止模式ABT的功能是处理存储器故障，实现虚拟存储器和存储器保护；故本题选择D选项。","code":0},{"id":"1188","paper":"真考试卷19","no":14,"type":"单项选择题","q":"以下关于ARM状态寄存器CPSR的说法正确的是（  ）。","o":["CPSR保存了发生中断时的中断向量","CPSR不能控制是否允许外部中断","CPSR决定ARM的工作模式","CPSR所有位都是只读位，不可写"],"a":"C","e":"ARM体系结构（除Cortex外）支持7种工作模式，取决于当前程序状态寄存器CPSR的低5位的值；ARM处理器工作模式间可以相互转换，但是是有条件的。当处理器工作于用户模式时，除非发生异常，否则将不能改变工作模式。当发生异常时，处理器自动改变CPSR [M4 ：M0] 的值，进入相应的工作模式。故本题选择C选项。","code":0},{"id":"1189","paper":"真考试卷19","no":15,"type":"单项选择题","q":"执行ARM指令STR R1,[R2,#4]!之后，以下说法正确的是（  ）。","o":["R1的值加4","R2的值加4","内存中的数据保持不变","R1和R2的值均改变"],"a":"B","e":"STR R1,[R2,#4]首先计算内存地址R2的当前值加上偏移量4，即R2+4，然后将寄存器R1中的值写入到这个计算出的内存地址（R2+4）中，R1的值没有发生改变，内存中的数据发生了改变，又因为指令中带有!，所以基址寄存器R2的值会被更新为新的地址值，即R2的值变为R2+4。综上所述，B选项说法是正确的，本题答案为B选项。","code":0},{"id":"1190","paper":"真考试卷19","no":16,"type":"单项选择题","q":"已知R5=0x000000AA,执行ARM指令BIC R4,R5,#8后，R4的值为（  ）。","o":["0x000000B3","0x000000AA","0x000000A2","0x00000550"],"a":"C","e":"BIC的操作是位清零，即BIC R4,R5，#8，即将R4←R5 AND NOT（#8）得到0x000000A2。故本题选择C选项。","code":0},{"id":"1191","paper":"真考试卷19","no":17,"type":"单项选择题","q":"以下ARM指令错误的是（  ）。","o":["ADD R1,R2,#1","MOV R2,R4","LDR R1,R7","BX  R0"],"a":"C","e":"寄存器间接寻址就是以寄存器的内容作为操作数地址，而操作数本身存放在存储器中。用于间接寻址的寄存器必须用[]括起来。LDR功能是用于将存储器到寄存器的数据传送指令。故本题选择C选项。","code":0},{"id":"1192","paper":"真考试卷19","no":18,"type":"单项选择题","q":"在ARM汇编语言中，对于伪指令（  ）。\n EXPORT  Reset_Handler \n 以下说法错误的是：","o":["是一个全局标号声明伪指令，标号为Reset_Handler","Reset_Handler在本源文件中","通知编译器当前文件要引用标号Reset_Handler","其它文件可以引用标号Reset_Handler"],"a":"C","e":"EXPORT标号的功能是全局标号声明伪指令，标号为Reset_Handler，其他文件可以引用；故本题选择C选项。","code":1},{"id":"1193","paper":"真考试卷19","no":19,"type":"单项选择题","q":"下面关于嵌入式系统中电源模块的叙述中，错误的是（  ）。","o":["电源模块是嵌入式最小硬件系统的一个组成部分","嵌入式系统中的电源模块采用AC-DC模块时，模块的输入是交流电","嵌入式系统中的电源模块采用DC-DC模块时，模块的输入是直流电","LDO是一种典型的AC-DC模块"],"a":"D","e":"LDO（Low Dropout Regulator）表示低压差稳压器；AC-DC是交流变直流模块、DC-DC是直流到直流模块。故本题选择D选项。","code":0},{"id":"1194","paper":"真考试卷19","no":20,"type":"单项选择题","q":"下面关于ARM的AMBA的叙述中，错误的是（  ）。","o":["AMBA是由ARM公司制定的一种总线规范","AMBA即先进的微控制器总线体系结构","AMBA已经有多个版本","AMBA仅定义了ARM处理器内部快速组件的接口标准（通常称为系统总线）"],"a":"D","e":"按照AMBA总线规范，以ARM内核为基础的嵌入式处理芯片采用系统总线与外围总线两层结构的方式构建片上系统，系统总线从早期的ASB、AHB到AXI及ACE等不断发展，性能不断提高，主要用于连接高带宽快速组件，而外围总线APB支持的内置外设不断增加，性能也不断增强，它主要连接低带宽组件以及与外部相连的硬件组件。故本题选择D选项。","code":0},{"id":"1195","paper":"真考试卷19","no":21,"type":"单项选择题","q":"下面是关于ARM嵌入式芯片中的GPIO的叙述，其中错误的是（  ）。","o":["GPIO即通用输入/输出端口","有些GPIO引脚有多种功能可以选择","S3C2410的GPIO端口有GPA、GPB～GPH共8个","S3C2410的每个不同的GPIO端口的引脚数相同"],"a":"D","e":"GPIO (General Purpose Input Output)即通用输入/输出端口，作为通用的输入或输出端口使用。作为输入时具有缓冲功能，而作为输出时则具有锁存功能，GPI0也可以作为双向I/O 使用。在ARM处理芯片中，GPI0引脚通常是多功能使用的，目的是为了减少芯片引脚数，缩小PCB面积，以减少功耗。有的引脚是双功能的，也有三功能甚至四功能的引脚，不同厂家的ARM处理芯片其具体引脚的定义不同。故本题选择D选项。","code":0},{"id":"1196","paper":"真考试卷19","no":22,"type":"单项选择题","q":"下面是关于S3C2410的时钟及电源管理组件的叙述，其中错误的是（  ）。","o":["ARM芯片内部在时钟控制器、电源控制器以及USB控制器控制下，可产生不同需求的时钟信号","掉电模式下，电源管理模块将断开内部电源，除非唤醒逻辑有效，否则内核不产生功耗。","休眠模式下，电源管理模块仅断开ARM内核时钟,CPU处于休眠状态，但仍为外围硬件组件提供时钟","复位操作既可以使ARM芯片进入正常模式，也可以使芯片进入休眠模式等其他模式"],"a":"D","e":"任何情况下复位操作均自动进入正常工作模式。在正常模式下，当慢速控制位SL0W_ BIT=1时进人慢速模式，当休眠控制位IDLE_BIT=1时进人休眠模式，当掉电控制位POWER_BIT=1时进入掉电模式。在掉电模式和休眠模式下，只要有任何一个外部中断EINT [0:23] 或RTC时钟中断发生，均将返回到正常模式。故本题选择D选项。","code":0},{"id":"1197","paper":"真考试卷19","no":23,"type":"单项选择题","q":"下面关于嵌入式系统使用的存储器的叙述中，错误的是（  ）。","o":["FRAM和MRAM是非易失性随机存取存储器","SRAM和DRAM的存取速度基本相同","ROM是只读存储器的英文缩写","近年来出现了除半导体存储器之外的新型存储器，如FRAM等"],"a":"B","e":"随机存取存储器包括静态和动态两种形式，即SRAM和DRAM,它们都是易失性存储器，即掉电后信息丢失。在计算机组成原理中已知，SRAM是靠双稳态电路的两个稳定状态来记录信息0和1的，而DRAM是靠存储单元的晶体管极间电容的充放电状态来存放信息0和1的。由于电容容易漏电，因此必须定时进行刷新以保持原来的信息不变，使用时外部需要提供刷新电路。因此目前嵌入式处理器内嵌的数据存储器基本都采用SRAM,而外部扩展的存储器大都采用DRAM及其改进型。DRAM比CPU速度慢很多，除了改进其电路和工艺外，人们还不断地对DRAM的存储控制技术进行改进，开发出了DRAM的许多新品种。故本题选择B选项。","code":0},{"id":"1198","paper":"真考试卷19","no":24,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线接口的叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C总线是集成电路互连总线的简称","I<SUP>2<\/SUP>C总线有两条信号线：数据线SDA，时钟线SCL","I<SUP>2<\/SUP>C总线是一种串行全双工传输的总线标准","I<SUP>2<\/SUP>C总线属于多主总线，即允许总线上有一个或多个主控器件和若干从器件同时进行操作"],"a":"C","e":"I<SUP>2<\/SUP>C (Inter-Integrated Circuit)是集成电路互连的一种总线标准，只有两根信号线，一根是时钟线SCL, —根是数据线SDA (双向三态），即可完成数据的传输操作。具有特定的起始位和终止位，可完成同步半双工串行通信方式，常用于板级芯片之间的短距离低速通信。故本题选择C选项。","code":0},{"id":"1199","paper":"真考试卷19","no":25,"type":"单项选择题","q":"UART按确定的格式按位传送一次信息。下面关于信息传送格式的叙述中，错误的是（  ）。","o":["每次传送时以起始位作为传送的开始","每次传送时以停止位作为传送的结束","一次传送的信息位是固定的，为8个二进制位","起始位只能是逻辑0，停止位只能是逻辑1"],"a":"C","e":"串行异步通信接口通用异步收发器（Universal Asynchronous Receiver/Transmitter, UART) 常用于全双工串行异步通信。所有嵌入式处理芯片内部均集成了兼容标准UART功能的组件， 有的集成了多个UART。发送器负责字符的发送，可采用先进先出（FIFO)模式，也可采用普通模式发送的字符先送到发送缓冲寄存器，然后通过移位寄存器，在控制单元的作用下，通过TXDn引脚一位一位顺序发送出去。在FIFO模式下，当N个字节全部到位后才进行发送。不同嵌入式处理芯片内部设置的N值不同。查询发送方式时必须要等待发送缓冲器为空才能发送下一个数据。中断发送方式时当发送缓冲器已经空了才引发发送中断，因此可以直接在发送中断服务程序中继续发送下一个或下一组数据（FIFO模式）。一般接收和发送缓冲器的FIFO字节数N是一样大小的，均可编程选择长度，如4B、8 B,12 B、16 B、32 B、64 B等。不同ARM芯片，FIFO缓冲器最大字节数N不同。起始位以逻辑0为标志，停止位以逻辑1为标志，停止位可为1 位、1.5位和2位。故本题选择C选项","code":0},{"id":"1200","paper":"真考试卷19","no":26,"type":"单项选择题","q":"下图为基于ARM处理器的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，错误的是（  ）。","o":["图中所示的键盘接口采用了矩阵键盘的结构","读取键盘值（0～F）时不能采用中断方式","读取键盘值时需考虑消除键按下时产生的抖动问题","图中GPG4～GPG7和GPF4～GPF7是ARM处理芯片GPIO接口的一部分"],"a":"B","e":"非编码键盘（线性键盘）利用GPIO引脚连接按键。在这里采用行列矩阵式键盘设计方法，即行扫描法。采用四根I/O引脚GPG4~GPG7作为行扫描输出，四根I/O引脚GPF0-GPF3作为输入检测，同时这四个输入引脚接一四输人与门（如74HC21/74AS21 等），与门输出接外部中断2即EXINT2引脚。这样可以采用中断方式，读取键盘值（0~F), 在中断服务程序中判断GPF0?GPF3哪个引脚为低电平，然后结合输出扫描的行号即可合成对应的键值。故本题选择B选项。","code":0},{"id":"1201","paper":"真考试卷19","no":27,"type":"单项选择题","q":"下面关于S3C2410内置的ADC的叙述，其中错误的是（  ）。","o":["S3C2410只有一个模拟输入通道","S3C2410内置的ADC的分辨率为10位","S3C2410内置的是一个逐次逼近型ADC","S3C2410内置的ADC的A/D转换结果是以并行方式输出的"],"a":"A","e":"嵌入式系统应用中经常遇到对模拟信号（如温度、压力、流量等）的采集，可利用 S3C2410的内置ADC来完成模拟信号的采集。S3C2410内部有一个8通道、逐次逼近式、分辨率为10位的ADC。ADC的8个模拟通道AIN0~AIN7是专用引脚，仅用于ADC的模拟输入通道，对ADC操作首先要选择通道（AIN0~AIN7)，然后启动AD变换，当变换结束后最后取转换结果即可。故本题选择A选项。","code":0},{"id":"1202","paper":"真考试卷19","no":28,"type":"单项选择题","q":"下关于CAN的叙述中，错误的是（  ）。","o":["CAN可用于构成多主通信系统","CAN总线信号传输采用差分方式","CAN的数据帧包括校验域，采用的校验方式是奇偶校验","没有内置CAN控制器的嵌入式处理芯片可以通过外扩CAN控制器和CAN收发器的方式使该嵌入式系统接入CAN应用系统"],"a":"C","e":"CAN总线的数据帧是由7个不同的域组成：帧起始、仲裁域、控制域、数据域、CRC域、应答域、帧结尾。其中数据域的长度可选为0~8B。故本题选择C选项。","code":0},{"id":"1203","paper":"真考试卷19","no":29,"type":"单项选择题","q":"下列关于嵌入式软件特点的描述中，不正确的是（  ）。","o":["软件代码时空效率要求高，实时性要求高。","嵌入式处理器的处理能力较低，软件一般采用简单轮询结构。","软件尽可能去除冗余。","软件面向用户、面向产品、面向应用，受限于功能和具体应用环境。"],"a":"B","e":"嵌入式软件的特点如下：软件与硬件一体化，软件固化存储；软件代码时空效率要求高，实时性高；软件可裁剪，尽可能去除冗余；软件应用环境复杂，安全性和可靠性要求高；软件开发难度大；软件面向用户、面向产品、面向应用，受限于功能和具体应用环境；软件产业高度分散以及软件具有较长的生命周期。故本题选择B选项。","code":0},{"id":"1204","paper":"真考试卷19","no":30,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，不正确的是（  ）。","o":["嵌入式系统软件的程序结构并没有优劣之分，需要根据具体应用的需求选择。","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构。","与应用软件直接在裸机上运行的简单结构相比，引入操作系统降低了系统的开销。","中间件软件是指除了操作系统内核、设备驱动程序和应用软件之外的系统软件。"],"a":"C","e":"与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销。但嵌入式操作系统结构允许多个任务在了个CPU上并行运行，将复杂的系统分解成相对独立的多个任务，从而降低了用户开发嵌入式软件的复杂度，并有效保证系统的实时性和可维护性。故本题选择C选项。","code":0},{"id":"1205","paper":"真考试卷19","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，不正确的是（  ）。","o":["板级支持包的特点是与硬件和操作系统都关系紧密，既有硬件相关性，又有操作系统相关性。","板级支持包实现了不同硬件平台之间的可移植性，故其代码在所有硬件平台上通用。","板级支持包中包含硬件相关的设备驱动程序。","板级支持包屏蔽了其所支持的嵌入式操作系统与底层硬件平台之间的相关性。"],"a":"B","e":"硬件抽象层（Hardware Abstract Layer, HAL)和板级支持包（Board Support Package, BSP)都是嵌入式系统的底层软件。HAL是在操作系统层与硬件之间设置的独立的接口软件层，是所有直接依赖于硬件的软件，包括引导程序、硬件配置程序和硬件访问代码等。将嵌入式系统软件中位于操作系统层与硬件之间的、与硬件相关的软件层次统称为 硬件抽象层，而板级支持包则可以被看作是硬件抽象层在特定操作系统环境下的具体实现。也有一些文献并不区分HAL和BSP，把二者当作同义词。BSP的特点是与硬件和操作系统都关系紧密，既有硬件相关性，又有操作系统相关性：BSP规范是OS相关的，支持不同OS的BSP的组织结构、向上层提供的功能以及服务接口定义都不相同；而BSP代码则必须针对特定硬件专门编写。故本题选择B选项。","code":0},{"id":"1206","paper":"真考试卷19","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，不正确的是（  ）。","o":["不同的bootloader程序功能虽有差别，但大多支持操作系统引导和加载功能。","大多数从Flash存储器上启动的bootloader程序采用两阶段执行过程。","Bootloader负责系统的上电自检、硬件初始化、建立存储空间映射、配制系统参数、建立上层软件的运行环境，并加载和启动操作系统。","BootROM是公认的功能最强、最具弹性以及更新最快的开放源码bootloader，是遵循GPL条款的代码资源最完整的一个通用bootloader。"],"a":"D","e":"U-Boot是公认的功能最强、最具弹性以及更新最快的开放源码bootloader,是遵循GPL条款的代码资源最完整的一个通用bootloader。故本题选择D选项。","code":0},{"id":"1207","paper":"真考试卷19","no":33,"type":"单项选择题","q":"下列关于设备驱动程序的陈述中，不正确的是（  ）。","o":["设备驱动程序只能被高层软件调用而无法自行运行。","驱动程序通常总是位于软件的最下层。","类Unix操作系统把I/O设备抽象成设备文件。","设备驱动程序都是与处理器体系结构相关的。"],"a":"D","e":"设备驱动程序划分为体系结构相关（architecture-specific )的驱动程序和体系结构无关的通用驱动程序两层。体系结构相关的驱动程序是硬件抽象层的一部分，用于配置处理器的运行参数、访问与处理器相关的资源、管理处理器的片内硬件（如片内存储器、集成的存储器管理部件 MMU等）；通用设备驱动程序与处理器体系结构无关，并通过体系结构相关的驱动程序实现与硬件的交互，在移植到不同体系结构的处理器时不需要修改。故本题选择D选项。","code":0},{"id":"1208","paper":"真考试卷19","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，不正确的是（  ）。","o":["实时系统是必须在有限和确定的时间内对外部事件做出响应的信息系统。","评判实时系统的关键并不是系统对外部事件的处理速度，而是处理事件的时间的可预见性和确定性。","程控电话交换机检测到用户摘机后必须在1秒钟内送出拨号音，则送拨号音任务的绝对时限即为1秒钟。","对硬实时任务，必须在给定的时限内完成，超过时限将会导致任务失败或引起致命的错误。"],"a":"C","e":"时限（deadline,最后期限）是实时系统追求的最重要指标，分为相对时限和绝对时限： 相对时限是指事件提出请求后，系统作出响应所允许的最大时间长度；绝对时限是指不管请求何时提出，相应任务必须完成的截止时刻。例如，程控电话交换机检测到用户摘机后必须在1 秒钟内送出拨号音，则送拨号音任务的相对时限即为1秒钟；而用户设定的叫醒服务的时间点则是任务的绝对时限。故本题选择C选项。","code":0},{"id":"1209","paper":"真考试卷19","no":35,"type":"单项选择题","q":"下列各项中不属于硬实时操作系统的是（  ）。","o":["VxWorks","RTEMS","WinCE","QNX"],"a":"C","e":"硬实时操作系统。主要用于通信、军事、航天、控制等领域，与人的交互性要求相对较弱，可靠性和实时性要求高，运行环境复杂多变。VxWorks、RTEMS, QNX、μC/OS-II、Nucleus等都属于硬实时操作系统。故本题选择C选项。","code":0},{"id":"1210","paper":"真考试卷19","no":36,"type":"单项选择题","q":"下列关于嵌入式系统软件的陈述中，不正确的是（  ）。","o":["Dalvik是苹果公司开发的用于iOS平台的Java虚拟机。","Linux是一种自由软件。","操作系统的单内核结构又称为宏内核结构。","VxWorks操作系统是美国风河系统公司专门针对嵌入式环境开发的商用嵌入式实时操作系统。"],"a":"A","e":"Dalvik是谷歌等厂商合作开发的用于Android平台的Java虚拟机，允许在有限的内存中同时运行多个虚拟机实例。Dalvik虚拟机依赖于Linux内核提供线程分配和内存管理等基本功能。Java应用程序经过编译并通过SDK中的工具转化成Dalvik可执行程序格式（.dex)后，才能在Dalvik虚拟机上执行。故本题选择A选项。","code":0},{"id":"1211","paper":"真考试卷19","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，不正确的是（  ）。","o":["任务可以挂起自己或者挂起其它任务。","函数OSTaskDel()既可以删除任务自身，也可以删除其他任务。","多个任务可以同时等待同一事件的发生。当该事件发生后，所有等待该事件的任务都将获得该信号并转入就绪状态。","在中断返回之前，必须调用退出中断函数void OSIntExit(void)。"],"a":"C","e":"当该事件发生后，所有等待该事件的任务中优先级最高的任务 将获得该信号并转入就绪状态。本题答案为C选项。","code":0},{"id":"1212","paper":"真考试卷19","no":38,"type":"单项选择题","q":"μC/OS-II操作系统有多种在任务间共享数据和实现任务间通信的方法。下列说法中错误的是（  ）。","o":["任务或者中断服务程序可以通过ECB向其他任务发出信号。","函数OSSemPost()释放信号量。","函数OSFlagCreate()只能被任务调用，而不能被中断服务程序调用。","函数OSQAccept()在没有接收到消息时会挂起任务。"],"a":"D","e":"无等待地请求消息队列:void * OSQAccept( OS_EVENT * pevent,INT8U * perr)；与函数OSQPend()不同，函数OSQAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用。无消息可接收时返回值为NULL;否则返回值为消息指针。若N代表消息队列中的总单元数，则在调用OSQPend()或者OSQAccept()之前，调用N 次OSQPoSt()或者OSQPostFront()就会把消息队列填满故本题选择D选项。","code":0},{"id":"1213","paper":"真考试卷19","no":39,"type":"单项选择题","q":"嵌入式系统设计的开发过程可以分成：需求分析与规格说明、系统设计、构件设计、系统集成与测试等4个阶段。下面的说法中，不恰当的是（  ）。","o":["在需求分析与规格说明阶段，应对用户的功能性需求和非功能性需求进行分析。","系统设计阶段的任务是确定系统的硬件和软件结构，即进行软件、硬件功能划分。","构件设计阶段的任务是进行硬件电路设计。","系统集成及测试阶段，要反复地进行测试，其目的就是尽量发现错误。"],"a":"C","e":"构件设计分成硬件构件设计和软件构件设计两部分来进行。硬件构件设计时首先进行芯片的选型。故本题答案是C选项。","code":0},{"id":"1214","paper":"真考试卷19","no":40,"type":"单项选择题","q":"下面的说法中，不正确的是（  ）。","o":["嵌入式系统的应用程序均需要基于某个嵌入式操作系统之上来开发。","现阶段用于嵌入式系统中的操作系统有许多，如：Linux、μC/OS-II。","基于Linux操作系统上开发嵌入式应用程序，可使用GNU工具软件来开发。","RVDS工具可以用来开发基于ARM系列CPU的嵌入式系统软件。"],"a":"A","e":"嵌入式系统往往是针对具体应用目标来进行设计及开发的，其涉及面非常广泛，设计者切入的层面也有较大的不同，也就是说，设计者针对其应用，有的只需在现有软件平台（即嵌入式操作系统）上来进行应用程序开发，而有的需要在裸机环境下进行应用程序开发。故本题选择A选项。","code":0},{"id":"1236","paper":"真考试卷20","no":1,"type":"单项选择题","q":"下面是关于嵌入式系统的叙述，其中错误的是（  ）。","o":["尽管嵌入式系统的应用领域越来越广泛，但总体而言，对系统的实时性基本上没有要求","嵌入式系统中的软件一般都固化在只读存储器（或FLASH MEMORY）中，用户通常不能随意变更其中的程序功能","目前，许多控制、监视或协助设备、机器、工厂运行的装置，都是嵌入式系统","随着技术的进步和应用的拓展, 嵌入式系统的内涵也还在发展和变化"],"a":"A","e":"嵌入式系统是嵌入式计算机系统的简称。顾名思义，它是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统。嵌入式系统广泛应用在过程控制、数据采集、通信传输等领域，承担着测量、报警、控制、调节等任务、所以嵌入式系统都有或多或少的实时性，即必须在一个可预测和有保证的时间范围内对外部事件作出正确的反应。","code":0},{"id":"1237","paper":"真考试卷20","no":2,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中,错误的是（  ）。","o":["嵌入式系统通常以非计算机设备（系统）的形式呈现，它们隐藏在宿主设备（系统）的内部，不以人们熟知的计算机形式呈现","嵌入式系统通常要求小型化、轻量化、低功耗及低成本，因此其软硬件资源受到较为严格的限制","嵌入式系统大多面向控制应用，系统的可靠性十分重要","不同应用的嵌入式系统的软硬件资源基本相同"],"a":"D","e":"嵌入式系统通常总是非计算机设备（系统）中的一个部分，它们隐藏在其内部，不为人知。人们只关心宿主设备（系统）的功效、性能及其操作使用，很少有用户知道或愿意了解隐藏在内部的嵌入式系统。资源受限：嵌入式系统通常要求小型化、轻量化、低功耗及低成本，因此其软硬件资源受到严格的限制。高可靠性：嵌入式系统大多面向控制应用，系统的可靠性十分重要。凡是带有微处理器的专用软硬件系统都可称为嵌入式系统。狭义上讲， 嵌入式系统强调那些使用嵌入式微处理器构成的具有自己的操作系统和特定功能、用于特定场合的独立系统。故本题选择D选项。","code":0},{"id":"1238","paper":"真考试卷20","no":3,"type":"单项选择题","q":"下面关于嵌入式系统组成的叙述中,错误的是（  ）。","o":["嵌入式系统由硬件和软件两部分组成","嵌入式系统一般只能包含一个处理器，不采用多处理器组成系统","嵌入式系统中的存储器用于存储程序和数据","数据总线是嵌入式系统中各组件之间进行数据传输的一个传输通路"],"a":"B","e":"嵌入式系统与通用计算机一样，也是由硬件和软件两部分组成的。有些嵌入式系统会包含多个处理器，它们各有其不同的任务，其中负责运行系统软件和应用软件的主处理器称为中央处理器（Central Processing Unit, CPU),其余的都是协处理器；存储器的任务是存储程序和数据；数据总线（Data Bus)简称总线，它是嵌入式系统各组件之间进行数据传输的一个传输通路。故本题选择B选项。","code":0},{"id":"1239","paper":"真考试卷20","no":4,"type":"单项选择题","q":"下面关于嵌入系统应用的叙述中，错误的是（  ）。","o":["嵌入式系统在微波炉、电视机等消费类产品中得到广泛应用","嵌入式系统在数控机床、工业机器人等产业类产品中得到广泛应用","嵌入式系统在打印机、扫描仪等业务类产品中得到广泛应用","嵌入式系统在应用数量上远少于各种类型的通用计算机系统"],"a":"D","e":"嵌入式系统所涉及的应用领域非常广泛，通信设备、仪器仪表、医疗器械、消费电子、家用电器、计算机外围设备、汽车、船舶、航空、航天等均是嵌入式系统的主要应用领域。下面列出一些典型的应用产品和应用领域。消费类应用产品：冰箱、洗衣机、空调、微波炉、电饭煲、热水器等“白色家电”；电视机、机顶盒、家庭影院、数码相机、摄像机、DVD播放器、MP3播放器、PDA、电子字典、 游戏机、电子琴、智能玩具等数码产品。产业类应用产品：数控机床、工业机器人、机电一体化设备、生产线控制等工业设备；汽 车、飞机、铁路机车、船舶、电梯等运输工具；X光机、超声诊断仪（B超）、计算机断层成像系统（CT)、心脏起搏器、监护仪、磁共振成像、心电计、血压计等医疗电子设备。业务类应用产品：电话机、传真机、打印机、扫描仪、复印机等办公设备；电子秤、条码阅读机、商用零售终端（POS)、银行点钞机、IC卡读卡机、取款机、自动柜员机（ATM)、 自动售货机、信息亭等金融电子设备；手机、GPS导航仪、Modem、路由器、集线器（Hub)、 交换机、网桥等通信设备。军用类应用产品：火炮、导弹、智能炸弹的制导引爆等武器控制装置；坦克、舰艇、战机、无人机等军用电子装备；雷达、电子对抗、导航系统等军事通信装备。嵌入式系统在应用数量上远远超过了各种类型的通用计算机系统。故本题选择D选项。","code":0},{"id":"1240","paper":"真考试卷20","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，错误的是（  ）。","o":["GB2312采用单字节可变长编码","标准ASCII码是7位编码","GB18030采用不等长编码","UTF-16采用双字节可变长编码"],"a":"A","e":"GB2312国标字符集中包含3755个一级常用汉字和3008个二级常用汉字，此外还有682个图形符号（包括拉丁字母、俄文、日文平假名与片假名、希腊字母、汉语拼音等）。这些汉字和图形符号在计算机内部都采用2字节（16个二进制位）来表示，每字节的最高位均规定为1。GB18030采用不等长的编码方法：单字节编码（128个）表示ASCII字符，与ASCII码兼容； 双字节编码（23 940个）表示汉字，与GB2312保持向下兼容（GB2312中包含的所有字符 GB1S030中也有，且编码相同）；还有约158万个四字节编码用于表示其他字符。标准ASCII码是7位编码，但由于字节是计算机中最基本的存储和处理单位，故一般 仍使用一个字节来存放一个ASCII码。UTF-16采用的是双字节可变长编码。故本题选择A选项。","code":0},{"id":"1241","paper":"真考试卷20","no":6,"type":"单项选择题","q":"下列关于数字音频和数字视频的描述中，错误的是（  ）。","o":["波形声音的码率＝取样频率×量化位数×声道数（单位：b/s）","MPEG-1是一种数字视频编码标准格式","固定电话通信中语音的取样频率为8kHz","音频信号的量化也就是数模转换"],"a":"D","e":"音频信号的量化就是把每个样本的模拟量转换成数字量来表示，因此量化过程往往也称为A/D转换（模数转换）。量化后的样本一般用8位、12位或16位（称为“量化精度”）二进制整数表示。量化精度越高，声音的保真度越好，量化精度越低，声音的保真度越差。故本题选择D选项。","code":0},{"id":"1242","paper":"真考试卷20","no":7,"type":"单项选择题","q":"从现实世界中获得数字图像的过程中，不包含在内的步骤是（  ）。","o":["分色","扫描","量化","压缩"],"a":"D","e":"图像获取过程的核心是模拟信号的数字化，它的处理步骤大致分为4步：(1)扫描：将画面划分为M×N个网格，每个网格称为一个取样点。这样，一幅模拟图像 就转换为M×N个取样点所组成的一个阵列。(2)分色：将每个取样点的颜色分解成红、绿、蓝（R、G、B) 3个基色，如果是灰度图像或黑白图像，则不必进行分色。(3)取样：测量每个取样点的每个分量（基色）的亮度值。(4)量化：对取样点每个分量的亮度值进行A/D转换，即把模拟量使用数字量（一般是 8位至12位的正整数）来表示。故本题选择D选项。","code":0},{"id":"1243","paper":"真考试卷20","no":8,"type":"单项选择题","q":"通信的基本任务是传递信息，至少由三个要素组成，以下不属于三个要素之一的是（  ）。","o":["信息的发送者","信息的接收者","信息的传输通道","信息的存储"],"a":"D","e":"通信的基本任务是传递信息，因而至少需由3个要素组成：信息的发送者（称为信源） 和信息的接收者（称为信宿）、携带了信息的电（或光）信号以及信息的传输通道（称为信道）。故本题选择D选项。","code":0},{"id":"1244","paper":"真考试卷20","no":9,"type":"单项选择题","q":"以下关于ARM处理器说法错误的是（  ）。","o":["所有ARM处理器均为RISC且为哈佛结构","ARM处理器是发展最快、技术最先进、应用最广泛的嵌入式处理器之一","ARM处理器对内存的访问只有存储和加载两类指令","所有ARM处理器均采用多级指令流水线技术"],"a":"A","e":"ARM处理器是嵌入式领域目前发展最快、技术最先进、应用最广泛的处理器之一，它广泛使用在许多领域中。由于ARM采用RISC体系结构，因此其结构上的技术特征大多属于RISC技术的特征。结合ARM自身特点，ARM具有的技术特征如下：1)单周期操作、2)只使用加载/存储（Load/Store)指令访问内存、3)指令长度固定、4)三地址指令格式、5)指令流水线技术和6)低功耗设计；ARM处理器多数为哈佛结构。故本题选择A选项。","code":0},{"id":"1245","paper":"真考试卷20","no":10,"type":"单项选择题","q":"以下说法正确的是（  ）。","o":["所有ARM处理器内部都有Cache","ARM Cortex-M0内部的WIC可以进行中断向量的嵌套","ARM Cortex-R4内部具有分支指令预测功能","ARM Cortex-A57采用ARMv8V架构，字长为32位"],"a":"C","e":"高端ARM处理器中有Cache；ARM Cortex-M0内部的WIC为唤醒中断控制器；ARM Cortex-R4内部具有预测及分支预测单元；Cortex-A处理器除了A53/A57系列为64位字长，采用ARMV8A架构外，其他均为32位字长，包括Cortex-A5~A15处理器，它们使用基于ARMv7A架构的处理器核，支持传统的ARM、Thumb指令集和高性能紧凑型Thumb-2EE指令集，具有完全的应用兼容性；故本题答案为C选项。","code":0},{"id":"1246","paper":"真考试卷20","no":11,"type":"单项选择题","q":"在嵌入式应用中要求强实时性，优先选用的处理器是（  ）。","o":["ARM 9","ARM Cortex-A15","ARM Cortex-M3","ARM Cortex-R4"],"a":"D","e":"ARM Cortex-R4（R=Real time）系列是面向实时控制应用的处理器，响应速度快、性能合理、功耗低。ARM Cortex-M3（M=Microcontroller）系列是面向微控制器的处理器，性价比高。成本很低、功耗极小。ARM Cortex-A15（A=Application）系列是面向高端应用的处理器，它的工作效率高、性能好。功耗合理。故本题选择D选项。","code":0},{"id":"1247","paper":"真考试卷20","no":12,"type":"单项选择题","q":"以下关于ARM中MMU功能说法正确的是（  ）。","o":["它是内存保护单元","负责管理中断管理","负责虚拟地址到物理地址的映射","负责外部中断的唤醒"],"a":"C","e":"存储器管理单元（MMU)是许多高性能处理器所必需的重要部件之一。基于ARM架构的系列微处理器中，ARM720T、ARM922T、ARM920T、ARM926EEJ-S、ARM10、ARM11、 XScale以及Cortex-A系列等内部均已集成了 MMU部件。MMU的功能是虚拟地址到物理地址映射；存储器访问权限控制；故本题选择C选项。","code":0},{"id":"1248","paper":"真考试卷20","no":13,"type":"单项选择题","q":"某ARM处理器复位后将ARM状态切换到Thumb状态，之后该ARM处理器的指令宽度是（  ）。","o":["1个字节","2个字节","4个字节","8个字节"],"a":"B","e":"Thumb状态是ARM执行16位指令的状态，即16位状态，也就是指令宽度为2个字节；故本题答案是B选项。","code":0},{"id":"1249","paper":"真考试卷20","no":14,"type":"单项选择题","q":"关于ARM处理器存储格式说法正确的是（  ）。","o":["大端模式下数据高字节存放在低地址存储单元，而小端模式数据高字节存放在高地址存储单元","大端模式下决定存储双字的格式，小端模式决定存储字的格式","大端模式存放的是十六进制数，小端模式存放的是BCD码","大端模式是ARM状态下的工作模式，小端模式是Thumb状态下的工作模式"],"a":"A","e":"在大端模式中，32位数据字的高字节存储在低地址中，而数据字的低字节则存放在高地址中；与大端模式存储数据完全不同，在小端模式下，32位数据字的高字节存放在高地址，而低字节存放在低地址；故本题选择A选项。","code":0},{"id":"1250","paper":"真考试卷20","no":15,"type":"单项选择题","q":"以下属于基址加变址寻址方式的指令是（  ）。","o":["LDR R0，[R1],#2","ADC R0，R0,#100","STR R5，[R1]","SUB R0，R1,#2"],"a":"A","e":"基址加变址寻址就是将寄存器（该寄存器一般称作基址寄存器）的内容与指令中给出的地址偏移量相加，从而得到一个操作数的有效地址；LDR R0，[R1],#2的功能是R0←[R1]、R1←R1+2；故本题选择A选项。","code":0},{"id":"1251","paper":"真考试卷20","no":16,"type":"单项选择题","q":"对于以下指令条件码对应的助记符后缀，用于无符号数比较的有（  ）。\n①CC ②CS ③GE ④GT ⑤HI ⑥LS ⑦LE ⑧LT","o":["①  ②  ⑤  ⑥","①  ②  ③  ④","④  ⑤  ⑦  ⑧","③  ④  ⑥  ⑦"],"a":"A","e":"CC：C清零，无符号数小于；CS：C置位，无符号数大于或等于；HI：C置位Z清零，无符号数大于；LS：C清零Z置位，无符号数小于或等于；故本题选择A选项。","code":1},{"id":"1252","paper":"真考试卷20","no":17,"type":"单项选择题","q":"以下属于ARM指令系统中分支指令的是（  ）。\n①B    ②BIC   ③BKPT    ④BL  ⑤BLX  ⑥BX","o":["①  ②  ③","①  ④  ⑤  ⑥","①  ③  ④  ⑥","①  ③  ④  ⑤  ⑥"],"a":"B","e":"分支类指令包括：B，跳转指令；BL，带返回的跳转指令；BLX，带返回和状态切换的跳转指令；BX，带状态切换的跳转指令；故本题选择B选项。","code":1},{"id":"1253","paper":"真考试卷20","no":18,"type":"单项选择题","q":"将R1中的32位数据存储到0x40000000开始的区域，地址自动加4，正确的指令序列为（  ）。","o":["LDR R0,=0x40000000\nSTR R1,[R0],#4","LDR R0,0x40000000\nSTR R1,[R0,#4]!","MOV R0,#0x40000000\nSTR R0,[R1],#4","MOV R0,0x40000000\nSTR R0,[R1,#4]!"],"a":"A","e":"LDR R0，=0x40000000的功能是将立即操作数0x40000000传送到R0中；STR R1，[R0]，#4的功能是将寄存器R1的32位操作数存储到R0指示地址开始的存储区域中，最后R1指示地址+4，A选项正确；而LDR R0,0x40000000 语法错误，没有=或[]，不是合法的ARM 指令；STR R1,[R0,#4]! 先R0=R0+4，再存数据到新地址，不符合“先存再地址+4” 的要求。MOV R0,#0x40000000无法完成，因为ARM的MOV 指令只能加载8位立即数移位得到的数，0x40000000无法直接用MOV加载；且STR R0,[R1],#4是把R0存到R1指向的地址，与题目要求完全相反。MOV R0,0x40000000语法错误，且操作的寄存器也不对。综上所述，本题答案为A选项。","code":0},{"id":"1254","paper":"真考试卷20","no":19,"type":"单项选择题","q":"下图给出了嵌入式处理器时钟电路的一种设计方法。下面是关于该图及嵌入式系统中时钟电路的叙述，其中错误的是（  ）。","o":["时钟电路为嵌入式处理器提供时钟信号使其按照时钟信号的节拍正常工作","该图采用了“使用内部时钟信号发生器”的方法来获得嵌入式处理器工作时的时钟信号","图中标有“C”的器件为电容器","图中的“X2”为输出，通过X2引脚可以提供时钟信号，给外部的其他电路使用"],"a":"B","e":"嵌入式处理器的时钟电路主要有两种模式 ，其中外部时钟源模式，时钟信号由外部有源晶振提供，通过 X1 引脚输入处理器，X2 引脚可作为时钟信号输出，给其他电路使用，图中的 C 是耦合电容。 内部振荡器和无源晶振模式，处理器内部自带振荡器，需要外接无源晶振（Xtal）和两个负载电容，接到 X1/X2 引脚，构成振荡回路。而题目中的图片里，时钟信号来自外部有源晶振（Clock），通过 X1 引脚输入，不是处理器内部自带的时钟发生器，故B选项叙述错误，本题答案为B选项。","code":0},{"id":"1255","paper":"真考试卷20","no":20,"type":"单项选择题","q":"下面关于嵌入式系统中复位电路的叙述中，错误的是（  ）。","o":["复位电路是嵌入式最小硬件系统的一个组成部分","嵌入式处理器系统复位引脚为nRESET时，表示低电平复位","一般情况下，复位信号的时间宽度必须保持若干个处理器时钟周期才能使系统可靠复位","ARM处理器芯片复位后，PC指针指向唯一的地址0xFFFFFFFF"],"a":"D","e":"复位属于ARM中的异常种类之一，当RESET（复位）引脚有效时进入该异常，对应的异常向量地址为0x00000000；故本题选择D选项。","code":0},{"id":"1256","paper":"真考试卷20","no":21,"type":"单项选择题","q":"下面关于ARM的AMBA的叙述中，错误的是（  ）。","o":["AMBA有多个版本，例如AMBA1、AMBA2等","AMBA的系统总线和外围总线之间通过桥接器连接","DMA控制器与AMBA的外围总线相连","ARM内核与AMBA的系统总线相连"],"a":"C","e":"连接到系统总线上的高带宽组件主要包括：电源管理与时钟控制器、测试接口如JTAG、 外部存储器控制接口、DMA控制器、USB主机、片上SRAM及Flash、Ethernet,高速GPIO中断控制器、LCD控制器等。故本题选择C选项。","code":0},{"id":"1257","paper":"真考试卷20","no":22,"type":"单项选择题","q":"下面关于嵌入式处理器的片内存储器的叙述中，错误的是（  ）。","o":["片内存储器是指嵌入式处理器芯片内部的存储器","嵌入式处理器S3C2410内部集成了Cache（高速缓冲存储器）","在嵌入式处理器内部集成的Flash ROM（闪烁存储器）用于存储在处理器中运行的程序","FRAM具有RAM和ROM的全部特点，但在嵌入式处理器内部还未被应用"],"a":"D","e":"目前已有部分嵌入式微控制器内部集成了 FRAM，由于它具有RAM和ROM的全部特点， 因此既可当作RAM用，又可当作ROM用，是当前嵌入式微控制器内部的主要存储器之一。故本题选择D选项。","code":0},{"id":"1258","paper":"真考试卷20","no":23,"type":"单项选择题","q":"下面是关于ARM嵌入式处理器芯片S3C2410电源管理的叙述：\nⅠ. 电源管理模块包括正常模式\nⅡ. 电源管理模块包括掉电模式\nⅢ. 电源管理模块包括休眠模式\nⅣ. 电源管理模块包括慢速模式\n其中，正确的是（  ）。","o":["仅Ⅰ和Ⅱ","仅Ⅰ和Ⅲ","仅Ⅰ、Ⅱ和Ⅲ","全部"],"a":"D","e":"电源管理模块具有正常模式（NORMAL MODE)、慢速模式（SLOW MODE)、休眠模式 (IDLE MODE)和掉电模式（POWER_OFF MODE)共四种模式。故本题选择D选项。","code":1},{"id":"1259","paper":"真考试卷20","no":24,"type":"单项选择题","q":"在软件配合下，通过SPI总线可以构成多种简单或复杂的系统。下图为一主多从式SPI系统，图中①、②、③、④分别为（  ）。","o":["SPI时钟发生器、SSEL、MOSI、MISO","SPI时钟发生器、MISO、MOSI、SSEL","8位移位寄存器、SSEL、MISO、MOSI","8位移位寄存器、MOSI、SSEL、MISO"],"a":"B","e":"对于一主多从的SPI系统中可以看出，1~4依次是SPI时钟发生器、MISO、MOSI、SSEL。故本题选择B选项。","code":0},{"id":"1260","paper":"真考试卷20","no":25,"type":"单项选择题","q":"下面是关于I<SUP>2<\/SUP>C总线的叙述，其中正确的是（  ）。","o":["I<SUP>2<\/SUP>C总线是一种全双工的总线","I<SUP>2<\/SUP>C总线是一种多主总线","I<SUP>2<\/SUP>C总线采用异步通信方式","ARM处理芯片S3C2410内部没有集成I2C总线控制器"],"a":"B","e":"I<SUP>2<\/SUP>C (Inter-Integrated Circuit)是集成电路互连的一种总线标准。I<SUP>2<\/SUP>C总线属于多主总线，即允许总线上有一个或多个主控制器和若干从器件同时进行操作，总线上链接的这些器件有时候会同时竞争总线的控制权。故本题选择B选项。","code":0},{"id":"1261","paper":"真考试卷20","no":26,"type":"单项选择题","q":"下图为基于ARM处理器的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，正确的是（  ）。","o":["图中的GPF6~GPF1是ARM处理器GPIO接口的一部分，并且只能用作输入输出","图中的键盘接口采用的是非编码键盘的结构形式","当仅有KEY2键按下时，GPF6~GPF1引脚的逻辑值为000010","当KEY2键按下时，流过该按键的电流约为0.1mA"],"a":"B","e":"非编码键盘（线性键盘）是指一个按键占用一个引脚，利用读该引脚的状态确定按键的状态。图中KEY1与R1和R7构成完整的一个按键。当没有键按下时，由于R7接到电源端，因此引脚GPF1为高电平（逻辑1)，当KEY1按下时，由于KEY1—端接R1,另一端接地，经过R1、R7分压，GPF1引脚的电压为0.1KΩ/10KΩ×3.3 V = 0.033 V,为低电平（逻辑0)。因此程序只要读取GPH引脚的状态就可以知道KEY是否被按下。KEY2~KEY6的工作原理相同，都是通过普通I/O 口确定按键动作与否。如果引脚还具备中断功能，比如S3C2410和S3C2440的GPF1~GPF6正好是EINT1~EINT6这六个外部中断引脚，因此除了可以通过查询方式读按键之外，还可通过中断读取按键结果。将中断打开，设定边沿触发之后，只要有按键按下，立即进入相应中断，在中断服务程序中做相应的处理，无需等待按键，提高了效率。故本题选择B选项。","code":0},{"id":"1262","paper":"真考试卷20","no":27,"type":"单项选择题","q":"下面是关于S3C2410内部的PWM定时器的叙述，其中正确的是（  ）。","o":["S3C2410的内部定时器，只有1个能够配置成PWM定时器","S3C2410的内部定时器配置成PWM定时器后，输出的PWM信号的周期是不断变化的","S3C2410的特殊功能寄存器包括定时器配置寄存器、定时器控制寄存器、定时器计数缓冲寄存器、比较寄存器与定时器观察寄存器等","S3C2410的内部定时器配置成PWM定时器后，输出的PWM信号是1:1的方波信号"],"a":"C","e":"S3C2410的特殊功能寄存器包括与PWM定时相关的寄存器：定时器配置寄存器、定时器控制寄存器、定时器计数缓冲寄存器、与比较寄存器、定时器观察寄存器等，以控制和查看PWM定时器的工作。故本题选择C选项。","code":0},{"id":"1263","paper":"真考试卷20","no":28,"type":"单项选择题","q":"N总线的数据帧格式如下图所示，图中①、②、③、④分别为（  ）。","o":["仲裁域、控制域、数据域、CRC域","CRC域、仲裁域、控制域、数据域","控制域、仲裁域、CRC域、数据域","数据域、CRC域、仲裁域、控制域"],"a":"A","e":"CAN总线的数据帧是由7个不同的域组成：帧起始、仲裁域、控制域、数据域、CRC域、应答域、帧结尾。其中数据域的长度可选为0~8B。故本题选择A选项。","code":0},{"id":"1264","paper":"真考试卷20","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，错误的是（  ）。","o":["最简单的软件结构是轮询结构","选择嵌入式系统软件结构的基本原则是：尽可能选择通用操作系统+应用软件结构，降低应用系统设计的复杂度","小型的监控式嵌入式操作系统通常只包含内核，仅实现任务调度、任务间通信和中断管理等最基本功能","带中断的轮询结构也称为前后台结构"],"a":"B","e":"由于不同的嵌入式操作系统的工作方式不同，相关术语的内涵也存在差异，高端嵌入式系统的软件层次结构不一定与上面的结构完全符合。嵌入式系统设计最重要的一点是满足系统对功能、成本、功耗、尺寸等方面的具体需求。嵌入式系统软件的程序结构并没有优劣之分，需要根据具体应用的需求选择。选择嵌入式系统软件结构的一个基本原则是：可以满足响应时间需求的最简单的结构。故本题选择B选项。","code":0},{"id":"1265","paper":"真考试卷20","no":30,"type":"单项选择题","q":"VxWorks操作系统的I/O系统通过7个基本的I/O操作函数访问硬件设备，这7个函数中不包括（  ）。","o":["ioctl()","suspend()","write()","close()"],"a":"B","e":"I/O系统通过7个基本的I/O操作函数访问硬件设备：创建文件create（）、 打开文件open()、读取文件read()、写人文件write()、关闭文件close()、移除文件remove() 和其他控制命令ioctl()。每个I/O操作函数在设备驱动程序中都有对应的实现函数。故本题选择B选项。","code":0},{"id":"1266","paper":"真考试卷20","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，错误的是（  ）。","o":["常见的HAL规范大多是由操作系统厂商提出的","板级支持包主要完成初始化外围设备、加载并启动操作系统和任务调度等功能","Nios II系统的HAL系统库提供的服务包括ANSI C标准库","除了与在引导和加载操作系统过程中所需的硬件环境相关的设备驱动程序之外，BSP包含的其他设备驱动程序通常不直接由BSP使用"],"a":"B","e":"常见的HAL规范大多是由操作系统厂商提出的。为了实现OS在不同硬件平台之间的可移植性，许多OS厂商会定义硬件无关代码与硬件相关代码之间的接口规范。硬件无关的OS代码在不同硬件平台上是相同的，由OS厂商提供。而依赖于硬件的代码通常要由用户或硬件制造商专门编写，这部分代码通常被称为板级支持包。板级支持包屏蔽了其所支持的嵌入式操作系统与底层硬件平台之间的相关性，使嵌入式操作系统能够通用于BSP所支持的不同硬件平台，实现嵌入式操作系统的可移植性和跨平台性。板级支持包主要负责硬件抽象与适配、系统复位时的硬件初始化、提供硬件相关的驱动程序、引导与加载操作系统和实现可移植性，而初始化外围设备、加载并启动操作系统是由引导加载程序，任务调度是由实时操作系统负责的，不是板级支持包。故本题答案为B选项。","code":0},{"id":"1267","paper":"真考试卷20","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，错误的是（  ）。","o":["支持不同硬件结构的bootloader程序有不同的版本","在大多数嵌入式系统中，bootROM内不仅存储bootloader程序，还存储操作系统映像、应用程序代码和用户配置数据等信息","无论采用何种操作系统的引导加载方式，最终都必须在ROM中直接运行操作系统代码","大多数从Flash存储器上启动的bootloader程序采用两阶段执行过程"],"a":"C","e":"根据操作系统映像存放位置的不同，嵌入式操作系统的引导加载可以采用不同方式。加载方式一：在ROM中直接运行操作系统代码；加载方式二：在RAM中运行操作系统代码，与方式一相同的是，操作系统的映像和应用程序映像同样已经预先烧录到ROM中。不同的是，bootloader代码在完成必要的硬件初始化等操作后，需把存放在ROM存储器中的操作系统和应用程序映像拷贝到RAM存储器中，然后跳转到RAM存储器中操作系统入口函数处继续执行。加载方式三：从外存储器加载操作系统代码运行。加载方式四：从通信端口加载操作系统代码运行。故本题选择C选项。","code":0},{"id":"1268","paper":"真考试卷20","no":33,"type":"单项选择题","q":"下列各嵌入式操作系统中，全部定义了统一的设备驱动程序框架的是（  ）。","o":["WinCE、VxWorks、Linux","VxWorks、μC/OS-II、WinCE","μC/OS-II、QNX、RTEMS","Linux、RTEMS、FreeRTOS"],"a":"A","e":"故本题选择A选项。一些小型的嵌入式操作系统（如μC/OS-II)往往只包括操作系统内核，不包括设备驱动程序，而且编写设备驱动程序也没有定义统一的框架。这类操作系统中的驱动程序的实现方式与不使用操作系统的嵌入式系统类似，开发工作完全由软件工程师自行完成。在WinCE、Linux和VxWorks等大型嵌入式操作系统中，往往自带一些标准设备的驱动程序，并且定义了统一的设备驱动程序框架。","code":0},{"id":"1269","paper":"真考试卷20","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，错误的是（  ）。","o":["实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性","硬实时任务必须在给定的时限内完成，超过时限将会导致任务失败或引起致命的错误","硬实时系统的时限一定短于软实时系统","程控电话交换机检测到用户摘机后必须在1秒钟内送出拨号音，则送拨号音任务的相对时限即为1秒钟"],"a":"C","e":"硬实时、软实时与准实时的概念与时限的长短没有关系，而与其对超过时限的容忍程度有关。如果一个任务在时限到达之时尚未完成，对软实时系统来说还是可以容忍的，最多只会降低系统性能；但对硬实时系统来说则是无法接受的，因为这样带来的后果根本无法预测，甚至可能是灾难性的。相对于软实时系统，硬实时系统的时限并不一定更短。故本题选择C选项。","code":0},{"id":"1270","paper":"真考试卷20","no":35,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，错误的是（  ）。","o":["VxWorks、RTEMS和QNX等都属于硬实时操作系统","大多数嵌入式系统都是实时系统，而且多是强实时、多任务系统","VxWorks和QNX操作系统属于宏内核结构","一般而言，Linux属于软实时操作系统"],"a":"C","e":"有些操作系统把内核的各个功能模块（如进程管理、文件系统、设备管理、网络通信等）整合在一起，模块间的交互通过直接调用其他模块中的函数来实现，执行效率高，性能好。这类操作系统内核称为单内核（monolithic-kernel)或宏内核（macro-kernel)。单内核结构的操作系统有：传统的Unix、BSD Unix、Linux, MS-DOS, Windows 9x ( Win?dows 95/98/Me) c Windows CE和Android操作系统也都属于单内核结构。故本题选择C选项。","code":0},{"id":"1271","paper":"真考试卷20","no":36,"type":"单项选择题","q":"下列各项中，属于类Unix操作系统的是（  ）。","o":["Windows CE","TinyOS","Windows Embedded Compact","VxWorks"],"a":"D","e":"Unix作为主流的操作系统，多年来不断演化，派生出许多相似或同源的操作系统，逐渐形成了一个产品大家族。其中有些是基于贝尔实验室Unix直接演化而来的商业版Unix，如 Solaris、UnixWare、AIX、HP-UX等。还有一些与Unix有一定关系的派生操作系统，则被统称为类Unix (Unix-like)系统。这些类Unix系统中，有些是基于Unix代码衍生而来，但按法律和商业惯例不能佩戴Unix标志的操作系统，如FreeBSD和OpenBSD等；另一些虽然没有直接 派生关系，但技术上与Unix相似，包括Linux、QNX、VxWorks以及安卓和iOS等。这些类 Unix操作系统虽然有些是自由软件，有些是商业软件，但都相当程度地继承了原始Unix的特性，有许多相似之处，并且都在一定程度上遵守POSIX规范。故本题选择D选项。","code":0},{"id":"1272","paper":"真考试卷20","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，正确的是（  ）。","o":["μC/OS-II的任务由两部分构成：程序代码和任务控制块","μC/OS-II的绝大部分代码是用ANSI C语言编写的","就绪态是任务代码驻留在内存中、但还没有交给内核调度的状态","μC/OS-II是抢占式实时内核，在任意时刻都可能发生任务调度，在任务调度时总是运行被中断态任务中优先级最高的任务"],"a":"B","e":"μc/os-II的绝大部分代码是用ANSI C语言编写的，只包含一小部分汇编代码用于支持特定的微处理器架构。此外，C语言编译器应当或者支持内嵌汇编 (inline assembly),或者支持语言扩展功能，能够在C语言中完成关中断和开中断。故本题选择B选项。","code":0},{"id":"1273","paper":"真考试卷20","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务状态转移的说法中，错误的是（  ）。","o":["运行态任务被抢占后将转入就绪态","运行态任务调用函数OSSemPend()后将转入被中断态","运行态任务在调用函数OSTimeDly()后将转入等待态","被中断态的任务不可能直接转入等待态"],"a":"B","e":"函数OSSemPend用于等待一个信号量，例如任务试图取得设备的使用权、任务需要和其他任务或中断服务程序同步、任务需要等待特定事件发生等。中断服务程序不能调用OSSemPend()函数。若调用时信号量的计数值大于0，0SSemPend()函数将信号量的计数值减1，并将错误码设置为常量0S_N0_ERR，表示信号量不为零，函数正常返回。如果调用时信号量的计数值等于0, OSSemPend()函数将调用该函数的任务挂起并加入该信号量的等待队列，直到其他任务或中断服务程序释放该信号量或预置的等待时间超时。故本题选择B选项。","code":0},{"id":"1274","paper":"真考试卷20","no":39,"type":"单项选择题","q":"我们可以把嵌入式系统设计的开发过程分成4个阶段：需求分析与规格说明、系统设计、构件设计、系统集成与测试。下面的说法中，错误的是（  ）。","o":["系统设计还可以称为概要设计。","系统设计阶段需要确定系统的硬件和软件结构，即进行软件、硬件功能划分。","系统设计阶段还需要描述非功能性的需求如何实现。","系统设计阶段还需要进行硬件芯片的选择。"],"a":"D","e":"系统设计也称为概要设计或总体设计，这个阶段要完成的任务是：根据规格说明书中所描述的系统需要实现的功能，确定如何实现这些功能的硬件和软件结构，特别是软件和硬件功能的划分，即哪些由显示控制将其显示在显示器上，等等功能由硬件完成，哪些功能由软件完成，以求满足系统对功能、性能、成本、功耗等的要求。故本题选择D选项。","code":0},{"id":"1275","paper":"真考试卷20","no":40,"type":"单项选择题","q":"下面的说法中，错误的是（  ）。","o":["嵌入式WEB服务器运行的目标系统大多是各类专用智能设备。","嵌入式WEB服务器可应用于控制和管理远程的设备。","嵌入式WEB服务器不能向远程客户提供信息，如：不能提供设备的运行状态信息。","嵌入式WEB服务器与通用WEB服务器运行环境是不一样的。"],"a":"C","e":"Web服务器是嵌入在设备中的，通常与设备的控制系统融合为一体，因此称其为嵌入式Web服务器。浏览器是运行在远程客户机上的应用程序，如IE浏览器。网页实际上是采用HTML语言设计的设备操控界面，它存放在嵌入式Web服务器上。客户端的浏览器通过网络与嵌入式Web服务器连接并获取网页。一旦获得所需要的网页，浏览器就正确显示由Web服务器返回的格式化的信息，也可以通过Internet把用户请求送到服务器。故本题选择C选项。","code":0},{"id":"1297","paper":"真考试卷21","no":1,"type":"单项选择题","q":"下面是关于嵌入式系统的叙述，其中错误的是（  ）。","o":["嵌入式系统是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统","嵌入式系统是以应用为中心，以计算机技术为基础，软硬件可裁剪、适应应用系统对功能、可靠性、成本、体积、功耗等多种约束的专用计算机系统","大部分嵌入式系统在系统的实时性方面没有要求","目前，许多控制、监视或协助设备、机器、工厂运行的装置，都是嵌入式系统"],"a":"C","e":"嵌入式系统是一种嵌入在设备（或系统）内部，为特定应用而设计开发的专用计算机系统；嵌入式系统是以应用为中心，以计算机技术为基础，软硬件可裁剪、适应应用系统对功能、可靠性、成本、体积、功耗等多种约束的专用计算机系统；嵌入式系统广泛应用与过程控制、数据采集、通信传输等领域，承担着测量、报警、控制、调节等任务，所以嵌入式系统都有或多或少的实时性。目前，许多控制、监视或协助设备、机器、工厂运行的装置，都是嵌入式系统。本题答案为C选项。","code":0},{"id":"1298","paper":"真考试卷21","no":2,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中,错误的是（  ）。","o":["嵌入式系统在许多领域得到了非常广泛的应用","智能玩具内部包含了嵌入式系统","电子式血压计等医疗设备内部包含有嵌入式系统","车载GPS导航仪内部不包含嵌入式系统"],"a":"D","e":"嵌入式系统在许多领域得到了非常广泛的应用。智能玩具等消费应用类、电子式血压计等医疗设备内部包含有嵌入式系统、手机、GPS导航仪等通信类产品都包含有嵌入式系统。本题答案为D选项。","code":0},{"id":"1299","paper":"真考试卷21","no":3,"type":"单项选择题","q":"对于包含多个处理器的嵌入式系统而言，负责运行系统软件和应用软件的主处理器是（  ）。","o":["该系统中的CPU","该系统中的DSP","该系统中的图形处理器","该系统中的通信处理器"],"a":"A","e":"嵌入式系统包含多个处理器，它们各有其不同的任务，其中负责运行系统软件和应用软件的主处理器称作中央处理器（CPU），其余都是协处理器，如数字信号处理器（DSP）、图形处理器、通信处理器等。CPU是任何计算机不可或缺的核心部件。本题答案为A选项。","code":0},{"id":"1300","paper":"真考试卷21","no":4,"type":"单项选择题","q":"下面关于嵌入式处理器的叙述中，错误的是（  ）。","o":["嵌入式处理器的字长指的是处理器中通用寄存器和定点运算器的二进位宽度","8位、16位、32位嵌入式处理器得到了广泛的应用","嵌入式系统的性能在很大程度上是由系统中的中央处理器决定的","处理器是嵌入式系统的主要硬件之一，它只能完成二进制数据算术运算，不能完成逻辑运算"],"a":"D","e":"处理器是嵌入式系统的主要硬件之一，能按照指令的规定高度完成二进制数据算术和逻辑运算的部件。嵌入式处理器的字长指的是处理器中通用寄存器和定点运算器的二进位宽度。8位、16位、32位嵌入式处理器得到了广泛的应用。嵌入式系统的性能在很大程度上是由系统中的中央处理器决定的。本题答案是D选项。","code":0},{"id":"1301","paper":"真考试卷21","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，错误的是（  ）。","o":["GB2312采用双字节等长编码","标准ASCII码是7位编码","GB18030采用不等长编码","UTF-16采用四字节编码表示汉字"],"a":"D","e":"UTF-16采用的是双字节可变长编码。GB2312采用双字节等长编码。GB18030采用不等长编码。标准ASCII码是7位编码。本题答案为D选项。","code":0},{"id":"1302","paper":"真考试卷21","no":6,"type":"单项选择题","q":"下列关于数字文本的描述中，错误的是（  ）。","o":["简单文本由表达文本内容的一连串字符的编码所组成， 几乎不包含任何其他的格式和结构信息","金山WPS、微软Word、OpenOffice Writer、Adobe Photoshop等都属于文字处理软件","超文本采用网状结构来组织信息，文本中的各个部分按照其内容的逻辑关系互相链接","PDF格式将文字、字型、颜色、排版格式、图形、图像、超链、声音和视频等信息都封装在一个文件中，既适合网络传输，也适合印刷出版"],"a":"B","e":"B选项中，Adobe Photoshop属于图像处理软件。本题答案是B选项。","code":0},{"id":"1303","paper":"真考试卷21","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，错误的是（  ）。","o":["显示器通常可以使用RGB（红、绿、蓝）模型","音乐的取样频率范围通常为300~3400Hz","量化就是把每个样本的模拟量转换成数字量来表示，因此量化过程也称为A/D转换","哈夫曼编码是一种无损压缩编码"],"a":"B","e":"由于语音信号的频率范围仅为300~3400Hz，因此电话通信语音的取样频率为8kHz，而音乐是全频带信号，取样频率通常在40kHz以上。本题答案为B选项。","code":0},{"id":"1304","paper":"真考试卷21","no":8,"type":"单项选择题","q":"关于通信传输介质的特点，以下叙述错误的是（  ）。","o":["双绞线成本低，但误码率高，传输距离有限","同轴电缆传输特性和屏蔽特性良好，但成本高","光缆传输损耗小，通信距离长，容量大，屏蔽性能好，强度大，容易精确连接。","无线通信传输在自由空间中，建设费用低，但容易受干扰。"],"a":"C","e":"光纤除了具有通信容量大和传输距离远（无中继通信距离可达几十km甚至上百km)的优点之外。由于是绝缘体，不会受高压线和雷电电磁感应的影响，抗核辐射的能力也强。光缆几乎可以做到不漏光，因此保密性强。光缆的重量轻，便于运输和铺设，但强度稍差。本题答案为C选项。","code":0},{"id":"1305","paper":"真考试卷21","no":9,"type":"单项选择题","q":"关于冯氏结构与哈佛结构的叙述，正确的是（  ）。","o":["冯氏结构采用精简指令集体系结构","哈佛结构将数据存储与指令存储并存","冯氏结构是当前先进的ARM处理器的主流结构","哈佛结构较冯氏结构有较高的执行效率"],"a":"D","e":"嵌入式处理器的体系结构按指令集可分为两大类：复杂指令集结构（CISC)及精简指令集结构（RISC)。进一步细分，按存储机制分为冯?诺依曼（von Neumann)结构及哈佛 (Harvard)结构；哈佛结构的处理器其程序和数据分开组织与存储，执行时可以同时进行指令和数据的存取，因而具有较高的执行效率。哈佛结构综合了哈佛结构和冯氏结构两者的优点，兼顾了处理器的效率和灵活性，在现代处理器如x86系列和高端ARM处理器中得到了广泛采用。哈佛结构使用两个独立的存储器分别存储指令和数据，不允许指令和数据并存。本题答案为D选项。","code":0},{"id":"1306","paper":"真考试卷21","no":10,"type":"单项选择题","q":"关于ARM Cortex-M3的NVIC以下说法错误的是（  ）。","o":["它是嵌套向量中断控制器","它支持最大240个物理中断源","它的中断优先级是固定的，不可动态调整","它提供1个不可屏蔽中断源NMI和各种系统异常"],"a":"C","e":"嵌套向量中断控制器（NVIC)最多能提供240个物理中断、1个不可屏蔽中断（NMI) 和各种系统异常，每一个中断都分配一个中断优先级（共256个优先级），可动态调整。本题答案为C选项。","code":0},{"id":"1307","paper":"真考试卷21","no":11,"type":"单项选择题","q":"对于ARM Cortex-A系列处理器，以下说法错误的是（  ）。","o":["它内部集成了浮点运算器","它主要应用于面向实时控制的应用领域","它主要应用于高计算要求的高端应用领域","它内部集成了一级和二级Cache"],"a":"B","e":"Cortex-A处理器中都集成了浮点运算器VFP；包含有分开的指令Cache 和数据Cache (有些还包含二级Cache)；Cortex-A处理器系列适用于有高计算要求、需运行功能丰富的操作系统以及要求提供交互媒体和图形显示的应用领域。本题答案为B选项。","code":0},{"id":"1308","paper":"真考试卷21","no":12,"type":"单项选择题","q":"以下关于ARM Cortex-R系列处理器特点正确的是（  ）。① 高性能 ②实时处理  ③安全  ④低成本  ⑤CISC架构  ⑥冯氏结构","o":["① ② ④ ⑥","① ② ③ ⑤","① ② ③ ④","① ② ③ ⑤ ⑥"],"a":"C","e":"Cortex-R处理器系列的主要特点是: 高性能、实时处理、安全和低成本。本题答案为C选项。","code":0},{"id":"1309","paper":"真考试卷21","no":13,"type":"单项选择题","q":"ARM处理器复位后通过状态切换，使所有代码均为2个字节编码，这个状态是（  ）。","o":["调试状态","ARM状态","Thumb状态","Thumb-2状态"],"a":"C","e":"Thumb状态是ARM执行16位指令的状态，即16位状态。在Thumb模式下，指令代码只有16位。本题答案为C选项。","code":0},{"id":"1310","paper":"真考试卷21","no":14,"type":"单项选择题","q":"以小端模式存储一个字0xAABBCCDD，存储在0x10000000~0x10000003中，则0x1000002单元的数据字节为（  ）。","o":["0xAA","0xBB","0xCC","0xDD"],"a":"B","e":"在小端模式下，32位数据字的高字节存放在高地址，而低字节存放在低地址。故0xAA存放于0x1000003，0xBB存放于0x1000002，0xCC存放于0x1000001,0xDD存放于0x1000000。故本题答案为B选项。","code":0},{"id":"1311","paper":"真考试卷21","no":15,"type":"单项选择题","q":"已知R1＝0x32303137，R2=0x10002000，如果原来内存0x10002000中的数据字节为0x10，0x10002001中的数据字节0x11，0x10002002中的数据字节0x12，0x10002003中的数据字节0x13，0x10002004中的数据字节0x14，0x10002005中的数据字节0x15，0x10002006中的数据字节0x16，0x10002007中的数据字节0x17，小端模式下，依次执行指令STR R1，[R2，#4]!和LDRH R1,[R2]后，以下描述正确的是（  ）。","o":["R1中的值为0x32303137","R2中的值为0x10002000","内存0x10002007中的数据字节为0x32","以上A）B）C）均不正确"],"a":"C","e":"STR  R1，[R2，#4]!将R1的字数据写入到R2+4为地址的存储器，且R2的内容自动增加4，即R2=R2+4=0x10002000+4=0x10002004，则开始写入的地址为0x10002004，又因为是小端模式32位数据字的高字节存放在高地址，而低字节存放在低地址，所以0x10002004存储0x37，0x10002005存储0x31，0x10002006存储0x30，0x10002007存储0x32；LDRH R1,[R2]指令的含义是由R2指示的存储器中的半字节读入到寄存器R1中，即R1=0x3137；综上所述，C选项描述正确，故本题答案为C选项。","code":0},{"id":"1312","paper":"真考试卷21","no":16,"type":"单项选择题","q":"以下ARM汇编指令中，可将R0的8倍存入R1的指令有（  ）。\n①MUL R1，R0，#8     ②ADD R1，R0，#8      ③MOV R1，R0，LSL#3\n④MOV R1，R0，ASL#3  ⑤MOV R1，R0，LSR #3  ⑥MOV R1，R0，ASR#3","o":["①  ②  ⑤  ⑥","①  ②  ③  ④","①  ③  ④","①  ④  ⑥"],"a":"C","e":"MUL R1，R0，#8 指令含义为：R0*8 存储到R1中。MOV R1，R0，LSL#3指令的含义为：将寄存器R0的值左移3位存放到R1中，左移3位相当于乘以8。MOV R1，R0，ASL#3指令中的ASL与LSL的作用相同都是将R0的值左移3位存放到R1中。本题答案为C选项。","code":1},{"id":"1313","paper":"真考试卷21","no":17,"type":"单项选择题","q":"以下助词符可以用于ARM指令系统中基址加变址寻址方式的有（  ）。\n①ADD    ②BL   ③CMP     ④ LDR  \n⑤ORR    ⑥STR  ⑦ TST    ⑧UMLAL","o":["①  ②  ③  ⑥  ⑧","④  ⑤  ⑥  ⑧","⑤  ⑥  ⑦","④  ⑥"],"a":"D","e":"基址加变址寻址就是将寄存器（该寄存器一般称作基址寄存器）的内容与指令中给出的地址偏移。在上述助词符中，可以用于ARM指令系统中基址加变址寻址方式的有LDR和STR。本题答案为D选项。","code":1},{"id":"1314","paper":"真考试卷21","no":18,"type":"单项选择题","q":"在ARM汇编语言伪指令中，通过编译器在当前文件中声明要引用的一个标号main，但它不在本文件定义中，在其它源文件中定义，则本文件中使用的伪指令是（  ）。","o":["IMPORT main","EXPORT mian","ENTRY main","COMMON main"],"a":"A","e":"如果一个子程序不在调用的同一个文件中，则需要先用IMPORT声明是外部的，否则无法正常调用该子程序。本题答案为A选项。","code":0},{"id":"1315","paper":"真考试卷21","no":19,"type":"单项选择题","q":"下面是关于目前嵌入式最小硬件系统的叙述，其中错误的是（  ）。","o":["嵌入式最小硬件系统必须包括复位电路","嵌入式最小硬件系统必须包括时钟电路","嵌入式最小硬件系统必须外扩存储器","嵌入式最小硬件系统必须包括给系统供电的电源电路"],"a":"C","e":"提供嵌入式处理器运行必备条件的硬件电路与嵌入式处理器共同构成了嵌入式最小硬件系统，必须包含复位电路、时钟电路、电源电路和存储器。本题答案为C选项。","code":0},{"id":"1316","paper":"真考试卷21","no":20,"type":"单项选择题","q":"下面是关于嵌入式系统复位电路的叙述，其中错误的是（  ）。","o":["嵌入式处理器都有一个系统复位引脚nRESET或RESET，n表示低电平复位","有效的复位信号只对信号的逻辑高低有要求，对有效电平的宽度没有要求","经典ARM处理器复位后其PC指针指向唯一的地址0x00000000","可以采用专用的复位芯片设计微控制器的复位电路"],"a":"B","e":"嵌入式处理器都有一个系统复位引脚为nRESET或RESET，n表示低电平复位，不带n的表示高电平复位。一般情况下，nRESET必须至少保持若干个处理器时钟周期的低电平，系统才能可靠复位。ARM复位后PC指针指向唯一的地址0x00000000。可以采用专用的复位芯片设计微控制器的复位电路。本题答案为B选项。","code":0},{"id":"1317","paper":"真考试卷21","no":21,"type":"单项选择题","q":"典型的嵌入式系统硬件由嵌入式最小硬件系统、前向通道、后向通道、人机交互通道以及相互互联通信通道等组成，下面的选项中属于相互互联通信通道的是（  ）。","o":["A/D转换器","D/A转换器","LCD显示器","CAN接口"],"a":"D","e":"相互互连通道包括RS-232/RS-485串行通信接口、CAN通信接口、以太网通信接口、 USB通信接口等。本题答案为D选项。","code":0},{"id":"1318","paper":"真考试卷21","no":22,"type":"单项选择题","q":"下面是关于ARM的AMBA的叙述，其中错误的是（  ）。","o":["AMBA是ARM公司定义的用于连接ARM内核与处理器芯片中其他组件的总线规范","AMBA包含通常被称为系统总线的接口标准","AMBA包含通常被称为外围总线的接口标准","作为一种总线规范，AMBA发布后未进行过版本更新"],"a":"D","e":"AMBA是ARM公司定义的用于连接ARM内核与处理器芯片中其他组件的总线规范，包含通常被称为系统总线的接口标准，外围总线的接口标准。AMBA发布版本在不断更新。本题答案为D选项。","code":0},{"id":"1319","paper":"真考试卷21","no":23,"type":"单项选择题","q":"下面是关于ARM芯片访问存储器的叙述，其中错误的是（  ）。","o":["ARM内核通过片内的系统总线可以访问片内的SRAM","ARM内核通过片内的高带宽外部存储器控制接口可以访问芯片扩展的Flash存储器","ARM内核通过片内的高带宽外部存储器控制接口可以访问芯片扩展的DRAM","ARM内核通过片内的高带宽外部存储器控制接口可以访问片内的Flash存储器"],"a":"D","e":"ARM处理芯片内部硬件中除ARM内核外，最重要的组件就是存储器及其管理组件，用于管理和控制片内的SRAM、ROM和Flash ROM,通过外部存储器控制器对外部扩展存储器如 Flash存储器及DRAM等进行管理与控制。本题答案为D选项。","code":0},{"id":"1320","paper":"真考试卷21","no":24,"type":"单项选择题","q":"下面关于SPI的叙述中，错误的是（  ）。","o":["SPI是一种同步串行外设接口","1个时钟信号SCK控制一位数据的传输","一般情况下，SPI接口包含低电平有效的从机选择线","SPI不能实现全双工通信"],"a":"D","e":"SPI是一种同步串行外设接口，在时钟信号SCK的作用下，一位一位按位传输数据。一般情况下，SPI接口包含低电平有效的从机选择线。SPI可完成全双工的同步串行通信。本题答案为D选项。","code":0},{"id":"1321","paper":"真考试卷21","no":25,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是（  ）。","o":["USB通信采用主从方式","USB 3.0 的数据传输速度为5Gb/s","USB 3.0和USB之前的版本一样只能实现半双工通信","USB支持即插即用和热插拔功能"],"a":"C","e":"USB通信采用主从方式。USB 3.0 的数据传输速度为5Gb/s。USB支持即插即用和热插拔功能。USB3.0采用全双工通信。本题答案为C选项。","code":0},{"id":"1322","paper":"真考试卷21","no":26,"type":"单项选择题","q":"下面关于LED和LCD的叙述中，错误的是（  ）。","o":["在外围电路的配合下，通过ARM 的GPIO引脚可以控制单个LED的亮灭","八段LED数码管有共阴极和共阳极两种结构形式","如果嵌入式处理器集成有LCD控制器，就可以选择合适的LCD显示屏，由处理器内部集成的LCD控制器直接控制","LCD显示模块和八段LED数码管一样，只能用于显示数字和部分字母"],"a":"D","e":"在外围电路的配合下，通过ARM 的GPIO引脚可以控制单个LED的亮灭。八段LED数码管有共阴极和共阳极两种结构形式。如果嵌入式处理器集成有LCD控制器，就可以选择合适的LCD显示屏，由处理器内部集成的LCD控制器直接控制。LCD显示模块有字符型，有图形点阵型，还有带汉字库的图形点阵型。本题答案是D选项。","code":0},{"id":"1323","paper":"真考试卷21","no":27,"type":"单项选择题","q":"下面是关于S3C2410嵌入式微处理器芯片的GPIO的叙述，其中错误的是（  ）。","o":["有8个并行I/O接口（GPA~GPH）","有些I/O接口除作为通用I/O使用外，还用作UART等专用I/O接口的信号线","不同的GPIO接口共享一个控制寄存器，用于确定各接口的具体功能","GPIO作为输入时具有缓冲功能，作为输出时具有锁存功能"],"a":"C","e":"GPIO有8个并行I/O接口（GPA~GPH）。GPH除可作为输入/输出外，主要作为三个UART串行通信相关引脚。GPIO每个端口都有控制寄存器、数据寄存器以及上拉寄存器。控制寄存器决定引脚的功能，数据寄存器存放输入的数据或输出的数据，上拉寄存器决定引脚是否要被内部上拉。GPIO作为输入时具有缓冲功能，作为输出时具有锁存功能。本题答案为C选项。","code":0},{"id":"1324","paper":"真考试卷21","no":28,"type":"单项选择题","q":"下面是关于三星公司基于ARM9内核的S3C2410嵌入式微处理器芯片的叙述，其中错误的是（  ）。","o":["S3C2410是64位嵌入式微处理器","采用哈佛体系结构，程序存储器和数据存储器分开","内部集成的中断控制器与AHB总线相连","内部集成的SPI接口与APB总线相连"],"a":"A","e":"S3C2410是三星公司基于ARM920T核的嵌入式微处理器。ARM920T集成了ARM9TDMI,属于中高档32位嵌入式微处理器。采用哈佛体系结构，程序存储器与数据存储器分开。使用ARM公司特有的AMBA总线，对于高速组件采用AHB总线，而对于低速外设接口则采用APB总线。AHB通过桥接器连接APB。本题答案是A选项。","code":0},{"id":"1325","paper":"真考试卷21","no":29,"type":"单项选择题","q":"下图所示的嵌入式系统的软件结构属于（  ）。","o":["简单的轮询结构","监控式操作系统+应用软件结构","通用嵌入式操作系统+应用软件结构","带中断的轮询结构"],"a":"B","e":"选项A简单轮询结构和选项D带中断的轮询结构均不包含操作系统内核，而图中明确存在“操作系统内核”，排除A选项和D选项。选项 B监控式操作系统（如 μC/OS）提供基础任务调度与中断管理，结构简洁，通常仅含任务、ISR 与内核，图中属于B选项；通用嵌入式操作系统（如 Linux）包含文件系统、网络协议栈等复杂组件，图中未体现此类模块，排除C选项；综上所述，本题答案为B选项。","code":0},{"id":"1326","paper":"真考试卷21","no":30,"type":"单项选择题","q":"下列各项中，属于开源bootloader的是（  ）。","o":["RTAI","eCOS","PMON","QNX"],"a":"C","e
