":"PMON兼有BIOS和bootloader部分功能的开放源码软件。在国内主要用于与MIPS兼容的龙芯系列处理器。本题答案为C选项。","code":0},{"id":"1327","paper":"真考试卷21","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，错误的是（  ）。","o":["常见的硬件抽象层规范大多是由操作系统厂商提出的","板级支持包为软件系统提供多任务的运行环境，创建应用程序的运行实例","硬件抽象层和板级支持包都是嵌入式系统的底层软件","除了与在引导和加载操作系统过程中所需的硬件环境相关的设备驱动程序之外，BSP包含的其他设备驱动程序通常不直接由BSP使用"],"a":"B","e":"常见的HAL规范大多是由操作系统厂商提出的。BSP中包含硬件相关的设备驱动程序，这些驱动程序为操作系统或应用程序访问硬件提供支持，对系统硬件进行管理，并实现数据的输入输出操作。但是，除了与在引导和加载操作系统过程中所需的硬件环境相关的设备驱动程序之外，BSP包含的其他设备驱动程序通常不直接由BSP使用。本题答案为B选项。","code":0},{"id":"1328","paper":"真考试卷21","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是（  ）。","o":["支持不同硬件结构的bootloader程序有不同的版本","RTEMS是公认的功能最强、最具弹性以及更新最快的开放源码bootloader","无论采用何种操作系统的引导加载方式，最终都必须在ROM中直接运行操作系统代码","第二阶段的代码通常用汇编语言实现，以便实现操作系统加载的功能"],"a":"A","e":"bootloader依赖于具体的硬件结构。一般而言，支持不同硬件结构的bootloader程序有不同的版本。RTEMS即实时多处理器系统，是GPL开源的无版税嵌入式实时操作系统。只有加载方式一为在ROM中运行操作系统代码。第二阶段的代码通常用C语言实现，以便实现操作系统加载的功能。本题答案为A选项。","code":0},{"id":"1329","paper":"真考试卷21","no":33,"type":"单项选择题","q":"下列关于驱动程序的陈述中，错误的是（  ）。","o":["驱动程序只能被高层软件调用而无法自行运行","在某些系统中，设备驱动程序与操作系统内核都处在操作系统层中","μC/OS-II和QNX都定义了统一的设备驱动程序框架","从驱动程序调用者的角度看，驱动程序是对硬件操作的抽象，以实现高层软件对硬件的访问"],"a":"C","e":"驱动程序的基本特性可以概括为以下两条：（1）只能被高层软件调用而无法自行运行；（2）对上层软件屏蔽硬件细节，对下层硬件直接进行操作。有些系统中设备驱动程序与操作系统内核都处在操作系统层中，有些系统把设备驱动程序放在操作系统层之下单独构成一层，还有一些系统设备驱动层是板级支持包的一部分。μC/OS-II只包括操作系统内核，不包括设备驱动程序，而且编写设备驱动程序也没有定义统一的框架。从驱动程序调用者的角度看，驱动程序是对硬件操作的抽象，以实现高层软件对硬件的访问。本题答案为C选项。","code":0},{"id":"1330","paper":"真考试卷21","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，正确的是（  ）。","o":["嵌入式系统都属于实时系统","实时系统都属于嵌入式系统","准实时任务通常允许偶尔错过最后期限","实时系统都属于通用计算机系统"],"a":"C","e":"嵌入式系统与实时系统既有区别又相互联系。嵌入式系统并不都是实时系统。嵌入式系统中有相当大的比例是实时系统，实时系统中也有相当大比例是嵌入式系统。准实时任务通常允许偶尔错过最后期限，但若超过时限，所进行的操作或者计算结果没有任何意义。本题答案为C选项。","code":0},{"id":"1331","paper":"真考试卷21","no":35,"type":"单项选择题","q":"下列各项中，不属于硬实时操作系统的是（  ）。","o":["VxWorks","RETMS","QNX","Linux"],"a":"D","e":"硬实时操作系统。主要用于通信、军事、航天、控制等领域，与人的交互性要求相对较弱，可靠性和实时性要求高，运行环境复杂多变。VxWorks、RTEMS、QNX、μC/OS-II、Nucleus等都属于硬实时操作系统。本题答案为D选项。","code":0},{"id":"1332","paper":"真考试卷21","no":36,"type":"单项选择题","q":"下列各项中，不属于类Unix操作系统的是（  ）。","o":["iOS","Linux","Windows Embedded Compact","VxWorks"],"a":"C","e":"有一些与Unix有一定关系的派生操作系统，则被统称为类Unix (Unix-like)系统。这些类Unix系统中，有些是基于Unix代码衍生而来，但按法律和商业惯例不能佩戴Unix标志的操作系统，如FreeBSD和OpenBSD等；另一些虽然没有直接派生关系，但技术上与Unix相似，包括Linux、QNX、VxWorks以及安卓和iOS等。本题答案为C选项。","code":0},{"id":"1333","paper":"真考试卷21","no":37,"type":"单项选择题","q":"下列关于Linux操作系统实时化技术的陈述中，错误的是（  ）。","o":["内核补丁方式的实时任务和普通的应用采用同样的编程方式并使用同样的API，只是实时任务需要明确指定自己的优先级与调度策略","RTLinux实时操作系统采用双内核方式","在双内核方式下，实时任务直接在实时微内核上运行，非实时的通用Linux内核则是实时微内核的一个最高优先级任务","ADEOS采用超微内核方式实现实时化"],"a":"C","e":"内核补丁方式的实时任务和普通的应用采用同样的编程方式并使用同样的API，只是实时任务需要明确指定自己的优先级与调度策略。RTLinux实时操作系统采用双内核方式。实时任务直接在实时微内核上运行，而非实时的通用Linux内核在后台运行全部非实时任务，而它本身又是实时微内核的一个低优先级任务，与实时任务一起调度。ADEOS采用超微内核方式实现实时化。本题答案为C选项。","code":0},{"id":"1334","paper":"真考试卷21","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务状态转移的说法中，正确的是（  ）。","o":["运行态任务被抢占后将转入就绪态","运行态任务调用函数OSSemPend()后将转入被中断态","运行态任务在调用函数OSTimeDly()后将转入就绪态","在调用创建任务函数后，休眠态的任务将转入运行态"],"a":"A","e":"OSSemPend()函数将调用该函数的任务挂起并加入该信号量的等待队列。处于运行态的任务可以通过调用函数OSTimeDly()或函数OSTimeDlyHMSM ()延迟一段时间。运行态任务将在调用函数之后转入等待状态。任务代码驻留在内存中但还没有交给内核调度的状态。调用创建任务函数可以把任务提交给内核管理。运行态任务被抢占后将转入就绪态。\n本题答案为A选项。","code":0},{"id":"1335","paper":"真考试卷21","no":39,"type":"单项选择题","q":"下面有关嵌入式系统开发工具的描述语句中，不正确的是（  ）。","o":["嵌入式系统的产品种类是多种多样的，且嵌入式系统产品的开发工具也是多种多样的。","嵌入式系统的开发平台通常包含多种开发工具，如：编辑器、编译连接器、调试器等。","嵌入式系统开发平台由于包含多种工具，因此，很难使用统一的用户界面以提供给开发者使用。","嵌入式系统中的资源有限，在它上面很难直接进行软件的编程和编译、连接。"],"a":"C","e":"开发平台（环境）中的软件开发工具往往都使用统一的用户界面并作为一个整体提供给开发人员使用，这些工具都无缝连接，相互间可自由交换数据，大大提高了开发工作的效率， 所以人们也把它们称为集成开发环境。本题答案为C选项。","code":0},{"id":"1336","paper":"真考试卷21","no":40,"type":"单项选择题","q":"基于Linux操作系统环境下开发应用程序时，可采用GCC编译工具，下面叙述中正确的是（  ）。","o":["GCC将源文件生成可执行文件的过程是由：编译、汇编、连接等3个阶段组成。","GCC只能将C语言、C++语言编写的源程序编译连接成执行文件。","GCC命令中若加入-g参数来编译源程序，编译时仅完成编译操作，而不完成连接操作。","GCC把源文件仅仅编译成目标文件时，应用程序的源文件中可以不包含main函数。"],"a":"D","e":"从源文件生成可执行文件的过程是由四个相关联的阶段组成：预处理、编译、汇编、连接。它能将C语言、C ++语言、 汇编语言编写的源程序以及库文件编译连接成执行文件。GCC命令中若加入-g参数，该参数使得编译器在编译时产生一个用于调试的符号表，设计者要对源程序进行调试，通常需要在GCC命令中加入该参数。若仅仅是把源文件编译成目标文件，因为不进行连接操作，所以 main函数就不是必需的。本题答案为D选项。","code":0},{"id":"1358","paper":"真考试卷22","no":1,"type":"单项选择题","q":"下面是关于嵌入式系统中的I/O设备和I/O接口的叙述,其中错误的是（  ）。","o":["键盘、触摸屏等是用于人机交互的I/O设备","压力传感器、继电器等是用于机机交互的I/O设备","I/O接口用于连接和控制I/O设备的工作","采用蓝牙、Zigbee等标准连接嵌入式系统时，由于不存在物理连接，所以这些标准不属于嵌入式系统的I/O接口"],"a":"D","e":"I/O接口用于连接（包括电器连接与物理连接）和控制I/O设备的工作有多种类型。其中无线接口有：红外线（IrDA)接口、蓝牙（Bluetooth)接口、Zigbee接口、WiFi接口等。本题答案为D选项。","code":0},{"id":"1359","paper":"真考试卷22","no":2,"type":"单项选择题","q":"下面是关于嵌入式系统中常用的I/O接口的叙述,其中错误的是（  ）。","o":["HDMI是一种视频信号接口","CAN是一种工业总线接口","I/O接口从数据传输方式来看有串行和并行之分","RS-232-C是一种通用串行总线式接口"],"a":"D","e":"通用串行总线式接口有 USB 2. 0/USB 3.0、IEEE 1394、以太网接口等。RS-232-C属于异步串行接口。本题答案为D选项。","code":0},{"id":"1360","paper":"真考试卷22","no":3,"type":"单项选择题","q":"嵌入式系统中常用的存储器有闪烁存储器、动态随机存取存储器、静态随机存取存储器、电可擦除可编程只读存储器等，通常，它们分别简写为（  ）。","o":["EPROM、SRAM、DRAM、EEPROM","Flash ROM、DRAM、SRAM、EEPROM","E2PROM、DRAM、SRAM、EPROM","EEPROM、DRAM、SRAM、EPROM"],"a":"B","e":"闪速（闪烁）存储器Flash ROM、动态随机存取存储器DRAM、静态随机存取存储器SRAM、电可擦除可编程只读存储器EEPROM。本题答案为B选项。","code":0},{"id":"1361","paper":"真考试卷22","no":4,"type":"单项选择题","q":"下面关于嵌入式处理器的叙述中，错误的是（  ）。","o":["处理器是嵌入式系统的主要硬件之一，它能按照指令的要求高速度完成二进制数据算术和逻辑运算","大规模集成电路的出现，使得处理器的所有组成部分都可以制作在一块大小仅为几cm2的半导体芯片上","目前已可以采用深亚微米级至纳米级的半导体加工工艺加工嵌入式处理器","从逻辑结构上说，嵌入式系统内部只能包含一个处理器"],"a":"D","e":"有些嵌入式系统会包含多个处理器，它们各有其不同的任务，其中负责运行系统软件和应用软件的主处理器称为中央处理器（Central Processing Unit, CPU),其余的都是协处理器，如数字信号处理器（Digital Signal Processor, DSP)、图形处理器、通信处理器等。CPU是任何计算机不可或缺的核心部件。本题答案为D选择。","code":0},{"id":"1362","paper":"真考试卷22","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，正确的是（  ）。","o":["GB2312表示汉字时使用4个字节，每个字节的最高位固定为1","标准ASCII码是8位编码","GB18030采用不等长编码","UTF-16采用单字节可变长编码"],"a":"C","e":"GB2312国标字符集，汉字和图形符号在计算机内部都采用2字节（16个二进制位）来表示，每字节的最高位均规定为1。标准ASCII码是7位编码。GB18030采用不等长的编码方法。UTF-16采用的是双字节可变长编码。本题答案为C选项。","code":0},{"id":"1363","paper":"真考试卷22","no":6,"type":"单项选择题","q":"下列关于超文本的描述中，错误的是（  ）。","o":["超文本格式采用网状结构来组织信息","超文本属于丰富格式文本","WWW网页是典型的超文本结构","超文本又称为线性文本"],"a":"D","e":"超文本（hypertext)概念是对传统文本的一个扩展，它采用网状结构来组织信息，文本中的各个部分按照其内容的逻辑关系互相链接。WWW网页就是典型的超文本结构。超文本也属于丰富格式文本，许多软件都可以制作、编辑和浏览超文本。本题答案为D选项。","code":0},{"id":"1364","paper":"真考试卷22","no":7,"type":"单项选择题","q":"下列关于数字图像的描述中，错误的是（  ）。","o":["若某图像的像素深度是8位，则不同亮度等级的总数为256","JPEG格式可以将多张图像保存在同一个文件中，形成动画的效果","在计算机中灰度图像用一个矩阵来表示，彩色图像用一组矩阵来表示，每个矩阵称为一个位平面","一幅图像的数据量可按下面的公式进行计算（字节）：图像数据量＝图像水平分辨率×图像垂直分辨率×像素深度/8"],"a":"B","e":"JPEG是静止图像数据压缩编码的国际标准，它特别适合处理各种连续色调的彩色或灰度图像。本题答案为B选项。","code":0},{"id":"1365","paper":"真考试卷22","no":8,"type":"单项选择题","q":"关于多路复用技术以下说法正确的是（  ）。\n①包括时分多路复用和频分多路复用。\n②多路复用指的是多路信号同时共用一条传输线\n③频分多路复用是指不同终端信号经过不同的频率调制（调频）（载波频率不同）在同一传输线传输\n④通过光纤同时传输几种不同波长的光束，称为波分多路复用，属于频分多路复用技术的一种形式\n⑤时分多路复用将轮转一周的时间划分为若干时间片，每对终端在每个轮转周期可分配到一个时间片来传输一组信号，所有终端依次轮流在同一传输线上传输信息","o":["① ③ ⑤","① ② ③ ④","② ③ ④ ⑤","① ② ③ ④ ⑤"],"a":"D","e":"一般总是让多路信号同时共用一条传输线进行传输称为多路复用。多路复用技术有两类：时分多路复用，另一类是频分多路复用。频分多路复用是指不同终端信号经过不同的频率调制（调频）（载波频率不同）在同一传输线传输。时分多路复用将轮转一周的时间划分为若干时间片，每对终端在每个轮转周期可分配到一个时间片来传输一组信号，所有终端依次轮流在同一传输线上传输信息。通过光纤同时传输几种不同波长的光束，称为波分多路复用，属于频分多路复用技术的一种形式。本题答案为D选项。","code":1},{"id":"1366","paper":"真考试卷22","no":9,"type":"单项选择题","q":"以下关于ARM处理器说法正确的是（  ）。","o":["ARM处理器均采用CISC和RISC相结合的指令集","ARM处理器仅支持小端格式，不支持大端格式","ARM处理器都采用多级指令流水线","ARM处理器内部都有内存保护部件MPU"],"a":"C","e":"ARM采用RISC体系结构。ARM体系结构可以用两种方法存储数据字，称之为大端模式和小端模式。ARM处理器都采用多级指令流水线。不是所有的ARM处理器内部都有内存保护部件MPU，带MPU的ARM处理器使用不同的域来管理和控制指令内存和数据内存。由此可知，C选项叙述正确，本题答案为C选项。","code":0},{"id":"1367","paper":"真考试卷22","no":10,"type":"单项选择题","q":"以下属于经典ARM处理器工作模式的有（  ）。\n①用户模式 ② 快速中断模式 ③ 外部中断模式  ④ 管理模式 ⑤中止模式 ⑥ 未定义指令模式 ⑦ 系统模式  ⑧ 大端模式   ⑨小端模式","o":["①②③④⑤⑥⑦⑧⑨","①②③④⑤⑥⑦⑧","①②③④⑤⑥⑦","①②⑤⑥⑦⑧⑨"],"a":"C","e":"经典ARM处理器工作模式的有：用户模式User、快速中断模式FIQ、外部中断模式IRQ、管理模式SVC、中止模式ABT、未定义指令模式UND、系统模式SYS。本题答案为C选项。","code":1},{"id":"1368","paper":"真考试卷22","no":11,"type":"单项选择题","q":"关于ARM指令寻址方式，以下说法错误的是（  ）。","o":["ADD R0，R1，R2是寄存器寻址方式","立即寻址中的立即数可以是十进制，也可以是十六进制","用于寄存器间接寻址的寄存器代表内存或外设的地址","数据传送指令可以用于基址加变址寻址"],"a":"D","e":"ADD R0, R1, R2 中，三个操作数全部存放在通用寄存器 R0、R1、R2 中，属于寄存器寻址，A选项说法正确；立即数无论是十进制还是十六进制，汇编器最终都会把它们转换成机器码里的二进制数值，B选项说法正确；寄存器间接寻址中，寄存器中存放的是操作数的地址，即内存或外设的地址，CPU通过该地址访问实际数据，C选项说法正确；ARM 中基址加变址寻址（如 LDR R0,[R1,R2]）仅适用于LDR或者STR（存储器读写）数据传送指令；通用数据运算传送指令（MOV、ADD、SUB 等算术逻辑指令）不支持基址变址寻址，只能使用寄存器、立即数寻址，D选项说法错误；由此可知，本题答案为D选项。","code":0},{"id":"1369","paper":"真考试卷22","no":12,"type":"单项选择题","q":"能够访问内存及外设的指令或伪指令有（  ）。\n   ①LDR R1,[R0]   ② LDR R1,=0x10000000 ③ MOV R1，R0 \n   ④STR R1,[R0]   ⑤ STRB R1,[R0]       ⑥ LDRH R1,[R0]  ⑦ ADD R1,R0","o":["① ② ④ ⑤ ⑥","① ④ ⑤ ⑥","③ ④ ⑤ ⑦","④ ⑤"],"a":"B","e":"能够访问内存及外设的指令或伪指令有LDR R1,[R0]  、STR R1,[R0] 、STRB R1,[R0]、LDRH R1,[R0]。本题答案为B选项。","code":1},{"id":"1370","paper":"真考试卷22","no":13,"type":"单项选择题","q":"以下关于MMU说法错误的是（  ）。","o":["它是内存管理部件","负责虚拟地址到物理地址的转换","所有ARM处理器内部均有MMU","虚拟地址是由ARM处理器核给出，通过查找页表方式得到物理地址"],"a":"C","e":"存储器管理单元（MMU)是许多高性能处理器所必需的重要部件之一。负责虚拟地址到物理地址的转换。虚拟地址是由ARM处理器核给出，通过查找页表方式得到物理地址。本题答案为C选项。","code":0},{"id":"1371","paper":"真考试卷22","no":14,"type":"单项选择题","q":"关于NVIC的说法正确的是（  ）。","o":["NVIC是唤醒中断控制器","NVIC具有中断嵌套功能","NVIC与MPU直接相连","NVIC共支持240个中断源"],"a":"B","e":"嵌套向量中断控制器NVIC ，NVIC支持嵌套中断。本题答案为B选项。","code":0},{"id":"1372","paper":"真考试卷22","no":15,"type":"单项选择题","q":"对于R13寄存器，以下说明正确的是（  ）。","o":["R13作为PC指针使用","R13作为连接寄存器LR使用","R13作为堆栈指针使用","R13属于程序状态寄存器"],"a":"C","e":"R13~R14在用户模式和系统模式分别为堆栈指针（Stack Pointer, SP )和程序链接寄存器（Link Register, LR)。本题答案为C选项。","code":0},{"id":"1373","paper":"真考试卷22","no":16,"type":"单项选择题","q":"ARM处理器复位后，通常执行以下源程序：\n      IMPORT   __main\n      LDR R0,=__main\n      BX __main\n以下解释错误的是（  ）。","o":["第一行声明外部有一个函数__main，这里引用","第二行是外部函数__main入口地址装入R0","第三行是无条件转移到由R0指示的地址处执行,也可用LDR R0,__main代替","最后的结果是让系统转入名为main的C程序入口"],"a":"C","e":"BX __main，BX为跳转指令，跳转到main函数的入口程序，不能用LDR指令代替。本题答案为C选项。","code":1},{"id":"1374","paper":"真考试卷22","no":17,"type":"单项选择题","q":"以下能把R1中的bit7位清零的指令有（  ）。\n①BIC  R0，R1，#0x00000080 \n②AND  R0，R1，#0xFFFFFF7F\n③EOR  R0，R1，#0x00000080\n④EOR  R0，R1，#0xFFFFFF7F\n⑤MOV R0，R1，LSL#7\n⑥MOV R0，R1，LSR#7","o":["① ③ ⑤","② ④ ⑥","① ②","①"],"a":"C","e":"BIC 是指将指定位清零。BIC   R0，R1，#0x00000080 该指令是将bit7位清零。AND位与运算，任何一位与0位做与运算结果为0，AND R0，R1，#0xFFFFFF7F该指令将bit7清零。EOR为逻辑异或指令，MOV为数据传送指令。本题答案为C选项。","code":1},{"id":"1375","paper":"真考试卷22","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，通过伪指令Var1 DCD 0xAABBCCDD在内存中定义了1个变量并赋值，已知R0=0,R1=0x11223344,R2=0,则依次执行以下指令序列：\n LDR R2,=Var1\n LDR R0,[R2]\n STRH R1,[R2]\n以下说法正确的是（  ）。","o":["R0的值保持不变","R2的值保持不变","Var1的值变为0xAABB3344","Var1的值变为0x11223344"],"a":"C","e":"LDR R2,=Var1指令的含义为：把变量Var1的地址加载到R2中，R2变为Var1的地址，不再是0。LDR R0,[R2]该指令将R2中存放的字数据读入寄存器R0中。STRH R1,[R2]该指令的含义为：将寄存器R1的半字数据存入到R2，因为是小端模式，32位数据字的高字节存放在高地址，而低字节存放在低地址，将R1低字节半字数据3344存放到R2的低地址，故变量Var1的值为0xAABB3344。综上所述，本题答案为C选项。","code":1},{"id":"1376","paper":"真考试卷22","no":19,"type":"单项选择题","q":"下面是关于嵌入式系统中电源电路的叙述，其中错误的是（  ）。","o":["设计嵌入式系统的电源电路时要考虑电源电路输入电压情况","嵌入式系统中电源电路的输入如果为直流电，则在需要电压调整时可采用DC-DC模块","设计嵌入式系统的电源电路时应考虑电磁兼容性问题","78xx系列是一种低压差稳压器"],"a":"D","e":"设计嵌入式系统的电源电路时要考虑电源电路输入电压情况。嵌入式系统中电源电路的输入如果为直流电，则在需要电压调整时可采用DC-DC模块。设计嵌入式系统的电源电路时应考虑电磁兼容性问题。78XX系列属于普通稳压器。本题答案为D选项。","code":0},{"id":"1377","paper":"真考试卷22","no":20,"type":"单项选择题","q":"下面是关于嵌入式处理器时钟电路的叙述，其中错误的是（  ）。","o":["嵌入式处理器需要时钟信号才能按照节拍正常工作","大多数嵌入式处理器内置了时钟信号发生器，使用内部时钟信号源时，不需外接任何元器件","大多数嵌入式处理器也可以使用外部时钟信号源","设计嵌入式系统时钟电路时应考虑嵌入式处理器的最高工作频率"],"a":"B","e":"几乎所有的嵌入式处理器本质上均为同步时序电路，需要时钟信号才能按照节拍正常工作。大多数嵌入式处理器内置了时钟信号发生器，因此时钟电路只需要外接一个石英晶体振荡器和两只电容就可以工作了。但有些场合（如为了减少功耗、需要严格同步等）需要使用外部振荡源提供时钟信号。根据系统需求选择合适的晶振，既要考虑嵌入式处理器的最高工作频率，又要保证系统在一定的功耗范围内。本题答案为B选项。","code":0},{"id":"1378","paper":"真考试卷22","no":21,"type":"单项选择题","q":"典型的嵌入式系统硬件由嵌入式最小硬件系统、前向通道、后向通道、人机交互通道以及相互互联通信通道等组成，下面的选项中属于人机交互通道的是（  ）。","o":["A/D转换器","D/A转换器","LCD显示器","CAN接口"],"a":"C","e":"人机交互通道包括键盘或触摸屏输入接口以及LED或LCD显示输出接口。本题答案为C选项。","code":0},{"id":"1379","paper":"真考试卷22","no":22,"type":"单项选择题","q":"基于AMBA的典型ARM片上系统如下图所示，图中①、②、③、④处可以是（  ）。","o":["通用定时器、并行接口、测试接口、ARM内核","测试接口、ARM内核、并行接口、通用定时器","并行接口、ARM内核、测试接口、通用定时器","ARM内核、通用定时器、测试接口、并行接口"],"a":"B","e":"根据AMBA总线的典型ARM片上系统构成，①处为测试接口②处为ARM内核③处为并行接口④处为通用定时器。本题答案为B选项。","code":0},{"id":"1380","paper":"真考试卷22","no":23,"type":"单项选择题","q":"在一个嵌入式系统中，对下面4个部分进行存取操作时，存取速度最快的是（  ）。","o":["处理器内部的通用寄存器","处理器内部的Cache","主存储器","外部存储器"],"a":"A","e":"处理器内部的通用寄存器，是速度最快的一层，其次就是处理器内部的Cache,其下就是主存储器，最后一层是容量最大、速度最慢的外部存储器。本题答案为A选项。","code":0},{"id":"1381","paper":"真考试卷22","no":24,"type":"单项选择题","q":"下面与嵌入式系统中使用的存储器的性能指标相关的叙述中，错误的是（  ）。","o":["存储器的带宽仅取决于存储器总线频率","存储器容量是指每一个存储芯片或模块能够存储的二进制位数","存储器芯片的工作速度通常用存取时间来衡量","内存容量1MB=1024KB"],"a":"A","e":"存储器容量是指每一个存储芯片或模块能够存储的二进制位数，内存容量1MB=1024KB。存取时间是指从CPU给出有效的存储器地址开始到存储器读出数据（或者是把数据写人存储器）所需要的时间。存储器芯片的工作速度通常用存取时间来衡量。存储器的带宽指每秒可传输（读出/写入）的最大数据总量，通常以B/s、KB/s、MB/s 和GB/S表示。存储器带宽与存储器总线频率有关，也与数据位数（宽度）和每个总线周期的传输次数有关。本题答案为A选项。","code":0},{"id":"1382","paper":"真考试卷22","no":25,"type":"单项选择题","q":"在软件配合下，通过SPI总线可以构成多种简单或复杂的系统。下图为多主多从式SPI系统，图中①、②、③、④、⑤、⑥分别为（  ）。","o":["MOSI、MISO、SSEL、MOSI、MISO、SSEL","MISO、MOSI、SSEL、MISO、MOSI、SSEL","MOSI、SSEL、MISO、MISO、MOSI、SSEL","MISO、SSEL、MOSI、SSEL、MOSI、MISO"],"a":"B","e":"根据SPI多主多从式连接，可知①MISO②MOSI③SSEL④MISO⑤MOSI⑥SSEL。本题答案为B选项。","code":0},{"id":"1383","paper":"真考试卷22","no":26,"type":"单项选择题","q":"在讨论S3C2410的UART时会涉及如下关系式：\nUBRDIVn=INT(UCLK/(波特率×16))-1\n与该关系式相关的叙述如下，其中错误的是（  ）。","o":["S3C2410内部有1个以上的UART，用n的不同值来指示是其中的哪一个UART","UBRDIVn即除数寄存器","UCLK可以是PCLK，也可以是UEXTCLK,由相应的控制寄存器确定","当UCLK=100MHz时，为获得11520b/s的波特率，UBRDIVn=0x541D"],"a":"D","e":"UBRDIVn = INT(100 MHz÷(11 520 b/s×16))-1 =542-1 = 541 = 0x021D。本题答案为D选项。","code":1},{"id":"1384","paper":"真考试卷22","no":27,"type":"单项选择题","q":"下面是关于S3C2410中断控制器中的INTMOD寄存器的叙述，其中错误的是（  ）。","o":["INTMOD寄存器即中断模式寄存器","INTMOD寄存器是一个32位的寄存器","INTMOD寄存器可用于设置S3C2410内置硬件组件的硬件中断为FIQ还是IRQ","INTMOD寄存器可用于设置S3C2410内置硬件组件的硬件中断是否被屏蔽"],"a":"D","e":"INTMOD寄存器即中断模式寄存器。INTMOD寄存器是一个32位的寄存器。INTMOD寄存器可用于设置S3C2410内置硬件组件的硬件中断为FIQ还是IRQ。INTMASK为中断屏蔽寄存器。本题答案为D选项。","code":0},{"id":"1385","paper":"真考试卷22","no":28,"type":"单项选择题","q":"下面关于S3C2410嵌入式微处理器芯片RTC的叙述中，错误的是（  ）。","o":["RTC采用单独的时钟源，时钟频率为32.768kHz","RTC能提供日历/时钟等信息","RTC的滴答时钟固定为1Hz","RTC内部的数据寄存器是8位寄存器"],"a":"C","e":"实时时钟（Real-Time Clock, RTC)组件是一种能提供日历/时钟等功能的内置硬件。实时时钟模块RTC采用单独的供电引脚和单独的时钟源，采用32.768 kHz晶体，由XTIrtc和XTOrtc引脚接入，通过2的15次方时钟分频器得到1 Hz的脉冲，进而得到时钟的最小单位时间1 s。内部的数据寄存器是8位寄存器。本题答案为C选项。","code":0},{"id":"1386","paper":"真考试卷22","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，错误的是（  ）。","o":["最简单的软件结构是轮询结构，由小型的监控式嵌入式操作系统和应用软件构成","选择嵌入式系统软件结构的一个基本原则是：选择可以满足响应时间需求的最简单的结构","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销","高端嵌入式操作系统除了内核之外，还包含驱动程序、文件系统、网络协议栈等多种组件"],"a":"A","e":"最简单的软件结构是轮询（Round-Robin)结构，应用程序重复循环检查每个外部输入条件，一旦有需要处理的任务，则进行相应的处理。这种嵌入式系统不需要操作系统支持，应用软件直接在裸机上运行。本题答案为A选项。","code":0},{"id":"1387","paper":"真考试卷22","no":30,"type":"单项选择题","q":"下列各项中，不属于开源bootloader的是（  ）。","o":["ViVi","RTAI","PMON","GRUB"],"a":"B","e":"常用开源bootloader有：LILO、GRUB、U-Boot、RedBoot、PMON和ViVi。RTAI为实时应用程序接口。本题答案为B选项。","code":0},{"id":"1388","paper":"真考试卷22","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，错误的是（  ）。","o":["常见的硬件抽象层规范大多是由操作系统厂商提出的","BSP加载操作系统后，操作系统为软件系统提供多任务的运行环境，创建应用程序的运行实例","μC/OS-II内核是Nios II系统的硬件抽象层系统库的组成部分之一","WEC7的BSP由引导加载程序、OEM适配层、设备驱动程序、配置文件和内核无关的传输层组成"],"a":"C","e":"Nios Ⅱ嵌入式处理器是INTEL（ALTERA）公司推出的采用哈佛结构、具有32位指令集的第二代片上可编程的软核处理器, 其最大优势和特点是模块化的硬件结构, 以及由此带来的灵活性和可裁减性。HAL系统库是Nios II处理器系统的轻量级运行环境，提供了简单的设备驱动程序接口和HALAPI(应用程序接口）。本题答案为C选项。","code":0},{"id":"1389","paper":"真考试卷22","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是（  ）。","o":["Bootloader又称为bootROM","RedBoot是公认的功能最强的开放源码bootloader","无论采用何种操作系统的引导加载方式，最终都必须在ROM中直接运行操作系统代码","第二阶段的代码通常用C语言实现，以便实现操作系统加载的功能"],"a":"D","e":"bootROM是指用来存储Bootloader程序的非易失存储器。U-Boot是公认的功能最强、最具弹性以及更新最快的开放源码bootloader。引导加载有四种方式，只有加载方式一：在ROM中直接运行操作系统代码。引导加载程序的执行过程的第二阶段的代码通常用C语言实现，以便实现操作系统加载的功能。本题答案为D选项。","code":0},{"id":"1390","paper":"真考试卷22","no":33,"type":"单项选择题","q":"下列两个软件模块的基本特性：1）只能被高层软件调用而无法自行运行；2）对上层软件屏蔽硬件细节，对下层硬件直接进行操作。同时符合这两个基本特性的软件模块是（  ）。","o":["板级支持包","操作系统","设备驱动程序","引导加载程序"],"a":"C","e":"驱动程序的基本特性可以概括为以下两条：（1）只能被高层软件调用而无法自行运行；（2）对上层软件屏蔽硬件细节，对下层硬件直接进行操作。本题答案为C选项。","code":0},{"id":"1391","paper":"真考试卷22","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，错误的是（  ）。","o":["软实时系统的合理时限长短往往取决于人的容忍度","硬实时、软实时与准实时的概念与时限的长短没有关系","评判实时系统的关键是系统对外部事件的处理速度","软实时任务偶尔超出时限并不会造成任务失败或导致任务出现致命错误"],"a":"C","e":"评判实时系统的关键并不是系统对外部事件的处理速度，而是处理事件的时间的可预见性和确定性。换句话说，无论系统面对最小负载还是最大负载，实时系统都必须确定地保证满足时间要求。本题答案为C选项。","code":0},{"id":"1392","paper":"真考试卷22","no":35,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，错误的是（  ）。","o":["VxWorks、RTEMS和U-Boot都属于硬实时操作系统","微内核结构的缺点是效率较低，性能较差","VxWorks和QNX操作系统都属于微内核结构","μC/OS操作系统不是完全免费的操作系统"],"a":"A","e":"VxWorks、RTEMS, QNX、μC/OS-II、Nucleus等都属于硬实时操作系统。U-Boot是开放源码bootloader。本题答案为A选项。","code":0},{"id":"1393","paper":"真考试卷22","no":36,"type":"单项选择题","q":"下列各项中，属于嵌入式Linux发行版的是（  ）。","o":["PowerPC","FreeRTOS","Nucleus PLUS","Xenomai"],"a":"D","e":"Xenomai是一个超微内核机制的Linux内核实时开发框架，属于嵌入式Linux发行版，本题答案为D选项。","code":0},{"id":"1394","paper":"真考试卷22","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务的陈述中，错误的是（  ）。","o":["只要有其他任务就绪，空闲任务的处理器时间就会被抢占","当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转入等待态","当需要实现对不可分割数据的原子访问时，μC/OS-II可以用锁定任务调度器操作取代关中断，从而确保对数据的访问不被打断","任务调度时，内核总是选择当前所有就绪态任务中最高优先级的任务转入运行态"],"a":"B","e":"系统正常运行时，中断使能一般是打开的，当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转人被中断态，处理器的使用权则被转交给中断服务程序。本题答案为B选项。","code":0},{"id":"1395","paper":"真考试卷22","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，错误的是（  ）。","o":["函数OSMboxAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用","单次执行的任务通常执行三步操作：任务准备工作；任务实体；自我删除函数调用","在使用内核提供的任何功能之前，必须先调用OSInit()函数进行内核初始化","函数OSTaskResume()实现退出临界状态的操作"],"a":"D","e":"任务可以挂起自己或者挂起其他任务。调用OSTaskSuspend()函数可以挂起一个任务，而被挂起的任务只能等待其他任务调用OSTaskResume()函数才能实现任务恢复。本题答案为D选项。","code":0},{"id":"1396","paper":"真考试卷22","no":39,"type":"单项选择题","q":"嵌入式系统产品的类型是多种多样的，其开发平台（或开发环境）也是多种多样的。下面说法中，不正确的是（  ）。","o":["嵌入式系统开发平台通常都包含有许多开发工具，如编辑器、编译器、调试器等。","ADS1.2是开发以ARM系列CPU为核心的嵌入式系统的开发工具。","RVDS开发平台包括工程管理器、编译连接器、调试器，不包括指令集仿真器。","GNU开发工具套件中包括GCC、GDB等。"],"a":"C","e":"RVDS开发工具套件中，主要包括工程管理器（IDE)、编译连接器（RVCT)、调试器 (RVD)和指令集仿真器（RVISS)等。本题答案为C选项。","code":0},{"id":"1397","paper":"真考试卷22","no":40,"type":"单项选择题","q":"下面的说法中，不正确的是（  ）。","o":["嵌入式系统开发过程中，需求分析阶段需要对用户的功能需求进行分析，不需要对非功能需求进行分析。","嵌入式系统开发过程中，系统设计阶段需要对用户的硬件结构进行设计，也需要对软件结构进行设计。","嵌入式系统开发过程中，构件设计阶段即可以选用标准通用的构件，也可以自己设计一些构件。","嵌入式系统开发过程中，系统集成阶段需要把所有构件连接在一起运行，并需要反复对系统进行测试。"],"a":"A","e":"需求分析阶段需要对用户的功能需求进行分析，包含如下内容：项目名称、目的、输入、输出、功能、性能和生产成本、功耗、尺寸和重量。本题答案为A选项。","code":0},{"id":"1419","paper":"真考试卷23","no":1,"type":"单项选择题","q":"下面是关于嵌入式系统的叙述，其中错误的是：","o":["嵌入式系统是嵌入式计算机系统的简称","嵌入式系统广泛应用于各个领域","嵌入式系统与人们日常使用的通用计算机（如个人计算机）总体上相似","目前，许多控制、监视或协助设备、机器、工厂运行的装置，都是嵌入式系统"],"a":"C","e":"嵌入式系统是嵌入式计算机系统的简称；嵌入式系统广泛应用于各个领域：许多控制、监视或协助设备、机器、工厂运行的装置，都是嵌入式系统。嵌入式系统与人们日常使用的通用计算机如个人计算机（PC)相比，嵌入式系统具有许多不同之处。是嵌入式系统的一些共同特点：专用性、隐蔽、资源受限、高可靠性、实时性和软件固化。","code":0},{"id":"1420","paper":"真考试卷23","no":2,"type":"单项选择题","q":"以下各项中影响嵌入式系统中CPU性能的因素是： \n①主频    ②指令系统  ③高速缓冲存储器的容量与结构  ④逻辑结构","o":["仅①","仅①和②","仅①、②和③","全部"],"a":"D","e":"嵌入式系统的性能在很大程度上是由CPU决定的。CPU的性能主要表现为程序（指令)执行速度的快慢，而影响程序（指令）执行速度的因素很多，例如：主频、指令系统、高速缓冲存储器的容量与结构和逻辑结构。故本题答案为D选项。","code":1},{"id":"1421","paper":"真考试卷23","no":3,"type":"单项选择题","q":"下面关于嵌入式处理器的叙述中，错误的是：","o":["有些嵌入式系统包含多个处理器","CPU是嵌入式系统不可或缺的核心部件","嵌入式处理器的字长有8位、16位等，最长不超过32位","数字信号处理器常简称为DSP"],"a":"C","e":"CPU的字长有4位、8位、16位、32位、64位之分。字长指的是CPU中通用寄存器和定点运算器的二进位宽度。在嵌入式系统中CPU是嵌入式系统不可或缺的核心部件，有些嵌入式系统包含多个处理器，数字信号处理器常简称为DSP。本题答案为C选项。","code":0},{"id":"1422","paper":"真考试卷23","no":4,"type":"单项选择题","q":"嵌入式系统的输入/输出设备种类繁多，按其服务对象可分为用于人机交互的设备和用于机机交互的设备两大类。下面设备中，属于机机交互的设备是：","o":["系统中的运动传感器","系统中的触摸屏","系统中的打印机","系统中的LCD"],"a":"A","e":"嵌入式系统中，用于机机交互的设备：包括各种类型的传感器（压力传感器、温度与湿度传感器、 重量传感器、运动传感器、距离传感器、光传感器、红外传感器、电流电压传感器和生物传感器等）和各种伺服执行机构（继电器、微电机、步进电机、线性电机等）。本题答案为A选项。","code":0},{"id":"1423","paper":"真考试卷23","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，错误的是：","o":["GB2312包含6000多个汉字","标准ASCII码是8位编码","GB18030采用不等长编码","UTF-16采用双字节可变长编码"],"a":"B","e":"GB2312包含6000多个汉字；标准ASCII码是7位编码；GB18030采用不等长编码；UTF-16采用双字节可变长编码。本题答案为B选项。","code":0},{"id":"1424","paper":"真考试卷23","no":6,"type":"单项选择题","q":"下列关于数字文本的描述中，错误的是：","o":["简单文本呈现为一种线性结构，写作和阅读均按顺序进行","金山WPS、微软Word、OpenOffice Writer、Adobe Photoshop等都属于文字处理软件","经过排版处理后，纯文本中增加了许多格式控制和结构说明信息， 这样的文本称为丰富格式文本","手机短消息使用简单文本"],"a":"B","e":"手机短消息使用简单文本；简单文本呈现为一种线性结构，写作和阅读均按顺序进行；经过排版处理后，纯文本中增加了许多格式控制和结构说明信息， 这样的文本称为丰富格式文本；金山WPS、微软Word、OpenOffice Writer属于文字处理软件，Adobe Photoshop为图像处理软件。本题答案为B选项。","code":0},{"id":"1425","paper":"真考试卷23","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，正确的是：","o":["图像获取过程的核心是数字信号的模拟化过程","音乐的取样频率范围通常为300~3400Hz","GIF是静止图像数据压缩编码的国际标准","数字图像的位平面数目即像素颜色分量的数目"],"a":"D","e":"图像获取过程的核心是模拟信号的数字化；音乐是一种全频带信号，所以取样频率通常在40 kHz以上。GIF为动态图像。数字图像的位平面数目即像素颜色分量的数目。本题答案为D选项。","code":0},{"id":"1426","paper":"真考试卷23","no":8,"type":"单项选择题","q":"以下关于多路复用技术说法错误的是：","o":["采用多路复用技术为了提高传输线路的利用率","采用多路复用技术为了降低成本","多路复用技术有时分多路复用和频分多路复用","通信传输线路的建设和维护在整个通信系统中所占比重微不足道"],"a":"D","e":"通信传输线路的建设和维护成本在整个通信系统中占相当大的份额，为了提高传输线路的利用率，降低通信成本，一般总是让多路信号同时共用一条传输线进行传输，这就是多路复用技术。这就是多路复用技术。本题答案为D选项。","code":0},{"id":"1427","paper":"真考试卷23","no":9,"type":"单项选择题","q":"以下关于ARM处理器结构类型说法错误的是：","o":["ISA为指令集体系结构的缩写","CISC为复杂指令集的缩写","RISC为精简指令集的缩写","哈佛结构不同于冯.诺依曼结构，哈佛结构存储程序和数据共同一条总线"],"a":"D","e":"指令集体系结构或IS架构（Instruction Set Architecture, ISA)；复杂指令集结构（CISC)及精简指令集结构（RISC)；哈佛结构使用独立的两条总线，分别作为CPU与每个存储器之间的专用通信路径，而这两条总线之间毫无关联。本题答案为D选项。","code":0},{"id":"1428","paper":"真考试卷23","no":10,"type":"单项选择题","q":"以下关于ARM Cortex嵌入式处理器说法错误的是：","o":["ARM Cortex-M0处理器是市场上现有的体积最小，能耗最低的ARM处理器","ARM Cortex-M3是一款低功耗处理器，具有门数目少，中断延时短调试成本低的特点","ARM Cortex-M4在ARM Cortex-M3的基础上增加了数字信号处理部件，具有数字信号处理能力","ARM Cortex-M0和ARM Cortex-M3采用的都是哈佛结构"],"a":"D","e":"ARM Cortex-M0体积最小，能耗最低的ARM处理器 ，采用冯氏存储结构，ARM Cortex-M3是一款低功耗处理器，具有门数目少，中断延时短调试成本低的特点 ，使用哈佛存储结构和3级流水线实现；本题答案为D选项。","code":0},{"id":"1429","paper":"真考试卷23","no":11,"type":"单项选择题","q":"以下ARM处理器中，如果设计平板电脑，优先选用的处理器是：","o":["ARM 9","ARM Cortex-A57","ARM Cortex-M3","ARM Cortex-R4"],"a":"B","e":"ARM9系列处理器为微控制器、DSP和Java应用提供了单处理器解决方案，非常适合需要有数字信号处理功能的微控制器应用领域。CM3处理器系列的低功耗、低成本和易于使用的优点相结合，旨在满足专门面向电动机 控制、汽车、电源管理、嵌入式音频和工业自动化市场的灵活解决方案。Cortex-R处理器系列目前有Cortex-R4、Cortex-R5和Cortex-R7等品种，它们适用于计算复杂、实时性要求苛刻（如汽车电子、硬盘驱动器控制、手机等）的领域。Cortex-A ( A = Application) 系列是面向高端应用的处理器，它的工作频率高、性能好、功耗合理。A5~A15为32位，而A53-A57为64位版本。这类被称为ARM Cortex应用处理器，简称应用处理器。本题答案为B选项。","code":0},{"id":"1430","paper":"真考试卷23","no":12,"type":"单项选择题","q":"对于经典ARM的工作模式，以下说法正确的是：","o":["实现虚拟存储器和存储器保护的工作模式属于管理模式","处理软中断的工作模式属于中止模式","处理FIQ中断的工作模式属于外部中断模式","运行特权级的操作系统任务的工作模式属于系统模式"],"a":"D","e":"中止模式：处理存储器故障，实现虚拟存储器和存储器保护；管理模式：操作系统的保护模式，处理软中断。外部中断模式IRQ：用于普通中断处理。系统模式：运行特权级的操作系统任务。本题答案为D选项。","code":0},{"id":"1431","paper":"真考试卷23","no":13,"type":"单项选择题","q":"某ARM处理器工作在Thumb-2状态，之后该ARM处理器的指令宽度是：","o":["1个字节","2个字节","2个字节或4个字节","4个字节"],"a":"C","e":"Thumb-2指令集既有16位指令又有32位指令，是一个混合的指令集。它是16位Thumb指令集的超集，功能强大、完备，效率高。本题答案为C选项。","code":0},{"id":"1432","paper":"真考试卷23","no":14,"type":"单项选择题","q":"关于32位ARM处理器存储器格式和数据类型，以下说法错误的是：","o":["数据类型有字节、半字和字等","存储格式包括大端模式和小端模式","一个字32位，必须以4字节对齐，即低2位地址始终为0","小端模式下高字节数据存放在低地址存储单元"],"a":"D","e":"数据类型有字节、半字和字等；一个字32位，必须以4字节对齐，即低2位地址始终为0；一个字32位，必须以4字节对齐，即低2位地址始终为0  ，小端模式下低字节存放低地址，高字节存放高地址。本题答案为D选项。","code":0},{"id":"1433","paper":"真考试卷23","no":15,"type":"单项选择题","q":"若读取内存数据，内存地址由R5指示，读出的数据存放在R6中，读取完毕，地址自动增加4，正确的指令为：","o":["LDR R6，[R5,#4]","LDR R5，[R6,#4]!","LDR R6，[R5],#4","LDR R6，[R5,#4]!"],"a":"C","e":"A选项LDR R6，[R5,#4]，将由R5+4指示的存储器的字数据读入到寄存器R6中；B选项LDR R5，[R6,#4]!  ，将由R6+4指示的存储器的字数据读入到寄存器R5中，并将新地址R6+4写入到R6中；C选项中LDR R6，[R5],#4 ，将由R5存储器的字数据读入到寄存器R6中，并将R5+4写入到R5中；D选项LDR R6，[R5,#4]!，将由R5+4存储器的字数据读入到寄存器R6中，并将R5+4写入到R5中；本题答案为C选项。","code":0},{"id":"1434","paper":"真考试卷23","no":16,"type":"单项选择题","q":"对于以下指令条件码，用于有符号数比较的有：     \n①CC  ②CS   ③GE  ④GT  ⑤HI  ⑥LS  ⑦LE  ⑧LT","o":["①  ②  ⑤  ⑥","①  ②  ③  ④","④  ⑤  ⑦  ⑧","③  ④  ⑦  ⑧"],"a":"D","e":"GE：带符号数大于或等于；GT：带符号数大于；LE：带符号数小于或等于；LT带符号数小于。本题答案为D选项。","code":1},{"id":"1435","paper":"真考试卷23","no":17,"type":"单项选择题","q":"如果要读取地址编号为0x50000100外部设备16位数据到R0中，则以下指令序列正确的是：","o":["LDR R1,=0x50000100\nSTRH R0,[R1]","LDR R0,=0x50000100\nSTRH R1,[R0]","LDR R1,=0x50000100\nLDRH R0,[R1]","LDR R0,=0x50000100\nLDRH R1,[R0]"],"a":"C","e":"将存储器地址赋值给R1：LDR R1,=0x50000100，因为读取的16位数据，使用半字数据加载指令LDRH，LDRH R0,[R1]。本题答案为C选项。","code":0},{"id":"1436","paper":"真考试卷23","no":18,"type":"单项选择题","q":"以下可以将指定位清除的指令助词符有：\n①AND  ②BIC  ③EOR    ④ORR ⑤TEQ  ⑥TST  ⑦CMP  ⑧CMN","o":["①  ②  ③","②  ③  ⑦","④  ⑤  ⑥","③  ④  ⑧"],"a":"A","e":"AND指令经常用于屏蔽有些位（清零）；BIC位清零指令；EOR逻辑指令异或，与自身异或运算，将自身清零。本题答案为A选项。","code":1},{"id":"1437","paper":"真考试卷23","no":19,"type":"单项选择题","q":"嵌入式最小硬件系统由几个硬件功能模块组成，下述各项中包括在嵌入式最小硬件系统中的硬件功能模块是：\n①嵌入式处理器 ②时钟电路  ③电源电路  ④复位电路","o":["仅①","仅①和②","仅①、②和③","全部"],"a":"D","e":"嵌入式处理器运行必备条件的硬件电路与嵌入式处理器共同构成了嵌入式最小硬件系统。包含：时钟电路、电源电路、复位电路、存储器、调试测试接口和嵌入式处理器。本题答案为D选项。","code":1},{"id":"1438","paper":"真考试卷23","no":20,"type":"单项选择题","q":"下面是关于嵌入式系统复位电路的叙述，其中错误的是：","o":["有些专用的处理器复位芯片的复位电压在一定范围内是可选的","有些专用的处理器复位芯片既能输出高电平复位信号，也能输出低电平复位信号","ARM处理器复位后其PC指针指向唯一的地址0xFFFFFFFF","有效的复位信号除对信号的逻辑高低有要求外，还对有效电平的宽度有要求"],"a":"C","e":"常见微控制器用复位专用芯片：811/812系列和SP708系列。811/812系列复位电压有5V、3.3V、3V、2.5V 可选，其中 811 系列输出低电平复位信号，812系列输出高电平复位信号。SP708系列其中SP708 (5V)和SP708SEN (3.3V)均为高电平和低电平输出复位双引脚，复位电平分别为5V和3V。ARM复位后PC指针指向唯一的地址0x00000000。有效的复位信号除对信号的逻辑高低有要求外，还对有效电平的宽度有要求。本题答案为C选项。","code":0},{"id":"1439","paper":"真考试卷23","no":21,"type":"单项选择题","q":"典型嵌入式系统硬件由嵌入式最小硬件系统、前向通道、后向通道、人机交互通道以及相互互联通信通道等组成。下列各项关于典型嵌入式系统硬件组成的叙述中错误的是：\n①典型嵌入式系统的前向通道一般包括模拟量输入接口和开关量/数字量输入接口\n②典型嵌入式系统的后向通道一般由模拟输出接口和数字输出接口组成\n③以太网通信接口属于人机交互通道\n④键盘属于相互互联通道","o":["①和②","②和③","③和④","①和④"],"a":"C","e":"人机交互通道包括键盘或触摸屏输入接口以及LED或LCD显示输出接口。相互互连通道包括RS-232/RS-485串行通信接口、CAN通信接口、以太网通信接口、USB通信接口等。前向通道一般包括模拟量输入接口和开关量/数字量输入接口。后向通道一般由模拟输出接口和数字输出接口组成。本题答案为C选项。","code":1},{"id":"1440","paper":"真考试卷23","no":22,"type":"单项选择题","q":"下面是关于ARM的AMBA的叙述，其中错误的是：","o":["基于AMBA的处理器使用系统总线连接高速系统组件","基于AMBA的处理器使用外围总线连接低速外围组件","系统总线信号经过桥接器变换成外围总线信号","虽然AMBA有不同的版本，但其系统总线的具体名称都是相同的"],"a":"D","e":"基于AMBA的处理器使用系统总线连接高速系统组件；基于AMBA的处理器使用外围总线连接低速外围组件；系统总线信号经过桥接器变换成外围总线信号；不同版本的AMBA，其系统总线的具体名称不相同。版本AMBA1总线名称为ASB、版本AMBA2总线名称为AHB、版本AMBA3系统总线名称有AXI，ATB，AHB-Lite等。本题答案为D选项。","code":0},{"id":"1441","paper":"真考试卷23","no":23,"type":"单项选择题","q":"下面是关于嵌入式系统使用的存储器的叙述，其中错误的是：","o":["嵌入式系统使用的存储器按照其存取特性可分为随机存取存储器和只读存储器","嵌入式系统使用的存储器按照其所处物理位置可分为片内存储器和片外存储器以及外部存储设备","嵌入式系统使用的存储器按照其存储信息的不同可分为程序存储器和数据存储器","在嵌入式系统中，把片内存储器简称为内存，而把片外扩展的存储器及外部存储设备简称外存"],"a":"D","e":"嵌入式系统使用的存储器有多种类型，按照其存取特性可分为随机存取存储器（RAM) 和只读存储器（ROM);按照所处物理位置可分为片内存储器（芯片内置的存储器）和片外存储器（外部扩展的存储器）以及外部存储设备；按照存储信息的不同可分为程序存储器和数据存储器。在嵌入式系统中把片内存储器及片外扩展的存储器简称主存储器或主存，而把外部存储设备简称辅助存储器。本题答案为D选项。","code":0},{"id":"1442","paper":"真考试卷23","no":24,"type":"单项选择题","q":"下面关于Flash存储器的叙述中，错误的是：","o":["Flash存储器与其之前的可擦除、可编程存储器相比，具有擦除和编程速度快的特点","NOR Flash ROM的特点是以字节为单位随机存取","NAND Flash ROM以页（行）为单位随机存取","S3C2410嵌入式处理器内部未内嵌NAND控制器"],"a":"D","e":"NOR Flash ROM的特点是以字节为单位随机存取。与NOR Flash ROM相比，NAND Flash ROM以页（行）为单位随机存取，在容量、使用寿命和成本方面有较大优势。)Flash存储器与其之前的可擦除、可编程存储器相比，具有擦除和编程速度快的特点。S3C2410嵌入式处理器内部内嵌NAND控制器。本题答案为D选项。","code":0},{"id":"1443","paper":"真考试卷23","no":25,"type":"单项选择题","q":"下面关于USB 3.0的叙述中，错误的是：","o":["USB 3.0通信时采用主从方式","USB 3.0的数据传输速度为5Mb/s","USB 3.0可以实现全双工通信","USB支持即插即用和热插拔功能"],"a":"B","e":"USB总线通信采用主从方式。USB 2.0的速度为480 Mb/s, USB 3. 0达到5 Gb/s即640 MB/s。USB 3.0可以实现全双工通信。USB支持即插即用和热插拔功能。本题答案为B选项。","code":0},{"id":"1444","paper":"真考试卷23","no":26,"type":"单项选择题","q":"下图为ARM处理芯片扩展LED驱动接口的一种方法。假设图中VCC的电压为+5V，LED发光时U1的输出电压为0V、LED的管压降为1V。下面相关叙述中错误的是","o":["图中的U1起驱动作用","为使图中的LED发光，ARM的GPF3引脚应为高电平","根据本题的假设条件，LED点亮时，流过LED的电流约为4mA","图中电阻较小到800Ω左右时，LED会相对变暗"],"a":"D","e":"U1是驱动电路，可以使正向驱动也可以反向驱动。电阻较小时，LED灯会相对变亮。本题答案为D选项。","code":0},{"id":"1445","paper":"真考试卷23","no":27,"type":"单项选择题","q":"下面是关于S3C2410存储器控制组件的叙述，其中错误的是：","o":["存储器控制器提供访问外部存储器所需的存储器控制信号","存储器控制器支持大/小端模式","地址空间有16个BANK，每个BANK大小为64MB","基于S3C2410的嵌入式系统的I/O与存储器采用统一编址方式"],"a":"C","e":"S3C2410存储器控制组件包括存储器控制器、总线控制器、外部主控器、NAND Flash控制器等。存储器控制器提供访问外部存储器所需的存储器控制信号，支持大/小端模式，地址空间共1 GB (8个BANK,每个BANK大小为128 MB)。以ARM芯片为核心的嵌入式系统其I/O与存储器采用统一编址方式。本题答案为C选项。","code":0},{"id":"1446","paper":"真考试卷23","no":28,"type":"单项选择题","q":"S3C2410内部有时钟振荡电路，在产生时钟信号后，该时钟信号经过主锁相环电路得到更加稳定的锁相后的时钟。在时钟控制器、电源控制器以及USB控制器的控制之下，产生不同需求的时钟信号。在这些时钟信号中，连接到APB总线上供外围组件使用的时钟信号是：","o":["UPLL时钟","HCLK时钟","PCLK时钟","FCLK时钟"],"a":"C","e":"S3C2410内部有时钟振荡电路可产生时钟信号，经过主锁相环电路得到更加固定的锁相后的时钟，在时钟控制器、电源控制器以及USB控制器的控制之下，产生不同需求的时钟信号如MPLL时钟（锁相环时钟）、UPLL时钟（USB时钟）、HCLK时钟（连接到AHB总线上外围高速组件使用的时钟）、PCLK时钟（连接到APB总线上外围组件使用的时钟）、FCLK时钟（内核所需快速时钟）等供不同组件使用。本题答案为C选项。","code":0},{"id":"1447","paper":"真考试卷23","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，错误的是：","o":["简单的轮询结构又称为前后台结构","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销","在典型的高端嵌入式系统中，通常可将系统软件层细分为硬件抽象层、操作系统层和中间件层","带中断的轮询结构又称为中断驱动结构"],"a":"A","e":"带中断的轮询结构成为前后台结构，也称为中断驱动结构。与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销；在典型的高端嵌入式系统中，通常可将系统软件层细分为硬件抽象层、操作系统层和中间件层。本题答案为A选项。","code":0},{"id":"1448","paper":"真考试卷23","no":30,"type":"单项选择题","q":"下列关于BSP功能的描述中，错误的是：","o":["系统上电复位之后由BSP完成系统内存配置","系统上电复位之后由BSP设置嵌入式处理器的工作模式","系统上电复位之后由BSP设置中断向量表配置","系统上电复位之后由BSP对系统中的所有硬件进行初始化"],"a":"D","e":"通常在系统复位时只需对操作系统运行所必需的硬件进行初始化操作，并不需要对系统中的所有硬件都进行初始化。系统上电复位之后由BSP完成系统内存配置、设置嵌入式处理器的工作模式和设置中断向量表配置。本题答案为D选项。","code":0},{"id":"1449","paper":"真考试卷23","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的陈述中，错误的是：","o":["为了降低BSP调试的复杂度，通常采用渐进的方式进行，将BSP的调试分为最小系统的调试和外围设备驱动程序的调试两步","板级支持包为软件系统提供多任务的运行环境，创建应用程序的运行实例","在BSP运行之前，操作系统的调试工具都不可用","开发全新BSP通常以操作系统厂商提供的BSP模板为依据"],"a":"B","e":"操作系统为软件系统提供多任务的运行环境，创建应用程序的运行实例，并将控制权交给应用程序。开发全新BSP通常以操作系统厂商提供的BSP模板为依据。在BSP运行之前，操作系统的调试工具都不可用。为了降低BSP调试的复杂度，通常采用渐进的方式进行，将BSP的调试分为最小系统的调试和外围设备驱动程序的调试两步。本题答案为B选项。","code":0},{"id":"1450","paper":"真考试卷23","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是：","o":["U-Boot能支持多种体系结构的处理器，但每种体系结构有其自身的版本","在ROM中直接运行操作系统代码的好处是比在RAM中运行速度提高了","无论采用何种操作系统的引导加载方式，最终都必须在ROM中直接运行操作系统代码","第二阶段的代码通常用汇编语言实现，以便实现操作系统加载的功能"],"a":"A","e":"U-Boot是一个规模庞大的开源bootloader软件，能支持多种体系结构的处理器，但每种体系结构有其自身的版本；A选项叙述正确。由于RAM的访问速度通常要比ROM快很多，在RAM中运行操作系统代码和应用程序的代码取指令的速度提高了。操作系统的引导加载方式一：在ROM中直接运行操作系统代码，方式二：在RAM中运行操作系统代码。第二阶段的代码通常用C语言实现以便实现操作系统加载的功能；B、C、D选项叙述错误。即本题答案为A选项。","code":0},{"id":"1451","paper":"真考试卷23","no":33,"type":"单项选择题","q":"下列关于驱动程序的陈述中，错误的是：","o":["驱动程序只能被高层软件调用而无法自行运行","完整的驱动程序通常包含硬件初始化、硬件使能、硬件工作模式和参数设置等功能","在VxWorks嵌入式操作系统中，操作系统定义了统一的设备驱动程序框架，不允许用户代码绕过操作系统直接访问硬件","驱动程序通常以若干函数的集合的形式出现，这些函数封装了对硬件（包括虚拟硬件）的操作"],"a":"C","e":"驱动程序只能被高层软件调用而无法自行运行；完整的驱动程序通常包含硬件初始化、硬件使能、硬件工作模式和参数设置等功能；驱动程序通常以若干函数的集合的形式出现，这些函数封装了对硬件（包括虚拟硬件）的操作；在WinCE、Linux和VxWorks等大型嵌入式操作系统中，往往自带一些标准设备的驱动程 序，并且定义了统一的设备驱动程序框架。VxWorks除了通过标准驱动程序接口访问硬件之外，也允许应用程序绕过操作系统直接访问硬件。本题答案为C选项。","code":0},{"id":"1452","paper":"真考试卷23","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，错误的是：","o":["软实时任务要求系统的响应越慢越好","相对于软实时系统，硬实时系统的时限并不一定更短","实时操作系统是不以在给定时间内完成更多的任务为目标，而是以响应外部事件尽可能快、且响应时间具有确定性为目标的操作系统","硬实时操作系统的抖动比软实时操作系统小"],"a":"A","e":"软实时任务仍然要求系统的响应越快越好，但是偶尔超出时限并不会造成任务失败或导致任务出现致命错误，而是造成任务的服务质量下降。硬实时、软实时与准实时的概念与时限的长短没有关系，而与其对超过时限的容忍程度有关。实时操作系统是不以在给定时间内完成更多的任务为目标，而是以响应外部事件尽可能快、且响应时间具有确定性为目标的操作系统；硬实时操作系统的抖动比软实时操作系统小。本题答案为A选项。","code":0},{"id":"1453","paper":"真考试卷23","no":35,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，错误的是：","o":["嵌入式操作系统公开源码并不意味着一定免费","MontaVista Linux是在原始免费型操作系统软件的基础上进行包装和优化的商业嵌入式Linux","VxWorks、RETMS和QNX都属于硬实时操作系统","微内核结构的优点是性能强，通信和上下文切换的开销低"],"a":"D","e":"微内核结构的操作系统有很多优点：内核精巧，结构紧凑，占用内存少，合资源相对紧张的嵌入式系统。开发和维护方便，系统可以动态更新服务模块。接口一致可扩展性与可配置性强，很适合嵌入式系统的可裁剪要求。可靠性高支持分布式系统。微内核结构的缺点主要体现在效率较低、性能相对较差，因为通信和上下文切换的开销大大增加。本题答案为D选项。","code":0},{"id":"1454","paper":"真考试卷23","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，错误的是：","o":["VxWorks操作系统采用微内核结构，内核仅提供多任务环境、任务间通信和同步功能","QNX是一款商用的分布式、可扩充的实时操作系统，遵循POSIX相关标准","Nucleus PLUS最著名的特性就是提供注释严格的C源代码给每一个用户，并且在最终产品量产时也不必支付版税","RTEMS是专门为硬件资源极为有限的无线传感器网络应用而量身定制的开源嵌入式操作系统"],"a":"D","e":"VxWorks操作系统采用微内核结构，内核仅提供多任务环境、任务间通信和同步功能；QNX是一款商用的分布式、可扩充的实时操作系统，遵循POSIX相关标准；Nucleus PLUS最著名的特性就是提供注释严格的C源代码给每一个用户，并且在最终产品量产时也不必支付版税；TinyOS是美国加州大学伯克利分校开发的开源嵌入式操作系统，专门为硬件资源极为有 限的无线传感器网络应用而量身定制。本题答案为D选项。","code":0},{"id":"1455","paper":"真考试卷23","no":37,"type":"单项选择题","q":"下列关于Linux操作系统实时化技术的陈述中，错误的是：","o":["MontaVista Linux在通用内核上增加低延迟补丁和可抢占内核补丁，在实时系统中占有较强的优势","超微内核方式是在实时内核和非实时内核之外增加了一个功能进一步缩减的超微内核，专门负责处理中断","在双内核方式下，实时任务直接在实时微内核上运行，非实时的通用Linux内核则是实时微内核的一个最高优先级任务","双内核方式的优点是微内核可以提供硬实时支持。其缺点是微内核与标准Linux内核共存"],"a":"C","e":"实时任务直接在实时微内核上运行，而非实时的通用Linux内核在后台运行全部非实时任务，而它本身又是实时微内核的一个低优先级任务，与实时任务一起调度。MontaVista Linux在通用内核上增加低延迟补丁和可抢占内核补丁，在实时系统中占有较强的优势；超微内核方式是在实时内核和非实时内核之外增加了一个功能进一步缩减的超微内核，专门负责处理中断；双内核方式的优点是微内核可以提供硬实时支持。其缺点是微内核与标准Linux内核共存。本题答案为C选项。","code":0},{"id":"1456","paper":"真考试卷23","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的说法中，不正确的是：","o":["周期执行的任务一般采用循环结构，并在每次完成具体功能后调用系统延时函数OSTimeDly()或OSTimeDlyHMSM()等待下一个执行周期","函数OSQAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用","函数OSSemDel()用于删除一个信号量。删除信号量之前，必须首先删除操作该信号量的所有任务","休眠态的任务在中断返回后转入运行态"],"a":"D","e":"休眠态的任务在中断返回后转入就绪态。周期执行的任务一般采用循环结构，并在每次完成具体功能后调用系统延时函数；函数OSQAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用；函数OSSemDel()用于删除一个信号量。删除信号量之前，必须首先删除操作该信号量的所有任务。本题答案为D选项。","code":0},{"id":"1457","paper":"真考试卷23","no":39,"type":"单项选择题","q":"下面有关开发套件GNU的说法中，正确的是。","o":["GNU开发套件中包括编译器、连接器、文本编辑器等，但不包括调试器。","GNU开发套件中的核心工具软件是GCC。","GCC在编译阶段不能检查输入文件中的代码语法是否正确。","GNU开发套件只用于开发基于μC/OS-II的应用程序。"],"a":"B","e":"GCC是GNU开发工具套件中的核心工具软件。GCC是一种针对Linux操作系统环境下应用程序的编译工具，能将C语言、C ++语言、 汇编语言编写的源程序以及库文件编译连接成执行文件。GDB是GNU开发工具套件中的程序调试工具。GNU开发套件支持多种操作系统，如μC/OS-II、μClinux和ARM Linux等。本题答案为B选项。","code":0},{"id":"1458","paper":"真考试卷23","no":40,"type":"单项选择题","q":"我们可以把嵌入式系统设计的开发过程分成4个阶段：需求分析与规格说明、系统设计、构件设计、系统集成与测试。下面的说法中，错误的是。","o":["系统设计也可以称为概要设计或总体设计。","系统设计阶段的任务是确定系统的硬件和软件结构，即进行软件、硬件功能划分。","系统设计阶段还需要描述非功能性的需求如何实现。","系统设计阶段还需要进行硬件电路的设计。"],"a":"D","e":"系统设计也称为概要设计或总体设计，这个阶段要完成的任务是：根据规格说明书中描述的系统需要实现的功能，确定如何实现这些功能的硬件和软件结构，特别是软件和硬件功能的划分，必须同时描述非功能上的需求如何实现。本题答案为D选项。","code":0},{"id":"1480","paper":"真考试卷24","no":1,"type":"单项选择题","q":"下面关于嵌入式系统软件的叙述中，错误的是：","o":["嵌入式系统的软件都需配置成包含板级支持包、设备驱动程序、实时操作系统、中间件以及嵌入式应用软件等的结构形式","嵌入式系统中的实时操作系统负责管理系统中的各种软硬件资源，完成任务调度、存储分配、文件管理等功能，是应用软件的运行平台","嵌入式系统软件中的中间件位于操作系统与应用软件之间，为上层的应用软件提供开发和运行环境","嵌入式系统软件中的应用软件是专门用于解决具体应用问题的软件，不同应用系统需要配置不同的应用软件"],"a":"A","e":"嵌入式系统的软件配置有多种情况。一些低端嵌入式系统的软件很简单，它们不需要操作系统，只需配置一个监控程序、若干设备驱动程序和事件处理程序即可。高端嵌入式系统的软件配置则比较复杂。它通常由板级支持包（Board Support Packet, BSP),设备驱动程序、实时操作系统、中间件以及嵌入式应用软件等组成。本题答案为A选项。","code":0},{"id":"1481","paper":"真考试卷24","no":2,"type":"单项选择题","q":"下面是关于嵌入式系统I/O接口的一些叙述：\nⅠ. 从数据传输速率来看， I/O接口有低速和高速之分\nⅡ. 从数据传输方式来看， I/O接口有串行和并行之分\nⅢ. 从是否需要物理连接来看，I/O接口有有线与无线之分\nⅣ. 从是否能连接多个设备来看，I/O接口有总线式和独占式之分\n其中，正确的是：","o":["仅Ⅲ和Ⅳ","仅Ⅰ和Ⅱ","仅Ⅱ和Ⅲ","Ⅰ、Ⅱ、Ⅲ和Ⅳ"],"a":"D","e":"I/O接口用于连接（包括电器连接与物理连接）和控制I/O设备的工作。它有多种类型： 从数据传输速率来看，有低速和高速之分；从数据传输方式来看，有串行和并行之分；从是否需要物理连接来看，有有线与无线之分；从是否能连接多个设备来看，有总线式（可串接多个设备）和独占式（只能连接一个设备）之分。本题答案为D选项。","code":1},{"id":"1482","paper":"真考试卷24","no":3,"type":"单项选择题","q":"下面是影响嵌入式系统中CPU性能的相关叙述：\nⅠ. CPU包含的定点运算器和浮点运算器数目\nⅡ. CPU内部流水线级数和条数\nⅢ. CPU有无指令预测和数据预取功能\nⅣ. CPU的时钟频率\n其中，属于与CPU逻辑结构相关的叙述是：","o":["仅Ⅱ和Ⅲ","仅Ⅲ和Ⅳ","仅Ⅰ、Ⅱ和Ⅲ","全部"],"a":"C","e":"逻辑结构CPU包含的定点运算器和浮点运算器数目、有无协处理器、流水线级数和条数、有无指令预测和数据预取功能等，都对指令执行的速度有影响；而CPU的时钟频率决定着CPU芯片内部数据传输与操作速度的快慢，即属于与CPU逻辑结构相关的叙述有Ⅰ、Ⅱ和Ⅲ；本题答案为C选项。","code":1},{"id":"1483","paper":"真考试卷24","no":4,"type":"单项选择题","q":"下面是关于嵌入式系统中常用的存储器的叙述，其中错误的是：","o":["SRAM是静态随机存取存储器，可用作CPU内核中的高速缓冲存储器","DRAM是动态随机存取存储器，在嵌入式系统中，常用于存放正在运行/处理的程序/数据的工作存储器","EEPROM是一种非易失性存储器，写入的信息需经紫外线照射一段时间才能擦除","与非型Flash存储器是非易失性存储器，可用于制作存储卡、U盘等"],"a":"C","e":"SRAM是静态随机存取存储器，可用作CPU内核中的高速缓冲存储器；DRAM是动态随机存取存储器，在嵌入式系统中，常用于存放正在运行/处理的程序/数据的工作存储器；电可擦可编程只读存储器（EEPROM)。通过专用设备可以离线修改，用来存放那些很少需要更新的程序代码（称为“固件”）。与非型Flash存储器是非易失性存储器，可用于制作存储卡、U盘等。本题答案为C选项。","code":0},{"id":"1484","paper":"真考试卷24","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，错误的是：","o":["GB2312编码的图形符号在计算机内部都采用单字节表示，汉字在计算机内部采用2字节表示","标准ASCII码是7位编码","GB18030采用不等长编码","UTF-16是UCS/Unicode常用的编码方案之一"],"a":"A","e":"GB2312编码的汉字和图形符号在计算机内部都采用2字节（16个二进制位）来表示；标准ASCII码是7位编码；GB18030采用不等长编码；UTF-16是UCS/Unicode常用的编码方案之一。本题答案为A选项。","code":0},{"id":"1485","paper":"真考试卷24","no":6,"type":"单项选择题","q":"下列关于数字文本的描述中，错误的是","o":["WWW网页中包含的指向其他网页的超链是有向的，起点位置称为链源","WWW网页是典型的超文本结构","金山WPS、微软Word、OpenOffice Writer、Adobe Acrobat等都属于文字处理软件","PDF格式将文字、字型、颜色、排版格式、图形、图像、超链、声音和视频等信息都封装在一个文件中，适合印刷出版，但不适合网络传输"],"a":"D","e":"WWW网页中的超链具有方向性，起点位置称为链源，A选项描述正确；WWW网页是典型的超文本结构，通过超链接实现信息间的网状关联，B选项描述正确；金山WPS、微软Word、OpenOffice Writer、Adobe Acrobat均为文字处理软件，C循序描述正确；PDF格式虽能封装文字、字体、颜色、排版、图形、图像、超链等信息，但不支持将声音和视频信息封装在PDF文件中，且其设计初衷是保证跨平台显示一致性，适合打印出版，但不适合直接用于网络传输多媒体内容（如流媒体播放），D选项描述错误；故本题答案为D选项。","code":0},{"id":"1486","paper":"真考试卷24","no":7,"type":"单项选择题","q":"下列关于数字图像的描述中，错误的是：","o":["像素深度是指每像素用多少个二进制位来表示","彩色打印机使用的是CMYK（青、品红、黄、黑）模型","测量每个取样点的每个分量的亮度值的过程称为分色","BMP图像文件格式的每个文件存放一幅图像，可以使用行程长度编码进行无损压缩，也可不压缩"],"a":"C","e":"分色将每个取样点的颜色分解成红、绿、蓝（R、G、B) 3个基色，如果是灰度图像或者黑白图像，则不必进行分色。像素深度是指每像素用多少个二进制位来表示。彩色打印机使用的是CMYK（青、品红、黄、黑）模型。BMP图像文件格式的每个文件存放一幅图像，可以使用行程长度编码进行无损压缩，也可不压缩。本题答案为C选项。","code":0},{"id":"1487","paper":"真考试卷24","no":8,"type":"单项选择题","q":"以下关于IP协议相关内容说法错误的是：","o":["IP协议定义的主机是指任何按照TCP/IP协议连接到网络上的终端设备","IPv4规定，每个IP地址4个字节表示，包括网络号与主机号","IP地址分为三个类别A类，B类和C类，不同类别的网络号相同，但主机号不同","由于IPv4的IP地址难以记忆，因此可用称为主机域名的符号名代替IP地址"],"a":"C","e":"IP地址分为A类、B类、C类3个基本类，每类有不同长度的网络号和主机号，另有两类分别作为组播地址和备用地址。IP协议定义的主机是指任何按照TCP/IP协议连接到网络上的终端设备。IPv4规定，每个IP地址4个字节表示，包括网络号与主机号。由于IPv4的IP地址难以记忆，因此可用称为主机域名的符号名代替IP地址。本题答案为C选项。","code":0},{"id":"1488","paper":"真考试卷24","no":9,"type":"单项选择题","q":"关于ARM处理器ARM指令集、Thumb指令集以及Thumb-2指令集，以下说法错误的是：","o":["ARM指令集代码占用内存空间最大","Thumb指令集代码占用内存空间最小","Thumb-2指令集仅有32位指令代码","不是所有ARM处理器均具有Thumb指令集"],"a":"C","e":"ARM指令集全部是32位的指令，从ARMv4T架构开始，几乎所有ARM处理器都支持Thumb指令集。Thumb全部是16位字长的指令，可以看作是ARM指令的压缩形式。它是为减少代码量而设计的。Thumb-2指令集既有16位指令又有32位指令，是一个混合的指令集。它是16位Thumb指令集的超集，功能强大、完备，效率高。本题答案为C选项。","code":0},{"id":"1489","paper":"真考试卷24","no":10,"type":"单项选择题","q":"对于ARM处理器，以下说法错误的是：","o":["ARM7TDMI以及ARM9TDMI属于经典ARM处理器，它们都具有Thumb指令集","ARM Cortex-A专门针对实时系统设计的高端嵌入式处理器","ARM Cortex-M系列是面向微控制器应用领域的嵌入式处理器","ARM Cortex-R4处理器内部配置了指令Cache和数据Cache，具备分支指令预测功能"],"a":"B","e":"Cortex-A 系列是面向高端应用的处理器，它的工作频率高、性能好、功耗合理。Cortex-R系列是面向实时控制应用的处理器，响应速度快、性能合理、功耗低。Cortex-M系列是面向微控制器的处理器，性价比极高、成本很低、功耗极小。ARM7TDMI以及ARM9TDMI属于经典ARM处理器，它们都具有Thumb指令集；ARM Cortex-R4处理器内部配置了指令Cache和数据Cache，具备分支指令预测功能。本题答案为B选项。","code":0},{"id":"1490","paper":"真考试卷24","no":11,"type":"单项选择题","q":"对于要设计一个要求低功耗、低成本的用于检测温度和压力的嵌入式系统，以下最合适的处理器是：","o":["ARM9TDMI","ARM Cortex-A50","ARM Cortex-R4","ARM Cortex-M0"],"a":"D","e":"Cortex-R属于中档处理器，它提供的性能比Cortex-M系列高得多，而Cortex-A系列则性能更高，专用于需要运行复杂操作系统（需使用虚拟内存管理）的面向用户的应用。CM0和CM0+成本低、简单易用，适合成本控制要求高的中低端应用；ARM9TDMI是基于ARM体系结构v4版本的高端ARM核；本题答案为D选项。","code":0},{"id":"1491","paper":"真考试卷24","no":12,"type":"单项选择题","q":"关于MMU，以下说明错误的是：","o":["它是存储器控制的关键部件","它负责存储器访问权控制","它负责虚拟地址到物理地址的转换","它决定存储格式是最小模式还是最大模式"],"a":"D","e":"存储器管理单元（MMU)是许多高性能处理器所必需的重要部件之一。MMU的主要功能为：虚拟地址到物理地址映射。存储器访问权限控制。本题答案为D选项。","code":0},{"id":"1492","paper":"真考试卷24","no":13,"type":"单项选择题","q":"关于经典ARM处理器异常中断响应过程，以下说法正确的是：","o":["将CPSR的值保存在R13寄存器中","设置当前CPSR相关位，进入相应模式。","将断点地址保存到PC寄存器","给LR（R14）寄存器强制赋值，转入相应的中断向量地址"],"a":"B","e":"将CPSR的值保存到将要执行的异常中断对应的各自SPSR中，以实现对处理器当前状态、中断屏蔽及各标志位的保护。设置当前状态寄存器CPSR的相应位，进入相应模式。将引起异常指令的下一条地址（断点地址）保存到新的异常工作模式的LR (R14) 中，使异常处理程序执行完后能正确返回原来的程序处继续向下执行。每种异常模式对应两个寄存器SP ( R13_ mode)和LR ( R14_ mode) , mode为svc、irq、 und. fiq或abt之一，分别存放堆栈指针和断点地址。本题答案为B选项。","code":0},{"id":"1493","paper":"真考试卷24","no":14,"type":"单项选择题","q":"已知0x10002000中的数据为0xA0, 0x10002001中的数据为0xB1, 0x10002002中的数据为0xC2, 0x10002003中的数据为0xD3, R0＝0x10002000，当指令LDR R1,[R0]执行完，以下说法错误的是：","o":["不同存储模式R1中的值不同","R0中的值是不变的","小端模式下R1 中的值为0xA0B1C2D3","内存中的值保持不变"],"a":"C","e":"在小端模式下，32位数据字的高字节存放高地址，而低字节存放低地址。指令LDR R1,[R0]的含义为将存储器R0中的数据传送至寄存器R1中。小端模式下1中存放的数据为0xD3C2B1A0。本题答案为C选项。","code":0},{"id":"1494","paper":"真考试卷24","no":15,"type":"单项选择题","q":"执行ARM指令STRH R0,[R1],#2之后，以下说法正确的是：","o":["R0的内容不变","R1的内容不变","R1的内容右移了2位","内存中的数据不变"],"a":"A","e":"指令STRH R0,[R1],#2的含义为：将寄存器R0中的半字数据写入到以R1为地址的存储器中，并将新地址R1+2写入到R1中。本题答案为A选项。","code":0},{"id":"1495","paper":"真考试卷24","no":16,"type":"单项选择题","q":"ARM处理器在小端模式下，执行以下程序片段之后：\n LDR R0,=0x40005000\n LDR R1,=0x44332211\n STR R1,[R0]\n LDR R1,[R0],#4\n MOV R2,R0  \n STR R2,[R0]\n以下说法正确的是：","o":["R0=0x40005000","R1=0x44332211","PC中的值没有变化","内存0x40005004~0x4005007中的数据字节分别为0x04、0x50、0x00和0x40"],"a":"D","e":"R0=0x40005000，R1=0x44332211；指令STR R1,[R0]：将由寄存器R1中的字数据写入以R0为地址的存储器中，指令LDR R1,[R0],#4：寄存器R0指示的存储器的字数据读入寄存器R1中，即R1=0x44332211，R0的地址加4为0x40005004。指令MOV R2,R0：将寄存器R0的地址传送给寄存器R2，R2的内容为0x40005004。指令STR R2,[R0]：将R2中的字数据写入到R0为地址的存储器中。因为是小端模式，高地址存放高字节，低地址存放低字节。则0x40005004存放0x04,0x40005005存放0x50，0x40005006存放0x00，0x40005007存放0x40。注：B选项和D选项都是正确的，但在考试时本题答案为D选项。","code":1},{"id":"1496","paper":"真考试卷24","no":17,"type":"单项选择题","q":"以下ARM指令错误的是：","o":["ADDS R0,R0,#1","ORR R2,R4,#10","LDR R0,R1","BX  R0"],"a":"C","e":"LDR字数据加载指令，用于从存储器中将一个32位的字数据传送到目的寄存器中。C选项中“LDR R0,R1”，R1需要用中括号括起来。本题答案为C选项。","code":0},{"id":"1497","paper":"真考试卷24","no":18,"type":"单项选择题","q":"有以下程序片段：\nDataBuf   DCD 1,2,3,4,5,6,7,8 \n          LDR R0,=DataBuf\n          LDR R1,[R0,#4]!\n          LDR R2,[R0,#4]!\n          LDR R3,[R0,#4]\n以下说法错误的是：","o":["R0中的值为1","R1中的值为2","R2中的值为3","R3中的值为4"],"a":"A","e":"DCD分配一段连续的字存储空间并对它进行初始化。程序中初始化为1,2,3,4,5,6,7,8 。 LDR R0,=DataBuf，R0为首地址；指令LDR R1,[R0,#4]!：将R0+4的内容写入到R1中，R1为2，R0的内容+4；指令LDR R2,[R0,#4]!：将R0+4的内容写入到R2中，R2为3，R0的内容+4；指令 LDR R3,[R0,#4]：将R0+4的内容写入到R3中，R3为4。本题答案为A选项。","code":1},{"id":"1498","paper":"真考试卷24","no":19,"type":"单项选择题","q":"下面是关于嵌入式系统中电源电路的叙述，其中错误的是：","o":["设计嵌入式系统的电源电路时要考虑电源电路输入电压情况","嵌入式系统中电源电路的输入如果为交流电，则电源模块采用AC-DC模块","设计嵌入式系统的电源电路时不需考虑电磁兼容性问题","设计嵌入式系统的电源电路时要考虑电源电路输出多大电压、多大电流"],"a":"C","e":"电源电路为整个嵌入式硬件系统提供能量，是整个系统工作的基础。选择和设计电源电路时主要考虑以下因素：（1）输出的电压、电流（2）输入的电压、电流（3）安全因素（4）电磁兼容（5）体积限制（6）功耗限制（7）成本限制。本题答案为C选项。","code":0},{"id":"1499","paper":"真考试卷24","no":20,"type":"单项选择题","q":"典型的嵌入式系统硬件由嵌入式最小硬件系统、前向通道、后向通道、人机交互通道以及相互互联通信通道等组成，下面的选项中属于前向通道的是：","o":["A/D转换器","键盘","LCD显示器","CAN接口"],"a":"A","e":"前向通道，即输入接口，由模拟量输入接口和数字量输入接口组成，模拟输入接口包括传感器、信号调理电路（滤波器、放大器等）、A/D转换器等构成。本题答案为A选项。","code":0},{"id":"1500","paper":"真考试卷24","no":21,"type":"单项选择题","q":"基于AMBA的典型ARM片上系统示意图如下图所示，图中①、②、③、④处可以是：","o":["并行接口、高带宽外部存储器控制接口、通用定时器、桥接器","桥接器、并行接口、高带宽外部存储器控制接口、通用定时器","高带宽外部存储器控制接口、桥接器、并行接口、通用定时器","通用定时器、并行接口、高带宽外部存储器控制接口、桥接器"],"a":"C","e":"根据典型ARM片上系统系统结构图，①处为高带宽外部存储器控制接口、②桥接器、③并行接口以及④为通用定时器。本题答案为C选项。","code":0},{"id":"1501","paper":"真考试卷24","no":22,"type":"单项选择题","q":"下面是关于ARM处理芯片中的互联通信组件的叙述，其中错误的是：","o":["串行外设接口常简称为SPI","集成电路互连常简称为I<SUP>2<\/SUP>C","串行外设接口常简称为I<SUP>2<\/SUP>S","控制器局域网常简称为CAN"],"a":"C","e":"ARM处理芯片内部有多个可互联通信的组件，主要包括UART、I<SUP>2<\/SUP>C、SPI、CAN、USB、 Ethernet 等。SPI是串行外设接口、I2C是集成电路互连的一种总线标准、I2S是一种面向多媒体应用的音频串行总线、CAN控制器局域网。本题答案为C选项。","code":0},{"id":"1502","paper":"真考试卷24","no":23,"type":"单项选择题","q":"在一个嵌入式系统中，对下面4个部分进行存取操作时，存取速度最慢的是：","o":["处理器内部的通用寄存器","处理器内部的Cache","主存储器","外部存储器"],"a":"D","e":"处理器内部的通用寄存器是速度最快的一层，其次是处理器内部的Cache，其下着为主存储器。速度最慢的是外部存储器。本题答案为D选项。","code":0},{"id":"1503","paper":"真考试卷24","no":24,"type":"单项选择题","q":"下面关于Flash存储器的叙述中，错误的是：","o":["Flash存储器与之前的可擦除、可编程存储器相比，具有擦除和编程速度快的特点","系统扩展NOR Flash ROM时，接口简单，可以直接利用处理器的外围总线","系统扩展NAND Flash ROM时，须采用专用的NAND Flash ROM控制器或通过系统的I/O接口来实现","数码相机中的大容量存储器采用NOR Flash ROM"],"a":"D","e":"嵌入式产品中包括数码相机、MP3随身听记忆卡、体积小巧的U盘等均采用NAND Flash ROM，大容量采用微硬盘。本题答案为D选项。","code":0},{"id":"1504","paper":"真考试卷24","no":25,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线接口的叙述中，错误的是：","o":["通过I<SUP>2<\/SUP>C总线传输数据时，每次只能传输一个字节","I<SUP>2<\/SUP>C总线只有两条信号线：数据线SDA和时钟线SCL","I<SUP>2<\/SUP>C总线是一种串行半双工传输的总线标准","I<SUP>2<\/SUP>C总线传输数据时，为完成一个字节的传送，接收方应向发送方发送一个ACK确认信号"],"a":"A","e":"I<SUP>2<\/SUP>C总线上每次发送的数据字节数不受限制，但每个字节必须为8位，而且每个字节后面必须跟一个应答位（ACK）（第9位），也叫认可位。本题答案为A选项。","code":0},{"id":"1505","paper":"真考试卷24","no":26,"type":"单项选择题","q":"下面关于UART的叙述中，错误的是：","o":["UART是一种同步串行通信外设接口","利用UART进行通信时，一方的发送信号数据线（TXD）与另一方的接收数据信号线（RXD）相连","利用UART可以实现全双工串行通信","S3C2410的中断控制器支持其UART接口引起的中断"],"a":"A","e":"串行异步通信接口 UART，利用UART进行通信时，一方的发送信号数据线（TXD）与另一方的接收数据信号线（RXD）相连，利用UART可以实现全双工串行通信，S3C2410的中断控制器支持其UART接口引起的中断。本题答案为A选项。","code":0},{"id":"1506","paper":"真考试卷24","no":27,"type":"单项选择题","q":"下图为基于ARM处理器的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，错误的是：","o":["图中所示的键盘接口采用了矩阵式键盘的结构形式","读取键值过程中GPG7~GPG4作为输出","图中有键按下时，可以引起ARM处理器中断","当仅有键6按下时，GPF7~GPF4输入的值为0100"],"a":"D","e":"根据键盘电路设计采用的是行列矩阵式键盘设计方法。采用四根I/O引脚GPG4~GPG7作为行扫描法输出，四根I/O引脚GPF0~GPF3作为输入检测。与门输出接外部中断2即EXINT2引脚，可以采用中断方式读取键盘值。本题答案为D选项。","code":0},{"id":"1507","paper":"真考试卷24","no":28,"type":"单项选择题","q":"下面关于RS-232、RS-485的叙述中，错误的是：","o":["RS-232接口标准采用负逻辑，逻辑0用正电平表示","RS-485采用差分信号传输方式，因此具有很强的抗共模干扰能力","在通信距离10米左右时，RS-485接口标准和RS-232接口标准的最高通信速率相同","通过RS-485可构成主从式多机通信系统，主机可采用轮询方式与各从机建立通信链接"],"a":"C","e":"RS-232接口输速率较低，在异步传输时，波特率为20Kbps。现在由于采用新的UART芯片16C550等，波特率达到115.2Kbps。RS-485的数据最高传输速率为10Mbps，最大的通信距离约1219M。RS-232接口标准采用负逻辑，逻辑0用正电平表示。RS-485采用差分信号传输方式，因此具有很强的抗共模干扰能力。本题答案为C选项。","code":0},{"id":"1508","paper":"真考试卷24","no":29,"type":"单项选择题","q":"下列关于嵌入式系统带中断的轮询结构的描述中，错误的是：","o":["前台由若干中断服务程序组成","与简单的轮询结构相比，系统对紧急事件的响应速度较低","中断服务程序只进行紧急事件的处理，对于非紧急的处理操作，通过设置状态标志由后台循环程序处理","又称为中断驱动结构"],"a":"B","e":"带中断的轮询结构，也被称为中断驱动结构或前后台结构，是一个循环执行的轮询程序，前台由若干中断服务程序组成。一般情况下，中断服务程序只进行紧急事件的处理，对于非紧急的处理操作，通过设置状态标志由后台循环程序处理。与简单的轮询结构相比，中断驱动结构提高了系统对紧急事件的响应速度，可以并发处理不同的异步事件。本题答案为B选项。","code":0},{"id":"1509","paper":"真考试卷24","no":30,"type":"单项选择题","q":"下列各项中，不属于开源bootloader的是：","o":["ViVi","U-boot","PMON","QNX"],"a":"D","e":"常见的开放源码引导加载程序：LILO、GRUB、U-Boot、RedBoot、PMON、ViVi。本题答案为D选项。","code":0},{"id":"1510","paper":"真考试卷24","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和BSP的概念的陈述中，错误的是：","o":["WEC7的BSP由引导加载程序、OEM适配层、设备驱动程序、配置文件和内核无关的传输层组成","BSP主要完成内存加电自检、外设存在自检、初始化外围设备、加载和启动操作系统等功能","BSP程序的效率和稳定性直接影响到整个系统的性能及稳定性","BSP与硬件平台无关，通常由操作系统厂商提供"],"a":"D","e":"WEC7的BSP由引导加载程序（Boot Loader)、OEM适配层（0AL)、设备驱动程序、配置文件和内核无关的传输层组成。BSP主要完成内存加电自检、外设存在自检、初始化外围设备、加载和启动操作系统等功能。BSP是操作系统正常运行的前提，BSP程序的效率和稳定性直接影响整个系统的性能及稳定性。BSP与硬件平台直接相关，操作系统厂商一般都会提供一些标准评估板的BSP。本题答案为D选项。","code":0},{"id":"1511","paper":"真考试卷24","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，错误的是：","o":["嵌入式系统上电复位后首先运行bootloader程序","在大多数嵌入式系统中，bootROM仅存储bootloader程序，而操作系统映像、应用程序代码和用户配置数据等信息存储在RAM中","与处理器体系结构相关的硬件初始化和板级初始化等操作通常都在第一阶段完成","第二阶段的代码通常用C语言实现，以便实现操作系统加载的功能"],"a":"B","e":"引导加载程序（引导程序）bootloader是底层软件的一部分。嵌入式系统上电复位后首先运行引导加载程序。bootloader程序采用两阶段执行过程：处理器体系结构相关的硬件初始化和板级初始化等操作通常都在第一阶段完成；第二阶段的代码通常用C语言实现，以便实现操作系统加载的功能。在大多数嵌入式系统中，bootROM内不仅存储bootloader程序，还存储操作系统映像、应用程序代码和用户配置数据等信息，即使系统断电，信息也不会丢失。本题答案为B选项。","code":0},{"id":"1512","paper":"真考试卷24","no":33,"type":"单项选择题","q":"下列两个软件模块的基本特性：1）只能被高层软件调用而无法自行运行；2）对上层软件屏蔽硬件细节，对下层硬件直接进行操作。同时符合这两个基本特性的软件模块是：","o":["BSP","中间件","设备驱动程序","引导加载程序"],"a":"C","e":"尽管不同系统中驱动程序的概念并不相同，但驱动程序的基本特性可以概括为以下两条：（1）只能被高层软件调用而无法自行运行；（2）对上层软件屏蔽硬件细节，对下层硬件直接进行操作。本题答案为C选项。","code":0},{"id":"1513","paper":"真考试卷24","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，错误的是：","o":["实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性","评判实时系统的关键是系统对外部事件的处理速度","硬实时、软实时与准实时的概念与时限的长短没有关系","一般而言，视频播放器是软实时系统"],"a":"B","e":"实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性。评判实时系统的关键并不是系统对外部事件的处理速度，而是处理事件的时间的可预见性和确定性。硬实时、软实时与准实时的概念与时限的长短没有关系，而与其对超过时限的容忍程度有关。一般而言，视频播放器是软实时系统。本题答案为B选项。","code":0},{"id":"1514","paper":"真考试卷24","no":35,"type":"单项选择题","q":"下列各项中，均属于硬实时操作系统的是：","o":["RTEMS和WindowsXP","Windows 7和Linux","VxWorks和RTEMS","Android和μC/OS-II"],"a":"C","e":"硬实时操作系统。主要用于通信、军事、航天、控制等领域，与人的交互性要求相对较弱，可靠性和实时性要求高，运行环境复杂多变。VxWorks、RTEMS, QNX、μC/OS-II、Nucleus等都属于硬实时操作系统。本题答案为C选项。","code":0},{"id":"1515","paper":"真考试卷24","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的陈述中，错误的是：","o":["RTEMS是GPL开源的无版税嵌入式实时操作系统","TinyOS是专门为硬件资源极为有限的无线传感器网络应用而开发的开源嵌入式操作系统","商业实时操作系统Nucleus通常以二进制代码的形式发售","内核是操作系统中的一组核心程序模块，其作用是管理系统资源、支持多任务并发执行"],"a":"C","e":"内核是操作系统中的一组核心程序模块，其作用是管理系统资源、支持多任务并发执行。商业实时操作系统Nucleus通常以源码的形式发售。RTEMS是GPL开源的无版税嵌入式实时操作系。TinyOS是专门为硬件资源极为有限的无线传感器网络应用而开发的开源嵌入式操作系统。本题答案为C选项。","code":0},{"id":"1516","paper":"真考试卷24","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统中断处理的陈述中，错误的是：","o":["在μC/OS-II系统中，中断服务程序会调用OSIntExit()函数","函数void OSIntEnter(void)在关中断状态下对变量OSIntNesting减1，并在返回前关中断","中断嵌套层数可多达255层","在中断返回之前，必须调用退出中断函数void OSIntExit(void)"],"a":"B","e":"在μC/OS-II系统中，中断服务程序会调用OSIntExit()函数，中断嵌套层数可多达255层。直接调用函数void OSIntEnter(void)该函数在关中断状态下对变量OSIntNesting加1,并在返回前开中断。在中断返回之前，必须调用退出中断函数void OSIntExit(void)。本题答案为B选项。","code":0},{"id":"1517","paper":"真考试卷24","no":38,"type":"单项选择题","q":"μC/OS-II操作系统有多种在任务间共享数据和实现任务间通信的方法。下列说法中错误的是：","o":["如果在中断服务程序中调用OSSemPost()函数，并不会立即发生任务切换","中断服务程序只能用OSSemAccept()请求信号量","消息邮箱可以接收多条消息","函数OSFlagAccept()在事件标志未被释放时并不会挂起任务，而是会立即返回"],"a":"C","e":"如果在中断服务程序中调用OSSemPost()函数，并不会立即发生任务切换；中断服务程序只能用OSSemAccept()请求信号量；函数OSFlagAccept()在事件标志未被释放时并不会挂起任务，而是会立即返回。消息邮箱可以接收一条消息。本题答案为C选项。","code":0},{"id":"1518","paper":"真考试卷24","no":39,"type":"单项选择题","q":"嵌入式系统的集成开发环境，又称为开发平台。该开发环境中通常包含大量的开发工具，下面所列的工具中，哪一个是不属于集成开发环境所包含的。","o":["编译连接器","文本编辑器","项目管理器","示波器"],"a":"D","e":"嵌入式系统的开发平台（环境）通常包含大量开发工具，主要有：\n（1）一个面向嵌入式应用的实时操作系统（RTOS)及其函数库，如嵌入式Linux、 WinCE、VxWorks等。开发者可根据系统的技术要求和商业要求选择合适的一种。\n（2） —套程序开发（代码生成）工具，如项目管理器、编辑器、编译器、连接器、定位 器等，开发者根据所选用的OS和编程语言（如Java、C或C + + )来确定要使用的工具，如 ADS、RVDS、GNU等\n（3）某些合适的调试工具，如仿真器、逻辑分析仪、开发板、评估板等。\n（4）其他，如包含各种中间件和软件组件的面向不同应用领域的各种应用平台等。\n示波器是一种用来测量交流电或脉冲电流波的形状的仪器，由电子管放大器、扫描振荡器、阴极射线管等组成。本题答案为D选项。","code":0},{"id":"1519","paper":"真考试卷24","no":40,"type":"单项选择题","q":"下面的说法中，不正确的是。","o":["基于嵌入式Web服务器，可以设计一个支持远程操控设备的应用系统。","基于嵌入式Web服务器的应用需求与通用Web服务器的应用需求是相同的。","基于嵌入式Web服务器的应用中，通常Web服务器是嵌入在设备中的。","基于嵌入式Web服务器的应用系统中，用户通过网页来监控设备。"],"a":"B","e":"基于嵌入式Web服务器的应用需求与通用Web服务器的应用需求是不同的，它不是以提 供信息服务为主，而是提供一个基于远程客户端的操控方式，即所谓的浏览器/服务器结构 (B/S结构）的操控方式，用户在远程的客户机上，通过浏览器与嵌入式Web服务器交互，从而操控被嵌入的设备。本题答案为B选项。","code":0},{"id":"1541","paper":"真考试卷25","no":1,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中,错误的是（  ）。","o":["嵌入式系统与具体应用紧密结合，具有很强的专用性","嵌入式系统通常是非计算机设备（系统）中的一个部分，它们隐藏在这些设备（系统）的内部","嵌入式系统通常在小型化、轻量化、低功耗及低成本方面有较高的要求","嵌入式系统在可靠性和实时性方面一般不作要求"],"a":"D","e":"根据嵌入式系统的特点：1、与应用密切相关，执行特定功能；2、具有实时约束；3、嵌入式操作系统一般为多任务实时操作系统；4、系统可靠性要求高；5、具有功耗约束；6、需要交叉开发环境和调试工具。故嵌入式系统在可靠性和实时性方面具有较高的要求而非不作要求，本题答案为D选项。","code":0},{"id":"1542","paper":"真考试卷25","no":2,"type":"单项选择题","q":"嵌入式系统的输入/输出设备种类繁多，下面设备中，属于人机交互的设备是（  ）。","o":["系统中的重量传感器","系统中的继电器","系统中的步进电机","系统中的触摸屏"],"a":"D","e":"顾名思义，人机交互设备是人与机器进行“沟通”的设备。触摸屏是根据人体的电流感应（电容屏）或压力（电阻屏）产生输入信号，供机器识别，达到交互的功能。本题答案为D选项。","code":0},{"id":"1543","paper":"真考试卷25","no":3,"type":"单项选择题","q":"嵌入式系统中的I/O接口用于连接和控制I/O设备的工作。下面接口中属于工业总线接口的是（  ）。","o":["USB 2.0","控制器局域网（CAN）","视频图形阵列（VGA）","红外线（IrDA）"],"a":"B","e":"A选项USB是通用串行总线；B选项CAN是一种工业控制局域网的标准总线；C选项VGA是一种视频图形矩阵的输出接口；D选项IrDA是一种基于红外线无线传输协议的接口。本题答案为B选项。","code":0},{"id":"1544","paper":"真考试卷25","no":4,"type":"单项选择题","q":"随着技术的发展，出现了一种能够把计算机或其他一些电子系统的全部电路都集成在单个芯片上的芯片，这种芯片常被简称为（  ）。","o":["微控制器","SoC","CPU","DSP"],"a":"B","e":"A选项微控制器是单片机的一种，并未集成全部的电路，开发者仍需要加外部设备；B选项中SoC是System on Chip即片上系统的缩写，它集成了各个功能模块，每一种功能都是由硬件描述语言设计程序，然后在SoC内由电路实现；C选项中CPU是中央处理器的缩写；D选项中DSP是数字信号处理器的缩写，二者均未集成电子系统的全部电路。本题答案为B选项。","code":0},{"id":"1545","paper":"真考试卷25","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，错误的是（  ）。","o":["GB2312表示汉字时使用4个字节，每个字节的最高位固定为1","标准ASCII码是7位编码","GB18030采用不等长编码","UTF-16采用双字节可变长编码"],"a":"A","e":"A选项GB2312编码中的每个汉字及符号以两个字节来表示，第一个字节称为“高位字节”（也称“区字节）”，第二个字节称为“低位字节”（也称“位字节”）。本题答案为A选项。","code":0},{"id":"1546","paper":"真考试卷25","no":6,"type":"单项选择题","q":"下列关于数字文本的描述中，正确的是（  ）。","o":["超文本格式采用线性组织","Adobe公司在1993年开发了一种用于电子文档交换的文件格式MPEG-4","WWW网页是典型的超文本结构","字符的形状有两种描述方法：点阵法和扫描法"],"a":"C","e":"A选项超文本格式采用网状结构组织；B选项Adobe公司开发的用于电子文档交换的文件格式是PDF，而MPEG-4为我们常说的视频格式mp4；D选项字符的形状有两种描述方法：点阵法和轮廓法。本题答案为C选项。","code":0},{"id":"1547","paper":"真考试卷25","no":7,"type":"单项选择题","q":"下列关于数字图像的描述中，错误的是（  ）。","o":["图像获取过程的核心是模拟信号的数字化过程","测量每个取样点的每个分量的亮度值的过程称为量化","PNG是一种无损压缩的图像文件格式","一幅图像的数据量可按下面的公式进行计算（字节）：图像数据量＝图像水平分辨率×图像垂直分辨率×像素深度/8"],"a":"B","e":"B选项中，测量每个取样点的每个分量的亮度值的过程称为采样；而量化是将每个像素点采样后的灰度值从模拟量转化为离散量的操作。本题答案为B选项。","code":0},{"id":"1548","paper":"真考试卷25","no":8,"type":"单项选择题","q":"关于无线通信，以下说法错误的是（  ）。","o":["无线通信是借助自由空间的电磁波传播信息","无线电波可以按照频率（或波长）分成中波、短波、超短波和微波等波段","中波主要沿地面传播，绕射能力强，适用于广播和海上通信","微波具有较强的电离层反射能力，适用于环球通信"],"a":"D","e":"无线通信是借助自由空间的电磁波传播信息；无线电波可以按照频率（或波长）分成中波、短波、超短波和微波等波段；中波主要沿地面传播，绕射能力强，适用于广播和海上通信；D选项中的微波频率在1-300GHZ之间，在空气中传播损耗很大，所以不能用于环球通信。本题答案为D选项。","code":0},{"id":"1549","paper":"真考试卷25","no":9,"type":"单项选择题","q":"关于嵌入式处理器的结构类型以下说法正确的是（  ）。","o":["RISC是复杂指令集结构，特点是指令数目很多且结构复杂","CISC是精简指令集结构，特点是指令数目少，指令字长统一，格式规范","哈佛结构和冯.诺依曼结构采用相同的存储结构","按照字长可以把处理器分为8位，16位，32位和64位结构"],"a":"D","e":"A选项中，RISC是精简指令集计算机的缩写；B选项中，CISC是复杂指令集计算机的缩写；C选项中，哈佛结构是一种将程序指令存储和数据存储分开的存储器结构，而冯.诺依曼结构是一种将程序指令存储器和数据存储器合并在一起的存储器结构。按照字长可以把处理器分为8位，16位，32位和64位结构，本题答案为D选项。","code":0},{"id":"1550","paper":"真考试卷25","no":10,"type":"单项选择题","q":"关于ARM Cortex应用处理器，以下说法错误的是（  ）。","o":["Cortex-A处理器系列适用于有高计算要求，需运行功能丰富操作系统以及要求提供交互媒体和图形显示的应用领域","Cortex-A处理器中都集成了浮点运算器VFP,提供了高性能的单精度和双精度浮点运算","Cortex-A处理器提供了对高级SIMD指令的支持","Cortex-A处理器采用冯.诺依曼结构"],"a":"D","e":"Cortex-A处理器系列适用于有高计算要求，需运行功能丰富操作系统以及要求提供交互媒体和图形显示的应用领域；Cortex-A处理器中都集成了浮点运算器VFP,提供了高性能的单精度和双精度浮点运算；Cortex-A处理器提供了对高级SIMD指令的支持；D选项中，Cortex-A处理器采用的是哈佛结构。本题答案为D选项。","code":0},{"id":"1551","paper":"真考试卷25","no":11,"type":"单项选择题","q":"关于ARM处理器的工作状态，以下说法正确的是（  ）。","o":["Thumb状态下所有指令都是4个字节的编码","Thumb-2的指令集仅支持32位指令","ARM状态下所有指令都是16位宽度","调试状态是处理器停机调试时进入的状态"],"a":"D","e":"A选项中，Thumb状态下所有指令都是16位状态，即2字节；B选项中，Thumb-2状态下兼有16位及32位指令，即2字节和4字节的指令；C选项中，ARM状态下所有指令都是32位指令，即4字节。调试状态是处理器停机调试时进入的状态，本题答案为D选项。","code":0},{"id":"1552","paper":"真考试卷25","no":12,"type":"单项选择题","q":"ARM处理器程序状态寄存器格式如下所示，对于各位的描述，错误的是（  ）。","o":["N为符号标志，负数时N=1，正数时N=0","Z为全零标志，运算结果为0，Z=1，运算结果不为零，Z=0","C为进位标志，加法时有进位C=1，减法有借位时C=1","T=1,ARM处理器将进入Thumb状态"],"a":"C","e":"C 为进借位标志，加法有进位时 C=1，无进位时 C=0；减法有借位时 C=0，无借位时 C=1。要注意这里的减法借位标志与 x86 等常规定义有区别，C选项叙述错误，故本题答案为C选项。","code":0},{"id":"1553","paper":"真考试卷25","no":13,"type":"单项选择题","q":"对于经典ARM处理器，关于ARM异常中断响应过程以下说法错误的是（  ）。","o":["发生异常后将CPSR的值保存在将要执行异常中断对应的各自SPSR中，以实现当前处理器状态、中断屏蔽及标志位的保护","设置当前状态寄存器CPSR的相应位","将断点地址保存在R13中","给PC赋值，转移到中断向量表指定地址"],"a":"C","e":"C选项中，断点地址保存在R14链接寄存器中，而R13是堆栈寄存器，通过入栈出栈来操作数据。本题答案为C选项。","code":0},{"id":"1554","paper":"真考试卷25","no":14,"type":"单项选择题","q":"某ARM处理器内部某功能部件可实现中断唤醒功能，这个部件是（  ）。","o":["MMU","MPU","NVIC","WIC"],"a":"D","e":"A选项中，MMU是内存管理单元的缩写；B选项中，MPU是内存保护单元的缩写；C选项中，NVIC是内嵌向量中断控制器；D选项中，WIC是唤醒中断控制器。本题答案为D选项。","code":0},{"id":"1555","paper":"真考试卷25","no":15,"type":"单项选择题","q":"对于经典ARM的异常，以下说法错误的是（  ）。","o":["发生复位异常后，立即中止当前的指令，PC＝0x00000004","七种不同的异常有六个优先级","异常优先级最高的是复位RESET","发生异常时，断点地址自动存放在LR中"],"a":"A","e":"发生复位异常后，立即中止当前的指令，转而执行中断服务程序，而复位中断服务程序的地址在0x00000000，故PC的值应为0x00000000；7种类型的异常分成6级，级别最高的是复位，最低的是未定义的指令UND或软件中断SWI；发生异常时，断点地址自动存放在LR中；A选项叙述错误，B、C、D选项叙述正确，即本题答案为A选项。","code":0},{"id":"1556","paper":"真考试卷25","no":16,"type":"单项选择题","q":"对于ARM处理器，以下说法正确的是（  ）。","o":["在Thumb状态下，每执行一条指令，PC值自动加4","在Thumb-2状态下，每执行一条指令，PC值自动加2","在ARM状态下，每执行一条指令，PC值自动加4","当处理异常时，将自动进入Thumb状态"],"a":"C","e":"A选项中，Thumb状态下，每执行一条指令，PC值自动加2；B选项中，Thumb-2状态下，每执行一条指令，PC值可能加2也可能加4；D选项中，当处理异常时，将自动进入ARM状态。本题答案为C选项。","code":0},{"id":"1557","paper":"真考试卷25","no":17,"type":"单项选择题","q":"把R5中的值乘以2，存放到R6中，以下指令正确的是（  ）。\n①ADD R6，R5，R5 \n②MOV R6，R5，LSL#1\n③MOV R6，R5，LSL#2\n④MOV R6，R5，LSR#1\n⑤MOV R6，R5，LSR#2\n⑥MUL R6，R5，#2","o":["①","⑥","①②","①②⑥"],"a":"D","e":"第③条指令为左移两位代表乘以4，故错误；第④条指令为右移一位代表除以2，故错误；第⑤条指令为右移两位代表除以4，故错误。本题答案为D选项。","code":1},{"id":"1558","paper":"真考试卷25","no":18,"type":"单项选择题","q":"在ARM汇编语言中，小端模式下，通过伪指令var1 DCD 0xAABBCCDD在内存中定义了1个变量var1并赋值，已知R2=0x44332211，,R3=0x12345678,R4=0,则依次执行（  ）。\n LDR R4,=var1\n STRH R2,[R4]\n LDR R3,[R4]\n指令序列执行后，以下说明正确的是：","o":["R2的值改变了","R3中的值保持不变","内存的值保持不变","var1的值变为0xAABB2211"],"a":"D","e":"A选项中，与R2相关的操作是将R2的值保存到地址R4中，故不变；B选项中，与R3相关的操作是将地址R4中的值保存到R3中，故R3的值被改变；C选项中，由于发生了将R2的值写入到地址R4中，故内存的值被改变；D选项中，由于执行了STRH R2,[R4]这条语句，将R2的低半字存入到了地址R4中，且为小端模式，故原var1指向的值，高2字节不变，低2字节变为R2的低2字节，即0xAABB2211。本题答案为D选项。","code":1},{"id":"1559","paper":"真考试卷25","no":19,"type":"单项选择题","q":"下面是关于嵌入式系统中电源电路的叙述，其中错误的是（  ）。","o":["应按照嵌入式硬件系统需要的最大功率确定嵌入式系统中电源电路的输出功率","嵌入式系统中电源电路的输入如果为交流电，则一般需要采用AC-DC模块","78xx系列是一种AC-DC模块","设计嵌入式系统的电源电路时应考虑电磁兼容性问题"],"a":"C","e":"应按照嵌入式硬件系统需要的最大功率确定嵌入式系统中电源电路的输出功率；嵌入式系统中电源电路的输入如果为交流电，则一般需要采用AC-DC模块；设计嵌入式系统的电源电路时应考虑电磁兼容性问题；C选项中，78xx是稳压器的系列名称。本题答案为C选项。","code":0},{"id":"1560","paper":"真考试卷25","no":20,"type":"单项选择题","q":"下面是关于嵌入式处理器时钟电路的叙述，其中错误的是（  ）。","o":["设计嵌入式系统的时钟电路时，可以采用使用外部时钟信号源的方式进行设计","对于内置了时钟信号发生器的嵌入式处理器，设计系统的时钟电路时不再需外接任何元器件","嵌入式处理器的功耗与嵌入式系统时钟电路的工作频率有关","嵌入式处理器的运行速度与嵌入式系统时钟电路的工作频率有关"],"a":"B","e":"设计嵌入式系统的时钟电路时，可以采用使用外部时钟信号源的方式进行设计；内置时钟信号发生器的嵌入式处理器仍需要外接一个石英晶体振荡器和两只电容才可以正常工作；嵌入式处理器的功耗与嵌入式系统时钟电路的工作频率有关；嵌入式处理器的运行速度与嵌入式系统时钟电路的工作频率有关；本题答案为B选项。","code":0},{"id":"1561","paper":"真考试卷25","no":21,"type":"单项选择题","q":"下面是关于典型嵌入式系统硬件组成的叙述，其中正确的是（  ）。","o":["典型嵌入式系统的后向通道一般包括模拟量输入接口和开关量/数字量输入接口","典型嵌入式系统的前向通道一般由模拟输出接口和数字输出接口组成","以太网通信接口属于相互互联通道","USB属于人机交互通道"],"a":"C","e":"A选项中，后向通道是输出端，而模拟量输入接口和开关量/数字量输入接口属于输入端；B选项中，前向通道是输入端，而模拟输出接口和数字输出接口属于输出端；D选项中，USB是一种通用串行总线，并不涉及到人机交互。本题答案为C选项。","code":0},{"id":"1562","paper":"真考试卷25","no":22,"type":"单项选择题","q":"下面是关于ARM的AMBA总线中的APB连接的硬件组件的叙述，其中错误的是（  ）。","o":["SPI与APB连接","I<SUP>2<\/SUP>C与APB连接","RTC与APB连接","DMA控制器与APB连接"],"a":"D","e":"D选项中，DMA控制器为直接存储器访问设备，与CPU连接，因此需要与AMBA总线中的AHB连接。本题答案为D选项。","code":0},{"id":"1563","paper":"真考试卷25","no":23,"type":"单项选择题","q":"下面是关于嵌入式系统中存储器的叙述，其中错误的是（  ）。","o":["对于CPU使用最频繁的少量的程序代码和数据存放在高速缓冲存储器中","正在运行中的程序的大部分数据和代码存放在主存储器（内存）中","尚未启动运行的其余程序或数据存放在容量大的外部存储器中待命","高速缓冲存储器的存取速度与主存储器的存取速度相当"],"a":"D","e":"D选项中，高速缓冲存储器Cache是一种比主存储器存取速度快很多的RAM，但由于使用的技术较昂贵，所以通常容量较小，用于保存存取频率较高的数据，以提高程序整体的响应速度。本题答案为D选项。","code":0},{"id":"1564","paper":"真考试卷25","no":24,"type":"单项选择题","q":"下面与嵌入式系统中使用的存储器的性能指标相关的叙述中，错误的是（  ）。","o":["存储器的带宽是指每秒可传输的最大数据总量","存储器的容量是指每一个存储芯片或模块能够存储的二进制位数","存储器的存取时间是指从CPU给出有效的存储器地址开始到存储器读出数据（或者把数据写入存储器）所需要的时间","内存容量1GB=1024TB"],"a":"D","e":"D选项中，GB与TB的转换关系是1024GB=1TB。本题答案为D选项。","code":0},{"id":"1565","paper":"真考试卷25","no":25,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线操作时序的叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C总线只有SDA和SCL两条信号线","I<SUP>2<\/SUP>C总线传输操作启动后主控制器件传输的第一个字节是地址，该字节的8位全部用来指示与哪一个从器件进行通信","接收方发送的ACK信号出现在一个字节传输完成的第9个时钟脉冲期间","I<SUP>2<\/SUP>C总线是多主总线"],"a":"B","e":"B选项中，I<SUP>2<\/SUP>C总线传输的第一个字节是起始标志和地址，其中最高位为开始标志，后7位为通信地址。本题答案为B选项。","code":0},{"id":"1566","paper":"真考试卷25","no":26,"type":"单项选择题","q":"下面是关于HDMI的叙述，其中错误的是（  ）。","o":["目前已有多种ARM芯片内置了HDMI控制器接口","应用中连接HDMI设备允许最长的电缆长度比连接数字视频接口（DVI）允许最长的电缆长度短","HDMI有多个不同的版本，最新版本的最高传输速率比早期版本的最高传输速率高","HDMI即高清晰度多媒体接口，是一种数字化音频/视频接口"],"a":"B","e":"目前已有多种ARM芯片内置了HDMI控制器接口；HDMI有多个不同的版本，最新版本的最高传输速率比早期版本的最高传输速率高；HDMI即高清晰度多媒体接口，是一种数字化音频/视频接口；HDMI线最长为30米，DVI线最长为15米。本题答案为B选项。","code":0},{"id":"1567","paper":"真考试卷25","no":27,"type":"单项选择题","q":"下图为ARM处理芯片扩展LED驱动接口的一种设计方法。假设图中VCC的电压为+5V，LED发光时U1输出端的电压为0V、LED发光时的管压降为1V。下面相关叙述中错误的是（  ）。","o":["图中的U1起驱动作用","为使图中的LED发光，ARM的GPF3引脚应为高电平","在上述假设条件下，LED点亮时，流过LED的电流为40mA","图中电阻R变为800Ω左右时，LED点亮时流过的电流一般会适当增加"],"a":"C","e":"图中的U1起驱动作用（反相器）；为使图中的LED发光，U1输出端的电压为0V（低电平），那么ARM的GPF3引脚应为高电平；图中电阻R变为800Ω左右时，LED点亮时流过的电流一般会适当增加；根据题意得到总电压为5V，LED的电压为1V，故电阻R的电压为4V，根据I=U/R得到电流为4mA。本题答案为C选项。","code":0},{"id":"1568","paper":"真考试卷25","no":28,"type":"单项选择题","q":"S3C2410内部有时钟振荡电路，在产生时钟信号后，该时钟信号经过主锁相环电路得到更加稳定的锁相后的时钟。在时钟控制器、电源控制器以及USB控制器的控制之下，产生不同需求的时钟信号。在这些时钟信号中，连接到AHB总线上供外围高速组件使用的时钟是（  ）。","o":["MPLL时钟","UPLL时钟","HCLK时钟","FCLK时钟"],"a":"C","e":"需要连接到AHB总线上的时钟只有HCLK即总线时钟，为AHB总线连接的高速外设，如内存控制器、中断控制器等，提供时钟信号。本题答案为C选项。","code":0},{"id":"1569","paper":"真考试卷25","no":29,"type":"单项选择题","q":"下列关于嵌入式系统的软件结构的描述中，错误的是（  ）。","o":["简单循环轮询结构程序结构简单，便于编程","前后台结构没有中断机制，不会出现程序随机切换带来的潜在问题","与应用软件直接在裸机上运行的简单结构相比，引入操作系统增加了系统的开销","嵌入式系统的软件也可分为嵌入式系统软件和嵌入式应用软件"],"a":"B","e":"选项B中，前后台结构，虽然实时性稍差，可能会导致发生的事件无法得到及时的处理，但依旧存在中断机制，仍会出现因程序随机切换带来的潜在问题。本题答案为B选项。","code":0},{"id":"1570","paper":"真考试卷25","no":30,"type":"单项选择题","q":"下列关于bootloader的描述中，错误的是（  ）。","o":["不同的bootloader程序功能不同，但都需要支持核心的引导（boot）和加载（load）操作系统等基本功能","有些种类的bootloader能支持多种体系结构的处理器，但每种体系结构有其自身的版本","在RAM中运行操作系统代码比在ROM中直接运行操作系统代码取指令的速度更高","采用从外存加载操作系统代码运行的方式，系统中无需配置ROM存储器"],"a":"D","e":"选项D中，从外存中加载操作系统代码运行的方式，仍然需要配置ROM进行程序和数据的保存，仅使用RAM会出现数据丢失的现象。本题答案为D选项。","code":0},{"id":"1571","paper":"真考试卷25","no":31,"type":"单项选择题","q":"下列关于硬件抽象层和板级支持包的概念的陈述中，错误的是（  ）。","o":["开发全新BSP通常以操作系统厂商提供的BSP模板为依据","BSP加载操作系统后，操作系统为软件系统提供多任务的运行环境，创建应用程序的运行实例","μC/OS-II内核是Nios II系统的硬件抽象层系统库的组成部分之一","为了降低BSP调试的复杂度，通常采用渐进的方式进行，将BSP的调试分为最小系统的调试和外围设备驱动程序的调试两步"],"a":"C","e":"μC/OS-II 是一种基于优先级的抢占式多任务实时操作系统，属于独立的系统，并不是硬件抽象层系统库的组成部分。本题答案为C选项。","code":0},{"id":"1572","paper":"真考试卷25","no":32,"type":"单项选择题","q":"下列关于bootloader的陈述中，正确的是（  ）。","o":["Bootloader又称为bootROM","在大多数嵌入式系统中，bootROM仅存储bootloader程序，不存储操作系统映像、应用程序代码和用户配置数据等信息","无论采用何种操作系统的引导加载方式，最终都必须在ROM中直接运行操作系统代码","与处理器体系结构相关的硬件初始化和板级初始化等操作通常都在第一阶段完成"],"a":"D","e":"选项A中，bootROM是嵌入处理器芯片内的一小块闪存，而Bootloader是嵌入式操作系统的引导加载程序；选项B中，bootROM除了存储bootloader程序以外，还会存储一些系统配置文件及系统信息文件等；选项C中，操作系统通过不同的引导方式，运行于不同的介质上，但不可以在只读存储器ROM上直接运行。本题答案为D选项。","code":0},{"id":"1573","paper":"真考试卷25","no":33,"type":"单项选择题","q":"下列关于驱动程序的陈述中，错误的是（  ）。","o":["驱动程序对上层软件屏蔽硬件细节，对下层硬件直接进行操作","完整的驱动程序通常包含硬件初始化、硬件使能、硬件工作模式和参数设置等功能","在VxWorks嵌入式操作系统中，操作系统定义了统一的设备驱动程序框架，不允许用户代码绕过操作系统直接访问硬件","一些操作系统把设备进一步抽象成设备文件，应用程序可以像操作普通文件一样对硬件设备进行操作"],"a":"C","e":"选项C中，VxWorks操作系统定义了统一的设备驱动程序框架，并且除了通过标准驱动程序接口访问硬件以外，也允许应用程序绕过操作系统直接访问硬件。本题答案为C选项。","code":0},{"id":"1574","paper":"真考试卷25","no":34,"type":"单项选择题","q":"下列与实时系统相关的陈述中，错误的是（  ）。","o":["实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性","实时系统主要考虑的是在最好情况下的系统行为的可预见性是否有保证","软实时任务仍然要求系统的响应越快越好，但是偶尔超出时限并不会造成任务失败或导致任务出现致命错误","通用计算机系统追求系统的平均响应时间短和用户使用的方便性"],"a":"B","e":"B选项中，实时系统是指计算的正确性不仅取决于程序的逻辑正确性，也取决于结果产生的时间，即在规定的时间内完成对该事件的处理，并控制所有实时任务协调一致的运行，而非考虑在最好情况下的系统行为的可预见性是否有保证。本题答案为B选项。","code":0},{"id":"1575","paper":"真考试卷25","no":35,"type":"单项选择题","q":"下列关于实时与嵌入式操作系统的陈述中，错误的是（  ）。","o":["因为Windows速度不够快、效率不够高，所以Windows并不是实时操作系统","微内核结构的缺点是效率较低，性能较差","操作系统可以确定性地满足请求的程度首先取决于它响应中断的速度，其次取决于系统是否具有足够的处理能力在要求的时间内处理所有的请求","μC/OS操作系统不是完全免费的操作系统"],"a":"A","e":"A选项中，Windows系统并不是因为速度不够快、效率不够高而不是实时操作系统。它的速度并不慢，效率也并不低。实时操作系统是保证在一定时间限制内完成特定功能的操作系统，而Windows系统不满足这样的需求，所以Windows不是实时操作系统。","code":0},{"id":"1576","paper":"真考试卷25","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统的体系结构的陈述中，错误的是（  ）。","o":["整体结构的操作系统最大的缺点就是高度集成，组件之间相互关联，结构不清晰","分层结构的缺点是每一层都要向上层提供通信机制，影响系统效率","单体结构和分层结构的操作系统中的内核称为宏内核或单内核","微内核结构的优点是性能强，通信和上下文切换的开销降低"],"a":"D","e":"选项D中，微内核将各个系统服务层分离，变成可以根据需求加入的可选服务，因此增加了系统的灵活性，却也增加了通信和上下文切换的开销。宏内核由于将系统服务和内核集成在一起，所以通信和上下文切换的开销会更低。本题答案为D选项。","code":0},{"id":"1577","paper":"真考试卷25","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统任务的陈述中，错误的是（  ）。","o":["只要有其他任务就绪，空闲任务的处理器时间就会被抢占","当外部事件或系统异常发生时，系统响应中断，当前运行的任务将转入等待态","用户必须在调用OSStart()启动多任务调度以后再开启时钟节拍器","如果任务在被挂起时正在等待延时，则挂起操作将被取消"],"a":"B","e":"外部事件的中断或系统发生的异常将导致当前运行的任务进入被中断态，选项B中，系统响应中断，当前运行的任务将转让等待态，错误。本题答案为B选项。","code":0},{"id":"1578","paper":"真考试卷25","no":38,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，错误的是（  ）。","o":["函数OSMboxAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用","μC/OS-II是可抢占的实时内核，在中断服务完成后允许进行中断级的任务调度","μC/OS-II支持任务级的任务调度和中断级的任务调度两种方式","函数OSTaskResume()实现退出临界状态的操作"],"a":"D","e":"函数OSMboxAccept()在没有接收到消息时并不会挂起任务，因而可以在中断服务程序中调用；μC/OS-II是可抢占的实时内核，在中断服务完成后允许进行中断级的任务调度；μC/OS-II支持任务级的任务调度和中断级的任务调度两种方式；函数OSTaskResume()的作用是将被挂起的任务进行恢复。本题答案为D选项。","code":0},{"id":"1579","paper":"真考试卷25","no":39,"type":"单项选择题","q":"下面的描述语句中错误的是（  ）。","o":["在嵌入式系统开发中，不同复杂程度的嵌入式系统，使用的调试工具不完全相同。","嵌入式系统开发时，所采用的调试工具，其任务是控制程序代码的执行并使系统中看不见的信息成为可见。","在线仿真器是嵌入式系统开发时所用的调试工具。其应与所要开发的嵌入式系统具有相同的嵌入式处理器。","对嵌入式系统进行调试时，硬件部分的调试需要借助JTAG调试工具，而不需要借助于“正确”的软件。"],"a":"D","e":"JTAG是一种基于国际标准测试协议的接口，用于芯片内部测试，由于硬件不能脱离软件的控制而单独运行，所以JTAG调试工具仍需要借助正确的软件才可以正常工作。本题答案为D选项。","code":0},{"id":"1580","paper":"真考试卷25","no":40,"type":"单项选择题","q":"在嵌入式系统开发时，有时会利用指令集模拟器来开发、调试相关的嵌入式应用软件。下面有关指令集模拟器的说明中，错误的是（  ）。","o":["指令集模拟器只能采用解释型的方式来仿真运行目标机器指令序列。","指令集模拟器中把目标机处理器硬件逻辑用变量或数据结构表示。","指令集模拟器可以根据目标机指令集的定义生成目标机器指令序列，并仿真运行。","指令集模拟器是在宿主机（如：PC机）上运行的纯软件工具。"],"a":"A","e":"指令集模拟器接受编译器或汇编程序生成的目标代码中的机器指令输入，模拟目标机CPU的取址、译码和执行操作，因此并不是只能采用解释型的方式来仿真运行目标机器指令序列。本题答案为A选项。","code":0},{"id":"1602","paper":"真考试卷26","no":1,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中，错误的是（  ）。","o":["嵌入式系统由硬件和软件两部分组成，软件必须配置操作系统","嵌入式系统的硬件包括存储器","嵌入式系统的性能在很大程度上是由系统中的中央处理器决定的","嵌入式系统通过输入/输出接口和输入/输出设备与外部世界联系"],"a":"A","e":"嵌入式系统的软件可以不配置操作系统，通过简单的前后台程序即可保证嵌入式系统的正常工作。本题答案为A选项。","code":0},{"id":"1603","paper":"真考试卷26","no":2,"type":"单项选择题","q":"嵌入式系统中的I/O接口用于连接和控制I/O设备的工作。下面接口中属于无线接口的是（  ）。","o":["IEEE 1394","RS 485","Zigbee","1553B"],"a":"C","e":"ZigBee也称紫蜂，是一种低速短距离传输的无线网上协议。本题答案为C选项。","code":0},{"id":"1604","paper":"真考试卷26","no":3,"type":"单项选择题","q":"下面是关于嵌入式处理芯片的叙述，其中错误的是（  ）。","o":["x86等微处理器不能用作嵌入式系统中的CPU","数字信号处理器可以用作嵌入式系统中的CPU","微控制器（单片机）可以用作嵌入式系统中的CPU","片上系统是高端嵌入式系统常用的嵌入式处理芯片"],"a":"A","e":"x86系列微处理器也可以用作嵌入式系统中的CPU，虽然嵌入式系统中的主流CPU是ARM处理器，但x86系列微处理器也可以用作嵌入式系统中的CPU。本题答案为A选项。","code":0},{"id":"1605","paper":"真考试卷26","no":4,"type":"单项选择题","q":"下面为嵌入式系统中常用的数字信号处理器（DSP）的叙述，其中错误的是（  ）。","o":["相对而言，DSP能更好地满足嵌入式系统对高速数字信号处理的需求","DSP 常采用哈佛结构","通过增加SIMD等指令，使DSP能够特别适用于实现FFT等数字信号处理算法","为满足手机或数码相机中对声音和图像信号的处理需求，这类嵌入式系统一般均采用为系统配置一片独立的DSP芯片这样一种解决方案"],"a":"D","e":"手机或数码相机中通常会集成一块DSP芯片用于处理声音和图像信号的处理，而不是配置一片独立的DSP。本题答案为D选项。","code":0},{"id":"1606","paper":"真考试卷26","no":5,"type":"单项选择题","q":"下列关于字符集及其编码的描述中，正确的是（  ）。","o":["GB2312编码的汉字和图形符号在计算机内部都采用2字节表示，每字节的最高位均规定为0","标准ASCII码是8位编码","GB18030采用等长编码","UTF-16是UCS/Unicode常用的编码方案之一"],"a":"D","e":"GB2312每字节的最高位均为1，作为汉字内码；标准ASCII是7位编码，使用8位保存，最高位为0；GB18030是变长多字节字符集，并不是等长编码。本题答案为D选项。","code":0},{"id":"1607","paper":"真考试卷26","no":6,"type":"单项选择题","q":"下列关于数字文本的描述中，正确的是（  ）。","o":["WWW网页中包含的指向其他网页的超链是有向的，起点位置称为链源","WWW网页是典型的线性结构","金山WPS、微软Word、OpenOffice Writer、Adobe Photoshop等都属于文字处理软件","PDF格式将文字、字型、颜色、排版格式、图形、图像、超链、声音和视频等信息都封装在一个文件中，适合印刷出版，但不适合网络传输"],"a":"A","e":"WWW网页是网状结构； Adobe Photoshop属于图形处理软件，是生活过中常说的PS； PDF格式由于将各种媒体信息均封装在了一个文件中，因此很适合网络传输。本题答案为A选项。","code":0},{"id":"1608","paper":"真考试卷26","no":7,"type":"单项选择题","q":"下列关于数字图像和声音的描述中，不正确的是（  ）。","o":["像素深度是指每像素用多少个二进制位来表示","如果3个颜色分量中的像素位数分别为6位、6位和4位，则该图像的像素深度为16","测量每个取样点的每个分量的亮度值的过程称为量化","声音信号数字化的过程分为采样、量化和编码三步"],"a":"C","e":"像素深度是指每像素用多少个二进制位来表示；测量每个取样点的每个分量的亮度值的过程为采样，而不是量化；声音信号数字化的过程分为采样、量化和编码三步。本题答案为C选项。","code":0},{"id":"1609","paper":"真考试卷26","no":8,"type":"单项选择题","q":"以下不属于互联网接入方式的是（  ）。","o":["固定电话的本地环路接入","有线电视网络接入","光纤接入","蓝牙接入"],"a":"D","e":"蓝牙是一种无线传输协议，但并不能作为互联网接入的方式。本题答案为D选项。","code":0},{"id":"1610","paper":"真考试卷26","no":9,"type":"单项选择题","q":"ARM处理器某工作状态能够根据实际情况自动选择16位指令代码和32位指令编码，这种工作状态是（  ）。","o":["Thumb状态","Thumb-2状态","ARM状态","调试状态"],"a":"B","e":"Thumb-2状态是ARM处理器可以同时兼容16位指令和32位指令的工作模式。本题答案为B选项。","code":0},{"id":"1611","paper":"真考试卷26","no":10,"type":"单项选择题","q":"在以下ARM处理器中，对于实时性要求非常高的场合，采用最合适的ARM处理器是（  ）。","o":["ARM9","ARM Cortex-A15","ARM Cortex-M0","ARM Cortex-R4"],"a":"D","e":"ARM Cortex-R系列处理器具有较高的实时性，因此适用于对于实时性要求非常高的场合。本题答案为D选项。","code":0},{"id":"1612","paper":"真考试卷26","no":11,"type":"单项选择题","q":"以下ARM处理器中，内部具备MPU以及NVIC部件的是（  ）。","o":["ARM 9","ARM Cortex-M0","ARM Cortex-M3","ARM Cortex-A15"],"a":"C","e":"ARM Cortex-M3处理器内部具备MPU以及NVIC。本题答案为C选项。","code":0},{"id":"1613","paper":"真考试卷26","no":12,"type":"单项选择题","q":"ARM处理器能够进行浮点运算的部件是（  ）。","o":["Cache","VFP","NVIC","WIC"],"a":"B","e":"选项B中的VFP是ARM处理器中用于浮点数运算的部件；选项A中的Cache为高速缓冲存储器；选项C中的NVIC是嵌套向量中断控制器；选项D中的WIC是唤醒中断控制器。本题答案为B选项。","code":0},{"id":"1614","paper":"真考试卷26","no":13,"type":"单项选择题","q":"关于经典ARM处理器工作模式，以下说法错误的是（  ）。","o":["中止模式ABT是处理存储器故障，实现虚拟存储器和存储器保护","系统模式SYS运行特权级的操作系统任务","外部中断请求IRQ属于外部中断模式，优先级别比FIQ中断请求级别高","管理模式SVC是操作系统的保护模式以处理软中断SWI"],"a":"C","e":"中止模式（ABT）在发生存储器访问异常时进入，用于支持虚拟存储系统和存储器保护机制，A选项说法正确；系统模式（SYS）是特权模式，允许操作系统任务访问所有系统资源，并可直接进行模式切换，B选项说法正确；外部中断请求IRQ属于外部中断模式，其优先级低于FIQ（快速中断）模式。FIQ是为高速数据传输或通道处理设计的高优先级中断，而IRQ是普通优先级中断，C选项说法是错误的；管理模式（SVC）是操作系统使用的保护模式，用于处理软中断（SWI）指令以及系统复位，D选项说法是正确的；综上所述，C选项说法错误，本题答案为C选项。","code":0},{"id":"1615","paper":"真考试卷26","no":14,"type":"单项选择题","q":"关于ARM的存储器格式，以下说法正确的是（  ）。","o":["ARM有两种存储字的格式，一种是实地址模式，一种是保护地址模式","大端模式是指数据字的高字节存放在高地址的一种模式","小端模式是指数据字的低字节存放在低地址的一种模式","大端模式和小端模式不能切换"],"a":"C","e":"A选项中ARM存储字的两种格式为大端模式和小端模式；B选项中大端模式是将高字节存放在低地址的一种模式；D选项中大端模式和小端模式是可以切换的。本题答案为C选项。","code":0},{"id":"1616","paper":"真考试卷26","no":15,"type":"单项选择题","q":"执行ARM指令STR R4,[R5],#8后，以下说法正确的是（  ）。","o":["R4的内容改变","R5的内容不变","R5的内容左移了8位","内存或外设中的数据有可能改变"],"a":"D","e":"指令作用为，将R4中保存的数据存到R5对应的地址中，并更新R5保存的地址为R5+8，因此R4的内容并没有改变； R5的内容被改变成R5+8；R5的内容加8而不是左移8位；内存或外设中的数据有可能改变。本题答案为D选项。","code":0},{"id":"1617","paper":"真考试卷26","no":16,"type":"单项选择题","q":"经典ARM程序状态寄存器CPSR格式如下： \n\n如果CPSR=0x00000091,则以下说法正确的是（  ）。","o":["允许外部中断，禁止快速中断，处理器处于快速中断模式","禁止外部中断，允许快速中断，处理器处于快速中断模式","允许外部中断，禁止快速中断，处理器处于普通中断模式","禁止外部中断，允许快速中断，处理器处于普通中断模式"],"a":"B","e":"CPSR最低一字节对应的二进制为：1001 0001，根据CPSR寄存器格式可知：禁止外部中断，允许快速中断，处理器处于快速中断模式。本题答案为B选项。","code":1},{"id":"1618","paper":"真考试卷26","no":17,"type":"单项选择题","q":"以下ARM指令错误的是（  ）。","o":["ADD R3,R3,#1","MOV R2,R4,LSR#2","LDR R4,R5","MOV PC,LR"],"a":"C","e":"LDR指令不可以直接把寄存器的值给另一个寄存器，应使用MOV指令。本题答案啊为C选项。","code":0},{"id":"1619","paper":"真考试卷26","no":18,"type":"单项选择题","q":"在ARM汇编器支持的伪指令，以下说法错误的是（  ）。","o":["EXPORT  Label1声明一个供外部使用的全局标号Label1","IMPORT  Label2引入一个外部标号Label2","ENTRY为汇编语言程序入口","Str DCD  1,2,3,4,5,6,7,8定义变量Str并赋值为1，2，3，4，5，6，7，8，共占用内存8个字节"],"a":"D","e":"D选项中，DCD含义是分配一片连续的字存储单元，因此占用内存为8个字，1字=4字节，即4*8=32个字节。本题答案为D选项。","code":0},{"id":"1620","paper":"真考试卷26","no":19,"type":"单项选择题","q":"设计嵌入式硬件系统的电源电路时常会采用78XX系列芯片，下面是关于78XX系列芯片的叙述，其中错误的是（  ）。","o":["78XX系列芯片是一种DC-DC模块","78XX系列芯片输出电压值与选用芯片型号中“XX”的具体数值有关","78XX系列芯片输入电压值与选用芯片型号中“XX”的具体数值有关","78XX系列芯片是一种典型的LDO"],"a":"D","e":"78XX系列芯片是一种DC-DC模块。78XX系列芯片输出电压值与选用芯片型号中“XX”的具体数值有关；78XX系列芯片输出电压值与选用芯片型号中“XX”的具体数值有关；78XX系列属于普通稳压器，不是LDO（低压差稳压器）。本题答案为D选项。","code":0},{"id":"1621","paper":"真考试卷26","no":20,"type":"单项选择题","q":"下图为典型的嵌入式处理器时钟电路设计方法，下面是结合该图的相关叙述，其中错误的是（  ）。","o":["左图中的Xtal为晶体振荡器","右图中的Clock应采用稳定的时钟信号源","左图中的时钟电路设计方法使用了嵌入式处理器内置的时钟信号发生器","设计嵌入式处理器的时钟电路时，选择的Xtal的频率或者Clock的频率必须保证嵌入式处理器能工作在最高工作频率"],"a":"D","e":"左图中的“Xtal”是晶体的缩写，通常指石英晶体谐振器。它与处理器内部的振荡电路配合，共同构成一个完整的晶体振荡器，为处理器提供时钟信号，A选项叙述正确；右图展示的是使用外部有源时钟源直接驱动处理器。这个外部时钟源的频率和稳定性直接决定了处理器的工作状态，因此必须使用一个稳定、精确的时钟信号源，否则会导致系统工作不稳定甚至出错B选项叙述正确。左图的结构是“外部晶体 + 内部振荡电路”。处理器内部集成了振荡电路（如反相放大器），它利用外部的晶体作为谐振元件来产生时钟信号。这个内部的振荡电路就是“内置的时钟信号发生器”的一部分，C选项叙述正确；在设计时钟电路时，选择的频率必须在处理器规格书规定的工作频率范围之内。这个范围的上限是最高工作频率，但并不意味着“必须”要工作在最高频率。实际工作中，可以根据系统性能需求、功耗要求等因素，选择一个低于最高频率的合适频率。强制工作在最高频率可能会导致功耗过高、发热严重等问题，D选项叙述错误，故本题答案为D选项。","code":0},{"id":"1622","paper":"真考试卷26","no":21,"type":"单项选择题","q":"下面是关于ARM的AMBA的叙述，其中错误的是（  ）。","o":["AMBA是ARM公司定义的总线规范","从AMBA1发布以来，AMBA已经有多个不同的版本","总体而言AMBA由系统总线和外围总线组成","到目前为止，AMBA支持的最大数据宽度为128位"],"a":"D","e":"AMBA是ARM公司定义的总线规范，AMBA已经有多个不同的版本，由系统总线和外围总线组成；AMBA支持的最大数据宽度为1024位，但推荐不要超过256位。本题答案为D选项。","code":0},{"id":"1623","paper":"真考试卷26","no":22,"type":"单项选择题","q":"下面是关于典型嵌入式系统的后向通道的叙述，其中错误的是（  ）。","o":["模拟量输出接口属于典型嵌入式系统的后向通道","开关量/数字量输出接口属于典型嵌入式系统的后向通道","典型嵌入式系统后向通道中的隔离电路用于隔离嵌入式系统与被控系统之间的电气联系，以提高典型嵌入式系统的抗干扰能力","典型嵌入式系统的后向通道采用ADC实现数字量到模拟量的转换"],"a":"D","e":"典型嵌入式系统的后向通道采用DAC实现数字量到模拟量的转换。本题答案为D选项。","code":0},{"id":"1624","paper":"真考试卷26","no":23,"type":"单项选择题","q":"下面是关于典型嵌入式处理芯片生产厂商的叙述，其中错误的是（  ）。","o":["LPC1000系列是恩智浦（NXP）半导体公司（原飞利浦）推出的ARM芯片","TMS320C6A8167是德州仪器公司（TI）推出的ARM芯片","S3C24xx是英特尔公司（Intel）推出的ARM芯片","STM32F4系列是意法半导体公司（ST）推出的ARM芯片"],"a":"C","e":"S3C24xx是Sansung公司推出的基于ARM公司的ARM处理器的芯片。本题答案为C选项。","code":0},{"id":"1625","paper":"真考试卷26","no":24,"type":"单项选择题","q":"下面关于SPI的叙述中，错误的是（  ）。","o":["SPI是一种同步串行外设接口","SPI在嵌入式系统中应用时只能采用一主多从的方式","一般情况下，SPI接口信号中包含低电平有效的从机选择线","SPI可以实现全双工通信"],"a":"B","e":"SPI是一种同步串行外设接口；SPI是一种串行外设接口，除了一主多从的方式，还可以采用一主一从的方式；一般情况下，SPI接口信号中包含低电平有效的从机选择线；SPI可以实现全双工通信。本题答案为B选项。","code":0},{"id":"1626","paper":"真考试卷26","no":25,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线的叙述中，错误的是（  ）。","o":["通过I<SUP>2<\/SUP>C总线传输数据时，不对每次传输的字节数目进行限制","数据线SDA和时钟线SCL 是I<SUP>2<\/SUP>C总线中的信号线","I<SUP>2<\/SUP>C总线是一种串行全双工传输的总线标准","若ARM芯片中内置了I<SUP>2<\/SUP>C总线控制器，则在进行数据通信前，必须先对I<SUP>2<\/SUP>C的有关功能寄存器进行配置"],"a":"C","e":"I<SUP>2<\/SUP>C总线传输数据时，不对每次传输的字节数目进行限制；数据线SDA和时钟线SCL 是I<SUP>2<\/SUP>C总线中的信号线；I2C总线是一种串行、半双工传输总线，而不是全双工传输总线。本题答案为C选项。","code":0},{"id":"1627","paper":"真考试卷26","no":26,"type":"单项选择题","q":"下面关于USB 2.0的叙述中，错误的是（  ）。","o":["USB 2.0采用NRZI编码方式对数据进行编码","USB 2.0采用半双工方式进行通信","USB 2.0采用差分方式传输信息","USB 2.0标准连接器的引脚数和Mini USB连接器的引脚数相同"],"a":"D","e":"USB 2.0采用NRZI编码方式对数据进行编码；USB 2.0采用半双工方式进行通信；USB 2.0采用差分方式传输信息；USB2.0具有4个引脚，MiniUSB具有5个引脚。本题答案为D选项。","code":0},{"id":"1628","paper":"真考试卷26","no":27,"type":"单项选择题","q":"S3C2410内部有时钟振荡电路，在产生时钟信号后，该时钟信号经过主锁相环电路得到更加稳定的锁相后的时钟。在时钟控制器、电源控制器以及USB控制器的控制之下，产生不同需求的时钟信号。在这些时钟信号中，锁相环时钟是（  ）。","o":["MPLL时钟","UPLL时钟","HCLK时钟","PCLK时钟"],"a":"A","e":"A选项中，MPLL时钟是用于CPU及外围器件的锁相环时钟；B选项中，UPLL时钟是专用于USB设备的锁相环时钟；C选项中，HCLK时钟是AHB总线时钟；D选项中，PCLK时钟是APH总线时钟。本题答案为A选项。","code":0},{"id":"1629","paper":"真考试卷26","no":28,"type":"单项选择题","q":"S3C2410的TCNTBn=100，TCMPBn=60，则输出的PWM信号的占空比是（  ）。","o":["100%","60%","40%","0%"],"a":"B","e":"占空比是指TCMPBn占用TCNTBn的百分比，因此结果为60/100为60%。本题答案为B选项。","code":0},{"id":"1630","paper":"真考试卷26","no":29,"type":"单项选择题","q":"下列关于嵌入式系统软件构成部件的术语中，含义最相似的是（  ）。","o":["引导加载程序与板级支持包","内核与中间件","硬件抽象层与板级支持包","设备驱动程序与引导加载程序"],"a":"C","e":"硬件抽象层是介于内核和硬件之间的层次结构，板级支持包是介于硬件及操作系统中驱动程序之间的层次结构，因此二者含义最相似。本题答案为C选项。","code":0},{"id":"1631","paper":"真考试卷26","no":30,"type":"单项选择题","q":"下列关于BSP开发的描述中，不正确的是（  ）。","o":["开发全新BSP通常以操作系统厂商提供的BSP模板为依据","在BSP运行之前，必须确保操作系统的调试工具可用","为了降低BSP调试的复杂度，通常采用渐进的方式进行，将BSP的调试分为最小系统的调试和外围设备驱动程序的调试两步","如果有可能，一般会选择与所支持的硬件平台最相近的参考平台上已经有的BSP，将其移植到新平台上"],"a":"B","e":"板级支持包BSP的运行与操作系统调试工具的可用性并无直接关系。本题答案为B选项。","code":0},{"id":"1632","paper":"真考试卷26","no":31,"type":"单项选择题","q":"下列关于bootloader的陈述中，不正确的是（  ）。","o":["嵌入式系统上电复位后首先运行引导加载程序","有些种类的bootloader能支持多种体系结构的处理器，但每种体系结构有其自身的版本","与处理器体系结构相关的硬件初始化和板级初始化等操作通常都在第一阶段完成","采用从外存储器加载操作系统方式，系统中不需要配置ROM存储器"],"a":"D","e":"从外存中加载操作系统代码运行，仍然需要配置ROM进行程序和数据的保存，仅使用RAM会出现数据丢失的现象。本题答案为D选项。","code":0},{"id":"1633","paper":"真考试卷26","no":32,"type":"单项选择题","q":"下列关于驱动程序的陈述中，不正确的是（  ）。","o":["就软件而言，对硬件设备的访问通过设备接口内的寄存器实现","很多操作系统不允许运行在用户态的应用程序直接访问物理端口，用户的应用程序必须通过驱动程序才能访问硬件","某些操作系统允许用户代码绕过操作系统直接访问硬件","某些操作系统允许驱动程序自行运行而无需被高层软件调用"],"a":"D","e":"驱动程序只能被高层软件调用运行，而不能自行运行。本题答案为D选项。","code":0},{"id":"1634","paper":"真考试卷26","no":33,"type":"单项选择题","q":"下列关于嵌入式系统底层软件的陈述中，不正确的是（  ）。","o":["启动加载模式是嵌入式系统正常工作时的独立启动方式，bootloader从非易失存储介质中引导和运行操作系统代码","BSP中包含硬件相关的设备驱动程序","一种嵌入式操作系统的BSP不可能用于其他嵌入式操作系统","Xenomai是一个规模庞大的开源bootloader软件"],"a":"D","e":"Xenomai 是一种采用双内核机制的Linux 内核的强实时扩展，而不是bootloader软件。本题答案为D选项。","code":0},{"id":"1635","paper":"真考试卷26","no":34,"type":"单项选择题","q":"下列关于实时系统的陈述中，不正确的是（  ）。","o":["实时系统对外界的响应是否正确不仅取决于功能正确性，而且取决于对事件处理的时间正确性","软实时任务通常允许偶尔错过最后期限，但若超过时限才响应，处理任务所进行的操作或者计算结果没有任何意义","硬实时、软实时与准实时的概念与时限的长短没有关系","一个实时系统所要处理的事件通常不止一个，而多个任务的实时性要求各有不同"],"a":"B","e":"软实时任务是指最好是在截止期之前完成的任务，一旦任务执行超过截止期，所得的结果的价值就会减小，而不是没有任何意义。本题答案为B选项。","code":0},{"id":"1636","paper":"真考试卷26","no":35,"type":"单项选择题","q":"下列关于实时操作系统的陈述中，不正确的是（  ）。","o":["实时调度机制的目标是在峰值负载条件下能满足所有任务的时限","实时操作系统可以确定性地满足请求的程度首先取决于它响应中断的速度，其次取决于系统是否具有足够的处理能力在要求的时间内处理所有的请求","对于支持硬实时任务的操作系统而言，系统调用与服务的执行时间都应具有可确定性","对于抢占式内核，在中断服务程序完成后，不等重新返回系统调用就会重新进行任务调度"],"a":"A","e":"实时调度的机制在峰值负载条件下并不能满足所有任务的时限，仍然存在调度延迟。因此通常采用基于优先级的抢占式调度和轮转任务调度以及中程调度相结合的调度策略，既可具有较大的灵活性,又能获得极小的调度延迟。本题答案为A选项。","code":0},{"id":"1637","paper":"真考试卷26","no":36,"type":"单项选择题","q":"下列关于嵌入式操作系统分类的陈述中，正确的是（  ）。","o":["RTEMS是软实时操作系统","eCos是商业嵌入式操作系统","VxWorks和RTEMS都属于可免费获得源码的嵌入式操作系统","QNX和Nucleus都属于硬实时操作系统"],"a":"D","e":"选项A中，RTEMS是一种硬实时操作系统；选项B中，eCos是一种开源的嵌入式实时操作系统；选项C中，VxWorks属于商业嵌入式操作系统，并不属于可免费获得源码的嵌入式操作系统。本题答案为D选项。","code":0},{"id":"1638","paper":"真考试卷26","no":37,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的陈述中，不正确的是（  ）。","o":["用户必须在调用OSStart()启动多任务调度以后再开启时钟节拍器","函数void OSIntEnter(void)在关中断状态下对变量OSIntNesting减1，并在返回前关中断","删除任务的操作将使任务转入休眠状态，不再被内核调度","如果任务在被挂起时正在等待延时，则挂起操作将被取消"],"a":"B","e":"OSIntEnter()函数通常在进入中断前使用，它的作用是对全局变量OSIntNesting增1，代表中断嵌套深度加1。本题答案为B选项。","code":0},{"id":"1639","paper":"真考试卷26","no":38,"type":"单项选择题","q":"下列关于Linux操作系统的陈述中，错误的是（  ）。","o":["Linux是多用户、多任务、支持多线程和多CPU的类Unix操作系统","Linux采用了与Unix相同的宏内核结构","在Linux系统中，内核运行在单独的内核地址空间，系统调用也在内核空间实现","严格来说，Linux并不是操作系统，而是操作系统的一个组成部件。完整的GNU/Linux系统被称为操作系统内核"],"a":"D","e":"准确来说Linux并不是操作系统，而是操作系统内核，而完整的GNU/Linux系统则被称为操作系统。本题答案为D选项。","code":0},{"id":"1640","paper":"真考试卷26","no":39,"type":"单项选择题","q":"嵌入式系统的应用程序开发与通用计算机（PC机）应用程序开发的特点有一些不同，下面所列出的哪一点不是嵌入式系统应用程序开发的特点。","o":["需要固化程序，即把软件代码烧写到非易失性存储器中。","需要使用宿主机-目标机的开发架构。","通常软件开发中的任务涉及许多底层硬件控制程序。","应用程序必须基于嵌入式操作系统平台开发。"],"a":"D","e":"嵌入式应用程序不一定需要基于嵌入式操作系统平台进行开发，也可以在如Windows此类常用的非嵌入式操作系统平台进行开发。本题答案为D选项。","code":0},{"id":"1641","paper":"真考试卷26","no":40,"type":"单项选择题","q":"下面有关嵌入式WEB服务器的应用系统说明中，错误的是（  ）。","o":["嵌入式WEB服务器通常是与目标系统的控制器融为一体的。","基于嵌入式WEB服务器开发的应用主要是提供一种远程操控设备的方式。","嵌入式WEB服务器的应用需求与通用WEB服务器的应用需求是相同的。","嵌入式WEB服务器支持远程客户通过浏览器与其进行交互。"],"a":"C","e":"嵌入式Web服务器与通用Web服务器的应用需求不同，前者需求为远程控制嵌入式系统，后者是通过设立网站放置文件而共享数据。本题答案为C选项。","code":0},{"id":"1663","paper":"真考试卷27","no":1,"type":"单项选择题","q":"下面是关于嵌入式系统的叙述，其中错误的是：","o":["嵌入式系统是一种嵌入在设备(或系统)内部,为特定应用而设计开发的专用计算机系统","嵌入式系统是一种软硬件可裁剪，能适应应用系统对功能、可靠性、成本、体积、功耗等多种约束的专用计算机系统","个人计算机（PC）是一种典型的嵌入式系统","目前，许多控制、监视或协助设备、机器、工厂运行的装置，都是嵌入式系统"],"a":"C","e":"PC指的是Personal Computer，即个人计算机，如台式机、笔记本电脑、平板电脑等都属于个人计算机，通常个人计算机体积较大，功耗较高，与嵌入式系统体积小、功耗低的特征不符。本题答案为C选项.","code":0},{"id":"1664","paper":"真考试卷27","no":2,"type":"单项选择题","q":"下面关于嵌入式系统逻辑组成的叙述中,错误的是：","o":["嵌入式系统由硬件和软件两部分组成","嵌入式系统的硬件主体是中央处理器和存储器","嵌入式系统通过其输入/输出接口和输入/输出设备与外部世界联系","不同嵌入式系统的结构与性能跨度很大，但均使用同一种被称为AMBA的总线规范"],"a":"D","e":"AMBA是ARM公司定义的总线规范，规定了ARM处理器内核与处理器内部各种快速组件的接口标准。而除ARM公司以外，其他公司（如Intel、Apple、IBM等）的嵌入式系统并不是必须要遵循ARM公司的AMBA总线规范。本题答案为D选项.","code":0},{"id":"1665","paper":"真考试卷27","no":3,"type":"单项选择题","q":"CPU的性能主要表现为程序（指令）执行速度的快慢，下面列出了四个因素：\nⅠ.主频    Ⅱ.指令系统    Ⅲ.高速缓冲存储器的容量与结构  Ⅳ.逻辑结构\n能够影响程序（指令）执行速度的因素是：","o":["仅Ⅰ","仅Ⅰ和Ⅱ","仅Ⅱ和Ⅲ","Ⅰ、Ⅱ、Ⅲ和Ⅳ"],"a":"D","e":"程序的执行速度是由程序的指令数量和执行程序所用的时间共同决定的。在其他条件不变的情况下，主频提高，则执行指令的频率就会变快，可以影响程序执行速度；指令系统，举一个例子，如果一个指令系统中没有乘法指令，那么如果要实现乘法就需要执行多条加法指令，但如果有乘法指令，只需要执行一条乘法指令即可，因此指令系统可以显著影响程序执行速度；高速缓冲存储器Cache：Cache是一种速度极快的存储器（与内存相比），它可以保存CPU刚用过或循环使用的一部分数据，这样的话如果CPU需要再次使用该部分数据，可以从Cache中直接调用，从而省去了从内存中调用数据的时间，因此可以减少程序运行的时间，从而影响程序运行的速度；逻辑结构：以CPU的核心数为例，在其他条件不变的情况下，CPU的核心越多，则在相同时间内执行的指令数量就越多，因此可以影响程序的执行速度。本题答案为D选项.","code":1},{"id":"1666","paper":"真考试卷27","no":4,"type":"单项选择题","q":"下面是关于嵌入式系统分类的叙述：\nⅠ.按用途的不同，可以把嵌入式系统分为军用、工业用和民用\nⅡ.按实时性要求的不同，可以把嵌入式系统分为非实时系统、软实时系统和硬实时系统\nⅢ.按产品形态的不同，可以把嵌入式系统分为系统级产品、板级产品和片级产品\nⅣ.按软硬件技术复杂程度的不同，可以把嵌入式系统分为低端系统、中端系统和高端系统\n其中，正确的叙述是：","o":["仅Ⅰ","仅Ⅱ和Ⅲ","仅Ⅰ和Ⅳ","Ⅰ、Ⅱ、Ⅲ和Ⅳ"],"a":"D","e":"概念性题型，按照不同分类加以区分，加强记忆即可。题中Ⅰ、Ⅱ、Ⅲ和Ⅳ描述正确.本题答案为D选项。","code":1},{"id":"1667","paper":"真考试卷27","no":5,"type":"单项选择题","q":"下列字符集编码中，固定采用双字节编码的是：","o":["GB2312","ASCII码","GB18030","UTF-16"],"a":"A","e":"ASCII码采用单字节编码；GB18030采用变长多字节编码；UTF-16采用2-4字节的变长多字节编码。本题答案为A选项。","code":0},{"id":"1668","paper":"真考试卷27","no":6,"type":"单项选择题","q":"下列各缩写中，都属于图像文件格式的是","o":["BMP、M4A、AC3","PGN、WMA、AAC","GIF、TIF、JPEG","MP3、PNG、BMP"],"a":"C","e":"A选项中M4A是MPEG-4标准文件的扩展名，与MP4属于同类，即视频文件格式，AC3是一种音频编码格式；B选项中PGN为错误写法，PNG则是一种图像文件格式，WMA与AAC均是一种音频编码格式；D选项中MP3是最为常见的音频编码格式。本题答案为C选项。","code":0},{"id":"1669","paper":"真考试卷27","no":7,"type":"单项选择题","q":"下列关于数字图像和数字音视频的描述中，正确的是：","o":["GIF是一种有损压缩图像文件格式","音乐的取样频率范围通常在40kHz以上","电话数字语音的频率范围是20~20000Hz","数字图像的位平面数目又称为像素深度"],"a":"B","e":"A选项中GIF是一种无损压缩图像文件格式；C选项中电话数字语音的频率范围在300-3400hz之间，而CD立体声的频率范围在20-20000hz之间；D选项中位平面数目与像素深度是两个概念，位平面数目指的是像素颜色分量的数目，如RGB色彩模式具有三个位平面，而像素深度指的是每个像素用多少个二进制位来表示，如RGB色彩模式的三个位平面的3个颜色分量均用8位二进制表示，则图像的像素深度就是24位，即真色彩图像。本题答案为B选项。","code":0},{"id":"1670","paper":"真考试卷27","no":8,"type":"单项选择题","q":"关于无线通信的说法以下错误的是：","o":["中波主要沿地面传播，绕射能力强","短波具有较弱的电离层反射能力，因此不适用环球通信","微波通信应用非常广泛，个人移动通信系统就是最有代表性的一种应用","无线通信存在易被窃听，易受干扰等缺点"],"a":"B","e":"概念性题型，中波主要沿地面传播，绕射能力强，适用于广播和海上通信；短波具有较强的电离层反射能力，适用于环球通信；超短波和微波的绕射能力较差，只能作为视距或超视距中继通信。本题答案为B选项。","code":0},{"id":"1671","paper":"真考试卷27","no":9,"type":"单项选择题","q":"对于ARMv8之前版本的ARM不同指令集，以下说法错误的是：","o":["ARM指令集编码长度固定为32位","Thumb指令集编码长度为固定16位","Thumb-2指令集的编码既有16位，又有32位","与ARM指令集相比，Thumb-2指令集性能提高38%，密度提高31%"],"a":"D","e":"Thumb-2与ARM指令集相比，性能相同时Thumb-2的代码密度可能缩小31%；Thumb-2与Thumb指令集，代码密度相同时性能可提高38%；故D选项描述错误。本题答案为D选项。","code":0},{"id":"1672","paper":"真考试卷27","no":10,"type":"单项选择题","q":"要设计一个体积小，成本和功耗都要求低，电池供电的简单嵌入式设备，采用以下处理器最佳的是：","o":["ARM Cortex-M4","ARM Cortex-A70","ARM Cortex-R4","ARM Cortex-M0"],"a":"D","e":"分析需求，功耗低，成本低，简单，因此CM0处理器是最好的选择。CM4虽然也可以满足要求，但它比CM0要复杂，功耗和成本也要更高，不是最好的选择。而A系属于高端处理器，R系属于实时处理器，性能方面“供过于求”，并且成本和功耗都相对较高。本题答案为D选项。","code":0},{"id":"1673","paper":"真考试卷27","no":11,"type":"单项选择题","q":"以下不属于32位ARM处理器的是：","o":["ARM Cortex-M3","ARM Cortex-R4","ARM Cortex-A9","ARM Cortex-A57"],"a":"D","e":"Cortex-A57（以及Cortex-A53）属于64位ARM处理器。本题答案为D选项。","code":0},{"id":"1674","paper":"真考试卷27","no":12,"type":"单项选择题","q":"ARM中MMU的功能描述是：","o":["总线错误检测与纠正","指令预取与分支预测","虚拟地址到物理地址的转换","管理多级中断嵌套"],"a":"C","e":"MMU全名Memory Management Unit，即内存管理单元，显然与A选项中总线纠错无关，与B选项中指令预取与分支预测无关，与D选项中中断无关，MMU最主要的功能就是虚拟内存的管理，即管理内存空间在逻辑上的虚拟地址与实体的物理地址的转换。本题答案为C选项。","code":0},{"id":"1675","paper":"真考试卷27","no":13,"type":"单项选择题","q":"小端模式下某32位数据的内存地址为0x0800185A,且R1=0x0800185A则ARM处理器执行LDR R0,[R1]指令后R0=0x480D5180,则以下说法正确的是：","o":["执行LDRB R0,[R1,#1]!后R0=0x00000051","执行LDRH R0,[R1]后R0=0x480D5180","执行LDR R0,[R1,#4]!后R1=0x480D5184","执行LDRB R0,[R1,#2]后R0=0x000D0000"],"a":"A","e":"题中指令将R1视为内存地址，并将该地址保存的数据读取到R0中，且读取到的数据为0x480D5180。A选项，将R1+1视为内存地址，并将该地址保存的1字节数据读取到R0中，然后根据题中的小端模式，可知地址R1对应的1字节数据为0x80，而R1+1对应的1字节数据应为0x51，最后由于R0是32位寄存器，因此高位补0，结果为0x00000051。B选项LDRH是从内存空间读取一个16位的半字数据到寄存器中，因此R0应当是0x00005180。C选项将R1+4当做地址，并在指令执行完毕后更新R1的值，因此R1应当是0x0800185E。D选项与A选项同理，R0保存的是R1+2对应的1字节数据，应为0x0D，即R0是0x0000000D。本题答案为A选项。","
