之一，其中文含义是实时应用接口。故本题选择C。","code":0},{"id":"193","paper":"真考试卷5","no":33,"type":"单项选择题","q":"基于μC/OS-II的嵌入式系统，其软件结构一般具有（  ）。","o":["应用软件层、内核层和设备驱动层等三层","应用软件层、API层、内核层、任务管理层和设备驱动层等五层","应用软件层、API层、内核层和设备驱动层等四层","应用软件层、API层、支撑软件层、内核层和设备驱动层等五层"],"a":"C","e":"基于μC/OS-II的嵌入式系统，其一般具有四层软件结构：最上层是应用软件层，然后是应用程序接口层，内核层，最下面是设备驱动层。故本题选择C。","code":0},{"id":"194","paper":"真考试卷5","no":34,"type":"单项选择题","q":"下面对于Linux内核的叙述，错误的是（  ）。","o":["它为用户进程提供系统调用","Linux内核主要作用包括进程管理与调度、内存管理等","Linux内核通过OS服务组件访问硬件","系统调用是Linux中用户进程与操作系统之间的重要接口"],"a":"C","e":"Linux内核的主要作用是：进程管理与调度、内存管理、文件管理、网络接口和进程间通信。它为用户进程提供了一个虚拟接口（系统调用）。系统调用是Linux中用户进程与操作系统之间的重要接口。而OS服务组件是位于Linux操作系统内核之上的一层服务模块或者实时程序集合。因此C选项错误。故本题选择C","code":0},{"id":"195","paper":"真考试卷5","no":35,"type":"单项选择题","q":"编写μC/OS-II的中断服务子程序主要使用哪种语言（  ）。","o":["汇编语言或C语言","Java语言","PASCAL语言","C++语言"],"a":"A","e":"μC/OS-II中的中断服务子程序主要用汇编语言编写。如果用户使用的编译器支持内嵌汇编，那么可直接将中断服务子程序放在C语言的程序文件中。故本题选择A。","code":0},{"id":"196","paper":"真考试卷5","no":36,"type":"单项选择题","q":"下面的选项中与实时系统无必然联系的属性是（  ）。","o":["可配置性","可预测性","时间约束性","确定性"],"a":"A","e":"实时系统的属性包括可靠性、可预测性、时间约束性和交互性；而可配置性指的是系统可以根据用户的需求进行调整和定制，与实时系统没有必然的联系。故本题选择A。","code":0},{"id":"197","paper":"真考试卷5","no":37,"type":"单项选择题","q":"嵌入式Linux操作系统的组成，不包括（  ）。","o":["用户进程","OS服务组件","Linux内核","编译程序"],"a":"D","e":"嵌入式Linux操作系统主要由用户进程、OS服务组件和Linux内核三大子系统组成。故本题选择D。","code":0},{"id":"198","paper":"真考试卷5","no":38,"type":"单项选择题","q":"Linux内核由若干个子系统组成，一般来说下面哪一个不是Linux内核的子系统（  ）。","o":["内存管理","进程调度","网络接口","终端管理"],"a":"D","e":"Linux内核主要由5个子系统组成：进程调度（SCHED）；内存管理（MM）；虚拟文件系统（VFS）；网络接口（NET）；进程间通信（IPC）。故本题选择D。","code":0},{"id":"199","paper":"真考试卷5","no":39,"type":"单项选择题","q":"在嵌入式系统开发时，有时会利用指令集模拟器来开发、调试相关的嵌入式应用软件。下面有关指令集模拟器的说法中，错误的是（  ）。","o":["指令集模拟器只是在宿主机上运行的纯软件工具","指令集模拟器可以根据目标机指令集的定义生成目标机器指令序列，并仿真运行","指令集模拟器中把目标机处理器硬件逻辑用变量或数据结构表示","指令集模拟器只能采用解释型的方式来仿真运行目标机器指令序列"],"a":"D","e":"指令集模拟器（Instruction Set Simulator, ISS）是在宿主机上模拟应用程序在目标机上运行行为的一个软件工具。指令集模拟器的操作界面与通用机的集成开发环境类似。运行时，它接受编译器或汇编程序生成的目标代码及其指令输入，模仿目标机CPU的取值、译码和执行操作，并将中间执行结果或最终执行结果存入目标机硬件映射数据结构中。调试人员可以在指令集模拟器界面的控制下，通过观察目标机映射寄存器显示框、映射存储器显示框、变量观察窗口等了解目标代码的执行结果。因此，D选项错误。故本题选择D。","code":0},{"id":"200","paper":"真考试卷5","no":40,"type":"单项选择题","q":"在采用ADS1.2集成开发工具软件开发基于ARM微处理器的嵌入式系统软件时，下面有关地址映射的说明中，不正确的是（  ）。","o":["只能通过提供一个scatter格式的配置文件来确定地址映射关系","scatter格式的配置文件是一个文本文件","scatter格式的配置文件描述了连接器进行连接时所需的分组及定位信息等","一个scatter配置文件中通常要描述1个下载时域，以及若干个运行时域"],"a":"A","e":"利用ADS1.2工具来进行地址映射，即在编译连接其工程项目时，有两种方式，即Simple连接类型和Scattered连接类型；在采用Scattered连接类型时，需要提供一个scatter格式的配置文件，该配置文件是一个文本文件，描述ARM连接器在完成连接操作时所需要的分组及定位信息等。一个scatter文件中通常要描述一个下载时域的首地址、域的大小、域的属性，以及若干个运行时域的首地址、域的大小、域的属性、包含的输入段等信息。因此A选项不正确，故本题选择A。","code":0},{"id":"201","paper":"真考试卷6","no":1,"type":"单项选择题","q":"与个人计算机（PC）相比，嵌入式系统具有许多不同的特点。下面不属于嵌入式系统特点的是（  ）。","o":["与具体应用紧密结合，具有很强的专用性","以硬件为主，软件只起辅助作用","软硬件资源往往受到严格的限制","软件大多固化在只读存储器中"],"a":"B","e":"与人们日常使用的个人计算机相比，嵌入式系统具有许多不同的特点。①专用型，嵌入式系统与具体应用紧密结合，具有很强的专用型；②隐蔽性，嵌入式系统通常总是非计算机设备（系统）中的一个部分，它们隐藏在其内部，不为人知；③资源受限，嵌入式系统通常要求小型化、轻量化、低功耗及低成本，因此其软硬件资源受到严格的限制；④高可靠性；⑤实时性；⑥软件固化。综上所述，B选项不属于嵌入式系统的特点。故本题选择B。","code":0},{"id":"202","paper":"真考试卷6","no":2,"type":"单项选择题","q":"嵌入式系统广泛使用微控制器（MCU），下面关于MCU的叙述中错误的是（  ）。","o":["MCU将大部甚至全部计算机硬件电路集成在一块芯片中，它只需很少一些外接电路就可独立工作","使用MCU的嵌入式系统体积小，功耗和成本低，可靠性也高","MCU品种和数量多，应用广泛，它占有嵌入式系统的大部分市场","MCU都是片上系统（SoC）"],"a":"D","e":"嵌入式微控制器（Microcontroller Unit，MCU）实际上是一种单片计算机，简称单片机。将整个计算机硬件的大部分甚至全部电路集成在一块芯片上。微控制器的种类和数量很多，在很多方面得到了广泛应用，目前大约占有嵌入式系统70%的市场。微控制器的最大特点就是单片化，体积减少，从而功耗和成本都下降。而SoC的最大的特点是成功实现了软硬件无缝的结合，它可能包含一个或者多个处理器。所以D选项不正确，故本题答案为D。","code":0},{"id":"203","paper":"真考试卷6","no":3,"type":"单项选择题","q":"按照嵌入式系统的技术复杂程度进行分类，可以把嵌入式系统分为低端系统、中端系统和高端系统三大类。下面关于高端嵌入式系统特性的叙述中错误的是（  ）。","o":["其硬件的核心大多是32位/64位处理器","操作系统功能齐全，大多使用Windows系统","应用软件可更新和扩展","智能手机、路由器等产品中使用的大多是高端嵌入式系统"],"a":"B","e":"按系统的软硬件技术复杂度，嵌入式系统分为低端系统、中端系统和高端系统。其中高端系统采用32/64位处理器，支持网络连接；使用的操作系统功能齐全，软件扩展性好，有良好的用户界面；典型应用有智能手机、掌上电脑、路由器、Google眼镜等。B项Windows系统并非嵌入式操作系统，故本题选择B。","code":0},{"id":"204","paper":"真考试卷6","no":4,"type":"单项选择题","q":"集成电路制造技术是嵌入式系统发展的重要基础，下面关于集成电路技术发展的叙述中，错误的是（  ）。","o":["目前已经可以将数字电路、模拟电路和射频电路等集成在同一芯片上","当前最复杂的CPU芯片所集成的晶体管数目已多达10亿个","当前速度最快的CPU芯片时钟频率已经高达10GHz","微机电系统（MEMS）在芯片上融合了光﹑机﹑电等多种不同类型的构件"],"a":"C","e":"随着电子设计自动化水平的提高和VLSI制造技术的飞速发展，半导体加工已经从微米、亚微米进入到深亚微米的时代，单个芯片上可以集成几亿个甚至几十亿个晶体管，因而能够把计算机或其他一些电子系统的全部电路都集成在单个芯片上，既包含数字电路，也可以包含模拟电路，甚至还能包含数字/模拟混合电路和射频电路。微机电系统在芯片上融合了光、机械、电子等多类不同技术的构件，是集微型传感器、微型执行器、信号处理器、接口、通信电路和电源等于一体的微型器件或者微型系统。当前速度最快的CPU还未达到10GHz， C选项错误，故本题选择C。","code":0},{"id":"205","paper":"真考试卷6","no":5,"type":"单项选择题","q":"数字文本（也称电子文本）是以文字及符号为主的一种数字媒体，下面关于数字文本的有关叙述中，错误的是（  ）。","o":["简单文本仅由字符（包括汉字）的编码所组成，其文件后缀名是.txt","WWW网页是一种典型的超文本","PDF文件格式是电子文档交换与保存的国际标准，它还不是我国的国家标准","数字文本阅读器可以是软件，也可以是一种称为“电子书阅读器”的嵌入式应用产品"],"a":"C","e":"数字文本是以文字以及其他符号为主的一种数字媒体。根据排版格式区分，文本分为纯文本和丰富格式文本。纯文本由一连串字符编码组成，只包含单纯的文字信息。在Windows环境下，txt文档是一种纯文本。相对于线性文本，超文本按着网状结构组织信息。WWW网页是最为常见的超文本。数字文本阅读器可以是软件，也可以是一种称为“电子书阅读器”的嵌入式应用产品。PDF（便携式文件格式）是由Adobe Systems在1993年用于文件交换所发展出的文件格式。它的优点在于跨平台、能保留文件原有格式（Layout）、开放标准，能免版税（Royalty-free）自由开发PDF相容软体，是一个开放标准，2007年12月成为ISO 32000国际标准。所以C选项错误，故本题选择C。","code":0},{"id":"206","paper":"真考试卷6","no":6,"type":"单项选择题","q":"假设数码相机使用的存储卡容量是2GB，数据压缩比平均是4，那么它一次可连续拍摄1600万色（真彩色）的4096 × 3072分辨率的彩色相片大约多少张？","o":["50","100","200","400"],"a":"C","e":"此题主要为数字图像的数据量计算。图像数据量的计算公式如下：图像数据量=图像水平分辨率×图像垂直分辨率×像素深度/8。由此可知，此题中的数码相机一张照片大小为4096×3072×24/（8×4×1024×1024）=9MB，所以可以存储2GB/9MB约等于200张。故本题选择C。","code":0},{"id":"207","paper":"真考试卷6","no":7,"type":"单项选择题","q":"数字视频（及其伴音）在嵌入式系统中使用或在互联网上传输时，其文件格式有多种。下面几种文件格式中不属于数字视频文件格式的是（  ）。","o":[".avi",".mov",".wav",".rmvb"],"a":"C","e":"C项wav是数字音频文件格式。故本题选择C。","code":0},{"id":"208","paper":"真考试卷6","no":8,"type":"单项选择题","q":"路由器用于2个或多个计算机网络的互连，有关路由器IP地址的下列说法中，正确的是（  ）。","o":["网络中的路由器不需要IP地址","网络中的路由器必须人工设置IP地址","网络中的路由器具有两个以上的IP地址","网络中的路由器只能设置一个IP地址"],"a":"C","e":"路由器是用于连接异构网络的设备，工作在网络层，屏蔽不同物理网络的差异，确保异构网络的数据交换顺畅进行。路由器拥有多个输入端口和输出端口，可以连接多个网络，或者多个路由器。一个路由器为每个端口分配一个IP，同一个路由器拥有多个不同的IP地址。转发数据时，路由器按照端口接入的网络号判断。只有C选项正确，故本题选择C。","code":0},{"id":"209","paper":"真考试卷6","no":9,"type":"单项选择题","q":"以下关于嵌入式处理器的说法错误的是（  ）。","o":["哈佛结构是指CPU（运算器与控制器）与存储器的连接只有一套总线","RISC架构是指精简指令集计算机体系结构","ARM处理器采用单周期操作","ARM处理器都采用流水线技术"],"a":"A","e":"哈佛结构是一种将程序指令存储和数据存储分开的存储器结构，是一种并行体系结构，A选项错误；RISC的英文全称是Reduced Instruction Set Computer，中文是精简指令集计算机；单周期操作和指令流水线技术都是ARM处理器的技术特征。故本题选择A。","code":0},{"id":"210","paper":"真考试卷6","no":10,"type":"单项选择题","q":"关于ARM嵌入式处理器的工作状态，以下说法错误的是（  ）。","o":["ARM状态仅支持32位指令编码","Thumb状态仅支持16位指令编码","Thumb-2状态仅支持32位指令编码","ARM状态和Thumb状态是可以相互切换的"],"a":"C","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态，①ARM状态②Thumb/Thumb-2状态③调试状态。ARM状态是ARM处理器工作于32位指令的状态，即32位状态，所有指令均为32位宽度；Thumb状态是ARM执行16位指令的状态，即16位状态在Thumb模式下，指令代码只有16位；Thumb-2状态是ARMv7版本的ARM处理器所具有的新状态，新的Thumb-2内核技术兼有16位及32位指令长度；通过BX指令，ARM状态和Thumb状态是可以相互切换的。综上C选项错误，故本题选择C。","code":0},{"id":"211","paper":"真考试卷6","no":11,"type":"单项选择题","q":"以下关于ARM处理器寄存器说法错误的是（  ）。","o":["CPSR为程序状态寄存器，存放各种标志和状态","SPSR为备份程序状态寄存器","R13为链接寄存器LR","R15为程序计数器PC"],"a":"C","e":"R13是堆栈指针（SP）寄存器，链接（LR）寄存器是R14，C选项错误，故本题选择C。","code":0},{"id":"212","paper":"真考试卷6","no":12,"type":"单项选择题","q":"以下关于ARM处理器说法正确的是（  ）。","o":["32位ARM处理器支持字节，半字，和字三种数据类型","MMU为存储器保护单元，是对存储器进行保护的可选组件","虚拟地址到物理地址映射是MPU的主要功能","WIC为嵌套向量中断控制器"],"a":"A","e":"MMU是Memory Management Unit的缩写，中文名是内存管理单元，它是用来管理虚拟存储器、物理存储器的控制线路，同时也负责虚拟地址映射为物理地址，以及提供硬件机制的内存访问授权；故B选项、C选项错误。嵌套向量中断控制器缩写是NVIC； D选项错误。A选项正确，故本题选择A。","code":0},{"id":"213","paper":"真考试卷6","no":13,"type":"单项选择题","q":"与其它内核相比，关于ARM内核的主要特点，以下说法错误的是（  ）。","o":["功能强大，低功耗设计，RISC结构","全部都是RISC，哈佛结构","功耗低，代码效率高，合作伙伴多","成本低，软件可移植性好，供货源多"],"a":"B","e":"ARM处理器内核与其他处理器内核相比，主要特点有耗电省、功能强、成本低、16位Thumb与32位ARM和Thumb-2双指令集并存以及具有非常众多的合作伙伴；为RISC结构，多数为哈佛结构。B选项错误，故本题选择B。","code":0},{"id":"214","paper":"真考试卷6","no":14,"type":"单项选择题","q":"ARM指令完成的功能是如果清除R7中的bit0,1,5位，正确的指令是（  ）。","o":["ORR R7,R7,#0x00000023","AND  R7,R7,#0xFFFFFFDC","BIC  R7,R7,#0xFFFFFFDC","XOR  R7,R7,#0xFFFFFFDC"],"a":"B","e":"ORR R7,R7,#0x00000023中ORR是按位或，作用是把bit0、1、5 置1，而不是清除，A选项不符合题意；AND R7,R7,#0xFFFFFFDC先把0xFFFFFFDC二进制中的低8位，bit0=0、bit1=0、bit5=0，其余为1，AND指令会让 R7 和掩码按位与，掩码为1的位会保留原数值，掩码为0的位会强制清0，所以这条指令会清除 bit0、1、5，B选项符合题意；BIC R7,R7,#0xFFFFFFDC中BIC指令的规则是掩码中为 1 的位会被清 0，而0xFFFFFFDC中，为1的位是除了 bit0、1、5 之外的所有位，所以这条指令会把 R7 除了 bit0、1、5 之外的所有位都清 0，和题目要求相反，C选项不符合题意；XOR R7,R7,#0xFFFFFFDC中XOR是按位异或，会翻转掩码中为 1 的位，不是清除位，D选项不符合题意；综上所述，本题答案为B选项。","code":0},{"id":"215","paper":"真考试卷6","no":15,"type":"单项选择题","q":"在指令LDR  R3，[R4，#4]！执行后，R4中的值为（  ）。","o":["不变","R4+1","R4+4","4"],"a":"C","e":"LDR  R3，[R4，#4]！是从R4 的值+ 4这个内存地址中，读取4 个字节（32 位） 的数据到寄存器 R3 中；读取完成后，自动把R4+4的结果写回 R4。即R3←［R4+4］、R4←R4+4；故本题选择C。","code":0},{"id":"216","paper":"真考试卷6","no":16,"type":"单项选择题","q":"以下对伪指令的解释错误的是（  ）。","o":["DCB 0xAC；在内存区域分配一个字的内存空间并初始化为0xAC","CODE16；伪指令通知编译器，其后的指令序列为16位的Thumb指令","MyTest EQU 15000；定义一个32位常量MyTest，值为15000","EXPORT伪指令用于在程序中声明一个全局的标号，该标号可在其它的文件中引用"],"a":"A","e":"伪指令在源程序中的作用是为完成汇编程序作各种准备工作，这些伪指令仅在汇编过程中起作用，一旦汇编结束，伪指令的使命就完成。A选项中DCB为数据定义伪指令，用于分配一片连续的字节存储单元，而非一个字，并用伪指令中指定的表达式初始化,A选项叙述错误。CODE16是指示以下指令为16位Thumb指令代码，B选项叙述正确；EQU 表示等值伪指令，作用是将标识符（MyTest）与一个数值绑定，汇编时会把所有出现标识符（MyTest）的地方直接替换为数值（<CODE style='BACKGROUND: none transparent scroll repeat 0% 0%; WHITE-SPACE: normal; COLOR: rgb(0,0,0); PADDING-BOTTOM: 0px; PADDING-TOP: 0px; FONT: 400 16px/24px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace; PADDING-LEFT: 0px; MARGIN: 0px; DISPLAY: inline; PADDING-RIGHT: 0px; flex: 0 1 auto; flex-direction: row; justify-content: normal; align-items: normal'>15000）<\/CODE>，即定义一个32位（注：这里32位不是EQU指定的位数，是在ARM 汇编中，数值常量通常作为32 位数据处理，除非有特殊上下文。15000 是一个普通的整数，定义为 32 位常量是合理的。）常量MyTest，值为15000，C选项叙述正确；EXPORT 伪指令在程序中声明一个全局的标号，该标号可在其它的文件中引用，D选项叙述正确；综上所述，本题答案为A选项。","code":0},{"id":"217","paper":"真考试卷6","no":17,"type":"单项选择题","q":"如果条件为负数，将R1指向的内存单元中8位数据加载到R0寄存器中，正确的ARM指令为（  ）。","o":["LDRPL R0,[R1]","LDRMI R0,[R0]","LDRHMI R1,[R0]","LDRBMI R0,[R1]"],"a":"D","e":"按题目要求需要用到字节数据加载指令LDRB，且寄存器间接寻址，故本题选择D。","code":0},{"id":"218","paper":"真考试卷6","no":18,"type":"单项选择题","q":"在ARM汇编语言程序设计中，经常用到分支程序设计，以下不属于分支指令的是（  ）。","o":["BL LabelSub","BX LabelSub","CBNZ R1,LabelSub","BIC R0,R0,#LabelSub"],"a":"D","e":"ARM汇编包括4条分支指令：B转移指令、BL带返回的转移指令、BLX带返回且带状态切换的转移指令，以及BX带状态切换的转移指令,CBNZ是条件分支指令，当通用寄存器R1的值非零时，执行跳转到LabelSub标签指定的地址。而BIC是位清零指令不属于分支指令，故本题选择D。","code":0},{"id":"219","paper":"真考试卷6","no":19,"type":"单项选择题","q":"下面关于嵌入式处理器时钟信号的叙述中，错误的是（  ）。","o":["嵌入式处理器需要时钟信号才能按照节拍正常工作","大多数嵌入式处理器内置时钟信号发生器","嵌入式处理器不能使用外部振荡源提供时钟信号","可用于产生时钟信号的晶振，有的是无源的、有的是有源的"],"a":"C","e":"目前所有的嵌入式处理器均为时序电路，需要一个时钟信号才能工作，晶振是无极性的，通常分为无源和有源两种；大多数控制器具有晶体振荡器（简称晶振）；但有些场合（如减少功耗、需要严格同步等情况）需要使用外部振荡源提供时钟信号。C选项错误，故本题选择C。","code":0},{"id":"220","paper":"真考试卷6","no":20,"type":"单项选择题","q":"下面是关于AMBA（Advanced Microcontroller Bus Architecture）的叙述： \n    Ⅰ. AMBA有助于开发带有大量控制器和外设的多处理器系统\n    Ⅱ. AMBA规定了ARM处理器内核与处理芯片中快速组件的接口标准\n    Ⅲ. AMBA规定了ARM处理器内核与处理芯片中外围端口及慢速设备接口组件的接口标准\n    Ⅳ. AMBA有多个版本，其总线性能也不断提高\n    上述叙述中，正确的是（  ）。","o":["仅Ⅰ和Ⅱ","仅Ⅱ和Ⅲ","仅Ⅰ和Ⅲ","全部"],"a":"D","e":"AMBA 是ARM公司公布的总线协议，是用于连接和管理片上系统 (SoC) 中功能模块的开放标准和片上互连规范。标准规定了ARM处理器内核与处理器内部高带宽RAM、DMA以及高带宽外部存储器等快速组件的接口标准，也规定了内核与ARM处理器内部外围端口及慢速设备接口组件的接口标准。AMBA有多个版本，性能随版本的发展而逐步提高。叙述全部正确，故本题选择D。","code":1},{"id":"221","paper":"真考试卷6","no":21,"type":"单项选择题","q":"下面关于NOR Flash和NAND Flash的叙述中，错误的是（  ）。","o":["NOR Flash和NAND Flash是目前市场上两种主要的闪存技术","NAND Flash以页（行）为单位随机存取，在容量、使用寿命等方面有较大优势","NOR Flash写入和擦除速度较慢","数码相机存储卡和U盘中的Flash均采用NOR Flash"],"a":"D","e":"NOR Flash和NAND Flash是市场上两种主要的闪存技术；NOR Flash ROM的特点是以字节为单位随机存取，但NOR Flash ROM写入和擦除速度较慢，影响了它的性能。NAND Flash ROM以页（行）为单位随机存取，在容量、使用寿命和成本方面有较大优势。但是它的读出速度稍慢，编程较为复杂，因此大多作为数据存储器使用。数码相机存储卡和U盘中的Flash均采用NANDFlash， D选项错误，故本题选择D。","code":0},{"id":"222","paper":"真考试卷6","no":22,"type":"单项选择题","q":"下面4种嵌入式系统的I/O接口中，哪一种可以实现并行I/O？","o":["GPIO","SPI","UART","I^2C"],"a":"A","e":"四个选项中只有GPIO可以实现并行I/O；SPI 、UART、I<SUP>2<\/SUP>C均是串行工作。故本题选择A。","code":0},{"id":"223","paper":"真考试卷6","no":23,"type":"单项选择题","q":"下图为利用ARM芯片的GPIO引脚连接按键的典型接口。当图中KEY1与KEY2键按下，其他按键均松开时，ARM芯片读到的GPF6~ GPF1的状态为（  ）。","o":["111111","001111","111100","000000"],"a":"C","e":"该电路是一个典型的GPIO按键输入电路，ARM芯片的GPF1至GPF6引脚作为输入引脚。每个按键（KEY1-KEY6）的一端连接到对应的GPIO引脚，另一端连接到地（GND）。当按键被按下时，会将对应的GPIO引脚与地相连，使其电平变为低电平（逻辑'0'）。题目条件为“KEY1与KEY2键按下，其他按键均松开”。KEY1按下与KEY1相连的GPF1 引脚被接地，因此其状态为0。KEY2按下与KEY2相连的GPF2 引脚被接地，因此其状态为0。KEY3, KEY4, KEY5, KEY6 松开，与它们相连的GPF3, GPF4, GPF5, GPF6引脚均通过上拉电阻连接到3.3V，因此它们的状态都为1。将这些状态按GPF6~GPF1的顺序排列，得到的结果是 111100。因此，本题答案为C选项。","code":0},{"id":"224","paper":"真考试卷6","no":24,"type":"单项选择题","q":"8段共阴极LED数码管示意如下图所示，为显示英文字母b，其编码（按dp g f e d c b a的顺序排列）是（  ）。","o":["01111101","01110111","01111100","01111001"],"a":"C","e":"要显示英文字母b，LED数码管 c、d、e、f、g需要亮，仅a、b和dp暗，又是共阴极接法，故本题选择C。","code":0},{"id":"225","paper":"真考试卷6","no":25,"type":"单项选择题","q":"下面关于S3C2410电源管理的叙述中，错误的是（  ）。","o":["电源管理模块具有四种模式","正常模式下，电源管理模式为内核及ARM芯片内部所有硬件组件提供时钟源，用户不能通过软件控制暂时不用的内置硬件组件处于关闭状态以降低功耗","任何情况下复位操作均自动进入正常工作模式","在掉电模式和休眠模式下，只要有任何一个外部中断或RTC时钟中断发生，均将返回到正常模式"],"a":"B","e":"S3C2410的电源管理模块具有正常模式（NORMAL MODE）、慢速模式（SLOW MODE）、休眠模式（IDLE MODE）和掉电模式（POWER_OFF MODE）共四种模式；任何情况下复位操作均自动进入正常工作模式；在掉电模式和休眠模式下，只要有任何一个外部中断EINT［0∶23］或RTC时钟中断发生，也均将返回到正常模式；正常模式下电源管理模式为内核及ARM芯片内部所有硬件组件提供时钟源，即所有设备处于开启状态，因此功耗比较大。用户可以通过软件控制内置硬件组件的开启和关闭，暂时不用的硬件可以关闭以降低功耗。B选项错误，故本题选择B。","code":0},{"id":"226","paper":"真考试卷6","no":26,"type":"单项选择题","q":"下面关于S3C2410中断控制器的叙述中，错误的是（  ）。","o":["中断控制器不支持内置SPI引起的中断","中断控制器支持内置I^2C引起的中断","中断控制器支持内置USB引起的中断","中断控制器支持内置RTC引起的中断"],"a":"A","e":"S3C2410中断控制器支持所有内置硬件各组件的硬件中断，包括24个外部可屏蔽中断EINT0~EINT23以及ADC、RTC、SPI、I2C、UART0/UART1、SDI、USB、DMA0/1/2/3、LCD、WDT、TIMER0/1/2/3、电池错误中断等。A选项错误，故本题选择A。","code":0},{"id":"227","paper":"真考试卷6","no":27,"type":"单项选择题","q":"下面关于S3C2410中UART的叙述中，错误的是（  ）。","o":["芯片内置UART0、UART1和UART2共三个接口","UARTn对应的控制寄存器UCONn用于确定UARTn传输帧的格式","在计算波特率时用到的外部时钟有两种选择，具体选择时由UART的控制器寄存器中的相关位的状态决定","通过对UART的控制器寄存器进行编程可确定每个UART的相关中断是否允许"],"a":"B","e":"S3C2410有三个UART接口UART0、UART1和UART2，其对应的线路控制寄存器为ULCON0、ULCON1和ULCON2，用于确定传输帧的格式；UART的波特率由除数寄存器决定，也取决于外部时钟，还可以是UEXTCLK，由相应控制寄存器决定；通过对UART的控制器寄存器进行编程可确定每个UART的相关中断是否允许； B选项错误，故本题选择B。","code":0},{"id":"228","paper":"真考试卷6","no":28,"type":"单项选择题","q":"下面哪一种接口不是无线通信接口？","o":["GPRS","CAN","蓝牙","WiFi"],"a":"B","e":"A、C、D三项均是无线通信接口，B项的CAN总线是针对实时性要求很强的工业控制领域推出的适应多主系统的有线通信接口，且传输线最好采用双绞线。故本题选择B。","code":0},{"id":"229","paper":"真考试卷6","no":29,"type":"单项选择题","q":"RTOS响应时间的具体指标不包括如下哪一项?","o":["中断延迟时间（Interrupt Latency）","任务切换时间（Task Switching Latency）","进程切换时间（Process Switching Latency）","存储器延迟时间（Memory Latency）"],"a":"D","e":"RTOS响应时间的具体指标是：中断延迟时间（Interrupt Latency）和任务切换时间（Task Switching Latency）。在操作系统中，术语“任务”和“进程”基本上是通用的。故本题选择D。","code":0},{"id":"230","paper":"真考试卷6","no":30,"type":"单项选择题","q":"如下关于TinyOS的说法，正确的是（  ）。","o":["主要用于无线传感器网络的操作系统","属于重量级的操作系统","是QNX公司开发的开放源代码操作系统","TinyOS的技术特点是轻进程、被动消息、对象驱动和组件化编程"],"a":"A","e":"Tiny OS是UC Berkeley开发的开放源代码操作系统，属于深度轻量级的操作系统；专为嵌入式无线传感网络设计，功耗较低，特别适合传感器这种受内存、功耗限制的设备；Tiny OS的技术特点是轻线程、主动消息、事件驱动和组件化编程。故本题选择A。","code":0},{"id":"231","paper":"真考试卷6","no":31,"type":"单项选择题","q":"如下关于μCOS-II/III的说法，正确的是（  ）。","o":["是包含有设备驱动程序和文件系统的小型嵌入式操作系统内核","μCOS-III是开放源代码的免费操作系统","μCOS-II具有良好的可裁剪性和可移植性，能够支持的任务数为32个","任务调度按优先级抢占式调度方式进行"],"a":"D","e":"μC/OS-II/III是小型嵌入式操作系统内核，不含设备驱动程序和文件系统；μC/OS-II是开放源代码的操作系统，而它的升级版μC/OS-III是商用操作系统；μC/OS-II具有良好的可裁剪性和可移植性，能够支持的任务数最多为64；任务按优先级抢占式调度方式进行。所以D选项正确，故本题选择D。","code":0},{"id":"232","paper":"真考试卷6","no":32,"type":"单项选择题","q":"如下关于Android操作系统的说法，正确的是（  ）。","o":["是一种以Linux为基础的完全开放源代码操作系统","主要使用于桌面计算设备","使用不同的软件开发包，则使用的编程语言也可以不同","谷歌公司对基于Android操作系统的第三方软件进行严格把关"],"a":"C","e":"Android（安卓）是一种以Linux为基础的半开放源代码操作系统，主要用于移动便携设备；如果使用不同的软件开发包，则使用的编程语言也不同。谷歌公司不对基于Android操作系统的第三方软件进行严格控制，从而促使第三方应用软件发展迅速。只有C选项正确，故本题选择C。","code":0},{"id":"233","paper":"真考试卷6","no":33,"type":"单项选择题","q":"如下关于QNX操作系统的说法，正确的是（  ）。","o":["它完全遵循POSIX相关各种标准","属于宏内核操作系统","内核提供4种服务：进程调度、进程间通信、底层网络通信和中断处理","进程在非独立的地址空间运行"],"a":"C","e":"QNX是由加拿大QSSL公司（QNX Software System Ltd.）开发的分布式实时操作系统，符合POSIX基本标准和实时标准，使其应用可以方便的进行移植；它具备一个很小的内核，即微内核的操作系统；内核提供4种服务：进程调度、进程间通信、底层网络通信和中断处理。C选项正确，故本题选择C。","code":0},{"id":"234","paper":"真考试卷6","no":34,"type":"单项选择题","q":"如下关于开源操作系统的说法，正确的是（  ）。","o":["能够免费获得源码，起始使用成本较低","获得技术支持比较困难，但维护比较简单","移植过程开发工作量大，但系统可靠性较高","即购即用，且产品研发容易满足工期要求"],"a":"A","e":"开源操作系统具有能够免费获得、成本较低的优点，但是存在获得技术支持困难、配套开发工作量大、系统可靠性低、完工后维护困难的缺点。A选项正确，故本题选择A。","code":0},{"id":"235","paper":"真考试卷6","no":35,"type":"单项选择题","q":"以下各项不属于开源嵌入式操作系统的是（  ）。","o":["μCLinux","RTLinux","μC/OS-II","VxWorks"],"a":"D","e":"VxWorks操作系统属于大型商用操作系统，其余三项均属于开源操作系统，故本题选择D。","code":0},{"id":"236","paper":"真考试卷6","no":36,"type":"单项选择题","q":"以下各项关于微内核（micro kernel）操作系统的说法，正确的是（  ）。","o":["是对单内核做了结构扩展后推出的","内核不包括任务管理、调度器、中断管理和进程间通信模块","内核小巧，传统操作系统内核中的许多部分都被移出内核","进程需要区分内核模式和用户模式服务"],"a":"C","e":"微内核操作系统是对单内核做了结构改进后推出的，在这种操作系统内核机构中，将任务管理、调度器、中断管理和进程间通信模块编译成一个功能精简、空间紧凑的模块，称为微内核；内核小巧，传统操作系统内核中的许多部分都被移出内核，采取服务器方式实现；所有进程请求使用统一接口，进程不需要区分内核模式和用户模式服务。C选项正确，故本题选择C。","code":0},{"id":"237","paper":"真考试卷6","no":37,"type":"单项选择题","q":"以下各项关于引导加载程序的说法，不正确的是（  ）。","o":["引导加载程序对应的英文术语是BIOS","嵌入式系统加电后执行的第一批最初操作称为引导或者自举","引导加载程序会进行内存加电自检和外设存在自检","引导加载程序会进行内存地址映射，初始化外围设备"],"a":"A","e":"嵌入式系统加电后执行的第一批最初操作称为引导或者自举（Boot），对应的程序称为引导程序或者加载程序，其英文术语是Bootloader；引导加载程序主要完成内存加电自检、外设存在自检、内存地址映射、初始化外围设备、内存寻址定位、加载和启动操作系统。A选项错误，故本题选择A。","code":0},{"id":"238","paper":"真考试卷6","no":38,"type":"单项选择题","q":"对于嵌入式Linux而言，Bootloader完成的工作步骤不包括如下哪一项?","o":["初始化处理器及外设的硬件资源配置","建立内存空间的映射关系，将系统的外存和内存地址变换激活","装载操作系统映像到内存","操作系统启动后，配置网卡按预设参数连接互联网"],"a":"D","e":"对于嵌入式Linux而言，Bootloader主要完成的工作步骤如下：①初始化处理器及外设的硬件资源配置；②建立内存空间的映射关系，使能MMU，将系统的外存和内存地址变换激活，为最终调用操作系统内核做好准备；③装载操作系统映像到内存；④对Flash存储器编程；⑤运行操作系统；⑥传递系统启动参数；⑦命令行解析和输入/输出控制。故本题选择D。","code":0},{"id":"239","paper":"真考试卷6","no":39,"type":"单项选择题","q":"下面有关嵌入式系统开发过程的描述语句中，不恰当的是（  ）。","o":["在系统设计阶段应该根据系统需要实现的功能，来综合考虑软硬件功能的划分，确定哪些功能由硬件完成，哪些功能由软件完成。","在系统设计阶段不仅需要描述用户的功能需求如何实现，且需要描述非功能需求（如：功耗、成本、尺寸等）如何实现。","构件设计阶段，设计者需要设计或选择符合系统结构所需要的具体构件。构件通常是指硬件模块，而不包括软件模块。","系统集成与测试阶段，应该每次只对一部分构件或模块所集成的系统进行测试，各部测试完成后，再整体测试。"],"a":"C","e":"系统设计也称为概要设计或总体设计，这个阶段要根据规格说明书中所描述的系统需要实现的功能，确定如何实现这些功能的硬件和软件结构，即哪些功能由硬件完成，哪些功能由软件完成，还必须同时描述非功能上的需求如何实现，即不仅需要描述系统需求如何实现，且必须要符合系统需求中关于处理速度、功耗、成本和其他性能的约束；在构件设计阶段，设计者需要设计或选择符合系统结构和规格说明中所需要的具体构件，既包括硬件也包括软件模块；在系统集成时，应该分步的、按阶段的构建系统，并且每次只对一部分构建或模块所集成的系统进行测试，各部测试完成后，再整体测试。故本题选择C。","code":0},{"id":"240","paper":"真考试卷6","no":40,"type":"单项选择题","q":"下面有关GNU工具套件的描述语句中，不恰当的是（  ）。","o":["GNU是一种常用于开发基于Linux操作系统应用软件的工具套件","GCC是GNU套件中的编译连接器，它能编译C语言、汇编语言编写的程序代码","若要用GDB调试某Linux的应用软件时，编译时需要在命令中加入-g参数","在GDB调试环境下，用run命令来装入需要调试的可执行文件"],"a":"D","e":"GNU是一种常用于开发基于Linux操作系统的嵌入式软件的工具套件；GCC是GNU套件中的编译连接器，它能编译C语言、汇编语言编写的程序代码；设计者要对源程序进行调试，通常需要在GCC命令中加入-g参数；在GDB调试环境下file 命令是装入需要调试的可执行文件，run命令执行当前被调试的程序。故本题选择D。","code":0},{"id":"241","paper":"真考试卷7","no":1,"type":"单项选择题","q":"下列产品中不属于嵌入式系统的是（  ）。","o":["洗衣机","空调机","个人电脑","电子血压计"],"a":"C","e":"广义上讲，凡是带有微处理器的专用软硬件系统都可称为嵌入式系统。狭义上讲，嵌入式系统强调使用嵌入式微处理器构成的具有自己的操作系统和特定功能、用于特定场合的独立系统。嵌入式系统以应用为中心、以计算机技术为基础、软硬件可裁剪、功能、可靠性、成本、体积、功耗严格要求的专用计算机系统。包括洗衣机、空调机等“白色家电”，也包括心电计、血压计等医疗电子设备；而个人电脑（PC机）设计目的是满足广泛的通用计算需求，面向不同用户群体和多样化工作娱乐场景，如专业图形设计、编程开发、大规模数据处理等，并非为特定单一应用场景定制，不符合嵌入式系统以特定应用为中心的特点，不属于嵌入式系统。所以本题选C。","code":0},{"id":"242","paper":"真考试卷7","no":2,"type":"单项选择题","q":"下面关于嵌入式系统的叙述中，错误的是（  ）。","o":["嵌入式系统所涉及的应用领域非常广泛","嵌入式系统在数量上远远超过了各种类型的通用计算机系统","嵌入式系统与通用计算机都是由硬件和软件两部分组成的","嵌入式系统正在逐步取代通用计算机系统"],"a":"D","e":"嵌入式系统与通用计算机一样，也是由硬件和软件两部分组成，所涉及到的领域非常广泛，在应用数量上远远超过了各种类型的通用计算机系统。尽管如此，嵌入式系统与通用计算机系统仍有许多不同之处，它们的组成及功能都各有特点，所以各自的市场不同，谈不上取代。所以本题选D。","code":0},{"id":"243","paper":"真考试卷7","no":3,"type":"单项选择题","q":"数码相机是一种典型的嵌入式系统，下面有关其软硬件组成的叙述中错误的是（  ）。","o":["它由硬件和软件两部分组成","硬件部分既包括CPU，也包括存储器和输入/输出","使用闪存卡（如CF卡、SD卡等）作为内存，用于存储所运行的软件","软件部分既包括操作系统，也包括应用软件"],"a":"C","e":"数码相机是嵌入式系统的典型应用之一。它由前端和后端两部分组成，前端负责数字图像获取，后端负责数字图像的处理，后端通常是以嵌入式DSP作为核心的SoC芯片，DSP用于完成数字图像处理；此外，数码相机中还有一个超低功耗的8位MCU，负责进行操作控制；高端数码相机配置有实时操作系统和图像处理软件。使用的闪存卡主要是用来存储照片而不是系统软件。故C项错误。","code":0},{"id":"244","paper":"真考试卷7","no":4,"type":"单项选择题","q":"微控制器（MCU）是嵌入式系统常用的芯片之一，下面有关微控制器的叙述中错误的是（  ）。","o":["MCU芯片中除CPU外还集成了存储器、总线、定时/计数器、I/O接口等组件","使用MCU后只需增加少量外接电路和硬件就可组成完整的硬件系统","MCU的品种和数量很多，应用非常广泛，占有嵌入式系统的大部分市场","目前MCU停留在4位和8位阶段，32位MCU还很少使用"],"a":"D","e":"嵌入式微控制器（Microcontroller Unit，MCU）实际上是一种单片计算机，简称单片机。它将整个计算机硬件的大部分甚至全部电路集成在一块芯片上，除CPU外还集成了存储器、总线、定时/计数器、I/O接口等组件；与微处理器不同，它只需增加少量外接电路和硬件就可组成完整的硬件系统；微控制器的种类和数量很多，在很多方面得到了广泛应用，目前大约占有嵌入式系统70%的市场。早先的4位主要用于家用电器的控制单元，8位和16位用于一般的控制领域，近年来由于嵌入式系统联网和多媒体信息处理需求的日益增多，32位MCU得到了迅速的发展。故本题选D","code":0},{"id":"245","paper":"真考试卷7","no":5,"type":"单项选择题","q":"一个早期的数码相机只有80万像素，它所拍摄的相片最高分辨率是（  ）。","o":["1600×1200","1024×768","800×600","480×640"],"a":"B","e":"题中所谓的80万像素是指图像的大小，1024×768=768 KB，约为80万，故本题选B。","code":0},{"id":"246","paper":"真考试卷7","no":6,"type":"单项选择题","q":"MP3播放器属于嵌入式系统的应用之一，下面有关叙述中错误的是（  ）。","o":["MP3是互联网上流行的一种数字音乐格式","MP3采用MPEG-3算法对数字音频进行压缩编码","MP3播放器必须具有对MP3格式音频文件解码的功能","MP3音频文件的文件扩展名是.mp3"],"a":"B","e":"MP3是互联网上最流行的数字音乐格式，它采用国际标准化组织提出的MPEG-1层III算法进行有损的压缩编码，以8~12倍的比率大幅度降低了声音的数据量，其文件扩展名是.mp3；MP3播放器必须具有对MP3格式音频文件解码的功能。所以本题选B。","code":0},{"id":"247","paper":"真考试卷7","no":7,"type":"单项选择题","q":"下面哪种设备是组建以太局域网必不可少的？","o":["网桥","集线器或交换机","路由器","中继器"],"a":"B","e":"局域网按照传输介质使用的访问控制方法，可以分为以太网、FDDI网和令牌网，目前广泛使用的是以太网，它以集线器或交换机为中心构成。故本题选B。","code":0},{"id":"248","paper":"真考试卷7","no":8,"type":"单项选择题","q":"以下是有关TCP/IP协议中IP地址格式（IPv4）的叙述，其中错误的是（  ）。","o":["IP地址使用64个二进位表示","IP地址由网络号和主机号两部分组成","IP地址有A类、B类、C类等不同类型之分","具有C类地址的主机连接在小型网络中"],"a":"A","e":"IP协议第4版（IPv4）规定，每个IP地址使用4B（32个二进制位）表示，其中包含有网络号和主机号两部分。IP地址分为A类、B类、C类三个基本类，另有两类分别作为组播地址和备用地址（D类和E类）。C类网络地址数量较多，适用于小规模的局域网络，每个网络最多只能包含254台计算机。所以A项错误，故本题选A。","code":0},{"id":"249","paper":"真考试卷7","no":9,"type":"单项选择题","q":"以下属于按指令集结构划分嵌入式处理器的分类是（  ）。","o":["RISC和CISC","Von Neumann和Harvard","51、AVR、PIC、MSP430、MIPS、POWER MC68K以及ARM等","ARM7、ARM9/ARM11、ARM Cortex-M、ARM Cortex-R和ARM Cortex-A"],"a":"A","e":"嵌入式处理器的体系结构按指令集可以分为两大类：复杂指令集结构（CISC）和精简指令集结构（RISC）。所以本题选A。","code":0},{"id":"250","paper":"真考试卷7","no":10,"type":"单项选择题","q":"相对于其它处理器，ARM处理器主要技术特征，以下说法错误的是（  ）。","o":["单周期操作","采用存储和加载指令访问内存","指令流水线","性能优越但功耗较大"],"a":"D","e":"ARM内核与其他处理器内核相比，主要特点为：耗电省、功能强、成本低、16位Thumb与32位ARM和Thumb-2双指令集并存以及具有非常众多的合作伙伴，适用面广泛。由于采用RISC的体系结构，ARM具有单周期操作、采用加载/存储指令访问内存、指令流水线技术等技术特征。所以本题选D。","code":0},{"id":"251","paper":"真考试卷7","no":11,"type":"单项选择题","q":"关于ARM嵌入式处理器的工作状态，以下说法正确的是（  ）。","o":["ARM状态是32位兼容16位指令的状态","ARM处理器复位时自动进入Thumb状态","ARM9支持Thumb-2状态","Thumb状态为16位指令状态，指令长度全部为16位"],"a":"D","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态，①ARM状态②Thumb状态及Thumb-2状态③调试状态。除支持Thumb-2的ARM处理器外，其他所有ARM处理器都可以工作在ARM状态。ARM状态是ARM处理器工作于32位指令的状态，所有指令均为32位宽度。Thumb状态是ARM执行16位指令的状态；在Thumb模式下，指令代码只有16位。Thumb-2状态是ARMv7版本的ARM处理器所具有的新状态。值得注意的是，ARM处理器复位后开始执行代码时总是处于ARM状态，如果需要则可以切换到Thumb状态及Thumb-2状态。故本题选D。","code":0},{"id":"252","paper":"真考试卷7","no":12,"type":"单项选择题","q":"以下关于ARM处理器寄存器说法正确的是（  ）。","o":["CPSR为程序计数状态寄存器","R12为链接寄存器使用","通用寄存器是32位寄存器，只能存放数据，不能存放地址","堆栈指针SP使用的寄存器为R13"],"a":"D","e":"ARM处理器共有37个寄存器，包括31个通用寄存器（含PC）和6个状态寄存器。所有通用寄存器均为32位结构，既可以存放数据也可以存放地址；CPSR是当前程序状态寄存器；程序链接寄存器（LR）为R14；堆栈指针（SP）使用的寄存器是R13。故本题选D。","code":0},{"id":"253","paper":"真考试卷7","no":13,"type":"单项选择题","q":"以下关于ARM处理器从异常中断返回的说法错误的是（  ）。","o":["恢复原来被保护的用户寄存器","将SPSR寄存器的值复制到CPSR","将异常向量地址写入PC中","清除I和F标志，允许IRQ和FIQ中断"],"a":"C","e":"除复位异常，其他所有异常处理完毕之后必须返回到原来程序处继续向下执行：恢复原来被保护的用户寄存器；将SPSR_mode寄存器值复制到CPSR中；根据异常类型将PC值恢复成断点地址；清除I和F标志，允许IRQ和FIQ中断。故本题选C。","code":0},{"id":"254","paper":"真考试卷7","no":14,"type":"单项选择题","q":"ARM处理器在大端模式下从0x60000000到0x60000003存储一个字数据0x32303134，R2=0x60000000,以下说法正确的是（  ）。","o":["0x60000000中存储的数据是0x32","执行LDRH R1,[R2]后R1=0x3134","执行LDRB R1,[R2]后R1=0x3230","执行LDR R1,[R2]后R1=0x34313032"],"a":"A","e":"所谓的大端模式，是指数据的高位，保存在内存的低地址中，而数据的低位，保存在内存的高地址中。在本题中的存放方式则为：\n\n   内存地址       存放内容\n\n   0x60000000     0x32\n\n   0x60000001      0x30\n\n   0x60000002     0x31\n\n   0x60000003      0x34\n\n   故A项正确。执行LDRH R1,［R2］是将R2指示的存储器中的半字数据读入寄存器R1，并将R1的高16位清零，又因为是大端模式下，所以R1=0x3230；执行LDRB R1,［R2］是将R2指示的存储器中的字节数据读入R1，并将R1的高24位清零，故R1=0x32；执行LDR R1,［R2］是将R2指示的存储器中的字数据读入寄存器R1，故R1=0x32303134。综上，故本题选A。","code":0},{"id":"255","paper":"真考试卷7","no":15,"type":"单项选择题","q":"以下ARM指令中不属于数据处理类指令的是（  ）。","o":["ADC R1,R2,R3","LDR R1,[R2]","MOV R1,R2,LSL#4","ORR R1,R2,R3"],"a":"B","e":"数据处理类指令可分为数据传送指令、算术逻辑运算指令和比较指令。本题A、C、D项均属于数据处理类指令，B项属于加载/存储指令，故本题选B。","code":0},{"id":"256","paper":"真考试卷7","no":16,"type":"单项选择题","q":"以下不能完成将R2中数值的两倍写入R1中的ARM指令是（  ）。","o":["ADD R1,R2,R2","ORR R1,R2,R2","MOV R1,R2,LSL#1","MUL R1,R2,#2"],"a":"B","e":"ADD R1, R2, R2将第二个操作数（R2）和第三个操作数（R2）相加，并将结果存入目标寄存器（R1），即R1 = R2 + R2。因此，这条指令可以完成R2中数值的两倍写入R1的操作；ORR R1, R2, R2将第二个操作数（R2）和第三个操作数（R2）按位进行逻辑“或”运算，并将结果存入目标寄存器（R1），对于任何二进制数，它与自身进行按位逻辑“或”运算，结果仍然是它本身。因此，这条指令执行的是 R1 = R2，而不能把R2中数值的两倍写入R1中；MOV R1, R2, LSL #1将源寄存器（R2）的值逻辑左移（LSL）指定的位数（1位），然后将结果存入目标寄存器（R1）。在二进制运算中，将一个数逻辑左移 1 位相当于将该数乘以 2。因此，这条指令可以完成R2中数值的两倍写入R1的操作；MUL R1, R2, #2它将第二个操作数（R2）和第三个操作数（立即数 2）相乘，并将结果存入目标寄存器（R1），即R1 = R2 * 2。这条指令可以完成R2中数值的两倍写入R1的操作；综上所述，B选项的指令不能题目的要求，故本题答案为B选项。","code":0},{"id":"257","paper":"真考试卷7","no":17,"type":"单项选择题","q":"将寄存器R1中指定的bit7和bit3位清除、其它位保持不变的ARM指令是（  ）。","o":["ORR R1,R1,#0x00000088","AND R1,R1,#0x00000088","BIC R1,R1,#0x00000088","TST R1,R1,#0x00000088"],"a":"C","e":"将寄存器中指定位清零可使用位清零指令BIC完成，也可以通过与指令将指定位与零按位相与完成，故本题选C 。","code":0},{"id":"258","paper":"真考试卷7","no":18,"type":"单项选择题","q":"在ARM汇编语言程序设计中常有子程序设计，下面指令中不属于子程序调用或者返回的指令是（  ）。","o":["LDR PC,MySub","BL MySub","MOV PC,LR","MOV R15,LR"],"a":"A","e":"在ARM汇编语言程序中，子程序的调用一般是通过BL指令来实现的；MOV PC,LR在ARM汇编中用于子程序的返回；D项中R15即是PC，故本题选A。","code":0},{"id":"259","paper":"真考试卷7","no":19,"type":"单项选择题","q":"关于ARM指令中的条件域，以下表述错误的是（  ）。","o":["EQ为相等","CS为无符号数大于或等于","VS为未溢出","LS为无符号数小于或等于"],"a":"C","e":"C项中VS表示溢出，故本题选C。其余三项正确。","code":0},{"id":"260","paper":"真考试卷7","no":20,"type":"单项选择题","q":"下面关于嵌入式处理芯片生产厂商的叙述中，错误的是（  ）。","o":["基于ARM7TDMI内核的S3C44B0嵌入式处理器由韩国三星（Samsung）公司生产","基于ARM7TDMI-S内核的LPC2000系列嵌入式处理器由荷兰恩智浦（NXP）半导体司司生产","美国英特尔（Intel）公司未生产过基于ARM的嵌入式处理器","美国爱特美尔（ATMEL）公司和飞思卡尔（Freescale）公司都生产多个系列的基于ARM内核的嵌入式处理器芯片"],"a":"C","e":"生产ARM处理器芯片的厂家众多，每个厂商生产的ARM芯片型号各异，除了内核架构外，其内置硬件组件也各有特色，性能也有差异。基于ARM7TDMI内核的S3C44B0嵌入式处理器由韩国三星（Samsung）公司生产；基于ARM7TDMI-S内核的LPC2000系列嵌入式处理器由荷兰恩智浦（NXP）半导体公司生产；美国爱特美尔（ATMEL）公司和飞思卡尔（Freescale）公司都生产多个系列的基于ARM内核的嵌入式处理器。故本题选C。","code":0},{"id":"261","paper":"真考试卷7","no":21,"type":"单项选择题","q":"嵌入式系统工作时需要为其供电，下面与嵌入式系统供电相关的叙述中，错误的是（  ）。","o":["78XX系列是一类常用的直流稳压芯片，例如7805可以提供+5V直流电压","低压差稳压器常简称为LDO","AC-DC电源模块用于实现交流电到直流电的变换","低压交流电可以直接用来给嵌入式处理器供电"],"a":"D","e":"嵌入式系统常用的电源模块是交流变直流（AC-DC）模块、直流到直流（DC-DC）模块以及低压差稳压器（LDO）。AC-DC模块完成交流电到直流电的变换。78XX系列是一类常用的直流稳压芯片，例如7805可以提供+5V直流电压。选项中D项错误，故本题选D。","code":0},{"id":"262","paper":"真考试卷7","no":22,"type":"单项选择题","q":"下面关于ARM公司定义的AMBA的叙述中，错误的是（  ）。","o":["AMBA由系统总线和外围总线组成，二者之间通过桥接器交换信息","ARM芯片中的ARM内核与AMBA的系统总线相连","ARM芯片中的测试接口（如JTAG）与AMBA的外围总线相连","ARM7和ARM11采用的AMBA的版本不同"],"a":"C","e":"AMBA 是ARM公司公布的总线协议，以ARM内核为基础的嵌入式处理器芯片采用系统总线与外围总线两层结构的方式构建片上系统；系统总线通过桥接器与外围总线互连。AMBA的系统总线主要用于连接高带宽快速组件，包括ARM内核及测试接口；AMBA的外围总线主要连接低带宽组件以及与外部相连的硬件组件。AMBA有多个版本，性能随版本的发展而逐步提高，ARM7采用AMBA1，而ARM9采用AMBA2。故本题选C。","code":0},{"id":"263","paper":"真考试卷7","no":23,"type":"单项选择题","q":"下面是关于基于ARM内核的嵌入式芯片中的DMA控制器的叙述，其中错误的是（  ）。","o":["DMA是指直接存储器访问","嵌入式系统通过使用DMA控制器可降低处理器内核在数据传输操作中的负担","ARM处理器中的DMA控制器与AMBA的系统总线部分相连","ARM处理芯片中的串行通信接口、USB接口等，只能通过DMA控制器控制其数据传输而不能由ARM内核控制"],"a":"D","e":"ARM内部的DMA控制器（直接存储器访问控制器）是一种硬件组件，使用它可以将数据块在内存与外设以及内存与内存之间互相传送，且传输过程不需要 CPU参与，可显著降低处理器负荷；DMA主控制器与AMB的系统总线部分相连；在ARM处理芯片中，许多与外部打交道的通道如串行通信端口、USB接口等既可以由ARM内核控制其数据传输，也可以通过DMA控制器控制数据传输。故本题选D。","code":0},{"id":"264","paper":"真考试卷7","no":24,"type":"单项选择题","q":"微硬盘是一种由超小型笔记本和数码相机领域发展而来的外部存储设备，下面关于微硬盘的叙述中，错误的是（  ）。","o":["目前1.8英寸的微硬盘容量已达几百GB","带有数据缓存，有利于提高数据传输率","采用USB接口时，一般须另加外部电源","为使微硬盘适用于多种手持装置，其接口可采用多种标准，如CF卡、PCMCIA、USB 2.0、ATA等"],"a":"C","e":"微硬盘最早是由IBM公司开发的一款超级迷你硬盘机产品。目前1.8英寸的微硬盘容量已达几百GB；一般微硬盘带有数据缓存，有利于提高数据传输率；微硬盘功耗极小，无需外置电源，链接USB即可使用；为使微硬盘适用于多种手持装置，其接口可采用多种标准，如CF卡、PCMCIA、USB 2.0、ATA等。所以选本题C。","code":0},{"id":"265","paper":"真考试卷7","no":25,"type":"单项选择题","q":"下面是关于基于ARM内核的嵌入式芯片中的存储器及高带宽外部存储器控制接口的叙述，其中错误的是（  ）。","o":["ARM芯片片内配有的Flash存储器，通常用作系统的程序存储器","ARM芯片内的Cache采用SRAM","高带宽外部存储器控制接口只能用于扩展系统的程序存储器","高带宽外部存储器控制接口与AMBA的系统总线部分相连"],"a":"C","e":"ARM芯片片内配有的Flash存储器，通常用作系统的程序存储器；其内部Cache一般采用SRAM；高带宽外部存储器控制接口为外部存储器扩展提供了接口，可以扩展程序存储器和数据存储器，与AMBA的系统总线部分相连。所以本题选C。","code":0},{"id":"266","paper":"真考试卷7","no":26,"type":"单项选择题","q":"某型NAND Flash芯片的地址线和数据线是复用的，它具有的部分引脚为ALE、CE、RE、R/B，如果下面每一个选项是用于简述这些引脚的功能的，其中完全正确的是（  ）。","o":["低电平有效的芯片使能、命令锁存允许、准备就绪/忙输出、读使能/写使能","命令锁存允许、低电平有效的写保护、低电平有效的芯片使能、地址锁存允许","地址锁存允许、低电平有效的芯片使能、低电平有效的读使能、准备就绪/忙输出","准备就绪/忙输出、低电平有效的读使能、低电平有效的写使能、命令锁存允许"],"a":"C","e":"NAND Flash主要用于片外程序存储器，为了节省引脚，降低体积，地址线和数据线一般采用分时复用技术。ALE、CE、RE、R/B分别表示地址锁存允许、低电平有效的芯片使能、低电平有效的读使能、准备就绪/忙输出。故C项正确。","code":0},{"id":"267","paper":"真考试卷7","no":27,"type":"单项选择题","q":"通过 I<SUP>2<\/SUP>C、SPI、UART、USB等可以实现嵌入式系统间或嵌入式系统与外围器件等的连接，下面相关叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C总线只有两条信号线，一条是数据线SDA，另一条是时钟线SCL，所有操作都通过这两条信号线完成","SPI通信时，首先要使SPI从设备的SSEL处于被选中状态，表示将要对该从设备进行操作，然后才能按照SPI时序要求进行数据操作","UART即通用异步收发器，可用于全双工串行异步通信","USB 1.1和USB 2.0采用全双工差分方式进行通信"],"a":"D","e":"I<SUP>2<\/SUP>C总线只有两条信号线，一条是数据线SDA，另一条是时钟线SCL，所有操作都通过这两条信号线完成；对SPI的操作，首先要选择让基于SPI接口的从设备的SSEL处于被选中状态，表示将要对该从设备进行操作，然后才能按照SPI时序要求进行数据操作；UART即通用异步收发器，是可以用于全双工串行异步通信的；USB 1.1和USB 2.0有4根信号线，采用半双工差分方式进行通信。故本题选D。","code":0},{"id":"268","paper":"真考试卷7","no":28,"type":"单项选择题","q":"下面关于嵌入式系统中常用的简单输入设备和简单输出设备的叙述中，正确的是（  ）。","o":["键盘的按键数相同时（例如16个按键），线性键盘接口需要的I/O引脚比矩阵键盘接口需要的I/O引脚少","为方便输入，采用电容式触摸屏时，一般需专用的硬笔","LED发光二极管驱动方便，与ARM芯片连接时仅需一根GPIO引脚与其直接相连即可，不需其他相关的驱动电路","LED数码管由多个LED组成，这些LED有共阳极接法和共阴极接法两种"],"a":"D","e":"线性键盘是指一个按键占用一个引脚，利用读引脚状态确定按键的状态；矩阵键盘采用行列矩阵形式构件键盘，利用行扫描法或反转法读取按键的特征值来决定按键的结果；故相同按键数的键盘，线性键盘需要的引脚数目多于矩阵键盘，故A错误。用专用硬笔写字的触摸屏属于电阻式，故B错误。LED发光与ARM芯片连接时仅需一根GPIO引脚，但绝对不能直接把引脚链接到发光二极管上，因为通常ARM芯片GPIO引脚提供的电流是有限的，不能直接驱动发光设备，因此要加驱动电路，故C项错误。D项表述正确，本题选D。","code":0},{"id":"269","paper":"真考试卷7","no":29,"type":"单项选择题","q":"下面关于嵌入式系统的互连通信接口的叙述中，错误的是（  ）。","o":["嵌入式处理器的UART在采用了RS-232电平转换电路后，可延长通信距离","与RS-485标准相比，RS-232标准的通信距离更远、通信速率更高","对于片内无CAN控制器的嵌入式处理芯片，可通过扩展CAN控制器和CAN收发器的方式使其接入CAN总线","嵌入式系统可以通过以太网连接到互联网中"],"a":"B","e":"直接用UART进行通信仅限于板间或芯片间通信， UART在采用了RS-232电平转换电路后，可延长通信距离；与RS-232标准相比，RS-485标准的通信距离更远、通信速率更高；对于片内无CAN控制器的嵌入式处理芯片，可通过扩展CAN控制器和CAN收发器的方式使其接入CAN总线；嵌入式系统可以通过以太网连接到互联网中。故B项错误，故本题选B。","code":0},{"id":"270","paper":"真考试卷7","no":30,"type":"单项选择题","q":"下面关于硬实时系统和软实时系统的叙述中，错误的是（  ）。","o":["如果任务执行时间超过截止时间后系统的效益变为负，这种实时系统称为硬实时系统","如果任务执行时间超过截止时间后系统的效益下降但仍保持为正，这种实时系统称为软实时系统","导弹控制器属于硬实时系统","高铁自动驾驶系统属于软实时系统"],"a":"D","e":"任任务执行时间超过截止时间，系统的总损益就为负，这一种实时系统称为硬实时系统，否则为软实时系统。硬实时（Hard Real-Time）系统的运行正确性是同其响应时限紧密相关的。一旦超过时限将导致严重的负效益后果，如导弹控制系统、高铁自动驾驶系统等。然而，在一个软实时（Soft Real-Time）系统中，虽然也存在时限指标，但是如果输出响应超过时限，一般不会造成严重后果。故D项错误，本题选D。","code":0},{"id":"271","paper":"真考试卷7","no":31,"type":"单项选择题","q":"目前流行的嵌入式操作系统有多个，下面不属于嵌入式操作系统的是（  ）。","o":["μCOS-II/III","VxWorks","Win7","Android"],"a":"C","e":"很明显，四个选项中仅C项不属于嵌入式操作系统，Win7属于多任务桌面操作系统。故本题选C。","code":0},{"id":"272","paper":"真考试卷7","no":32,"type":"单项选择题","q":"下面有关微内核操作系统的叙述中，错误的是（  ）。","o":["操作系统的内核小巧、紧凑，占用内存少","内核的功能扩充方便，但功能切换需要一定的开销","μC/OS-II属于微内核操作系统","iOS不属于微内核操作系统"],"a":"D","e":"嵌入式操作系统按照内核结构可以分为单内核操作系统跟微内核操作系统；其中微内核操作系统的内核小巧、紧凑，占用内存少；内核的功能扩充方便，但功能切换需要一定的开销；属于微内核结构的典型嵌入式操作系统有Symbian、VxWorks、QNX、μC/OS-II、iOS等。故D项错误，本题选D。","code":0},{"id":"273","paper":"真考试卷7","no":33,"type":"单项选择题","q":"下列程序中通常不属于板级支持包（BSP）内容的是（  ）。","o":["初始化程序","设备驱动程序","引导加载程序","进程管理程序"],"a":"D","e":"BSP实际上一些汇编程序和C语言代码相结合的操作系统底层软件。包括初始化程序、设备驱动程序、配置文件和引导加载程序等。D项不属于BSP内容，本题选D。","code":0},{"id":"274","paper":"真考试卷7","no":34,"type":"单项选择题","q":"下面关于引导加载程序（Bootloader）的叙述中，错误的是（  ）。","o":["引导加载程序执行嵌入式系统加电后的第一批操作","引导加载程序的一项重要任务是加载和启动操作系统","加电自检和初始化外围设备也是引导加载程序需要完成的任务","相同的操作系统都使用相同的引导加载程序"],"a":"D","e":"嵌入式系统加电后执行的第一批最初操作称为引导或者自举（Boot），对应的程序称为引导程序或者加载程序，其英文术语是Bootloader；引导加载程序主要完成内存加电自检、外设存在自检、内存地址映射、初始化外围设备、内存寻址定位、加载和启动操作系统。由于硬件平台的不同，每种平台的引导程序也有所差异。故本题选D。","code":0},{"id":"275","paper":"真考试卷7","no":35,"type":"单项选择题","q":"下面关于Linux和Unix的叙述中，错误的是（  ）。","o":["Linux是以Unix为原型的一种\"类Unix\"操作系统","两者的函数/命令的名称、参数和功能大体相同","两者的源代码基本相同","Unix的运行效率一般高于Linux"],"a":"C","e":"Linux系统最初以Unix为原型，以实现POSIX标准作为其目标；命令的功能、处理结果、函数名称和参数十分相同，但二者的源代码是完全不同的；迄今为止，Linux的运行效率尚未达到Unix的水平。C选项错误，故本题选C。","code":0},{"id":"276","paper":"真考试卷7","no":36,"type":"单项选择题","q":"嵌入式Linux操作系统由用户进程、OS服务组件和Linux内核3个部分组成（如图），下面选项中正确的是（  ）。","o":["①是用户进程，③是服务组件","①是服务组件，②是用户进程","②是服务组件，③是Linux内核","②是用户进程，③是Linux内核"],"a":"C","e":"从顶视图看，嵌入式Linux操作系统由用户进程、OS服务组件和Linux内核3个子系统组成。故题中从上到下依次是用户进程、OS服务组件和Linux内核。故本题选C。","code":0},{"id":"277","paper":"真考试卷7","no":37,"type":"单项选择题","q":"Linux内核主要由5个子系统组成，下面选项中不属于这5个子系统的是（  ）。","o":["内存管理","进程间通信","行命令解释器（Shell）","文件系统"],"a":"C","e":"Linux内核主要由5个子系统组成：进程调度；内存管理；虚拟文件系统；网络接口；进程间通信。故本题选C。","code":0},{"id":"278","paper":"真考试卷7","no":38,"type":"单项选择题","q":"下面是关于μC/OS-II任务管理中空闲任务（Idle task）的叙述，其中错误的是（  ）。","o":["它是系统创建的第1个任务","它是优先级最低的任务","它始终处于等待状态","它是必不可少的一个系统任务"],"a":"C","e":"μC/OS-II任务管理中空闲任务（Idle task）是系统创建的第1个任务，它是必不可少的一个系统任务，也是优先级最低的任务；绝大多数情况下，μC/OS-II的每个任务都是一个无限的循环，都处在5种状态之一的状态下。故C项错误，本题选C。","code":0},{"id":"279","paper":"真考试卷7","no":39,"type":"单项选择题","q":"下面有关片上调试技术的描述语句中，不恰当的是（  ）。","o":["边界扫描技术是调试硬件芯片及目标机电路板的一种常用调试技术。","JTAG组织所研究的测试访问端口和边界扫描结构标准，成为了片上测试技术的一种国际标准，即俗称的JTAG标准。","使用片上调试技术进行嵌入式系统目标机调试时，无需目标存储器，也不占用目标机任何I/O端口。","经常用于嵌入式系统设计中的微处理器（如：MCS-51、DSP、ARM）都支持JTAG标准的片上调试技术"],"a":"D","e":"边界扫描测试技术是对芯片或印制电路板进行片上调试最常用的一种技术；JTAG是IEEE下的一个组织，是研究测试访问端口和边界扫描结构的标准，研究结果即俗称的JTAG标准；使用JTAG 进行嵌入式系统的调试，无需目标存储器，也不占用目标机任何I/O端口；对于不支持JTAG调试标准的嵌入式CPU，如MCS-51单片机，其软件固化要使用称为“编程器”的设备来进行。故本题选D。","code":0},{"id":"280","paper":"真考试卷7","no":40,"type":"单项选择题","q":"下面的叙述中，不正确的是（  ）。","o":["在嵌入式系统开发时，通常可以把其开发过程划分为：系统需求分析与规格说明、系统设计、构件设计、系统集成与测试等几个阶段。","所谓的构件设计，是指包括软件设计与编程、专用硬件芯片选择及硬件电路设计等具体设计工作。","系统集成与测试的目的是发现设计中的错误并进行改正。在此阶段，应该等系统集成完成后再整体地对系统进行测试。","嵌入式系统设计者需要遵循软硬一体、软硬协调设计的思想。在系统功能满足要求的前提下，结合性能、费用成本、尺寸等约束条件，确定哪些功能由硬件构件实现，哪些功能由软件构件实现。"],"a":"C","e":"在嵌入式系统开发时，通常可以把其开发过程划分为：系统需求分析与规格说明、系统设计、构件设计、系统集成与测试等几个阶段；嵌入式系统设计者需要遵循软硬一体、软硬协调设计的思想。在满足系统功能的前提下，结合性能、费用成本、尺寸等约束条件，确定哪些功能由硬件构件实现，哪些功能由软件构件实现；所谓的构件设计，是指包括软件设计与编程、专用硬件芯片选择及硬件电路设计等具体设计工作；一个好的系统集成与测试计划可以帮助设计者快速的发现设计中的错误并改正，但应该分步的、按阶段的构建系统，并且每次只对一部分构建或模块所集成的系统进行测试，这样更容易的发现并定位错误。故本题选C。","code":0},{"id":"281","paper":"真考试卷8","no":1,"type":"单项选择题","q":"下列产品中不属于嵌入式系统的是（  ）。","o":["有线电视机顶盒","服务器","电饭煲","路由器"],"a":"B","e":"广义上讲，凡是带有微处理器的专用软硬件系统都可称为嵌入式系统。狭义上讲，嵌入式系统强调那些使用嵌入式微处理器构成的具有自己的操作系统和特定功能、用于特定场合的独立系统。嵌入式系统以应用为中心、以计算机技术为基础、软硬件可裁剪、功能、可靠性、成本、体积、功耗严格要求的专用计算机系统。选项中A、C、D均属于嵌入式系统；而服务器是网络环境中的高性能计算机，不属于嵌入式系统。所以本题选B。","code":0},{"id":"282","paper":"真考试卷8","no":2,"type":"单项选择题","q":"下面关于嵌入式系统逻辑组成的叙述中，错误的是（  ）。","o":["嵌入式系统由硬件和软件两部分组成","嵌入式系统硬件的主体是中央处理器(CPU)和存储器","嵌入式系统的CPU比通用计算机简单得多，它们都是8位字长的处理器","嵌入式系统通过输入/输出(I/O)接口和输入/输出设备与外部世界进行联系"],"a":"C","e":"嵌入式系统与通用计算机一样，也由硬件和软件两部分组成。硬件的主体是CPU和存储器，它们通过I/O接口和I/O设备与外部世界联系。现在嵌入式系统中使用最多的还是8位和16位CPU，但32位是技术发展的主流。故本题选C。","code":0},{"id":"283","paper":"真考试卷8","no":3,"type":"单项选择题","q":"按照软硬件技术的复杂程度嵌入式系统分为低端系统、中端系统和高端系统三大类，下面有关低端系统的叙述中错误的是（  ）。","o":["硬件大多采用4位或8位单片机","由监控程序对系统进行控制，不使用操作系统","家用洗衣机、吸尘器、电磁炉等属于低端嵌入式应用系统","它们正在被32位的高端系统所取代"],"a":"D","e":"嵌入式系统的分类有多种。按系统的软硬件技术复杂度，嵌入式系统分为低端系统、中端系统和高端系统。其中低端系统硬件大多采用4位或8位单片机，不使用操作系统，由监控程序对系统进行控制，在工控领域和白色家电领域占主导地位。选型中D项表述错误，故本题选D。","code":0},{"id":"284","paper":"真考试卷8","no":4,"type":"单项选择题","q":"片上系统（SOC或SoC）是目前广泛使用的一种嵌入式处理芯片，下面有关叙述中错误的是（  ）。","o":["SoC是电子设计自动化水平提高和大规模集成电路制造技术发展的成果","SoC芯片既包含处理器又包含存储器，既有数字电路也有模拟电路，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能","SoC已成为集成电路设计的发展趋势， 32位嵌入式处理芯片大多是SoC","智能手机已经广泛采用SoC，平板电脑大多还使用传统的Intel处理器"],"a":"D","e":"随着电子设计自动化水平的提高和VLSI制造技术的飞速发展，半导体加工已经从微米、亚微米进入到深亚微米的时代，单个芯片上可以集成几亿个甚至几十亿个晶体管，因而能够把计算机或其他一些电子系统的全部电路都集成在单个芯片上，这种芯片就是所谓的片上系统。SoC芯片中既包含数字电路，也可以包含模拟电路，甚至还包含数字/模拟混合电路和射频电路。由于SoC将嵌入式系统的几乎全部功能都集成在一块芯片中，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能。目前，大多数32位的嵌入式处理芯片均为SoC，SoC已经成为集成电路设计的主流发展趋势。D选项中平板电脑使用的也是SOC技术，故本题选D。","code":0},{"id":"285","paper":"真考试卷8","no":5,"type":"单项选择题","q":"一幅没有经过数据压缩的彩色图像，其数据量是768KB，分辨率为1024×768,那么它每个像素的像素深度是（  ）。","o":["24位","16位","12位","8位"],"a":"D","e":"数字图像数据量=分辨率×像素深度÷8，故本题像素深度=8×数字图像数据量/分辨率=768KB×8÷(1024×768)=768B×1024×8/(1024×768)=8位，故本题选D。","code":0},{"id":"286","paper":"真考试卷8","no":6,"type":"单项选择题","q":"获取数字声音的过程中必须进行“取样”、“量化”等处理。下面关于“量化”的叙述中错误的是（  ）。","o":["量化就是把声音样本的模拟量转换成数字量来表示","量化过程往往也称为D/A转换","量化位数增多，量化的精度可以提高，声音的保真度也更好","量化位数越少，数字声音的数据量也越少"],"a":"B","e":"音频信息数字化的过程是取样、量化、编码。其中量化是把每个样本的模拟值转换成数字量来表示，因此量化过程往往也称为A/D转换（模数转换）。量化位数增多，量化的精度可以提高，声音的保真度也更好，量化位数越少，数字声音的数据量也越少。故本题选B。","code":0},{"id":"287","paper":"真考试卷8","no":7,"type":"单项选择题","q":"局域网是计算机网络中最流行的一种形式。下面有关局域网的叙述中错误的是（  ）。","o":["局域网指较小地域范围内的计算机网络，它有多种类型","局域网通常为一个单位所拥有，自建自管","它主要使用光缆进行连网和数据通信","局域网数据传输速率高，延迟时间短，误码率低"],"a":"C","e":"局域网的地域范围较小，往往属于一个单位所有，由单位自建自管，具有多种类型。局域网使用专门铺设的传输介质进行联网和数据通信，数据传输速率高，延迟时间短，误码率低。故本题选C。","code":0},{"id":"288","paper":"真考试卷8","no":8,"type":"单项选择题","q":"以下关于互联网IP地址的叙述中，错误的是（  ）。","o":["正在上网（online）的每一台终端设备都有一个IP地址","现在广泛使用的IPv4协议规定IP地址使用32个二进位表示","IPv4规定的IP地址快要用完了，取而代之的将是64位的IPv5","许多设备的IP地址是动态分配的而非固定不变的"],"a":"C","e":"IP协议第4版，简称IPv4规定，每个IP地址使用32个二进制位表示，其中包含网络号和主机号两部分，每个正在上网的终端设备都有一个IP地址，许多设备的IP地址是动态分配的而非固定不变的。由于IPv4中地址长度仅为32位，只有大约36亿个地址可用。2011年年初国际组织ICANN宣布地址已全部分配完毕，新的第6版IP协议IPv6已把地址长度扩展到128位。故本题选C。","code":0},{"id":"289","paper":"真考试卷8","no":9,"type":"单项选择题","q":"对于ARM系列，最适合高端应用的嵌入式处理器是（  ）。","o":["ARM9","ARM Cortex-M","ARM Cortex-A","ARM Cortex-R"],"a":"C","e":"ARM公司在经典处理器ARM11以后的产品改用Cortex命名，并分成A、R和M三类，旨在为各种不同的市场提供服务。其中：“A”系列面向尖端的基于虚拟内存的操作系统和用户应用；“R”系列针对实时系统；“M”系列是面向微控制器的处理器。故本题选C。","code":0},{"id":"290","paper":"真考试卷8","no":10,"type":"单项选择题","q":"以下关于ARM程序状态寄存器CPSR说法错误的是（  ）。","o":["CPSR记录了ARM运行过程中的标志状态","CPSR决定是否切换到Thumb状态","CPSR决定是否允许快速中断FIQ","CPSR决定堆栈深度"],"a":"D","e":"CPSR为当前程序状态寄存器，记录了ARM运行过程中的标志状态；其中T为ARM与Thumb指令切换，F为禁止快速中断FIQ的控制位。因此A、B、C项正确，故本题选D。","code":0},{"id":"291","paper":"真考试卷8","no":11,"type":"单项选择题","q":"关于ARM处理器异常中断响应过程中，以下说法正确的是（  ）。","o":["SPSR的值保存到CPSR中","设置当前状态寄存器CPSR的相应位","断点地址会自动保存在R13中","自动把异常向量地址写入R14中"],"a":"B","e":"ARM对异常的响应过程如下：将CPSR的值保存到将要执行的异常中断对应的各自SPSR中，以实现对处理器当前状态、中断屏蔽及各标志位的保护；设置CPSR的相应位；将引起异常指令的下一条地址（断点地址）保存到R14中；给PC强制赋值，转入向量地址，以便执行相应的处理程序。故本题选B项。","code":0},{"id":"292","paper":"真考试卷8","no":12,"type":"单项选择题","q":"关于ARM处理器的MMU，以下说法错误的是（  ）。","o":["MMU是存储器管理部件","MMU控制存储器访问顺序","MMU控制存储器的访问权限","MMU通过查TLB表得到虚拟地址"],"a":"D","e":"MMU是Memory Management Unit的缩写，中文名是内存管理单元，它是CPU管理虚拟存储器、物理存储器的控制线路，同时也负责虚拟地址映射为物理地址，以及提供硬件机制的内存访问授权；MMU进行虚拟地址到物理地址的转换通过查找页表来完成，每次在访问内存时先查TLB，查不到时再到内存中去查整个页表。故MMU通过查TLB表得到的是物理地址，D项错误，故本题选D。","code":0},{"id":"293","paper":"真考试卷8","no":13,"type":"单项选择题","q":"设R1中为一正整数，将其数值的一半存入R2的ARM指令正确的是（  ）。","o":["SUB  R2,R1,LSR #1","MOV R2,R1,LSL#1","UDIV R2,R1,#1","MOV R2,R1,LSR#1"],"a":"D","e":"SUB指令格式：SUB 目标寄存器,源寄存器1,源寄存器2，而LSR #1移位操作必须作用于某个寄存器，不能独立存在，即A选项正确写法是SUB  R2,R1,R1 LSR #1。B选项将寄存器 R1 的值逻辑左移 1 位后，传送到寄存器 R2 中。C选项是将寄存器 R1 中的无符号整数除以立即数 1，结果存入寄存器 R2 中。D选项指令将数值变为一半相当于除以2，除法运算可以通过逻辑右移来完成，存入可以使用数据传送指令MOV来完成。故本题选D。","code":0},{"id":"294","paper":"真考试卷8","no":14,"type":"单项选择题","q":"以下ARM指令中源操作数属于寄存器间接寻址的指令是（  ）。","o":["ADC R1,R2,R3","STRH R0,[R1]","ORR R1,R,R3","MVN R1,#0x0B"],"a":"B","e":"寄存器间接寻址是指以寄存器的值作为操作数地址，而操作数本身存放在存储器中，用于间接寻址的寄存器必须用［］括起来。故本题选B。","code":0},{"id":"295","paper":"真考试卷8","no":15,"type":"单项选择题","q":"以下对伪指令的解释错误的是（  ）。","o":["DCW 0x12；在内存区域分配半字的内存空间并初始化为0x0012","CODE32；伪指令通知汇编器，其后的指令序列为32位的ARM指令","Baud EQU 2400；为定义一个16位常量Baud值为2400","EXTERN SUB1;当前文件引用外部标号SUB1"],"a":"C","e":"伪指令DCW用于分配一片连续的半字存储单元并用指定的数据初始化；CODE32通知编译器，其后的指令序列为32位的ARM指令；EQU是等于伪指令，用于为程序中的常量、标号等定义一个等效的字符名称，并不直接规定常量Baud的位数，常量Baud的位数取决于其值的大小以及实际使用场景，故为定义一个16位常量Baud说法错误；EXTERN是外部标号引用声明伪指令，用于通知编译器要使用的标号在其他的源文件中定义，但要在当前文件中引用。C项错误，故本题选C。","code":0},{"id":"296","paper":"真考试卷8","no":16,"type":"单项选择题","q":"将R1中的8位二进制数存储到由R2+1指示的单元，并自动更新地址的ARM指令是（  ）。","o":["STRB R1,[R2,#1]!","STRH R1,[R2,#1]!","STREQ R1,[R2,#1]!","STR R1,[R2,#1]!"],"a":"A","e":"根据题目意思，本题要用的指令是STRB，且采用基址加变址寻址方式，同时需要自动更新地址，则指令为STRB R1,［R2,#1］!，故本题选A。","code":0},{"id":"297","paper":"真考试卷8","no":17,"type":"单项选择题","q":"当条件为非负数时，将R1指示的内存中16位数据加载到R0寄存器中，ARM指令为（  ）。","o":["LDRHPL R0,[R1]","LDRHMI R0,[R0]","LDRBMI R1,[R0]","LDRBMI R0,[R1]"],"a":"A","e":"题目要求非负数和16位数据，故需用PL表示正数或零和半字数据加载指令LDRH，又数据是在R1指示的内存中，故采用寄存器间接寻址［R1］，故本题选A项。","code":0},{"id":"298","paper":"真考试卷8","no":18,"type":"单项选择题","q":"下面与嵌入式处理器有关的叙述中，错误的是（  ）。","o":["嵌入式处理器本身就是一个嵌入式最小硬件系统","嵌入式处理器只有在供电的情况下才有可能正常工作","嵌入式处理器工作时需要时钟信号","大多数基于ARM处理器核的嵌入式处理器芯片都有调试接口"],"a":"A","e":"嵌入式处理器本身是不能独立工作的，必须给它供电，加上时钟信号，提供复位信号等才可能工作；嵌入式最小硬件系统一般包括嵌入式处理器、时钟电路、电源电路、复位电路、存储器和调试测试接口；而大多数基于ARM处理器核的处理器芯片都有调试接口。A项错误，故本题选A。","code":0},{"id":"299","paper":"真考试卷8","no":19,"type":"单项选择题","q":"下面关于AMBA的叙述中，错误的是（  ）。","o":["ARM公司定义的AMBA其中文名为\"先进微控制器总线体系结构\"","ARM公司定义的AMBA是用于连接和管理片上系统中各功能模块的开放标准和片上互连规范","至2011年，AMBA已从AMBA1.0发展到了AMBA4.0","ARM7和ARM11采用的AMBA的版本相同"],"a":"D","e":"AMBA的中文名称为“先进微控制器总线体系结构”，A选项叙述正确；AMBA是ARM公司定义的用于连接和管理片上系统中各功能模块的开放标准和片上互连规范，B选项叙述正确；AMBA已从AMBA1.0发展到了AMBA4.0，C选项叙述正确；ARM7和ARM11采用的AMBA版本不相同。ARM7通常采用AMBA 1.0，而ARM11采用AMBA 3.0，D选项叙述错误。因此，本题答案为D选项。","code":0},{"id":"300","paper":"真考试卷8","no":20,"type":"单项选择题","q":"下面关于嵌入式系统存储器的叙述中，错误的是（  ）。","o":["目前嵌入式处理器内部的Cache采用SRAM","嵌入式系统使用的存储器按照其存取特性可分为随机存取存储器（RAM）和只读存储器（ROM）","铁电存储器（FRAM）和磁性存储器（MRAM）是两种新型的半导体存储器","通过对DRAM的存储控制技术进行改进，出现了DDR2 SDRAM、DDR3 SDRAM等新型的存储器产品"],"a":"C","e":"嵌入式系统的存储器以半导体存储器为主。按照其存取特性可分为RAM和ROM；使用的RAM有SRAM、DRAM等多种，目前嵌入式处理器内部的Cache采用SRAM，通过对DRAM的存储控制技术进行改进，出现了DDR2 SDRAM、DDR3 SDRAM等新型的存储器产品；C选项中，铁电存储器（FRAM）和磁性存储器（MRAM）是两种新型的半导体存储器是错误的。FRAM和MRAM虽然都属于非易失性存储器，但它们并不是半导体存储器。FRAM利用铁电效应实现存储，而MRAM利用磁隧道结（MTJ）的磁阻效应实现存储。它们与半导体存储器（如EEPROM和Flash）是不同的。由此可知，本题答案为C选项。","code":0},{"id":"301","paper":"真考试卷8","no":21,"type":"单项选择题","q":"下面关于ARM嵌入式处理器的GPIO的叙述中，错误的是（  ）。","o":["GPIO的引脚一般是三态的，即具有0态，1态和高阻状态","有些GPIO引脚具有多种功能，通过设置相关控制寄存器的某些位来进行选择","有些ARM芯片的GPIO引脚可以设置成具有中断输入功能","只有几个按键的简单键盘接口，应采用专用的键盘接口芯片来实现，而不宜采用GPIO来设计"],"a":"D","e":"GPIO一般具有三态，即0态、1态和高阻状态；为了节省引脚条数，通常有些GPIO引脚有多种功能以供选择，可以通过设置相关控制寄存器的位来确定引脚功能；有些ARM芯片，如新唐科技的Cortexc-M0芯片每个引脚都可以设置成中断输入；在嵌入式应用系统中，少数几个按键作为简单键盘的应用非常普遍，通常可应用GPIO引脚构建简单键盘。故本题选D。","code":0},{"id":"302","paper":"真考试卷8","no":22,"type":"单项选择题","q":"通过 I<SUP>2<\/SUP>C、SPI、UART、USB等可以实现嵌入式系统间或嵌入式系统与外围器件等的连接，下面相关叙述中，正确的是（  ）。","o":["SPI允许总线上的多个器件同时竞争总线，通过总线仲裁的方式确定器件的总线控制权","I<SUP>2<\/SUP>C具有3个信号线：SCL、SDA和SSEL；当作为从设备时，其SSEL应为低电平","UART只能工作于半双工通信方式","USB有多个版本，如USB 1.0、USB 1.1、USB 2.0、USB 3.0等"],"a":"D","e":"I<SUP>2<\/SUP>C总线属于多主总线，即允许总线上有一个或多个主控制器件和若干从器件同时进行操作，通过总线仲裁的方式确定总线控制权；I<SUP>2<\/SUP>C只有两条信号线；数据线SDA和时钟线SCL，所有操作都通过这两条信号线完成；UART常用于全双工串行异步通信；USB有多个版本，如USB 1.0、USB 1.1、USB 2.0、USB 3.0等。故本题选D。","code":0},{"id":"303","paper":"真考试卷8","no":23,"type":"单项选择题","q":"下面关于嵌入式系统中常用的简单输入设备和简单输出设备的叙述中，错误的是（  ）。","o":["嵌入式系统中使用的键盘有线性键盘和矩阵键盘两类","电阻式触摸屏和电容式触摸屏是嵌入式系统中常用的两种触摸屏","LCD是发光二极管的简称","液晶显示器是嵌入式系统常用的一种显示设备"],"a":"C","e":"嵌入式系统中使用的键盘有线性键盘和矩阵键盘两类；电阻式触摸屏和电容式触摸屏是嵌入式系统中常用的两种触摸屏；液晶显示器是嵌入式系统常用的一种显示设备；放光二极管是LED，LCD是液晶显示器，故本题选C。","code":0},{"id":"304","paper":"真考试卷8","no":24,"type":"单项选择题","q":"下面与嵌入式处理器复位相关的叙述中，错误的是（  ）。","o":["一般情况下,为保证系统可靠复位，复位信号有效电平的时间宽度必须为若干个处理器时钟周期","ARM复位后PC指针指向的地址是可选的","嵌入式系统可使用外接典型复位芯片来保证系统可靠复位","当嵌入式处理器的复位引脚标记为nRESET时，表示低电平复位"],"a":"B","e":"一般情况下,为保证系统可靠复位，复位信号有效电平的时间宽度必须为若干个处理器时钟周期；嵌入式系统可使用外接典型复位芯片来保证系统可靠复位；嵌入式处理器都有一个系统复位引脚为nRESET或RESET，n表示低电平复位，不带n的表示高电平复位；ARM复位后PC无条件的指向0x00000000处。B项错误，故本题选B。","code":0},{"id":"305","paper":"真考试卷8","no":25,"type":"单项选择题","q":"下面是关于基于ARM内核的嵌入式芯片中的中断控制器的叙述，其中错误的是（  ）。","o":["中断控制器是连接AMBA的系统总线和外围总线的桥接器","一般采用向量中断或嵌套向量中断方式管理中断","向量中断区分中断的优先级，并且每个中断都有各自的中断处理程序地址","高优先级的中断可以进入低优先级中断的处理过程中，待高优先级中断处理完成后再继续执行低优先级中断处理"],"a":"A","e":"连接AMBA的系统总线和外围总线的是桥接器，DMA连接在AMBA的系统总线上，故A错误；DMA一般采用向量中断或嵌套向量中断方式管理中断，向量中断区分中断的优先级，并且每个中断都有各自的中断处理程序地址，高优先级的中断可以进入低优先级中断的处理过程中，待高优先级中断处理完成后再继续执行低优先级中断处理。故本题选A。","code":0},{"id":"306","paper":"真考试卷8","no":26,"type":"单项选择题","q":"下面是关于嵌入式系统中使用的无线通信接口或技术的叙述，其中错误的是（  ）。","o":["GPRS是GSM用户可用的一种移动数据业务，通常支持用AT指令集进行呼叫、短信、传真、数据传输等业务","使用802.11系列协议的无线局域网也称为WiFi","蓝牙是一种支持短距离通信的无线低速通信技术，它采用分散式网络结构以及快跳频和短包技术，支持点对点及点对多点通信","嵌入式系统可通过扩展无线模块来实现无线通信，该模块与嵌入式处理器连接时一般只能采用UART"],"a":"D","e":"GPRS是GSM用户可用的一种移动数据业务，通常支持用AT指令集进行呼叫、短信、传真、数据传输等业务；凡使用802.11系列协议的无线局域网又称为WiFi；蓝牙是一种支持短距离通信的无线低速通信技术，它采用分散式网络结构以及快跳频和短包技术，支持点对点及点对多点通信；嵌入式系统中的常用无线模块主要包括GPS、GPRS、WiFi、蓝牙及通用射频通信模块等，通信连接接口有UART，也有基于USB的。D项错误，故本题选D。","code":0},{"id":"307","paper":"真考试卷8","no":27,"type":"单项选择题","q":"下面关于实时系统的叙述中，错误的是（  ）。","o":["如果任务执行时间超过截止时间后系统的效益变为负，这种实时系统称为软实时系统","高铁购票系统属于软实时系统","实时系统按响应时间的快慢有强实时系统、普通实时系统和弱实时系统三种","飞行控制器属于强实时系统"],"a":"A","e":"任务执行时间超过截止时间，系统的总损益就为负，这一种实时系统称为硬实时系统，否则为软实时系统。硬实时（Hard Real-Time）系统的运行正确性是同其响应时限紧密相关的。一旦超过时限将导致严重的负效益后果，如飞机控制器、核反应堆处理装置等。然而，在一个软实时（Soft Real-Time）系统中，虽然也存在时限指标，但是如果输出响应超过时限，一般不会造成严重后果。实时系统按响应时间的快慢有强实时系统、普通实时系统和弱实时系统三种。A项错误，故本题选A。","code":0},{"id":"308","paper":"真考试卷8","no":28,"type":"单项选择题","q":"微软公司开发的下列操作系统中，属于嵌入式操作系统的是（  ）。","o":["Windows NT","Windows Phone 8","Windows 8","Windows Server 2012"],"a":"B","e":"B项Windows Phone 8的前驱产品是2003年问世的Windows Mobile，两者都是微软公司的手机操作系统。故本题选B。","code":0},{"id":"309","paper":"真考试卷8","no":29,"type":"单项选择题","q":"下面有关单内核操作系统的叙述中，错误的是（  ）。","o":["单内核操作系统也称为宏内核操作系统","内含的功能模块多，模块间耦合度很高，内核运行效率高","占用内存空间较大，可扩展性较差","Android操作系统不属于单内核操作系统"],"a":"D","e":"单内核结构是传统操作系统采用的结构，也称为宏内核（Macro Kernel）。其缺点是占内存空间大，缺乏可扩展性，维护困难，任务执行时间的可预测性较低，可靠性较低，排除故障和增加新功能需要重编译。其优点是应用程序生成效率高，系统花在内核功能切换上的开销非常小，对外来事件反应速度快，操作系统内核的运行效率高；Android是典型的单内核操作系统。D项错误，故本题选D。","code":0},{"id":"310","paper":"真考试卷8","no":30,"type":"单项选择题","q":"下列程序中属于板级支持包（BSP）内容的是（  ）。","o":["引导加载程序","进程管理程序","进程间通信程序","文件管理程序"],"a":"A","e":"BSP实际上一些汇编程序和C语言代码相结合的操作系统底层软件。包括初始化程序、设备驱动程序、配置文件和引导加载程序等。A项属于BSP内容，故本题选A。","code":0},{"id":"311","paper":"真考试卷8","no":31,"type":"单项选择题","q":"下面关于引导加载程序（Bootloader）的叙述中，正确的是（  ）。","o":["引导加载程序是硬件发生故障后由OS启动执行的","加载和启动操作系统是引导加载程序的一项重要任务","Bootloader包含加电自检和初始化程序，不包含设备驱动程序","相同体系结构的硬件平台一定使用相同的引导加载程序"],"a":"B","e":"嵌入式系统加电后执行的第一批最初操作称为引导或者自举（Boot），对应的程序称为引导程序或者加载程序，其英文术语是Bootloader；引导加载程序主要完成内存加电自检、外设存在自检、内存地址映射、初始化外围设备、内存寻址定位、加载和启动操作系统。由于硬件平台的不同，每种平台的引导程序也有所差异。故本题选B。","code":0},{"id":"312","paper":"真考试卷8","no":32,"type":"单项选择题","q":"嵌入式Linux操作系统由用户进程、OS服务组件和Linux内核3个部分组成，下面叙述中错误的是（  ）。","o":["某个应用程序在Linux操作系统环境下运行时，它就成为一个用户进程","服务组件是位于Linux操作系统内核之上的服务模块或实用程序的集合","Linux内核包含进程管理、内存管理、文件管理、网络接口和进程间通信等模块","Linux内核只供服务组件调用，与用户进程之间没有接口"],"a":"D","e":"用户进程是在Linux系统上运行的应用程序集合，某个应用程序在Linux操作系统环境下运行时，它就成为一个用户进程；OS服务组件是位于Linux操作系统内核之上的一层服务模块或实用程序的集合；Linux内核包含进程管理、内存管理、文件管理、网络接口和进程间通信等模块；Linux内核为用户进程提供了一个虚拟接口（系统调用）。故本题选D。","code":0},{"id":"313","paper":"真考试卷8","no":33,"type":"单项选择题","q":"下面关于Linux内核的叙述中，错误的是（  ）。","o":["Linux的创始人是芬兰大学生Linus Torvalds","Linux内核的最新版本是2.0版","Linux内核是一种自由软件，其源代码是开放的","对于不同体系结构的CPU，Linux内核的源代码各不相同"],"a":"B","e":"Linux内核是一种自由软件，其源代码是开放的，其创始人是芬兰学生Linus Torvalds；对于不同体系结构的CPU，Linux内核的源代码各不相同； 截至2025 年Linux内核升级到6.0版本，B项错误。故本题选B。","code":0},{"id":"314","paper":"真考试卷8","no":34,"type":"单项选择题","q":"Linux内核主要由5个子系统组成，下面选项中不属于这5个子系统的是（  ）。","o":["进程调度","内存管理","虚拟文件系统","浏览器程序"],"a":"D","e":"Linux内核主要由5个子系统组成：进程调度；内存管理；虚拟文件系统；网络接口；进程间通信。故本题选D。","code":0},{"id":"315","paper":"真考试卷8","no":35,"type":"单项选择题","q":"下面关于μC/OS-II任务管理的叙述中，错误的是（  ）。","o":["它可以管理多达64个任务","用户任务最多只能有32个","空闲任务（idle task）是系统所创建的第1个任务","就绪状态的任务表示已经具备运行条件但并不在运行的任务"],"a":"B","e":"μC/OS-II只能管理64个任务，目前的版本保留8个任务给系统，故用户编写的应用程序最多可以有56个任务；空闲任务（idle task）是系统所创建的第1个任务；就绪态的任务意味着该任务已经准备好，可以运行但由于该任务的优先级比正在运行的任务的优先级低，暂时还不能运行。B项错误，故本题选B。","code":0},{"id":"316","paper":"真考试卷8","no":36,"type":"单项选择题","q":"μC/OS-II的每个任务都处于5种状态之一，这5种状态是（  ）。","o":["休眠态、就绪态、运行态、挂起态、被中断态","等待态、输入态、运行态、挂起态、输出态","休眠态、就绪态、运行态、输入态、输出态","输入态、就绪态、运算态、输出态、完成态"],"a":"A","e":"μC/OS-II的每个任务都处于以下5种状态之一：休眠态、就绪态、运行态、挂起态和被中断态。故本题选A。","code":0},{"id":"317","paper":"真考试卷8","no":37,"type":"单项选择题","q":"关于μC/OS-II中处于就绪状态的任务，下面叙述中正确的是（  ）。","o":["该任务已经可以运行，一旦CPU空闲该任务将立即运行","该任务已经可以运行，但由于优先级不够暂时不能运行","该任务已经可以运行，一旦得到所需资源将立即运行","该任务已经可以运行，一旦事件信号量出现将立即运行"],"a":"B","e":"处在就绪态的任务意味着该任务已经准备好，可以运行但由于该任务的优先级比正在运行的任务的优先级低，暂时还不能运行。故本题选B。","code":0},{"id":"318","paper":"真考试卷8","no":38,"type":"单项选择题","q":"在开发低端、中端、高端等类型的嵌入式系统时，一般都需要选择和利用合适的开发平台来进行。下面有关嵌入式系统开发平台的叙述中，不正确的是（  ）。","o":["开发平台中的软件开发工具，通常会包括：项目管理器、编辑器、编译器、连接器等","开发平台中的软件开发工具往往都作为一个整体提供给开发人员使用，以提高开发工作效率。","有的开发平台中还包含一些中间件和软件组件，以满足特定应用领域的各种应用开发。","用开发平台所开发出的低端嵌入式系统应用软件，必须基于某一个嵌入式操作系统上运行。"],"a":"D","e":"嵌入式系统的开发平台包含大量开发工具，软件开发工具通常包括：项目管理器、编辑器、编译器、连接器、定位器等；这些软件开发工具往往都使用统一的用户界面并作为一个整体提供给开发人员使用，以提高开发工作效率；有的开发平台中还包含一些中间件和软件组件，以满足特定应用领域的各种应用开发；嵌入式系统的开发平台大多采用宿主机-目标机的架构，宿主机是开发用机，目前大多数运行Windows操作系统，而应用软件的开发和调试都是通过宿主机开完成。故本题选D。","code":0},{"id":"319","paper":"真考试卷8","no":39,"type":"单项选择题","q":"下面关于JTAG的叙述中，错误的是（  ）。","o":["JTAG是ARM内核独有的一种测试接口，其他种类的嵌入式处理器一般没有该接口","JTAG 可用于实现嵌入式系统的在线编程功能","多个器件可以通过 JTAG 接口串联在一起，形成一个 JTAG 链","SWD是Cortex-M内核提供的功能与JTAG类似的调试接口"],"a":"A","e":"JTAG可用于实现嵌入式系统的在线编程功能，其标准允许多个芯片通过JTAG接口串联在一起，实现对多个器件的测试；目前大多数嵌入式CPU、DSP、FPGA器件都支持JTAG标准；SWD是Cortex-M内核提供的功能与JTAG类似的调试接口。故本题选A。","code":0},{"id":"320","paper":"真考试卷8","no":40,"type":"单项选择题","q":"下面有关RVDS开发工具套件的描述语句中，不正确的描述是（  ）。","o":["RVDS工具套件可支持以ARM系列微处理器为核心的嵌入式系统软件开发。","RVDS中包括调试器（RVD），RVD只具有在线调试功能","RVDS与ADS1.2比较而言，其生成的代码紧凑、执行效率高。","RVDS可以对用汇编语言或者C语言或者C++语言编写的源程序进行编译。"],"a":"B","e":"RVDS是ARM公司推出的基于ARM系列CPU进行开发的工具套件，支持所有ARM芯片，还支持其他内核的处理器，如51系列；与ADS1.2比较而言，其生成的代码紧凑，执行效率高；RVDS的开发工具套件中，主要包括工程管理器、编译连接器、调试器和指令集仿真器等；支持汇编、C和C++对源程序进行编译。故本题选B。","code":0},{"id":"321","paper":"真考试卷9","no":1,"type":"单项选择题","q":"在嵌入式系统（如数码相机）中，获取数字图像的过程大体分为四步，如下图所示，其中前3个步骤分别是（  ）。","o":["扫描、取样、分色","取样、分色、扫描","扫描、分色、取样","取样、扫描、分色"],"a":"C","e":"从现实世界中获得数字图像的过程称为图像的获取，使用的设备主要有数码相机和扫描仪两种。获取过程的核心是模拟信号的数字化。其处理步骤大致分为4步：扫描，分色，取样，量化。故本题选择C。","code":0},{"id":"322","paper":"真考试卷9","no":2,"type":"单项选择题","q":"数字音频的比特率（码率）指的是每秒钟的数据量，它与取样频率、量化位数、声道数目、使用的压缩编码方法等密切相关。假设数字音频的比特率为8kB/s，其取样频率是8kHz，单声道，未压缩，那么它的量化位数是（  ）。","o":["24位","16位","8位","4位"],"a":"C","e":"数字音频的主要参数包括取样频率、量化位数、声道数目、使用的压缩编码方法以及比特率。数字音频未压缩前，其比特率（码率）的计算公式为：波形声音的码率=取样频率×量化位数×声道数（单位：b/s）。压缩编码后的码率则为压缩前的码率除以压缩倍数（压缩比）。量化位数=波形声音的码率/(取样频率×声道数)=8kB/s/(8kHz×1)=8×8×10<SUP>3<\/SUP>bit/s8×10<SUP>3<\/SUP>Hz=8位（注意：1kB=8×10<SUP>3bit<\/SUP>），故此题选择C。","code":0},{"id":"323","paper":"真考试卷9","no":3,"type":"单项选择题","q":"下面关于有线通信和无线通信的一些叙述中，正确的是（  ）。","o":["有线通信需要使用金属导体作为信息的传输介质","通过光波传输信息的都属于无线通信","通过电磁波在自由空间的传播来传输信息的方法属于无线通信","有线通信最终将会被无线通信所淘汰"],"a":"C","e":"有线通信的传输介质不仅限于金属导体，还包括光导纤维（即光纤），光纤通信属于有线通信，它通过光波传输信息，不依赖金属导体，A选项叙述错误；通过光波传输信息不一定属于无线通信。光纤通信是典型的有线通信方式，它利用光波在光纤中传输信息，属于有线通信范畴，B选项叙述错误；无线通信的本质特征是信息通过电磁波在自由空间中传播，无需物理线路连接。例如无线电广播、Wi-Fi、移动通信（4G/5G）、卫星通信等，都是利用电磁波在自由空间传播来传输信息，C选项叙述正确；有线通信不会被无线通信淘汰。两者各有优势，有线通信在稳定性、带宽、安全性方面更优，而无线通信在移动性、覆盖范围、部署便捷性上更胜一筹。现代通信系统往往是有线与无线互补共存，如骨干网依赖光纤，接入网则结合有线与无线，D选项叙述错误。综上所述，本题答案为C选项。","code":0},{"id":"324","paper":"真考试卷9","no":4,"type":"单项选择题","q":"嵌入式系统的硬件与通用计算机一样，其主体是中央处理器和存储器。下面关于嵌入式系统CPU的叙述中，错误的是（  ）。","o":["运算器、控制器等各个组成部分全都制作在一块大小仅为几个cm2的半导体芯片上","它具有功耗低、实时处理能力强的特点","字长均为32位或64位，8位和16位的CPU已经被淘汰","CPU中大多集成有测试电路"],"a":"C","e":"嵌入式系统的CPU，运算器、控制器等各个组成部分全都制作在一块大小仅为几个cm2的半导体芯片上，一般有四个特点：支持实时处理、低功耗、结构可扩展和集成测试电路。有4位、8位、16位、32位和64位之分；虽然32位和64位是当前技术发展的主流，但销量仅占全部微处理器的10%左右。故本题选择C。","code":0},{"id":"325","paper":"真考试卷9","no":5,"type":"单项选择题","q":"下图是数字信号处理器（DSP）的典型应用方式，其中的①、②和③分别是（  ）。","o":["A/D转换器、DSP、D/A转换器","D/A转换器、DSP、A/D转换器","DSP、A/D转换器、D/A转换器","A/D转换器、D/A转换器、DSP"],"a":"A","e":"数字信号处理器（DSP）是一种专用于数字信号处理的微处理器，它对通用处理器的逻辑结构和指令系统进行了优化设计，使之能更好地满足高速数字信号处理的要求。如图是DSP的典型应用方式，其中传感器采集模拟信号，通过A/D转换器变成数字信号交由DSP进行处理，再经过D/A转换器变成模拟信号输出到显示器进行显示。故本题选择A。","code":0},{"id":"326","paper":"真考试卷9","no":6,"type":"单项选择题","q":"下面关于无线通信技术的一些叙述中，错误的是（  ）。","o":["无线通信不需要架设传输线路，节省了传输成本","它允许通信终端在一定范围内随意移动，方便了用户使用","电波通过空气进行传播，能量集中，传输距离可以很远","相对于有线通信它容易被窃听、也容易受干扰"],"a":"C","e":"无线通信中，信息是通过电磁波进行传输的，可以省去线路的架设，允许终端设备在一定范围内移动，但是电波通过自由空间时能量较分散，传输效率低。同时，无线通信存在着易被窃听、易受干扰等缺点。故本题选择C。","code":0},{"id":"327","paper":"真考试卷9","no":7,"type":"单项选择题","q":"ARM Cortex-A15处理器内核体系结构版本是（  ）。","o":["ARMv4","ARMv5","ARMv6","ARMv7"],"a":"D","e":"根据ARM架构的划分，Cortex-A系列处理器主要面向高端应用，如智能手机、平板电脑和嵌入式系统，它们均基于ARMv7-A或更新的ARMv8-A架构设计。Cortex-A15属于ARMv7-A架构的产物，其设计目标是在性能、功耗效率和代码密度之间取得平衡，支持Thumb-2指令集、NEON SIMD扩展以及虚拟化等关键技术。故本题选择D。","code":0},{"id":"328","paper":"真考试卷9","no":8,"type":"单项选择题","q":"关于ARM处理器的工作模式，以下说法错误的是（  ）。","o":["具有多种工作模式","工作模式之间可以切换，但切换是有条件的","外部中断模式IRQ，可用于高速中断处理","当处理器处于用户模式时，如果没有异常发生是不能改变工作模式的"],"a":"C","e":"ARM体系结构支持7种工作模式，工作模式之间可以切换，切换条件取决于当前程序状态寄存器CPSR的低5位值。用户模式是程序正常执行工作模式，如果没有异常发生不能改变工作模式；快速中断模式（FIQ）用来处理高速中断；中止模式处理存储器故障；系统模式运行特权级的操作系统任务。故本题选择C。","code":0},{"id":"329","paper":"真考试卷9","no":9,"type":"单项选择题","q":"以下关于ARM寄存器的说法，错误的是（  ）。","o":["R12为链接寄存器","R13为堆栈指针","R15作为PC使用","CPSR为当前程序状态寄存器"],"a":"A","e":"ARM处理器在不同状态下寄存器组织略有区别，但有共同点：无论何种模式，R15均作为PC使用；CPSR为当前程序状态寄存器；R0~R12为公用的通用寄存器。R13~R14为堆栈指针和程序链接寄存器。故本题选择A。","code":0},{"id":"330","paper":"真考试卷9","no":10,"type":"单项选择题","q":"以下不属于转移(分支)类指令的是（  ）。","o":["BLX R0","BCC Labe1","BEQ R1","BIC R1,R0,#1000"],"a":"D","e":"ARM指令集中的分支指令包括：B转移指令、BL带返回的转移指令、BLX带返回且带状态切换的转移指令，BCC为条件跳转指令；BEQ为跳转指令，以及BX带状态切换的转移指令。BIC是位清除指令。故本题选择D。","code":0},{"id":"331","paper":"真考试卷9","no":11,"type":"单项选择题","q":"以下ARM公司Cortex处理器最适合实时应用的是（  ）。","o":["Cortex-M0","Cortex-R4","Cortex-A15","Cortex-M3"],"a":"B","e":"Cortex处理器包括基于Cortex-R、Cortex-M和Cortex-A内核的系列处理器。目前高端嵌入式应用可使用Cortex-A系列的应用处理器；低端面向控制领域可使用Cortex-M系列微控制器；而Cortex-R系列是面向实时控制的处理器。故本题选择B。","code":0},{"id":"332","paper":"真考试卷9","no":12,"type":"单项选择题","q":"以下具有Thumb-2状态的ARM处理器内核是（  ）。","o":["ARM7","ARM9","ARM10","Cortex-M3"],"a":"D","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态①ARM状态②Thumb状态及Thumb-2状态③调试状态。其中，除支持Thumb-2的ARM处理器外，其他所有ARM处理器都可以工作在ARM状态，而Cortex-M3只有Thumb-2状态和调试状态。故本题选择D。","code":0},{"id":"333","paper":"真考试卷9","no":13,"type":"单项选择题","q":"已知R1=0x20000000,R0=0x55667788,在大端模式下执行ARM指令STR R0,［R1］之后，0x20000003中的值为（  ）。","o":["0x55","0x66","0x77","0x88"],"a":"D","e":"在大端模式下，32位数据字的高字节存储在低地址中，而数据字的低字节则存放在高地址中。STR为寄存器到存储器的数据传送指令，题中指令为寄存器间接寻址，将R0的值传到以R1值为地址的存储器中。故本题选择D。","code":0},{"id":"334","paper":"真考试卷9","no":14,"type":"单项选择题","q":"已知R3=0x80001000，R4=0x00A00010，执行ARM指令MOV R3,R4,LSL#8后，R3的值为（  ）。","o":["0x80001000","0x00A00010","0xA0001000","0x0000A000"],"a":"C","e":"题中将R4中的内容转换成二进制数然后再将其左移8位送入R3，R4=0x00A00010，对应的二进制数是0000 0000 1010 0000 0000 0000 0001 0000，左移8位后就是1010 0000 0000 0000 0001 0000 0000 0000，对应的十六进制是0xA0001000，故本题选择C。","code":0},{"id":"335","paper":"真考试卷9","no":15,"type":"单项选择题","q":"ARM指令LDR R0,［R1,#4］!执行后，以下说法正确的是（  ）。","o":["R0中的值不变","R1中的值不变","内存中的值不变","R0和R1中的值均不改变"],"a":"C","e":"首先计算内存地址，即基址寄存器R1的值加上偏移量#4。因为指令末尾带有感叹号!，表示执行写回操作。计算出的新地址（R1 + 4）会被写回到基址寄存器R1中，即R1的值会更新为R1+4。接着，从计算出的新地址（也就是更新后的 R1 指向的地址R1+4）中读取数据，读取到的数据被存入目标寄存器 R0 中，R0的值发生改变，内存中的值不变。综上所述，C选项说法正确，本题答案为C选项。","code":0},{"id":"336","paper":"真考试卷9","no":16,"type":"单项选择题","q":"下面关于嵌入式最小硬件系统的叙述中，错误的是（  ）。","o":["嵌入式最小系统包括给嵌入式处理器供电的电源电路","时钟电路给嵌入式处理器提供工作时需要的时钟信号，它是嵌入式最小系统的一个组成部分","嵌入式处理器必需扩展外部存储器才能组成能够正常工作的嵌入式最小系统","嵌入式处理器芯片的调试接口为嵌入式系统的开发提供便利，常把调试接口看作嵌入式最小系统的一个组成部分"],"a":"C","e":"提供嵌入式处理器运行必备条件的硬件电路与嵌入式处理器共同构成嵌入式最小硬件系统，如果处理器内嵌Flash程序存储器容量足够，则无需扩展外部存储器。故本题选择C。","code":0},{"id":"337","paper":"真考试卷9","no":17,"type":"单项选择题","q":"下面关于ARM的AMBA的叙述中，错误的是（  ）。","o":["AMBA是指先进的微控制器总线体系结构","AMBA虽然只有一个版本，但能够满足各类ARM处理器开发的需要","总体而言，AMBA由系统总线和外围总线两部分组成","通过AMBA连接的ARM嵌入式芯片中的不同组件的运行速度可能不同"],"a":"B","e":"AMBA是指先进的微控制器总线体系结构，从1995年的AMBA1.0到2011年的AMBA4.0共有4个版本，主要由系统总线和外围总线两部分组成。故本题选择B。","code":0},{"id":"338","paper":"真考试卷9","no":18,"type":"单项选择题","q":"下面是关于嵌入式系统中UART的叙述，其中错误的是（  ）。","o":["UART是通用异步收发器","UART可实现全双工串行通信","在ARM嵌入式芯片中，UART的接收器和发送器中的FIFO寄存器的字节数相同，且固定为64字节","有的ARM嵌入式芯片中集成了多个UART"],"a":"C","e":"UART即串行异步通信接口，常用于全双工串行通信，使用UART进行通信时要求通信双方波特率和传输格式必须一致。所有嵌入式处理芯片内部均集成了兼容标准UART功能的组件，有的集成了多个UART。一般接收和发送缓冲器的FIFO字节数N是一样大小，长度可编程选择，如4B、8B、16B、64B等。故本题选择C。","code":0},{"id":"339","paper":"真考试卷9","no":19,"type":"单项选择题","q":"USB经历了1.0、1.1、2.0及3.0等版本，各版本的最大数据传输速率不同，其中最大数据传输速率为5Gbps的USB版本是（  ）。","o":["USB 1.0","USB 1.1","USB 2.0","USB 3.0"],"a":"D","e":"各版本中最大数据传输速率为5Gbps的USB版本是USB 3.0。故本题选择D。","code":0},{"id":"340","paper":"真考试卷9","no":20,"type":"单项选择题","q":"下面关于CAN的叙述中，错误的是（  ）。","o":["CAN即控制器局域网","采用CAN可构成多主多从系统","CAN总线的数据帧由7个不同的域组成","CAN总线不采用差分方式进行信息传输"],"a":"D","e":"CAN即控制器局域网，采用差分传输，利用CAN可构成多主多从系统，其总线的数据帧由7个不同的域组成。故本题选择D。","code":0},{"id":"341","paper":"真考试卷9","no":21,"type":"单项选择题","q":"一主一从式SPI连接示意如下图所示。主机SPI的4根信号线的名称已在图中标出，为保证主机与从机之间的正确连接及系统正常工作，图中从机的①、②、③、④的信号名称分别应该是什么？","o":["MOSI、MISO、SCK、SSEL","SCK、MOSI、MISO、SSEL","MISO、MOSI、SCK、SSEL","SSEL、MOSI、SCK、MISO"],"a":"C","e":"串行外设（SPI）接口是一种同步串行外设接口，允许嵌入式处理器与各种外围设备以串行方式进行通信、数据交换。一般使用4跳线：SCK、MISO、MOSI和SSEL。将数据写到SPI发送缓冲区后，一个时钟信号SCK对应一位数据的发送（MISO）和另一位数据的接收（MOSI）；在主机中数据从移位寄存器中自左向右发出送到从机（MOSI），同时从机中的数据自右向左发到主机（MISO），经过8个时钟周期完成1字节的发送。故本题选择C。","code":0},{"id":"342","paper":"真考试卷9","no":22,"type":"单项选择题","q":"下图为基于ARM处理器的嵌入式系统的键盘接口。下面关于该键盘接口的叙述中，错误的是（  ）。","o":["图中所示的键盘接口采用了矩阵键盘的结构","可采用行扫描法读取该键盘接口按键的特征值","读取按键的特征值时可采用中断方式","读取按键的特征值时，GPG4~GPG6作为输入接口"],"a":"D","e":"如图所示为典型的矩阵键盘接口，可采用行扫描法和中断方式去读取该键盘接口按键的特征值。采用四根I/O引脚GPG4~GPG7作为行扫描输出。故本题选择D。","code":0},{"id":"343","paper":"真考试卷9","no":23,"type":"单项选择题","q":"在μC/OS-II操作系统下，处于运行态的任务因更高优先级的任务就绪而被剥夺CPU使用权后将转入（  ）。","o":["等待态。","被中断态。","就绪态。","休眠态。"],"a":"C","e":"μC/OS-II的每个任务都处在以下5种状态之一，即休眠态、就绪态、运行态、挂起态和被中断态。支持抢占式任务调度，处于运行态的任务一定是当前就绪任务集里的最高优先级任务；处于运行态的任务因更高优先级的任务就绪而被剥夺CPU使用权后将转入就绪态。故本题选择C。","code":0},{"id":"344","paper":"真考试卷9","no":24,"type":"单项选择题","q":"下面对于Linux内核的叙述，错误的是（  ）。","o":["它为用户进程提供系统调用","Linux内核主要作用包括进程管理与调度、内存管理等","应用程序通过GLIBC调用通用函数和内核的内部功能","系统调用是Linux内核访问硬件的接口"],"a":"D","e":"Linux内核的主要作用是：进程管理与调度、内存管理、文件管理、网络接口和进程间通信；它为用户进程提供系统调用；应用程序通过GLIBC调用通用函数和内核的内部功能。故本题选择D。","code":0},{"id":"345","paper":"真考试卷9","no":25,"type":"单项选择题","q":"衡量实时操作系统性能的指标不包括下列哪一项？","o":["中断延迟时间","任务切换时间","任务抢占时间","存储器延迟时间"],"a":"D","e":"RTOS的实时性能主要根据三个指标：响应时间、吞吐量和生存时间；其中响应时间包括中断延迟时间和任务切换时间，任务抢占时间属于任务切换时间。故本题选择D。","code":0},{"id":"346","paper":"真考试卷9","no":26,"type":"单项选择题","q":"以下各嵌入式操作系统中，既按开发版本的授权数量收取授权费，也按最终产品售出的实际数量收取每份运行软件的版权费的是（  ）。","o":["μCLinux","RTLinux","μC/OS-II","VxWorks"],"a":"D","e":"四个选项均是主流的嵌入式操作系统。既按开发版本的授权数量收取授权费，也按最终产品售出的实际数量收取每份运行软件的版权费的是VxWorks。VxWorks是目前公认实时性最强、可靠性最高的嵌入式实时操作系统。故本题选择D。","code":0},{"id":"347","paper":"真考试卷9","no":27,"type":"单项选择题","q":"下面关于硬实时任务和软实时任务的叙述中，错误的是（  ）。","o":["软实时任务仍然要求系统的响应越快越好， 但是偶尔超出时限并不会造成任务失败或导致任务出现致命错误。","对硬实时任务，必须在给定的时限内完成， 超过时限将会导致任务失败或引起致命的错误。","硬实时任务的相对时限比软实时任务短。","DVD播放机的视频播放任务属于软实时任务。"],"a":"C","e":"一旦任务执行时间超过截止时间系统的总损益就为负，这种实时系统称为硬实时系统，否则为软实时系统。对于硬实时系统，一旦超过时限将导致严重的负效益后果，如飞机控制器、核反应堆处理装置；而软实时系统中如果输出响应超过时限，一般不会造成严重后果；DVD播放机的视频播放任务属于软实时任务；多数的嵌入式系统都具有时间约束性，然而并非嵌入式系统都是实时系统。故本题选择C。","code":0},{"id":"348","paper":"真考试卷9","no":28,"type":"单项选择题","q":"下列关于Linux的陈述中，不正确的是（  ）。","o":["Linux的运行效率尚未达到Uinx的水平。","Nios II是能在嵌入式计算机系统上运行的Linux操作系统发行版。","Linux是自由软件家族中的一个软件。","虚拟文件系统（VFS）是Linux的通用文件系统模型。"],"a":"B","e":"Linux是目前唯一可免费获得的，能为多用户提供多任务、多线程功能的大型操作系统。迄今为止Linux的运行效率尚未达到Unix的水平；Linux是自由软件家族中的一个软件；虚拟文件系统（VFS）是Linux的通用文件系统模型。2004年，Altera 正式推出了Nios II系列32位RISC嵌入式处理器。故本题选择B。","code":0},{"id":"349","paper":"真考试卷9","no":29,"type":"单项选择题","q":"关于Linux操作系统的组成和结构，下面叙述中错误的是（  ）。","o":["某个应用程序在Linux操作系统环境下运行时，它就成为一个用户进程","Linux提供的GLIBC是可移植的标准C库函数实现，提供标准I/O和标准流的一系列接口。","Linux内核包含进程管理、内存管理、文件管理、网络接口和进程间通信等模块","Linux是参照Minix开发的，采用与Minix相同的微内核结构。"],"a":"D","e":"某个应用程序在Linux操作系统环境下运行时，它就成为一个用户进程；Linux提供的GLIBC是可移植的标准C库函数实现，提供标准I/O和标准流的一系列接口；Linux内核包含进程管理、内存管理、文件管理、网络接口和进程间通信等模块；Linux系统最初以Unix为原型，以实现POSIX标准作为其目标。故本题选择D。","code":0},{"id":"350","paper":"真考试卷9","no":30,"type":"单项选择题","q":"下列关于嵌入式系统板级支持包的描述中，错误的是（  ）。","o":["板级支持包又称为BSP","板级支持包与硬件无关，故在移植操作系统时不需要改动","板级支持包含有电路板的初始化程序","操作系统的上层代码通过板级支持包访问底层硬件"],"a":"B","e":"板级支持包又称为BSP，含有电路板的初始化程序；所有与特定电路板上硬件相关的功能都集成在板级支持包的库里，操作系统的上层代码通过板级支持包访问底层硬件。故本题选择B。","code":0},{"id":"351","paper":"真考试卷9","no":31,"type":"单项选择题","q":"以下各项陈述中，不属于单内核操作系统特点的是（  ）。","o":["基于客户机/服务器体系结构。","执行效率高。","性能好。","占用资源较多。"],"a":"A","e":"单内核结构是传统操作系统采用的结构，也称为宏内核。优点是应用程序生产效率高，系统花在内核功能切换上的开销非常小，对外来时间反应速度快，操作系统内核的运行效率高；缺点是占内存空间大，缺乏可扩展性，维护困难，任务执行时间的可预测性较低，可靠性低，排除故障和增加新功能需要重编译。故本题选择A。","code":0},{"id":"352","paper":"真考试卷9","no":32,"type":"单项选择题","q":"按照实时性能和内核结构划分，VxWorks操作系统属于（  ）。","o":["硬实时微内核嵌入式操作系统","软实时微内核嵌入式操作系统","硬实时单内核嵌入式操作系统","软实时宏内核嵌入式操作系统"],"a":"A","e":"按照实时性能和内核结构划分，VxWorks操作系统属于硬实时微内核嵌入式操作系统。故本题选择A。","code":0},{"id":"353","paper":"真考试卷9","no":33,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的描述中，错误的是（  ）。","o":["用户必须在多任务调度启动以后再使能时钟节拍中断。","在中断返回之前，必须调用退出中断函数void OSIntExit(void)。","互斥信号量可以解决优先级反转问题。","一个任务或中断服务子程序可以等待其他任务或中断服务子程序通过事件控制块给其发送信号。"],"a":"D","e":"用户必须在多任务调度启动以后再使能时钟节拍中断；在中断返回之前，必须调用退出中断函数void OSIntExit(void)；互斥信号量可以解决优先级反转问题；一个任务或中断服务子程序可以通过事件控制块来向另外的任务发信号。故本题选择D。","code":0},{"id":"354","paper":"真考试卷9","no":34,"type":"单项选择题","q":"以下关于嵌入式系统软件与通用计算机系统软件的异同的陈述中，错误的是（  ）。","o":["通常嵌入式系统的软件配备没有通用系统多","嵌入式系统必须配备实时操作系统，而通用计算机系统上的操作系统没有实时性要求","嵌入式系统应用软件往往内部结构精简化、代码轻量化、占用存储资源少","嵌入式系统软件和通用计算机系统软件都可以实现图形用户界面"],"a":"B","e":"通常嵌入式系统的软件配备没有通用系统多；嵌入式系统软件和通用计算机系统软件都可以实现图形用户界面，嵌入式系统应用软件的特点是：内部结构精简化、代码轻量化、占用存储资源少；多数嵌入式系统具有时间约束性，因而至少是软实时系统，通用计算机系统像因特网域名服务系统也是典型的实时系统。故本题选择B。","code":0},{"id":"355","paper":"真考试卷9","no":35,"type":"单项选择题","q":"以下关于嵌入式系统软件的描述中，错误的是（  ）。","o":["在μC/OS-II操作系统中，各个任务间共享任务堆栈","Bootloader的任务之一是加载和启动操作系统","WinCE是一种大型嵌入式操作系统","大多数嵌入式系统都是实时系统"],"a":"A","e":"在μC/OS-II操作系统中，每个任务拥有自用栈，允许每个任务有不同的栈空间，以便减少应用程序对RAM的需求；Bootloader的任务之一是加载和启动操作系统；WinCE是一种大型嵌入式操作系统；大多数嵌入式系统都是实时系统。故本题选择A。","code":0},{"id":"356","paper":"真考试卷9","no":36,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的描述中，错误的是（  ）。","o":["在μC/OS-II中，任务是操作系统的基本调度单位","为保证内核精简，μC/OS-II不支持中断嵌套","μC/OS-II不支持时间片轮转调度法","μC/OS-II的事件控制块可以用于对信号量的管理"],"a":"B","e":"在μC/OS-II中，任务是操作系统的基本调度单位；μC/OS-II允许中断嵌套，嵌套层数可达255层；μC/OS-II不支持时间片轮转调度法；μC/OS-II的事件控制块可以用于对信号量的管理。故本题选择B。","code":0},{"id":"357","paper":"真考试卷9","no":37,"type":"单项选择题","q":"下列关于嵌入式系统硬件抽象层的描述中，正确的是（  ）","o":["硬件抽象层向操作系统内核提供了访问底层硬件的函数接口","硬件抽象层又称为Bootloader","U-boot是支持多种常用体系结构的硬件抽象层","硬件抽象层与硬件无关，故在移植操作系统时不需要改动"],"a":"A","e":"硬件抽象层又称为HAL，作用是向操作系统内核提供了访问底层硬件的函数接口；如果要移植操作系统，就要对HAL驱动函数进行改写，以满足具体操作系统的上层函数接口的规范。故本题选择A。","code":0},{"id":"358","paper":"真考试卷9","no":38,"type":"单项选择题","q":"若把嵌入式系统设计开发过程分为：系统需求分析与规格说明、系统设计、构件设计、系统集成与测试等4个阶段。下面的说法中，恰当的是（  ）。","o":["在系统需求分析阶段，必须了解用户对嵌入式系统的功能需求，尺寸、大小、成本等需求不需了解。","系统设计阶段，必须确定哪些功能由硬件完成，哪些功能由软件完成。","构件设计阶段的任务是进行芯片比较并选择现成的芯片或模块","系统集成与测试阶段应该把系统所需部件全部集成后再进行测试。"],"a":"B","e":"用户需求通常包括功能部分和非功能部分，非功能部分需求主要是指性能、成本、尺寸、重量和功耗等；系统设计阶段，必须确定哪些功能由硬件完成，哪些功能由软件完成；构件设计阶段的任务是设计或选择符合系统结构和规格说明中所需要的具体构件，既包括硬件也包括软件模块；在系统集成时，应该分步地、按阶段地构建系统，并且每次只对一部分构件或模块所集成的系统进行测试。故本题选择B","code":0},{"id":"359","paper":"真考试卷9","no":39,"type":"单项选择题","q":"若某个嵌入式系统设计了支持以太网通信的接口电路，选用AX88796作为以太网控制器芯片，其片选信号CS引脚连到S3C2410芯片的nGCS2上。那么，读写AX88796芯片内部寄存器的首地址是（  ）。","o":["0x00000000","0x08000000","0x10000000","0x18000000"],"a":"C","e":"S3C2410的存储控制器将外部设备地址空间共1GB，有8个存储块，每个存储块大小为128MB，对应一个片选信号（nGCS0~nGCS7），每个块128MB即2的27次方字节（对应十六进制数就是0x8000000），每个块首地址的访问，分别由nGCSX控制，X随着块号（0~7）依次递增。因此每个块内存空间的首地址为：\nnGCS0=0x00000000\nnGCS1=0x08000000\nnGCS2=0x10000000\nnGCS3=0x18000000\nnGCS4=0x20000000\nnGCS5=0x28000000\nnGCS6=0x30000000\nnGCS7=0x38000000\n根据题目要求，其片选信号CS引脚连到S3C2410芯片的nGCS2上，所以读写AX88796芯片内部寄存器的首地址是0x10000000，故本题选择C。","code":0},{"id":"360","paper":"真考试卷9","no":40,"type":"单项选择题","q":"数字音频的比特率（码率）指的是每秒钟的数据量，它与取样频率、量化位数、声道数目、使用的压缩编码方法等密切相关。假设数字音频的比特率为16kb/s，其取样频率是8kHz，单声道，量化位数为8位，采用压缩编码，那么压缩比是（  ）。","o":["8","6","4","2"],"a":"C","e":"数字音频未压缩时的比特率（码率）计算公式为未压缩比特率=取样频率×量化位数×声道数目=8KHz×8bit×1=8000Hz×8bit×1=64000bit/s=64Kb/s。压缩比是指未压缩数据量（或比特率）与压缩后数据量（或比特率）的比值，即压缩比 = 未压缩比特率 / 压缩后比特率=64Kb/s/16Kb/s=4。由此可知，本题答案为C选项。","code":0},{"id":"361","paper":"真考试卷10","no":1,"type":"单项选择题","q":"数字信号处理器在嵌入式系统中得到广泛使用，下面关于数字信号处理器的叙述中错误的是（  ）。","o":["它的英文缩写是DSP","它比通用的微处理器能更好地满足高速数字信号处理的要求","它特别适合于文字处理和图形用户界面","手机和数码相机等产品通常都含有数字信号处理器"],"a":"C","e":"数字信号处理器（DSP）是一种专用于数字信号处理的微处理器，它对通用处理器的逻辑结构和指令系统进行了优化设计，使之能更好地满足高速数字信号处理的要求，特别适合音频、视频等数字信号的数据处理效率，手机和数码相机等产品通常都含有数字信号处理器。故本题选择C。","code":0},{"id":"362","paper":"真考试卷10","no":2,"type":"单项选择题","q":"片上系统（SoC）也称为系统级芯片，下面关于SoC叙述中正确的是（  ）。","o":["SoC芯片中只有一个CPU或DSP","SoC已经成为嵌入式处理芯片的主流发展趋势","SoC是集成电路加工工艺进入纳米时代后的产物","片上系统使用单个芯片进行数据的采集、转换、存储和处理，它不支持I/O功能"],"a":"B","e":"片上系统（或系统级芯片），即SOC或SoC，是目前广泛使用的一种嵌入式处理芯片，它是电子设计自动化（EDA）水平提高和大规模集成电路制造技术（VLSI）发展的成果，芯片中既包含处理器又包含存储器及外围电路，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能，目前大多数32位的嵌入式处理芯片均为SOC，包括智能手机和平板电脑，其已经成为集成电路设计的主流发展趋势。故本题选择B。","code":0},{"id":"363","paper":"真考试卷10","no":3,"type":"单项选择题","q":"计算机局域网传输数据时，必须把数据组织成规定格式的“帧”，每一数据帧由下图所示的5个部分组成,其中①、②、③分别是（  ）。","o":["发送设备MAC地址、接收设备MAC地址、校验信息","发送设备MAC地址、校验信息、接收设备MAC地址","校验信息、发送设备MAC地址、接收设备MAC地址","接收设备MAC地址、发送设备MAC地址、校验信息"],"a":"A","e":"局域网采用分组交换技术，发送设备必须把要传输的数据分成小块，即帧，一次只能传输一帧。数据帧中除了包含需要传输的数据（称之为“有效载荷”）之外，还必须包含发送该数据帧的发送设备地址和接收该数据帧的接收设备地址。另外数据帧中还需要附加一些信息随同数据一起进行传输，包括控制信息和校验信息，以供接收设备在收到数据之后验证数据传输是否正确。这些信息包括控制信息和校验信息。故本题选择A。","code":0},{"id":"364","paper":"真考试卷10","no":4,"type":"单项选择题","q":"通常嵌入式系统对实时性和可靠性都有一定要求，如果把ATM柜员机和数码相机两者进行比较，它们中对实时性和可靠性要求较高的分别是（  ）。","o":["ATM柜员机、数码相机","数码相机、ATM柜员机","ATM柜员机、ATM柜员机","数码相机、数码相机"],"a":"B","e":"嵌入式系统按实时性要求可分为非实时系统，软实时系统和硬实时系统。选项中对实时性要求较高的是数码相机，对可靠性要求较高的是ATM柜员机。故本题选择B。","code":0},{"id":"365","paper":"真考试卷10","no":5,"type":"单项选择题","q":"关于处理器内核说法正确的是（  ）。","o":["51内核是RISC指令集结构","AVR内核是CISC指令集结构","MSP430内核采用冯.诺依曼结构","所有ARM内核均采用哈佛结构"],"a":"C","e":"嵌入式处理器的体系结构按指令集可分为两大类：复杂指令集结构（CISC）及精简指令集结构（RISC）；按存储机制分为冯·诺依曼结构及哈佛结构；按不同内核系列可分为51、AVR、MSP430、MIPS、PowerPC、MC68K、ARM等。其中，PowerPC、MC68K、MIPS采用RISC、哈佛结构，ARM也采用RISC，多数为哈佛结构。故本题选择C。","code":0},{"id":"366","paper":"真考试卷10","no":6,"type":"单项选择题","q":"关于ARM Cortex-M处理器的特点，以下说法错误的是（  ）。","o":["功能强","耗电少","RISC结构","多周期操作"],"a":"D","e":"Cortex-M系列是面向微控制器的处理器核，极高性价比、最低成本、极低功耗；具有处理速度快、代码密度高、软件可移植性好的特点。故本题选择D","code":0},{"id":"367","paper":"真考试卷10","no":7,"type":"单项选择题","q":"以下ARM处理器，只有Thumb-2状态和调试状态的是（  ）。","o":["ARM7","ARM9","ARM11","ARM Cortex-M3"],"a":"D","e":"在ARM的体系结构中，处理器可以工作在3种不同的状态：①ARM状态②Thumb状态及Thumb-2状态③调试状态。其中，除支持Thumb-2的ARM处理器外，其他所有ARM处理器都可以工作在ARM状态，而Cortex-M3只有Thumb-2状态和调试状态。故本题选择D。","code":0},{"id":"368","paper":"真考试卷10","no":8,"type":"单项选择题","q":"已知内存单元0x60000000~0x60000003以小端模式存放一个32位数据0x32303134,R1=0x60000000,R0=0,执行ARM指令LDRH R0,［R1］之后，R0的值为（  ）。","o":["0x32303134","0x00003230","0x00003134","0x00000032"],"a":"C","e":"所谓小端模式，是指数据字的高位保存在内存的高地址中，而数据字的低位保存在内存的低地址；指令LDRH R0,［R1］是寄存器间接寻址，将R1的内容形成操作数的有效地址，从中取得半字数据存入寄存器R0中。故本题选择C。","code":0},{"id":"369","paper":"真考试卷10","no":9,"type":"单项选择题","q":"已知R1=8，R0=9，执行指令MOV R0,R1,LSR#3后，R0的值为（  ）。","o":["1","8","0x10","0x80"],"a":"A","e":"题中指令为将R1逻辑右移3位之后存到R0中，左端用0来补充。故本题选择A。","code":0},{"id":"370","paper":"真考试卷10","no":10,"type":"单项选择题","q":"对于ARM处理器以下不属于逻辑运算指令助记符的是（  ）。","o":["AND","BIC","EOR","SBC"],"a":"D","e":"ARM指令集中，SBC是带借位减法指令，是算术运算指令，不属于逻辑运算助记符。故本题选择D。","code":0},{"id":"371","paper":"真考试卷10","no":11,"type":"单项选择题","q":"关于ARM处理器的工作模式，以下说法错误的是（  ）。","o":["用户模式是程序正常执行的工作模式","管理模式负责处理存储器故障，实现虚拟存储器和存储器的保护","系统模式运行特权级的操作系统任务","当处理器处于用户模式时，如果没有异常发生是不能改变工作模式的"],"a":"B","e":"ARM体系结构支持7种工作模式，取决于当前程序状态寄存器CPSR的低5位值。用户模式是程序正常执行工作模式，当处理器处于用户模式时，如果没有异常发生不能改变工作模式；系统模式运行特权级的操作系统任务；管理模式是操作系统的保护模式，处理软中断。故本题选择B。","code":0},{"id":"372","paper":"真考试卷10","no":12,"type":"单项选择题","q":"以下关于ARM状态寄存器CPSR的说法正确的是（  ）。","o":["CPSR决定存储器的数据类型和存储模式","CPSR中I为快速中断禁止控制位","CPSR中的T为陷井标志","CPSR决定ARM处理器工作模式"],"a":"D","e":"CPSR是保存处理器的运行状态（如工作模式、中断使能、状态位等），和存储器的数据类型、存储模式（大端 / 小端）没有关系。存储模式通常由硬件配置或系统控制寄存器决定，不由CPSR 控制，A选项说法错误；在 ARM 的 CPSR 中，I 位是普通中断（IRQ）禁止位，当 I=1 时，禁止 IRQ 中断；F 位是快速中断（FIQ）禁止位，当 F=1 时，禁止 FIQ 中断，B选项说法错误；CPSR 中的T 位是Thumb 状态控制位，T=0时处理器处于 ARM 状态（执行 32 位 ARM 指令）；T=1时处理器处于Thumb 状态（执行 16 位 Thumb 指令）。它和 “陷阱标志” 没有任何关系，陷阱标志通常是其他架构（如 x86）中的概念，ARM 中没有对应的定义，C选项说法错误；CPSR可以决定 ARM 处理器的7 种工作模式： 用户模式（User）管理模式（Supervisor，复位 / 异常默认模式）<\/LI> 、中止模式（Abort）、未定义模式（Undefined）、外部中断模式（IRQ）和快速中断模式（FIQ），D选项说法正确；故本题答案为D选项。","code":0},{"id":"373","paper":"真考试卷10","no":13,"type":"单项选择题","q":"下面是关于ARM嵌入式芯片中的GPIO的叙述，其中错误的是（  ）。","o":["GPIO即通用输入/输出端口","GPIO作为输入时具有缓冲功能","GPIO作为输出时具有锁存功能","GPIO引脚可以是多功能的，但引脚功能不能超过两种"],"a":"D","e":"GPIO即通用输入/输出端口，作为输入时具有缓冲功能，作为输出时具有锁存功能；引脚可以是多功能，也可以是两功能，还可以是三功能和四功能的。故本题选择D。","code":0},{"id":"374","paper":"真考试卷10","no":14,"type":"单项选择题","q":"下下面是关于ARM处理器芯片内部的定时计数组件的叙述，其中错误的是（  ）。","o":["ARM处理芯片内部的定时计数组件中包含通用定时器（Timer）","ARM处理芯片内部的定时计数组件中一般只包含一路脉冲宽度调制信号（PWM）","ARM处理芯片内部的看门狗定时器（WDT）的主要功能是，当处理器进入错误状态后的一定时间内可使处理器复位","ARM处理芯片内部的实时时钟（RTC）可直接提供年月日时分秒，使应用系统具有自己独立的日期和时间"],"a":"B","e":"ARM处理芯片内部有多个定时计数组件，包含WDT、通用定时器（Timer）、RTC、PWM；看门狗定时器（WDT）的主要功能是，当处理器进入错误状态后的一定时间内可使处理器复位；处理芯片内部的实时时钟（RTC）可直接提供年月日时分秒，使应用系统具有自己独立的日期和时间。将故本题选择B。","code":0},{"id":"375","paper":"真考试卷10","no":15,"type":"单项选择题","q":"下面关于嵌入式系统使用的存储器的叙述中，错误的是（  ）。","o":["DRAM是动态随机存取存储器","DDR2 SDRAM采用了4位预取技术","EEPROM是紫外线可擦除可编程的只读存储器","NOR Flash和NAND Flash是两种主要的闪存技术"],"a":"C","e":"DRAM是动态随机存取存储器，是易失性存储器；DDR2 SDRAM（双倍数据速率同步DRAM）采用了4位预取技术；EEPROM是一种可电擦除可编程的只读存储器，可以在线改写和擦除信息，无需紫外线照射；NOR Flash和NAND Flash是两种主要的闪存技术。故本题选择C。","code":0},{"id":"376","paper":"真考试卷10","no":16,"type":"单项选择题","q":"下面关于嵌入式最小硬件系统的叙述中，错误的是（  ）。","o":["可使用LDO为嵌入式最小系统供电，LDO是指低压差稳压器","时钟电路为嵌入式最小系统中的嵌入式处理器提供工作时需要的时钟信号","如果处理器内嵌的存储器能满足嵌入式最小系统的应用需要，则系统无需扩展外部存储器","嵌入式最小系统包括复位电路，嵌入式处理器的复位引脚为nRESET时，表示高电平复位"],"a":"D","e":"提供嵌入式处理器运行必备条件的硬件电路与嵌入式处理器共同构成嵌入式最小硬件系统，可使用LDO为嵌入式最小系统供电，LDO是指低压差稳压器；时钟电路为嵌入式最小系统的嵌入式处理器提供工作时需要时钟信号；如果处理器内嵌Flash程序存储器容量足够，则无需扩展外部存储器；嵌入式最小系统包括复位电路，嵌入式处理器的复位引脚为nRESET时，表示低电平复位。故本题选择D。","code":0},{"id":"377","paper":"真考试卷10","no":17,"type":"单项选择题","q":"基于ARM内核的嵌入式芯片是以ARM内核为基础，通过AMBA总线将其他硬件组件连接在一起的，下面列出的4个组件中，哪一个组件是挂在AMBA的系统总线上的？","o":["电源管理及时钟控制器","SPI","GPIO","UART"],"a":"A","e":"AMBA是指先进的微控制器总线体系结构，主要由系统总线和外围总线两部分组成。速度不高的外部接口连接外围总线（APB），包括定时器、并行接口和串行接口等；而电源管理及时钟控制器等都连接在系统总线上。故本题选择A。","code":0},{"id":"378","paper":"真考试卷10","no":18,"type":"单项选择题","q":"下面是关于ARM嵌入式芯片中的中断控制器及向量中断控制器（VIC）和嵌套向量中断控制器（NVIC）的叙述，其中错误的是（  ）。","o":["只有当一个新的中断的优先级高于当前正在执行的中断处理的优先级时，VIC才向内核提出中断请求","NVIC可以进行中断的嵌套，即高优先级的中断可以进入低优先级中断的处理过程中，待高优先级中断处理完成后才继续执行低优先级中断","目前基于ARM内核的嵌入式芯片中的中断控制器仅支持向量中断","基于ARM内核的嵌入式芯片中的中断控制器挂在AMBA的系统总线上"],"a":"C","e":"基于ARM内核的嵌入式芯片中的中断控制器挂在AMBA的系统总线上；只有当一个新的中断的优先级高于当前正在执行的中断处理的优先级时，VIC才向内核提出中断请求；NVIC可以进行中断的嵌套，即高优先级的中断可以进入低优先级中断的处理过程中，待高优先级中断处理完成后才继续执行低优先级中断；目前基于ARM内核的嵌入式芯片中的中断控制器一般采用向量中断和嵌套向量中断方式管理中断。故本题选择C。","code":0},{"id":"379","paper":"真考试卷10","no":19,"type":"单项选择题","q":"下面关于嵌入式系统的存储器的叙述中，错误的是（  ）。","o":["嵌入式处理器内部的Cache存储器采用SRAM","嵌入式系统的主存储器是指嵌入式处理器内部的存储器","Flash存储器是嵌入式系统常用的一种存储器","嵌入式系统使用的CF卡、SD卡等是嵌入式系统的外部存储器"],"a":"B","e":"嵌入式系统的主存储器是指系统内存，包括内部SRAM和Flash和片外扩展DRAM和Flash。故本题选择B。","code":0},{"id":"380","paper":"真考试卷10","no":20,"type":"单项选择题","q":"下面关于I<SUP>2<\/SUP>C总线接口的叙述中，错误的是（  ）。","o":["I<SUP>2<\/SUP>C是一种串行半双工传输的总线标准","主动发起数据传输操作的I<SUP>2<\/SUP>C器件是主控器件（主器件）","I<SUP>2<\/SUP>C总线传输操作启动后，主控器件传输的第一个字节是地址","当挂在I<SUP>2<\/SUP>C总线上的所有器件都不使用总线时，总线的SCL线和SDA线均为低电平"],"a":"D","e":"I<SUP>2<\/SUP>C总线只有两条信号线SDA和SCL，当总线上的所有器件都不适用总线时，SCL线和SDA线各自的上拉电阻把电平拉高，使它们均处于高电平。故本题选择D。","code":0},{"id":"381","paper":"真考试卷10","no":21,"type":"单项选择题","q":"下面关于USB的叙述中，错误的是（  ）。","o":["USB 3.0的最大数据传输速率为5Gbps","采用USB OTG可以在无USB主机（Host）的情况下，实现嵌入式设备之间的点对点通信","通过USB 2.0接口的D+和D-两条数据线可以实现全双工通信","USB主机接口具有内置电源，能提供+5V电源"],"a":"C","e":"通用串行总线USB是一种外部总线接口标准，支持设备的即插即用和热插拨功能；USB总线（1.1和2.0）有4根信号线，采用半双工差分方式，用来传送信号并提供电源；其中D+和D-为差分信号线，传送信号。故本题选择C。","code":0},{"id":"382","paper":"真考试卷10","no":22,"type":"单项选择题","q":"下面是关于S3C2410的GPIO端口的叙述，其中错误的是（  ）。","o":["S3C2410有GPA、GPB、GPC、GPD、GPE、GPF、GPG和GPH这8个GPIO端口，它们都是双功能的I/O端口","与S3C2410某个GPIO端口对应的控制寄存器决定该端口引脚的功能","与S3C2410某个GPIO端口对应的数据寄存器存放该端口输入的数据或输出的数据","与S3C2410某个GPIO端口对应的上拉寄存器决定该端口引脚是否要被内部上拉"],"a":"A","e":"S3C2410有GPA、GPB、GPC、GPD、GPE、GPF、GPG和GPH这8个GPIO端口，其中GPA0~GPA22功能单一，仅作为地址线的控制线使用；GPC和GPD作为LCD液晶屏接口引脚。故本题选择A。","code":0},{"id":"383","paper":"真考试卷10","no":23,"type":"单项选择题","q":"下面关于RS-232和RS-485的叙述中，正确的是（  ）。","o":["RS-485采用负逻辑传输：+3V~+15V时为逻辑0，-15V~-3V时为逻辑1","RS-232采用差分信号传输方式","RS-485的传输距离比RS-232远","RS-232的传输速率比RS-485高"],"a":"C","e":"RS-232采用负逻辑传输，而RS-485采用差分信号传输方式；RS-485的传输距离比RS-232远，抗干扰能力强。故本题选择C。","code":0},{"id":"384","paper":"真考试卷10","no":24,"type":"单项选择题","q":"在Bootloader中，一般不会出现在stage 2的操作是（  ）。","o":["调用内核代码。","处理器内部的基本寄存器设置、系统基本参数设置、时钟初始化。","向操作系统内核传递启动参数。","将内核代码和根文件系统映像从ＲＯＭ存储器复制到ＲＡＭ存储器。"],"a":"B","e":"由于Bootloader的实现依赖于CPU的体系结构，因此大多数Bootloader都分为两个阶段。依赖于CPU的体系结构的代码通常都放在阶段1中，处理器内部的基本寄存器设置、系统基本参数设置、时钟初始化往往也是在第一阶段完成；阶段2通常用C语言来实现。故本题选择B。","code":0},{"id":"385","paper":"真考试卷10","no":25,"type":"单项选择题","q":"当满足一定条件时，μC/OS-II操作系统内核将进行任务级的调度。下列各项中不属于任务调度需满足的条件的是（  ）。","o":["调度没有被禁止（OSLockNesting=0）。","任务就绪表中查找到的最高优先级任务的优先级比当前运行任务的优先级高。","所有的中断服务程序均已经执行完毕。","有足够的内存空间保存当前任务的上下文。"],"a":"D","e":"μC/OS-II操作系统内核进行任务级的调度有三个条件：①所有的中断服务程序均已经执行完毕②调度没有被禁止③任务就绪表中查找到的最高优先级任务的优先级比当前运行任务的优先级高。故本题选择D","code":0},{"id":"386","paper":"真考试卷10","no":26,"type":"单项选择题","q":"下列各项中，不属于实时操作系统应该具备的特征的是（  ）。","o":["任务切换时间和中断延迟时间确定。","支持网络协议栈。","抢占式调度。","具有异步IO和中断处理能力。"],"a":"B","e":"IEEE的实时UNIX分委会认为实时操作系统应该具备7个特征：①具有异步I/O和中断处理能力;②任务切换时间和中断延迟时间确定;③优先级中断和调度;④抢占式调度;⑤内存锁定;⑥连续文件;⑦同步。故本题选择B。","code":0},{"id":"387","paper":"真考试卷10","no":27,"type":"单项选择题","q":"如下关于Android操作系统的说法，正确的是（  ）。","o":["是以Unix为基础改造而成的操作系统","主要用于桌面计算设备","是针对特定应用领域的完整的软件平台，由操作系统、中间件和若干典型的移动应用软件组成","谷歌公司对基于Android操作系统的第三方软件进行严格把关"],"a":"C","e":"Android（安卓）是一种以Linux为基础的半开放源代码操作系统，主要使用于移动便携设备；是针对特定应用领域的完整的软件平台，由操作系统、中间件和若干典型的移动应用软件；谷歌公司不对基于Android操作系统的第三方软件进行严格控制，从而促使第三方应用软件发展迅速。故本题选择C。","code":0},{"id":"388","paper":"真考试卷10","no":28,"type":"单项选择题","q":"如下关于自由软件的说法，不正确的是（  ）。","o":["自由软件就是免费软件","大部分自由软件通过互联网发布且不收取任何费用。","自由软件必定是开源软件。","Linux遵从GPL授权许可。"],"a":"A","e":"自由软件是一种可以不受限制地自由使用、复制、研究、修改和分发的软件，并不代表是免费软件。其中Linux遵从GPL授权许可；大部分自由软件通过互联网发布且不收取任何费用。故本题选择A。","code":0},{"id":"389","paper":"真考试卷10","no":29,"type":"单项选择题","q":"以下关于嵌入式系统软件与通用计算机系统软件的异同的陈述中，正确的是（  ）。","o":["嵌入式系统软件不会有图形用户界面","嵌入式系统软件和通用计算机系统软件都必须包含操作系统和应用软件","嵌入式系统软件以提高系统使用的方便程度和快捷程度为目的，力求完善","嵌入式系统应用软件往往内部结构精简化、代码轻量化、占用存储资源少"],"a":"D","e":"通用计算机的软件系统无疑是以操作系统为核心，不可或缺。但是嵌入式系统具有功能专用性，有些情况下可以不用操作系统。特别是低端嵌入式系统功能单一，使用循环程序作为主控程序就能够满足使用需要，所以大多数低端嵌入式系统不用操作系统；通常嵌入式系统的软件配备没有通用系统多；嵌入式系统软件和通用计算机系统软件都可以实现图形用户界面，嵌入式系统应用软件具有内部结构精简化、代码轻量化、占用存储资源少等特点。故本题选择D。","code":0},{"id":"390","paper":"真考试卷10","no":30,"type":"单项选择题","q":"现为某家用小型路由器设备选择网络功能强大的操作系统，希望尽可能降低成本并满足系统功能需求。以下嵌入式操作系统中，最适宜采用的操作系统是（  ）。","o":["Windows Phone 8","TinyOS","嵌入式Linux","VxWorks"],"a":"C","e":"嵌入式Linux这种方式的优点是成本低、内核版本更新及时，之后Linux引入了很多有利于嵌入式应用的特性，例如抢占式内核、高效的进程调度算法、可移植性提高、对大容量内存的支持、支持不带MMU的微控制器和I/O系统的改进等，更适合在嵌入式环境中使用，故本题选择C。","code":0},{"id":"391","paper":"真考试卷10","no":31,"type":"单项选择题","q":"在μC/OS-II操作系统中有多种方法可以保护任务间的共享数据并支持任务之间的通信。下列各项中不能用于保护任务间的共享数据或支持任务间通信的是（  ）。","o":["消息邮箱","任务就绪表","信号量","任务调度器上锁和解锁。"],"a":"B","e":"在μC/OS-II操作系统中有多种方法可以保护任务间的共享数据并支持任务之间的通信。主要有以下三种：（1）利用宏OS_ENTER_CRITICAL( )和OS_EXIT_CRITICAL( )来关闭中断和打开中断；（2）利用函数OSSchedLock( )和OSSchekUnlock( )对μC/OS-II中的任务调度函数上锁和开锁；（3）利用信号量（OS_EVENT_TYPE_SEM）、互斥信号量（OS_EVENT_TYPE_MUTEX）、邮箱（OS_EVENT_TYPE_MBOX）或消息队列（OS_EVENT_TYPE_Q）进行任务间通信。故本题选择B。","code":0},{"id":"392","paper":"真考试卷10","no":32,"type":"单项选择题","q":"下列关于μC/OS-II操作系统的描述中，正确的是（  ）。","o":["就绪态是指得到了CPU的控制权并正在运行的任务所处的状态","在进入临界区之前必须开中断，执行完临界区代码之后要立即关中断。","μC/OS-II完成任务切换所需要的时间取决于任务的自用栈的大小。","任务控制块TCB是用于保存任务状态和属性的数据结构，在任务创建时被初始化。"],"a":"D","e":"就绪态意味着该任务已经准备好，可以运行了，但由于该任务的优先级比正在运行的任务的优先级低，暂时还不能运行；为确保临界区代码的执行，在进入临界区之前必须关中断，执行完临界区代码之后要立即开中断；完成任务切换所需要的时间取决于CPU有多少寄存器要入栈。故本题选择D。","code":0},{"id":"393","paper":"真考试卷10","no":33,"type":"单项选择题","q":"下面关于嵌入式系统软件的描述中，正确的是（  ）。","o":["Nios II是一种免费和开源的实时操作系统。","U-Boot是一种应用非常普遍的引导加载程序。","RTEMS是一种嵌入式Linux操作系统发行版。","Windows Embedded系列产品是专为需要弹性硬件和硬实时支持的小型设备而设计的平台。"],"a":"B","e":"Nios II并非是免费和开源的；RTEMS为实时多处理器系统(Real Time Executive for Multiprocessor Systems)是一个开源的无版税实时嵌入操作系统RTOS，而并非Linux的发行版；Windows Embedded也只是普通实时嵌入式操作系统。故本题选择B。","code":0},{"id":"394","paper":"真考试卷10","no":34,"type":"单项选择题","q":"μC/OS-II操作系统的内核非常小，其提供的基本功能中，不包括（  ）。","o":["文件系统","任务间通信与同步","时间管理","内存管理"],"a":"A","e":"可以认为μC/OS-II是嵌入式操作系统领域中的最小内核之一，它只提供提供的基本功能有：①任务调度②任务间通信（Inter-Task Communication, ITC。术语ITC含义与IPC含义相当）③同步④任务管理⑤时间管理⑥内存管理等基本功能。故本题选择A。","code":0},{"id":"395","paper":"真考试卷10","no":35,"type":"单项选择题","q":"下列各嵌入式操作系统中，公开源码的是（  ）。","o":["Windows Phone 8","iOS","QNX","μC/OS-II"],"a":"D","e":"μC/OS-II、RTLinux、ECOS等是主要的开源嵌入式操作系统。故本题选择D。","code":0},{"id":"396","paper":"真考试卷10","no":36,"type":"单项选择题","q":"以下各项陈述中，不属于微内核操作系统特点的是（  ）。","o":["内核小巧。","系统花在内核功能切换上的开销非常小。","开发和维护方便，系统可以动态更新服务模块。","可靠性高。"],"a":"B","e":"微内核有以下几个特点：①内核小巧②接口一致③各个功能模块之间松散耦合，只完成服务功能，系统管理功能交给一个或多个特权服务程序。④微内核功能扩充方便，但是各个功能之间的切换而引起的开销比较大。⑤基于客户机/服务器体系结构，在微内核结构的操作系统中，任务间通信机制—消息机制是系统的基础，操作系统的各种功能都以服务器方式实现，向客户机提供服务。故本题选择B。","code":0},{"id":"397","paper":"真考试卷10","no":37,"type":"单项选择题","q":"某型号飞机内有一块嵌入式控制板完成复杂的硬实时控制功能，以下嵌入式操作系统中，最适宜采用的操作系统是（  ）。","o":["iOS","VxWorks","TinyOS","嵌入式Linux"],"a":"B","e":"VxWorks是目前公认为实时性最强、可靠性最高的一种嵌入式实时操作系统。VxWorks操作系统在航空航天、通信和国防领域具有广泛的应用。故本题选择B。","code":0},{"id":"398","paper":"真考试卷10","no":38,"type":"单项选择题","q":"下面关于Linux操作系统的论述中，正确的是（  ）。","o":["Linux是能够为多用户提供多任务功能的微内核操作系统","eCOS是一种嵌入式Linux操作系统发行版","安卓是一种以Linux为基础的操作系统","Linux内核通过系统调用接口访问系统硬件"],"a":"C","e":"嵌入式Linux、Android OS等操作系统是典型的单内核操作系统；Android（安卓）是一种以Linux为基础的半开放源代码操作系统，主要使用于移动便携设备；eCos是RedHat公司开发的源代码开放的嵌入式RTOS产品，是一个可配置、可移植的嵌入式实时操作系统；系统调用是Linux中用户进程与操作系统之间的重要接口。故本题选择C。","code":0},{"id":"399","paper":"真考试卷10","no":39,"type":"单项选择题","q":"下面的描述语句中不正确的是（  ）。","o":["在嵌入式系统开发中，不同复杂程度的嵌入式系统，使用的调试工具不完全相同。","嵌入式系统开发时，所采用的调试工具，其任务是控制程序代码的执行并使系统中看不见的信息成为可见。","对嵌入式系统进行调试时，硬件部分的调试需要借助JTAG调试工具，不需要借助于“正确”的软件。","在线仿真器是一种嵌入式系统的调试工具，其与所要开发的嵌入式系统应具有相同的嵌入式处理器体系结构。"],"a":"C","e":"使用JTAG进行嵌入式系统的调试，无需目标存储器，也不占用目标机任何I/O端口，运行在宿主机上的调试工具软件通过目标机CPU芯片的JTAG接口以及内嵌的调试电路通常可以完成相关调试工作。故本题选择C。","code":0},{"id":"400","paper":"真考试卷10","no":40,"type":"单项选择题","q":"下面对ADS1.2集成开发环境进行描述的语句中，正确的是（  ）。","o":["ADS1.2集成开发环境中，以一个工程项目的形式来管理应用程序的源文件、库文件、头文件，但不管理其地址映射文件。","ADS1.2集成开发环境中，一个应用程序的工程项目中至少应包含一个生成目标。","ADS1.2集成开发环境中，若生成的输出文件中需要包含所有的调试信息，那么，生成目标应选择Release。","ADS1.2集成开发环境中，对应用程序进行编译、连接时，应使用scatter格式的文件来确定地址映射关系及输入文件的连接顺序。"],"a":"B","e":"CodeWarrior for ARM集成开发环境是ADS 1.2套件中的一个重要组成部分，它的主要功能包括以工程项目的方式来管理源代码文件、库文件以及其他文件；ADS1.2集成开发环境下，一个工程项目中至少应包含一个生成目标，若输出文件需要包含所有调试信息则生成目标应为Debug；当地址映射关系比较复杂时，使用scatter格式的文件来确定输入文件的链接顺序。故本题选择B。","code":0},{"id":"441","paper":"真考试卷11","no":1,"type":"单项选择题","q":"嵌入式系统的应用极其广泛，下列设备：①洗衣机；②电饭煲；③服务器；④平板扫描仪；⑤路由器；⑥机顶盒；⑦巨型机；⑧POS机中，属于嵌入式系统应用的是 （  ）。","o":["除④和⑤之外","除③和⑦之外","除⑤和⑦之外","①～⑧全部都是"],"a":"B","e":"广义上讲，凡是带有微处理器的专用软硬件系统都可称为嵌入式系统。狭义上讲，嵌入式系统强调那些使用嵌入式微处理器构成的具有自己的操作系统和特定功能、用于特定场合的独立系统。嵌入式系统以应用为中心、以计算机技术为基础、软硬件可裁剪、功能、可靠性、成本、体积、功耗严格要求的专用计算机系统。而服务器是网络环境中的高性能计算机，巨型计算机实际上是一个巨大的计算机系统，二者均不属于嵌入式系统。故本题选择B。","code":0},{"id":"442","paper":"真考试卷11","no":2,"type":"单项选择题","q":"嵌入式系统的软件大多存储在非易失性存储器中，即使断电也不会消失。目前嵌入式系统使用最多的非易失性存储器是（  ）。","o":["Mask ROM","Flash memory","SRAM","SSD"],"a":"B","e":"嵌入式存储器也是嵌入式系统硬件的必不可少的组成部分。按照其存取特性可分为随机存取存储器（RAM）和只读存储器（ROM），其中RAM包括静态和动态两种形式，即SRAM和DRAM，他们都是易失性存储器，即掉电后信息丢失；Mask ROM是基于掩膜工艺技术的只读存储器，一旦生产出来信息不可改变，主要用于不可升级的成熟产品存储程序或不变的参数等信息；SSD是固态硬盘的缩写，具有读写速度快、功耗低等优点，但目前售价昂贵，在嵌入式领域应用并不广泛；闪存（Flash Memory）是一种长寿命的非易失性存储器，是近些年应用最广的只读存储器。故本题选择B。","code":0},{"id":"443","paper":"真考试卷11","no":3,"type":"单项选择题","q":"下图是数字信号处理器（DSP）的典型应用方式，其中的①、②和③分别是（  ）。","o":["模拟信号、DSP、数字信号","模拟信号、DSP、模拟信号","数字信号、DSP、数字信号","数字信号、DSP、模拟信号"],"a":"B","e":"数字信号处理器（DSP）是一种专用于数字信号处理的微处理器，它对通用处理器的逻辑结构和指令系统进行了优化设计，使之能更好地满足高速数字信号处理的要求。如图是DSP的典型应用方式，其中传感器采集模拟信号，通过A/D转换器变成数字信号交由DSP进行处理，再经过D/A转换器变成模拟信号输出到显示器进行显示。故本题选择B。","code":0},{"id":"444","paper":"真考试卷11","no":4,"type":"单项选择题","q":"片上系统（或系统级芯片）是目前广泛使用的一种嵌入式处理芯片，下面有关叙述中错误的是（  ）。","o":["其英文缩写是SOC或SoC，它是电子设计自动化水平提高和大规模集成电路制造技术发展的成果","它已成为集成电路设计的发展趋势， 现在许多嵌入式处理芯片都是片上系统","芯片中既包含处理器又包含存储器及外围电路，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能","智能手机已经广泛采用片上系统，平板电脑大多还使用传统的Intel处理器"],"a":"D","e":"片上系统（或系统级芯片），即SOC或SoC，是目前广泛使用的一种嵌入式处理芯片，它是电子设计自动化（EDA）水平提高和大规模集成电路制造技术（VLSI）发展的成果，芯片中既包含处理器又包含存储器及外围电路，单个芯片就能实现数据的采集、转换、存储、处理和I/O等多种功能，目前大多数32位的嵌入式处理芯片均为SOC，包括智能手机和平板电脑，其已经成为集成电路设计的主流发展趋势。故本题选择D。","code":0},{"id":"445","paper":"真考试卷11","no":5,"type":"单项选择题","q":"在嵌入式系统（如数码相机）中，获取数字图像的过程分为四步，如下图所示，正确的处理步骤是（  ）。","o":["取样、扫描、分色、量化","分色、量化、扫描、取样","扫描、分色、取样、量化","扫描、量化、取样、分色"],"a":"C","e":"从现实世界中获得数字图像的过程称为图像的获取，所使用的设备主要有数码相机和扫描仪两种。获取过程的核心是模拟信号的数字化。其处理步骤大致分为4步：扫描，分色，取样，量化。故本题选择C。","code":0},{"id":"446","paper":"真考试卷11","no":6,"type":"单项选择题","q":"数字音频的比特率（码率）指的是每秒钟的数据量，它与取样频率、量化位数、声道数目、使用的压缩编码方法等密切相关。假设数字音频的比特率为32kb/s，其量化位数为8位，单声道，采用压缩编码，压缩比为2，那么取样频率是（  ）。","o":["8 kHz","12 kHz","16 kHz","20 kHz"],"a":"A","e":"数字音频的主要参数包括取样频率、量化位数、声道数目、使用的压缩编码方法以及比特率。数字音频未压缩前，其比特率（码率）的计算公式为：波形声音的码率=取样频率×量化位数×声道数。压缩编码后的码率则为压缩前的码率除以压缩倍数（压缩比）。即：取样频率=码率×压缩比/(量化位数×声道数)=32×2/(8×1)=8kHz，故经计算可知，此题选择A。","code":0},{"id":"447","paper":"真考试卷11","no":7,"type":"单项选择题","q":"微波通信是利用频率为300MHz~300GHz电磁波进行的通信，它具有频带宽、容量大的特性，应用广泛。下面不属于微波通信应用的是（  ）。","o":["手机通信","卫星通信","无线局域网（WiFi）","调频广播（FM）"],"a":"D","e":"微波是一种300MHz~300GHz的电磁波，具有类似光波的特性，在空间主要作直线传播。微波通信的一种途径是借助卫星进行接力通信，即卫星通信；手机通信，即个人移动通信技术是微波通信最具代表性的一种；无线局域网（WiFi）借助无线电波进行数据传输，主要是2.4GHz和5.8GHz两个频段，故也属于微波通信；FM（调频广播）主要是利用短波和超短波进行通信，不属于微波通信。故本题选择D。","code":0},{"id":"448","paper":"真考试卷11","no":8,"type":"单项选择题","q":"计算机局域网传输数据时，必须把数据组织成规定格式的“帧”，每一数据帧由下图所示的5个部分组成,其中①、②、③分别是（  ）。","o":["有效载荷、控制信息、校验信息","控制信息、校验信息、有效载荷","控制信息、有效载荷、校验信息","校验信息、有效载荷、控制信息"],"a":"C","e":"局域网采用分组交换技术，发送设备必须把要传输的数据分成小块，即帧，一次只能传输一帧。数据帧中除了包含需要传输的数据（称之为“有效载荷”）之外，还必须包含发送该数据帧的发送设备地址和接收该数据帧的接收设备地址。另外数据帧中还需要附加一些信息随同数据一起进行传输，以供接收设备在收到数据之后验证数据传输是否正确。这些信息包括控制信息和校验信息。故本题选择C。","code":0},{"id":"449","paper":"真考试卷11","no":9,"type
